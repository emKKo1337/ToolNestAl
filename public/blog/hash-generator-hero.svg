<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <radialGradient id="gL" cx="10%" cy="50%" r="60%"><stop offset="0%" stop-color="#5b21b6" stop-opacity="0.35"/><stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/></radialGradient>
    <radialGradient id="gR" cx="90%" cy="50%" r="60%"><stop offset="0%" stop-color="#0e7490" stop-opacity="0.2"/><stop offset="100%" stop-color="#0e7490" stop-opacity="0"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="bG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient>
    <linearGradient id="lapG" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1a1040"/><stop offset="100%" stop-color="#0d0824"/></linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#5b21b6" flood-opacity="0.45"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <ellipse cx="120" cy="337" rx="700" ry="550" fill="url(#gL)"/>
  <ellipse cx="1080" cy="337" rx="700" ry="550" fill="url(#gR)"/>

  <text x="600" y="42" text-anchor="middle" font-size="13" font-weight="700" fill="url(#aG)" filter="url(#glow)">ToolNest AI — Developer Tools</text>
  <text x="600" y="68" text-anchor="middle" font-size="34" font-weight="900" fill="url(#aG)" filter="url(#glow)">Hash Generator</text>
  <text x="600" y="90" text-anchor="middle" font-size="13" fill="rgba(255,255,255,0.35)">MD5 · SHA-1 · SHA-256 · SHA-512 — Text and file hashing, free, client-side</text>

  <rect x="60" y="108" width="1080" height="542" rx="18" fill="url(#lapG)" stroke="rgba(124,58,237,0.35)" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="60" y="108" width="1080" height="38" rx="18" fill="rgba(255,255,255,0.05)"/>
  <rect x="60" y="128" width="1080" height="18" fill="rgba(255,255,255,0.02)"/>
  <circle cx="90" cy="127" r="7" fill="rgba(239,68,68,0.65)"/>
  <circle cx="114" cy="127" r="7" fill="rgba(251,191,36,0.65)"/>
  <circle cx="138" cy="127" r="7" fill="rgba(34,197,94,0.65)"/>
  <text x="600" y="132" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.2)">toolnestai.net/developer-tools/hash-generator</text>

  <!-- Mode tabs -->
  <g font-size="10" text-anchor="middle">
    <rect x="80" y="158" width="78" height="26" rx="6" fill="url(#bG)"/>
    <text x="119" y="175" fill="#fff" font-weight="700">Text</text>
    <rect x="164" y="158" width="78" height="26" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="203" y="175" fill="rgba(255,255,255,0.4)">File</text>
    <rect x="248" y="158" width="118" height="26" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="307" y="175" fill="rgba(255,255,255,0.4)">Compare Hashes</text>
  </g>

  <!-- Input -->
  <text x="88" y="204" font-size="9" font-weight="700" fill="rgba(255,255,255,0.28)">INPUT TEXT</text>
  <rect x="80" y="210" width="680" height="46" rx="9" fill="rgba(0,0,0,0.55)" stroke="rgba(124,58,237,0.45)" stroke-width="1.5"/>
  <text x="98" y="238" font-family="monospace" font-size="13" fill="rgba(255,255,255,0.8)">The quick brown fox jumps over the lazy dog</text>

  <!-- Hash results -->
  <text x="88" y="278" font-size="9" font-weight="700" fill="rgba(255,255,255,0.28)">MD5 — 128 bits</text>
  <rect x="80" y="284" width="680" height="30" rx="6" fill="rgba(239,68,68,0.06)" stroke="rgba(239,68,68,0.2)" stroke-width="1"/>
  <text x="96" y="303" font-family="monospace" font-size="11" fill="rgba(252,165,165,0.85)">9e107d9d372bb6826bd81d3542a419d6</text>
  <rect x="712" y="288" width="38" height="22" rx="5" fill="rgba(239,68,68,0.12)" stroke="rgba(239,68,68,0.25)" stroke-width="1"/>
  <text x="731" y="303" text-anchor="middle" font-size="8" fill="rgba(252,165,165,0.75)">Copy</text>

  <text x="88" y="332" font-size="9" font-weight="700" fill="rgba(255,255,255,0.28)">SHA-1 — 160 bits</text>
  <rect x="80" y="338" width="680" height="30" rx="6" fill="rgba(251,191,36,0.06)" stroke="rgba(251,191,36,0.2)" stroke-width="1"/>
  <text x="96" y="357" font-family="monospace" font-size="11" fill="rgba(253,224,71,0.85)">2fd4e1c67a2d28fced849ee1bb76e7391b93eb12</text>
  <rect x="712" y="342" width="38" height="22" rx="5" fill="rgba(251,191,36,0.12)" stroke="rgba(251,191,36,0.25)" stroke-width="1"/>
  <text x="731" y="357" text-anchor="middle" font-size="8" fill="rgba(253,224,71,0.75)">Copy</text>

  <text x="88" y="386" font-size="9" font-weight="700" fill="rgba(255,255,255,0.28)">SHA-256 — 256 bits (recommended default)</text>
  <rect x="80" y="392" width="680" height="46" rx="6" fill="rgba(52,211,153,0.06)" stroke="rgba(52,211,153,0.22)" stroke-width="1"/>
  <text x="96" y="411" font-family="monospace" font-size="10.5" fill="rgba(110,231,183,0.85)">d7a8fbb307d7809469ca9abcb0082e4f8d5651e46d3cdb</text>
  <text x="96" y="428" font-family="monospace" font-size="10.5" fill="rgba(110,231,183,0.85)">762d02d0bf37c9e592</text>
  <rect x="712" y="404" width="38" height="22" rx="5" fill="rgba(52,211,153,0.12)" stroke="rgba(52,211,153,0.25)" stroke-width="1"/>
  <text x="731" y="419" text-anchor="middle" font-size="8" fill="rgba(110,231,183,0.75)">Copy</text>

  <text x="88" y="462" font-size="9" font-weight="700" fill="rgba(255,255,255,0.28)">SHA-512 — 512 bits</text>
  <rect x="80" y="468" width="680" height="60" rx="6" fill="rgba(103,232,249,0.06)" stroke="rgba(103,232,249,0.22)" stroke-width="1"/>
  <text x="96" y="486" font-family="monospace" font-size="9.5" fill="rgba(103,232,249,0.85)">07e547d9586f6a73f73fbac0435ed76951218fb7d0c8d788a</text>
  <text x="96" y="500" font-family="monospace" font-size="9.5" fill="rgba(103,232,249,0.85)">309d785436bbb642e93a252a954f23912547d1e8a3b5ed6</text>
  <text x="96" y="514" font-family="monospace" font-size="9.5" fill="rgba(103,232,249,0.85)">e1bfd7097821233fa0538f3db854fee6</text>

  <!-- Right panel: algorithm comparison -->
  <rect x="780" y="158" width="340" height="380" rx="12" fill="rgba(255,255,255,0.025)" stroke="rgba(124,58,237,0.18)" stroke-width="1"/>
  <text x="950" y="182" text-anchor="middle" font-size="11" font-weight="700" fill="rgba(255,255,255,0.5)">Which Algorithm Should I Use?</text>

  <g font-size="9">
    <rect x="796" y="196" width="308" height="78" rx="6" fill="rgba(239,68,68,0.06)" stroke="rgba(239,68,68,0.18)" stroke-width="1"/>
    <text x="808" y="214" font-weight="700" fill="#fca5a5">MD5 — Broken. Checksums only.</text>
    <text x="808" y="230" fill="rgba(255,255,255,0.5)">Collisions found in 2004. Never use</text>
    <text x="808" y="244" fill="rgba(255,255,255,0.5)">for passwords or security. Fine for</text>
    <text x="808" y="258" fill="rgba(255,255,255,0.5)">detecting accidental file corruption.</text>

    <rect x="796" y="280" width="308" height="70" rx="6" fill="rgba(251,191,36,0.07)" stroke="rgba(251,191,36,0.18)" stroke-width="1"/>
    <text x="808" y="298" font-weight="700" fill="#fde047">SHA-1 — Deprecated for security.</text>
    <text x="808" y="314" fill="rgba(255,255,255,0.5)">Collision demonstrated in 2017.</text>
    <text x="808" y="328" fill="rgba(255,255,255,0.5)">Still seen in Git commit hashes.</text>

    <rect x="796" y="356" width="308" height="70" rx="6" fill="rgba(52,211,153,0.07)" stroke="rgba(52,211,153,0.18)" stroke-width="1"/>
    <text x="808" y="374" font-weight="700" fill="#6ee7b7">SHA-256 — Recommended default.</text>
    <text x="808" y="390" fill="rgba(255,255,255,0.5)">No known practical attacks.</text>
    <text x="808" y="404" fill="rgba(255,255,255,0.5)">Used in Bitcoin, TLS certificates.</text>

    <rect x="796" y="432" width="308" height="70" rx="6" fill="rgba(103,232,249,0.07)" stroke="rgba(103,232,249,0.18)" stroke-width="1"/>
    <text x="808" y="450" font-weight="700" fill="#67e8f9">SHA-512 — Higher security margin.</text>
    <text x="808" y="466" fill="rgba(255,255,255,0.5)">Faster than SHA-256 on 64-bit CPUs.</text>
    <text x="808" y="480" fill="rgba(255,255,255,0.5)">Use when max resistance is needed.</text>
  </g>

  <!-- Stats row -->
  <g text-anchor="middle" font-size="9.5">
    <rect x="80" y="546" width="162" height="54" rx="8" fill="rgba(124,58,237,0.1)" stroke="rgba(124,58,237,0.22)" stroke-width="1"/>
    <text x="161" y="570" font-size="18" font-weight="900" fill="#a78bfa">One-way</text>
    <text x="161" y="588" fill="rgba(255,255,255,0.38)">cannot be reversed</text>

    <rect x="254" y="546" width="162" height="54" rx="8" fill="rgba(14,116,144,0.08)" stroke="rgba(14,116,144,0.2)" stroke-width="1"/>
    <text x="335" y="570" font-size="18" font-weight="900" fill="#67e8f9">Fixed</text>
    <text x="335" y="588" fill="rgba(255,255,255,0.38)">output length always</text>

    <rect x="428" y="546" width="162" height="54" rx="8" fill="rgba(16,185,129,0.07)" stroke="rgba(16,185,129,0.18)" stroke-width="1"/>
    <text x="509" y="570" font-size="18" font-weight="900" fill="#34d399">Deterministic</text>
    <text x="509" y="588" fill="rgba(255,255,255,0.38)">same input, same hash</text>

    <rect x="602" y="546" width="158" height="54" rx="8" fill="rgba(251,191,36,0.07)" stroke="rgba(251,191,36,0.18)" stroke-width="1"/>
    <text x="681" y="570" font-size="18" font-weight="900" fill="#fbbf24">Avalanche</text>
    <text x="681" y="588" fill="rgba(255,255,255,0.38)">1 bit change → ~50%</text>
  </g>

  <rect x="48" y="650" width="1104" height="16" rx="5" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="460" y="664" width="280" height="10" rx="5" fill="rgba(255,255,255,0.025)"/>
</svg>
