  <!-- SECTION 3: The 6 Essential Tags -->
  <rect x="40" y="568" width="820" height="268" rx="16" fill="rgba(255,255,255,0.025)" stroke="rgba(167,139,250,0.18)" stroke-width="1"/>
  <text x="70" y="604" font-size="18" font-weight="800" fill="url(#aG)">03 — 6 Meta Tags Every Page Needs</text>
  <g font-size="9">
    <rect x="58" y="614" width="380" height="96" rx="10" fill="rgba(124,58,237,0.1)" stroke="rgba(167,139,250,0.18)" stroke-width="1"/>
    <text x="76" y="634" font-weight="700" fill="rgba(255,255,255,0.85)">1.  &lt;title&gt; — 50–60 characters</text>
    <text x="76" y="650" fill="rgba(255,255,255,0.45)">Appears in browser tab + Google SERP. Primary keyword near the start.</text>
    <rect x="68" y="656" width="360" height="46" rx="6" fill="url(#cG)" stroke="rgba(124,58,237,0.15)" stroke-width="1"/>
    <text x="78" y="672" font-family="monospace" font-size="7.5" fill="rgba(96,165,250,0.85)">&lt;title&gt;</text><text x="118" y="672" font-family="monospace" font-size="7.5" fill="rgba(167,239,150,0.85)">Best AI Tools 2026 | ToolNest AI</text><text x="320" y="672" font-family="monospace" font-size="7.5" fill="rgba(96,165,250,0.85)">&lt;/title&gt;</text>
    <text x="78" y="691" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.3)">← 47 characters — within the 60-char safe zone</text>

    <rect x="462" y="614" width="380" height="96" rx="10" fill="rgba(37,99,235,0.1)" stroke="rgba(96,165,250,0.18)" stroke-width="1"/>
    <text x="480" y="634" font-weight="700" fill="rgba(255,255,255,0.85)">2.  meta description — 150–160 characters</text>
    <text x="480" y="650" fill="rgba(255,255,255,0.45)">The snippet in search results. Write for humans. Include keyword naturally.</text>
    <rect x="472" y="656" width="360" height="46" rx="6" fill="url(#cG)" stroke="rgba(37,99,235,0.12)" stroke-width="1"/>
    <text x="482" y="670" font-family="monospace" font-size="7.5" fill="rgba(96,165,250,0.85)">&lt;meta name=</text><text x="546" y="670" font-family="monospace" font-size="7.5" fill="rgba(167,239,150,0.85)">"description"</text><text x="617" y="670" font-family="monospace" font-size="7.5" fill="rgba(96,165,250,0.85)"> content=</text>
    <text x="482" y="686" font-family="monospace" font-size="7.5" fill="rgba(167,239,150,0.85)">"Discover the best AI tools for productivity..."</text><text x="750" y="686" font-family="monospace" font-size="7.5" fill="rgba(96,165,250,0.85)">/&gt;</text>

    <rect x="58" y="720" width="380" height="96" rx="10" fill="rgba(16,185,129,0.08)" stroke="rgba(52,211,153,0.18)" stroke-width="1"/>
    <text x="76" y="740" font-weight="700" fill="rgba(255,255,255,0.85)">3.  meta robots — crawl directives</text>
    <text x="76" y="756" fill="rgba(255,255,255,0.45)">Controls indexing. Use "noindex" on thin, duplicate or private pages.</text>
    <rect x="68" y="762" width="360" height="46" rx="6" fill="url(#cG)" stroke="rgba(16,185,129,0.1)" stroke-width="1"/>
    <text x="78" y="778" font-family="monospace" font-size="7.5" fill="rgba(96,165,250,0.85)">&lt;meta name=</text><text x="142" y="778" font-family="monospace" font-size="7.5" fill="rgba(167,239,150,0.85)">"robots"</text><text x="182" y="778" font-family="monospace" font-size="7.5" fill="rgba(96,165,250,0.85)"> content=</text><text x="231" y="778" font-family="monospace" font-size="7.5" fill="rgba(167,239,150,0.85)">"index, follow"</text><text x="309" y="778" font-family="monospace" font-size="7.5" fill="rgba(96,165,250,0.85)">/&gt;</text>
    <text x="78" y="797" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.3)">← default for all public pages</text>

    <rect x="462" y="720" width="380" height="96" rx="10" fill="rgba(245,158,11,0.08)" stroke="rgba(251,191,36,0.18)" stroke-width="1"/>
    <text x="480" y="740" font-weight="700" fill="rgba(255,255,255,0.85)">4.  link canonical — deduplication</text>
    <text x="480" y="756" fill="rgba(255,255,255,0.45)">Prevents duplicate content. Points to the clean, preferred URL of the page.</text>
    <rect x="472" y="762" width="360" height="46" rx="6" fill="url(#cG)" stroke="rgba(245,158,11,0.1)" stroke-width="1"/>
    <text x="482" y="778" font-family="monospace" font-size="7.5" fill="rgba(96,165,250,0.85)">&lt;link rel=</text><text x="534" y="778" font-family="monospace" font-size="7.5" fill="rgba(167,239,150,0.85)">"canonical"</text><text x="591" y="778" font-family="monospace" font-size="7.5" fill="rgba(96,165,250,0.85)"> href=</text>
    <text x="482" y="794" font-family="monospace" font-size="7.5" fill="rgba(167,239,150,0.85)">"https://yoursite.com/page"</text><text x="640" y="794" font-family="monospace" font-size="7.5" fill="rgba(96,165,250,0.85)">/&gt;</text>

    <rect x="58" y="826" width="784" height="30" rx="8" fill="rgba(124,58,237,0.08)" stroke="rgba(167,139,250,0.12)" stroke-width="1"/>
    <text x="76" y="842" font-size="9" fill="rgba(255,255,255,0.55)" font-weight="700">5. Open Graph (og:title, og:description, og:image, og:url)</text>
    <text x="310" y="842" font-size="9" fill="rgba(255,255,255,0.4)"> — controls social share previews on Facebook, LinkedIn, WhatsApp</text>
    <rect x="58" y="862" width="784" height="30" rx="8" fill="rgba(37,99,235,0.08)" stroke="rgba(96,165,250,0.12)" stroke-width="1"/>
    <text x="76" y="878" font-size="9" fill="rgba(255,255,255,0.55)" font-weight="700">6. Twitter Card (twitter:card, twitter:title, twitter:image)</text>
    <text x="328" y="878" font-size="9" fill="rgba(255,255,255,0.4)"> — controls how your page looks when shared on X / Twitter</text>
