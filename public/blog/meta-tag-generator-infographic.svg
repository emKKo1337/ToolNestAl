  <!-- SECTION 1: Why Meta Tags Matter -->
  <rect x="40" y="220" width="820" height="168" rx="16" fill="rgba(255,255,255,0.025)" stroke="rgba(167,139,250,0.18)" stroke-width="1"/>
  <text x="70" y="256" font-size="18" font-weight="800" fill="url(#aG)">01 — Why Meta Tags Still Matter in 2026</text>
  <g font-size="10" fill="rgba(255,255,255,0.45)">
    <text x="70" y="280">• Meta tags are HTML signals that tell search engines and social platforms what your page is about — before they read a single word of content</text>
    <text x="70" y="298">• A well-written title tag and meta description are the #1 factors controlling your click-through rate from search results</text>
    <text x="70" y="316">• Pages with optimized meta tags get up to 5.8× more clicks than pages with missing or auto-generated tags</text>
    <text x="70" y="334">• Open Graph tags determine how your page looks on every social share — a missing og:image means no preview card on LinkedIn, Facebook or WhatsApp</text>
    <text x="70" y="352">• The canonical tag prevents duplicate content issues that split your link equity across multiple URLs</text>
    <text x="70" y="370">• Getting meta tags right costs zero once you use a generator — getting them wrong costs organic traffic indefinitely</text>
  </g>

  <!-- SECTION 2: Key Stats -->
  <rect x="40" y="404" width="820" height="148" rx="16" fill="rgba(255,255,255,0.025)" stroke="rgba(167,139,250,0.18)" stroke-width="1"/>
