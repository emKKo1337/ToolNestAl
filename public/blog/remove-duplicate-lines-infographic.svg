<svg viewBox="0 0 900 1200" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <radialGradient id="gT" cx="50%" cy="10%" r="60%"><stop offset="0%" stop-color="#5b21b6" stop-opacity="0.35"/><stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/></radialGradient>
    <radialGradient id="gB" cx="50%" cy="90%" r="60%"><stop offset="0%" stop-color="#0e7490" stop-opacity="0.2"/><stop offset="100%" stop-color="#0e7490" stop-opacity="0"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="bG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient>
  </defs>
  <rect width="900" height="1200" fill="url(#bg)"/>
  <ellipse cx="450" cy="200" rx="700" ry="400" fill="url(#gT)"/>
  <ellipse cx="450" cy="1000" rx="700" ry="400" fill="url(#gB)"/>

  <text x="450" y="52" text-anchor="middle" font-size="26" font-weight="900" fill="url(#aG)">The Complete Deduplication Guide</text>
  <text x="450" y="76" text-anchor="middle" font-size="13" fill="rgba(255,255,255,0.38)">Removing duplicate lines correctly — algorithm, modes, and edge cases</text>
  <text x="450" y="94" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.22)">toolnestai.net/text-tools/remove-duplicate-lines</text>

  <!-- Section 1 -->
  <rect x="32" y="110" width="836" height="38" rx="8" fill="rgba(124,58,237,0.18)" stroke="rgba(124,58,237,0.3)" stroke-width="1"/>
  <text x="450" y="134" text-anchor="middle" font-size="15" font-weight="800" fill="#a78bfa">01 — How Deduplication Works</text>

  <rect x="32" y="154" width="836" height="90" rx="10" fill="rgba(255,255,255,0.025)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="450" y="178" text-anchor="middle" font-size="12" fill="rgba(255,255,255,0.65)">The text is split into individual lines, then each line is checked against a</text>
  <text x="450" y="198" text-anchor="middle" font-size="12" fill="rgba(255,255,255,0.65)">running set of "seen" values. If a line has already been seen, it's removed from</text>
  <text x="450" y="218" text-anchor="middle" font-size="12" fill="rgba(255,255,255,0.65)">the output; otherwise it's kept and added to the seen set.</text>
  <text x="450" y="238" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.3)">The relative order of remaining unique lines is always preserved.</text>

  <!-- Section 2: Algorithm efficiency -->
  <rect x="32" y="256" width="836" height="38" rx="8" fill="rgba(14,116,144,0.18)" stroke="rgba(14,116,144,0.3)" stroke-width="1"/>
  <text x="450" y="280" text-anchor="middle" font-size="15" font-weight="800" fill="#67e8f9">02 — O(n²) vs O(n) Performance</text>

  <g font-size="10">
    <rect x="32" y="300" width="404" height="100" rx="8" fill="rgba(239,68,68,0.06)" stroke="rgba(239,68,68,0.16)" stroke-width="1"/>
    <text x="48" y="322" font-weight="700" fill="#f87171">✗ Naive nested loop — O(n²)</text>
    <text x="48" y="342" fill="rgba(255,255,255,0.5)">Compares every line to every other line.</text>
    <text x="48" y="358" fill="rgba(255,255,255,0.5)">10,000 lines ≈ 100 million comparisons</text>
    <text x="48" y="384" fill="rgba(255,255,255,0.3)" font-size="8.5">Can freeze the browser on large lists</text>

    <rect x="464" y="300" width="404" height="100" rx="8" fill="rgba(52,211,153,0.06)" stroke="rgba(52,211,153,0.16)" stroke-width="1"/>
    <text x="480" y="322" font-weight="700" fill="#6ee7b7">✓ Hash set — O(n)</text>
    <text x="480" y="342" fill="rgba(255,255,255,0.5)">Each line checked once against a hash set.</text>
    <text x="480" y="358" fill="rgba(255,255,255,0.5)">10,000 lines ≈ 10,000 constant-time lookups</text>
    <text x="480" y="384" fill="rgba(255,255,255,0.3)" font-size="8.5">Scales to millions of lines instantly</text>
  </g>

  <!-- Section 3: Case sensitivity -->
  <rect x="32" y="418" width="836" height="38" rx="8" fill="rgba(16,185,129,0.14)" stroke="rgba(16,185,129,0.25)" stroke-width="1"/>
  <text x="450" y="442" text-anchor="middle" font-size="15" font-weight="800" fill="#34d399">03 — Case-Sensitive vs Insensitive</text>

  <g font-size="10">
    <rect x="32" y="462" width="404" height="90" rx="8" fill="rgba(103,232,249,0.06)" stroke="rgba(103,232,249,0.16)" stroke-width="1"/>
    <text x="234" y="486" text-anchor="middle" font-weight="700" fill="#67e8f9">Case-Sensitive</text>
    <text x="48" y="508" fill="rgba(255,255,255,0.5)">"Apple" ≠ "apple" — kept as 2 lines</text>
    <text x="48" y="528" fill="rgba(255,255,255,0.5)">Use for code, exact IDs, config keys</text>

    <rect x="464" y="462" width="404" height="90" rx="8" fill="rgba(52,211,153,0.06)" stroke="rgba(52,211,153,0.16)" stroke-width="1"/>
    <text x="666" y="486" text-anchor="middle" font-weight="700" fill="#6ee7b7">Case-Insensitive</text>
    <text x="480" y="508" fill="rgba(255,255,255,0.5)">"Apple" = "apple" — merged to 1 line</text>
    <text x="480" y="528" fill="rgba(255,255,255,0.5)">Use for email lists, names, tags</text>
  </g>

  <!-- Section 4: Keep first/last -->
  <rect x="32" y="568" width="836" height="38" rx="8" fill="rgba(124,58,237,0.18)" stroke="rgba(124,58,237,0.3)" stroke-width="1"/>
  <text x="450" y="592" text-anchor="middle" font-size="15" font-weight="800" fill="#a78bfa">04 — Keep First vs Keep Last</text>

  <rect x="32" y="612" width="836" height="80" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="450" y="636" text-anchor="middle" font-size="10.5" fill="rgba(255,255,255,0.6)">Keep First: preserves the original order a value first appeared — good for chronological data</text>
  <text x="450" y="658" text-anchor="middle" font-size="10.5" fill="rgba(255,255,255,0.6)">Keep Last: useful when later entries represent corrected or updated versions of the same key</text>
  <text x="450" y="680" text-anchor="middle" font-size="9.5" fill="rgba(255,255,255,0.3)">Both preserve the relative order of remaining unique lines in the output</text>

  <!-- Section 5: Uses -->
  <rect x="32" y="710" width="836" height="38" rx="8" fill="rgba(14,116,144,0.18)" stroke="rgba(14,116,144,0.3)" stroke-width="1"/>
  <text x="450" y="734" text-anchor="middle" font-size="15" font-weight="800" fill="#67e8f9">05 — Common Uses</text>

  <g font-size="9.5">
    <rect x="32" y="754" width="268" height="80" rx="7" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    <text x="48" y="776" font-weight="700" fill="rgba(167,139,250,0.85)">📧 Email list cleanup</text>
    <text x="48" y="796" fill="rgba(255,255,255,0.5)">Merge signup lists before</text>
    <text x="48" y="810" fill="rgba(255,255,255,0.5)">a newsletter send</text>

    <rect x="314" y="754" width="268" height="80" rx="7" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    <text x="330" y="776" font-weight="700" fill="rgba(103,232,249,0.85)">📊 CSV / data cleanup</text>
    <text x="330" y="796" fill="rgba(255,255,255,0.5)">Remove duplicate rows</text>
    <text x="330" y="810" fill="rgba(255,255,255,0.5)">before database import</text>

    <rect x="596" y="754" width="272" height="80" rx="7" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    <text x="612" y="776" font-weight="700" fill="rgba(52,211,153,0.85)">🖥 Log analysis</text>
    <text x="612" y="796" fill="rgba(255,255,255,0.5)">Find unique IPs or</text>
    <text x="612" y="810" fill="rgba(255,255,255,0.5)">error messages in logs</text>
  </g>

  <!-- Section 6: mistakes -->
  <rect x="32" y="852" width="836" height="38" rx="8" fill="rgba(239,68,68,0.12)" stroke="rgba(239,68,68,0.22)" stroke-width="1"/>
  <text x="450" y="876" text-anchor="middle" font-size="15" font-weight="800" fill="rgba(239,68,68,0.85)">06 — Common Mistakes</text>

  <g font-size="10">
    <rect x="32" y="896" width="836" height="40" rx="7" fill="rgba(255,255,255,0.02)" stroke="rgba(239,68,68,0.1)" stroke-width="1"/>
    <text x="48" y="914" fill="rgba(239,68,68,0.7)">✗</text>
    <text x="68" y="914" fill="rgba(255,255,255,0.6)">Using case-sensitive dedup on human-entered data with inconsistent capitalization</text>
    <text x="68" y="930" fill="rgba(255,255,255,0.4)" font-size="8.5">Leaves "Bob@x.com" and "bob@x.com" as two separate entries.</text>

    <rect x="32" y="940" width="836" height="40" rx="7" fill="rgba(255,255,255,0.02)" stroke="rgba(239,68,68,0.1)" stroke-width="1"/>
    <text x="48" y="958" fill="rgba(239,68,68,0.7)">✗</text>
    <text x="68" y="958" fill="rgba(255,255,255,0.6)">Not trimming trailing whitespace before comparing lines</text>
    <text x="68" y="974" fill="rgba(255,255,255,0.4)" font-size="8.5">"apple" and "apple " (trailing space) are treated as different strings.</text>
  </g>

  <text x="450" y="1014" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.28)">Free tool: toolnestai.net/text-tools/remove-duplicate-lines</text>
  <text x="450" y="1034" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.2)">Case-sensitive/insensitive, keep-first/last — client-side, instant</text>
</svg>
