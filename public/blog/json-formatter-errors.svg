<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <radialGradient id="gL" cx="20%" cy="50%" r="55%"><stop offset="0%" stop-color="#5b21b6" stop-opacity="0.22"/><stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#818cf8"/></linearGradient>
  </defs>
  <rect width="900" height="460" fill="url(#bg)"/>
  <ellipse cx="180" cy="230" rx="400" ry="320" fill="url(#gL)"/>

  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="900" fill="url(#aG)">5 Common JSON Errors &amp; How to Fix Them</text>
  <text x="450" y="54" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.38)">The most frequent mistakes that break JSON parsing — and the exact fixes</text>

  <!-- Headers -->
  <rect x="28" y="66" width="270" height="24" rx="6" fill="rgba(239,68,68,0.15)" stroke="rgba(239,68,68,0.3)" stroke-width="1"/>
  <text x="163" y="82" text-anchor="middle" font-size="10" font-weight="700" fill="rgba(239,68,68,0.9)">⛔  The Error</text>
  <rect x="306" y="66" width="566" height="24" rx="6" fill="rgba(34,197,94,0.1)" stroke="rgba(34,197,94,0.25)" stroke-width="1"/>
  <text x="589" y="82" text-anchor="middle" font-size="10" font-weight="700" fill="rgba(34,197,94,0.9)">✓  The Fix</text>

  <!-- Row 1: Trailing comma -->
  <rect x="28" y="96" width="270" height="64" rx="7" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="44" y="114" font-size="9" font-weight="700" fill="rgba(239,68,68,0.85)">Trailing comma</text>
  <text x="44" y="130" font-size="8" fill="rgba(255,255,255,0.42)">A comma after the last item in</text>
  <text x="44" y="144" font-size="8" fill="rgba(255,255,255,0.42)">an object or array is not allowed.</text>
  <rect x="306" y="96" width="566" height="64" rx="7" fill="rgba(255,255,255,0.02)" stroke="rgba(34,197,94,0.08)" stroke-width="1"/>
  <text x="322" y="112" font-size="8.5" fill="rgba(255,255,255,0.5)">Remove the comma after the last element — JSON does not allow trailing commas.</text>
  <text x="322" y="128" font-size="8" font-family="monospace" fill="rgba(239,68,68,0.7)">✗  { "name": "Alice", "age": 30, }  ← trailing comma</text>
  <text x="322" y="144" font-size="8" font-family="monospace" fill="rgba(34,197,94,0.8)">✓  { "name": "Alice", "age": 30 }</text>
  <text x="322" y="156" font-size="7.5" fill="rgba(255,255,255,0.3)">Unlike JavaScript, JSON is strict — trailing commas always cause a parse error.</text>

  <!-- Row 2: Single quotes -->
  <rect x="28" y="166" width="270" height="64" rx="7" fill="rgba(255,255,255,0.025)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="44" y="184" font-size="9" font-weight="700" fill="rgba(239,68,68,0.85)">Single quotes instead of double</text>
  <text x="44" y="200" font-size="8" fill="rgba(255,255,255,0.42)">JSON requires double quotes for</text>
  <text x="44" y="214" font-size="8" fill="rgba(255,255,255,0.42)">all keys and string values.</text>
  <rect x="306" y="166" width="566" height="64" rx="7" fill="rgba(255,255,255,0.02)" stroke="rgba(34,197,94,0.08)" stroke-width="1"/>
  <text x="322" y="182" font-size="8.5" fill="rgba(255,255,255,0.5)">Replace all single quotes with double quotes. Both keys and values must use " not '.</text>
  <text x="322" y="198" font-size="8" font-family="monospace" fill="rgba(239,68,68,0.7)">✗  { 'name': 'Alice', 'active': true }  ← single quotes</text>
  <text x="322" y="214" font-size="8" font-family="monospace" fill="rgba(34,197,94,0.8)">✓  { "name": "Alice", "active": true }</text>
  <text x="322" y="226" font-size="7.5" fill="rgba(255,255,255,0.3)">JavaScript allows single quotes in objects — JSON does not. Common copy-paste error.</text>

  <!-- Row 3: Unquoted keys -->
  <rect x="28" y="236" width="270" height="64" rx="7" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="44" y="254" font-size="9" font-weight="700" fill="rgba(239,68,68,0.85)">Unquoted property keys</text>
  <text x="44" y="270" font-size="8" fill="rgba(255,255,255,0.42)">In JavaScript object literals keys</text>
  <text x="44" y="284" font-size="8" fill="rgba(255,255,255,0.42)">can be unquoted — not in JSON.</text>
  <rect x="306" y="236" width="566" height="64" rx="7" fill="rgba(255,255,255,0.02)" stroke="rgba(34,197,94,0.08)" stroke-width="1"/>
  <text x="322" y="252" font-size="8.5" fill="rgba(255,255,255,0.5)">Wrap every key in double quotes. JSON requires all keys to be quoted strings.</text>
  <text x="322" y="268" font-size="8" font-family="monospace" fill="rgba(239,68,68,0.7)">✗  { name: "Alice", age: 30 }  ← unquoted keys</text>
  <text x="322" y="284" font-size="8" font-family="monospace" fill="rgba(34,197,94,0.8)">✓  { "name": "Alice", "age": 30 }</text>
  <text x="322" y="296" font-size="7.5" fill="rgba(255,255,255,0.3)">If you copied a JS object literal, paste it into the formatter — it will highlight exactly which keys need quotes.</text>

  <!-- Row 4: Wrong true/false/null -->
  <rect x="28" y="306" width="270" height="64" rx="7" fill="rgba(255,255,255,0.025)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="44" y="324" font-size="9" font-weight="700" fill="rgba(239,68,68,0.85)">Capitalised true / false / null</text>
  <text x="44" y="340" font-size="8" fill="rgba(255,255,255,0.42)">JSON keywords are case-sensitive.</text>
  <text x="44" y="354" font-size="8" fill="rgba(255,255,255,0.42)">True, False, Null are all invalid.</text>
  <rect x="306" y="306" width="566" height="64" rx="7" fill="rgba(255,255,255,0.02)" stroke="rgba(34,197,94,0.08)" stroke-width="1"/>
  <text x="322" y="322" font-size="8.5" fill="rgba(255,255,255,0.5)">Use lowercase only: true, false, null — never True, False, Null or TRUE.</text>
  <text x="322" y="338" font-size="8" font-family="monospace" fill="rgba(239,68,68,0.7)">✗  { "active": True, "deleted": NULL }  ← capitalised</text>
  <text x="322" y="354" font-size="8" font-family="monospace" fill="rgba(34,197,94,0.8)">✓  { "active": true, "deleted": null }</text>
  <text x="322" y="366" font-size="7.5" fill="rgba(255,255,255,0.3)">Common when pasting values from Python (True/False/None) or other languages.</text>

  <!-- Row 5: Missing closing brace -->
  <rect x="28" y="376" width="270" height="64" rx="7" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="44" y="394" font-size="9" font-weight="700" fill="rgba(239,68,68,0.85)">Missing closing brace or bracket</text>
  <text x="44" y="410" font-size="8" fill="rgba(255,255,255,0.42)">Every { must have a matching }.</text>
  <text x="44" y="424" font-size="8" fill="rgba(255,255,255,0.42)">Every [ must have a matching ].</text>
  <rect x="306" y="376" width="566" height="64" rx="7" fill="rgba(255,255,255,0.02)" stroke="rgba(34,197,94,0.08)" stroke-width="1"/>
  <text x="322" y="392" font-size="8.5" fill="rgba(255,255,255,0.5)">Use the formatter's tree view to see structure — mismatched braces are highlighted red.</text>
  <text x="322" y="408" font-size="8" font-family="monospace" fill="rgba(239,68,68,0.7)">✗  { "user": { "name": "Alice" }  ← missing outer }</text>
  <text x="322" y="424" font-size="8" font-family="monospace" fill="rgba(34,197,94,0.8)">✓  { "user": { "name": "Alice" } }</text>
  <text x="322" y="436" font-size="7.5" fill="rgba(255,255,255,0.3)">The formatter shows "Unexpected end of JSON input" and highlights the unclosed block.</text>

  <text x="450" y="452" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.25)">toolnestai.net/developer-tools/json-formatter</text>
</svg>
