<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <radialGradient id="gC" cx="50%" cy="40%" r="60%"><stop offset="0%" stop-color="#5b21b6" stop-opacity="0.2"/><stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
  </defs>
  <rect width="900" height="460" fill="url(#bg)"/>
  <ellipse cx="450" cy="230" rx="520" ry="320" fill="url(#gC)"/>
  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="900" fill="url(#aG)">How AI Background Removal Works</text>
  <text x="450" y="54" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.38)">U-Net semantic segmentation: input pixels to alpha mask output</text>
  <!-- Encoder stages -->
  <rect x="28" y="72" width="835" height="48" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(167,139,250,0.12)" stroke-width="1"/>
  <text x="450" y="90" text-anchor="middle" font-size="10" font-weight="700" fill="rgba(167,139,250,0.75)">U-NET ENCODER (downsampling path) — builds hierarchical feature representations</text>
  <text x="450" y="108" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.4)">Each stage halves spatial resolution, doubles feature channels — captures local detail AND global semantic context simultaneously</text>
  <!-- Steps -->
  <g text-anchor="middle" font-size="9.5">
    <rect x="28" y="136" width="140" height="80" rx="8" fill="rgba(124,58,237,0.12)" stroke="rgba(124,58,237,0.28)" stroke-width="1"/>
    <text x="98" y="158" font-weight="700" fill="#c4b5fd">Input</text>
    <text x="98" y="176" fill="rgba(255,255,255,0.5)">320x320</text>
    <text x="98" y="194" fill="rgba(255,255,255,0.5)">RGB pixels</text>
    <text x="98" y="208" font-size="8" fill="rgba(255,255,255,0.3)">3 channels</text>

    <text x="192" y="180" fill="rgba(255,255,255,0.25)">→</text>

    <rect x="206" y="136" width="130" height="80" rx="8" fill="rgba(167,139,250,0.1)" stroke="rgba(167,139,250,0.22)" stroke-width="1"/>
    <text x="271" y="158" font-weight="700" fill="#c4b5fd">Stage 1</text>
    <text x="271" y="176" fill="rgba(255,255,255,0.5)">Conv layers</text>
    <text x="271" y="194" fill="rgba(255,255,255,0.5)">160x160</text>
    <text x="271" y="208" font-size="8" fill="rgba(255,255,255,0.3)">64 channels</text>

    <text x="360" y="180" fill="rgba(255,255,255,0.25)">→</text>

    <rect x="372" y="136" width="130" height="80" rx="8" fill="rgba(139,92,246,0.1)" stroke="rgba(139,92,246,0.22)" stroke-width="1"/>
    <text x="437" y="158" font-weight="700" fill="#c4b5fd">Stage 2</text>
    <text x="437" y="176" fill="rgba(255,255,255,0.5)">Conv layers</text>
    <text x="437" y="194" fill="rgba(255,255,255,0.5)">80x80</text>
    <text x="437" y="208" font-size="8" fill="rgba(255,255,255,0.3)">128 channels</text>

    <text x="526" y="180" fill="rgba(255,255,255,0.25)">→</text>

    <rect x="538" y="136" width="130" height="80" rx="8" fill="rgba(109,40,217,0.12)" stroke="rgba(109,40,217,0.25)" stroke-width="1"/>
    <text x="603" y="158" font-weight="700" fill="#c4b5fd">Bottleneck</text>
    <text x="603" y="176" fill="rgba(255,255,255,0.5)">10x10</text>
    <text x="603" y="194" fill="rgba(255,255,255,0.5)">full context</text>
    <text x="603" y="208" font-size="8" fill="rgba(255,255,255,0.3)">512 channels</text>

    <text x="692" y="180" fill="rgba(255,255,255,0.25)">→</text>

    <rect x="704" y="136" width="162" height="80" rx="8" fill="rgba(52,211,153,0.1)" stroke="rgba(52,211,153,0.22)" stroke-width="1"/>
    <text x="785" y="158" font-weight="700" fill="#6ee7b7">Alpha Mask</text>
    <text x="785" y="176" fill="rgba(255,255,255,0.5)">320x320</text>
    <text x="785" y="194" fill="rgba(255,255,255,0.5)">0-255 per pixel</text>
    <text x="785" y="208" font-size="8" fill="rgba(255,255,255,0.3)">1 channel</text>
  </g>
  <!-- Decoder annotation -->
  <rect x="538" y="228" width="296" height="52" rx="6" fill="rgba(14,116,144,0.08)" stroke="rgba(14,116,144,0.18)" stroke-width="1"/>
  <text x="686" y="248" text-anchor="middle" font-size="9.5" fill="rgba(103,232,249,0.85)">Decoder (upsampling)</text>
  <text x="686" y="268" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">Skip connections reattach fine spatial detail</text>
  <!-- What the mask means -->
  <rect x="28" y="292" width="835" height="92" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="450" y="314" text-anchor="middle" font-size="10" font-weight="700" fill="rgba(255,255,255,0.5)">UNDERSTANDING THE OUTPUT ALPHA MASK</text>
  <g text-anchor="middle" font-size="9.5">
    <rect x="50" y="325" width="140" height="44" rx="6" fill="rgba(52,211,153,0.1)" stroke="rgba(52,211,153,0.2)" stroke-width="1"/>
    <text x="120" y="344" fill="#6ee7b7" font-weight="700">255 (white)</text>
    <text x="120" y="360" fill="rgba(255,255,255,0.5)">Fully opaque foreground</text>
    <rect x="220" y="325" width="140" height="44" rx="6" fill="rgba(167,139,250,0.1)" stroke="rgba(167,139,250,0.2)" stroke-width="1"/>
    <text x="290" y="344" fill="#a78bfa" font-weight="700">128 (grey)</text>
    <text x="290" y="360" fill="rgba(255,255,255,0.5)">Uncertain edge / hair</text>
    <rect x="390" y="325" width="140" height="44" rx="6" fill="rgba(239,68,68,0.1)" stroke="rgba(239,68,68,0.2)" stroke-width="1"/>
    <text x="460" y="344" fill="#f87171" font-weight="700">0 (black)</text>
    <text x="460" y="360" fill="rgba(255,255,255,0.5)">Fully transparent background</text>
    <rect x="560" y="325" width="300" height="44" rx="6" fill="rgba(251,191,36,0.08)" stroke="rgba(251,191,36,0.15)" stroke-width="1"/>
    <text x="710" y="344" fill="#fbbf24" font-weight="700">Semi-transparent values (1-254)</text>
    <text x="710" y="360" fill="rgba(255,255,255,0.5)">Preserve hair, fur, and soft edges</text>
  </g>
  <text x="450" y="404" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.35)">Final PNG composites original pixels with this mask as the alpha channel — background becomes transparent, foreground stays visible</text>
  <text x="450" y="444" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.2)">toolnestai.net/image-tools/remove-background</text>
</svg>
