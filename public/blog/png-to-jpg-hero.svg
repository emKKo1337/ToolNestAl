<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="bG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="600" y="52" text-anchor="middle" font-size="24" font-weight="900" fill="url(#aG)">PNG to JPG: Size vs Quality Trade-off</text>
  <text x="600" y="74" text-anchor="middle" font-size="12" fill="rgba(255,255,255,0.38)">Converting a lossless PNG to lossy JPG — results, trade-offs, and the transparency issue</text>
  <rect x="40" y="96" width="360" height="420" rx="12" fill="rgba(52,211,153,0.04)" stroke="rgba(52,211,153,0.18)" stroke-width="1.5"/>
  <text x="220" y="122" text-anchor="middle" font-size="11" font-weight="700" fill="rgba(52,211,153,0.7)">TYPICAL RESULTS</text>
  <g font-size="9" fill="rgba(255,255,255,0.5)">
    <text x="60" y="154" fill="rgba(255,255,255,0.35)">Original PNG</text>
    <rect x="60" y="162" width="300" height="12" rx="3" fill="rgba(255,255,255,0.18)"/>
    <text x="368" y="172" fill="rgba(255,255,255,0.4)">3.4 MB</text>
    <text x="60" y="196" fill="rgba(255,255,255,0.35)">JPG quality 85%</text>
    <rect x="60" y="204" width="140" height="12" rx="3" fill="rgba(52,211,153,0.5)"/>
    <text x="208" y="214" fill="rgba(52,211,153,0.8)">1.1 MB (68% smaller)</text>
    <text x="60" y="238" fill="rgba(255,255,255,0.35)">JPG quality 80%</text>
    <rect x="60" y="246" width="100" height="12" rx="3" fill="rgba(52,211,153,0.45)"/>
    <text x="168" y="256" fill="rgba(52,211,153,0.75)">800 KB (76% smaller)</text>
    <text x="60" y="290" fill="rgba(255,255,255,0.35)">JPG quality 75%</text>
    <rect x="60" y="298" width="74" height="12" rx="3" fill="rgba(110,231,183,0.4)"/>
    <text x="142" y="308" fill="rgba(255,255,255,0.55)">590 KB (83% smaller)</text>
    <text x="60" y="340" fill="rgba(255,255,255,0.35)">JPG quality 65%</text>
    <rect x="60" y="348" width="48" height="12" rx="3" fill="rgba(251,191,36,0.4)"/>
    <text x="116" y="358" fill="rgba(255,255,255,0.5)">380 KB (89% smaller)</text>
    <text x="60" y="392" fill="rgba(255,255,255,0.35)">JPG quality 50%</text>
    <rect x="60" y="400" width="30" height="12" rx="3" fill="rgba(239,68,68,0.4)"/>
    <text x="98" y="410" fill="rgba(239,68,68,0.7)">240 KB (93% smaller)</text>
    <text x="60" y="430" fill="rgba(255,255,255,0.3)" font-size="8">Results for a 3.4 MB photo-type PNG</text>
    <text x="60" y="448" fill="rgba(255,255,255,0.25)" font-size="8">Screenshots/logos compress less dramatically</text>
    <text x="60" y="468" fill="rgba(167,139,250,0.6)" font-weight="700">Sweet spot: quality 80-85%</text>
    <text x="60" y="488" fill="rgba(255,255,255,0.35)">Invisible quality loss, 70-80% size reduction</text>
  </g>
  <rect x="440" y="96" width="360" height="420" rx="12" fill="rgba(239,68,68,0.04)" stroke="rgba(239,68,68,0.18)" stroke-width="1.5"/>
  <text x="620" y="122" text-anchor="middle" font-size="11" font-weight="700" fill="rgba(239,68,68,0.7)">THE TRANSPARENCY PROBLEM</text>
  <g font-size="9" fill="rgba(255,255,255,0.5)">
    <text x="460" y="154">JPG has no alpha channel — it cannot</text>
    <text x="460" y="174">represent transparency in any way.</text>
    <text x="460" y="206">When a transparent PNG is converted:</text>
    <text x="460" y="230">Every transparent pixel needs a color.</text>
    <text x="460" y="250">A background fill color is applied.</text>
    <text x="460" y="284" fill="rgba(239,68,68,0.7)" font-weight="700">Without choosing a background:</text>
    <text x="460" y="304">Most tools default to white.</text>
    <text x="460" y="324">A dark logo on transparent background</text>
    <text x="460" y="344">becomes a dark logo on white square.</text>
    <text x="460" y="376" fill="rgba(52,211,153,0.7)" font-weight="700">Best practice:</text>
    <text x="460" y="398">Check: does my PNG have transparency?</text>
    <text x="460" y="420">If yes — choose the right background color</text>
    <text x="460" y="440">before converting (match your page bg).</text>
    <text x="460" y="472" fill="rgba(251,191,36,0.6)">If transparency matters — use PNG or WebP,</text>
    <text x="460" y="492">never convert to JPG.</text>
  </g>
  <rect x="840" y="96" width="320" height="420" rx="12" fill="rgba(124,58,237,0.05)" stroke="rgba(124,58,237,0.18)" stroke-width="1.5"/>
  <text x="1000" y="122" text-anchor="middle" font-size="11" font-weight="700" fill="rgba(167,139,250,0.7)">PNG vs WEBP</text>
  <g font-size="9" fill="rgba(255,255,255,0.5)">
    <text x="860" y="154">If your goal is a smaller file that</text>
    <text x="860" y="174">still keeps transparency, consider</text>
    <text x="860" y="194">lossy WebP instead of JPG:</text>
    <text x="860" y="228" fill="rgba(167,139,250,0.7)" font-weight="700">Lossy WebP advantages:</text>
    <text x="860" y="250">Keeps transparency (alpha channel)</text>
    <text x="860" y="270">Smaller than PNG, near-JPG sizes</text>
    <text x="860" y="290">Modern browsers: universal support</text>
    <text x="860" y="326" fill="rgba(251,191,36,0.7)" font-weight="700">JPG advantages:</text>
    <text x="860" y="348">Universal compatibility (all software)</text>
    <text x="860" y="368">Works in email clients</text>
    <text x="860" y="388">Required by some platforms/services</text>
    <text x="860" y="424" fill="rgba(52,211,153,0.6)" font-weight="700">Bottom line:</text>
    <text x="860" y="446">For web: WebP is usually better.</text>
    <text x="860" y="466">For max compatibility: JPG.</text>
    <text x="860" y="486">For transparency: never JPG.</text>
  </g>
  <text x="600" y="565" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.22)">toolnestai.net/image-tools/png-to-jpg</text>
</svg>
