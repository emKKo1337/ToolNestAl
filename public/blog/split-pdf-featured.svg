<svg viewBox="0 0 900 540" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%"><stop offset="0%" stop-color="#0f0825"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <linearGradient id="lapG" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#1a1040"/><stop offset="100%" stop-color="#0d0824"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="900" height="540" fill="url(#bg)"/>
  <ellipse cx="450" cy="270" rx="280" ry="150" fill="#5b21b6" opacity="0.07" filter="url(#glow)"/>
  <rect x="120" y="48" width="660" height="410" rx="14" fill="url(#lapG)" stroke="#2a1f4a" stroke-width="1.5"/>
  <rect x="120" y="48" width="660" height="38" rx="14" fill="#1a1040"/>
  <rect x="120" y="72" width="660" height="14" fill="#1a1040"/>
  <circle cx="655" cy="67" r="7" fill="#ff5f57"/><circle cx="675" cy="67" r="7" fill="#febc2e"/><circle cx="695" cy="67" r="7" fill="#28c840"/>
  <rect x="200" y="56" width="440" height="20" rx="10" fill="#110c2a"/>
  <text x="420" y="70" font-family="monospace" font-size="9" fill="#4d4354" text-anchor="middle">toolnestai.net/pdf-tools/split-pdf</text>
  <rect x="136" y="94" width="628" height="352" rx="6" fill="#0c0920"/>
  <text x="450" y="118" font-family="sans-serif" font-size="13" font-weight="700" fill="#e2e2e2" text-anchor="middle">Split PDF</text>
  <text x="450" y="134" font-family="sans-serif" font-size="8" fill="#7a6d84" text-anchor="middle">Split into individual pages, by range, or at fixed intervals</text>
  <!-- Split mode tabs -->
  <rect x="148" y="148" width="120" height="26" rx="8" fill="#7c3aed"/>
  <text x="208" y="165" font-family="sans-serif" font-size="9" font-weight="700" fill="#fff" text-anchor="middle">By Range</text>
  <rect x="278" y="148" width="130" height="26" rx="8" fill="#1a1040"/>
  <text x="343" y="165" font-family="sans-serif" font-size="9" fill="#7a6d84" text-anchor="middle">Every N Pages</text>
  <rect x="418" y="148" width="130" height="26" rx="8" fill="#1a1040"/>
  <text x="483" y="165" font-family="sans-serif" font-size="9" fill="#7a6d84" text-anchor="middle">Individual Pages</text>
  <!-- Range inputs -->
  <text x="148" y="200" font-family="sans-serif" font-size="9" font-weight="700" fill="#4d4354">SPLIT RANGES</text>
  <rect x="148" y="208" width="260" height="26" rx="6" fill="#0f0c24" stroke="#2a1f4a" stroke-width="1"/>
  <text x="160" y="225" font-family="monospace" font-size="9" fill="#e2e2e2">1-5, 6-12, 13-end</text>
  <!-- Result preview -->
  <text x="148" y="260" font-family="sans-serif" font-size="9" font-weight="700" fill="#4d4354">OUTPUT FILES</text>
  <!-- 3 output PDFs -->
  <rect x="148" y="268" width="120" height="100" rx="8" fill="#1a1040" stroke="#a78bfa" stroke-width="1"/>
  <text x="208" y="295" font-family="sans-serif" font-size="8" fill="#7a6d84" text-anchor="middle">part-01.pdf</text>
  <text x="208" y="310" font-family="sans-serif" font-size="8" fill="#a78bfa" text-anchor="middle">Pages 1-5</text>
  <text x="208" y="325" font-family="sans-serif" font-size="7" fill="#4d4354" text-anchor="middle">5 pages</text>
  <rect x="284" y="268" width="120" height="100" rx="8" fill="#1a1040" stroke="#a78bfa" stroke-width="1"/>
  <text x="344" y="295" font-family="sans-serif" font-size="8" fill="#7a6d84" text-anchor="middle">part-02.pdf</text>
  <text x="344" y="310" font-family="sans-serif" font-size="8" fill="#a78bfa" text-anchor="middle">Pages 6-12</text>
  <text x="344" y="325" font-family="sans-serif" font-size="7" fill="#4d4354" text-anchor="middle">7 pages</text>
  <rect x="420" y="268" width="120" height="100" rx="8" fill="#1a1040" stroke="#a78bfa" stroke-width="1"/>
  <text x="480" y="295" font-family="sans-serif" font-size="8" fill="#7a6d84" text-anchor="middle">part-03.pdf</text>
  <text x="480" y="310" font-family="sans-serif" font-size="8" fill="#a78bfa" text-anchor="middle">Pages 13-end</text>
  <text x="480" y="325" font-family="sans-serif" font-size="7" fill="#4d4354" text-anchor="middle">10 pages</text>
  <!-- Split button -->
  <rect x="148" y="386" width="200" height="36" rx="10" fill="#7c3aed"/>
  <text x="248" y="409" font-family="sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">Split PDF</text>
  <rect x="360" y="386" width="160" height="36" rx="10" fill="#1a1040" stroke="#2a1f4a" stroke-width="1"/>
  <text x="440" y="409" font-family="sans-serif" font-size="12" fill="#7a6d84" text-anchor="middle">Download All (.zip)</text>
  <rect x="340" y="458" width="220" height="10" rx="5" fill="#1a1040"/>
  <rect x="280" y="466" width="340" height="8" rx="4" fill="#140e34"/>
</svg>
