<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="30%" cy="40%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <radialGradient id="gL" cx="15%" cy="50%" r="55%"><stop offset="0%" stop-color="#5b21b6" stop-opacity="0.45"/><stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/></radialGradient>
    <radialGradient id="gR" cx="85%" cy="50%" r="55%"><stop offset="0%" stop-color="#0e7490" stop-opacity="0.28"/><stop offset="100%" stop-color="#0e7490" stop-opacity="0"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="bG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient>
    <linearGradient id="lapG" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1a1040"/><stop offset="100%" stop-color="#0d0824"/></linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#5b21b6" flood-opacity="0.5"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="180" cy="315" rx="600" ry="500" fill="url(#gL)"/>
  <ellipse cx="1020" cy="315" rx="600" ry="500" fill="url(#gR)"/>

  <text x="60" y="70" font-size="14" font-weight="700" fill="url(#aG)" filter="url(#glow)">ToolNest AI</text>
  <text x="60" y="106" font-size="13" fill="rgba(255,255,255,0.35)">Text Tools › Text Sorter</text>
  <text x="60" y="185" font-size="52" font-weight="900" fill="url(#aG)" filter="url(#glow)">Text</text>
  <text x="60" y="245" font-size="52" font-weight="900" fill="url(#aG)" filter="url(#glow)">Sorter</text>
  <text x="60" y="300" font-size="18" fill="rgba(255,255,255,0.6)">A-Z · Z-A · Length · Numeric</text>
  <text x="60" y="328" font-size="18" fill="rgba(255,255,255,0.6)">Line-by-line sorting — Free, instant</text>

  <rect x="60" y="358" width="110" height="52" rx="8" fill="rgba(124,58,237,0.2)" stroke="rgba(124,58,237,0.4)" stroke-width="1"/>
  <text x="115" y="382" text-anchor="middle" font-size="14" font-weight="900" fill="#a78bfa">6</text>
  <text x="115" y="400" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">sort modes</text>

  <rect x="182" y="358" width="110" height="52" rx="8" fill="rgba(14,116,144,0.15)" stroke="rgba(14,116,144,0.35)" stroke-width="1"/>
  <text x="237" y="382" text-anchor="middle" font-size="18" font-weight="900" fill="#67e8f9">Natural</text>
  <text x="237" y="400" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">sort available</text>

  <rect x="304" y="358" width="110" height="52" rx="8" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
  <text x="359" y="382" text-anchor="middle" font-size="16" font-weight="900" fill="#34d399">Dedupe</text>
  <text x="359" y="400" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">option</text>

  <rect x="426" y="358" width="110" height="52" rx="8" fill="rgba(251,191,36,0.1)" stroke="rgba(251,191,36,0.25)" stroke-width="1"/>
  <text x="481" y="382" text-anchor="middle" font-size="20" font-weight="900" fill="#fbbf24">Free</text>
  <text x="481" y="400" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">no account</text>

  <text x="60" y="560" font-size="14" fill="rgba(255,255,255,0.25)">toolnestai.net/text-tools/text-sorter</text>

  <!-- Right: Laptop with text sorter UI -->
  <rect x="630" y="60" width="530" height="490" rx="16" fill="url(#lapG)" stroke="rgba(124,58,237,0.3)" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="630" y="60" width="530" height="36" rx="16" fill="rgba(255,255,255,0.05)"/>
  <rect x="630" y="78" width="530" height="18" fill="rgba(255,255,255,0.02)"/>
  <circle cx="655" cy="78" r="6" fill="rgba(239,68,68,0.6)"/>
  <circle cx="675" cy="78" r="6" fill="rgba(251,191,36,0.6)"/>
  <circle cx="695" cy="78" r="6" fill="rgba(34,197,94,0.6)"/>

  <!-- Sort mode tabs -->
  <g font-size="9" text-anchor="middle">
    <rect x="642" y="106" width="80" height="24" rx="6" fill="url(#bG)"/>
    <text x="682" y="122" fill="#fff" font-weight="700">A → Z</text>
    <rect x="728" y="106" width="80" height="24" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="768" y="122" fill="rgba(255,255,255,0.4)">Z → A</text>
    <rect x="814" y="106" width="90" height="24" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="859" y="122" fill="rgba(255,255,255,0.4)">By Length</text>
    <rect x="910" y="106" width="80" height="24" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="950" y="122" fill="rgba(255,255,255,0.4)">Numeric</text>

    <rect x="642" y="136" width="80" height="24" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="682" y="152" fill="rgba(255,255,255,0.4)">Random</text>
    <rect x="728" y="136" width="140" height="24" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="798" y="152" fill="rgba(255,255,255,0.4)">☑ Remove duplicates</text>
  </g>

  <!-- Before/After lists -->
  <text x="650" y="184" font-size="8.5" font-weight="700" fill="rgba(255,255,255,0.3)">INPUT (unsorted, 6 lines)</text>
  <rect x="642" y="190" width="240" height="150" rx="7" fill="rgba(0,0,0,0.4)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="656" y="210" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.6)">banana</text>
  <text x="656" y="230" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.6)">Apple</text>
  <text x="656" y="250" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.6)">item10</text>
  <text x="656" y="270" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.6)">item2</text>
  <text x="656" y="290" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.6)">cherry</text>
  <text x="656" y="310" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.6)">Apple</text>

  <text x="900" y="184" font-size="8.5" font-weight="700" fill="rgba(52,211,153,0.75)">OUTPUT (A→Z, deduped)</text>
  <rect x="892" y="190" width="240" height="150" rx="7" fill="rgba(52,211,153,0.08)" stroke="rgba(52,211,153,0.25)" stroke-width="1"/>
  <text x="906" y="210" font-family="monospace" font-size="11" fill="rgba(110,231,183,0.9)">Apple</text>
  <text x="906" y="230" font-family="monospace" font-size="11" fill="rgba(110,231,183,0.9)">banana</text>
  <text x="906" y="250" font-family="monospace" font-size="11" fill="rgba(110,231,183,0.9)">cherry</text>
  <text x="906" y="270" font-family="monospace" font-size="11" fill="rgba(110,231,183,0.9)">item10</text>
  <text x="906" y="290" font-family="monospace" font-size="11" fill="rgba(110,231,183,0.9)">item2</text>
  <text x="906" y="315" font-family="monospace" font-size="9" fill="rgba(239,68,68,0.7)">⚠ item10 before item2</text>
  <text x="906" y="329" font-family="monospace" font-size="8.5" fill="rgba(255,255,255,0.35)">(lexical, not natural sort)</text>

  <!-- Stats -->
  <g text-anchor="middle" font-size="9">
    <rect x="642" y="356" width="163" height="42" rx="7" fill="rgba(124,58,237,0.1)" stroke="rgba(124,58,237,0.22)" stroke-width="1"/>
    <text x="723" y="378" font-size="14" font-weight="900" fill="#a78bfa">6 → 5</text>
    <text x="723" y="392" fill="rgba(255,255,255,0.4)">lines (1 duplicate removed)</text>

    <rect x="815" y="356" width="333" height="42" rx="7" fill="rgba(14,116,144,0.08)" stroke="rgba(14,116,144,0.2)" stroke-width="1"/>
    <text x="981" y="378" font-size="12" font-weight="900" fill="#67e8f9">Case-insensitive alphabetical</text>
    <text x="981" y="392" fill="rgba(255,255,255,0.4)">sort applied</text>
  </g>

  <!-- Buttons -->
  <rect x="642" y="414" width="244" height="30" rx="8" fill="url(#bG)" filter="url(#sh)"/>
  <text x="764" y="433" text-anchor="middle" font-size="12" font-weight="900" fill="#fff">Sort Lines</text>
  <rect x="898" y="414" width="250" height="30" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="1023" y="433" text-anchor="middle" font-size="12" fill="rgba(255,255,255,0.35)">Copy Sorted List</text>

  <rect x="620" y="550" width="560" height="14" rx="4" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="760" y="562" width="260" height="8" rx="4" fill="rgba(255,255,255,0.03)"/>
</svg>
