<svg viewBox="0 0 900 1200" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <radialGradient id="gT" cx="50%" cy="10%" r="60%"><stop offset="0%" stop-color="#5b21b6" stop-opacity="0.35"/><stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/></radialGradient>
    <radialGradient id="gB" cx="50%" cy="90%" r="60%"><stop offset="0%" stop-color="#0e7490" stop-opacity="0.2"/><stop offset="100%" stop-color="#0e7490" stop-opacity="0"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="bG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient>
  </defs>
  <rect width="900" height="1200" fill="url(#bg)"/>
  <ellipse cx="450" cy="200" rx="700" ry="400" fill="url(#gT)"/>
  <ellipse cx="450" cy="1000" rx="700" ry="400" fill="url(#gB)"/>
  <text x="450" y="52" text-anchor="middle" font-size="26" font-weight="900" fill="url(#aG)">Base64 to Image — Complete Guide</text>
  <text x="450" y="76" text-anchor="middle" font-size="13" fill="rgba(255,255,255,0.38)">Decoding Base64 strings back to image files in browser and server</text>
  <text x="450" y="96" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.22)">toolnestai.net/image-tools/base64-to-image</text>
  <!-- Section 1 -->
  <rect x="32" y="112" width="836" height="38" rx="8" fill="rgba(124,58,237,0.18)" stroke="rgba(124,58,237,0.3)" stroke-width="1"/>
  <text x="450" y="136" text-anchor="middle" font-size="15" font-weight="800" fill="#a78bfa">01 — What Is Base64 Decoding?</text>
  <rect x="32" y="156" width="836" height="80" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="450" y="178" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.6)">Base64 encoding converts binary image data into a text string using 64 printable ASCII characters.</text>
  <text x="450" y="198" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.6)">Decoding reverses this: a Base64 string → binary bytes → viewable, downloadable image file.</text>
  <text x="450" y="220" text-anchor="middle" font-size="9.5" fill="rgba(255,255,255,0.3)">The encoded string is ~33% larger than the original file</text>
  <!-- Section 2 -->
  <rect x="32" y="252" width="836" height="38" rx="8" fill="rgba(14,116,144,0.18)" stroke="rgba(14,116,144,0.3)" stroke-width="1"/>
  <text x="450" y="276" text-anchor="middle" font-size="15" font-weight="800" fill="#67e8f9">02 — Browser: atob() Approach</text>
  <rect x="32" y="296" width="836" height="140" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="50" y="318" font-size="9" font-family="monospace" fill="rgba(167,139,250,0.7)">function base64ToImage(base64, mimeType = 'image/png') {'{'}</text>
  <text x="50" y="336" font-size="9" font-family="monospace" fill="rgba(255,255,255,0.5)">  const b64 = base64.includes(',') ? base64.split(',')[1] : base64;</text>
  <text x="50" y="354" font-size="9" font-family="monospace" fill="rgba(255,255,255,0.5)">  const byteChars = atob(b64);</text>
  <text x="50" y="372" font-size="9" font-family="monospace" fill="rgba(255,255,255,0.5)">  const bytes = Uint8Array.from(byteChars, c ={">"} c.charCodeAt(0));</text>
  <text x="50" y="390" font-size="9" font-family="monospace" fill="rgba(255,255,255,0.5)">  const blob = new Blob([bytes], {'{'} type: mimeType {'}'});</text>
  <text x="50" y="408" font-size="9" font-family="monospace" fill="rgba(52,211,153,0.8)">  return URL.createObjectURL(blob);  // blob: URL for preview or download</text>
  <text x="50" y="426" font-size="9" font-family="monospace" fill="rgba(167,139,250,0.7)">{'}'}</text>
  <!-- Section 3 -->
  <rect x="32" y="452" width="836" height="38" rx="8" fill="rgba(52,211,153,0.12)" stroke="rgba(52,211,153,0.22)" stroke-width="1"/>
  <text x="450" y="476" text-anchor="middle" font-size="15" font-weight="800" fill="#34d399">03 — Node.js: Buffer Approach</text>
  <rect x="32" y="496" width="836" height="120" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="50" y="518" font-size="9" font-family="monospace" fill="rgba(167,139,250,0.7)">const fs = require('fs');</text>
  <text x="50" y="536" font-size="9" font-family="monospace" fill="rgba(255,255,255,0.5)">const base64 = 'iVBORw0KGgo...';</text>
  <text x="50" y="554" font-size="9" font-family="monospace" fill="rgba(255,255,255,0.5)">const b64 = base64.includes(',') ? base64.split(',')[1] : base64;</text>
  <text x="50" y="572" font-size="9" font-family="monospace" fill="rgba(255,255,255,0.5)">const buffer = Buffer.from(b64, 'base64');</text>
  <text x="50" y="590" font-size="9" font-family="monospace" fill="rgba(52,211,153,0.8)">fs.writeFileSync('output.png', buffer);  // save to file</text>
  <!-- Section 4 -->
  <rect x="32" y="632" width="836" height="38" rx="8" fill="rgba(251,191,36,0.12)" stroke="rgba(251,191,36,0.22)" stroke-width="1"/>
  <text x="450" y="656" text-anchor="middle" font-size="15" font-weight="800" fill="#fbbf24">04 — Format Detection from Magic Bytes</text>
  <g font-size="9.5" text-anchor="middle">
    <rect x="32" y="676" width="200" height="60" rx="6" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="132" y="700" font-family="monospace" fill="rgba(255,255,255,0.6)">iVBORw0KGgo</text>
    <text x="132" y="724" fill="rgba(103,232,249,0.8)">PNG</text>
    <rect x="242" y="676" width="200" height="60" rx="6" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="342" y="700" font-family="monospace" fill="rgba(255,255,255,0.6)">/9j/4AAQ</text>
    <text x="342" y="724" fill="rgba(251,191,36,0.8)">JPEG</text>
    <rect x="452" y="676" width="200" height="60" rx="6" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="552" y="700" font-family="monospace" fill="rgba(255,255,255,0.6)">R0lGOD</text>
    <text x="552" y="724" fill="rgba(167,139,250,0.8)">GIF</text>
    <rect x="662" y="676" width="200" height="60" rx="6" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="762" y="700" font-family="monospace" fill="rgba(255,255,255,0.6)">UklGR</text>
    <text x="762" y="724" fill="rgba(52,211,153,0.8)">WebP</text>
  </g>
  <!-- Section 5 -->
  <rect x="32" y="752" width="836" height="38" rx="8" fill="rgba(167,139,250,0.14)" stroke="rgba(167,139,250,0.25)" stroke-width="1"/>
  <text x="450" y="776" text-anchor="middle" font-size="15" font-weight="800" fill="#c4b5fd">05 — Common Use Cases</text>
  <g font-size="9.5" text-anchor="middle">
    <rect x="32" y="796" width="270" height="80" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="167" y="818" font-weight="700" fill="rgba(167,139,250,0.85)">API Response Handling</text>
    <text x="167" y="838" fill="rgba(255,255,255,0.5)">AI image generation APIs</text>
    <text x="167" y="856" fill="rgba(255,255,255,0.5)">return Base64 images</text>

    <rect x="315" y="796" width="270" height="80" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="450" y="818" font-weight="700" fill="rgba(103,232,249,0.85)">Email Extraction</text>
    <text x="450" y="838" fill="rgba(255,255,255,0.5)">HTML emails embed images</text>
    <text x="450" y="856" fill="rgba(255,255,255,0.5)">as Base64 in &lt;img src&gt;</text>

    <rect x="598" y="796" width="270" height="80" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="733" y="818" font-weight="700" fill="rgba(52,211,153,0.85)">Debug Data URIs</text>
    <text x="733" y="838" fill="rgba(255,255,255,0.5)">Preview what a Data URI</text>
    <text x="733" y="856" fill="rgba(255,255,255,0.5)">actually renders as</text>
  </g>
  <text x="450" y="1000" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.28)">Free tool: toolnestai.net/image-tools/base64-to-image</text>
  <text x="450" y="1020" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.2)">All decoding runs in your browser — nothing is uploaded</text>
</svg>
