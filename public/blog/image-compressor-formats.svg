<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <radialGradient id="gC" cx="50%" cy="40%" r="60%"><stop offset="0%" stop-color="#5b21b6" stop-opacity="0.2"/><stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="bG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient>
  </defs>
  <rect width="900" height="480" fill="url(#bg)"/>
  <ellipse cx="450" cy="240" rx="500" ry="330" fill="url(#gC)"/>

  <text x="450" y="38" text-anchor="middle" font-size="20" font-weight="900" fill="url(#aG)">Image Format Comparison — Which to Use &amp; When</text>
  <text x="450" y="57" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.38)">JPEG · PNG · WebP · GIF — best use cases, compression ratios, and browser support</text>

  <!-- Header row -->
  <rect x="28" y="68" width="140" height="26" rx="6" fill="rgba(255,255,255,0.04)"/>
  <text x="98" y="84" text-anchor="middle" font-size="9" font-weight="700" fill="rgba(255,255,255,0.4)">FORMAT</text>
  <rect x="174" y="68" width="155" height="26" rx="6" fill="rgba(255,255,255,0.04)"/>
  <text x="252" y="84" text-anchor="middle" font-size="9" font-weight="700" fill="rgba(255,255,255,0.4)">BEST FOR</text>
  <rect x="335" y="68" width="120" height="26" rx="6" fill="rgba(255,255,255,0.04)"/>
  <text x="395" y="84" text-anchor="middle" font-size="9" font-weight="700" fill="rgba(255,255,255,0.4)">COMPRESSION</text>
  <rect x="461" y="68" width="110" height="26" rx="6" fill="rgba(255,255,255,0.04)"/>
  <text x="516" y="84" text-anchor="middle" font-size="9" font-weight="700" fill="rgba(255,255,255,0.4)">TRANSPARENCY</text>
  <rect x="577" y="68" width="100" height="26" rx="6" fill="rgba(255,255,255,0.04)"/>
  <text x="627" y="84" text-anchor="middle" font-size="9" font-weight="700" fill="rgba(255,255,255,0.4)">ANIMATION</text>
  <rect x="683" y="68" width="189" height="26" rx="6" fill="rgba(255,255,255,0.04)"/>
  <text x="778" y="84" text-anchor="middle" font-size="9" font-weight="700" fill="rgba(255,255,255,0.4)">BROWSER SUPPORT</text>

  <!-- JPEG row -->
  <rect x="28" y="100" width="844" height="76" rx="8" fill="rgba(251,191,36,0.06)" stroke="rgba(251,191,36,0.15)" stroke-width="1"/>
  <rect x="36" y="108" width="48" height="20" rx="4" fill="rgba(251,191,36,0.2)" stroke="rgba(251,191,36,0.4)" stroke-width="1"/>
  <text x="60" y="121" text-anchor="middle" font-size="9" font-weight="800" fill="rgba(251,191,36,0.9)">JPEG</text>
  <text x="36" y="148" font-size="8" fill="rgba(255,255,255,0.35)">.jpg / .jpeg</text>
  <text x="36" y="162" font-size="7.5" fill="rgba(255,255,255,0.25)">Lossy · 24-bit colour</text>
  <text x="174" y="118" font-size="8.5" fill="rgba(255,255,255,0.65)">Photos, blog hero images,</text>
  <text x="174" y="132" font-size="8.5" fill="rgba(255,255,255,0.65)">product shots, social cards</text>
  <text x="174" y="148" font-size="8" fill="rgba(255,255,255,0.35)">Avoid: logos, screenshots, text</text>
  <!-- Compression bar -->
  <rect x="335" y="114" width="115" height="10" rx="5" fill="rgba(255,255,255,0.06)"/>
  <rect x="335" y="114" width="90" height="10" rx="5" fill="rgba(251,191,36,0.5)"/>
  <text x="395" y="140" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.5)">High · 60–90% smaller</text>
  <text x="395" y="154" font-size="7.5" text-anchor="middle" fill="rgba(255,255,255,0.3)">vs uncompressed TIFF</text>
  <text x="516" y="133" text-anchor="middle" font-size="12" fill="rgba(239,68,68,0.6)">✗</text>
  <text x="516" y="148" text-anchor="middle" font-size="7.5" fill="rgba(255,255,255,0.3)">No alpha channel</text>
  <text x="627" y="133" text-anchor="middle" font-size="12" fill="rgba(239,68,68,0.6)">✗</text>
  <text x="627" y="148" text-anchor="middle" font-size="7.5" fill="rgba(255,255,255,0.3)">Static only</text>
  <text x="778" y="128" text-anchor="middle" font-size="8" fill="rgba(34,197,94,0.8)">✓ All browsers</text>
  <text x="778" y="143" text-anchor="middle" font-size="7.5" fill="rgba(255,255,255,0.3)">100% coverage</text>

  <!-- PNG row -->
  <rect x="28" y="182" width="844" height="76" rx="8" fill="rgba(96,165,250,0.06)" stroke="rgba(96,165,250,0.15)" stroke-width="1"/>
  <rect x="36" y="190" width="48" height="20" rx="4" fill="rgba(96,165,250,0.2)" stroke="rgba(96,165,250,0.4)" stroke-width="1"/>
  <text x="60" y="203" text-anchor="middle" font-size="9" font-weight="800" fill="rgba(147,197,253,0.9)">PNG</text>
  <text x="36" y="230" font-size="8" fill="rgba(255,255,255,0.35)">.png</text>
  <text x="36" y="244" font-size="7.5" fill="rgba(255,255,255,0.25)">Lossless · 8/24/32-bit</text>
  <text x="174" y="200" font-size="8.5" fill="rgba(255,255,255,0.65)">Logos, icons, screenshots,</text>
  <text x="174" y="214" font-size="8.5" fill="rgba(255,255,255,0.65)">UI elements, transparent bg</text>
  <text x="174" y="230" font-size="8" fill="rgba(255,255,255,0.35)">Avoid: large photos (use JPEG)</text>
  <rect x="335" y="196" width="115" height="10" rx="5" fill="rgba(255,255,255,0.06)"/>
  <rect x="335" y="196" width="55" height="10" rx="5" fill="rgba(96,165,250,0.5)"/>
  <text x="395" y="222" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.5)">Medium · lossless only</text>
  <text x="395" y="236" text-anchor="middle" font-size="7.5" fill="rgba(255,255,255,0.3)">Larger than JPEG for photos</text>
  <text x="516" y="215" text-anchor="middle" font-size="12" fill="rgba(34,197,94,0.7)">✓</text>
  <text x="516" y="230" text-anchor="middle" font-size="7.5" fill="rgba(255,255,255,0.3)">Full alpha channel</text>
  <text x="627" y="215" text-anchor="middle" font-size="12" fill="rgba(239,68,68,0.6)">✗</text>
  <text x="627" y="230" text-anchor="middle" font-size="7.5" fill="rgba(255,255,255,0.3)">Static only</text>
  <text x="778" y="210" text-anchor="middle" font-size="8" fill="rgba(34,197,94,0.8)">✓ All browsers</text>
  <text x="778" y="225" text-anchor="middle" font-size="7.5" fill="rgba(255,255,255,0.3)">100% coverage</text>

  <!-- WebP row -->
  <rect x="28" y="264" width="844" height="76" rx="8" fill="rgba(52,211,153,0.06)" stroke="rgba(52,211,153,0.2)" stroke-width="1"/>
  <rect x="36" y="272" width="48" height="20" rx="4" fill="rgba(52,211,153,0.2)" stroke="rgba(52,211,153,0.45)" stroke-width="1"/>
  <text x="60" y="285" text-anchor="middle" font-size="9" font-weight="800" fill="rgba(52,211,153,0.9)">WebP</text>
  <text x="36" y="312" font-size="8" fill="rgba(255,255,255,0.35)">.webp</text>
  <text x="36" y="326" font-size="7.5" fill="rgba(255,255,255,0.25)">Lossy + lossless · alpha</text>
  <text x="174" y="282" font-size="8.5" fill="rgba(255,255,255,0.65)">Everything — modern default</text>
  <text x="174" y="296" font-size="8.5" fill="rgba(255,255,255,0.65)">Photos, UI, icons, animations</text>
  <text x="174" y="312" font-size="8" fill="rgba(52,211,153,0.5)">Best overall choice for web</text>
  <rect x="335" y="278" width="115" height="10" rx="5" fill="rgba(255,255,255,0.06)"/>
  <rect x="335" y="278" width="108" height="10" rx="5" fill="rgba(52,211,153,0.5)"/>
  <text x="395" y="304" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.5)">Very high · 25–35% better</text>
  <text x="395" y="318" text-anchor="middle" font-size="7.5" fill="rgba(255,255,255,0.3)">than JPEG at same quality</text>
  <text x="516" y="297" text-anchor="middle" font-size="12" fill="rgba(34,197,94,0.7)">✓</text>
  <text x="516" y="312" text-anchor="middle" font-size="7.5" fill="rgba(255,255,255,0.3)">Full alpha channel</text>
  <text x="627" y="297" text-anchor="middle" font-size="12" fill="rgba(34,197,94,0.7)">✓</text>
  <text x="627" y="312" text-anchor="middle" font-size="7.5" fill="rgba(255,255,255,0.3)">Animated WebP</text>
  <text x="778" y="292" text-anchor="middle" font-size="8" fill="rgba(34,197,94,0.8)">✓ 97%+ browsers</text>
  <text x="778" y="307" text-anchor="middle" font-size="7.5" fill="rgba(255,255,255,0.3)">All modern browsers</text>

  <!-- GIF row -->
  <rect x="28" y="346" width="844" height="76" rx="8" fill="rgba(167,139,250,0.06)" stroke="rgba(167,139,250,0.15)" stroke-width="1"/>
  <rect x="36" y="354" width="48" height="20" rx="4" fill="rgba(167,139,250,0.2)" stroke="rgba(167,139,250,0.4)" stroke-width="1"/>
  <text x="60" y="367" text-anchor="middle" font-size="9" font-weight="800" fill="rgba(167,139,250,0.9)">GIF</text>
  <text x="36" y="394" font-size="8" fill="rgba(255,255,255,0.35)">.gif</text>
  <text x="36" y="408" font-size="7.5" fill="rgba(255,255,255,0.25)">Lossless · 256 colours max</text>
  <text x="174" y="364" font-size="8.5" fill="rgba(255,255,255,0.65)">Animated thumbnails, memes,</text>
  <text x="174" y="378" font-size="8.5" fill="rgba(255,255,255,0.65)">simple looping graphics</text>
  <text x="174" y="394" font-size="8" fill="rgba(255,255,255,0.35)">Avoid: photos, complex images</text>
  <rect x="335" y="360" width="115" height="10" rx="5" fill="rgba(255,255,255,0.06)"/>
  <rect x="335" y="360" width="40" height="10" rx="5" fill="rgba(167,139,250,0.4)"/>
  <text x="395" y="386" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.5)">Low · large file sizes</text>
  <text x="395" y="400" text-anchor="middle" font-size="7.5" fill="rgba(255,255,255,0.3)">Use WebP for animations</text>
  <text x="516" y="379" text-anchor="middle" font-size="12" fill="rgba(251,191,36,0.6)">~</text>
  <text x="516" y="394" text-anchor="middle" font-size="7.5" fill="rgba(255,255,255,0.3)">1-bit only (on/off)</text>
  <text x="627" y="379" text-anchor="middle" font-size="12" fill="rgba(34,197,94,0.7)">✓</text>
  <text x="627" y="394" text-anchor="middle" font-size="7.5" fill="rgba(255,255,255,0.3)">Frame animation</text>
  <text x="778" y="374" text-anchor="middle" font-size="8" fill="rgba(34,197,94,0.8)">✓ All browsers</text>
  <text x="778" y="389" text-anchor="middle" font-size="7.5" fill="rgba(255,255,255,0.3)">100% coverage</text>

  <text x="450" y="442" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.25)">Convert any format and compress at toolnestai.net/image-tools/image-compressor</text>

  <!-- Legend -->
  <text x="36" y="470" font-size="8" fill="rgba(34,197,94,0.6)">✓ Supported</text>
  <text x="140" y="470" font-size="8" fill="rgba(239,68,68,0.5)">✗ Not supported</text>
  <text x="270" y="470" font-size="8" fill="rgba(251,191,36,0.5)">~ Partial support</text>
</svg>
