<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="30%" cy="40%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <radialGradient id="gL" cx="15%" cy="50%" r="55%"><stop offset="0%" stop-color="#5b21b6" stop-opacity="0.45"/><stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/></radialGradient>
    <radialGradient id="gR" cx="85%" cy="50%" r="55%"><stop offset="0%" stop-color="#0e7490" stop-opacity="0.28"/><stop offset="100%" stop-color="#0e7490" stop-opacity="0"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="bG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient>
    <linearGradient id="lapG" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1a1040"/><stop offset="100%" stop-color="#0d0824"/></linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#5b21b6" flood-opacity="0.5"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="180" cy="315" rx="600" ry="500" fill="url(#gL)"/>
  <ellipse cx="1020" cy="315" rx="600" ry="500" fill="url(#gR)"/>

  <!-- Left -->
  <text x="60" y="70" font-size="14" font-weight="700" fill="url(#aG)" filter="url(#glow)">ToolNest AI</text>
  <text x="60" y="106" font-size="13" fill="rgba(255,255,255,0.35)">Developer Tools › Base64 Encoder / Decoder</text>
  <text x="60" y="185" font-size="52" font-weight="900" fill="url(#aG)" filter="url(#glow)">Base64</text>
  <text x="60" y="245" font-size="52" font-weight="900" fill="url(#aG)" filter="url(#glow)">Encoder</text>
  <text x="60" y="300" font-size="18" fill="rgba(255,255,255,0.6)">Text · Files · Images · Binary Data</text>
  <text x="60" y="328" font-size="18" fill="rgba(255,255,255,0.6)">Encode · Decode · Base64URL · Free</text>

  <!-- Stat badges -->
  <rect x="60" y="358" width="120" height="52" rx="8" fill="rgba(124,58,237,0.2)" stroke="rgba(124,58,237,0.4)" stroke-width="1"/>
  <text x="120" y="382" text-anchor="middle" font-size="16" font-weight="900" fill="#a78bfa">RFC 4648</text>
  <text x="120" y="400" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">compliant</text>

  <rect x="192" y="358" width="120" height="52" rx="8" fill="rgba(14,116,144,0.15)" stroke="rgba(14,116,144,0.35)" stroke-width="1"/>
  <text x="252" y="382" text-anchor="middle" font-size="20" font-weight="900" fill="#67e8f9">64</text>
  <text x="252" y="400" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">safe ASCII chars</text>

  <rect x="324" y="358" width="120" height="52" rx="8" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
  <text x="384" y="382" text-anchor="middle" font-size="18" font-weight="900" fill="#34d399">+33%</text>
  <text x="384" y="400" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">size overhead</text>

  <rect x="456" y="358" width="120" height="52" rx="8" fill="rgba(251,191,36,0.1)" stroke="rgba(251,191,36,0.25)" stroke-width="1"/>
  <text x="516" y="382" text-anchor="middle" font-size="20" font-weight="900" fill="#fbbf24">Free</text>
  <text x="516" y="400" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">no account</text>

  <text x="60" y="560" font-size="14" fill="rgba(255,255,255,0.25)">toolnestai.net/developer-tools/base64-encoder</text>

  <!-- Right: Laptop with Base64 tool UI -->
  <rect x="630" y="60" width="530" height="490" rx="16" fill="url(#lapG)" stroke="rgba(124,58,237,0.3)" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="630" y="60" width="530" height="36" rx="16" fill="rgba(255,255,255,0.05)"/>
  <rect x="630" y="78" width="530" height="18" fill="rgba(255,255,255,0.02)"/>
  <circle cx="655" cy="78" r="6" fill="rgba(239,68,68,0.6)"/>
  <circle cx="675" cy="78" r="6" fill="rgba(251,191,36,0.6)"/>
  <circle cx="695" cy="78" r="6" fill="rgba(34,197,94,0.6)"/>

  <!-- Mode tabs -->
  <g font-size="8.5" text-anchor="middle">
    <rect x="642" y="106" width="70" height="22" rx="5" fill="url(#bG)"/>
    <text x="677" y="121" fill="#fff" font-weight="700">Text</text>
    <rect x="718" y="106" width="70" height="22" rx="5" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="753" y="121" fill="rgba(255,255,255,0.4)">File</text>
    <rect x="794" y="106" width="70" height="22" rx="5" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="829" y="121" fill="rgba(255,255,255,0.4)">Image</text>
    <rect x="870" y="106" width="90" height="22" rx="5" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="915" y="121" fill="rgba(255,255,255,0.4)">Base64URL</text>
    <rect x="966" y="106" width="70" height="22" rx="5" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="1001" y="121" fill="rgba(255,255,255,0.4)">Decode</text>
  </g>

  <!-- Input -->
  <text x="650" y="148" font-size="8.5" font-weight="700" fill="rgba(255,255,255,0.3)">INPUT TEXT</text>
  <rect x="642" y="154" width="506" height="64" rx="9" fill="rgba(0,0,0,0.5)" stroke="rgba(124,58,237,0.4)" stroke-width="1.5"/>
  <text x="658" y="174" font-size="10" font-family="monospace" fill="rgba(255,255,255,0.75)">Hello, World! This is a Base64 encoding</text>
  <text x="658" y="192" font-size="10" font-family="monospace" fill="rgba(255,255,255,0.75)">example with special chars: &lt;&amp;&gt;©™</text>
  <rect x="1098" y="156" width="44" height="22" rx="5" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="1120" y="171" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.4)">Paste</text>

  <!-- Buttons -->
  <rect x="642" y="230" width="244" height="30" rx="8" fill="url(#bG)" filter="url(#sh)"/>
  <text x="764" y="249" text-anchor="middle" font-size="12" font-weight="900" fill="#fff">↓ Encode to Base64</text>
  <rect x="898" y="230" width="250" height="30" rx="8" fill="rgba(14,116,144,0.35)" stroke="rgba(14,116,144,0.6)" stroke-width="1"/>
  <text x="1023" y="249" text-anchor="middle" font-size="12" font-weight="800" fill="#67e8f9">↑ Decode from Base64</text>

  <!-- Output -->
  <text x="650" y="278" font-size="8.5" font-weight="700" fill="rgba(255,255,255,0.3)">BASE64 OUTPUT</text>
  <rect x="642" y="284" width="506" height="80" rx="9" fill="rgba(0,0,0,0.35)" stroke="rgba(52,211,153,0.3)" stroke-width="1.5"/>
  <text x="658" y="304" font-size="9.5" font-family="monospace" fill="rgba(52,211,153,0.85)">SGVsbG8sIFdvcmxkISBUaGlzIGlzIGEgQmFzZTY0</text>
  <text x="658" y="322" font-size="9.5" font-family="monospace" fill="rgba(52,211,153,0.85)">IGVuY29kaW5nIGV4YW1wbGUgd2l0aCBzcGVjaWFs</text>
  <text x="658" y="340" font-size="9.5" font-family="monospace" fill="rgba(52,211,153,0.85)">IGNoYXJzOiA8Jj7CqeKE</text>
  <rect x="1098" y="286" width="44" height="22" rx="5" fill="rgba(52,211,153,0.15)" stroke="rgba(52,211,153,0.35)" stroke-width="1"/>
  <text x="1120" y="301" text-anchor="middle" font-size="8" fill="rgba(52,211,153,0.8)">Copy</text>

  <!-- Stats -->
  <g text-anchor="middle" font-size="9">
    <rect x="642" y="376" width="160" height="48" rx="7" fill="rgba(124,58,237,0.1)" stroke="rgba(124,58,237,0.22)" stroke-width="1"/>
    <text x="722" y="398" font-size="16" font-weight="900" fill="#a78bfa">57</text>
    <text x="722" y="414" fill="rgba(255,255,255,0.4)">input chars</text>

    <rect x="814" y="376" width="160" height="48" rx="7" fill="rgba(14,116,144,0.08)" stroke="rgba(14,116,144,0.2)" stroke-width="1"/>
    <text x="894" y="398" font-size="16" font-weight="900" fill="#67e8f9">76</text>
    <text x="894" y="414" fill="rgba(255,255,255,0.4)">output chars (+33%)</text>

    <rect x="986" y="376" width="162" height="48" rx="7" fill="rgba(16,185,129,0.07)" stroke="rgba(16,185,129,0.18)" stroke-width="1"/>
    <text x="1067" y="398" font-size="16" font-weight="900" fill="#34d399">UTF-8</text>
    <text x="1067" y="414" fill="rgba(255,255,255,0.4)">encoding used</text>
  </g>

  <!-- Buttons row 2 -->
  <rect x="642" y="436" width="240" height="28" rx="7" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="762" y="454" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.4)">Clear</text>
  <rect x="898" y="436" width="250" height="28" rx="7" fill="rgba(124,58,237,0.15)" stroke="rgba(124,58,237,0.3)" stroke-width="1"/>
  <text x="1023" y="454" text-anchor="middle" font-size="10" fill="rgba(167,139,250,0.8)">⇅ Swap input / output</text>

  <!-- Laptop base -->
  <rect x="620" y="550" width="560" height="14" rx="4" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="760" y="562" width="260" height="8" rx="4" fill="rgba(255,255,255,0.03)"/>
</svg>
