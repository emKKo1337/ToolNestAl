  <text x="670" y="408" text-anchor="middle" font-size="20" font-weight="900" fill="#fbbf24">↑ SEO</text>
  <text x="670" y="422" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.4)">Google page speed ranking</text>
  <text x="820" y="408" text-anchor="middle" font-size="20" font-weight="900" fill="#f472b6">↓ Cost</text>
