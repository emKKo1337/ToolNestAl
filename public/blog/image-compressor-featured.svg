<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="30%" cy="40%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <radialGradient id="gL" cx="15%" cy="50%" r="55%"><stop offset="0%" stop-color="#5b21b6" stop-opacity="0.4"/><stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/></radialGradient>
    <radialGradient id="gR" cx="85%" cy="50%" r="55%"><stop offset="0%" stop-color="#0e7490" stop-opacity="0.25"/><stop offset="100%" stop-color="#0e7490" stop-opacity="0"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="bG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient>
    <linearGradient id="lapG" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1a1040"/><stop offset="100%" stop-color="#0d0824"/></linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#5b21b6" flood-opacity="0.45"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="180" cy="315" rx="600" ry="500" fill="url(#gL)"/>
  <ellipse cx="1020" cy="315" rx="600" ry="500" fill="url(#gR)"/>

  <!-- Left branding + headline -->
  <text x="60" y="70" font-size="14" font-weight="700" fill="url(#aG)" filter="url(#glow)">ToolNest AI</text>
  <text x="60" y="106" font-size="13" fill="rgba(255,255,255,0.35)">Image Tools › Image Compressor</text>
  <text x="60" y="178" font-size="52" font-weight="900" fill="url(#aG)" filter="url(#glow)">Image</text>
  <text x="60" y="238" font-size="52" font-weight="900" fill="url(#aG)" filter="url(#glow)">Compressor</text>
  <text x="60" y="293" font-size="18" fill="rgba(255,255,255,0.6)">Reduce image file size up to 90%</text>
  <text x="60" y="321" font-size="18" fill="rgba(255,255,255,0.6)">without visible quality loss — free, instant</text>

  <!-- Pills -->
  <rect x="60" y="355" width="120" height="28" rx="14" fill="rgba(124,58,237,0.25)" stroke="rgba(124,58,237,0.5)" stroke-width="1"/>
  <text x="120" y="373" text-anchor="middle" font-size="11" fill="rgba(167,139,250,0.9)">JPEG / PNG</text>
  <rect x="192" y="355" width="100" height="28" rx="14" fill="rgba(14,116,144,0.2)" stroke="rgba(14,116,144,0.4)" stroke-width="1"/>
  <text x="242" y="373" text-anchor="middle" font-size="11" fill="rgba(103,232,249,0.9)">WebP / GIF</text>
  <rect x="304" y="355" width="110" height="28" rx="14" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.35)" stroke-width="1"/>
  <text x="359" y="373" text-anchor="middle" font-size="11" fill="rgba(52,211,153,0.9)">Batch Upload</text>
  <rect x="60" y="395" width="130" height="28" rx="14" fill="rgba(251,191,36,0.12)" stroke="rgba(251,191,36,0.3)" stroke-width="1"/>
  <text x="125" y="413" text-anchor="middle" font-size="11" fill="rgba(251,191,36,0.9)">Quality Slider</text>
  <rect x="202" y="395" width="145" height="28" rx="14" fill="rgba(124,58,237,0.2)" stroke="rgba(124,58,237,0.4)" stroke-width="1"/>
  <text x="275" y="413" text-anchor="middle" font-size="11" fill="rgba(167,139,250,0.9)">Download All</text>

  <text x="60" y="560" font-size="14" fill="rgba(255,255,255,0.25)">toolnestai.net/image-tools/image-compressor</text>

  <!-- Right — laptop mockup -->
  <rect x="620" y="55" width="540" height="490" rx="16" fill="url(#lapG)" stroke="rgba(124,58,237,0.3)" stroke-width="1.5" filter="url(#sh)"/>
  <!-- Chrome bar -->
  <rect x="620" y="55" width="540" height="36" rx="16" fill="rgba(255,255,255,0.05)"/>
  <rect x="620" y="73" width="540" height="18" fill="rgba(255,255,255,0.02)"/>
  <circle cx="645" cy="73" r="6" fill="rgba(239,68,68,0.6)"/>
  <circle cx="665" cy="73" r="6" fill="rgba(251,191,36,0.6)"/>
  <circle cx="685" cy="73" r="6" fill="rgba(34,197,94,0.6)"/>
  <rect x="710" y="64" width="370" height="18" rx="9" fill="rgba(255,255,255,0.06)"/>
  <text x="895" y="76" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.3)">toolnestai.net/image-tools/image-compressor</text>

  <!-- Drop zone -->
  <rect x="632" y="100" width="516" height="130" rx="10" fill="rgba(124,58,237,0.07)" stroke="rgba(124,58,237,0.3)" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="890" y="155" text-anchor="middle" font-size="28" fill="rgba(124,58,237,0.4)">⬆</text>
  <text x="890" y="180" text-anchor="middle" font-size="12" font-weight="700" fill="rgba(255,255,255,0.6)">Drop images here or click to upload</text>
  <text x="890" y="198" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.3)">JPEG, PNG, WebP, GIF — up to 10 MB each</text>
  <text x="890" y="212" text-anchor="middle" font-size="9" fill="rgba(167,139,250,0.5)">Batch upload supported</text>

  <!-- Quality slider -->
  <rect x="632" y="242" width="516" height="54" rx="8" fill="rgba(255,255,255,0.025)"/>
  <text x="648" y="260" font-size="9" font-weight="700" fill="rgba(255,255,255,0.5)">QUALITY</text>
  <text x="1132" y="260" text-anchor="end" font-size="9" font-weight="700" fill="rgba(167,139,250,0.8)">80%</text>
  <rect x="648" y="265" width="488" height="6" rx="3" fill="rgba(255,255,255,0.08)"/>
  <rect x="648" y="265" width="390" height="6" rx="3" fill="url(#bG)"/>
  <circle cx="1038" cy="268" r="8" fill="#a78bfa" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <text x="648" y="288" font-size="8" fill="rgba(255,255,255,0.25)">Smaller file</text>
  <text x="1136" y="288" text-anchor="end" font-size="8" fill="rgba(255,255,255,0.25)">Better quality</text>

  <!-- Format select -->
  <rect x="632" y="306" width="248" height="36" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="648" y="319" font-size="8" fill="rgba(255,255,255,0.35)">Output Format</text>
  <text x="648" y="334" font-size="10" fill="rgba(255,255,255,0.7)">Same as input ▾</text>
  <rect x="892" y="306" width="256" height="36" rx="8" fill="url(#bG)" filter="url(#sh)"/>
  <text x="1020" y="328" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">⬇  Compress Images</text>

  <!-- Results cards -->
  <text x="648" y="366" font-size="9" font-weight="700" fill="rgba(255,255,255,0.4)" letter-spacing="1">RESULTS</text>

  <!-- Card 1 -->
  <rect x="632" y="374" width="516" height="50" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="642" y="382" width="36" height="34" rx="4" fill="rgba(124,58,237,0.2)"/>
  <text x="660" y="402" text-anchor="middle" font-size="8" fill="rgba(167,139,250,0.4)">JPG</text>
  <text x="688" y="392" font-size="9" font-weight="700" fill="rgba(255,255,255,0.8)">hero-banner.jpg</text>
  <text x="688" y="408" font-size="8" fill="rgba(255,255,255,0.4)">2.4 MB → 312 KB</text>
  <rect x="980" y="382" width="60" height="18" rx="4" fill="rgba(16,185,129,0.2)" stroke="rgba(16,185,129,0.4)" stroke-width="1"/>
  <text x="1010" y="394" text-anchor="middle" font-size="8" fill="rgba(52,211,153,0.9)">−87%</text>
  <rect x="1046" y="382" width="94" height="18" rx="4" fill="rgba(124,58,237,0.3)" stroke="rgba(124,58,237,0.5)" stroke-width="1"/>
  <text x="1093" y="394" text-anchor="middle" font-size="8" fill="rgba(167,139,250,0.9)">⬇ Download</text>

  <!-- Card 2 -->
  <rect x="632" y="430" width="516" height="50" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <rect x="642" y="438" width="36" height="34" rx="4" fill="rgba(14,116,144,0.2)"/>
  <text x="660" y="458" text-anchor="middle" font-size="8" fill="rgba(103,232,249,0.4)">PNG</text>
  <text x="688" y="448" font-size="9" font-weight="700" fill="rgba(255,255,255,0.8)">product-photo.png</text>
  <text x="688" y="464" font-size="8" fill="rgba(255,255,255,0.4)">1.8 MB → 284 KB</text>
  <rect x="980" y="438" width="60" height="18" rx="4" fill="rgba(16,185,129,0.2)" stroke="rgba(16,185,129,0.4)" stroke-width="1"/>
  <text x="1010" y="450" text-anchor="middle" font-size="8" fill="rgba(52,211,153,0.9)">−84%</text>
  <rect x="1046" y="438" width="94" height="18" rx="4" fill="rgba(124,58,237,0.3)" stroke="rgba(124,58,237,0.5)" stroke-width="1"/>
  <text x="1093" y="450" text-anchor="middle" font-size="8" fill="rgba(167,139,250,0.9)">⬇ Download</text>

  <!-- Download all -->
  <rect x="632" y="488" width="516" height="30" rx="8" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
  <text x="890" y="507" text-anchor="middle" font-size="10" font-weight="700" fill="rgba(52,211,153,0.9)">⬇  Download All Compressed Images</text>

  <!-- Laptop base -->
  <rect x="610" y="545" width="560" height="14" rx="4" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="760" y="556" width="260" height="8" rx="4" fill="rgba(255,255,255,0.03)"/>
</svg>
