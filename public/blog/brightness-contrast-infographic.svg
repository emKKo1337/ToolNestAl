<svg viewBox="0 0 900 1200" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <radialGradient id="gT" cx="50%" cy="10%" r="60%"><stop offset="0%" stop-color="#5b21b6" stop-opacity="0.35"/><stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/></radialGradient>
    <radialGradient id="gB" cx="50%" cy="90%" r="60%"><stop offset="0%" stop-color="#0e7490" stop-opacity="0.2"/><stop offset="100%" stop-color="#0e7490" stop-opacity="0"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
  </defs>
  <rect width="900" height="1200" fill="url(#bg)"/>
  <ellipse cx="450" cy="200" rx="700" ry="400" fill="url(#gT)"/>
  <ellipse cx="450" cy="1000" rx="700" ry="400" fill="url(#gB)"/>
  <text x="450" y="52" text-anchor="middle" font-size="26" font-weight="900" fill="url(#aG)">Brightness &amp; Contrast Guide</text>
  <text x="450" y="76" text-anchor="middle" font-size="13" fill="rgba(255,255,255,0.38)">Linear, contrast, gamma, and levels — the right tool for each fix</text>
  <text x="450" y="96" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.22)">toolnestai.net/image-tools/brightness-contrast</text>
  <rect x="32" y="112" width="836" height="38" rx="8" fill="rgba(124,58,237,0.18)" stroke="rgba(124,58,237,0.3)" stroke-width="1"/>
  <text x="450" y="136" text-anchor="middle" font-size="15" font-weight="800" fill="#a78bfa">01 — Brightness (Linear Shift)</text>
  <rect x="32" y="156" width="836" height="80" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="450" y="178" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.6)">output = clamp(input + b, 0, 255)  — adds (or subtracts) a flat amount from every pixel</text>
  <text x="450" y="198" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.6)">Uniform shift: makes the whole image lighter (+) or darker (-) by the same amount.</text>
  <text x="450" y="220" text-anchor="middle" font-size="9.5" fill="rgba(255,255,255,0.3)">Risk: clips highlights to 255 or crushes shadows to 0 at large values</text>
  <rect x="32" y="252" width="836" height="38" rx="8" fill="rgba(14,116,144,0.18)" stroke="rgba(14,116,144,0.3)" stroke-width="1"/>
  <text x="450" y="276" text-anchor="middle" font-size="15" font-weight="800" fill="#67e8f9">02 — Contrast (Center Stretch)</text>
  <rect x="32" y="296" width="836" height="80" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="450" y="318" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.6)">output = clamp((input − 128) × c + 128, 0, 255)</text>
  <text x="450" y="338" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.6)">c&gt;1: pushes dark pixels darker, bright pixels brighter. c&lt;1: everything converges toward 128 (gray).</text>
  <text x="450" y="358" text-anchor="middle" font-size="9.5" fill="rgba(255,255,255,0.3)">The 128 mid-gray point never moves — only the spread changes</text>
  <rect x="32" y="392" width="836" height="38" rx="8" fill="rgba(52,211,153,0.12)" stroke="rgba(52,211,153,0.22)" stroke-width="1"/>
  <text x="450" y="416" text-anchor="middle" font-size="15" font-weight="800" fill="#34d399">03 — Gamma (Power Curve)</text>
  <rect x="32" y="436" width="836" height="100" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="450" y="458" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.6)">output = (input/255)^γ × 255</text>
  <text x="450" y="478" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.6)">γ &lt; 1 brightens mid-tones. γ &gt; 1 darkens mid-tones. Pure black and pure white never change.</text>
  <text x="450" y="498" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.6)">Non-linear: affects mid-tones more than shadows/highlights. Preserves both endpoints (0 and 255).</text>
  <text x="450" y="518" text-anchor="middle" font-size="9.5" fill="rgba(255,255,255,0.3)">Standard sRGB display uses γ≈2.2. Fix underexposed photo with γ=0.5–0.7</text>
  <rect x="32" y="552" width="836" height="38" rx="8" fill="rgba(251,191,36,0.12)" stroke="rgba(251,191,36,0.22)" stroke-width="1"/>
  <text x="450" y="576" text-anchor="middle" font-size="15" font-weight="800" fill="#fbbf24">04 — Reading Histograms</text>
  <rect x="32" y="596" width="836" height="80" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="450" y="618" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.6)">X-axis: brightness 0 (black) → 255 (white). Y-axis: how many pixels have that brightness.</text>
  <text x="450" y="638" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.6)">Bunched left = underexposed. Bunched right = overexposed. Spread out = well-exposed.</text>
  <text x="450" y="658" text-anchor="middle" font-size="9.5" fill="rgba(255,255,255,0.3)">Gaps at edges = unused dynamic range. Spikes at 0 or 255 = clipped data</text>
  <rect x="32" y="692" width="836" height="38" rx="8" fill="rgba(167,139,250,0.14)" stroke="rgba(167,139,250,0.25)" stroke-width="1"/>
  <text x="450" y="716" text-anchor="middle" font-size="15" font-weight="800" fill="#c4b5fd">05 — Which to Use When</text>
  <g font-size="9.5" text-anchor="middle">
    <rect x="32" y="736" width="270" height="80" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="167" y="758" font-weight="700" fill="rgba(251,191,36,0.85)">Uniformly too dark</text>
    <text x="167" y="778" fill="rgba(255,255,255,0.5)">Brightness +30–60</text>
    <text x="167" y="798" fill="rgba(255,255,255,0.4)">or Gamma 0.7</text>
    <rect x="315" y="736" width="270" height="80" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="450" y="758" font-weight="700" fill="rgba(167,139,250,0.85)">Flat / washed out</text>
    <text x="450" y="778" fill="rgba(255,255,255,0.5)">Contrast +40–80</text>
    <text x="450" y="798" fill="rgba(255,255,255,0.4)">to stretch range</text>
    <rect x="598" y="736" width="270" height="80" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="733" y="758" font-weight="700" fill="rgba(52,211,153,0.85)">Midtones too dark</text>
    <text x="733" y="778" fill="rgba(255,255,255,0.5)">Gamma 0.6–0.8</text>
    <text x="733" y="798" fill="rgba(255,255,255,0.4)">preserves endpoints</text>
  </g>
  <text x="450" y="1000" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.28)">Free tool: toolnestai.net/image-tools/brightness-contrast</text>
</svg>
