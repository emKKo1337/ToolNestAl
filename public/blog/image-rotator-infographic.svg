<svg viewBox="0 0 900 1200" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <radialGradient id="gT" cx="50%" cy="10%" r="60%"><stop offset="0%" stop-color="#5b21b6" stop-opacity="0.35"/><stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/></radialGradient>
    <radialGradient id="gB" cx="50%" cy="90%" r="60%"><stop offset="0%" stop-color="#0e7490" stop-opacity="0.2"/><stop offset="100%" stop-color="#0e7490" stop-opacity="0"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
  </defs>
  <rect width="900" height="1200" fill="url(#bg)"/>
  <ellipse cx="450" cy="200" rx="700" ry="400" fill="url(#gT)"/>
  <ellipse cx="450" cy="1000" rx="700" ry="400" fill="url(#gB)"/>
  <text x="450" y="52" text-anchor="middle" font-size="26" font-weight="900" fill="url(#aG)">Image Rotation Complete Guide</text>
  <text x="450" y="76" text-anchor="middle" font-size="13" fill="rgba(255,255,255,0.38)">Lossless steps vs arbitrary angles, EXIF orientation, and flip operations</text>
  <text x="450" y="96" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.22)">toolnestai.net/image-tools/image-rotator</text>

  <rect x="32" y="112" width="836" height="38" rx="8" fill="rgba(124,58,237,0.18)" stroke="rgba(124,58,237,0.3)" stroke-width="1"/>
  <text x="450" y="136" text-anchor="middle" font-size="15" font-weight="800" fill="#a78bfa">01 — Rotation Types Compared</text>
  <g font-size="9.5" text-anchor="middle">
    <rect x="32" y="156" width="260" height="90" rx="8" fill="rgba(52,211,153,0.06)" stroke="rgba(52,211,153,0.18)" stroke-width="1"/>
    <text x="162" y="178" font-weight="700" fill="#6ee7b7">90° / 180° / 270°</text>
    <text x="162" y="198" fill="rgba(255,255,255,0.5)">Lossless — pixels reordered,</text>
    <text x="162" y="216" fill="rgba(255,255,255,0.5)">no interpolation, perfect</text>
    <text x="162" y="234" fill="rgba(52,211,153,0.7)">Zero quality loss</text>

    <rect x="306" y="156" width="260" height="90" rx="8" fill="rgba(251,191,36,0.06)" stroke="rgba(251,191,36,0.18)" stroke-width="1"/>
    <text x="436" y="178" font-weight="700" fill="#fbbf24">Free angle (e.g. 15°, 45°)</text>
    <text x="436" y="198" fill="rgba(255,255,255,0.5)">Bilinear interpolation —</text>
    <text x="436" y="216" fill="rgba(255,255,255,0.5)">canvas expands, tiny</text>
    <text x="436" y="234" fill="rgba(251,191,36,0.7)">quality impact at edges</text>

    <rect x="580" y="156" width="288" height="90" rx="8" fill="rgba(103,232,249,0.06)" stroke="rgba(103,232,249,0.18)" stroke-width="1"/>
    <text x="724" y="178" font-weight="700" fill="#67e8f9">Flip H / Flip V</text>
    <text x="724" y="198" fill="rgba(255,255,255,0.5)">Mirror pixel reordering,</text>
    <text x="724" y="216" fill="rgba(255,255,255,0.5)">no interpolation, exact</text>
    <text x="724" y="234" fill="rgba(103,232,249,0.7)">Zero quality loss</text>
  </g>

  <rect x="32" y="260" width="836" height="38" rx="8" fill="rgba(14,116,144,0.18)" stroke="rgba(14,116,144,0.3)" stroke-width="1"/>
  <text x="450" y="284" text-anchor="middle" font-size="15" font-weight="800" fill="#67e8f9">02 — EXIF Orientation Problem</text>
  <g font-size="9.5">
    <rect x="32" y="304" width="836" height="100" rx="8" fill="rgba(239,68,68,0.05)" stroke="rgba(239,68,68,0.12)" stroke-width="1"/>
    <text x="450" y="326" text-anchor="middle" fill="rgba(239,68,68,0.8)" font-weight="700">Why photos appear sideways in some apps</text>
    <text x="48" y="348" fill="rgba(255,255,255,0.5)">When you shoot portrait on a phone, the sensor captures pixels in landscape orientation.</text>
    <text x="48" y="366" fill="rgba(255,255,255,0.5)">The camera stores EXIF Orientation = 6 (rotate 90° CW to display) in the file metadata.</text>
    <text x="48" y="384" fill="rgba(255,255,255,0.5)">Apps that ignore EXIF show the raw pixel order — portrait photo appears lying on its side.</text>
    <text x="48" y="398" fill="rgba(52,211,153,0.75)">Fix: apply rotation physically to pixels and strip the EXIF tag so all apps agree.</text>
  </g>

  <rect x="32" y="418" width="836" height="38" rx="8" fill="rgba(124,58,237,0.18)" stroke="rgba(124,58,237,0.3)" stroke-width="1"/>
  <text x="450" y="442" text-anchor="middle" font-size="15" font-weight="800" fill="#a78bfa">03 — Canvas Math for Arbitrary Angles</text>
  <g font-size="9.5">
    <rect x="32" y="462" width="836" height="80" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="450" y="484" text-anchor="middle" fill="rgba(255,255,255,0.5)">New canvas width = |W*cos(θ)| + |H*sin(θ)</text>
    <text x="450" y="504" text-anchor="middle" fill="rgba(255,255,255,0.5)">New canvas height = |W*sin(θ)| + |H*cos(θ)|</text>
    <text x="450" y="526" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.35)">Empty corners fill with transparent (PNG) or white (JPG). Crop mode keeps original dimensions but clips corners.</text>
  </g>

  <rect x="32" y="556" width="836" height="38" rx="8" fill="rgba(239,68,68,0.12)" stroke="rgba(239,68,68,0.22)" stroke-width="1"/>
  <text x="450" y="580" text-anchor="middle" font-size="15" font-weight="800" fill="rgba(239,68,68,0.85)">04 — Code Examples</text>
  <g font-size="9">
    <rect x="32" y="600" width="836" height="120" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="48" y="620" font-weight="700" fill="rgba(255,255,255,0.4)">JavaScript (Canvas API)</text>
    <text x="48" y="638" fill="#a78bfa">const</text><text x="80" y="638" fill="rgba(255,255,255,0.65)"> canvas = document.createElement(</text><text x="286" y="638" fill="#6ee7b7">'canvas'</text><text x="332" y="638" fill="rgba(255,255,255,0.65)">);</text>
    <text x="48" y="656" fill="rgba(255,255,255,0.65)">canvas.width = img.height; canvas.height = img.width;</text>
    <text x="48" y="674" fill="rgba(255,255,255,0.65)">ctx.translate(canvas.width/2, canvas.height/2);</text>
    <text x="48" y="692" fill="rgba(255,255,255,0.65)">ctx.rotate(Math.PI / 2);</text>
    <text x="48" y="710" fill="rgba(255,255,255,0.65)">ctx.drawImage(img, -img.width/2, -img.height/2);</text>
  </g>

  <rect x="32" y="736" width="836" height="38" rx="8" fill="rgba(16,185,129,0.14)" stroke="rgba(16,185,129,0.25)" stroke-width="1"/>
  <text x="450" y="760" text-anchor="middle" font-size="15" font-weight="800" fill="#34d399">05 — Quick Reference</text>
  <g text-anchor="middle" font-size="9.5">
    <rect x="32" y="780" width="200" height="90" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    <text x="132" y="802" font-weight="700" fill="rgba(52,211,153,0.85)">Straighten photo</text>
    <text x="132" y="820" fill="rgba(255,255,255,0.5)">Use free-angle input</text>
    <text x="132" y="838" fill="rgba(255,255,255,0.5)">with small correction</text>
    <text x="132" y="856" fill="rgba(255,255,255,0.35)">e.g. -2° or +3°</text>

    <rect x="246" y="780" width="200" height="90" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    <text x="346" y="802" font-weight="700" fill="rgba(103,232,249,0.85)">Fix sideways photo</text>
    <text x="346" y="820" fill="rgba(255,255,255,0.5)">Apply 90° CW or</text>
    <text x="346" y="838" fill="rgba(255,255,255,0.5)">90° CCW as needed</text>
    <text x="346" y="856" fill="rgba(255,255,255,0.35)">lossless operation</text>

    <rect x="460" y="780" width="200" height="90" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    <text x="560" y="802" font-weight="700" fill="rgba(167,139,250,0.85)">Mirror image</text>
    <text x="560" y="820" fill="rgba(255,255,255,0.5)">Flip Horizontal for</text>
    <text x="560" y="838" fill="rgba(255,255,255,0.5)">selfie correction or</text>
    <text x="560" y="856" fill="rgba(255,255,255,0.35)">symmetry effect</text>

    <rect x="674" y="780" width="194" height="90" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    <text x="771" y="802" font-weight="700" fill="rgba(251,191,36,0.85)">Fix EXIF orientation</text>
    <text x="771" y="820" fill="rgba(255,255,255,0.5)">Apply orientation to</text>
    <text x="771" y="838" fill="rgba(255,255,255,0.5)">pixels and strip tag</text>
    <text x="771" y="856" fill="rgba(255,255,255,0.35)">works everywhere</text>
  </g>

  <text x="450" y="960" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.28)">Free tool: toolnestai.net/image-tools/image-rotator</text>
  <text x="450" y="980" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.2)">Rotate, flip, fix EXIF — any angle — private, no upload</text>
</svg>
