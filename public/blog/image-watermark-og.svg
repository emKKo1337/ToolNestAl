  <text x="60" y="185" font-size="46" font-weight="900" fill="url(#aG)" filter="url(#glow)">Image</text>
  <text x="60" y="245" font-size="46" font-weight="900" fill="url(#aG)" filter="url(#glow)">Watermark</text>
  <text x="60" y="300" font-size="18" fill="rgba(255,255,255,0.6)">Add text or logo watermarks</text>
  <text x="60" y="328" font-size="18" fill="rgba(255,255,255,0.6)">Control position, size, opacity — free</text>
  <text x="60" y="560" font-size="14" fill="rgba(255,255,255,0.25)">toolnestai.net/image-tools/image-watermark</text>
  <!-- Preview image with watermark -->
