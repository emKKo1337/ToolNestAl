  <rect x="630" y="80" width="510" height="36" rx="16" fill="rgba(255,255,255,0.05)"/>
  <rect x="630" y="98" width="510" height="18" fill="rgba(255,255,255,0.02)"/>
  <circle cx="655" cy="98" r="6" fill="rgba(239,68,68,0.6)"/>
  <circle cx="675" cy="98" r="6" fill="rgba(251,191,36,0.6)"/>
  <circle cx="695" cy="98" r="6" fill="rgba(34,197,94,0.6)"/>
  <!-- Canvas demo -->
  <rect x="648" y="126" width="474" height="240" rx="8" fill="rgba(14,116,144,0.1)" stroke="rgba(14,116,144,0.18)" stroke-width="1"/>
  <rect x="654" y="132" width="462" height="100" rx="4" fill="rgba(167,139,250,0.1)"/>
  <rect x="654" y="234" width="462" height="72" rx="4" fill="rgba(52,211,153,0.06)"/>
  <rect x="654" y="308" width="280" height="52" rx="4" fill="rgba(239,68,68,0.05)"/>
  <!-- Watermark text overlay -->
  <text x="1100" y="342" text-anchor="end" font-size="16" fill="rgba(255,255,255,0.3)" font-style="italic">© MyBrand 2026</text>
  <!-- Stat cards -->
  <g text-anchor="middle" font-size="9.5">
    <rect x="648" y="378" width="150" height="52" rx="8" fill="rgba(167,139,250,0.1)" stroke="rgba(167,139,250,0.22)" stroke-width="1"/>
    <text x="723" y="400" fill="#a78bfa" font-weight="700">9 Positions</text>
    <text x="723" y="418" fill="rgba(255,255,255,0.4)">precise placement</text>
    <rect x="810" y="378" width="150" height="52" rx="8" fill="rgba(52,211,153,0.1)" stroke="rgba(52,211,153,0.22)" stroke-width="1"/>
    <text x="885" y="400" fill="#6ee7b7" font-weight="700">Opacity</text>
    <text x="885" y="418" fill="rgba(255,255,255,0.4)">0-100% control</text>
    <rect x="972" y="378" width="150" height="52" rx="8" fill="rgba(103,232,249,0.1)" stroke="rgba(103,232,249,0.22)" stroke-width="1"/>
    <text x="1047" y="400" fill="#67e8f9" font-weight="700">Text + Logo</text>
    <text x="1047" y="418" fill="rgba(255,255,255,0.4)">both types</text>
  </g>
  <rect x="648" y="442" width="474" height="44" rx="8" fill="url(#bG)" filter="url(#sh)"/>
  <text x="885" y="469" text-anchor="middle" font-size="13" font-weight="900" fill="#fff">Add Watermark Free</text>
