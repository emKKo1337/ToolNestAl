<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <radialGradient id="gC" cx="50%" cy="40%" r="60%"><stop offset="0%" stop-color="#5b21b6" stop-opacity="0.2"/><stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
  </defs>
  <rect width="900" height="460" fill="url(#bg)"/>
  <ellipse cx="450" cy="230" rx="520" ry="320" fill="url(#gC)"/>

  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="900" fill="url(#aG)">2,000+ Years of Lorem Ipsum</text>
  <text x="450" y="54" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.38)">From Roman philosophy to every design mockup ever made</text>

  <!-- Timeline -->
  <line x1="60" y1="120" x2="840" y2="120" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>

  <circle cx="100" cy="120" r="8" fill="#a78bfa"/>
  <text x="100" y="98" text-anchor="middle" font-size="11" font-weight="700" fill="#a78bfa">45 BC</text>
  <text x="100" y="146" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.55)">Cicero writes</text>
  <text x="100" y="160" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.55)">"De Finibus"</text>

  <circle cx="330" cy="120" r="8" fill="#67e8f9"/>
  <text x="330" y="98" text-anchor="middle" font-size="11" font-weight="700" fill="#67e8f9">1500s</text>
  <text x="330" y="146" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.55)">Unknown printer</text>
  <text x="330" y="160" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.55)">scrambles the text for</text>
  <text x="330" y="174" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.55)">a type specimen book</text>

  <circle cx="560" cy="120" r="8" fill="#34d399"/>
  <text x="560" y="98" text-anchor="middle" font-size="11" font-weight="700" fill="#34d399">1960s</text>
  <text x="560" y="146" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.55)">Letraset transfer</text>
  <text x="560" y="160" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.55)">sheets popularize it</text>
  <text x="560" y="174" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.55)">among graphic designers</text>

  <circle cx="790" cy="120" r="8" fill="#fbbf24"/>
  <text x="790" y="98" text-anchor="middle" font-size="11" font-weight="700" fill="#fbbf24">1980s–Today</text>
  <text x="790" y="146" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.55)">Desktop publishing</text>
  <text x="790" y="160" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.55)">&amp; web design make it</text>
  <text x="790" y="174" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.55)">the global default</text>

  <!-- Original text comparison -->
  <rect x="28" y="200" width="410" height="130" rx="8" fill="rgba(167,139,250,0.06)" stroke="rgba(167,139,250,0.2)" stroke-width="1"/>
  <text x="44" y="222" font-size="10.5" font-weight="700" fill="#a78bfa">Original Latin (Cicero, 45 BC)</text>
  <text x="44" y="244" font-family="monospace" font-size="9.5" fill="rgba(255,255,255,0.55)">"Neque porro quisquam est, qui dolorem</text>
  <text x="44" y="260" font-family="monospace" font-size="9.5" fill="rgba(255,255,255,0.55)">ipsum quia dolor sit amet, consectetur,</text>
  <text x="44" y="276" font-family="monospace" font-size="9.5" fill="rgba(255,255,255,0.55)">adipisci velit..."</text>
  <text x="44" y="300" font-size="8.5" fill="rgba(255,255,255,0.35)">Translation: "Nor is there anyone who loves</text>
  <text x="44" y="314" font-size="8.5" fill="rgba(255,255,255,0.35)">pain itself, because it is pain..." — a real</text>
  <text x="44" y="328" font-size="8.5" fill="rgba(255,255,255,0.35)">philosophical argument, meaning intact.</text>

  <rect x="462" y="200" width="410" height="130" rx="8" fill="rgba(103,232,249,0.06)" stroke="rgba(103,232,249,0.2)" stroke-width="1"/>
  <text x="478" y="222" font-size="10.5" font-weight="700" fill="#67e8f9">Modern "Lorem Ipsum" (scrambled)</text>
  <text x="478" y="244" font-family="monospace" font-size="9.5" fill="rgba(255,255,255,0.55)">"Lorem ipsum dolor sit amet, consectetur</text>
  <text x="478" y="260" font-family="monospace" font-size="9.5" fill="rgba(255,255,255,0.55)">adipiscing elit, sed do eiusmod tempor</text>
  <text x="478" y="276" font-family="monospace" font-size="9.5" fill="rgba(255,255,255,0.55)">incididunt ut labore..."</text>
  <text x="478" y="300" font-size="8.5" fill="rgba(255,255,255,0.35)">"Lorem" isn't even a real Latin word on its</text>
  <text x="478" y="314" font-size="8.5" fill="rgba(255,255,255,0.35)">own — it's a fragment of "dolorem" cut off</text>
  <text x="478" y="328" font-size="8.5" fill="rgba(255,255,255,0.35)">mid-word when the text was scrambled.</text>

  <!-- Why it works -->
  <rect x="28" y="340" width="844" height="100" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(124,58,237,0.15)" stroke-width="1"/>
  <text x="450" y="362" text-anchor="middle" font-size="10.5" font-weight="700" fill="rgba(167,139,250,0.85)">WHY IT STILL WORKS AS PLACEHOLDER TEXT</text>
  <text x="450" y="384" text-anchor="middle" font-size="9.5" fill="rgba(255,255,255,0.55)">Because the scrambled Latin isn't a coherent sentence in any modern language, viewers focus on</text>
  <text x="450" y="402" text-anchor="middle" font-size="9.5" fill="rgba(255,255,255,0.55)">the visual design — typography, spacing, layout — instead of getting distracted reading the content,</text>
  <text x="450" y="420" text-anchor="middle" font-size="9.5" fill="rgba(255,255,255,0.55)">which is exactly the point of a mockup.</text>

  <text x="450" y="450" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.2)">toolnestai.net/text-tools/lorem-ipsum-generator</text>
</svg>
