<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="30%" cy="40%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <radialGradient id="gL" cx="15%" cy="50%" r="55%"><stop offset="0%" stop-color="#5b21b6" stop-opacity="0.45"/><stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/></radialGradient>
    <radialGradient id="gR" cx="85%" cy="50%" r="55%"><stop offset="0%" stop-color="#0e7490" stop-opacity="0.28"/><stop offset="100%" stop-color="#0e7490" stop-opacity="0"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="bG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient>
    <linearGradient id="lapG" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1a1040"/><stop offset="100%" stop-color="#0d0824"/></linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#5b21b6" flood-opacity="0.45"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="180" cy="315" rx="600" ry="500" fill="url(#gL)"/>
  <ellipse cx="1020" cy="315" rx="600" ry="500" fill="url(#gR)"/>
  <text x="60" y="70" font-size="14" font-weight="700" fill="url(#aG)" filter="url(#glow)">ToolNest AI</text>
  <text x="60" y="106" font-size="13" fill="rgba(255,255,255,0.35)">Image Tools - Image Color Picker</text>
  <text x="60" y="185" font-size="46" font-weight="900" fill="url(#aG)" filter="url(#glow)">Image Color</text>
  <text x="60" y="245" font-size="46" font-weight="900" fill="url(#aG)" filter="url(#glow)">Picker</text>
  <text x="60" y="300" font-size="18" fill="rgba(255,255,255,0.6)">Pick any pixel — get HEX, RGB, HSL</text>
  <text x="60" y="328" font-size="18" fill="rgba(255,255,255,0.6)">Extract dominant palette — free</text>
  <text x="60" y="560" font-size="14" fill="rgba(255,255,255,0.25)">toolnestai.net/image-tools/image-color-picker</text>
  <!-- Palette swatches right side -->
  <rect x="630" y="80" width="510" height="440" rx="16" fill="url(#lapG)" stroke="rgba(124,58,237,0.3)" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="630" y="80" width="510" height="36" rx="16" fill="rgba(255,255,255,0.05)"/>
  <rect x="630" y="98" width="510" height="18" fill="rgba(255,255,255,0.02)"/>
  <circle cx="655" cy="98" r="6" fill="rgba(239,68,68,0.6)"/>
  <circle cx="675" cy="98" r="6" fill="rgba(251,191,36,0.6)"/>
  <circle cx="695" cy="98" r="6" fill="rgba(34,197,94,0.6)"/>
  <!-- Dominant palette visual -->
  <text x="885" y="142" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.35)">Dominant Colors</text>
  <rect x="648" y="152" width="474" height="60" rx="6" fill="#7c3aed"/>
  <text x="885" y="188" text-anchor="middle" font-size="11" font-weight="700" fill="rgba(255,255,255,0.85)">#7c3aed — rgb(124,58,237) — hsl(263,83%,58%)</text>
  <rect x="648" y="222" width="474" height="48" rx="6" fill="#0e7490"/>
  <text x="885" y="251" text-anchor="middle" font-size="11" font-weight="700" fill="rgba(255,255,255,0.85)">#0e7490 — rgb(14,116,144) — hsl(191,82%,31%)</text>
  <rect x="648" y="280" width="230" height="48" rx="6" fill="#f97316"/>
  <rect x="892" y="280" width="230" height="48" rx="6" fill="#22c55e"/>
  <rect x="648" y="338" width="150" height="48" rx="6" fill="#e879f9"/>
  <rect x="808" y="338" width="150" height="48" rx="6" fill="#facc15"/>
  <rect x="968" y="338" width="154" height="48" rx="6" fill="#ef4444"/>
  <rect x="648" y="398" width="474" height="44" rx="8" fill="url(#bG)" filter="url(#sh)"/>
  <text x="885" y="425" text-anchor="middle" font-size="13" font-weight="900" fill="#fff">Pick Colors from Any Image</text>
</svg>
