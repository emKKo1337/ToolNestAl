<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <radialGradient id="gC" cx="50%" cy="40%" r="60%"><stop offset="0%" stop-color="#0e7490" stop-opacity="0.2"/><stop offset="100%" stop-color="#0e7490" stop-opacity="0"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
  </defs>
  <rect width="900" height="460" fill="url(#bg)"/>
  <ellipse cx="450" cy="230" rx="520" ry="320" fill="url(#gC)"/>

  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="900" fill="url(#aG)">Catastrophic Backtracking — A Regex Performance Trap</text>
  <text x="450" y="54" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.38)">Nested quantifiers can turn a simple pattern into an exponential-time freeze</text>

  <!-- Bad pattern -->
  <rect x="28" y="70" width="844" height="90" rx="8" fill="rgba(239,68,68,0.06)" stroke="rgba(239,68,68,0.2)" stroke-width="1"/>
  <text x="44" y="92" font-size="10.5" font-weight="700" fill="rgba(239,68,68,0.85)">✗ Dangerous — Nested Quantifiers</text>
  <text x="44" y="114" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.7)">/^(a+)+$/    tested against: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa!"</text>
  <text x="44" y="134" font-size="9" fill="rgba(255,255,255,0.5)">The outer + can match the inner group in many different ways for the same input (a, aa+a,</text>
  <text x="44" y="150" font-size="9" fill="rgba(255,255,255,0.5)">aaa+aa, ...). When the final "!" fails to match, the engine tries every combination — O(2ⁿ) time.</text>

  <!-- Timing bar chart -->
  <rect x="28" y="168" width="844" height="130" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="450" y="188" text-anchor="middle" font-size="10" font-weight="700" fill="rgba(255,255,255,0.4)">EXECUTION TIME vs INPUT LENGTH (vulnerable pattern)</text>
  <g font-size="9" text-anchor="middle">
    <rect x="80" y="260" width="60" height="8" rx="2" fill="rgba(52,211,153,0.6)"/>
    <text x="110" y="252" fill="rgba(255,255,255,0.5)">20 chars</text>
    <text x="110" y="282" fill="rgba(52,211,153,0.8)">~1ms</text>

    <rect x="220" y="252" width="60" height="16" rx="2" fill="rgba(103,232,249,0.6)"/>
    <text x="250" y="244" fill="rgba(255,255,255,0.5)">25 chars</text>
    <text x="250" y="282" fill="rgba(103,232,249,0.8)">~30ms</text>

    <rect x="360" y="230" width="60" height="38" rx="2" fill="rgba(251,191,36,0.6)"/>
    <text x="390" y="222" fill="rgba(255,255,255,0.5)">30 chars</text>
    <text x="390" y="282" fill="rgba(251,191,36,0.8)">~1 sec</text>

    <rect x="500" y="200" width="60" height="68" rx="2" fill="rgba(249,115,22,0.6)"/>
    <text x="530" y="192" fill="rgba(255,255,255,0.5)">35 chars</text>
    <text x="530" y="282" fill="rgba(249,115,22,0.8)">~30 sec</text>

    <rect x="640" y="182" width="60" height="86" rx="2" fill="rgba(239,68,68,0.65)"/>
    <text x="670" y="174" fill="rgba(255,255,255,0.5)">40 chars</text>
    <text x="670" y="282" fill="rgba(239,68,68,0.85)">~15 min</text>

    <rect x="780" y="182" width="60" height="86" rx="2" fill="rgba(220,38,38,0.75)"/>
    <text x="810" y="174" fill="rgba(255,255,255,0.5)">50 chars</text>
    <text x="810" y="282" fill="rgba(220,38,38,0.9)">Years+</text>
  </g>

  <!-- Fix -->
  <rect x="28" y="308" width="844" height="90" rx="8" fill="rgba(52,211,153,0.06)" stroke="rgba(52,211,153,0.2)" stroke-width="1"/>
  <text x="44" y="330" font-size="10.5" font-weight="700" fill="rgba(52,211,153,0.85)">✓ Fixed — Remove the Nested Quantifier</text>
  <text x="44" y="352" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.7)">/^a+$/    or, for the general shape: /^(?:a+)$/    — same match, O(n) time, no ambiguity</text>
  <text x="44" y="372" font-size="9" fill="rgba(255,255,255,0.5)">Rule of thumb: avoid a quantified group containing another quantifier over the same characters</text>
  <text x="44" y="388" font-size="9" fill="rgba(255,255,255,0.5)">(e.g. (a+)+, (a*)*, (a|a)+). If you don't need the inner group's captures, flatten it.</text>

  <!-- Tips -->
  <rect x="28" y="406" width="844" height="34" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(124,58,237,0.15)" stroke-width="1"/>
  <text x="450" y="428" text-anchor="middle" font-size="9.5" fill="rgba(167,139,250,0.8)">Test any pattern's real-world execution time instantly with the ToolNest Regex Tester's timing display</text>

  <text x="450" y="454" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.2)">toolnestai.net/developer-tools/regex-tester</text>
</svg>
