<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0a0118"/>
      <stop offset="100%" stop-color="#05030d"/>
    </radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="20" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#22d3ee"/></marker>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="600" cy="200" r="280" fill="#0e7490" opacity="0.08" filter="url(#glow)"/>

  <text x="600" y="46" font-size="20" fill="#e2e2e2" font-weight="800" text-anchor="middle">GPS in Photos: What Your Images Reveal About You</text>
  <text x="600" y="66" font-size="13" fill="#4d4354" text-anchor="middle">Most smartphone photos embed precise GPS coordinates that travel with the file when shared</text>

  <!-- Map visualization -->
  <rect x="40" y="86" width="500" height="340" rx="12" fill="rgba(6,182,212,0.06)" stroke="rgba(6,182,212,0.2)" stroke-width="1"/>
  <!-- Grid lines (map) -->
  <g stroke="rgba(6,182,212,0.08)" stroke-width="0.5">
    <line x1="40" y1="140" x2="540" y2="140"/>
    <line x1="40" y1="194" x2="540" y2="194"/>
    <line x1="40" y1="248" x2="540" y2="248"/>
    <line x1="40" y1="302" x2="540" y2="302"/>
    <line x1="40" y1="356" x2="540" y2="356"/>
    <line x1="140" y1="86" x2="140" y2="426"/>
    <line x1="240" y1="86" x2="240" y2="426"/>
    <line x1="340" y1="86" x2="340" y2="426"/>
    <line x1="440" y1="86" x2="440" y2="426"/>
  </g>
  <!-- Map label -->
  <text x="290" y="110" font-size="10" fill="#4d4354" text-anchor="middle" letter-spacing="2">SATELLITE VIEW</text>
  <!-- Location pins -->
  <!-- Home -->
  <circle cx="230" cy="220" r="10" fill="#22d3ee" opacity="0.9"/>
  <circle cx="230" cy="220" r="20" fill="rgba(6,182,212,0.2)" stroke="rgba(6,182,212,0.4)" stroke-width="1"/>
  <text x="230" y="224" font-size="10" fill="white" text-anchor="middle" font-weight="700">H</text>
  <text x="230" y="254" font-size="9" fill="#22d3ee" text-anchor="middle">Home</text>

  <!-- Work -->
  <circle cx="380" cy="160" r="10" fill="#a78bfa" opacity="0.9"/>
  <circle cx="380" cy="160" r="20" fill="rgba(124,58,237,0.2)" stroke="rgba(124,58,237,0.4)" stroke-width="1"/>
  <text x="380" y="164" font-size="10" fill="white" text-anchor="middle" font-weight="700">W</text>
  <text x="380" y="194" font-size="9" fill="#a78bfa" text-anchor="middle">Office</text>

  <!-- School -->
  <circle cx="160" cy="330" r="10" fill="#fb923c" opacity="0.9"/>
  <circle cx="160" cy="330" r="20" fill="rgba(251,146,60,0.2)" stroke="rgba(251,146,60,0.4)" stroke-width="1"/>
  <text x="160" y="334" font-size="10" fill="white" text-anchor="middle" font-weight="700">S</text>
  <text x="160" y="364" font-size="9" fill="#fb923c" text-anchor="middle">School</text>

  <!-- Connecting lines -->
  <line x1="230" y1="220" x2="380" y2="160" stroke="rgba(124,58,237,0.3)" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="230" y1="220" x2="160" y2="330" stroke="rgba(251,146,60,0.3)" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Coordinates shown -->
  <rect x="58" y="380" width="464" height="34" rx="6" fill="rgba(0,0,0,0.4)"/>
  <text x="290" y="402" font-size="11" fill="#22d3ee" text-anchor="middle" font-family="ui-monospace,monospace">48° 51' 30.24" N, 2° 17' 40.2" E → 48.85840°, 2.29450°</text>

  <!-- Warning box -->
  <rect x="58" y="420" width="464" height="46" rx="6" fill="rgba(239,68,68,0.08)" stroke="rgba(239,68,68,0.2)" stroke-width="1"/>
  <text x="78" y="442" font-size="11" fill="#f87171" font-weight="600">⚠ Privacy risk:</text>
  <text x="78" y="458" font-size="11" fill="#7a6d84">Every photo you share on social media may reveal your exact location.</text>

  <!-- Right: explanation -->
  <text x="580" y="110" font-size="16" fill="#e2e2e2" font-weight="700">How GPS Gets Into Your Photos</text>

  <!-- Phone → photo pipeline -->
  <rect x="580" y="124" width="580" height="300" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <g font-size="12" fill="#7a6d84">
    <text x="600" y="158" fill="#22d3ee" font-weight="700" font-size="13">① GPS Capture</text>
    <text x="600" y="176">Phone GPS receiver determines coordinates to within 3–5 meters.</text>
    <text x="600" y="192">These are stored as rational numbers: degrees, minutes, seconds.</text>

    <line x1="600" y1="204" x2="600" y2="216" stroke="rgba(6,182,212,0.4)" stroke-width="1.5" marker-end="url(#arr)"/>

    <text x="600" y="234" fill="#a78bfa" font-weight="700" font-size="13">② EXIF GPS IFD Written</text>
    <text x="600" y="252">Camera app writes GPSLatitude, GPSLongitude, GPSAltitude,</text>
    <text x="600" y="268">GPSTimeStamp into the EXIF GPS sub-IFD of the JPEG file.</text>

    <line x1="600" y1="280" x2="600" y2="292" stroke="rgba(6,182,212,0.4)" stroke-width="1.5" marker-end="url(#arr)"/>

    <text x="600" y="310" fill="#fb923c" font-weight="700" font-size="13">③ File Shared (GPS Travels With It)</text>
    <text x="600" y="328">When you upload to WhatsApp, email, or a website, the GPS data</text>
    <text x="600" y="344">remains in the file unless the platform strips it (Instagram does;</text>
    <text x="600" y="360">many platforms do not).</text>

    <line x1="600" y1="372" x2="600" y2="384" stroke="rgba(6,182,212,0.4)" stroke-width="1.5" marker-end="url(#arr)"/>

    <text x="600" y="402" fill="#34d399" font-weight="700" font-size="13">④ Anyone Can Extract It</text>
    <text x="600" y="418">EXIF data is readable by any application, browser, or tool that</text>
    <text x="600" y="434" font-style="italic">opens the image file. It is not hidden or encrypted.</text>
  </g>

  <!-- Bottom: prevention -->
  <rect x="40" y="446" width="1120" height="142" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="600" y="472" font-size="14" fill="#e2e2e2" font-weight="700" text-anchor="middle">How to Prevent GPS Leaks</text>

  <g font-size="12" fill="#7a6d84">
    <text x="80" y="502" fill="#34d399" font-weight="600">✓ Remove metadata before sharing</text>
    <text x="80" y="520">Use the ToolNest AI Remove Metadata</text>
    <text x="80" y="536">tool to strip GPS and all EXIF in one click.</text>

    <text x="360" y="502" fill="#34d399" font-weight="600">✓ Disable GPS in camera settings</text>
    <text x="360" y="520">iOS: Settings → Privacy → Location → Camera</text>
    <text x="360" y="536">Android: Camera app → Settings → Location</text>

    <text x="680" y="502" fill="#34d399" font-weight="600">✓ Check before you share</text>
    <text x="680" y="520">Use the Image Metadata Viewer to inspect</text>
    <text x="680" y="536">any photo for GPS data before uploading.</text>

    <text x="960" y="502" fill="#34d399" font-weight="600">✓ Use platforms that auto-strip</text>
    <text x="960" y="520">Twitter/X and Instagram remove EXIF.</text>
    <text x="960" y="536">Flickr and direct file transfers often do not.</text>
  </g>
  <line x1="320" y1="458" x2="320" y2="578" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <line x1="640" y1="458" x2="640" y2="578" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <line x1="920" y1="458" x2="920" y2="578" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
</svg>
