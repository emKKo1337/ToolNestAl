<svg viewBox="0 0 900 470" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="bG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient>
  </defs>
  <rect width="900" height="470" fill="url(#bg)"/>
  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="900" fill="url(#aG)">How JPEG Compression Works</text>
  <text x="450" y="56" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.38)">The DCT algorithm and why quality settings matter</text>
  <rect x="28" y="74" width="844" height="120" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(124,58,237,0.2)" stroke-width="1"/>
  <text x="450" y="96" text-anchor="middle" font-size="10.5" font-weight="700" fill="rgba(167,139,250,0.85)">STEP 1: SPLIT INTO 8x8 PIXEL BLOCKS</text>
  <g font-size="9" fill="rgba(255,255,255,0.3)">
    <rect x="48" y="110" width="32" height="32" rx="2" fill="rgba(167,139,250,0.06)" stroke="rgba(167,139,250,0.2)" stroke-width="1"/>
    <rect x="84" y="110" width="32" height="32" rx="2" fill="rgba(167,139,250,0.06)" stroke="rgba(167,139,250,0.15)" stroke-width="1"/>
    <rect x="120" y="110" width="32" height="32" rx="2" fill="rgba(167,139,250,0.06)" stroke="rgba(167,139,250,0.15)" stroke-width="1"/>
    <rect x="156" y="110" width="32" height="32" rx="2" fill="rgba(167,139,250,0.06)" stroke="rgba(167,139,250,0.15)" stroke-width="1"/>
    <rect x="48" y="146" width="32" height="32" rx="2" fill="rgba(167,139,250,0.06)" stroke="rgba(167,139,250,0.15)" stroke-width="1"/>
    <rect x="84" y="146" width="32" height="32" rx="2" fill="rgba(103,232,249,0.12)" stroke="rgba(103,232,249,0.3)" stroke-width="1.5"/>
    <rect x="120" y="146" width="32" height="32" rx="2" fill="rgba(167,139,250,0.06)" stroke="rgba(167,139,250,0.15)" stroke-width="1"/>
    <rect x="156" y="146" width="32" height="32" rx="2" fill="rgba(167,139,250,0.06)" stroke="rgba(167,139,250,0.15)" stroke-width="1"/>
  </g>
  <text x="220" y="138" font-size="9" fill="rgba(255,255,255,0.45)">Each 8x8 block processed separately</text>
  <text x="220" y="158" font-size="9" fill="rgba(255,255,255,0.35)">Image is tiled into a grid of blocks</text>
  <text x="220" y="178" font-size="9" fill="rgba(255,255,255,0.35)">Highlighted block: currently being compressed</text>
  <rect x="28" y="206" width="844" height="100" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(14,116,144,0.2)" stroke-width="1"/>
  <text x="450" y="228" text-anchor="middle" font-size="10.5" font-weight="700" fill="rgba(103,232,249,0.85)">STEP 2: DISCRETE COSINE TRANSFORM (DCT)</text>
  <text x="450" y="250" text-anchor="middle" font-size="9.5" fill="rgba(255,255,255,0.55)">Each block's pixel values are transformed into frequency components.</text>
  <text x="450" y="268" text-anchor="middle" font-size="9.5" fill="rgba(255,255,255,0.55)">Low frequencies (gradual color changes) are more important to human vision.</text>
  <text x="450" y="286" text-anchor="middle" font-size="9.5" fill="rgba(255,255,255,0.55)">High frequencies (fine detail, sharp edges) can be safely discarded with less visible impact.</text>
  <rect x="28" y="318" width="420" height="90" rx="10" fill="rgba(251,191,36,0.06)" stroke="rgba(251,191,36,0.2)" stroke-width="1"/>
  <text x="238" y="340" text-anchor="middle" font-size="10" font-weight="700" fill="rgba(251,191,36,0.85)">LOW QUALITY (60%)</text>
  <text x="48" y="364" font-size="9.5" fill="rgba(255,255,255,0.5)">More high-freq detail discarded</text>
  <text x="48" y="382" font-size="9.5" fill="rgba(255,255,255,0.5)">Visible blocky artifacts at block boundaries</text>
  <text x="48" y="400" font-size="9.5" fill="rgba(239,68,68,0.7)">Much smaller file, lower quality</text>
  <rect x="452" y="318" width="420" height="90" rx="10" fill="rgba(52,211,153,0.06)" stroke="rgba(52,211,153,0.2)" stroke-width="1"/>
  <text x="662" y="340" text-anchor="middle" font-size="10" font-weight="700" fill="rgba(52,211,153,0.85)">HIGH QUALITY (85%)</text>
  <text x="472" y="364" font-size="9.5" fill="rgba(255,255,255,0.5)">Only imperceptible high-freq detail discarded</text>
  <text x="472" y="382" font-size="9.5" fill="rgba(255,255,255,0.5)">Artifacts invisible at normal viewing distances</text>
  <text x="472" y="400" font-size="9.5" fill="rgba(52,211,153,0.7)">Larger file, near-original visual quality</text>
  <text x="450" y="450" text-anchor="middle" font-size="9.5" fill="rgba(255,255,255,0.3)">Sweet spot: 75-85% quality gives 60-80% size reduction with minimal visible difference</text>
  <text x="450" y="464" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.2)">toolnestai.net/image-tools/image-compressor</text>
</svg>
