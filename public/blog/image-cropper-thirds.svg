<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
  </defs>
  <rect width="900" height="460" fill="url(#bg)"/>
  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="900" fill="url(#aG)">Rule of Thirds: How to Crop for Better Composition</text>
  <text x="450" y="56" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.38)">The most important crop guideline for visual impact</text>
  <rect x="28" y="72" width="420" height="280" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="238" y="94" text-anchor="middle" font-size="10" font-weight="700" fill="rgba(255,255,255,0.35)">BAD: SUBJECT CENTERED</text>
  <!-- Centered portrait grid mockup -->
  <rect x="88" y="108" width="300" height="225" rx="4" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <!-- subject in center -->
  <circle cx="238" cy="175" r="22" fill="rgba(167,139,250,0.25)" stroke="rgba(167,139,250,0.4)" stroke-width="1"/>
  <rect x="210" y="200" width="56" height="90" rx="4" fill="rgba(167,139,250,0.15)" stroke="rgba(167,139,250,0.3)" stroke-width="1"/>
  <line x1="138" y1="108" x2="138" y2="333" stroke="rgba(239,68,68,0.3)" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="188" y1="108" x2="188" y2="333" stroke="rgba(239,68,68,0.3)" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="238" y1="108" x2="238" y2="333" stroke="rgba(239,68,68,0.5)" stroke-width="2" stroke-dasharray="4,3"/>
  <line x1="288" y1="108" x2="288" y2="333" stroke="rgba(239,68,68,0.3)" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="338" y1="108" x2="338" y2="333" stroke="rgba(239,68,68,0.3)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="238" y="352" text-anchor="middle" font-size="8.5" fill="rgba(239,68,68,0.7)">Subject at center = static, less engaging</text>
  <rect x="452" y="72" width="420" height="280" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(52,211,153,0.18)" stroke-width="1"/>
  <text x="662" y="94" text-anchor="middle" font-size="10" font-weight="700" fill="rgba(52,211,153,0.7)">GOOD: RULE OF THIRDS</text>
  <!-- Thirds grid -->
  <rect x="512" y="108" width="300" height="225" rx="4" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <line x1="612" y1="108" x2="612" y2="333" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <line x1="712" y1="108" x2="712" y2="333" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <line x1="512" y1="183" x2="812" y2="183" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <line x1="512" y1="258" x2="812" y2="258" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <!-- Subject at power point (upper-left third intersection) -->
  <circle cx="612" cy="183" r="22" fill="rgba(52,211,153,0.25)" stroke="rgba(52,211,153,0.5)" stroke-width="1.5"/>
  <rect x="584" y="208" width="56" height="90" rx="4" fill="rgba(52,211,153,0.15)" stroke="rgba(52,211,153,0.3)" stroke-width="1"/>
  <!-- Power point circles -->
  <circle cx="612" cy="183" r="6" fill="rgba(52,211,153,0.7)" stroke="rgba(52,211,153,0.9)" stroke-width="1"/>
  <circle cx="712" cy="183" r="5" fill="rgba(52,211,153,0.4)" stroke="rgba(52,211,153,0.5)" stroke-width="1"/>
  <circle cx="612" cy="258" r="5" fill="rgba(52,211,153,0.4)" stroke="rgba(52,211,153,0.5)" stroke-width="1"/>
  <circle cx="712" cy="258" r="5" fill="rgba(52,211,153,0.4)" stroke="rgba(52,211,153,0.5)" stroke-width="1"/>
  <text x="662" y="352" text-anchor="middle" font-size="8.5" fill="rgba(52,211,153,0.7)">Subject at power point = dynamic, engaging</text>
  <rect x="28" y="368" width="844" height="72" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="450" y="390" text-anchor="middle" font-size="10" font-weight="700" fill="rgba(167,139,250,0.85)">THE RULE OF THIRDS</text>
  <text x="450" y="412" text-anchor="middle" font-size="9.5" fill="rgba(255,255,255,0.55)">Divide the image into a 3x3 grid. Place important subjects at the intersections (power points) or along the lines.</text>
  <text x="450" y="432" text-anchor="middle" font-size="9.5" fill="rgba(255,255,255,0.4)">This creates visual tension and balance that a centered composition lacks. Most image croppers overlay this grid.</text>
  <text x="450" y="450" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.2)">toolnestai.net/image-tools/image-cropper</text>
</svg>
