<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="30%" cy="40%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <radialGradient id="gL" cx="15%" cy="50%" r="55%"><stop offset="0%" stop-color="#5b21b6" stop-opacity="0.45"/><stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/></radialGradient>
    <radialGradient id="gR" cx="85%" cy="50%" r="55%"><stop offset="0%" stop-color="#0e7490" stop-opacity="0.28"/><stop offset="100%" stop-color="#0e7490" stop-opacity="0"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="bG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient>
    <linearGradient id="lapG" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1a1040"/><stop offset="100%" stop-color="#0d0824"/></linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#5b21b6" flood-opacity="0.5"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="180" cy="315" rx="600" ry="500" fill="url(#gL)"/>
  <ellipse cx="1020" cy="315" rx="600" ry="500" fill="url(#gR)"/>
  <text x="60" y="70" font-size="14" font-weight="700" fill="url(#aG)" filter="url(#glow)">ToolNest AI</text>
  <text x="60" y="106" font-size="13" fill="rgba(255,255,255,0.35)">Image Tools - Image to Base64</text>
  <text x="60" y="185" font-size="46" font-weight="900" fill="url(#aG)" filter="url(#glow)">Image to</text>
  <text x="60" y="245" font-size="46" font-weight="900" fill="url(#aG)" filter="url(#glow)">Base64</text>
  <text x="60" y="300" font-size="18" fill="rgba(255,255,255,0.6)">Encode any image as Base64 string</text>
  <text x="60" y="328" font-size="18" fill="rgba(255,255,255,0.6)">Data URI, CSS, HTML — instant copy</text>
  <g>
    <rect x="60" y="358" width="120" height="52" rx="8" fill="rgba(124,58,237,0.2)" stroke="rgba(124,58,237,0.4)" stroke-width="1"/>
    <text x="120" y="382" text-anchor="middle" font-size="11" font-weight="900" fill="#a78bfa">Data URI</text>
    <text x="120" y="400" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">use inline</text>
    <rect x="192" y="358" width="120" height="52" rx="8" fill="rgba(14,116,144,0.15)" stroke="rgba(14,116,144,0.35)" stroke-width="1"/>
    <text x="252" y="382" text-anchor="middle" font-size="11" font-weight="900" fill="#67e8f9">CSS bg</text>
    <text x="252" y="400" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">url(data:...)</text>
    <rect x="324" y="358" width="100" height="52" rx="8" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
    <text x="374" y="382" text-anchor="middle" font-size="11" font-weight="900" fill="#34d399">JSON</text>
    <text x="374" y="400" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">API payloads</text>
    <rect x="436" y="358" width="100" height="52" rx="8" fill="rgba(251,191,36,0.1)" stroke="rgba(251,191,36,0.25)" stroke-width="1"/>
    <text x="486" y="382" text-anchor="middle" font-size="11" font-weight="900" fill="#fbbf24">Email</text>
    <text x="486" y="400" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">inline images</text>
  </g>
  <text x="60" y="560" font-size="14" fill="rgba(255,255,255,0.25)">toolnestai.net/image-tools/image-to-base64</text>
  <!-- Laptop UI -->
  <rect x="630" y="60" width="530" height="490" rx="16" fill="url(#lapG)" stroke="rgba(124,58,237,0.3)" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="630" y="60" width="530" height="36" rx="16" fill="rgba(255,255,255,0.05)"/>
  <rect x="630" y="78" width="530" height="18" fill="rgba(255,255,255,0.02)"/>
  <circle cx="655" cy="78" r="6" fill="rgba(239,68,68,0.6)"/>
  <circle cx="675" cy="78" r="6" fill="rgba(251,191,36,0.6)"/>
  <circle cx="695" cy="78" r="6" fill="rgba(34,197,94,0.6)"/>
  <!-- Image input area -->
  <rect x="648" y="108" width="220" height="150" rx="8" fill="rgba(124,58,237,0.08)" stroke="rgba(124,58,237,0.2)" stroke-width="1"/>
  <text x="758" y="186" text-anchor="middle" font-size="11" fill="rgba(167,139,250,0.6)">📷 Drop image here</text>
  <!-- Arrow -->
  <text x="897" y="190" text-anchor="middle" font-size="18" fill="rgba(255,255,255,0.3)">→</text>
  <!-- Base64 output -->
  <rect x="922" y="108" width="220" height="150" rx="8" fill="rgba(52,211,153,0.06)" stroke="rgba(52,211,153,0.18)" stroke-width="1"/>
  <text x="932" y="126" font-size="7" fill="rgba(52,211,153,0.7)" font-family="monospace">data:image/png;base64,</text>
  <text x="932" y="140" font-size="6.5" fill="rgba(255,255,255,0.35)" font-family="monospace">iVBORw0KGgoAAAANSUhE</text>
  <text x="932" y="152" font-size="6.5" fill="rgba(255,255,255,0.35)" font-family="monospace">UgAAAQAAAAEACAYAAABc</text>
  <text x="932" y="164" font-size="6.5" fill="rgba(255,255,255,0.35)" font-family="monospace">cvqrhAAAAAXNSR0IArs4c</text>
  <text x="932" y="176" font-size="6.5" fill="rgba(255,255,255,0.35)" font-family="monospace">6QAAAARnQU1BAACxjwv8</text>
  <text x="932" y="188" font-size="6.5" fill="rgba(255,255,255,0.35)" font-family="monospace">YQUAAAAJcEhZcwAADsMw</text>
  <text x="932" y="200" font-size="6.5" fill="rgba(255,255,255,0.35)" font-family="monospace">AAnGHgAAHrGAAgMBNgAA</text>
  <text x="932" y="212" font-size="6.5" fill="rgba(255,255,255,0.35)" font-family="monospace">AAAB...</text>
  <text x="1032" y="248" text-anchor="middle" font-size="9" fill="rgba(52,211,153,0.6)">123.4 KB string</text>
  <!-- Format tabs -->
  <g text-anchor="middle" font-size="9.5">
    <rect x="648" y="270" width="106" height="30" rx="6" fill="url(#bG)"/>
    <text x="701" y="289" fill="#fff" font-weight="700">Data URI</text>
    <rect x="762" y="270" width="106" height="30" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="815" y="289" fill="rgba(255,255,255,0.5)">CSS bg</text>
    <rect x="876" y="270" width="106" height="30" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="929" y="289" fill="rgba(255,255,255,0.5)">Raw Base64</text>
    <rect x="990" y="270" width="142" height="30" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="1061" y="289" fill="rgba(255,255,255,0.5)">img src attr</text>
  </g>
  <!-- Copy button -->
  <rect x="648" y="312" width="506" height="42" rx="8" fill="url(#bG)" filter="url(#sh)"/>
  <text x="901" y="338" text-anchor="middle" font-size="13" font-weight="900" fill="#fff">Copy Base64 String</text>
  <!-- Size warning -->
  <rect x="648" y="366" width="506" height="36" rx="8" fill="rgba(251,191,36,0.08)" stroke="rgba(251,191,36,0.18)" stroke-width="1"/>
  <text x="660" y="384" font-size="9" fill="rgba(251,191,36,0.8)">⚠ File size increases ~33% when encoded as Base64 — consider this before inlining large images</text>
  <rect x="620" y="550" width="560" height="14" rx="4" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
</svg>
