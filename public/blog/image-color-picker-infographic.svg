<svg viewBox="0 0 900 1200" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <radialGradient id="gT" cx="50%" cy="10%" r="60%"><stop offset="0%" stop-color="#5b21b6" stop-opacity="0.35"/><stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/></radialGradient>
    <radialGradient id="gB" cx="50%" cy="90%" r="60%"><stop offset="0%" stop-color="#0e7490" stop-opacity="0.2"/><stop offset="100%" stop-color="#0e7490" stop-opacity="0"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
  </defs>
  <rect width="900" height="1200" fill="url(#bg)"/>
  <ellipse cx="450" cy="200" rx="700" ry="400" fill="url(#gT)"/>
  <ellipse cx="450" cy="1000" rx="700" ry="400" fill="url(#gB)"/>
  <text x="450" y="52" text-anchor="middle" font-size="26" font-weight="900" fill="url(#aG)">Image Color Picker Complete Guide</text>
  <text x="450" y="76" text-anchor="middle" font-size="13" fill="rgba(255,255,255,0.38)">HEX, RGB, HSL, CMYK — color spaces and when to use each</text>
  <text x="450" y="96" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.22)">toolnestai.net/image-tools/image-color-picker</text>

  <rect x="32" y="112" width="836" height="38" rx="8" fill="rgba(124,58,237,0.18)" stroke="rgba(124,58,237,0.3)" stroke-width="1"/>
  <text x="450" y="136" text-anchor="middle" font-size="15" font-weight="800" fill="#a78bfa">01 — Color Format Quick Reference</text>
  <g font-size="9.5" text-anchor="middle">
    <rect x="32" y="156" width="192" height="80" rx="8" fill="rgba(167,139,250,0.08)" stroke="rgba(167,139,250,0.2)" stroke-width="1"/>
    <text x="128" y="178" font-weight="700" fill="#a78bfa">HEX #RRGGBB</text>
    <text x="128" y="196" fill="rgba(255,255,255,0.5)">CSS, HTML, web dev</text>
    <text x="128" y="214" fill="rgba(255,255,255,0.5)">copy-paste workflow</text>
    <rect x="236" y="156" width="192" height="80" rx="8" fill="rgba(103,232,249,0.06)" stroke="rgba(103,232,249,0.18)" stroke-width="1"/>
    <text x="332" y="178" font-weight="700" fill="#67e8f9">RGB(r,g,b)</text>
    <text x="332" y="196" fill="rgba(255,255,255,0.5)">Code, digital, screens</text>
    <text x="332" y="214" fill="rgba(255,255,255,0.5)">channel tweaking</text>
    <rect x="440" y="156" width="192" height="80" rx="8" fill="rgba(52,211,153,0.06)" stroke="rgba(52,211,153,0.18)" stroke-width="1"/>
    <text x="536" y="178" font-weight="700" fill="#6ee7b7">HSL(h,s%,l%)</text>
    <text x="536" y="196" fill="rgba(255,255,255,0.5)">Design systems</text>
    <text x="536" y="214" fill="rgba(255,255,255,0.5)">tints and shades</text>
    <rect x="644" y="156" width="224" height="80" rx="8" fill="rgba(251,191,36,0.06)" stroke="rgba(251,191,36,0.18)" stroke-width="1"/>
    <text x="756" y="178" font-weight="700" fill="#fbbf24">CMYK(c,m,y,k)</text>
    <text x="756" y="196" fill="rgba(255,255,255,0.5)">Print, press, InDesign</text>
    <text x="756" y="214" fill="rgba(255,255,255,0.5)">physical ink mixing</text>
  </g>

  <rect x="32" y="250" width="836" height="38" rx="8" fill="rgba(14,116,144,0.18)" stroke="rgba(14,116,144,0.3)" stroke-width="1"/>
  <text x="450" y="274" text-anchor="middle" font-size="15" font-weight="800" fill="#67e8f9">02 — HSL: The Designer's Color Space</text>
  <g font-size="9.5">
    <rect x="32" y="294" width="836" height="90" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="48" y="314" font-weight="700" fill="rgba(52,211,153,0.8)">Hue (0-360°):</text><text x="150" y="314" fill="rgba(255,255,255,0.5)"> The color angle — 0°=red, 120°=green, 240°=blue, 180°=cyan, 60°=yellow</text>
    <text x="48" y="334" font-weight="700" fill="rgba(52,211,153,0.8)">Saturation (0-100%):</text><text x="202" y="334" fill="rgba(255,255,255,0.5)"> Vividness — 0%=grey, 100%=fully vivid. Reduce for muted/pastel tones</text>
    <text x="48" y="354" font-weight="700" fill="rgba(52,211,153,0.8)">Lightness (0-100%):</text><text x="196" y="354" fill="rgba(255,255,255,0.5)"> Brightness — 0%=black, 50%=normal, 100%=white. Adjust for tints and shades</text>
    <text x="48" y="374" fill="rgba(255,255,255,0.4)">To create a scale: keep H and S constant, vary L from 10% (dark) to 90% (light)</text>
  </g>

  <rect x="32" y="398" width="836" height="38" rx="8" fill="rgba(239,68,68,0.12)" stroke="rgba(239,68,68,0.22)" stroke-width="1"/>
  <text x="450" y="422" text-anchor="middle" font-size="15" font-weight="800" fill="rgba(239,68,68,0.85)">03 — Dominant Color Extraction</text>
  <g font-size="9.5">
    <rect x="32" y="442" width="836" height="80" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="450" y="464" text-anchor="middle" fill="rgba(255,255,255,0.5)">Pixels sampled → k-means clustering groups similar RGB colors → clusters ranked by pixel count</text>
    <text x="450" y="484" text-anchor="middle" fill="rgba(255,255,255,0.5)">Result: dominant palette showing the colors that appear most in the image</text>
    <text x="450" y="504" text-anchor="middle" fill="rgba(255,255,255,0.35)">Use case: brand color extraction, CSS variable generation, design inspiration from photos</text>
  </g>

  <rect x="32" y="536" width="836" height="38" rx="8" fill="rgba(124,58,237,0.18)" stroke="rgba(124,58,237,0.3)" stroke-width="1"/>
  <text x="450" y="560" text-anchor="middle" font-size="15" font-weight="800" fill="#a78bfa">04 — Color Picking with Canvas API</text>
  <g font-size="9">
    <rect x="32" y="580" width="836" height="110" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="48" y="600" font-weight="700" fill="rgba(255,255,255,0.4)">JavaScript</text>
    <text x="48" y="618" fill="#a78bfa">const</text><text x="74" y="618" fill="rgba(255,255,255,0.65)"> ctx = canvas.getContext(</text><text x="236" y="618" fill="#6ee7b7">'2d'</text><text x="262" y="618" fill="rgba(255,255,255,0.65)">);</text>
    <text x="48" y="636" fill="rgba(255,255,255,0.65)">ctx.drawImage(img, 0, 0);</text>
    <text x="48" y="654" fill="#a78bfa">const</text><text x="74" y="654" fill="rgba(255,255,255,0.65)"> [r, g, b, a] = ctx.getImageData(x, y, 1, 1).data;</text>
    <text x="48" y="672" fill="#a78bfa">const</text><text x="74" y="672" fill="rgba(255,255,255,0.65)"> hex = </text><text x="112" y="672" fill="#6ee7b7">`#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`</text><text x="560" y="672" fill="rgba(255,255,255,0.65)">;</text>
  </g>

  <rect x="32" y="704" width="836" height="38" rx="8" fill="rgba(16,185,129,0.14)" stroke="rgba(16,185,129,0.25)" stroke-width="1"/>
  <text x="450" y="728" text-anchor="middle" font-size="15" font-weight="800" fill="#34d399">05 — When to Use Which Format</text>
  <g text-anchor="middle" font-size="9.5">
    <rect x="32" y="748" width="270" height="90" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    <text x="167" y="770" font-weight="700" fill="rgba(167,139,250,0.85)">CSS / Web development</text>
    <text x="167" y="790" fill="rgba(255,255,255,0.5)">HEX for brevity</text>
    <text x="167" y="810" fill="rgba(255,255,255,0.5)">RGB/A for opacity control</text>
    <text x="167" y="828" fill="rgba(255,255,255,0.35)">HSL for dynamic theming</text>

    <rect x="315" y="748" width="270" height="90" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    <text x="450" y="770" font-weight="700" fill="rgba(103,232,249,0.85)">Design systems / Figma</text>
    <text x="450" y="790" fill="rgba(255,255,255,0.5)">HSL for building scales</text>
    <text x="450" y="810" fill="rgba(255,255,255,0.5)">HEX for token values</text>
    <text x="450" y="828" fill="rgba(255,255,255,0.35)">RGB for display colors</text>

    <rect x="598" y="748" width="270" height="90" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    <text x="733" y="770" font-weight="700" fill="rgba(52,211,153,0.85)">Print / press work</text>
    <text x="733" y="790" fill="rgba(255,255,255,0.5)">CMYK always</text>
    <text x="733" y="810" fill="rgba(255,255,255,0.5)">Convert from sRGB</text>
    <text x="733" y="828" fill="rgba(255,255,255,0.35)">using ICC color profiles</text>
  </g>

  <text x="450" y="960" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.28)">Free tool: toolnestai.net/image-tools/image-color-picker</text>
  <text x="450" y="980" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.2)">Pick any pixel — get HEX, RGB, HSL, CMYK — extract dominant palette</text>
</svg>
