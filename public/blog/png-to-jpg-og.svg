<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="30%" cy="40%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <radialGradient id="gL" cx="15%" cy="50%" r="55%"><stop offset="0%" stop-color="#5b21b6" stop-opacity="0.45"/><stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/></radialGradient>
    <radialGradient id="gR" cx="85%" cy="50%" r="55%"><stop offset="0%" stop-color="#0e7490" stop-opacity="0.28"/><stop offset="100%" stop-color="#0e7490" stop-opacity="0"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="bG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient>
    <linearGradient id="lapG" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1a1040"/><stop offset="100%" stop-color="#0d0824"/></linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#5b21b6" flood-opacity="0.5"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="180" cy="315" rx="600" ry="500" fill="url(#gL)"/>
  <ellipse cx="1020" cy="315" rx="600" ry="500" fill="url(#gR)"/>
  <text x="60" y="70" font-size="14" font-weight="700" fill="url(#aG)" filter="url(#glow)">ToolNest AI</text>
  <text x="60" y="106" font-size="13" fill="rgba(255,255,255,0.35)">Image Tools - PNG to JPG</text>
  <text x="60" y="185" font-size="46" font-weight="900" fill="url(#aG)" filter="url(#glow)">PNG to JPG</text>
  <text x="60" y="245" font-size="46" font-weight="900" fill="url(#aG)" filter="url(#glow)">Converter</text>
  <text x="60" y="300" font-size="18" fill="rgba(255,255,255,0.6)">Reduce file size up to 90%</text>
  <text x="60" y="328" font-size="18" fill="rgba(255,255,255,0.6)">Adjustable quality - Free, instant</text>
  <rect x="60" y="358" width="110" height="52" rx="8" fill="rgba(124,58,237,0.2)" stroke="rgba(124,58,237,0.4)" stroke-width="1"/>
  <text x="115" y="382" text-anchor="middle" font-size="20" font-weight="900" fill="#a78bfa">90%</text>
  <text x="115" y="400" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">size reduction</text>
  <rect x="182" y="358" width="130" height="52" rx="8" fill="rgba(239,68,68,0.12)" stroke="rgba(239,68,68,0.28)" stroke-width="1"/>
  <text x="247" y="382" text-anchor="middle" font-size="12" font-weight="900" fill="#f87171">Alpha lost</text>
  <text x="247" y="400" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">transparency fills</text>
  <rect x="324" y="358" width="110" height="52" rx="8" fill="rgba(251,191,36,0.1)" stroke="rgba(251,191,36,0.25)" stroke-width="1"/>
  <text x="379" y="382" text-anchor="middle" font-size="20" font-weight="900" fill="#fbbf24">Free</text>
  <text x="379" y="400" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">no account</text>
  <text x="60" y="560" font-size="14" fill="rgba(255,255,255,0.25)">toolnestai.net/image-tools/png-to-jpg</text>
  <rect x="630" y="60" width="530" height="490" rx="16" fill="url(#lapG)" stroke="rgba(124,58,237,0.3)" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="630" y="60" width="530" height="36" rx="16" fill="rgba(255,255,255,0.05)"/>
  <rect x="630" y="78" width="530" height="18" fill="rgba(255,255,255,0.02)"/>
  <circle cx="655" cy="78" r="6" fill="rgba(239,68,68,0.6)"/>
  <circle cx="675" cy="78" r="6" fill="rgba(251,191,36,0.6)"/>
  <circle cx="695" cy="78" r="6" fill="rgba(34,197,94,0.6)"/>
  <rect x="642" y="108" width="230" height="140" rx="8" fill="rgba(52,211,153,0.06)" stroke="rgba(52,211,153,0.2)" stroke-width="1"/>
  <text x="757" y="130" text-anchor="middle" font-size="9" fill="rgba(52,211,153,0.6)">INPUT: PNG</text>
  <text x="757" y="178" text-anchor="middle" font-size="30" font-weight="900" fill="rgba(110,231,183,0.8)">.png</text>
  <text x="757" y="204" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.4)">Lossless, 3.4 MB</text>
  <text x="882" y="183" text-anchor="middle" font-size="22" fill="rgba(255,255,255,0.3)">-&gt;</text>
  <rect x="918" y="108" width="230" height="140" rx="8" fill="rgba(251,191,36,0.06)" stroke="rgba(251,191,36,0.22)" stroke-width="1.5"/>
  <text x="1033" y="130" text-anchor="middle" font-size="9" fill="rgba(251,191,36,0.6)">OUTPUT: JPG</text>
  <text x="1033" y="178" text-anchor="middle" font-size="30" font-weight="900" fill="rgba(251,191,36,0.9)">.jpg</text>
  <text x="1033" y="204" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">Lossy, 680 KB</text>
  <text x="1033" y="224" text-anchor="middle" font-size="12" font-weight="700" fill="#34d399">80% smaller</text>
  <rect x="642" y="268" width="506" height="40" rx="8" fill="rgba(239,68,68,0.05)" stroke="rgba(239,68,68,0.18)" stroke-width="1"/>
  <text x="895" y="286" text-anchor="middle" font-size="9" font-weight="700" fill="rgba(239,68,68,0.8)">Transparency will be lost — choose a background fill color</text>
  <text x="895" y="302" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.35)">If transparency matters, use lossy WebP instead</text>
  <rect x="642" y="322" width="506" height="42" rx="8" fill="url(#bG)" filter="url(#sh)"/>
  <text x="895" y="348" text-anchor="middle" font-size="13" font-weight="900" fill="#fff">Convert PNG to JPG</text>
  <rect x="620" y="550" width="560" height="14" rx="4" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
</svg>
