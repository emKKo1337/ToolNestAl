    <text x="122" y="390" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">most accurate</text>
    <rect x="195" y="348" width="125" height="52" rx="8" fill="rgba(14,116,144,0.15)" stroke="rgba(14,116,144,0.35)" stroke-width="1"/>
    <text x="257" y="372" text-anchor="middle" font-size="11" font-weight="900" fill="#67e8f9">Average</text>
    <text x="257" y="390" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">simple R+G+B/3</text>
    <rect x="330" y="348" width="125" height="52" rx="8" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
    <text x="392" y="372" text-anchor="middle" font-size="11" font-weight="900" fill="#34d399">Channel</text>
    <text x="392" y="390" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">R / G / B only</text>
    <rect x="465" y="348" width="95" height="52" rx="8" fill="rgba(251,191,36,0.1)" stroke="rgba(251,191,36,0.25)" stroke-width="1"/>
    <text x="512" y="372" text-anchor="middle" font-size="11" font-weight="900" fill="#fbbf24">Private</text>
    <text x="512" y="390" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">no upload</text>
  </g>
  <text x="60" y="555" font-size="14" fill="rgba(255,255,255,0.25)">toolnestai.net/image-tools/grayscale-converter</text>
