  <!-- Formula -->
  <rect x="648" y="330" width="490" height="40" rx="6" fill="rgba(167,139,250,0.05)" stroke="rgba(167,139,250,0.12)" stroke-width="1"/>
  <text x="893" y="350" text-anchor="middle" font-size="9.5" font-family="monospace" fill="rgba(167,139,250,0.75)">L = 0.2126R + 0.7152G + 0.0722B</text>
  <text x="893" y="364" text-anchor="middle" font-size="8.5" fill="rgba(255,255,255,0.25)">ITU-R BT.709 luminance formula</text>
  <rect x="648" y="386" width="242" height="36" rx="8" fill="url(#bG)" filter="url(#sh)"/>
  <text x="769" y="408" text-anchor="middle" font-size="12" font-weight="900" fill="#fff">Download Grayscale</text>
  <rect x="902" y="386" width="236" height="36" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="1020" y="408" text-anchor="middle" font-size="12" font-weight="700" fill="rgba(255,255,255,0.5)">Reset</text>
  <rect x="620" y="550" width="560" height="14" rx="4" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
