  <rect x="630" y="60" width="530" height="490" rx="16" fill="url(#lapG)" stroke="rgba(124,58,237,0.3)" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="630" y="60" width="530" height="36" rx="16" fill="rgba(255,255,255,0.05)"/>
  <rect x="630" y="78" width="530" height="18" fill="rgba(255,255,255,0.02)"/>
  <circle cx="655" cy="78" r="6" fill="rgba(239,68,68,0.6)"/>
  <circle cx="675" cy="78" r="6" fill="rgba(251,191,36,0.6)"/>
  <circle cx="695" cy="78" r="6" fill="rgba(34,197,94,0.6)"/>
  <!-- Color image panel -->
  <rect x="648" y="108" width="228" height="150" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="762" y="124" text-anchor="middle" font-size="8.5" fill="rgba(255,255,255,0.3)">Color</text>
  <rect x="658" y="132" width="70" height="110" rx="4" fill="#c0392b" opacity="0.7"/>
  <rect x="736" y="132" width="70" height="110" rx="4" fill="#27ae60" opacity="0.7"/>
  <rect x="814" y="132" width="52" height="110" rx="4" fill="#2980b9" opacity="0.7"/>
  <!-- Grayscale image panel -->
  <rect x="894" y="108" width="228" height="150" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(52,211,153,0.18)" stroke-width="1"/>
  <text x="1008" y="124" text-anchor="middle" font-size="8.5" fill="rgba(52,211,153,0.4)">Grayscale (Luminance)</text>
  <rect x="904" y="132" width="70" height="110" rx="4" fill="#5a5a5a" opacity="0.85"/>
  <rect x="982" y="132" width="70" height="110" rx="4" fill="#9a9a9a" opacity="0.85"/>
  <rect x="1060" y="132" width="52" height="110" rx="4" fill="#4a4a4a" opacity="0.85"/>
  <!-- Method selector -->
  <text x="648" y="282" font-size="9" fill="rgba(255,255,255,0.3)">Grayscale Method</text>
  <g font-size="9" text-anchor="middle">
    <rect x="648" y="288" width="108" height="24" rx="5" fill="url(#bG)"/>
    <text x="702" y="304" fill="#fff" font-weight="700">Luminance</text>
    <rect x="762" y="288" width="80" height="24" rx="5" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    <text x="802" y="304" fill="rgba(255,255,255,0.4)">Average</text>
    <rect x="848" y="288" width="80" height="24" rx="5" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    <text x="888" y="304" fill="rgba(255,255,255,0.4)">Luma BT.601</text>
    <rect x="934" y="288" width="80" height="24" rx="5" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    <text x="974" y="304" fill="rgba(255,255,255,0.4)">Channel R</text>
