<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="30%" cy="40%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <radialGradient id="gL" cx="15%" cy="50%" r="55%"><stop offset="0%" stop-color="#5b21b6" stop-opacity="0.4"/><stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/></radialGradient>
    <radialGradient id="gR" cx="85%" cy="50%" r="55%"><stop offset="0%" stop-color="#0d9488" stop-opacity="0.25"/><stop offset="100%" stop-color="#0d9488" stop-opacity="0"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="bG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient>
    <linearGradient id="lapG" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1a1040"/><stop offset="100%" stop-color="#0d0824"/></linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#5b21b6" flood-opacity="0.45"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="180" cy="315" rx="600" ry="500" fill="url(#gL)"/>
  <ellipse cx="1020" cy="315" rx="600" ry="500" fill="url(#gR)"/>

  <!-- Left -->
  <text x="60" y="70" font-size="14" font-weight="700" fill="url(#aG)" filter="url(#glow)">ToolNest AI</text>
  <text x="60" y="106" font-size="13" fill="rgba(255,255,255,0.35)">Developer Tools › JSON Formatter</text>
  <text x="60" y="180" font-size="52" font-weight="900" fill="url(#aG)" filter="url(#glow)">JSON</text>
  <text x="60" y="240" font-size="52" font-weight="900" fill="url(#aG)" filter="url(#glow)">Formatter</text>
  <text x="60" y="295" font-size="18" fill="rgba(255,255,255,0.6)">Format, validate &amp; minify JSON</text>
  <text x="60" y="323" font-size="18" fill="rgba(255,255,255,0.6)">instantly — free, no sign-up</text>

  <!-- Pills -->
  <rect x="60" y="357" width="118" height="28" rx="14" fill="rgba(124,58,237,0.25)" stroke="rgba(124,58,237,0.5)" stroke-width="1"/>
  <text x="119" y="375" text-anchor="middle" font-size="11" fill="rgba(167,139,250,0.9)">Syntax Check</text>
  <rect x="190" y="357" width="100" height="28" rx="14" fill="rgba(13,148,136,0.2)" stroke="rgba(13,148,136,0.4)" stroke-width="1"/>
  <text x="240" y="375" text-anchor="middle" font-size="11" fill="rgba(94,234,212,0.9)">Minify</text>
  <rect x="302" y="357" width="100" height="28" rx="14" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.35)" stroke-width="1"/>
  <text x="352" y="375" text-anchor="middle" font-size="11" fill="rgba(52,211,153,0.9)">Beautify</text>
  <rect x="60" y="397" width="110" height="28" rx="14" fill="rgba(251,191,36,0.12)" stroke="rgba(251,191,36,0.3)" stroke-width="1"/>
  <text x="115" y="415" text-anchor="middle" font-size="11" fill="rgba(251,191,36,0.9)">Tree View</text>
  <rect x="182" y="397" width="120" height="28" rx="14" fill="rgba(124,58,237,0.2)" stroke="rgba(124,58,237,0.4)" stroke-width="1"/>
  <text x="242" y="415" text-anchor="middle" font-size="11" fill="rgba(167,139,250,0.9)">Copy Output</text>

  <text x="60" y="560" font-size="14" fill="rgba(255,255,255,0.25)">toolnestai.net/developer-tools/json-formatter</text>

  <!-- Right — editor mockup -->
  <rect x="620" y="55" width="540" height="490" rx="16" fill="url(#lapG)" stroke="rgba(124,58,237,0.3)" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="620" y="55" width="540" height="36" rx="16" fill="rgba(255,255,255,0.05)"/>
  <rect x="620" y="73" width="540" height="18" fill="rgba(255,255,255,0.02)"/>
  <circle cx="645" cy="73" r="6" fill="rgba(239,68,68,0.6)"/>
  <circle cx="665" cy="73" r="6" fill="rgba(251,191,36,0.6)"/>
  <circle cx="685" cy="73" r="6" fill="rgba(34,197,94,0.6)"/>
  <rect x="710" y="64" width="370" height="18" rx="9" fill="rgba(255,255,255,0.06)"/>
  <text x="895" y="76" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.3)">toolnestai.net/developer-tools/json-formatter</text>

  <!-- Action buttons -->
  <rect x="632" y="100" width="516" height="32" rx="8" fill="rgba(255,255,255,0.025)"/>
  <rect x="640" y="108" width="76" height="16" rx="4" fill="url(#bG)"/>
  <text x="678" y="119" text-anchor="middle" font-size="8" font-weight="700" fill="#fff">Format</text>
  <rect x="724" y="108" width="76" height="16" rx="4" fill="rgba(255,255,255,0.07)"/>
  <text x="762" y="119" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.6)">Minify</text>
  <rect x="808" y="108" width="76" height="16" rx="4" fill="rgba(255,255,255,0.07)"/>
  <text x="846" y="119" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.6)">Validate</text>
  <rect x="892" y="108" width="76" height="16" rx="4" fill="rgba(255,255,255,0.07)"/>
  <text x="930" y="119" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.6)">Clear</text>
  <rect x="976" y="108" width="76" height="16" rx="4" fill="rgba(255,255,255,0.07)"/>
  <text x="1014" y="119" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.6)">⎘ Copy</text>

  <!-- Split editor panes -->
  <!-- Left pane - raw -->
  <rect x="632" y="138" width="250" height="340" rx="6" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="640" y="153" font-size="8" font-weight="700" fill="rgba(255,255,255,0.3)" letter-spacing="1">INPUT</text>
  <g font-family="monospace" font-size="8" fill="rgba(255,255,255,0.5)">
    <text x="640" y="170">{"user":{"id":1,"name":"Alice","email":</text>
    <text x="640" y="184">"alice@example.com","role":"admin","created</text>
    <text x="640" y="198">At":"2026-01-15","settings":{"theme":"dark",</text>
    <text x="640" y="212">"notifications":true,"language":"en"},"tags"</text>
    <text x="640" y="226">:["developer","admin"],"active":true}}</text>
  </g>
  <text x="757" y="460" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.2)">Raw / minified JSON</text>

  <!-- Arrow -->
  <text x="892" y="312" text-anchor="middle" font-size="20" fill="url(#aG)">→</text>

  <!-- Right pane - formatted -->
  <rect x="900" y="138" width="244" height="340" rx="6" fill="rgba(0,0,0,0.35)" stroke="rgba(124,58,237,0.2)" stroke-width="1"/>
  <text x="908" y="153" font-size="8" font-weight="700" fill="rgba(167,139,250,0.5)" letter-spacing="1">FORMATTED OUTPUT</text>
  <g font-family="monospace" font-size="8">
    <text x="908" y="170" fill="rgba(255,255,255,0.7)">{</text>
    <text x="916" y="185" fill="rgba(167,139,250,0.8)">"user"</text><text x="960" y="185" fill="rgba(255,255,255,0.5)">: {</text>
    <text x="924" y="200" fill="rgba(167,139,250,0.8)">"id"</text><text x="956" y="200" fill="rgba(255,255,255,0.5)">: </text><text x="966" y="200" fill="rgba(251,191,36,0.8)">1</text><text x="974" y="200" fill="rgba(255,255,255,0.5)">,</text>
    <text x="924" y="215" fill="rgba(167,139,250,0.8)">"name"</text><text x="966" y="215" fill="rgba(255,255,255,0.5)">: </text><text x="976" y="215" fill="rgba(52,211,153,0.8)">"Alice"</text><text x="1018" y="215" fill="rgba(255,255,255,0.5)">,</text>
    <text x="924" y="230" fill="rgba(167,139,250,0.8)">"email"</text><text x="970" y="230" fill="rgba(255,255,255,0.5)">: </text><text x="980" y="230" fill="rgba(52,211,153,0.8)">"alice@..."</text><text x="1030" y="230" fill="rgba(255,255,255,0.5)">,</text>
    <text x="924" y="245" fill="rgba(167,139,250,0.8)">"role"</text><text x="962" y="245" fill="rgba(255,255,255,0.5)">: </text><text x="972" y="245" fill="rgba(52,211,153,0.8)">"admin"</text><text x="1014" y="245" fill="rgba(255,255,255,0.5)">,</text>
    <text x="924" y="260" fill="rgba(167,139,250,0.8)">"settings"</text><text x="990" y="260" fill="rgba(255,255,255,0.5)">: {</text>
    <text x="932" y="275" fill="rgba(167,139,250,0.8)">"theme"</text><text x="978" y="275" fill="rgba(255,255,255,0.5)">: </text><text x="988" y="275" fill="rgba(52,211,153,0.8)">"dark"</text><text x="1024" y="275" fill="rgba(255,255,255,0.5)">,</text>
    <text x="932" y="290" fill="rgba(167,139,250,0.8)">"notifications"</text><text x="1038" y="290" fill="rgba(255,255,255,0.5)">: </text><text x="1048" y="290" fill="rgba(96,165,250,0.8)">true</text>
    <text x="924" y="305" fill="rgba(255,255,255,0.5)">},</text>
    <text x="924" y="320" fill="rgba(167,139,250,0.8)">"tags"</text><text x="962" y="320" fill="rgba(255,255,255,0.5)">: [</text>
    <text x="932" y="335" fill="rgba(52,211,153,0.8)">"developer"</text><text x="1000" y="335" fill="rgba(255,255,255,0.5)">,</text>
    <text x="932" y="350" fill="rgba(52,211,153,0.8)">"admin"</text>
    <text x="924" y="365" fill="rgba(255,255,255,0.5)">],</text>
    <text x="924" y="380" fill="rgba(167,139,250,0.8)">"active"</text><text x="972" y="380" fill="rgba(255,255,255,0.5)">: </text><text x="982" y="380" fill="rgba(96,165,250,0.8)">true</text>
    <text x="916" y="395" fill="rgba(255,255,255,0.7)">}</text>
    <text x="908" y="410" fill="rgba(255,255,255,0.7)">}</text>
  </g>

  <!-- Valid badge -->
  <rect x="908" y="450" width="80" height="18" rx="4" fill="rgba(34,197,94,0.15)" stroke="rgba(34,197,94,0.35)" stroke-width="1"/>
  <text x="948" y="462" text-anchor="middle" font-size="8" fill="rgba(34,197,94,0.9)">✓ Valid JSON</text>

  <!-- Laptop base -->
  <rect x="610" y="545" width="560" height="14" rx="4" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="760" y="556" width="260" height="8" rx="4" fill="rgba(255,255,255,0.03)"/>
</svg>
