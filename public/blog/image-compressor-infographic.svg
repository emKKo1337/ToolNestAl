<svg viewBox="0 0 900 1200" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <radialGradient id="gT" cx="50%" cy="10%" r="50%"><stop offset="0%" stop-color="#5b21b6" stop-opacity="0.3"/><stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/></radialGradient>
    <radialGradient id="gB" cx="50%" cy="90%" r="50%"><stop offset="0%" stop-color="#0e7490" stop-opacity="0.2"/><stop offset="100%" stop-color="#0e7490" stop-opacity="0"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="bG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#5b21b6" flood-opacity="0.35"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="900" height="1200" fill="url(#bg)"/>
  <ellipse cx="450" cy="150" rx="500" ry="300" fill="url(#gT)"/>
  <ellipse cx="450" cy="1050" rx="500" ry="300" fill="url(#gB)"/>

  <!-- Title -->
  <text x="450" y="52" text-anchor="middle" font-size="26" font-weight="900" fill="url(#aG)" filter="url(#glow)">Image Compressor</text>
  <text x="450" y="80" text-anchor="middle" font-size="13" fill="rgba(255,255,255,0.45)">Everything you need to know about compressing images for the web</text>

  <!-- Section 1: Why compress -->
  <rect x="28" y="100" width="844" height="190" rx="12" fill="rgba(255,255,255,0.025)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="48" y="124" font-size="12" font-weight="800" fill="url(#aG)">01 — Why Image Compression Matters</text>
  <g font-size="10" fill="rgba(255,255,255,0.65)">
    <circle cx="56" cy="148" r="4" fill="#a78bfa"/>
    <text x="70" y="152">Images account for 50–75% of total page weight on most websites</text>
    <circle cx="56" cy="172" r="4" fill="#a78bfa"/>
    <text x="70" y="176">Google uses Core Web Vitals (LCP, CLS, FID) as ranking signals — large images hurt all three</text>
    <circle cx="56" cy="196" r="4" fill="#a78bfa"/>
    <text x="70" y="200">53% of mobile users abandon a page that takes more than 3 seconds to load</text>
    <circle cx="56" cy="220" r="4" fill="#a78bfa"/>
    <text x="70" y="224">Compressing a 4 MB photo to 400 KB can reduce load time by 1–2 seconds on 4G</text>
    <circle cx="56" cy="244" r="4" fill="#a78bfa"/>
    <text x="70" y="248">Smaller images reduce CDN bandwidth costs — significant at scale</text>
    <circle cx="56" cy="268" r="4" fill="#a78bfa"/>
    <text x="70" y="272">WebP images are 25–35% smaller than equivalent JPEG at the same visual quality</text>
  </g>

  <!-- Section 2: Stats -->
  <rect x="28" y="308" width="844" height="130" rx="12" fill="rgba(124,58,237,0.08)" stroke="rgba(124,58,237,0.2)" stroke-width="1"/>
  <text x="48" y="332" font-size="12" font-weight="800" fill="url(#aG)">02 — Key Numbers</text>
  <g text-anchor="middle">
    <rect x="44" y="346" width="175" height="70" rx="8" fill="rgba(124,58,237,0.15)" stroke="rgba(124,58,237,0.3)" stroke-width="1"/>
    <text x="132" y="375" font-size="26" font-weight="900" fill="#a78bfa">90%</text>
    <text x="132" y="394" font-size="9" fill="rgba(255,255,255,0.55)">max file size</text>
    <text x="132" y="406" font-size="9" fill="rgba(255,255,255,0.55)">reduction possible</text>

    <rect x="233" y="346" width="175" height="70" rx="8" fill="rgba(14,116,144,0.12)" stroke="rgba(14,116,144,0.25)" stroke-width="1"/>
    <text x="321" y="375" font-size="26" font-weight="900" fill="#67e8f9">75%</text>
    <text x="321" y="394" font-size="9" fill="rgba(255,255,255,0.55)">of page weight</text>
    <text x="321" y="406" font-size="9" fill="rgba(255,255,255,0.55)">is images on avg</text>

    <rect x="422" y="346" width="175" height="70" rx="8" fill="rgba(16,185,129,0.1)" stroke="rgba(16,185,129,0.25)" stroke-width="1"/>
    <text x="510" y="375" font-size="26" font-weight="900" fill="#34d399">80%</text>
    <text x="510" y="394" font-size="9" fill="rgba(255,255,255,0.55)">quality setting</text>
    <text x="510" y="406" font-size="9" fill="rgba(255,255,255,0.55)">sweet spot</text>

    <rect x="611" y="346" width="175" height="70" rx="8" fill="rgba(251,191,36,0.1)" stroke="rgba(251,191,36,0.25)" stroke-width="1"/>
    <text x="699" y="375" font-size="26" font-weight="900" fill="#fbbf24">97%</text>
    <text x="699" y="394" font-size="9" fill="rgba(255,255,255,0.55)">browser support</text>
    <text x="699" y="406" font-size="9" fill="rgba(255,255,255,0.55)">for WebP format</text>
  </g>

  <!-- Section 3: Format guide -->
  <rect x="28" y="456" width="844" height="260" rx="12" fill="rgba(255,255,255,0.025)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="48" y="480" font-size="12" font-weight="800" fill="url(#aG)">03 — Choose the Right Format</text>

  <!-- JPEG -->
  <rect x="44" y="490" width="810" height="44" rx="6" fill="rgba(251,191,36,0.08)" stroke="rgba(251,191,36,0.2)" stroke-width="1"/>
  <rect x="44" y="490" width="4" height="44" rx="2" fill="#fbbf24"/>
  <text x="58" y="508" font-size="9" font-weight="700" fill="rgba(251,191,36,0.8)">JPEG — Photos &amp; Hero Images</text>
  <text x="58" y="524" font-size="8.5" fill="rgba(255,255,255,0.45)">High compression · lossy · no transparency · universal support · 60–90% smaller than uncompressed</text>
  <text x="800" y="508" text-anchor="end" font-size="8" fill="rgba(251,191,36,0.6)">Use at 75–85%</text>

  <!-- PNG -->
  <rect x="44" y="540" width="810" height="44" rx="6" fill="rgba(96,165,250,0.07)" stroke="rgba(96,165,250,0.18)" stroke-width="1"/>
  <rect x="44" y="540" width="4" height="44" rx="2" fill="#60a5fa"/>
  <text x="58" y="558" font-size="9" font-weight="700" fill="rgba(147,197,253,0.8)">PNG — Logos, Icons &amp; Transparent Images</text>
  <text x="58" y="574" font-size="8.5" fill="rgba(255,255,255,0.45)">Lossless · full alpha channel · larger file size for photos · perfect for UI elements and graphics</text>
  <text x="800" y="558" text-anchor="end" font-size="8" fill="rgba(147,197,253,0.6)">Lossless only</text>

  <!-- WebP -->
  <rect x="44" y="590" width="810" height="44" rx="6" fill="rgba(52,211,153,0.07)" stroke="rgba(52,211,153,0.2)" stroke-width="1"/>
  <rect x="44" y="590" width="4" height="44" rx="2" fill="#34d399"/>
  <text x="58" y="608" font-size="9" font-weight="700" fill="rgba(52,211,153,0.8)">WebP — Best Overall Choice for Modern Sites</text>
  <text x="58" y="624" font-size="8.5" fill="rgba(255,255,255,0.45)">25–35% smaller than JPEG · transparency · animation · 97%+ browser support · both lossy and lossless</text>
  <text x="800" y="608" text-anchor="end" font-size="8" fill="rgba(52,211,153,0.6)">Recommended ✓</text>

  <!-- GIF -->
  <rect x="44" y="640" width="810" height="44" rx="6" fill="rgba(167,139,250,0.06)" stroke="rgba(167,139,250,0.15)" stroke-width="1"/>
  <rect x="44" y="640" width="4" height="44" rx="2" fill="#a78bfa"/>
  <text x="58" y="658" font-size="9" font-weight="700" fill="rgba(167,139,250,0.8)">GIF — Simple Animations Only</text>
  <text x="58" y="674" font-size="8.5" fill="rgba(255,255,255,0.45)">256 colours max · large files · frame animation · use animated WebP for better quality &amp; smaller size</text>
  <text x="800" y="658" text-anchor="end" font-size="8" fill="rgba(167,139,250,0.5)">Legacy use</text>

  <!-- Section 4: Step by step -->
  <rect x="28" y="734" width="844" height="260" rx="12" fill="rgba(255,255,255,0.025)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="48" y="758" font-size="12" font-weight="800" fill="url(#aG)">04 — 5 Steps to Compress Images for the Web</text>

  <g>
    <circle cx="72" cy="792" r="18" fill="url(#bG)" filter="url(#sh)"/>
    <text x="72" y="797" text-anchor="middle" font-size="12" font-weight="900" fill="#fff">1</text>
    <text x="100" y="788" font-size="11" font-weight="700" fill="rgba(255,255,255,0.85)">Resize to the maximum display size</text>
    <text x="100" y="803" font-size="9" fill="rgba(255,255,255,0.45)">Match the image to the largest it will ever appear (e.g. 1200px wide for a blog hero)</text>

    <circle cx="72" cy="838" r="18" fill="url(#bG)" filter="url(#sh)"/>
    <text x="72" y="843" text-anchor="middle" font-size="12" font-weight="900" fill="#fff">2</text>
    <text x="100" y="834" font-size="11" font-weight="700" fill="rgba(255,255,255,0.85)">Choose the right format</text>
    <text x="100" y="849" font-size="9" fill="rgba(255,255,255,0.45)">WebP for everything modern · JPEG for photos · PNG only for logos and transparent images</text>

    <circle cx="72" cy="884" r="18" fill="url(#bG)" filter="url(#sh)"/>
    <text x="72" y="889" text-anchor="middle" font-size="12" font-weight="900" fill="#fff">3</text>
    <text x="100" y="880" font-size="11" font-weight="700" fill="rgba(255,255,255,0.85)">Set quality to 75–85%</text>
    <text x="100" y="895" font-size="9" fill="rgba(255,255,255,0.45)">This range gives 60–85% file reduction with no visible quality loss on screen</text>

    <circle cx="72" cy="930" r="18" fill="url(#bG)" filter="url(#sh)"/>
    <text x="72" y="935" text-anchor="middle" font-size="12" font-weight="900" fill="#fff">4</text>
    <text x="100" y="926" font-size="11" font-weight="700" fill="rgba(255,255,255,0.85)">Preview before downloading</text>
    <text x="100" y="941" font-size="9" fill="rgba(255,255,255,0.45)">Check the compressed image looks sharp — zoom in on edges and text if present</text>

    <circle cx="72" cy="976" r="18" fill="url(#bG)" filter="url(#sh)"/>
    <text x="72" y="981" text-anchor="middle" font-size="12" font-weight="900" fill="#fff">5</text>
    <text x="100" y="972" font-size="11" font-weight="700" fill="rgba(255,255,255,0.85)">Add width and height attributes in HTML</text>
    <text x="100" y="987" font-size="9" fill="rgba(255,255,255,0.45)">Prevents layout shift (CLS) — always specify &lt;img width="1200" height="630"&gt;</text>
  </g>

  <!-- CTA -->
  <rect x="28" y="1110" width="844" height="66" rx="12" fill="url(#bG)" filter="url(#sh)"/>
  <text x="450" y="1142" text-anchor="middle" font-size="18" font-weight="900" fill="#fff">Compress Your Images Free</text>
  <text x="450" y="1162" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.75)">Batch upload · quality slider · WebP conversion · no sign-up required</text>
  <text x="450" y="1170" text-anchor="middle" font-size="10" font-weight="700" fill="rgba(255,255,255,0.4)">toolnestai.net/image-tools/image-compressor</text>
</svg>
