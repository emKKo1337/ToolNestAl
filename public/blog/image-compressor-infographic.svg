<svg viewBox="0 0 900 1200" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <radialGradient id="gT" cx="50%" cy="10%" r="60%"><stop offset="0%" stop-color="#5b21b6" stop-opacity="0.35"/><stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/></radialGradient>
    <radialGradient id="gB" cx="50%" cy="90%" r="60%"><stop offset="0%" stop-color="#0e7490" stop-opacity="0.2"/><stop offset="100%" stop-color="#0e7490" stop-opacity="0"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="bG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient>
  </defs>
  <rect width="900" height="1200" fill="url(#bg)"/>
  <ellipse cx="450" cy="200" rx="700" ry="400" fill="url(#gT)"/>
  <ellipse cx="450" cy="1000" rx="700" ry="400" fill="url(#gB)"/>
  <text x="450" y="52" text-anchor="middle" font-size="26" font-weight="900" fill="url(#aG)">Image Compression: The Complete Guide</text>
  <text x="450" y="76" text-anchor="middle" font-size="13" fill="rgba(255,255,255,0.38)">How to reduce file size without sacrificing visible quality</text>
  <text x="450" y="96" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.22)">toolnestai.net/image-tools/image-compressor</text>
  <rect x="32" y="112" width="836" height="38" rx="8" fill="rgba(124,58,237,0.18)" stroke="rgba(124,58,237,0.3)" stroke-width="1"/>
  <text x="450" y="136" text-anchor="middle" font-size="15" font-weight="800" fill="#a78bfa">01 - Why File Size Matters</text>
  <rect x="32" y="156" width="836" height="110" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <g font-size="9.5">
    <text x="48" y="180" fill="rgba(255,255,255,0.6)">A 4 MB image on a website makes every visitor download 4 MB before seeing it.</text>
    <text x="48" y="200" fill="rgba(255,255,255,0.6)">Compressed to 400 KB: page loads 10x faster, bounce rate drops, Core Web Vitals improve.</text>
    <text x="48" y="226" font-weight="700" fill="rgba(167,139,250,0.85)">Google PageSpeed treats image weight as a ranking signal.</text>
    <text x="48" y="246" fill="rgba(255,255,255,0.45)">Every 100ms of page load time reduces conversions by ~1% (Google/Deloitte research).</text>
  </g>
  <rect x="32" y="282" width="836" height="38" rx="8" fill="rgba(14,116,144,0.18)" stroke="rgba(14,116,144,0.3)" stroke-width="1"/>
  <text x="450" y="306" text-anchor="middle" font-size="15" font-weight="800" fill="#67e8f9">02 - Lossy vs Lossless Compression</text>
  <g font-size="9.5">
    <rect x="32" y="326" width="404" height="96" rx="8" fill="rgba(52,211,153,0.06)" stroke="rgba(52,211,153,0.16)" stroke-width="1"/>
    <text x="48" y="348" font-weight="700" fill="#6ee7b7">Lossless (PNG, lossless WebP)</text>
    <text x="48" y="368" fill="rgba(255,255,255,0.5)">Every pixel preserved exactly</text>
    <text x="48" y="386" fill="rgba(255,255,255,0.5)">Best for: logos, screenshots, graphics</text>
    <text x="48" y="404" fill="rgba(255,255,255,0.3)" font-size="8.5">Typical size reduction: 10-30%</text>
    <rect x="464" y="326" width="404" height="96" rx="8" fill="rgba(251,191,36,0.06)" stroke="rgba(251,191,36,0.16)" stroke-width="1"/>
    <text x="480" y="348" font-weight="700" fill="#fbbf24">Lossy (JPG, lossy WebP)</text>
    <text x="480" y="368" fill="rgba(255,255,255,0.5)">Permanently discards imperceptible detail</text>
    <text x="480" y="386" fill="rgba(255,255,255,0.5)">Best for: photographs</text>
    <text x="480" y="404" fill="rgba(255,255,255,0.3)" font-size="8.5">Typical size reduction: 60-90%</text>
  </g>
  <rect x="32" y="438" width="836" height="38" rx="8" fill="rgba(239,68,68,0.12)" stroke="rgba(239,68,68,0.22)" stroke-width="1"/>
  <text x="450" y="462" text-anchor="middle" font-size="15" font-weight="800" fill="rgba(239,68,68,0.85)">03 - Common Mistakes</text>
  <g font-size="9.5">
    <rect x="32" y="482" width="836" height="86" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="48" y="504" font-weight="700" fill="rgba(239,68,68,0.8)">Mistake 1: Compressing too aggressively for logos</text>
    <text x="48" y="524" fill="rgba(255,255,255,0.5)">Sharp text and flat colors in a logo show compression artifacts immediately at low quality settings.</text>
    <text x="48" y="544" fill="rgba(255,255,255,0.45)">For logos: use PNG (lossless) or WebP quality 90+ — prioritize quality over file size.</text>
    <text x="48" y="556" fill="rgba(52,211,153,0.7)">Fix: Use lossless compression for graphics with hard edges.</text>
  </g>
  <g font-size="9.5">
    <rect x="32" y="574" width="836" height="86" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="48" y="596" font-weight="700" fill="rgba(239,68,68,0.8)">Mistake 2: Not resizing before compressing</text>
    <text x="48" y="616" fill="rgba(255,255,255,0.5)">Compressing a 6000x4000 photo and displaying it at 800x600 wastes bandwidth.</text>
    <text x="48" y="636" fill="rgba(255,255,255,0.45)">Resize to the display dimensions first, then compress — doubles the size reduction.</text>
    <text x="48" y="648" fill="rgba(52,211,153,0.7)">Fix: Resize to max display size before compressing.</text>
  </g>
  <g font-size="9.5">
    <rect x="32" y="666" width="836" height="86" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="48" y="688" font-weight="700" fill="rgba(239,68,68,0.8)">Mistake 3: Re-compressing already-compressed JPGs</text>
    <text x="48" y="708" fill="rgba(255,255,255,0.5)">Each re-save of a lossy JPG runs the compression algorithm again, adding artifacts.</text>
    <text x="48" y="728" fill="rgba(255,255,255,0.45)">Keep the original file untouched and always compress from it, never from a re-saved copy.</text>
    <text x="48" y="740" fill="rgba(52,211,153,0.7)">Fix: Always compress from the original source file.</text>
  </g>
  <rect x="32" y="768" width="836" height="38" rx="8" fill="rgba(16,185,129,0.14)" stroke="rgba(16,185,129,0.25)" stroke-width="1"/>
  <text x="450" y="792" text-anchor="middle" font-size="15" font-weight="800" fill="#34d399">04 - Quality Setting Guide</text>
  <g font-size="9" text-anchor="middle">
    <rect x="32" y="812" width="196" height="88" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(239,68,68,0.15)" stroke-width="1"/>
    <text x="130" y="836" font-weight="700" fill="rgba(239,68,68,0.75)">50-60%</text>
    <text x="130" y="856" fill="rgba(255,255,255,0.45)">Very small files</text>
    <text x="130" y="874" fill="rgba(255,255,255,0.35)">Visible artifacts</text>
    <text x="130" y="892" fill="rgba(255,255,255,0.25)" font-size="8">Thumbnails only</text>
    <rect x="236" y="812" width="196" height="88" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(251,191,36,0.15)" stroke-width="1"/>
    <text x="334" y="836" font-weight="700" fill="rgba(251,191,36,0.75)">65-75%</text>
    <text x="334" y="856" fill="rgba(255,255,255,0.45)">Small files</text>
    <text x="334" y="874" fill="rgba(255,255,255,0.35)">Minor artifacts</text>
    <text x="334" y="892" fill="rgba(255,255,255,0.25)" font-size="8">Social media</text>
    <rect x="440" y="812" width="196" height="88" rx="8" fill="rgba(167,139,250,0.08)" stroke="rgba(167,139,250,0.25)" stroke-width="1.5"/>
    <text x="538" y="836" font-weight="700" fill="#a78bfa">75-85%</text>
    <text x="538" y="856" fill="rgba(255,255,255,0.55)">Optimal size</text>
    <text x="538" y="874" fill="rgba(255,255,255,0.45)">Invisible artifacts</text>
    <text x="538" y="892" fill="rgba(167,139,250,0.7)" font-size="8">RECOMMENDED</text>
    <rect x="644" y="812" width="224" height="88" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(52,211,153,0.15)" stroke-width="1"/>
    <text x="756" y="836" font-weight="700" fill="rgba(52,211,153,0.75)">90-100%</text>
    <text x="756" y="856" fill="rgba(255,255,255,0.45)">Large files</text>
    <text x="756" y="874" fill="rgba(255,255,255,0.35)">No visible artifacts</text>
    <text x="756" y="892" fill="rgba(255,255,255,0.25)" font-size="8">Print / archival</text>
  </g>
  <rect x="32" y="916" width="836" height="38" rx="8" fill="rgba(124,58,237,0.18)" stroke="rgba(124,58,237,0.3)" stroke-width="1"/>
  <text x="450" y="940" text-anchor="middle" font-size="15" font-weight="800" fill="#a78bfa">05 - Expected Results by Image Type</text>
  <g font-size="9.5" text-anchor="middle">
    <rect x="32" y="960" width="270" height="80" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    <text x="167" y="982" font-weight="700" fill="rgba(167,139,250,0.85)">Photograph (JPG)</text>
    <text x="167" y="1002" fill="rgba(255,255,255,0.5)">80-90% reduction at Q80</text>
    <text x="167" y="1020" fill="rgba(255,255,255,0.35)" font-size="8">Most images compress very well</text>
    <rect x="315" y="960" width="270" height="80" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    <text x="450" y="982" font-weight="700" fill="rgba(103,232,249,0.85)">Logo / Graphic (PNG)</text>
    <text x="450" y="1002" fill="rgba(255,255,255,0.5)">10-50% lossless reduction</text>
    <text x="450" y="1020" fill="rgba(255,255,255,0.35)" font-size="8">Less compressible by nature</text>
    <rect x="598" y="960" width="270" height="80" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    <text x="733" y="982" font-weight="700" fill="rgba(52,211,153,0.85)">Screenshot (PNG/WebP)</text>
    <text x="733" y="1002" fill="rgba(255,255,255,0.5)">50-80% lossless reduction</text>
    <text x="733" y="1020" fill="rgba(255,255,255,0.35)" font-size="8">Large flat regions compress well</text>
  </g>
  <text x="450" y="1070" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.28)">Free tool: toolnestai.net/image-tools/image-compressor</text>
  <text x="450" y="1090" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.2)">In-browser compression - no upload, no account, no limits</text>
</svg>
