<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="30%" cy="40%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <radialGradient id="gL" cx="15%" cy="50%" r="55%"><stop offset="0%" stop-color="#5b21b6" stop-opacity="0.45"/><stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/></radialGradient>
    <radialGradient id="gR" cx="85%" cy="50%" r="55%"><stop offset="0%" stop-color="#0e7490" stop-opacity="0.28"/><stop offset="100%" stop-color="#0e7490" stop-opacity="0"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="bG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient>
    <linearGradient id="lapG" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1a1040"/><stop offset="100%" stop-color="#0d0824"/></linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#5b21b6" flood-opacity="0.5"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="180" cy="315" rx="600" ry="500" fill="url(#gL)"/>
  <ellipse cx="1020" cy="315" rx="600" ry="500" fill="url(#gR)"/>
  <text x="60" y="70" font-size="14" font-weight="700" fill="url(#aG)" filter="url(#glow)">ToolNest AI</text>
  <text x="60" y="106" font-size="13" fill="rgba(255,255,255,0.35)">Image Tools - Image Cropper</text>
  <text x="60" y="185" font-size="46" font-weight="900" fill="url(#aG)" filter="url(#glow)">Image</text>
  <text x="60" y="245" font-size="46" font-weight="900" fill="url(#aG)" filter="url(#glow)">Cropper</text>
  <text x="60" y="300" font-size="18" fill="rgba(255,255,255,0.6)">Precise crop with aspect ratio lock</text>
  <text x="60" y="328" font-size="18" fill="rgba(255,255,255,0.6)">Free, instant, browser-based</text>
  <rect x="60" y="358" width="130" height="52" rx="8" fill="rgba(124,58,237,0.2)" stroke="rgba(124,58,237,0.4)" stroke-width="1"/>
  <text x="125" y="382" text-anchor="middle" font-size="12" font-weight="900" fill="#a78bfa">Pixel exact</text>
  <text x="125" y="400" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">precise crop</text>
  <rect x="202" y="358" width="120" height="52" rx="8" fill="rgba(14,116,144,0.15)" stroke="rgba(14,116,144,0.35)" stroke-width="1"/>
  <text x="262" y="382" text-anchor="middle" font-size="12" font-weight="900" fill="#67e8f9">Ratio lock</text>
  <text x="262" y="400" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">16:9, 1:1, 4:3</text>
  <rect x="334" y="358" width="110" height="52" rx="8" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
  <text x="389" y="382" text-anchor="middle" font-size="18" font-weight="900" fill="#34d399">Free</text>
  <text x="389" y="400" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">no account</text>
  <text x="60" y="560" font-size="14" fill="rgba(255,255,255,0.25)">toolnestai.net/image-tools/image-cropper</text>
  <rect x="630" y="60" width="530" height="490" rx="16" fill="url(#lapG)" stroke="rgba(124,58,237,0.3)" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="630" y="60" width="530" height="36" rx="16" fill="rgba(255,255,255,0.05)"/>
  <rect x="630" y="78" width="530" height="18" fill="rgba(255,255,255,0.02)"/>
  <circle cx="655" cy="78" r="6" fill="rgba(239,68,68,0.6)"/>
  <circle cx="675" cy="78" r="6" fill="rgba(251,191,36,0.6)"/>
  <circle cx="695" cy="78" r="6" fill="rgba(34,197,94,0.6)"/>
  <!-- Crop interface mockup -->
  <rect x="648" y="110" width="496" height="310" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <!-- Crop selection box -->
  <rect x="720" y="140" width="280" height="200" rx="4" fill="rgba(124,58,237,0.08)" stroke="#a78bfa" stroke-width="2" stroke-dasharray="6,4"/>
  <!-- Corner handles -->
  <rect x="716" y="136" width="12" height="12" rx="2" fill="#a78bfa"/>
  <rect x="984" y="136" width="12" height="12" rx="2" fill="#a78bfa"/>
  <rect x="716" y="336" width="12" height="12" rx="2" fill="#a78bfa"/>
  <rect x="984" y="336" width="12" height="12" rx="2" fill="#a78bfa"/>
  <!-- Dim areas outside crop -->
  <rect x="648" y="110" width="72" height="310" rx="0" fill="rgba(0,0,0,0.45)"/>
  <rect x="1000" y="110" width="144" height="310" rx="0" fill="rgba(0,0,0,0.45)"/>
  <text x="860" y="249" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.25)">Crop area: 1920 x 1080</text>
  <!-- Ratio buttons -->
  <text x="650" y="442" font-size="8.5" fill="rgba(255,255,255,0.35)">ASPECT RATIO</text>
  <rect x="648" y="448" width="60" height="24" rx="5" fill="url(#bG)"/>
  <text x="678" y="464" text-anchor="middle" font-size="8.5" font-weight="700" fill="#fff">16:9</text>
  <rect x="716" y="448" width="52" height="24" rx="5" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="742" y="464" text-anchor="middle" font-size="8.5" fill="rgba(255,255,255,0.4)">1:1</text>
  <rect x="776" y="448" width="52" height="24" rx="5" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="802" y="464" text-anchor="middle" font-size="8.5" fill="rgba(255,255,255,0.4)">4:3</text>
  <rect x="836" y="448" width="52" height="24" rx="5" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="862" y="464" text-anchor="middle" font-size="8.5" fill="rgba(255,255,255,0.4)">3:2</text>
  <rect x="896" y="448" width="62" height="24" rx="5" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="927" y="464" text-anchor="middle" font-size="8.5" fill="rgba(255,255,255,0.4)">Free</text>
  <rect x="648" y="482" width="244" height="30" rx="8" fill="url(#bG)" filter="url(#sh)"/>
  <text x="770" y="501" text-anchor="middle" font-size="12" font-weight="900" fill="#fff">Crop Image</text>
  <rect x="620" y="550" width="560" height="14" rx="4" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
</svg>
