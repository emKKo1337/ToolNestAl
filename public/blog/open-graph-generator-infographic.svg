<svg viewBox="0 0 900 1200" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <radialGradient id="gT" cx="50%" cy="10%" r="50%"><stop offset="0%" stop-color="#5b21b6" stop-opacity="0.3"/><stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/></radialGradient>
    <radialGradient id="gB" cx="50%" cy="90%" r="50%"><stop offset="0%" stop-color="#2563eb" stop-opacity="0.2"/><stop offset="100%" stop-color="#2563eb" stop-opacity="0"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="bG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#5b21b6" flood-opacity="0.35"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="900" height="1200" fill="url(#bg)"/>
  <ellipse cx="450" cy="150" rx="500" ry="300" fill="url(#gT)"/>
  <ellipse cx="450" cy="1050" rx="500" ry="300" fill="url(#gB)"/>

  <!-- Title -->
  <text x="450" y="52" text-anchor="middle" font-size="26" font-weight="900" fill="url(#aG)" filter="url(#glow)">Open Graph Generator</text>
  <text x="450" y="80" text-anchor="middle" font-size="13" fill="rgba(255,255,255,0.45)">The complete guide to social meta tags — stats, tags, steps &amp; best practices</text>

  <!-- Section 1: Why OG tags matter -->
  <rect x="28" y="100" width="844" height="200" rx="12" fill="rgba(255,255,255,0.025)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="48" y="124" font-size="12" font-weight="800" fill="url(#aG)">01 — Why Open Graph Tags Matter</text>

  <g font-size="10" fill="rgba(255,255,255,0.65)">
    <circle cx="56" cy="150" r="4" fill="#a78bfa"/>
    <text x="70" y="154">Social platforms (Facebook, LinkedIn, Discord, WhatsApp) read og: tags to build link preview cards</text>
    <circle cx="56" cy="174" r="4" fill="#a78bfa"/>
    <text x="70" y="178">Without og:image, shares show a blank card or random image — click-through drops by up to 70%</text>
    <circle cx="56" cy="198" r="4" fill="#a78bfa"/>
    <text x="70" y="202">Twitter/X uses twitter:card tags first, then falls back to og: — one tag set covers all platforms</text>
    <circle cx="56" cy="222" r="4" fill="#a78bfa"/>
    <text x="70" y="226">Google uses og:title and og:description as secondary signals — correct tags support search rankings</text>
    <circle cx="56" cy="246" r="4" fill="#a78bfa"/>
    <text x="70" y="250">Every page needs unique OG tags — duplicate tags make every share look the same</text>
    <circle cx="56" cy="270" r="4" fill="#a78bfa"/>
    <text x="70" y="274">OG tags are cached by platforms — updating them requires manual cache clearing</text>
  </g>

  <!-- Section 2: Key stats -->
  <rect x="28" y="318" width="844" height="130" rx="12" fill="rgba(124,58,237,0.08)" stroke="rgba(124,58,237,0.2)" stroke-width="1"/>
  <text x="48" y="342" font-size="12" font-weight="800" fill="url(#aG)">02 — Key Numbers to Know</text>

  <g text-anchor="middle">
    <rect x="44" y="356" width="175" height="70" rx="8" fill="rgba(124,58,237,0.15)" stroke="rgba(124,58,237,0.3)" stroke-width="1"/>
    <text x="132" y="385" font-size="26" font-weight="900" fill="#a78bfa">3×</text>
    <text x="132" y="404" font-size="9" fill="rgba(255,255,255,0.55)">more clicks with</text>
    <text x="132" y="416" font-size="9" fill="rgba(255,255,255,0.55)">rich OG preview</text>

    <rect x="233" y="356" width="175" height="70" rx="8" fill="rgba(37,99,235,0.12)" stroke="rgba(59,130,246,0.25)" stroke-width="1"/>
    <text x="321" y="385" font-size="26" font-weight="900" fill="#60a5fa">1200</text>
    <text x="321" y="404" font-size="9" fill="rgba(255,255,255,0.55)">×630 pixels</text>
    <text x="321" y="416" font-size="9" fill="rgba(255,255,255,0.55)">optimal og:image size</text>

    <rect x="422" y="356" width="175" height="70" rx="8" fill="rgba(16,185,129,0.1)" stroke="rgba(16,185,129,0.25)" stroke-width="1"/>
    <text x="510" y="385" font-size="26" font-weight="900" fill="#34d399">60</text>
    <text x="510" y="404" font-size="9" fill="rgba(255,255,255,0.55)">chars max for</text>
    <text x="510" y="416" font-size="9" fill="rgba(255,255,255,0.55)">og:title display</text>

    <rect x="611" y="356" width="175" height="70" rx="8" fill="rgba(251,191,36,0.1)" stroke="rgba(251,191,36,0.25)" stroke-width="1"/>
    <text x="699" y="385" font-size="26" font-weight="900" fill="#fbbf24">&lt;10s</text>
    <text x="699" y="404" font-size="9" fill="rgba(255,255,255,0.55)">to generate full</text>
    <text x="699" y="416" font-size="9" fill="rgba(255,255,255,0.55)">OG tag set free</text>
  </g>

  <!-- Section 3: Essential tags with code -->
  <rect x="28" y="466" width="844" height="350" rx="12" fill="rgba(255,255,255,0.025)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="48" y="490" font-size="12" font-weight="800" fill="url(#aG)">03 — Essential Open Graph Tags</text>

  <g font-size="9" font-family="monospace">
    <!-- og:title -->
    <rect x="44" y="500" width="810" height="46" rx="6" fill="rgba(124,58,237,0.1)" stroke="rgba(124,58,237,0.2)" stroke-width="1"/>
    <rect x="44" y="500" width="4" height="46" rx="2" fill="#7c3aed"/>
    <text x="58" y="516" font-size="8" fill="rgba(167,139,250,0.6)" font-family="sans-serif" font-weight="700">og:title — REQUIRED</text>
    <text x="58" y="532" fill="rgba(96,165,250,0.8)">&lt;meta</text>
    <text x="104" y="532" fill="rgba(167,139,250,0.9)"> property=</text>
    <text x="192" y="532" fill="rgba(34,197,94,0.85)">"og:title"</text>
    <text x="262" y="532" fill="rgba(167,139,250,0.9)"> content=</text>
    <text x="348" y="532" fill="rgba(34,197,94,0.85)">"Your Page Title — Under 60 Characters"</text>
    <text x="696" y="532" fill="rgba(96,165,250,0.8)"> /&gt;</text>
    <text x="58" y="542" font-size="7.5" fill="rgba(255,255,255,0.3)" font-family="sans-serif">Place primary keyword near start · 60 chars max before truncation</text>

    <!-- og:description -->
    <rect x="44" y="552" width="810" height="46" rx="6" fill="rgba(37,99,235,0.08)" stroke="rgba(59,130,246,0.18)" stroke-width="1"/>
    <rect x="44" y="552" width="4" height="46" rx="2" fill="#3b82f6"/>
    <text x="58" y="568" font-size="8" fill="rgba(147,197,253,0.6)" font-family="sans-serif" font-weight="700">og:description — REQUIRED</text>
    <text x="58" y="584" fill="rgba(96,165,250,0.8)">&lt;meta</text>
    <text x="104" y="584" fill="rgba(167,139,250,0.9)"> property=</text>
    <text x="192" y="584" fill="rgba(34,197,94,0.85)">"og:description"</text>
    <text x="314" y="584" fill="rgba(167,139,250,0.9)"> content=</text>
    <text x="400" y="584" fill="rgba(34,197,94,0.85)">"Compelling 2–3 sentence summary (under 155 chars)"</text>
    <text x="58" y="594" font-size="7.5" fill="rgba(255,255,255,0.3)" font-family="sans-serif">Include a CTA · make it specific to this page · not a generic site description</text>

    <!-- og:image -->
    <rect x="44" y="604" width="810" height="46" rx="6" fill="rgba(124,58,237,0.1)" stroke="rgba(124,58,237,0.2)" stroke-width="1"/>
    <rect x="44" y="604" width="4" height="46" rx="2" fill="#7c3aed"/>
    <text x="58" y="620" font-size="8" fill="rgba(167,139,250,0.6)" font-family="sans-serif" font-weight="700">og:image — REQUIRED</text>
    <text x="58" y="636" fill="rgba(96,165,250,0.8)">&lt;meta</text>
    <text x="104" y="636" fill="rgba(167,139,250,0.9)"> property=</text>
    <text x="192" y="636" fill="rgba(34,197,94,0.85)">"og:image"</text>
    <text x="264" y="636" fill="rgba(167,139,250,0.9)"> content=</text>
    <text x="350" y="636" fill="rgba(34,197,94,0.85)">"https://yoursite.com/og-image.jpg"</text>
    <text x="58" y="646" font-size="7.5" fill="rgba(255,255,255,0.3)" font-family="sans-serif">Absolute HTTPS URL · 1200×630px · under 8 MB · publicly accessible</text>

    <!-- og:url -->
    <rect x="44" y="656" width="810" height="46" rx="6" fill="rgba(37,99,235,0.08)" stroke="rgba(59,130,246,0.18)" stroke-width="1"/>
    <rect x="44" y="656" width="4" height="46" rx="2" fill="#3b82f6"/>
    <text x="58" y="672" font-size="8" fill="rgba(147,197,253,0.6)" font-family="sans-serif" font-weight="700">og:url — REQUIRED</text>
    <text x="58" y="688" fill="rgba(96,165,250,0.8)">&lt;meta</text>
    <text x="104" y="688" fill="rgba(167,139,250,0.9)"> property=</text>
    <text x="192" y="688" fill="rgba(34,197,94,0.85)">"og:url"</text>
    <text x="250" y="688" fill="rgba(167,139,250,0.9)"> content=</text>
    <text x="336" y="688" fill="rgba(34,197,94,0.85)">"https://yoursite.com/page-slug"</text>
    <text x="58" y="698" font-size="7.5" fill="rgba(255,255,255,0.3)" font-family="sans-serif">Must match your rel="canonical" tag exactly · the same preferred URL</text>

    <!-- og:type -->
    <rect x="44" y="708" width="810" height="46" rx="6" fill="rgba(124,58,237,0.07)" stroke="rgba(124,58,237,0.15)" stroke-width="1"/>
    <rect x="44" y="708" width="4" height="46" rx="2" fill="#6d28d9"/>
    <text x="58" y="724" font-size="8" fill="rgba(167,139,250,0.5)" font-family="sans-serif" font-weight="700">og:type — RECOMMENDED</text>
    <text x="58" y="740" fill="rgba(96,165,250,0.8)">&lt;meta</text>
    <text x="104" y="740" fill="rgba(167,139,250,0.9)"> property=</text>
    <text x="192" y="740" fill="rgba(34,197,94,0.85)">"og:type"</text>
    <text x="258" y="740" fill="rgba(167,139,250,0.9)"> content=</text>
    <text x="344" y="740" fill="rgba(34,197,94,0.85)">"article"</text>
    <text x="58" y="750" font-size="7.5" fill="rgba(255,255,255,0.3)" font-family="sans-serif">Options: website · article · product · video.movie · music.song · profile</text>

    <!-- twitter:card -->
    <rect x="44" y="760" width="810" height="46" rx="6" fill="rgba(255,255,255,0.035)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <rect x="44" y="760" width="4" height="46" rx="2" fill="rgba(255,255,255,0.4)"/>
    <text x="58" y="776" font-size="8" fill="rgba(255,255,255,0.45)" font-family="sans-serif" font-weight="700">twitter:card — FOR TWITTER/X</text>
    <text x="58" y="792" fill="rgba(96,165,250,0.8)">&lt;meta</text>
    <text x="104" y="792" fill="rgba(167,139,250,0.9)"> name=</text>
    <text x="160" y="792" fill="rgba(34,197,94,0.85)">"twitter:card"</text>
    <text x="264" y="792" fill="rgba(167,139,250,0.9)"> content=</text>
    <text x="350" y="792" fill="rgba(34,197,94,0.85)">"summary_large_image"</text>
    <text x="58" y="802" font-size="7.5" fill="rgba(255,255,255,0.3)" font-family="sans-serif">summary_large_image = full-width card · summary = small thumbnail card</text>
  </g>

  <!-- Section 4: Steps -->
  <rect x="28" y="834" width="844" height="250" rx="12" fill="rgba(255,255,255,0.025)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="48" y="858" font-size="12" font-weight="800" fill="url(#aG)">04 — 5 Steps to Generate OG Tags</text>

  <g>
    <!-- Step 1 -->
    <circle cx="72" cy="892" r="18" fill="url(#bG)" filter="url(#sh)"/>
    <text x="72" y="897" text-anchor="middle" font-size="12" font-weight="900" fill="#fff">1</text>
    <text x="100" y="888" font-size="11" font-weight="700" fill="rgba(255,255,255,0.85)">Enter your page title</text>
    <text x="100" y="903" font-size="9" fill="rgba(255,255,255,0.45)">Keep it under 60 characters with your primary keyword near the start</text>

    <!-- Step 2 -->
    <circle cx="72" cy="938" r="18" fill="url(#bG)" filter="url(#sh)"/>
    <text x="72" y="943" text-anchor="middle" font-size="12" font-weight="900" fill="#fff">2</text>
    <text x="100" y="934" font-size="11" font-weight="700" fill="rgba(255,255,255,0.85)">Write your description</text>
    <text x="100" y="949" font-size="9" fill="rgba(255,255,255,0.45)">2–3 compelling sentences under 155 characters with a soft call to action</text>

    <!-- Step 3 -->
    <circle cx="72" cy="984" r="18" fill="url(#bG)" filter="url(#sh)"/>
    <text x="72" y="989" text-anchor="middle" font-size="12" font-weight="900" fill="#fff">3</text>
    <text x="100" y="980" font-size="11" font-weight="700" fill="rgba(255,255,255,0.85)">Add your OG image URL</text>
    <text x="100" y="995" font-size="9" fill="rgba(255,255,255,0.45)">Absolute HTTPS URL pointing to a 1200×630px image on your server</text>

    <!-- Step 4 -->
    <circle cx="72" cy="1030" r="18" fill="url(#bG)" filter="url(#sh)"/>
    <text x="72" y="1035" text-anchor="middle" font-size="12" font-weight="900" fill="#fff">4</text>
    <text x="100" y="1026" font-size="11" font-weight="700" fill="rgba(255,255,255,0.85)">Preview on each platform</text>
    <text x="100" y="1041" font-size="9" fill="rgba(255,255,255,0.45)">Check the live Facebook, LinkedIn, Discord and WhatsApp preview cards</text>

    <!-- Step 5 -->
    <circle cx="72" cy="1076" r="18" fill="url(#bG)" filter="url(#sh)"/>
    <text x="72" y="1081" text-anchor="middle" font-size="12" font-weight="900" fill="#fff">5</text>
    <text x="100" y="1072" font-size="11" font-weight="700" fill="rgba(255,255,255,0.85)">Copy &amp; paste into your page &lt;head&gt;</text>
    <text x="100" y="1087" font-size="9" fill="rgba(255,255,255,0.45)">Click "Copy All" — paste the HTML block before the closing &lt;/head&gt; tag</text>
  </g>

  <!-- CTA -->
  <rect x="28" y="1100" width="844" height="76" rx="12" fill="url(#bG)" filter="url(#sh)"/>
  <text x="450" y="1132" text-anchor="middle" font-size="18" font-weight="900" fill="#fff">Generate Your OG Tags Free</text>
  <text x="450" y="1154" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.75)">Live preview · zero sign-up · works for WordPress, Shopify, Webflow, HTML</text>
  <text x="450" y="1170" text-anchor="middle" font-size="10" font-weight="700" fill="rgba(255,255,255,0.5)">toolnestai.net/seo-tools/open-graph-generator</text>
</svg>
