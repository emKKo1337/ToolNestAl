<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="30%" cy="40%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <radialGradient id="gL" cx="15%" cy="50%" r="55%"><stop offset="0%" stop-color="#5b21b6" stop-opacity="0.45"/><stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/></radialGradient>
    <radialGradient id="gR" cx="85%" cy="50%" r="55%"><stop offset="0%" stop-color="#0e7490" stop-opacity="0.28"/><stop offset="100%" stop-color="#0e7490" stop-opacity="0"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="bG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient>
    <linearGradient id="lapG" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1a1040"/><stop offset="100%" stop-color="#0d0824"/></linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#5b21b6" flood-opacity="0.5"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="180" cy="315" rx="600" ry="500" fill="url(#gL)"/>
  <ellipse cx="1020" cy="315" rx="600" ry="500" fill="url(#gR)"/>
  <text x="60" y="70" font-size="14" font-weight="700" fill="url(#aG)" filter="url(#glow)">ToolNest AI</text>
  <text x="60" y="106" font-size="13" fill="rgba(255,255,255,0.35)">Image Tools - Base64 to Image</text>
  <text x="60" y="185" font-size="46" font-weight="900" fill="url(#aG)" filter="url(#glow)">Base64 to</text>
  <text x="60" y="245" font-size="46" font-weight="900" fill="url(#aG)" filter="url(#glow)">Image</text>
  <text x="60" y="300" font-size="18" fill="rgba(255,255,255,0.6)">Decode Base64 strings back to image</text>
  <text x="60" y="328" font-size="18" fill="rgba(255,255,255,0.6)">Preview, download, convert — free</text>
  <g>
    <rect x="60" y="358" width="120" height="52" rx="8" fill="rgba(124,58,237,0.2)" stroke="rgba(124,58,237,0.4)" stroke-width="1"/>
    <text x="120" y="382" text-anchor="middle" font-size="11" font-weight="900" fill="#a78bfa">Preview</text>
    <text x="120" y="400" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">instant render</text>
    <rect x="192" y="358" width="120" height="52" rx="8" fill="rgba(14,116,144,0.15)" stroke="rgba(14,116,144,0.35)" stroke-width="1"/>
    <text x="252" y="382" text-anchor="middle" font-size="11" font-weight="900" fill="#67e8f9">Download</text>
    <text x="252" y="400" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">PNG/JPG file</text>
    <rect x="324" y="358" width="120" height="52" rx="8" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
    <text x="384" y="382" text-anchor="middle" font-size="11" font-weight="900" fill="#34d399">Data URI</text>
    <text x="384" y="400" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">or raw string</text>
    <rect x="456" y="358" width="100" height="52" rx="8" fill="rgba(251,191,36,0.1)" stroke="rgba(251,191,36,0.25)" stroke-width="1"/>
    <text x="506" y="382" text-anchor="middle" font-size="11" font-weight="900" fill="#fbbf24">Private</text>
    <text x="506" y="400" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">no upload</text>
  </g>
  <text x="60" y="560" font-size="14" fill="rgba(255,255,255,0.25)">toolnestai.net/image-tools/base64-to-image</text>
  <!-- Laptop UI -->
  <rect x="630" y="60" width="530" height="490" rx="16" fill="url(#lapG)" stroke="rgba(124,58,237,0.3)" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="630" y="60" width="530" height="36" rx="16" fill="rgba(255,255,255,0.05)"/>
  <rect x="630" y="78" width="530" height="18" fill="rgba(255,255,255,0.02)"/>
  <circle cx="655" cy="78" r="6" fill="rgba(239,68,68,0.6)"/>
  <circle cx="675" cy="78" r="6" fill="rgba(251,191,36,0.6)"/>
  <circle cx="695" cy="78" r="6" fill="rgba(34,197,94,0.6)"/>
  <!-- Input textarea -->
  <rect x="648" y="108" width="506" height="130" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="658" y="126" font-size="8" fill="rgba(255,255,255,0.35)">Paste Base64 string here</text>
  <text x="658" y="144" font-size="7.5" font-family="monospace" fill="rgba(167,139,250,0.5)">data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAQAAAAEA</text>
  <text x="658" y="158" font-size="7.5" font-family="monospace" fill="rgba(255,255,255,0.3)">CAYAAABccvqrhAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUA</text>
  <text x="658" y="172" font-size="7.5" font-family="monospace" fill="rgba(255,255,255,0.3)">AAAAJcEhZcwAADsMAAAqMAA7MGAAAJiklEQVR4Ae3BvWsUCQDG8e/c</text>
  <text x="658" y="186" font-size="7.5" font-family="monospace" fill="rgba(255,255,255,0.25)">7tXa2tra2toqKioqKioqKioqKioqKioqKioqKio...</text>
  <!-- Arrow -->
  <text x="901" y="262" text-anchor="middle" font-size="18" fill="rgba(255,255,255,0.3)">↓</text>
  <!-- Preview -->
  <rect x="648" y="276" width="230" height="150" rx="8" fill="rgba(52,211,153,0.06)" stroke="rgba(52,211,153,0.2)" stroke-width="1"/>
  <text x="763" y="310" text-anchor="middle" font-size="10" fill="rgba(52,211,153,0.6)">Image Preview</text>
  <rect x="668" y="320" width="190" height="90" rx="4" fill="rgba(167,139,250,0.15)"/>
  <text x="763" y="375" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.35)">decoded PNG</text>
  <!-- Info -->
  <rect x="892" y="276" width="262" height="150" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="904" y="298" font-size="9" fill="rgba(255,255,255,0.35)">Format detected</text>
  <text x="904" y="316" font-size="11" font-weight="700" fill="rgba(167,139,250,0.85)">PNG</text>
  <text x="904" y="340" font-size="9" fill="rgba(255,255,255,0.35)">String length</text>
  <text x="904" y="358" font-size="11" font-weight="700" fill="#67e8f9">168,452 chars</text>
  <text x="904" y="380" font-size="9" fill="rgba(255,255,255,0.35)">Decoded size</text>
  <text x="904" y="398" font-size="11" font-weight="700" fill="#34d399">~123.4 KB</text>
  <!-- Buttons -->
  <rect x="648" y="440" width="246" height="40" rx="8" fill="url(#bG)" filter="url(#sh)"/>
  <text x="771" y="464" text-anchor="middle" font-size="12" font-weight="900" fill="#fff">Download Image</text>
  <rect x="906" y="440" width="248" height="40" rx="8" fill="rgba(52,211,153,0.12)" stroke="rgba(52,211,153,0.3)" stroke-width="1"/>
  <text x="1030" y="464" text-anchor="middle" font-size="12" font-weight="700" fill="#6ee7b7">Copy Data URI</text>
  <rect x="620" y="550" width="560" height="14" rx="4" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
</svg>
