<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="30%" cy="50%" r="80%"><stop offset="0%" stop-color="#0f0825"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="40" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="250" cy="315" rx="350" ry="250" fill="#5b21b6" opacity="0.12" filter="url(#glow)"/>
  <text x="72" y="72" font-family="sans-serif" font-size="18" font-weight="800" fill="url(#aG)">ToolNest AI</text>
  <text x="72" y="96" font-family="sans-serif" font-size="13" fill="#4d4354">toolnestai.net/pdf-tools/rotate-pdf</text>
  <text x="72" y="200" font-family="sans-serif" font-size="56" font-weight="900" fill="#e2e2e2">Rotate PDF Pages</text>
  <text x="72" y="260" font-family="sans-serif" font-size="22" fill="#9b8da8">Fix sideways scans — rotate individual or all pages</text>
  <text x="72" y="300" font-family="sans-serif" font-size="18" fill="#7a6d84">90°, 180°, 270° — free, browser-side</text>
  <rect x="72" y="330" width="100" height="32" rx="16" fill="#5b21b6" opacity="0.3"/>
  <text x="122" y="351" font-family="sans-serif" font-size="13" font-weight="700" fill="#a78bfa" text-anchor="middle">↺ 90°</text>
  <rect x="186" y="330" width="100" height="32" rx="16" fill="#5b21b6" opacity="0.3"/>
  <text x="236" y="351" font-family="sans-serif" font-size="13" font-weight="700" fill="#a78bfa" text-anchor="middle">↻ 90°</text>
  <rect x="300" y="330" width="90" height="32" rx="16" fill="#374151" opacity="0.6"/>
  <text x="345" y="351" font-family="sans-serif" font-size="13" font-weight="700" fill="#9ca3af" text-anchor="middle">180°</text>
  <!-- Rotated page visual -->
  <rect x="800" y="200" width="160" height="200" rx="10" fill="#1a1040" stroke="#7c3aed" stroke-width="2" transform="rotate(-90,880,300)"/>
  <text x="880" y="305" font-family="sans-serif" font-size="16" fill="#7a6d84" text-anchor="middle" transform="rotate(-90,880,305)">Sideways →</text>
  <text x="1020" y="290" font-family="sans-serif" font-size="30" fill="#a78bfa">↻</text>
  <rect x="1060" y="160" width="100" height="160" rx="10" fill="#1a1040" stroke="#a78bfa" stroke-width="2"/>
  <text x="1110" y="245" font-family="sans-serif" font-size="11" fill="#a78bfa" text-anchor="middle">Fixed!</text>
</svg>
