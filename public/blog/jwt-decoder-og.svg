<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="30%" cy="40%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <radialGradient id="gL" cx="15%" cy="50%" r="55%"><stop offset="0%" stop-color="#5b21b6" stop-opacity="0.45"/><stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/></radialGradient>
    <radialGradient id="gR" cx="85%" cy="50%" r="55%"><stop offset="0%" stop-color="#0e7490" stop-opacity="0.28"/><stop offset="100%" stop-color="#0e7490" stop-opacity="0"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="bG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient>
    <linearGradient id="lapG" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1a1040"/><stop offset="100%" stop-color="#0d0824"/></linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#5b21b6" flood-opacity="0.5"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="180" cy="315" rx="600" ry="500" fill="url(#gL)"/>
  <ellipse cx="1020" cy="315" rx="600" ry="500" fill="url(#gR)"/>

  <text x="60" y="70" font-size="14" font-weight="700" fill="url(#aG)" filter="url(#glow)">ToolNest AI</text>
  <text x="60" y="106" font-size="13" fill="rgba(255,255,255,0.35)">Developer Tools › JWT Decoder</text>
  <text x="60" y="185" font-size="52" font-weight="900" fill="url(#aG)" filter="url(#glow)">JWT</text>
  <text x="60" y="245" font-size="52" font-weight="900" fill="url(#aG)" filter="url(#glow)">Decoder</text>
  <text x="60" y="300" font-size="18" fill="rgba(255,255,255,0.6)">Decode header, payload &amp; signature</text>
  <text x="60" y="328" font-size="18" fill="rgba(255,255,255,0.6)">Instant, client-side — Free, no sign-up</text>

  <rect x="60" y="358" width="110" height="52" rx="8" fill="rgba(124,58,237,0.2)" stroke="rgba(124,58,237,0.4)" stroke-width="1"/>
  <text x="115" y="382" text-anchor="middle" font-size="14" font-weight="900" fill="#a78bfa">RFC 7519</text>
  <text x="115" y="400" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">standard</text>

  <rect x="182" y="358" width="110" height="52" rx="8" fill="rgba(14,116,144,0.15)" stroke="rgba(14,116,144,0.35)" stroke-width="1"/>
  <text x="237" y="382" text-anchor="middle" font-size="18" font-weight="900" fill="#67e8f9">3 parts</text>
  <text x="237" y="400" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">header.payload.sig</text>

  <rect x="304" y="358" width="110" height="52" rx="8" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
  <text x="359" y="382" text-anchor="middle" font-size="16" font-weight="900" fill="#34d399">Client-side</text>
  <text x="359" y="400" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">never sent to server</text>

  <rect x="426" y="358" width="110" height="52" rx="8" fill="rgba(251,191,36,0.1)" stroke="rgba(251,191,36,0.25)" stroke-width="1"/>
  <text x="481" y="382" text-anchor="middle" font-size="20" font-weight="900" fill="#fbbf24">Free</text>
  <text x="481" y="400" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">no account</text>

  <text x="60" y="560" font-size="14" fill="rgba(255,255,255,0.25)">toolnestai.net/developer-tools/jwt-decoder</text>

  <rect x="630" y="60" width="530" height="490" rx="16" fill="url(#lapG)" stroke="rgba(124,58,237,0.3)" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="630" y="60" width="530" height="36" rx="16" fill="rgba(255,255,255,0.05)"/>
  <rect x="630" y="78" width="530" height="18" fill="rgba(255,255,255,0.02)"/>
  <circle cx="655" cy="78" r="6" fill="rgba(239,68,68,0.6)"/>
  <circle cx="675" cy="78" r="6" fill="rgba(251,191,36,0.6)"/>
  <circle cx="695" cy="78" r="6" fill="rgba(34,197,94,0.6)"/>

  <text x="648" y="120" font-size="8.5" font-weight="700" fill="rgba(255,255,255,0.3)">ENCODED TOKEN</text>
  <rect x="640" y="126" width="506" height="52" rx="9" fill="rgba(0,0,0,0.5)" stroke="rgba(124,58,237,0.4)" stroke-width="1.5"/>
  <text x="654" y="146" font-family="monospace" font-size="9.5">
    <tspan fill="#f472b6">eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9</tspan><tspan fill="rgba(255,255,255,0.3)">.</tspan>
  </text>
  <text x="654" y="162" font-family="monospace" font-size="9.5">
    <tspan fill="#a78bfa">eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6</tspan><tspan fill="rgba(255,255,255,0.3)">.</tspan>
  </text>

  <text x="648" y="200" font-size="8.5" font-weight="700" fill="rgba(244,114,182,0.8)">HEADER</text>
  <rect x="640" y="206" width="506" height="46" rx="7" fill="rgba(244,114,182,0.06)" stroke="rgba(244,114,182,0.22)" stroke-width="1"/>
  <text x="654" y="226" font-family="monospace" font-size="10.5" fill="rgba(244,114,182,0.9)">{`{ "alg": "HS256", "typ": "JWT" }`}</text>

  <text x="648" y="272" font-size="8.5" font-weight="700" fill="rgba(167,139,250,0.8)">PAYLOAD</text>
  <rect x="640" y="278" width="506" height="70" rx="7" fill="rgba(167,139,250,0.06)" stroke="rgba(167,139,250,0.22)" stroke-width="1"/>
  <text x="654" y="296" font-family="monospace" font-size="10" fill="rgba(167,139,250,0.9)">{`{`}</text>
  <text x="668" y="312" font-family="monospace" font-size="10" fill="rgba(167,139,250,0.9)">"sub": "1234567890", "name": "Jane Doe",</text>
  <text x="668" y="328" font-family="monospace" font-size="10" fill="rgba(167,139,250,0.9)">"exp": 1735689600</text>
  <text x="654" y="340" font-family="monospace" font-size="10" fill="rgba(167,139,250,0.9)">{`}`}</text>

  <rect x="640" y="360" width="246" height="36" rx="7" fill="rgba(52,211,153,0.1)" stroke="rgba(52,211,153,0.25)" stroke-width="1"/>
  <text x="763" y="383" text-anchor="middle" font-size="10" font-weight="700" fill="#34d399">✓ Valid — expires in 6 days</text>

  <rect x="896" y="360" width="250" height="36" rx="7" fill="rgba(103,232,249,0.06)" stroke="rgba(103,232,249,0.2)" stroke-width="1"/>
  <text x="1021" y="383" text-anchor="middle" font-size="10" font-weight="700" fill="#67e8f9">Signature not verified</text>

  <rect x="640" y="410" width="506" height="48" rx="7" fill="rgba(251,191,36,0.06)" stroke="rgba(251,191,36,0.2)" stroke-width="1"/>
  <text x="654" y="430" font-size="9.5" font-weight="700" fill="rgba(251,191,36,0.85)">⚠ Never trust claims without verifying the signature</text>
  <text x="654" y="446" font-size="8.5" fill="rgba(255,255,255,0.45)">Decoding ≠ verifying — anyone can read a JWT's payload</text>

  <rect x="620" y="550" width="560" height="14" rx="4" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="760" y="562" width="260" height="8" rx="4" fill="rgba(255,255,255,0.03)"/>
</svg>
