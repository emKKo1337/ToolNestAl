<svg viewBox="0 0 900 1200" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <radialGradient id="gT" cx="50%" cy="10%" r="60%"><stop offset="0%" stop-color="#5b21b6" stop-opacity="0.35"/><stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/></radialGradient>
    <radialGradient id="gB" cx="50%" cy="90%" r="60%"><stop offset="0%" stop-color="#0e7490" stop-opacity="0.2"/><stop offset="100%" stop-color="#0e7490" stop-opacity="0"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="bG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient>
  </defs>
  <rect width="900" height="1200" fill="url(#bg)"/>
  <ellipse cx="450" cy="200" rx="700" ry="400" fill="url(#gT)"/>
  <ellipse cx="450" cy="1000" rx="700" ry="400" fill="url(#gB)"/>

  <text x="450" y="52" text-anchor="middle" font-size="28" font-weight="900" fill="url(#aG)">The Complete Text Analysis Guide</text>
  <text x="450" y="76" text-anchor="middle" font-size="13" fill="rgba(255,255,255,0.38)">Readability scores, keyword density, and every metric explained</text>
  <text x="450" y="94" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.22)">toolnestai.net/text-tools/text-statistics</text>

  <!-- Section 1 -->
  <rect x="32" y="110" width="836" height="38" rx="8" fill="rgba(124,58,237,0.18)" stroke="rgba(124,58,237,0.3)" stroke-width="1"/>
  <text x="450" y="134" text-anchor="middle" font-size="15" font-weight="800" fill="#a78bfa">01 — Flesch Reading Ease</text>

  <rect x="32" y="154" width="836" height="110" rx="10" fill="rgba(255,255,255,0.025)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="450" y="178" text-anchor="middle" font-size="12" fill="rgba(255,255,255,0.65)">Developed in 1948, this formula scores text 0-100 based on average sentence</text>
  <text x="450" y="198" text-anchor="middle" font-size="12" fill="rgba(255,255,255,0.65)">length and syllables per word. Higher = easier to read.</text>
  <text x="450" y="224" text-anchor="middle" font-family="monospace" font-size="11" fill="rgba(167,139,250,0.85)">206.835 − 1.015(words/sentence) − 84.6(syllables/word)</text>
  <text x="450" y="246" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.3)">Score 60-70 = easily understood by 8th-9th graders — the general web content target</text>

  <!-- Section 2: Scale -->
  <rect x="32" y="282" width="836" height="38" rx="8" fill="rgba(14,116,144,0.18)" stroke="rgba(14,116,144,0.3)" stroke-width="1"/>
  <text x="450" y="306" text-anchor="middle" font-size="15" font-weight="800" fill="#67e8f9">02 — The Reading Ease Scale</text>

  <g text-anchor="middle" font-size="9.5">
    <rect x="32" y="326" width="130" height="70" rx="7" fill="rgba(239,68,68,0.1)" stroke="rgba(239,68,68,0.22)" stroke-width="1"/>
    <text x="97" y="350" font-weight="700" fill="#f87171">0-29</text>
    <text x="97" y="368" fill="rgba(255,255,255,0.5)">Very Confusing</text>
    <text x="97" y="384" fill="rgba(255,255,255,0.3)" font-size="8">College grad</text>

    <rect x="170" y="326" width="130" height="70" rx="7" fill="rgba(251,146,60,0.1)" stroke="rgba(251,146,60,0.22)" stroke-width="1"/>
    <text x="235" y="350" font-weight="700" fill="#fb923c">30-49</text>
    <text x="235" y="368" fill="rgba(255,255,255,0.5)">Difficult</text>
    <text x="235" y="384" fill="rgba(255,255,255,0.3)" font-size="8">College level</text>

    <rect x="308" y="326" width="130" height="70" rx="7" fill="rgba(251,191,36,0.1)" stroke="rgba(251,191,36,0.22)" stroke-width="1"/>
    <text x="373" y="350" font-weight="700" fill="#fbbf24">50-59</text>
    <text x="373" y="368" fill="rgba(255,255,255,0.5)">Fairly Difficult</text>
    <text x="373" y="384" fill="rgba(255,255,255,0.3)" font-size="8">10th-12th grade</text>

    <rect x="446" y="326" width="130" height="70" rx="7" fill="rgba(163,230,53,0.1)" stroke="rgba(163,230,53,0.22)" stroke-width="1"/>
    <text x="511" y="350" font-weight="700" fill="#a3e635">60-69</text>
    <text x="511" y="368" fill="rgba(255,255,255,0.5)">Standard</text>
    <text x="511" y="384" fill="rgba(255,255,255,0.3)" font-size="8">8th-9th grade</text>

    <rect x="584" y="326" width="130" height="70" rx="7" fill="rgba(52,211,153,0.1)" stroke="rgba(52,211,153,0.22)" stroke-width="1"/>
    <text x="649" y="350" font-weight="700" fill="#34d399">70-79</text>
    <text x="649" y="368" fill="rgba(255,255,255,0.5)">Fairly Easy</text>
    <text x="649" y="384" fill="rgba(255,255,255,0.3)" font-size="8">7th grade</text>

    <rect x="722" y="326" width="146" height="70" rx="7" fill="rgba(103,232,249,0.1)" stroke="rgba(103,232,249,0.22)" stroke-width="1"/>
    <text x="795" y="350" font-weight="700" fill="#67e8f9">80-100</text>
    <text x="795" y="368" fill="rgba(255,255,255,0.5)">Easy/Very Easy</text>
    <text x="795" y="384" fill="rgba(255,255,255,0.3)" font-size="8">5th-6th grade</text>
  </g>

  <!-- Section 3: Keyword density -->
  <rect x="32" y="414" width="836" height="38" rx="8" fill="rgba(16,185,129,0.14)" stroke="rgba(16,185,129,0.25)" stroke-width="1"/>
  <text x="450" y="438" text-anchor="middle" font-size="15" font-weight="800" fill="#34d399">03 — Keyword Density for SEO</text>

  <rect x="32" y="458" width="836" height="110" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="450" y="482" text-anchor="middle" font-family="monospace" font-size="12" fill="rgba(255,255,255,0.6)">Keyword Density = (keyword occurrences ÷ total words) × 100</text>
  <text x="450" y="508" text-anchor="middle" font-size="10.5" fill="rgba(255,255,255,0.55)">Ideal range: roughly 1-2% per target keyword. Above ~3% risks looking like</text>
  <text x="450" y="526" text-anchor="middle" font-size="10.5" fill="rgba(255,255,255,0.55)">"keyword stuffing" — an outdated SEO tactic that search engines now penalize.</text>
  <text x="450" y="548" text-anchor="middle" font-size="9.5" fill="rgba(255,255,255,0.3)">Modern SEO favors natural language and semantic variation over exact-match repetition</text>

  <!-- Section 4: Syllable counting -->
  <rect x="32" y="596" width="836" height="38" rx="8" fill="rgba(124,58,237,0.18)" stroke="rgba(124,58,237,0.3)" stroke-width="1"/>
  <text x="450" y="620" text-anchor="middle" font-size="15" font-weight="800" fill="#a78bfa">04 — Why Syllable Counts Are Approximate</text>

  <g font-size="10">
    <rect x="32" y="640" width="404" height="90" rx="8" fill="rgba(167,139,250,0.06)" stroke="rgba(167,139,250,0.16)" stroke-width="1"/>
    <text x="48" y="662" font-weight="700" fill="#a78bfa">The heuristic</text>
    <text x="48" y="682" fill="rgba(255,255,255,0.5)">Count vowel groups — each group</text>
    <text x="48" y="698" fill="rgba(255,255,255,0.5)">≈ one syllable ("beau-ti-ful" = 3)</text>
    <text x="48" y="716" fill="rgba(255,255,255,0.3)" font-size="8.5">Works for most words, most of the time</text>

    <rect x="464" y="640" width="404" height="90" rx="8" fill="rgba(239,68,68,0.06)" stroke="rgba(239,68,68,0.16)" stroke-width="1"/>
    <text x="480" y="662" font-weight="700" fill="#f87171">The exceptions</text>
    <text x="480" y="682" fill="rgba(255,255,255,0.5)">Silent "e" (make, like), dialect</text>
    <text x="480" y="698" fill="rgba(255,255,255,0.5)">variation (fire), "y" as vowel (happy)</text>
    <text x="480" y="716" fill="rgba(255,255,255,0.3)" font-size="8.5">Small errors average out across a document</text>
  </g>

  <!-- Section 5: Other metrics -->
  <rect x="32" y="748" width="836" height="38" rx="8" fill="rgba(14,116,144,0.18)" stroke="rgba(14,116,144,0.3)" stroke-width="1"/>
  <text x="450" y="772" text-anchor="middle" font-size="15" font-weight="800" fill="#67e8f9">05 — Other Metrics Computed</text>

  <g font-size="9.5">
    <rect x="32" y="792" width="268" height="70" rx="7" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    <text x="48" y="812" font-weight="700" fill="rgba(167,139,250,0.85)">Reading &amp; speaking time</text>
    <text x="48" y="830" fill="rgba(255,255,255,0.5)">Based on avg 238 wpm reading,</text>
    <text x="48" y="844" fill="rgba(255,255,255,0.5)">130 wpm speaking</text>

    <rect x="314" y="792" width="268" height="70" rx="7" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    <text x="330" y="812" font-weight="700" fill="rgba(103,232,249,0.85)">Unique word ratio</text>
    <text x="330" y="830" fill="rgba(255,255,255,0.5)">Vocabulary diversity —</text>
    <text x="330" y="844" fill="rgba(255,255,255,0.5)">unique words ÷ total words</text>

    <rect x="596" y="792" width="272" height="70" rx="7" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    <text x="612" y="812" font-weight="700" fill="rgba(52,211,153,0.85)">Avg word/sentence length</text>
    <text x="612" y="830" fill="rgba(255,255,255,0.5)">Character count and word</text>
    <text x="612" y="844" fill="rgba(255,255,255,0.5)">count divided appropriately</text>
  </g>

  <!-- Section 6: mistakes -->
  <rect x="32" y="882" width="836" height="38" rx="8" fill="rgba(239,68,68,0.12)" stroke="rgba(239,68,68,0.22)" stroke-width="1"/>
  <text x="450" y="906" text-anchor="middle" font-size="15" font-weight="800" fill="rgba(239,68,68,0.85)">06 — Common Mistakes</text>

  <g font-size="10">
    <rect x="32" y="926" width="836" height="40" rx="7" fill="rgba(255,255,255,0.02)" stroke="rgba(239,68,68,0.1)" stroke-width="1"/>
    <text x="48" y="944" fill="rgba(239,68,68,0.7)">✗</text>
    <text x="68" y="944" fill="rgba(255,255,255,0.6)">Chasing an arbitrarily low grade level for content that genuinely needs technical precision</text>
    <text x="68" y="960" fill="rgba(255,255,255,0.4)" font-size="8.5">Readability targets should match the audience, not a universal "lower is better" rule.</text>

    <rect x="32" y="970" width="836" height="40" rx="7" fill="rgba(255,255,255,0.02)" stroke="rgba(239,68,68,0.1)" stroke-width="1"/>
    <text x="48" y="988" fill="rgba(239,68,68,0.7)">✗</text>
    <text x="68" y="988" fill="rgba(255,255,255,0.6)">Stuffing keywords past 3% density to game search rankings</text>
    <text x="68" y="1004" fill="rgba(255,255,255,0.4)" font-size="8.5">Modern search engines penalize unnatural keyword repetition.</text>
  </g>

  <text x="450" y="1044" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.28)">Free tool: toolnestai.net/text-tools/text-statistics</text>
  <text x="450" y="1064" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.2)">Readability scores, keyword density, and 15+ metrics — client-side, instant</text>
</svg>
