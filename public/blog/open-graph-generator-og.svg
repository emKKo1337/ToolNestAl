    <text x="893" y="387" fill="rgba(167,139,250,0.7)">&lt;meta property=</text><text x="993" y="387" fill="rgba(34,197,94,0.85)">"og:description"</text>
    <text x="893" y="400" fill="rgba(255,255,255,0.4)">     content=</text><text x="963" y="400" fill="rgba(34,197,94,0.7)">"Generate perfect OG tags…"</text>
    <text x="893" y="413" fill="rgba(167,139,250,0.7)">&lt;meta property=</text><text x="993" y="413" fill="rgba(34,197,94,0.85)">"og:image"</text>
    <text x="893" y="426" fill="rgba(255,255,255,0.4)">     content=</text><text x="963" y="426" fill="rgba(34,197,94,0.7)">"https://toolnestai.net/og-…"</text>
    <text x="893" y="439" fill="rgba(167,139,250,0.7)">&lt;meta property=</text><text x="993" y="439" fill="rgba(34,197,94,0.85)">"og:url"</text>
    <text x="893" y="452" fill="rgba(96,165,250,0.5)">&lt;!-- Twitter Card --&gt;</text>
    <text x="893" y="465" fill="rgba(167,139,250,0.7)">&lt;meta name=</text><text x="963" y="465" fill="rgba(34,197,94,0.85)">"twitter:card" …</text>
