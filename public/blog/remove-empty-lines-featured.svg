<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="30%" cy="40%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <radialGradient id="gL" cx="15%" cy="50%" r="55%"><stop offset="0%" stop-color="#5b21b6" stop-opacity="0.45"/><stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/></radialGradient>
    <radialGradient id="gR" cx="85%" cy="50%" r="55%"><stop offset="0%" stop-color="#0e7490" stop-opacity="0.28"/><stop offset="100%" stop-color="#0e7490" stop-opacity="0"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="bG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient>
    <linearGradient id="lapG" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1a1040"/><stop offset="100%" stop-color="#0d0824"/></linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#5b21b6" flood-opacity="0.5"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="180" cy="315" rx="600" ry="500" fill="url(#gL)"/>
  <ellipse cx="1020" cy="315" rx="600" ry="500" fill="url(#gR)"/>

  <text x="60" y="70" font-size="14" font-weight="700" fill="url(#aG)" filter="url(#glow)">ToolNest AI</text>
  <text x="60" y="106" font-size="13" fill="rgba(255,255,255,0.35)">Text Tools › Remove Empty Lines</text>
  <text x="60" y="175" font-size="40" font-weight="900" fill="url(#aG)" filter="url(#glow)">Remove</text>
  <text x="60" y="220" font-size="40" font-weight="900" fill="url(#aG)" filter="url(#glow)">Empty Lines</text>
  <text x="60" y="270" font-size="18" fill="rgba(255,255,255,0.6)">Blank &amp; whitespace-only lines</text>
  <text x="60" y="298" font-size="18" fill="rgba(255,255,255,0.6)">Clean up any text — Free, instant</text>

  <rect x="60" y="330" width="110" height="52" rx="8" fill="rgba(124,58,237,0.2)" stroke="rgba(124,58,237,0.4)" stroke-width="1"/>
  <text x="115" y="354" text-anchor="middle" font-size="14" font-weight="900" fill="#a78bfa">Regex</text>
  <text x="115" y="372" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">whitespace-aware</text>

  <rect x="182" y="330" width="110" height="52" rx="8" fill="rgba(14,116,144,0.15)" stroke="rgba(14,116,144,0.35)" stroke-width="1"/>
  <text x="237" y="354" text-anchor="middle" font-size="18" font-weight="900" fill="#67e8f9">2 modes</text>
  <text x="237" y="372" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">remove/collapse</text>

  <rect x="304" y="330" width="110" height="52" rx="8" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
  <text x="359" y="354" text-anchor="middle" font-size="16" font-weight="900" fill="#34d399">CRLF/LF</text>
  <text x="359" y="372" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">safe</text>

  <rect x="426" y="330" width="110" height="52" rx="8" fill="rgba(251,191,36,0.1)" stroke="rgba(251,191,36,0.25)" stroke-width="1"/>
  <text x="481" y="354" text-anchor="middle" font-size="20" font-weight="900" fill="#fbbf24">Free</text>
  <text x="481" y="372" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">no account</text>

  <text x="60" y="560" font-size="14" fill="rgba(255,255,255,0.25)">toolnestai.net/text-tools/remove-empty-lines</text>

  <!-- Right: Laptop with remove empty lines UI -->
  <rect x="630" y="60" width="530" height="490" rx="16" fill="url(#lapG)" stroke="rgba(124,58,237,0.3)" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="630" y="60" width="530" height="36" rx="16" fill="rgba(255,255,255,0.05)"/>
  <rect x="630" y="78" width="530" height="18" fill="rgba(255,255,255,0.02)"/>
  <circle cx="655" cy="78" r="6" fill="rgba(239,68,68,0.6)"/>
  <circle cx="675" cy="78" r="6" fill="rgba(251,191,36,0.6)"/>
  <circle cx="695" cy="78" r="6" fill="rgba(34,197,94,0.6)"/>

  <!-- Options -->
  <g font-size="9" text-anchor="middle">
    <rect x="642" y="106" width="150" height="24" rx="6" fill="url(#bG)"/>
    <text x="717" y="122" fill="#fff" font-weight="700">Remove all blank lines</text>
    <rect x="800" y="106" width="150" height="24" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="875" y="122" fill="rgba(255,255,255,0.4)">Collapse to single blank</text>
  </g>

  <!-- Before/After -->
  <text x="650" y="150" font-size="8.5" font-weight="700" fill="rgba(255,255,255,0.3)">INPUT (9 lines)</text>
  <rect x="642" y="156" width="240" height="150" rx="7" fill="rgba(0,0,0,0.4)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="656" y="176" font-family="monospace" font-size="10.5" fill="rgba(255,255,255,0.6)">Chapter One</text>
  <text x="656" y="196" font-family="monospace" font-size="9" fill="rgba(239,68,68,0.6)">(empty)</text>
  <text x="656" y="216" font-family="monospace" font-size="9" fill="rgba(251,191,36,0.6)">(3 spaces only)</text>
  <text x="656" y="236" font-family="monospace" font-size="10.5" fill="rgba(255,255,255,0.6)">It was a dark night.</text>
  <text x="656" y="256" font-family="monospace" font-size="9" fill="rgba(239,68,68,0.6)">(empty)</text>
  <text x="656" y="276" font-family="monospace" font-size="9" fill="rgba(239,68,68,0.6)">(empty)</text>
  <text x="656" y="296" font-family="monospace" font-size="10.5" fill="rgba(255,255,255,0.6)">The rain fell hard.</text>

  <text x="900" y="150" font-size="8.5" font-weight="700" fill="rgba(52,211,153,0.75)">OUTPUT (3 lines)</text>
  <rect x="892" y="156" width="240" height="150" rx="7" fill="rgba(52,211,153,0.08)" stroke="rgba(52,211,153,0.25)" stroke-width="1"/>
  <text x="906" y="176" font-family="monospace" font-size="10.5" fill="rgba(110,231,183,0.9)">Chapter One</text>
  <text x="906" y="196" font-family="monospace" font-size="10.5" fill="rgba(110,231,183,0.9)">It was a dark night.</text>
  <text x="906" y="216" font-family="monospace" font-size="10.5" fill="rgba(110,231,183,0.9)">The rain fell hard.</text>
  <text x="906" y="248" font-family="monospace" font-size="8.5" fill="rgba(251,191,36,0.7)">⚠ "3 spaces only" line also</text>
  <text x="906" y="262" font-family="monospace" font-size="8.5" fill="rgba(251,191,36,0.7)">removed (whitespace-only ≈ empty)</text>

  <!-- Stats -->
  <g text-anchor="middle" font-size="9">
    <rect x="642" y="320" width="163" height="42" rx="7" fill="rgba(124,58,237,0.1)" stroke="rgba(124,58,237,0.22)" stroke-width="1"/>
    <text x="723" y="342" font-size="14" font-weight="900" fill="#a78bfa">9 → 3</text>
    <text x="723" y="356" fill="rgba(255,255,255,0.4)">lines (6 empty removed)</text>

    <rect x="815" y="320" width="333" height="42" rx="7" fill="rgba(14,116,144,0.08)" stroke="rgba(14,116,144,0.2)" stroke-width="1"/>
    <text x="981" y="342" font-size="12" font-weight="900" fill="#67e8f9">Whitespace-only lines detected too</text>
    <text x="981" y="356" fill="rgba(255,255,255,0.4)">not just truly empty ones</text>
  </g>

  <!-- Buttons -->
  <rect x="642" y="380" width="244" height="30" rx="8" fill="url(#bG)" filter="url(#sh)"/>
  <text x="764" y="399" text-anchor="middle" font-size="12" font-weight="900" fill="#fff">Remove Empty Lines</text>
  <rect x="898" y="380" width="250" height="30" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="1023" y="399" text-anchor="middle" font-size="12" fill="rgba(255,255,255,0.35)">Copy Result</text>

  <!-- Use case chips -->
  <text x="650" y="436" font-size="8.5" font-weight="700" fill="rgba(255,255,255,0.3)">COMMON USES</text>
  <g font-size="9" text-anchor="middle">
    <rect x="642" y="442" width="164" height="24" rx="6" fill="rgba(124,58,237,0.1)" stroke="rgba(124,58,237,0.2)" stroke-width="1"/>
    <text x="724" y="458" fill="rgba(167,139,250,0.8)">Copy-pasted docs</text>
    <rect x="814" y="442" width="164" height="24" rx="6" fill="rgba(14,116,144,0.08)" stroke="rgba(14,116,144,0.18)" stroke-width="1"/>
    <text x="896" y="458" fill="rgba(103,232,249,0.8)">Code cleanup</text>
    <rect x="986" y="442" width="162" height="24" rx="6" fill="rgba(16,185,129,0.06)" stroke="rgba(16,185,129,0.16)" stroke-width="1"/>
    <text x="1067" y="458" fill="rgba(52,211,153,0.8)">CSV/log prep</text>
  </g>

  <rect x="620" y="550" width="560" height="14" rx="4" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="760" y="562" width="260" height="8" rx="4" fill="rgba(255,255,255,0.03)"/>
</svg>
