<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="30%" cy="40%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <radialGradient id="gL" cx="15%" cy="50%" r="55%"><stop offset="0%" stop-color="#5b21b6" stop-opacity="0.45"/><stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/></radialGradient>
    <radialGradient id="gR" cx="85%" cy="50%" r="55%"><stop offset="0%" stop-color="#0e7490" stop-opacity="0.28"/><stop offset="100%" stop-color="#0e7490" stop-opacity="0"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="bG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient>
    <linearGradient id="lapG" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1a1040"/><stop offset="100%" stop-color="#0d0824"/></linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#5b21b6" flood-opacity="0.5"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="180" cy="315" rx="600" ry="500" fill="url(#gL)"/>
  <ellipse cx="1020" cy="315" rx="600" ry="500" fill="url(#gR)"/>

  <text x="60" y="70" font-size="14" font-weight="700" fill="url(#aG)" filter="url(#glow)">ToolNest AI</text>
  <text x="60" y="106" font-size="13" fill="rgba(255,255,255,0.35)">Text Tools › Text Reverser</text>
  <text x="60" y="185" font-size="52" font-weight="900" fill="url(#aG)" filter="url(#glow)">Text</text>
  <text x="60" y="245" font-size="52" font-weight="900" fill="url(#aG)" filter="url(#glow)">Reverser</text>
  <text x="60" y="300" font-size="18" fill="rgba(255,255,255,0.6)">Characters · Words · Lines</text>
  <text x="60" y="328" font-size="18" fill="rgba(255,255,255,0.6)">Palindrome checker — Free, instant</text>

  <rect x="60" y="358" width="110" height="52" rx="8" fill="rgba(124,58,237,0.2)" stroke="rgba(124,58,237,0.4)" stroke-width="1"/>
  <text x="115" y="382" text-anchor="middle" font-size="14" font-weight="900" fill="#a78bfa">3 modes</text>
  <text x="115" y="400" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">char/word/line</text>

  <rect x="182" y="358" width="110" height="52" rx="8" fill="rgba(14,116,144,0.15)" stroke="rgba(14,116,144,0.35)" stroke-width="1"/>
  <text x="237" y="382" text-anchor="middle" font-size="18" font-weight="900" fill="#67e8f9">Unicode</text>
  <text x="237" y="400" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">emoji safe</text>

  <rect x="304" y="358" width="110" height="52" rx="8" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
  <text x="359" y="382" text-anchor="middle" font-size="16" font-weight="900" fill="#34d399">Palindrome</text>
  <text x="359" y="400" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">detector</text>

  <rect x="426" y="358" width="110" height="52" rx="8" fill="rgba(251,191,36,0.1)" stroke="rgba(251,191,36,0.25)" stroke-width="1"/>
  <text x="481" y="382" text-anchor="middle" font-size="20" font-weight="900" fill="#fbbf24">Free</text>
  <text x="481" y="400" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">no account</text>

  <text x="60" y="560" font-size="14" fill="rgba(255,255,255,0.25)">toolnestai.net/text-tools/text-reverser</text>

  <rect x="630" y="60" width="530" height="490" rx="16" fill="url(#lapG)" stroke="rgba(124,58,237,0.3)" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="630" y="60" width="530" height="36" rx="16" fill="rgba(255,255,255,0.05)"/>
  <rect x="630" y="78" width="530" height="18" fill="rgba(255,255,255,0.02)"/>
  <circle cx="655" cy="78" r="6" fill="rgba(239,68,68,0.6)"/>
  <circle cx="675" cy="78" r="6" fill="rgba(251,191,36,0.6)"/>
  <circle cx="695" cy="78" r="6" fill="rgba(34,197,94,0.6)"/>

  <text x="648" y="122" font-size="8.5" font-weight="700" fill="rgba(255,255,255,0.3)">INPUT TEXT</text>
  <rect x="640" y="128" width="506" height="46" rx="9" fill="rgba(0,0,0,0.5)" stroke="rgba(124,58,237,0.4)" stroke-width="1.5"/>
  <text x="654" y="156" font-family="monospace" font-size="14" fill="rgba(255,255,255,0.8)">Was it a car or a cat I saw?</text>

  <text x="648" y="198" font-size="8.5" font-weight="700" fill="rgba(255,255,255,0.3)">REVERSED (characters)</text>
  <rect x="640" y="204" width="506" height="46" rx="9" fill="rgba(52,211,153,0.08)" stroke="rgba(52,211,153,0.28)" stroke-width="1.5"/>
  <text x="654" y="232" font-family="monospace" font-size="14" fill="rgba(110,231,183,0.95)">?was I tac a ro rac a ti saW</text>

  <rect x="640" y="262" width="506" height="60" rx="9" fill="rgba(251,191,36,0.08)" stroke="rgba(251,191,36,0.28)" stroke-width="1.5"/>
  <text x="893" y="286" text-anchor="middle" font-size="14" font-weight="900" fill="#fbbf24">✓ This is a palindrome!</text>
  <text x="893" y="306" text-anchor="middle" font-size="9.5" fill="rgba(255,255,255,0.45)">(ignoring spaces, punctuation &amp; capitalization)</text>

  <text x="648" y="344" font-size="8.5" font-weight="700" fill="rgba(255,255,255,0.3)">THREE MODES</text>
  <g font-size="9.5">
    <rect x="640" y="350" width="506" height="110" rx="7" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="656" y="372" fill="rgba(167,139,250,0.85)">Characters</text><text x="748" y="372" fill="rgba(255,255,255,0.5)"> — "Hello" → "olleH"</text>
    <text x="656" y="396" fill="rgba(103,232,249,0.85)">Words</text><text x="726" y="396" fill="rgba(255,255,255,0.5)"> — "Hi World" → "World Hi"</text>
    <text x="656" y="420" fill="rgba(52,211,153,0.85)">Lines</text><text x="720" y="420" fill="rgba(255,255,255,0.5)"> — reverses line order</text>
    <text x="656" y="444" fill="rgba(255,255,255,0.35)">Unicode-safe: emoji and accented text reverse correctly</text>
  </g>

  <rect x="620" y="550" width="560" height="14" rx="4" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="760" y="562" width="260" height="8" rx="4" fill="rgba(255,255,255,0.03)"/>
</svg>
