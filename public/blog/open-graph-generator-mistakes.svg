<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <radialGradient id="gL" cx="20%" cy="50%" r="55%"><stop offset="0%" stop-color="#5b21b6" stop-opacity="0.22"/><stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#818cf8"/></linearGradient>
  </defs>
  <rect width="900" height="480" fill="url(#bg)"/>
  <ellipse cx="180" cy="240" rx="400" ry="320" fill="url(#gL)"/>

  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="900" fill="url(#aG)">5 Common Open Graph Mistakes &amp; How to Fix Them</text>
  <text x="450" y="54" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.38)">Errors that break your social link previews — and the exact fixes</text>

  <!-- Headers -->
  <rect x="28" y="66" width="270" height="24" rx="6" fill="rgba(239,68,68,0.15)" stroke="rgba(239,68,68,0.3)" stroke-width="1"/>
  <text x="163" y="82" text-anchor="middle" font-size="10" font-weight="700" fill="rgba(239,68,68,0.9)">⛔  The Mistake</text>
  <rect x="306" y="66" width="566" height="24" rx="6" fill="rgba(34,197,94,0.1)" stroke="rgba(34,197,94,0.25)" stroke-width="1"/>
  <text x="589" y="82" text-anchor="middle" font-size="10" font-weight="700" fill="rgba(34,197,94,0.9)">✓  The Fix</text>

  <!-- Row 1 -->
  <rect x="28" y="96" width="270" height="66" rx="7" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="44" y="114" font-size="9" font-weight="700" fill="rgba(239,68,68,0.85)">Missing og:image</text>
  <text x="44" y="129" font-size="8" fill="rgba(255,255,255,0.42)">No image = blank card on Facebook,</text>
  <text x="44" y="142" font-size="8" fill="rgba(255,255,255,0.42)">LinkedIn and Discord. Clicks drop 70%+.</text>
  <rect x="306" y="96" width="566" height="66" rx="7" fill="rgba(255,255,255,0.02)" stroke="rgba(34,197,94,0.08)" stroke-width="1"/>
  <text x="322" y="114" font-size="8.5" fill="rgba(255,255,255,0.5)">Add og:image with an absolute HTTPS URL to a 1200×630px image.</text>
  <text x="322" y="130" font-size="8" font-family="monospace" fill="rgba(239,68,68,0.7)">✗  &lt;meta property="og:image" content="/images/hero.jpg" /&gt;  ← relative URL</text>
  <text x="322" y="146" font-size="8" font-family="monospace" fill="rgba(34,197,94,0.8)">✓  &lt;meta property="og:image" content="https://site.com/images/hero.jpg" /&gt;</text>
  <text x="322" y="156" font-size="7.5" fill="rgba(255,255,255,0.3)">Relative URLs are not read by social crawlers — always use the full https:// path.</text>

  <!-- Row 2 -->
  <rect x="28" y="168" width="270" height="66" rx="7" fill="rgba(255,255,255,0.025)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="44" y="186" font-size="9" font-weight="700" fill="rgba(239,68,68,0.85)">Wrong image dimensions</text>
  <text x="44" y="201" font-size="8" fill="rgba(255,255,255,0.42)">Too small = thumbnail. Wrong ratio</text>
  <text x="44" y="214" font-size="8" fill="rgba(255,255,255,0.42)">= cropped or distorted previews.</text>
  <rect x="306" y="168" width="566" height="66" rx="7" fill="rgba(255,255,255,0.02)" stroke="rgba(34,197,94,0.08)" stroke-width="1"/>
  <text x="322" y="186" font-size="8.5" fill="rgba(255,255,255,0.5)">Use exactly 1200×630px (1.91:1 ratio). Minimum: 600×315. Under 8 MB.</text>
  <text x="322" y="202" font-size="8" font-family="monospace" fill="rgba(239,68,68,0.7)">✗  500×500px square image → shows as tiny thumbnail, not large card</text>
  <text x="322" y="218" font-size="8" font-family="monospace" fill="rgba(34,197,94,0.8)">✓  1200×630px — renders as full-width hero card on all platforms</text>
  <text x="322" y="228" font-size="7.5" fill="rgba(255,255,255,0.3)">Add og:image:width and og:image:height to help platforms render faster.</text>

  <!-- Row 3 -->
  <rect x="28" y="240" width="270" height="66" rx="7" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="44" y="258" font-size="9" font-weight="700" fill="rgba(239,68,68,0.85)">Stale Facebook cache</text>
  <text x="44" y="273" font-size="8" fill="rgba(255,255,255,0.42)">Facebook caches OG data for weeks.</text>
  <text x="44" y="286" font-size="8" fill="rgba(255,255,255,0.42)">Old image/title shows even after update.</text>
  <rect x="306" y="240" width="566" height="66" rx="7" fill="rgba(255,255,255,0.02)" stroke="rgba(34,197,94,0.08)" stroke-width="1"/>
  <text x="322" y="258" font-size="8.5" fill="rgba(255,255,255,0.5)">Use Facebook Sharing Debugger to force a cache refresh after any OG update.</text>
  <text x="322" y="274" font-size="8" font-family="monospace" fill="rgba(239,68,68,0.7)">✗  Update og:image → still shows old image in Facebook preview</text>
  <text x="322" y="290" font-size="8" font-family="monospace" fill="rgba(34,197,94,0.8)">✓  Visit developers.facebook.com/tools/debug → click "Scrape Again"</text>
  <text x="322" y="300" font-size="7.5" fill="rgba(255,255,255,0.3)">LinkedIn and Twitter/X also have their own cache refresh tools.</text>

  <!-- Row 4 -->
  <rect x="28" y="312" width="270" height="66" rx="7" fill="rgba(255,255,255,0.025)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="44" y="330" font-size="9" font-weight="700" fill="rgba(239,68,68,0.85)">og:url mismatch with canonical</text>
  <text x="44" y="345" font-size="8" fill="rgba(255,255,255,0.42)">og:url pointing to a different URL</text>
  <text x="44" y="358" font-size="8" fill="rgba(255,255,255,0.42)">than canonical confuses crawlers.</text>
  <rect x="306" y="312" width="566" height="66" rx="7" fill="rgba(255,255,255,0.02)" stroke="rgba(34,197,94,0.08)" stroke-width="1"/>
  <text x="322" y="330" font-size="8.5" fill="rgba(255,255,255,0.5)">Set og:url to the exact same URL as your &lt;link rel="canonical"&gt; tag.</text>
  <text x="322" y="346" font-size="8" font-family="monospace" fill="rgba(239,68,68,0.7)">✗  og:url = "https://site.com/page"  but canonical = "https://www.site.com/page"</text>
  <text x="322" y="362" font-size="8" font-family="monospace" fill="rgba(34,197,94,0.8)">✓  Both og:url and canonical = "https://www.site.com/page"</text>
  <text x="322" y="372" font-size="7.5" fill="rgba(255,255,255,0.3)">One consistent preferred URL consolidates social signals and link equity.</text>

  <!-- Row 5 -->
  <rect x="28" y="384" width="270" height="66" rx="7" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="44" y="402" font-size="9" font-weight="700" fill="rgba(239,68,68,0.85)">Same OG tags on every page</text>
  <text x="44" y="417" font-size="8" fill="rgba(255,255,255,0.42)">Duplicate og:title/description across</text>
  <text x="44" y="430" font-size="8" fill="rgba(255,255,255,0.42)">all pages — every share looks the same.</text>
  <rect x="306" y="384" width="566" height="66" rx="7" fill="rgba(255,255,255,0.02)" stroke="rgba(34,197,94,0.08)" stroke-width="1"/>
  <text x="322" y="402" font-size="8.5" fill="rgba(255,255,255,0.5)">Generate unique OG tags per page — each one should describe that specific page.</text>
  <text x="322" y="418" font-size="8" font-family="monospace" fill="rgba(239,68,68,0.7)">✗  Every page has og:title = "My Website" og:image = generic logo</text>
  <text x="322" y="434" font-size="8" font-family="monospace" fill="rgba(34,197,94,0.8)">✓  Each page has a unique title, description and a page-specific image</text>
  <text x="322" y="444" font-size="7.5" fill="rgba(255,255,255,0.3)">Use the ToolNest AI OG Generator to create unique tags for every important page.</text>

  <text x="450" y="472" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.25)">toolnestai.net/seo-tools/open-graph-generator</text>
</svg>
