<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="30%" cy="40%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <radialGradient id="gL" cx="15%" cy="50%" r="55%"><stop offset="0%" stop-color="#5b21b6" stop-opacity="0.45"/><stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/></radialGradient>
    <radialGradient id="gR" cx="85%" cy="50%" r="55%"><stop offset="0%" stop-color="#0e7490" stop-opacity="0.28"/><stop offset="100%" stop-color="#0e7490" stop-opacity="0"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="bG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient>
    <linearGradient id="lapG" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1a1040"/><stop offset="100%" stop-color="#0d0824"/></linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#5b21b6" flood-opacity="0.5"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="180" cy="315" rx="600" ry="500" fill="url(#gL)"/>
  <ellipse cx="1020" cy="315" rx="600" ry="500" fill="url(#gR)"/>
  <text x="60" y="70" font-size="14" font-weight="700" fill="url(#aG)" filter="url(#glow)">ToolNest AI</text>
  <text x="60" y="106" font-size="13" fill="rgba(255,255,255,0.35)">Image Tools - Remove Background</text>
  <text x="60" y="185" font-size="46" font-weight="900" fill="url(#aG)" filter="url(#glow)">Remove</text>
  <text x="60" y="245" font-size="46" font-weight="900" fill="url(#aG)" filter="url(#glow)">Background</text>
  <text x="60" y="300" font-size="18" fill="rgba(255,255,255,0.6)">AI-powered background removal</text>
  <text x="60" y="328" font-size="18" fill="rgba(255,255,255,0.6)">Free, private - runs in your browser</text>
  <rect x="60" y="358" width="80" height="52" rx="8" fill="rgba(124,58,237,0.2)" stroke="rgba(124,58,237,0.4)" stroke-width="1"/>
  <text x="100" y="382" text-anchor="middle" font-size="14" font-weight="900" fill="#a78bfa">AI</text>
  <text x="100" y="400" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">powered</text>
  <rect x="152" y="358" width="130" height="52" rx="8" fill="rgba(14,116,144,0.15)" stroke="rgba(14,116,144,0.35)" stroke-width="1"/>
  <text x="217" y="382" text-anchor="middle" font-size="12" font-weight="900" fill="#67e8f9">PNG output</text>
  <text x="217" y="400" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">with alpha channel</text>
  <rect x="294" y="358" width="130" height="52" rx="8" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
  <text x="359" y="382" text-anchor="middle" font-size="12" font-weight="900" fill="#34d399">Private</text>
  <text x="359" y="400" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">no upload</text>
  <rect x="436" y="358" width="80" height="52" rx="8" fill="rgba(251,191,36,0.1)" stroke="rgba(251,191,36,0.25)" stroke-width="1"/>
  <text x="476" y="382" text-anchor="middle" font-size="16" font-weight="900" fill="#fbbf24">Free</text>
  <text x="476" y="400" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">no account</text>
  <text x="60" y="560" font-size="14" fill="rgba(255,255,255,0.25)">toolnestai.net/image-tools/remove-background</text>
  <rect x="630" y="60" width="530" height="490" rx="16" fill="url(#lapG)" stroke="rgba(124,58,237,0.3)" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="630" y="60" width="530" height="36" rx="16" fill="rgba(255,255,255,0.05)"/>
  <rect x="630" y="78" width="530" height="18" fill="rgba(255,255,255,0.02)"/>
  <circle cx="655" cy="78" r="6" fill="rgba(239,68,68,0.6)"/>
  <circle cx="675" cy="78" r="6" fill="rgba(251,191,36,0.6)"/>
  <circle cx="695" cy="78" r="6" fill="rgba(34,197,94,0.6)"/>
  <!-- Before: photo with bg -->
  <rect x="648" y="108" width="234" height="200" rx="8" fill="rgba(103,232,249,0.05)" stroke="rgba(103,232,249,0.2)" stroke-width="1"/>
  <text x="765" y="130" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.35)">ORIGINAL</text>
  <!-- Simple person silhouette -->
  <circle cx="765" cy="185" r="28" fill="rgba(167,139,250,0.3)"/>
  <rect x="737" y="215" width="56" height="75" rx="8" fill="rgba(167,139,250,0.25)"/>
  <!-- Background noise -->
  <rect x="654" y="116" width="230" height="78" rx="4" fill="rgba(14,116,144,0.15)"/>
  <rect x="654" y="246" width="230" height="55" rx="4" fill="rgba(14,116,144,0.1)"/>
  <text x="765" y="298" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.35)">Background present</text>
  <text x="885" y="210" text-anchor="middle" font-size="20" fill="rgba(255,255,255,0.25)">-&gt;</text>
  <!-- After: transparent bg -->
  <rect x="918" y="108" width="234" height="200" rx="8" fill="rgba(52,211,153,0.05)" stroke="rgba(52,211,153,0.25)" stroke-width="1.5"/>
  <text x="1035" y="130" text-anchor="middle" font-size="9" fill="rgba(52,211,153,0.6)">RESULT (PNG)</text>
  <!-- Checkerboard transparency -->
  <g fill="rgba(255,255,255,0.06)">
    <rect x="924" y="140" width="20" height="20"/><rect x="964" y="140" width="20" height="20"/><rect x="1004" y="140" width="20" height="20"/><rect x="1044" y="140" width="20" height="20"/><rect x="1084" y="140" width="20" height="20"/><rect x="1124" y="140" width="20" height="20"/>
    <rect x="944" y="160" width="20" height="20"/><rect x="984" y="160" width="20" height="20"/><rect x="1024" y="160" width="20" height="20"/><rect x="1064" y="160" width="20" height="20"/><rect x="1104" y="160" width="20" height="20"/>
    <rect x="924" y="250" width="20" height="20"/><rect x="964" y="250" width="20" height="20"/><rect x="1004" y="250" width="20" height="20"/><rect x="1044" y="250" width="20" height="20"/><rect x="1084" y="250" width="20" height="20"/>
    <rect x="944" y="270" width="20" height="20"/><rect x="984" y="270" width="20" height="20"/><rect x="1024" y="270" width="20" height="20"/><rect x="1064" y="270" width="20" height="20"/>
  </g>
  <circle cx="1035" cy="185" r="28" fill="rgba(167,139,250,0.6)"/>
  <rect x="1007" y="215" width="56" height="75" rx="8" fill="rgba(167,139,250,0.5)"/>
  <text x="1035" y="298" text-anchor="middle" font-size="9" fill="rgba(52,211,153,0.6)">Transparent background</text>
  <!-- Button -->
  <rect x="648" y="328" width="506" height="42" rx="8" fill="url(#bG)" filter="url(#sh)"/>
  <text x="901" y="354" text-anchor="middle" font-size="13" font-weight="900" fill="#fff">Remove Background</text>
  <rect x="620" y="550" width="560" height="14" rx="4" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
</svg>
