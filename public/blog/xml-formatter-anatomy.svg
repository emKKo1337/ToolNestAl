<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Segoe UI',sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0f0825"/>
      <stop offset="100%" stop-color="#05030d"/>
    </radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>
  <rect width="900" height="500" fill="url(#bg)"/>

  <text x="450" y="44" font-size="22" font-weight="800" fill="#e2e2e2" text-anchor="middle">XML Anatomy</text>
  <text x="450" y="66" font-size="13" fill="#7a6d84" text-anchor="middle">Every part of an XML document labeled and explained</text>

  <!-- XML document with annotations -->
  <rect x="30" y="86" width="540" height="392" rx="12" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>

  <!-- XML content -->
  <text x="50" y="112" font-size="10" fill="#7a6d84" font-family="monospace">&lt;?xml version="1.0" encoding="UTF-8"?&gt;</text>
  <text x="50" y="130" font-size="10" fill="#7a6d84" font-family="monospace">&lt;!-- A catalog of books --&gt;</text>
  <text x="50" y="150" font-size="10" fill="#60a5fa" font-family="monospace">&lt;catalog xmlns="urn:books" xmlns:meta="urn:metadata"&gt;</text>
  <text x="50" y="170" font-size="10" fill="#60a5fa" font-family="monospace">  &lt;book id="b1" lang="en"&gt;</text>
  <text x="50" y="190" font-size="10" fill="#a78bfa" font-family="monospace">    &lt;title&gt;Clean Code&lt;/title&gt;</text>
  <text x="50" y="210" font-size="10" fill="#a78bfa" font-family="monospace">    &lt;author&gt;Robert C. Martin&lt;/author&gt;</text>
  <text x="50" y="230" font-size="10" fill="#a78bfa" font-family="monospace">    &lt;year&gt;2008&lt;/year&gt;</text>
  <text x="50" y="250" font-size="10" fill="#34d399" font-family="monospace">    &lt;price currency="USD"&gt;35.99&lt;/price&gt;</text>
  <text x="50" y="270" font-size="10" fill="#34d399" font-family="monospace">    &lt;meta:rating&gt;5&lt;/meta:rating&gt;</text>
  <text x="50" y="290" font-size="10" fill="#fbbf24" font-family="monospace">    &lt;cover/&gt;</text>
  <text x="50" y="310" font-size="10" fill="#e2e2e2" font-family="monospace">    &lt;description&gt;</text>
  <text x="50" y="326" font-size="10" fill="#e2e2e2" font-family="monospace">      &lt;![CDATA[Covers &lt;, &gt;, &amp; safely]]&gt;</text>
  <text x="50" y="342" font-size="10" fill="#e2e2e2" font-family="monospace">    &lt;/description&gt;</text>
  <text x="50" y="358" font-size="10" fill="#60a5fa" font-family="monospace">  &lt;/book&gt;</text>
  <text x="50" y="378" font-size="10" fill="#60a5fa" font-family="monospace">&lt;/catalog&gt;</text>

  <!-- Annotations: right side -->
  <!-- Processing instruction -->
  <line x1="570" y1="112" x2="590" y2="112" stroke="rgba(255,255,255,0.2)" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="590" y="96" width="280" height="36" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="602" y="113" font-size="10" font-weight="700" fill="#7a6d84">XML Declaration</text>
  <text x="602" y="127" font-size="9" fill="#4d4354">Version + character encoding</text>

  <!-- Comment -->
  <line x1="370" y1="130" x2="590" y2="138" stroke="rgba(255,255,255,0.2)" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="590" y="128" width="280" height="32" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="602" y="148" font-size="10" font-weight="700" fill="#7a6d84">Comment</text>

  <!-- Root element + namespace -->
  <line x1="570" y1="150" x2="590" y2="170" stroke="rgba(96,165,250,0.4)" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="590" y="160" width="280" height="36" rx="8" fill="rgba(96,165,250,0.06)" stroke="rgba(96,165,250,0.2)" stroke-width="1"/>
  <text x="602" y="177" font-size="10" font-weight="700" fill="#60a5fa">Root element + Namespaces</text>
  <text x="602" y="191" font-size="9" fill="#4d4354">xmlns= default, xmlns:prefix= prefixed</text>

  <!-- Element with attributes -->
  <line x1="380" y1="170" x2="590" y2="206" stroke="rgba(96,165,250,0.4)" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="590" y="196" width="280" height="36" rx="8" fill="rgba(96,165,250,0.06)" stroke="rgba(96,165,250,0.2)" stroke-width="1"/>
  <text x="602" y="213" font-size="10" font-weight="700" fill="#60a5fa">Element with attributes</text>
  <text x="602" y="227" font-size="9" fill="#4d4354">id, lang = key="value" pairs</text>

  <!-- Child element -->
  <line x1="420" y1="250" x2="590" y2="256" stroke="rgba(52,211,153,0.4)" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="590" y="244" width="280" height="36" rx="8" fill="rgba(52,211,153,0.06)" stroke="rgba(52,211,153,0.2)" stroke-width="1"/>
  <text x="602" y="261" font-size="10" font-weight="700" fill="#34d399">Element with attribute + text content</text>
  <text x="602" y="275" font-size="9" fill="#4d4354">currency="USD" is an attribute</text>

  <!-- Namespace prefix element -->
  <line x1="420" y1="270" x2="590" y2="292" stroke="rgba(52,211,153,0.4)" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="590" y="282" width="280" height="36" rx="8" fill="rgba(52,211,153,0.06)" stroke="rgba(52,211,153,0.2)" stroke-width="1"/>
  <text x="602" y="299" font-size="10" font-weight="700" fill="#34d399">Prefixed namespace element</text>
  <text x="602" y="313" font-size="9" fill="#4d4354">meta:rating → from xmlns:meta=...</text>

  <!-- Self-closing -->
  <line x1="230" y1="290" x2="590" y2="332" stroke="rgba(251,191,36,0.4)" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="590" y="322" width="280" height="36" rx="8" fill="rgba(251,191,36,0.06)" stroke="rgba(251,191,36,0.2)" stroke-width="1"/>
  <text x="602" y="339" font-size="10" font-weight="700" fill="#fbbf24">Self-closing element</text>
  <text x="602" y="353" font-size="9" fill="#4d4354">&lt;cover/&gt; = &lt;cover&gt;&lt;/cover&gt;</text>

  <!-- CDATA -->
  <line x1="570" y1="326" x2="590" y2="368" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="590" y="358" width="280" height="36" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="602" y="375" font-size="10" font-weight="700" fill="#e2e2e2">CDATA section</text>
  <text x="602" y="389" font-size="9" fill="#4d4354">Raw text — special chars not escaped</text>
</svg>
