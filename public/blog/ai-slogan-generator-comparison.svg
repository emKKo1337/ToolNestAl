<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <radialGradient id="gC" cx="50%" cy="40%" r="60%"><stop offset="0%" stop-color="#5b21b6" stop-opacity="0.28"/><stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#818cf8"/></linearGradient>
    <linearGradient id="bG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="4" stdDeviation="14" flood-color="#5b21b6" flood-opacity="0.4"/></filter>
  </defs>
  <rect width="900" height="480" fill="url(#bg)"/>
  <ellipse cx="450" cy="240" rx="500" ry="350" fill="url(#gC)"/>

  <text x="450" y="38" text-anchor="middle" font-size="21" font-weight="900" fill="url(#aG)">AI Slogan Generator: Tool Comparison</text>
  <text x="450" y="57" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.42)">ToolNest AI vs Naming Agencies vs Manual Brainstorming</text>

  <!-- Column headers -->
  <rect x="260" y="70" width="190" height="48" rx="10" fill="url(#bG)" filter="url(#sh)"/>
  <text x="355" y="90" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">✦ ToolNest AI</text>
  <text x="355" y="107" text-anchor="middle" font-size="8.5" fill="rgba(255,255,255,0.75)">AI Slogan Generator</text>

  <rect x="460" y="70" width="190" height="48" rx="10" fill="rgba(245,158,11,0.16)" stroke="rgba(251,191,36,0.3)" stroke-width="1.5"/>
  <text x="555" y="90" text-anchor="middle" font-size="11" font-weight="800" fill="#fbbf24">✎ Naming Agency</text>
  <text x="555" y="107" text-anchor="middle" font-size="8.5" fill="rgba(255,255,255,0.5)">Professional branding firm</text>

  <rect x="660" y="70" width="212" height="48" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <text x="766" y="90" text-anchor="middle" font-size="11" font-weight="800" fill="rgba(255,255,255,0.7)">💡 Manual Brainstorm</text>
  <text x="766" y="107" text-anchor="middle" font-size="8.5" fill="rgba(255,255,255,0.42)">Pen, paper, team meeting</text>

  <!-- Row labels -->
  <g font-size="9" fill="rgba(255,255,255,0.55)">
    <rect x="28" y="128" width="222" height="28" rx="6" fill="rgba(255,255,255,0.025)"/>
    <text x="42" y="146" font-weight="600">Cost</text>
    <rect x="28" y="162" width="222" height="28" rx="6" fill="rgba(255,255,255,0.02)"/>
    <text x="42" y="180" font-weight="600">Time to first ideas</text>
    <rect x="28" y="196" width="222" height="28" rx="6" fill="rgba(255,255,255,0.025)"/>
    <text x="42" y="214" font-weight="600">Number of ideas generated</text>
    <rect x="28" y="230" width="222" height="28" rx="6" fill="rgba(255,255,255,0.02)"/>
    <text x="42" y="248" font-weight="600">Platform / industry knowledge</text>
    <rect x="28" y="264" width="222" height="28" rx="6" fill="rgba(255,255,255,0.025)"/>
    <text x="42" y="282" font-weight="600">Tone &amp; style customisation</text>
    <rect x="28" y="298" width="222" height="28" rx="6" fill="rgba(255,255,255,0.02)"/>
    <text x="42" y="316" font-weight="600">Unlimited regeneration</text>
    <rect x="28" y="332" width="222" height="28" rx="6" fill="rgba(255,255,255,0.025)"/>
    <text x="42" y="350" font-weight="600">Copy / export results</text>
    <rect x="28" y="366" width="222" height="28" rx="6" fill="rgba(255,255,255,0.02)"/>
    <text x="42" y="384" font-weight="600">Account required</text>
    <rect x="28" y="400" width="222" height="28" rx="6" fill="rgba(255,255,255,0.025)"/>
    <text x="42" y="418" font-weight="600">Best for</text>
  </g>

  <!-- ToolNest AI column -->
  <g text-anchor="middle" font-size="9">
    <rect x="260" y="128" width="190" height="28" rx="6" fill="rgba(124,58,237,0.08)"/>
    <text x="355" y="147" fill="rgba(34,197,94,0.9)" font-weight="700">Free forever</text>
    <rect x="260" y="162" width="190" height="28" rx="6" fill="rgba(124,58,237,0.06)"/>
    <text x="355" y="181" fill="rgba(34,197,94,0.9)" font-weight="700">Under 10 seconds</text>
    <rect x="260" y="196" width="190" height="28" rx="6" fill="rgba(124,58,237,0.08)"/>
    <text x="355" y="215" fill="rgba(34,197,94,0.9)" font-weight="700">8–12 per batch, unlimited</text>
    <rect x="260" y="230" width="190" height="28" rx="6" fill="rgba(124,58,237,0.06)"/>
    <text x="355" y="249" fill="rgba(34,197,94,0.9)" font-weight="700">✓ Industry + tone aware</text>
    <rect x="260" y="264" width="190" height="28" rx="6" fill="rgba(124,58,237,0.08)"/>
    <text x="355" y="283" fill="rgba(34,197,94,0.9)" font-weight="700">✓ Full control</text>
    <rect x="260" y="298" width="190" height="28" rx="6" fill="rgba(124,58,237,0.06)"/>
    <text x="355" y="317" fill="rgba(34,197,94,0.9)" font-weight="700">✓ Yes</text>
    <rect x="260" y="332" width="190" height="28" rx="6" fill="rgba(124,58,237,0.08)"/>
    <text x="355" y="351" fill="rgba(34,197,94,0.9)" font-weight="700">✓ Copy + export</text>
    <rect x="260" y="366" width="190" height="28" rx="6" fill="rgba(124,58,237,0.06)"/>
    <text x="355" y="385" fill="rgba(34,197,94,0.9)" font-weight="700">✓ No account needed</text>
    <rect x="260" y="400" width="190" height="28" rx="6" fill="rgba(124,58,237,0.08)"/>
    <text x="355" y="419" fill="rgba(167,139,250,0.85)" font-weight="600">Everyone</text>
  </g>

  <!-- Agency column -->
  <g text-anchor="middle" font-size="9">
    <rect x="460" y="128" width="190" height="28" rx="6" fill="rgba(245,158,11,0.05)"/>
    <text x="555" y="147" fill="rgba(251,191,36,0.85)">£500–£5,000+</text>
    <rect x="460" y="162" width="190" height="28" rx="6" fill="rgba(245,158,11,0.04)"/>
    <text x="555" y="181" fill="rgba(251,191,36,0.85)">Days to weeks</text>
    <rect x="460" y="196" width="190" height="28" rx="6" fill="rgba(245,158,11,0.05)"/>
    <text x="555" y="215" fill="rgba(251,191,36,0.85)">5–15 curated ideas</text>
    <rect x="460" y="230" width="190" height="28" rx="6" fill="rgba(245,158,11,0.04)"/>
    <text x="555" y="249" fill="rgba(34,197,94,0.85)">✓ Deep research</text>
    <rect x="460" y="264" width="190" height="28" rx="6" fill="rgba(245,158,11,0.05)"/>
    <text x="555" y="283" fill="rgba(34,197,94,0.85)">✓ Fully bespoke</text>
    <rect x="460" y="298" width="190" height="28" rx="6" fill="rgba(245,158,11,0.04)"/>
    <text x="555" y="317" fill="rgba(239,68,68,0.85)">✗ Paid revision rounds</text>
    <rect x="460" y="332" width="190" height="28" rx="6" fill="rgba(245,158,11,0.05)"/>
    <text x="555" y="351" fill="rgba(34,197,94,0.85)">✓ Full deliverable</text>
    <rect x="460" y="366" width="190" height="28" rx="6" fill="rgba(245,158,11,0.04)"/>
    <text x="555" y="385" fill="rgba(239,68,68,0.85)">✗ Contract required</text>
    <rect x="460" y="400" width="190" height="28" rx="6" fill="rgba(245,158,11,0.05)"/>
    <text x="555" y="419" fill="rgba(255,255,255,0.5)">Enterprise brands</text>
  </g>

  <!-- Manual column -->
  <g text-anchor="middle" font-size="9">
    <rect x="660" y="128" width="212" height="28" rx="6" fill="rgba(255,255,255,0.02)"/>
    <text x="766" y="147" fill="rgba(34,197,94,0.85)">Free (your time)</text>
    <rect x="660" y="162" width="212" height="28" rx="6" fill="rgba(255,255,255,0.015)"/>
    <text x="766" y="181" fill="rgba(251,191,36,0.85)">20–60 minutes</text>
    <rect x="660" y="196" width="212" height="28" rx="6" fill="rgba(255,255,255,0.02)"/>
    <text x="766" y="215" fill="rgba(251,191,36,0.85)">5–20 ideas typical</text>
    <rect x="660" y="230" width="212" height="28" rx="6" fill="rgba(255,255,255,0.015)"/>
    <text x="766" y="249" fill="rgba(251,191,36,0.85)">⚠ Depends on experience</text>
    <rect x="660" y="264" width="212" height="28" rx="6" fill="rgba(255,255,255,0.02)"/>
    <text x="766" y="283" fill="rgba(34,197,94,0.85)">✓ Fully personal</text>
    <rect x="660" y="298" width="212" height="28" rx="6" fill="rgba(255,255,255,0.015)"/>
    <text x="766" y="317" fill="rgba(239,68,68,0.85)">✗ Mental energy required</text>
    <rect x="660" y="332" width="212" height="28" rx="6" fill="rgba(255,255,255,0.02)"/>
    <text x="766" y="351" fill="rgba(239,68,68,0.85)">✗ Manual effort</text>
    <rect x="660" y="366" width="212" height="28" rx="6" fill="rgba(255,255,255,0.015)"/>
    <text x="766" y="385" fill="rgba(34,197,94,0.85)">✓ No tools needed</text>
    <rect x="660" y="400" width="212" height="28" rx="6" fill="rgba(255,255,255,0.02)"/>
    <text x="766" y="419" fill="rgba(255,255,255,0.5)">When you have time</text>
  </g>
</svg>
