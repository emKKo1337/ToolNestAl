<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="30%" cy="40%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <radialGradient id="gL" cx="15%" cy="50%" r="55%"><stop offset="0%" stop-color="#5b21b6" stop-opacity="0.45"/><stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/></radialGradient>
    <radialGradient id="gR" cx="85%" cy="50%" r="55%"><stop offset="0%" stop-color="#0e7490" stop-opacity="0.28"/><stop offset="100%" stop-color="#0e7490" stop-opacity="0"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="bG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient>
    <linearGradient id="lapG" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1a1040"/><stop offset="100%" stop-color="#0d0824"/></linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#5b21b6" flood-opacity="0.5"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="180" cy="315" rx="600" ry="500" fill="url(#gL)"/>
  <ellipse cx="1020" cy="315" rx="600" ry="500" fill="url(#gR)"/>

  <!-- Left -->
  <text x="60" y="70" font-size="14" font-weight="700" fill="url(#aG)" filter="url(#glow)">ToolNest AI</text>
  <text x="60" y="106" font-size="13" fill="rgba(255,255,255,0.35)">Image Tools › Image Compressor</text>
  <text x="60" y="185" font-size="52" font-weight="900" fill="url(#aG)" filter="url(#glow)">Image</text>
  <text x="60" y="245" font-size="52" font-weight="900" fill="url(#aG)" filter="url(#glow)">Compressor</text>
  <text x="60" y="300" font-size="18" fill="rgba(255,255,255,0.6)">Reduce file size up to 90% — free,</text>
  <text x="60" y="328" font-size="18" fill="rgba(255,255,255,0.6)">instant, no quality loss, no sign-up</text>

  <!-- Stat badges -->
  <rect x="60" y="358" width="110" height="52" rx="8" fill="rgba(124,58,237,0.2)" stroke="rgba(124,58,237,0.4)" stroke-width="1"/>
  <text x="115" y="382" text-anchor="middle" font-size="22" font-weight="900" fill="#a78bfa">90%</text>
  <text x="115" y="400" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">max reduction</text>

  <rect x="182" y="358" width="110" height="52" rx="8" fill="rgba(14,116,144,0.15)" stroke="rgba(14,116,144,0.35)" stroke-width="1"/>
  <text x="237" y="382" text-anchor="middle" font-size="22" font-weight="900" fill="#67e8f9">4</text>
  <text x="237" y="400" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">formats</text>

  <rect x="304" y="358" width="110" height="52" rx="8" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
  <text x="359" y="382" text-anchor="middle" font-size="22" font-weight="900" fill="#34d399">∞</text>
  <text x="359" y="400" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">batch images</text>

  <rect x="426" y="358" width="110" height="52" rx="8" fill="rgba(251,191,36,0.1)" stroke="rgba(251,191,36,0.25)" stroke-width="1"/>
  <text x="481" y="382" text-anchor="middle" font-size="22" font-weight="900" fill="#fbbf24">Free</text>
  <text x="481" y="400" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">no sign-up</text>

  <text x="60" y="560" font-size="14" fill="rgba(255,255,255,0.25)">toolnestai.net/image-tools/image-compressor</text>

  <!-- Right — compression demo visual -->
  <rect x="630" y="60" width="530" height="490" rx="16" fill="url(#lapG)" stroke="rgba(124,58,237,0.3)" stroke-width="1.5" filter="url(#sh)"/>
  <!-- Chrome bar -->
  <rect x="630" y="60" width="530" height="36" rx="16" fill="rgba(255,255,255,0.05)"/>
  <rect x="630" y="78" width="530" height="18" fill="rgba(255,255,255,0.02)"/>
  <circle cx="655" cy="78" r="6" fill="rgba(239,68,68,0.6)"/>
  <circle cx="675" cy="78" r="6" fill="rgba(251,191,36,0.6)"/>
  <circle cx="695" cy="78" r="6" fill="rgba(34,197,94,0.6)"/>

  <!-- Before/After panels -->
  <text x="895" y="118" text-anchor="middle" font-size="10" font-weight="700" fill="rgba(255,255,255,0.35)" letter-spacing="1">BEFORE / AFTER</text>

  <!-- Before -->
  <rect x="644" y="126" width="234" height="180" rx="8" fill="rgba(239,68,68,0.07)" stroke="rgba(239,68,68,0.2)" stroke-width="1"/>
  <rect x="644" y="126" width="234" height="22" rx="8" fill="rgba(239,68,68,0.15)"/>
  <rect x="644" y="140" width="234" height="8" fill="rgba(239,68,68,0.15)"/>
  <text x="761" y="140" text-anchor="middle" font-size="9" font-weight="700" fill="rgba(239,68,68,0.8)">ORIGINAL — 4.2 MB</text>
  <rect x="654" y="156" width="214" height="112" rx="4" fill="rgba(255,255,255,0.04)"/>
  <!-- Pixel grid to imply image -->
  <line x1="654" y1="184" x2="868" y2="184" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="654" y1="212" x2="868" y2="212" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="654" y1="240" x2="868" y2="240" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="726" y1="156" x2="726" y2="268" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="798" y1="156" x2="798" y2="268" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="761" y="218" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.12)">photo.jpg</text>
  <rect x="654" y="275" width="214" height="22" rx="4" fill="rgba(239,68,68,0.1)"/>
  <text x="761" y="289" text-anchor="middle" font-size="8" fill="rgba(239,68,68,0.65)">4200 × 2800 px · 4.2 MB</text>
  <!-- File size bar full -->
  <rect x="654" y="302" width="214" height="8" rx="4" fill="rgba(239,68,68,0.4)"/>
  <text x="761" y="320" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.35)">Loads in ~8s on 4G</text>

  <!-- Arrow -->
  <text x="895" y="232" text-anchor="middle" font-size="28" fill="url(#aG)">→</text>
  <!-- Badge -->
  <rect x="858" y="248" width="74" height="30" rx="15" fill="url(#bG)" filter="url(#sh)"/>
  <text x="895" y="268" text-anchor="middle" font-size="13" font-weight="900" fill="#fff">−90%</text>

  <!-- After -->
  <rect x="912" y="126" width="234" height="180" rx="8" fill="rgba(52,211,153,0.07)" stroke="rgba(52,211,153,0.2)" stroke-width="1"/>
  <rect x="912" y="126" width="234" height="22" rx="8" fill="rgba(52,211,153,0.15)"/>
  <rect x="912" y="140" width="234" height="8" fill="rgba(52,211,153,0.15)"/>
  <text x="1029" y="140" text-anchor="middle" font-size="9" font-weight="700" fill="rgba(52,211,153,0.8)">COMPRESSED — 420 KB</text>
  <rect x="922" y="156" width="214" height="112" rx="4" fill="rgba(255,255,255,0.04)"/>
  <line x1="922" y1="184" x2="1136" y2="184" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="922" y1="212" x2="1136" y2="212" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="922" y1="240" x2="1136" y2="240" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="994" y1="156" x2="994" y2="268" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="1066" y1="156" x2="1066" y2="268" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="1029" y="218" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.12)">photo.webp</text>
  <rect x="922" y="275" width="214" height="22" rx="4" fill="rgba(52,211,153,0.1)"/>
  <text x="1029" y="289" text-anchor="middle" font-size="8" fill="rgba(52,211,153,0.65)">4200 × 2800 px · 420 KB</text>
  <!-- File size bar small -->
  <rect x="922" y="302" width="214" height="8" rx="4" fill="rgba(255,255,255,0.06)"/>
  <rect x="922" y="302" width="21" height="8" rx="4" fill="rgba(52,211,153,0.5)"/>
  <text x="1029" y="320" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.35)">Loads in ~0.8s on 4G</text>

  <!-- Quality slider -->
  <rect x="644" y="340" width="502" height="46" rx="8" fill="rgba(255,255,255,0.025)"/>
  <text x="660" y="358" font-size="9" font-weight="700" fill="rgba(255,255,255,0.4)">QUALITY</text>
  <text x="1136" y="358" text-anchor="end" font-size="9" font-weight="700" fill="rgba(167,139,250,0.8)">80%</text>
  <rect x="660" y="363" width="474" height="6" rx="3" fill="rgba(255,255,255,0.08)"/>
  <rect x="660" y="363" width="379" height="6" rx="3" fill="url(#bG)"/>
  <circle cx="1039" cy="366" r="8" fill="#a78bfa" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <text x="660" y="382" font-size="7.5" fill="rgba(255,255,255,0.25)">Smaller file</text>
  <text x="1134" y="382" text-anchor="end" font-size="7.5" fill="rgba(255,255,255,0.25)">Better quality</text>

  <!-- Format tabs -->
  <g font-size="9" text-anchor="middle">
    <rect x="644" y="396" width="116" height="28" rx="6" fill="rgba(251,191,36,0.2)" stroke="rgba(251,191,36,0.4)" stroke-width="1"/>
    <text x="702" y="414" fill="rgba(251,191,36,0.9)" font-weight="700">JPEG</text>
    <rect x="768" y="396" width="116" height="28" rx="6" fill="rgba(96,165,250,0.12)" stroke="rgba(96,165,250,0.25)" stroke-width="1"/>
    <text x="826" y="414" fill="rgba(147,197,253,0.7)">PNG</text>
    <rect x="892" y="396" width="116" height="28" rx="6" fill="rgba(52,211,153,0.12)" stroke="rgba(52,211,153,0.3)" stroke-width="1"/>
    <text x="950" y="414" fill="rgba(52,211,153,0.8)">WebP ✓</text>
    <rect x="1016" y="396" width="130" height="28" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="1081" y="414" fill="rgba(255,255,255,0.35)">GIF</text>
  </g>

  <!-- Compress button -->
  <rect x="644" y="436" width="502" height="38" rx="10" fill="url(#bG)" filter="url(#sh)"/>
  <text x="895" y="459" text-anchor="middle" font-size="13" font-weight="900" fill="#fff">⬇  Compress &amp; Download</text>

  <!-- Laptop base -->
  <rect x="620" y="550" width="560" height="14" rx="4" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="760" y="562" width="260" height="8" rx="4" fill="rgba(255,255,255,0.03)"/>
</svg>
