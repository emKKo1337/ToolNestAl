<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="30%" cy="40%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <radialGradient id="gL" cx="15%" cy="50%" r="55%"><stop offset="0%" stop-color="#5b21b6" stop-opacity="0.45"/><stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/></radialGradient>
    <radialGradient id="gR" cx="85%" cy="50%" r="55%"><stop offset="0%" stop-color="#0e7490" stop-opacity="0.28"/><stop offset="100%" stop-color="#0e7490" stop-opacity="0"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="bG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient>
    <linearGradient id="lapG" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1a1040"/><stop offset="100%" stop-color="#0d0824"/></linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#5b21b6" flood-opacity="0.5"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="180" cy="315" rx="600" ry="500" fill="url(#gL)"/>
  <ellipse cx="1020" cy="315" rx="600" ry="500" fill="url(#gR)"/>
  <text x="60" y="70" font-size="14" font-weight="700" fill="url(#aG)" filter="url(#glow)">ToolNest AI</text>
  <text x="60" y="106" font-size="13" fill="rgba(255,255,255,0.35)">Image Tools - Image Sharpen</text>
  <text x="60" y="185" font-size="46" font-weight="900" fill="url(#aG)" filter="url(#glow)">Image</text>
  <text x="60" y="245" font-size="46" font-weight="900" fill="url(#aG)" filter="url(#glow)">Sharpen</text>
  <text x="60" y="300" font-size="18" fill="rgba(255,255,255,0.6)">Unsharp mask, edge enhance</text>
  <text x="60" y="328" font-size="18" fill="rgba(255,255,255,0.6)">free, private, instant</text>
  <g>
    <rect x="60" y="358" width="130" height="52" rx="8" fill="rgba(124,58,237,0.2)" stroke="rgba(124,58,237,0.4)" stroke-width="1"/>
    <text x="125" y="382" text-anchor="middle" font-size="11" font-weight="900" fill="#a78bfa">Unsharp Mask</text>
    <text x="125" y="400" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">most natural</text>
    <rect x="200" y="358" width="130" height="52" rx="8" fill="rgba(14,116,144,0.15)" stroke="rgba(14,116,144,0.35)" stroke-width="1"/>
    <text x="265" y="382" text-anchor="middle" font-size="11" font-weight="900" fill="#67e8f9">High Pass</text>
    <text x="265" y="400" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">edge details</text>
    <rect x="340" y="358" width="130" height="52" rx="8" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
    <text x="405" y="382" text-anchor="middle" font-size="11" font-weight="900" fill="#34d399">Laplacian</text>
    <text x="405" y="400" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">edge detection</text>
    <rect x="480" y="358" width="95" height="52" rx="8" fill="rgba(251,191,36,0.1)" stroke="rgba(251,191,36,0.25)" stroke-width="1"/>
    <text x="527" y="382" text-anchor="middle" font-size="11" font-weight="900" fill="#fbbf24">Private</text>
    <text x="527" y="400" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">no upload</text>
  </g>
  <text x="60" y="560" font-size="14" fill="rgba(255,255,255,0.25)">toolnestai.net/image-tools/image-sharpen</text>
  <!-- Laptop UI -->
  <rect x="630" y="60" width="530" height="490" rx="16" fill="url(#lapG)" stroke="rgba(124,58,237,0.3)" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="630" y="60" width="530" height="36" rx="16" fill="rgba(255,255,255,0.05)"/>
  <rect x="630" y="78" width="530" height="18" fill="rgba(255,255,255,0.02)"/>
  <circle cx="655" cy="78" r="6" fill="rgba(239,68,68,0.6)"/>
  <circle cx="675" cy="78" r="6" fill="rgba(251,191,36,0.6)"/>
  <circle cx="695" cy="78" r="6" fill="rgba(34,197,94,0.6)"/>
  <!-- Before panel -->
  <rect x="648" y="108" width="230" height="160" rx="8" fill="rgba(167,139,250,0.07)" stroke="rgba(167,139,250,0.18)" stroke-width="1"/>
  <text x="763" y="124" text-anchor="middle" font-size="8.5" fill="rgba(167,139,250,0.4)">Soft / blurry</text>
  <!-- simulate soft edges with blurred circles -->
  <ellipse cx="763" cy="188" rx="50" ry="30" fill="rgba(167,139,250,0.12)"/>
  <line x1="660" y1="192" x2="870" y2="192" stroke="rgba(255,255,255,0.04)" stroke-width="8"/>
  <!-- After panel -->
  <rect x="892" y="108" width="230" height="160" rx="8" fill="rgba(52,211,153,0.06)" stroke="rgba(52,211,153,0.18)" stroke-width="1"/>
  <text x="1007" y="124" text-anchor="middle" font-size="8.5" fill="rgba(52,211,153,0.4)">Sharpened</text>
  <!-- simulate crisp edges -->
  <ellipse cx="1007" cy="188" rx="50" ry="30" fill="none" stroke="rgba(52,211,153,0.6)" stroke-width="2.5"/>
  <line x1="904" y1="192" x2="1114" y2="192" stroke="rgba(255,255,255,0.12)" stroke-width="2.5"/>
  <!-- Controls -->
  <text x="648" y="294" font-size="9" fill="rgba(255,255,255,0.3)">Sharpening Method</text>
  <g font-size="9" text-anchor="middle">
    <rect x="648" y="300" width="100" height="24" rx="5" fill="url(#bG)"/>
    <text x="698" y="316" fill="#fff" font-weight="700">Unsharp Mask</text>
    <rect x="754" y="300" width="78" height="24" rx="5" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    <text x="793" y="316" fill="rgba(255,255,255,0.4)">High Pass</text>
    <rect x="838" y="300" width="82" height="24" rx="5" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    <text x="879" y="316" fill="rgba(255,255,255,0.4)">Laplacian</text>
    <rect x="926" y="300" width="68" height="24" rx="5" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    <text x="960" y="316" fill="rgba(255,255,255,0.4)">Simple</text>
  </g>
  <text x="648" y="346" font-size="9" fill="rgba(255,255,255,0.3)">Amount: 150%</text>
  <rect x="648" y="352" width="500" height="6" rx="3" fill="rgba(255,255,255,0.06)"/>
  <rect x="648" y="352" width="300" height="6" rx="3" fill="url(#aG)"/>
  <circle cx="948" cy="355" r="8" fill="#fff" stroke="rgba(124,58,237,0.6)" stroke-width="2"/>
  <text x="648" y="382" font-size="9" fill="rgba(255,255,255,0.3)">Radius: 1.5px</text>
  <rect x="648" y="388" width="500" height="6" rx="3" fill="rgba(255,255,255,0.06)"/>
  <rect x="648" y="388" width="150" height="6" rx="3" fill="url(#aG)"/>
  <circle cx="798" cy="391" r="8" fill="#fff" stroke="rgba(124,58,237,0.6)" stroke-width="2"/>
  <rect x="648" y="420" width="242" height="38" rx="8" fill="url(#bG)" filter="url(#sh)"/>
  <text x="769" y="443" text-anchor="middle" font-size="12" font-weight="900" fill="#fff">Download Sharpened</text>
  <rect x="902" y="420" width="240" height="38" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="1022" y="443" text-anchor="middle" font-size="12" font-weight="700" fill="rgba(255,255,255,0.5)">Reset</text>
  <rect x="620" y="550" width="560" height="14" rx="4" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
</svg>
