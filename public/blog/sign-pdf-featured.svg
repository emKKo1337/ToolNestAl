<svg viewBox="0 0 900 540" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%"><stop offset="0%" stop-color="#0f0825"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <linearGradient id="lapG" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#1a1040"/><stop offset="100%" stop-color="#0d0824"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="900" height="540" fill="url(#bg)"/>
  <ellipse cx="450" cy="270" rx="280" ry="150" fill="#5b21b6" opacity="0.07" filter="url(#glow)"/>
  <rect x="120" y="48" width="660" height="410" rx="14" fill="url(#lapG)" stroke="#2a1f4a" stroke-width="1.5"/>
  <rect x="120" y="48" width="660" height="38" rx="14" fill="#1a1040"/>
  <rect x="120" y="72" width="660" height="14" fill="#1a1040"/>
  <circle cx="655" cy="67" r="7" fill="#ff5f57"/><circle cx="675" cy="67" r="7" fill="#febc2e"/><circle cx="695" cy="67" r="7" fill="#28c840"/>
  <rect x="200" y="56" width="440" height="20" rx="10" fill="#110c2a"/>
  <text x="420" y="70" font-family="monospace" font-size="9" fill="#4d4354" text-anchor="middle">toolnestai.net/pdf-tools/sign-pdf</text>
  <rect x="136" y="94" width="628" height="352" rx="6" fill="#0c0920"/>
  <text x="450" y="118" font-family="sans-serif" font-size="13" font-weight="700" fill="#e2e2e2" text-anchor="middle">Sign PDF</text>
  <text x="450" y="134" font-family="sans-serif" font-size="8" fill="#7a6d84" text-anchor="middle">Draw, type, or upload your signature — place it anywhere</text>
  <!-- Signature methods -->
  <rect x="148" y="148" width="100" height="26" rx="8" fill="#7c3aed"/>
  <text x="198" y="165" font-family="sans-serif" font-size="9" font-weight="700" fill="#fff" text-anchor="middle">Draw</text>
  <rect x="256" y="148" width="100" height="26" rx="8" fill="#1a1040"/>
  <text x="306" y="165" font-family="sans-serif" font-size="9" fill="#7a6d84" text-anchor="middle">Type</text>
  <rect x="364" y="148" width="100" height="26" rx="8" fill="#1a1040"/>
  <text x="414" y="165" font-family="sans-serif" font-size="9" fill="#7a6d84" text-anchor="middle">Upload Image</text>
  <!-- Draw pad -->
  <rect x="148" y="184" width="340" height="160" rx="8" fill="#0f0c24" stroke="#2a1f4a" stroke-width="1"/>
  <text x="318" y="266" font-family="sans-serif" font-size="9" fill="#2a1f4a" text-anchor="middle">Draw your signature here</text>
  <!-- Signature SVG path (simulated) -->
  <path d="M 180 300 Q 200 260 230 280 Q 260 300 280 260 Q 300 230 330 250 Q 360 270 380 240" fill="none" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round"/>
  <text x="148" y="360" font-family="sans-serif" font-size="8" fill="#4d4354">Clear</text>
  <!-- PDF preview right side -->
  <rect x="510" y="148" width="240" height="220" rx="8" fill="#1a1040" stroke="#2a1f4a" stroke-width="1"/>
  <text x="630" y="168" font-family="sans-serif" font-size="8" fill="#4d4354" text-anchor="middle">SIGNATURE PLACEMENT</text>
  <rect x="526" y="178" width="208" height="170" rx="4" fill="#110c2a"/>
  <rect x="536" y="190" width="188" height="8" rx="2" fill="#2a1f4a"/>
  <rect x="536" y="202" width="150" height="6" rx="2" fill="#1e1535"/>
  <rect x="536" y="212" width="165" height="6" rx="2" fill="#1e1535"/>
  <rect x="536" y="290" width="120" height="2" rx="1" fill="#3d3347"/>
  <text x="596" y="304" font-family="sans-serif" font-size="7" fill="#4d4354" text-anchor="middle">Signature</text>
  <!-- Placed signature box -->
  <rect x="596" y="260" width="100" height="30" rx="4" fill="#1a1040" stroke="#7c3aed" stroke-width="1" stroke-dasharray="3,2"/>
  <path d="M 606 280 Q 616 268 626 274 Q 636 280 646 270 Q 656 262 666 266 Q 676 270 686 260" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Place signature -->
  <rect x="148" y="390" width="180" height="36" rx="10" fill="#7c3aed"/>
  <text x="238" y="413" font-family="sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">Place Signature</text>
  <rect x="340" y="458" width="220" height="10" rx="5" fill="#1a1040"/>
  <rect x="280" y="466" width="340" height="8" rx="4" fill="#140e34"/>
</svg>
