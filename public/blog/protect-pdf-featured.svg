<svg viewBox="0 0 900 540" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%"><stop offset="0%" stop-color="#0f0825"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <linearGradient id="lapG" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#1a1040"/><stop offset="100%" stop-color="#0d0824"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="900" height="540" fill="url(#bg)"/>
  <ellipse cx="450" cy="270" rx="280" ry="150" fill="#5b21b6" opacity="0.07" filter="url(#glow)"/>
  <rect x="120" y="48" width="660" height="410" rx="14" fill="url(#lapG)" stroke="#2a1f4a" stroke-width="1.5"/>
  <rect x="120" y="48" width="660" height="38" rx="14" fill="#1a1040"/>
  <rect x="120" y="72" width="660" height="14" fill="#1a1040"/>
  <circle cx="655" cy="67" r="7" fill="#ff5f57"/><circle cx="675" cy="67" r="7" fill="#febc2e"/><circle cx="695" cy="67" r="7" fill="#28c840"/>
  <rect x="200" y="56" width="440" height="20" rx="10" fill="#110c2a"/>
  <text x="420" y="70" font-family="monospace" font-size="9" fill="#4d4354" text-anchor="middle">toolnestai.net/pdf-tools/protect-pdf</text>
  <rect x="136" y="94" width="628" height="352" rx="6" fill="#0c0920"/>
  <text x="450" y="118" font-family="sans-serif" font-size="13" font-weight="700" fill="#e2e2e2" text-anchor="middle">Protect PDF with Password</text>
  <text x="450" y="134" font-family="sans-serif" font-size="8" fill="#7a6d84" text-anchor="middle">Set open password, owner password, and permissions</text>
  <!-- User password -->
  <text x="148" y="162" font-family="sans-serif" font-size="9" font-weight="700" fill="#4d4354">USER PASSWORD (to open)</text>
  <rect x="148" y="170" width="380" height="30" rx="8" fill="#0f0c24" stroke="#2a1f4a" stroke-width="1"/>
  <text x="164" y="189" font-family="sans-serif" font-size="9" fill="#3d3347">••••••••••••</text>
  <!-- Owner password -->
  <text x="148" y="220" font-family="sans-serif" font-size="9" font-weight="700" fill="#4d4354">OWNER PASSWORD (to edit)</text>
  <rect x="148" y="228" width="380" height="30" rx="8" fill="#0f0c24" stroke="#2a1f4a" stroke-width="1"/>
  <text x="164" y="247" font-family="sans-serif" font-size="9" fill="#3d3347">••••••••••••••••</text>
  <!-- Permissions checkboxes -->
  <text x="148" y="280" font-family="sans-serif" font-size="9" font-weight="700" fill="#4d4354">PERMISSIONS</text>
  <!-- Row 1 -->
  <rect x="148" y="288" width="12" height="12" rx="3" fill="#7c3aed"/>
  <text x="167" y="299" font-family="sans-serif" font-size="8" fill="#9b8da8">Allow printing</text>
  <rect x="280" y="288" width="12" height="12" rx="3" fill="#1a1040" stroke="#2a1f4a" stroke-width="1"/>
  <text x="299" y="299" font-family="sans-serif" font-size="8" fill="#9b8da8">Allow copying</text>
  <rect x="400" y="288" width="12" height="12" rx="3" fill="#1a1040" stroke="#2a1f4a" stroke-width="1"/>
  <text x="419" y="299" font-family="sans-serif" font-size="8" fill="#9b8da8">Allow editing</text>
  <!-- Row 2 -->
  <rect x="148" y="310" width="12" height="12" rx="3" fill="#7c3aed"/>
  <text x="167" y="321" font-family="sans-serif" font-size="8" fill="#9b8da8">Allow annotations</text>
  <rect x="280" y="310" width="12" height="12" rx="3" fill="#1a1040" stroke="#2a1f4a" stroke-width="1"/>
  <text x="299" y="321" font-family="sans-serif" font-size="8" fill="#9b8da8">Allow form filling</text>
  <!-- Encryption level -->
  <text x="148" y="346" font-family="sans-serif" font-size="9" font-weight="700" fill="#4d4354">ENCRYPTION</text>
  <rect x="148" y="354" width="90" height="22" rx="6" fill="#7c3aed"/>
  <text x="193" y="369" font-family="sans-serif" font-size="8" font-weight="700" fill="#fff" text-anchor="middle">AES-256</text>
  <rect x="246" y="354" width="90" height="22" rx="6" fill="#1a1040"/>
  <text x="291" y="369" font-family="sans-serif" font-size="8" fill="#7a6d84" text-anchor="middle">AES-128</text>
  <rect x="344" y="354" width="90" height="22" rx="6" fill="#1a1040"/>
  <text x="389" y="369" font-family="sans-serif" font-size="8" fill="#7a6d84" text-anchor="middle">RC4-128</text>
  <!-- Protect button -->
  <rect x="148" y="390" width="200" height="36" rx="10" fill="#7c3aed"/>
  <text x="248" y="413" font-family="sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">🔒 Protect PDF</text>
  <rect x="340" y="458" width="220" height="10" rx="5" fill="#1a1040"/>
  <rect x="280" y="466" width="340" height="8" rx="4" fill="#140e34"/>
</svg>
