<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Segoe UI',sans-serif">
  <defs>
    <radialGradient id="bg" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#0f0825"/>
      <stop offset="100%" stop-color="#05030d"/>
    </radialGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5b21b6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e7490" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="lapG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1040"/>
      <stop offset="100%" stop-color="#0d0824"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="900" height="560" fill="url(#bg)"/>
  <ellipse cx="260" cy="200" rx="300" ry="200" fill="url(#glow1)"/>
  <ellipse cx="700" cy="380" rx="220" ry="160" fill="url(#glow2)"/>

  <!-- Laptop -->
  <g filter="url(#shadow)">
    <rect x="130" y="40" width="640" height="420" rx="14" fill="url(#lapG)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    <!-- Chrome bar -->
    <rect x="130" y="40" width="640" height="44" rx="14" fill="#1e1535"/>
    <rect x="130" y="68" width="640" height="16" fill="#1e1535"/>
    <circle cx="655" cy="62" r="7" fill="#ff5f57"/>
    <circle cx="675" cy="62" r="7" fill="#febc2e"/>
    <circle cx="695" cy="62" r="7" fill="#28c840"/>
    <!-- URL bar -->
    <rect x="725" y="53" width="32" height="18" rx="4" fill="#120e2a"/>
    <text x="730" y="66" font-size="10" fill="#5a4d7a">⌘K</text>
    <rect x="230" y="53" width="420" height="18" rx="9" fill="#120e2a"/>
    <text x="440" y="66" font-size="10" fill="#5a4d7a" text-anchor="middle">toolnestai.net/developer-tools/css-minifier</text>

    <!-- Tool area -->
    <rect x="142" y="84" width="616" height="364" rx="0" fill="#0d0a1e"/>

    <!-- Header -->
    <text x="450" y="114" font-size="18" font-weight="800" fill="#e2e2e2" text-anchor="middle" letter-spacing="-0.5">CSS Minifier</text>
    <text x="450" y="132" font-size="11" fill="#7a6d84" text-anchor="middle">Remove whitespace, comments &amp; shorten values</text>

    <!-- Input/Output panes -->
    <!-- Input -->
    <rect x="154" y="142" width="284" height="250" rx="10" fill="#130f28" stroke="rgba(167,139,250,0.2)" stroke-width="1"/>
    <text x="166" y="162" font-size="10" font-weight="700" fill="#a78bfa" letter-spacing="0.08em">INPUT CSS</text>
    <text x="270" y="162" font-size="10" fill="#3d3356">3.2 KB</text>

    <!-- Input code -->
    <text x="166" y="180" font-size="9" fill="#7a6d84" font-family="'Fira Code','Courier New',monospace">/* Navigation styles */</text>
    <text x="166" y="193" font-size="9" fill="#a78bfa" font-family="'Fira Code','Courier New',monospace">.nav  {</text>
    <text x="166" y="206" font-size="9" fill="#e2e2e2" font-family="'Fira Code','Courier New',monospace">  display  :  flex  ;</text>
    <text x="166" y="219" font-size="9" fill="#60a5fa" font-family="'Fira Code','Courier New',monospace">  background-color:</text>
    <text x="166" y="232" font-size="9" fill="#34d399" font-family="'Fira Code','Courier New',monospace">    #ffffff  ;</text>
    <text x="166" y="245" font-size="9" fill="#e2e2e2" font-family="'Fira Code','Courier New',monospace">  padding: 16px  16px</text>
    <text x="166" y="258" font-size="9" fill="#e2e2e2" font-family="'Fira Code','Courier New',monospace">    16px  16px ;</text>
    <text x="166" y="271" font-size="9" fill="#e2e2e2" font-family="'Fira Code','Courier New',monospace">  margin: 0px  0px ;</text>
    <text x="166" y="284" font-size="9" fill="#a78bfa" font-family="'Fira Code','Courier New',monospace">}</text>
    <text x="166" y="300" font-size="9" fill="#7a6d84" font-family="'Fira Code','Courier New',monospace">/* Button component */</text>
    <text x="166" y="313" font-size="9" fill="#a78bfa" font-family="'Fira Code','Courier New',monospace">.btn  {</text>
    <text x="166" y="326" font-size="9" fill="#60a5fa" font-family="'Fira Code','Courier New',monospace">  border: 1px  solid</text>
    <text x="166" y="339" font-size="9" fill="#34d399" font-family="'Fira Code','Courier New',monospace">    rgba(0, 0, 0, 1) ;</text>
    <text x="166" y="352" font-size="9" fill="#a78bfa" font-family="'Fira Code','Courier New',monospace">}</text>
    <text x="166" y="368" font-size="9" fill="#3d3356" font-family="'Fira Code','Courier New',monospace">/* 47 more lines... */</text>

    <!-- Arrow -->
    <g transform="translate(450,242)">
      <circle r="20" fill="#1e1535" stroke="rgba(167,139,250,0.3)" stroke-width="1.5"/>
      <path d="M-8,0 L8,0 M4,-5 L8,0 L4,5" stroke="url(#aG)" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Output -->
    <rect x="462" y="142" width="284" height="250" rx="10" fill="#0b0d1f" stroke="rgba(76,215,246,0.25)" stroke-width="1"/>
    <text x="474" y="162" font-size="10" font-weight="700" fill="#4cd7f6" letter-spacing="0.08em">MINIFIED OUTPUT</text>
    <text x="728" y="162" font-size="10" fill="#34d399">1.1 KB ↓65%</text>

    <!-- Output code — compressed -->
    <text x="474" y="182" font-size="8.5" fill="#e2e2e2" font-family="'Fira Code','Courier New',monospace" xml:space="preserve">.nav{display:flex;background:</text>
    <text x="474" y="195" font-size="8.5" fill="#34d399" font-family="'Fira Code','Courier New',monospace" xml:space="preserve">#fff;padding:16px;margin:0}</text>
    <text x="474" y="208" font-size="8.5" fill="#e2e2e2" font-family="'Fira Code','Courier New',monospace" xml:space="preserve">.btn{border:1px solid</text>
    <text x="474" y="221" font-size="8.5" fill="#e2e2e2" font-family="'Fira Code','Courier New',monospace" xml:space="preserve">#000}</text>

    <!-- Savings badge -->
    <rect x="474" y="235" width="108" height="32" rx="8" fill="rgba(52,211,153,0.1)" stroke="rgba(52,211,153,0.3)" stroke-width="1"/>
    <text x="528" y="254" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle">65% smaller</text>

    <!-- Action buttons -->
    <rect x="154" y="402" width="180" height="32" rx="8" fill="rgba(167,139,250,0.12)" stroke="rgba(167,139,250,0.3)" stroke-width="1"/>
    <text x="244" y="422" font-size="11" font-weight="600" fill="#a78bfa" text-anchor="middle">↑  Paste CSS</text>
    <rect x="346" y="402" width="210" height="32" rx="8" fill="url(#aG)"/>
    <text x="451" y="422" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">⚡  Minify Now</text>
    <rect x="568" y="402" width="120" height="32" rx="8" fill="rgba(76,215,246,0.12)" stroke="rgba(76,215,246,0.3)" stroke-width="1"/>
    <text x="628" y="422" font-size="11" font-weight="600" fill="#4cd7f6" text-anchor="middle">⧉  Copy</text>
  </g>

  <!-- Laptop base -->
  <rect x="90" y="460" width="720" height="12" rx="6" fill="#1a1535" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="360" y="468" width="180" height="6" rx="3" fill="#120e2a"/>
</svg>
