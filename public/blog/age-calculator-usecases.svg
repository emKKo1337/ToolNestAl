<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <radialGradient id="gC" cx="50%" cy="40%" r="60%"><stop offset="0%" stop-color="#0e7490" stop-opacity="0.2"/><stop offset="100%" stop-color="#0e7490" stop-opacity="0"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
  </defs>
  <rect width="900" height="460" fill="url(#bg)"/>
  <ellipse cx="450" cy="230" rx="520" ry="320" fill="url(#gC)"/>

  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="900" fill="url(#aG)">Beyond Birthdays — Practical Uses for Date-Range Calculations</text>
  <text x="450" y="54" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.38)">Age calculators are really "date difference" calculators — useful well beyond personal age</text>

  <!-- Card 1 -->
  <rect x="28" y="70" width="270" height="110" rx="10" fill="rgba(124,58,237,0.08)" stroke="rgba(124,58,237,0.2)" stroke-width="1"/>
  <text x="44" y="92" font-size="11" font-weight="700" fill="#a78bfa">📋 Legal Eligibility</text>
  <text x="44" y="112" font-size="9" fill="rgba(255,255,255,0.55)">Verify exact age for voting,</text>
  <text x="44" y="126" font-size="9" fill="rgba(255,255,255,0.55)">driving licenses, retirement</text>
  <text x="44" y="140" font-size="9" fill="rgba(255,255,255,0.55)">benefits, or school enrollment</text>
  <text x="44" y="158" font-size="8" fill="rgba(255,255,255,0.3)">cutoff dates that require precision.</text>

  <!-- Card 2 -->
  <rect x="314" y="70" width="270" height="110" rx="10" fill="rgba(14,116,144,0.08)" stroke="rgba(14,116,144,0.2)" stroke-width="1"/>
  <text x="330" y="92" font-size="11" font-weight="700" fill="#67e8f9">💼 Employment Duration</text>
  <text x="330" y="112" font-size="9" fill="rgba(255,255,255,0.55)">Calculate exact tenure for</text>
  <text x="330" y="126" font-size="9" fill="rgba(255,255,255,0.55)">severance pay, vacation accrual,</text>
  <text x="330" y="140" font-size="9" fill="rgba(255,255,255,0.55)">or service-length bonuses</text>
  <text x="330" y="158" font-size="8" fill="rgba(255,255,255,0.3)">HR systems need day-level accuracy.</text>

  <!-- Card 3 -->
  <rect x="600" y="70" width="272" height="110" rx="10" fill="rgba(16,185,129,0.07)" stroke="rgba(16,185,129,0.2)" stroke-width="1"/>
  <text x="616" y="92" font-size="11" font-weight="700" fill="#34d399">📈 Project Timelines</text>
  <text x="616" y="112" font-size="9" fill="rgba(255,255,255,0.55)">Measure elapsed time between</text>
  <text x="616" y="126" font-size="9" fill="rgba(255,255,255,0.55)">a project start date and today,</text>
  <text x="616" y="140" font-size="9" fill="rgba(255,255,255,0.55)">or between two milestones</text>
  <text x="616" y="158" font-size="8" fill="rgba(255,255,255,0.3)">Useful for reporting and audits.</text>

  <!-- Card 4 -->
  <rect x="28" y="196" width="270" height="110" rx="10" fill="rgba(251,191,36,0.06)" stroke="rgba(251,191,36,0.2)" stroke-width="1"/>
  <text x="44" y="218" font-size="11" font-weight="700" fill="#fbbf24">💰 Interest &amp; Loan Terms</text>
  <text x="44" y="238" font-size="9" fill="rgba(255,255,255,0.55)">Determine exact days elapsed</text>
  <text x="44" y="252" font-size="9" fill="rgba(255,255,255,0.55)">for day-count interest accrual</text>
  <text x="44" y="266" font-size="9" fill="rgba(255,255,255,0.55)">on loans or bonds</text>
  <text x="44" y="284" font-size="8" fill="rgba(255,255,255,0.3)">Financial calculations often use actual/365 day counts.</text>

  <!-- Card 5 -->
  <rect x="314" y="196" width="270" height="110" rx="10" fill="rgba(236,72,153,0.07)" stroke="rgba(236,72,153,0.2)" stroke-width="1"/>
  <text x="330" y="218" font-size="11" font-weight="700" fill="#f472b6">🏥 Medical &amp; Pregnancy Dates</text>
  <text x="330" y="238" font-size="9" fill="rgba(255,255,255,0.55)">Track gestational age, medication</text>
  <text x="330" y="252" font-size="9" fill="rgba(255,255,255,0.55)">schedules, or time since a</text>
  <text x="330" y="266" font-size="9" fill="rgba(255,255,255,0.55)">diagnosis or procedure</text>
  <text x="330" y="284" font-size="8" fill="rgba(255,255,255,0.3)">Precise day counts matter clinically.</text>

  <!-- Card 6 -->
  <rect x="600" y="196" width="272" height="110" rx="10" fill="rgba(99,102,241,0.08)" stroke="rgba(99,102,241,0.22)" stroke-width="1"/>
  <text x="616" y="218" font-size="11" font-weight="700" fill="#818cf8">🎉 Anniversary Countdown</text>
  <text x="616" y="238" font-size="9" fill="rgba(255,255,255,0.55)">Count down to a wedding,</text>
  <text x="616" y="252" font-size="9" fill="rgba(255,255,255,0.55)">retirement date, or any</text>
  <text x="616" y="266" font-size="9" fill="rgba(255,255,255,0.55)">future milestone</text>
  <text x="616" y="284" font-size="8" fill="rgba(255,255,255,0.3)">Works equally well for future dates.</text>

  <!-- Calculation methods -->
  <rect x="28" y="322" width="844" height="106" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="450" y="344" text-anchor="middle" font-size="10.5" font-weight="700" fill="rgba(255,255,255,0.4)">TWO WAYS TO COUNT AGE — WHY THEY CAN DIFFER BY ONE</text>
  <text x="44" y="366" font-size="9.5" fill="rgba(167,139,250,0.85)">Calendar method (most common):</text>
  <text x="44" y="382" font-size="9" fill="rgba(255,255,255,0.55)">Subtract birth year from current year, then subtract 1 if the current</text>
  <text x="44" y="396" font-size="9" fill="rgba(255,255,255,0.55)">month/day hasn't reached the birth month/day yet this year.</text>
  <text x="470" y="366" font-size="9.5" fill="rgba(103,232,249,0.85)">Full-day method (precise systems):</text>
  <text x="470" y="382" font-size="9" fill="rgba(255,255,255,0.55)">Count exact elapsed days between the two dates, then convert</text>
  <text x="470" y="396" font-size="9" fill="rgba(255,255,255,0.55)">to years/months/days — required for legal and medical precision.</text>
  <text x="450" y="418" text-anchor="middle" font-size="8.5" fill="rgba(255,255,255,0.3)">Both methods agree on the final "years old" number — they differ only in intermediate month/day breakdowns</text>

  <text x="450" y="454" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.2)">toolnestai.net/calculators/age-calculator</text>
</svg>
