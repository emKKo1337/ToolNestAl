<svg viewBox="0 0 900 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="XML Validator tool interface">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0f0825"/>
      <stop offset="100%" stop-color="#05030d"/>
    </radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="lapG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1040"/>
      <stop offset="100%" stop-color="#0d0824"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="900" height="540" fill="url(#bg)"/>
  <!-- Glows -->
  <ellipse cx="450" cy="270" rx="280" ry="150" fill="#5b21b6" opacity="0.07" filter="url(#glow)"/>
  <ellipse cx="700" cy="150" rx="120" ry="80" fill="#0e7490" opacity="0.09" filter="url(#glow)"/>
  <!-- Laptop screen -->
  <rect x="120" y="48" width="660" height="410" rx="14" fill="url(#lapG)" stroke="#2a1f4a" stroke-width="1.5"/>
  <!-- Chrome bar -->
  <rect x="120" y="48" width="660" height="38" rx="14" fill="#1a1040"/>
  <rect x="120" y="72" width="660" height="14" fill="#1a1040"/>
  <!-- Traffic lights -->
  <circle cx="655" cy="67" r="7" fill="#ff5f57"/>
  <circle cx="675" cy="67" r="7" fill="#febc2e"/>
  <circle cx="695" cy="67" r="7" fill="#28c840"/>
  <!-- URL bar -->
  <rect x="200" y="56" width="440" height="20" rx="10" fill="#110c2a"/>
  <text x="420" y="70" font-family="monospace" font-size="9" fill="#4d4354" text-anchor="middle">toolnestai.net/developer-tools/xml-validator</text>
  <!-- Tool area -->
  <rect x="136" y="94" width="628" height="352" rx="6" fill="#0c0920"/>
  <!-- Header -->
  <text x="450" y="120" font-family="sans-serif" font-size="13" font-weight="700" fill="#e2e2e2" text-anchor="middle">XML Validator</text>
  <text x="450" y="136" font-family="sans-serif" font-size="8" fill="#7a6d84" text-anchor="middle">Validate well-formedness and XSD schema compliance</text>

  <!-- Mode tabs -->
  <rect x="250" y="148" width="140" height="24" rx="12" fill="#5b21b6"/>
  <text x="320" y="164" font-family="sans-serif" font-size="9" font-weight="700" fill="#fff" text-anchor="middle">Well-Formed</text>
  <rect x="398" y="148" width="110" height="24" rx="12" fill="#1a1040"/>
  <text x="453" y="164" font-family="sans-serif" font-size="9" fill="#7a6d84" text-anchor="middle">XSD Schema</text>
  <rect x="516" y="148" width="90" height="24" rx="12" fill="#1a1040"/>
  <text x="561" y="164" font-family="sans-serif" font-size="9" fill="#7a6d84" text-anchor="middle">DTD</text>

  <!-- Two panes: input / result -->
  <!-- Input pane -->
  <rect x="148" y="184" width="310" height="236" rx="8" fill="#0f0c24" stroke="#2a1f4a" stroke-width="1"/>
  <text x="160" y="200" font-family="sans-serif" font-size="8" font-weight="700" fill="#4d4354">XML INPUT</text>
  <!-- XML code with errors highlighted -->
  <text x="160" y="218" font-family="monospace" font-size="8.5" fill="#7a6d84">&lt;?xml version="1.0"?&gt;</text>
  <text x="160" y="232" font-family="monospace" font-size="8.5" fill="#a78bfa">&lt;catalog&gt;</text>
  <text x="168" y="246" font-family="monospace" font-size="8.5" fill="#60a5fa">  &lt;book id="b1"&gt;</text>
  <text x="176" y="260" font-family="monospace" font-size="8.5" fill="#e2e2e2">    &lt;title&gt;Clean Code&lt;/title&gt;</text>
  <text x="176" y="274" font-family="monospace" font-size="8.5" fill="#e2e2e2">    &lt;author&gt;Robert Martin</text>
  <!-- Error line highlight -->
  <rect x="148" y="276" width="310" height="15" rx="2" fill="#ff453a" opacity="0.12"/>
  <text x="176" y="287" font-family="monospace" font-size="8.5" fill="#ff453a">    &lt;year&gt;2008&lt;/yr&gt;</text>
  <text x="168" y="301" font-family="monospace" font-size="8.5" fill="#60a5fa">  &lt;/book&gt;</text>
  <text x="160" y="315" font-family="monospace" font-size="8.5" fill="#a78bfa">&lt;/catalog&gt;</text>
  <!-- Line numbers -->
  <text x="152" y="218" font-family="monospace" font-size="7" fill="#3d3347">1</text>
  <text x="152" y="232" font-family="monospace" font-size="7" fill="#3d3347">2</text>
  <text x="152" y="246" font-family="monospace" font-size="7" fill="#3d3347">3</text>
  <text x="152" y="260" font-family="monospace" font-size="7" fill="#3d3347">4</text>
  <text x="152" y="274" font-family="monospace" font-size="7" fill="#3d3347">5</text>
  <text x="152" y="287" font-family="monospace" font-size="7" fill="#ff453a">6</text>
  <text x="152" y="301" font-family="monospace" font-size="7" fill="#3d3347">7</text>
  <text x="152" y="315" font-family="monospace" font-size="7" fill="#3d3347">8</text>

  <!-- Validate button -->
  <rect x="148" y="330" width="140" height="30" rx="8" fill="#7c3aed"/>
  <text x="218" y="350" font-family="sans-serif" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">Validate XML</text>
  <rect x="298" y="330" width="90" height="30" rx="8" fill="#1a1040" stroke="#2a1f4a" stroke-width="1"/>
  <text x="343" y="350" font-family="sans-serif" font-size="10" fill="#7a6d84" text-anchor="middle">Clear</text>

  <!-- Result pane -->
  <rect x="472" y="184" width="290" height="236" rx="8" fill="#0f0c24" stroke="#2a1f4a" stroke-width="1"/>
  <text x="484" y="200" font-family="sans-serif" font-size="8" font-weight="700" fill="#4d4354">VALIDATION RESULT</text>

  <!-- Error badge -->
  <rect x="484" y="208" width="80" height="18" rx="9" fill="#ff453a" opacity="0.18"/>
  <circle cx="494" cy="217" r="4" fill="#ff453a"/>
  <text x="504" y="220" font-family="sans-serif" font-size="8" font-weight="700" fill="#ff453a">1 ERROR FOUND</text>

  <!-- Error detail -->
  <rect x="484" y="234" width="266" height="60" rx="6" fill="#1a0c0c" stroke="#ff453a" stroke-width="1" stroke-opacity="0.4"/>
  <text x="494" y="252" font-family="sans-serif" font-size="8" font-weight="700" fill="#ff453a">Mismatched tag</text>
  <text x="494" y="266" font-family="sans-serif" font-size="7.5" fill="#9b8da8">Line 6: Expected &lt;/author&gt;</text>
  <text x="494" y="278" font-family="sans-serif" font-size="7.5" fill="#9b8da8">but found &lt;/yr&gt;</text>
  <text x="494" y="290" font-family="sans-serif" font-size="7" fill="#5a4d63">Error code: XML_ERR_TAG_NAME_MISMATCH</text>

  <!-- Passed checks -->
  <text x="484" y="314" font-family="sans-serif" font-size="8" font-weight="700" fill="#4d4354">PASSED CHECKS</text>
  <circle cx="492" cy="328" r="4" fill="#34d399"/>
  <text x="502" y="332" font-family="sans-serif" font-size="8" fill="#9b8da8">XML declaration present</text>
  <circle cx="492" cy="344" r="4" fill="#34d399"/>
  <text x="502" y="348" font-family="sans-serif" font-size="8" fill="#9b8da8">UTF-8 encoding valid</text>
  <circle cx="492" cy="360" r="4" fill="#34d399"/>
  <text x="502" y="364" font-family="sans-serif" font-size="8" fill="#9b8da8">Root element present</text>
  <circle cx="492" cy="376" r="4" fill="#34d399"/>
  <text x="502" y="380" font-family="sans-serif" font-size="8" fill="#9b8da8">Attributes properly quoted</text>

  <!-- Base / stand -->
  <rect x="340" y="458" width="220" height="10" rx="5" fill="#1a1040"/>
  <rect x="280" y="466" width="340" height="8" rx="4" fill="#140e34"/>
</svg>
