<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <radialGradient id="gL" cx="10%" cy="50%" r="60%"><stop offset="0%" stop-color="#5b21b6" stop-opacity="0.35"/><stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/></radialGradient>
    <radialGradient id="gR" cx="90%" cy="50%" r="60%"><stop offset="0%" stop-color="#0e7490" stop-opacity="0.2"/><stop offset="100%" stop-color="#0e7490" stop-opacity="0"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="bG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient>
    <linearGradient id="lapG" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1a1040"/><stop offset="100%" stop-color="#0d0824"/></linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#5b21b6" flood-opacity="0.45"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <ellipse cx="120" cy="337" rx="700" ry="550" fill="url(#gL)"/>
  <ellipse cx="1080" cy="337" rx="700" ry="550" fill="url(#gR)"/>

  <text x="600" y="42" text-anchor="middle" font-size="13" font-weight="700" fill="url(#aG)" filter="url(#glow)">ToolNest AI — Image Tools</text>
  <text x="600" y="68" text-anchor="middle" font-size="34" font-weight="900" fill="url(#aG)" filter="url(#glow)">Image Resizer</text>
  <text x="600" y="90" text-anchor="middle" font-size="13" fill="rgba(255,255,255,0.35)">Exact pixels or percentage, aspect ratio locked — free, entirely in your browser</text>

  <rect x="60" y="108" width="1080" height="542" rx="18" fill="url(#lapG)" stroke="rgba(124,58,237,0.35)" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="60" y="108" width="1080" height="38" rx="18" fill="rgba(255,255,255,0.05)"/>
  <rect x="60" y="128" width="1080" height="18" fill="rgba(255,255,255,0.02)"/>
  <circle cx="90" cy="127" r="7" fill="rgba(239,68,68,0.65)"/>
  <circle cx="114" cy="127" r="7" fill="rgba(251,191,36,0.65)"/>
  <circle cx="138" cy="127" r="7" fill="rgba(34,197,94,0.65)"/>
  <text x="600" y="132" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.2)">toolnestai.net/image-tools/image-resizer</text>

  <!-- Original vs resized comparison -->
  <text x="88" y="176" font-size="9" font-weight="700" fill="rgba(255,255,255,0.28)">ORIGINAL: 3000 × 2000 px (3:2 ratio)</text>
  <rect x="80" y="182" width="400" height="266" rx="8" fill="rgba(103,232,249,0.06)" stroke="rgba(103,232,249,0.25)" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="280" y="322" text-anchor="middle" font-size="13" fill="rgba(103,232,249,0.5)">3000 × 2000 px</text>

  <rect x="130" y="232" width="300" height="200" rx="6" fill="rgba(167,139,250,0.15)" stroke="rgba(167,139,250,0.6)" stroke-width="2"/>
  <text x="280" y="337" text-anchor="middle" font-size="14" font-weight="700" fill="rgba(167,139,250,0.9)">1500 × 1000 px</text>
  <circle cx="430" cy="432" r="7" fill="#a78bfa"/>
  <text x="446" y="436" font-size="9" fill="rgba(167,139,250,0.7)">drag handle</text>

  <!-- Fields panel -->
  <text x="520" y="176" font-size="9" font-weight="700" fill="rgba(255,255,255,0.28)">DIMENSIONS</text>
  <rect x="512" y="182" width="280" height="150" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="528" y="206" font-size="9" fill="rgba(255,255,255,0.4)">WIDTH (px)</text>
  <rect x="528" y="212" width="110" height="32" rx="6" fill="rgba(0,0,0,0.4)" stroke="rgba(124,58,237,0.3)" stroke-width="1"/>
  <text x="583" y="234" text-anchor="middle" font-size="13" fill="rgba(167,139,250,0.85)">1500</text>

  <text x="654" y="206" font-size="9" fill="rgba(255,255,255,0.4)">HEIGHT (px)</text>
  <rect x="654" y="212" width="110" height="32" rx="6" fill="rgba(0,0,0,0.4)" stroke="rgba(103,232,249,0.3)" stroke-width="1"/>
  <text x="709" y="234" text-anchor="middle" font-size="13" fill="rgba(103,232,249,0.85)">1000</text>

  <rect x="528" y="256" width="236" height="26" rx="6" fill="rgba(52,211,153,0.1)" stroke="rgba(52,211,153,0.25)" stroke-width="1"/>
  <text x="646" y="273" text-anchor="middle" font-size="10" font-weight="700" fill="#34d399">🔒 Aspect ratio locked</text>

  <g font-size="9.5" text-anchor="middle">
    <rect x="528" y="292" width="112" height="26" rx="6" fill="url(#bG)"/>
    <text x="584" y="309" fill="#fff" font-weight="700">Pixels</text>
    <rect x="652" y="292" width="112" height="26" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="708" y="309" fill="rgba(255,255,255,0.4)">Percentage</text>
  </g>

  <!-- Result card -->
  <rect x="512" y="348" width="268" height="100" rx="10" fill="rgba(52,211,153,0.08)" stroke="rgba(52,211,153,0.25)" stroke-width="1.5"/>
  <text x="646" y="382" text-anchor="middle" font-size="20" font-weight="900" fill="#34d399">1500 × 1000</text>
  <text x="646" y="402" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.45)">Ratio preserved — no distortion</text>
  <text x="646" y="420" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.3)">File size: ~2.1 MB → ~540 KB</text>

  <!-- Right panel: resize methods -->
  <rect x="820" y="182" width="300" height="266" rx="12" fill="rgba(255,255,255,0.025)" stroke="rgba(124,58,237,0.18)" stroke-width="1"/>
  <text x="970" y="206" text-anchor="middle" font-size="11" font-weight="700" fill="rgba(255,255,255,0.5)">Resizing Methods</text>

  <text x="836" y="232" font-size="9.5" font-weight="700" fill="rgba(167,139,250,0.85)">Exact dimensions</text>
  <text x="836" y="250" font-size="9" fill="rgba(255,255,255,0.5)">Set precise width/height in pixels</text>

  <text x="836" y="278" font-size="9.5" font-weight="700" fill="rgba(103,232,249,0.85)">Percentage scale</text>
  <text x="836" y="296" font-size="9" fill="rgba(255,255,255,0.5)">Scale to 50%, 25%, or any %</text>

  <text x="836" y="324" font-size="9.5" font-weight="700" fill="rgba(52,211,153,0.85)">Aspect ratio lock</text>
  <text x="836" y="342" font-size="9" fill="rgba(255,255,255,0.5)">Prevents stretching/squashing</text>

  <text x="836" y="370" font-size="9.5" font-weight="700" fill="rgba(251,191,36,0.85)">Upscale warning</text>
  <text x="836" y="388" font-size="9" fill="rgba(255,255,255,0.5)">Flags quality loss beyond</text>
  <text x="836" y="402" font-size="9" fill="rgba(255,255,255,0.5)">original resolution</text>

  <text x="836" y="430" font-size="9" fill="rgba(255,255,255,0.3)">100% client-side — image never</text>
  <text x="836" y="444" font-size="9" fill="rgba(255,255,255,0.3)">leaves your browser</text>

  <!-- Buttons -->
  <rect x="80" y="478" width="330" height="34" rx="9" fill="url(#bG)" filter="url(#sh)"/>
  <text x="245" y="500" text-anchor="middle" font-size="13" font-weight="900" fill="#fff">Resize Image</text>
  <rect x="422" y="478" width="330" height="34" rx="9" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="587" y="500" text-anchor="middle" font-size="12" fill="rgba(255,255,255,0.35)">Download PNG / JPG</text>

  <rect x="48" y="650" width="1104" height="16" rx="5" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="460" y="664" width="280" height="10" rx="5" fill="rgba(255,255,255,0.025)"/>
</svg>
