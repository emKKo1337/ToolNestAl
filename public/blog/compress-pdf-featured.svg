<svg viewBox="0 0 900 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Compress PDF tool interface">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0f0825"/>
      <stop offset="100%" stop-color="#05030d"/>
    </radialGradient>
    <linearGradient id="lapG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1040"/>
      <stop offset="100%" stop-color="#0d0824"/>
    </linearGradient>
    <linearGradient id="bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="900" height="540" fill="url(#bg)"/>
  <ellipse cx="450" cy="270" rx="280" ry="150" fill="#5b21b6" opacity="0.07" filter="url(#glow)"/>
  <!-- Laptop -->
  <rect x="120" y="48" width="660" height="410" rx="14" fill="url(#lapG)" stroke="#2a1f4a" stroke-width="1.5"/>
  <rect x="120" y="48" width="660" height="38" rx="14" fill="#1a1040"/>
  <rect x="120" y="72" width="660" height="14" fill="#1a1040"/>
  <circle cx="655" cy="67" r="7" fill="#ff5f57"/>
  <circle cx="675" cy="67" r="7" fill="#febc2e"/>
  <circle cx="695" cy="67" r="7" fill="#28c840"/>
  <rect x="200" y="56" width="440" height="20" rx="10" fill="#110c2a"/>
  <text x="420" y="70" font-family="monospace" font-size="9" fill="#4d4354" text-anchor="middle">toolnestai.net/pdf-tools/compress-pdf</text>
  <rect x="136" y="94" width="628" height="352" rx="6" fill="#0c0920"/>
  <text x="450" y="118" font-family="sans-serif" font-size="13" font-weight="700" fill="#e2e2e2" text-anchor="middle">Compress PDF</text>
  <text x="450" y="134" font-family="sans-serif" font-size="8" fill="#7a6d84" text-anchor="middle">Reduce file size while maintaining quality</text>

  <!-- File info -->
  <rect x="148" y="148" width="628" height="52" rx="8" fill="#110c2a" stroke="#2a1f4a" stroke-width="1"/>
  <text x="176" y="168" font-family="sans-serif" font-size="10" font-weight="700" fill="#cfc2d6">annual-report-2025.pdf</text>
  <text x="176" y="184" font-family="sans-serif" font-size="8" fill="#4d4354">Original size: 12.4 MB · 48 pages · Contains images</text>
  <rect x="680" y="158" width="80" height="24" rx="6" fill="#1a1040"/>
  <text x="720" y="174" font-family="sans-serif" font-size="9" fill="#7a6d84" text-anchor="middle">Change file</text>

  <!-- Compression level -->
  <text x="148" y="224" font-family="sans-serif" font-size="9" font-weight="700" fill="#4d4354">COMPRESSION LEVEL</text>
  <rect x="148" y="232" width="628" height="40" rx="8" fill="#110c2a"/>
  <!-- Slider track -->
  <rect x="170" y="248" width="586" height="6" rx="3" fill="#1a1040"/>
  <rect x="170" y="248" width="293" height="6" rx="3" fill="url(#bar)"/>
  <circle cx="463" cy="251" r="9" fill="#7c3aed" stroke="#e2e2e2" stroke-width="2"/>
  <text x="170" y="264" font-family="sans-serif" font-size="7" fill="#3d3347">Low</text>
  <text x="450" y="264" font-family="sans-serif" font-size="7" fill="#a78bfa" text-anchor="middle">Medium</text>
  <text x="756" y="264" font-family="sans-serif" font-size="7" fill="#3d3347" text-anchor="end">Maximum</text>

  <!-- Estimated result -->
  <rect x="148" y="284" width="628" height="100" rx="8" fill="#110c2a" stroke="#2a1f4a" stroke-width="1"/>
  <text x="164" y="304" font-family="sans-serif" font-size="9" font-weight="700" fill="#4d4354">ESTIMATED RESULT</text>
  <!-- Before -->
  <text x="164" y="328" font-family="sans-serif" font-size="8" fill="#7a6d84">Before</text>
  <rect x="210" y="316" width="200" height="18" rx="4" fill="#1a1040"/>
  <rect x="210" y="316" width="200" height="18" rx="4" fill="#2a1f4a" opacity="0.5"/>
  <text x="415" y="328" font-family="sans-serif" font-size="9" fill="#7a6d84">12.4 MB</text>
  <!-- After -->
  <text x="164" y="352" font-family="sans-serif" font-size="8" fill="#7a6d84">After</text>
  <rect x="210" y="340" width="110" height="18" rx="4" fill="url(#bar)" opacity="0.7"/>
  <text x="325" y="352" font-family="sans-serif" font-size="9" fill="#a78bfa">6.2 MB</text>
  <!-- Savings badge -->
  <rect x="500" y="316" width="90" height="42" rx="8" fill="#7c3aed" opacity="0.15"/>
  <text x="545" y="334" font-family="sans-serif" font-size="13" font-weight="900" fill="#a78bfa" text-anchor="middle">50%</text>
  <text x="545" y="348" font-family="sans-serif" font-size="7" fill="#7a6d84" text-anchor="middle">size reduction</text>
  <!-- Compress button -->
  <rect x="148" y="396" width="200" height="36" rx="10" fill="#7c3aed"/>
  <text x="248" y="419" font-family="sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">Compress PDF</text>
  <rect x="362" y="396" width="140" height="36" rx="10" fill="#1a1040" stroke="#2a1f4a" stroke-width="1"/>
  <text x="432" y="419" font-family="sans-serif" font-size="12" fill="#7a6d84" text-anchor="middle">Preview first</text>

  <!-- Base -->
  <rect x="340" y="458" width="220" height="10" rx="5" fill="#1a1040"/>
  <rect x="280" y="466" width="340" height="8" rx="4" fill="#140e34"/>
</svg>
