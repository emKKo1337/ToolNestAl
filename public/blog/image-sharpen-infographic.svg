<svg viewBox="0 0 900 1200" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <radialGradient id="gT" cx="50%" cy="10%" r="60%"><stop offset="0%" stop-color="#5b21b6" stop-opacity="0.35"/><stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/></radialGradient>
    <radialGradient id="gB" cx="50%" cy="90%" r="60%"><stop offset="0%" stop-color="#0e7490" stop-opacity="0.2"/><stop offset="100%" stop-color="#0e7490" stop-opacity="0"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
  </defs>
  <rect width="900" height="1200" fill="url(#bg)"/>
  <ellipse cx="450" cy="200" rx="700" ry="400" fill="url(#gT)"/>
  <ellipse cx="450" cy="1000" rx="700" ry="400" fill="url(#gB)"/>
  <text x="450" y="52" text-anchor="middle" font-size="26" font-weight="900" fill="url(#aG)">Image Sharpening Guide</text>
  <text x="450" y="76" text-anchor="middle" font-size="13" fill="rgba(255,255,255,0.38)">Unsharp mask, Laplacian, high-pass — what each does and when to use it</text>
  <text x="450" y="96" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.22)">toolnestai.net/image-tools/image-sharpen</text>
  <!-- S1 -->
  <rect x="32" y="112" width="836" height="38" rx="8" fill="rgba(124,58,237,0.18)" stroke="rgba(124,58,237,0.3)" stroke-width="1"/>
  <text x="450" y="136" text-anchor="middle" font-size="15" font-weight="800" fill="#a78bfa">01 — Unsharp Mask (USM)</text>
  <rect x="32" y="156" width="836" height="80" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="450" y="178" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.6)">output = original + amount × (original − blur(original))</text>
  <text x="450" y="198" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.6)">Subtracts a blurred copy to extract edges, then adds them back amplified. Most natural result.</text>
  <text x="450" y="220" text-anchor="middle" font-size="9.5" fill="rgba(255,255,255,0.3)">Parameters: amount (50–200%), radius (0.5–3px), threshold (0–10)</text>
  <!-- S2 -->
  <rect x="32" y="252" width="836" height="38" rx="8" fill="rgba(14,116,144,0.18)" stroke="rgba(14,116,144,0.3)" stroke-width="1"/>
  <text x="450" y="276" text-anchor="middle" font-size="15" font-weight="800" fill="#67e8f9">02 — Laplacian Sharpening</text>
  <rect x="32" y="296" width="836" height="80" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="450" y="318" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.6)">Uses a 3×3 kernel: center=+5, 4 neighbors=-1 (sum=1, so flat areas are unchanged).</text>
  <text x="450" y="338" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.6)">Dramatically boosts edge contrast. Crispest result but can amplify noise.</text>
  <text x="450" y="358" text-anchor="middle" font-size="9.5" fill="rgba(255,255,255,0.3)">Best used on already-clean images without much noise</text>
  <!-- S3 -->
  <rect x="32" y="392" width="836" height="38" rx="8" fill="rgba(52,211,153,0.12)" stroke="rgba(52,211,153,0.22)" stroke-width="1"/>
  <text x="450" y="416" text-anchor="middle" font-size="15" font-weight="800" fill="#34d399">03 — Over-Sharpening Artifacts</text>
  <rect x="32" y="436" width="836" height="100" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="450" y="458" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.6)">Over-sharpening creates "halo" artifacts — bright and dark fringes along edges. They look</text>
  <text x="450" y="478" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.6)">like a glowing ring and are a telltale sign of excessive post-processing.</text>
  <text x="450" y="498" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.6)">Fix: reduce amount, increase threshold, or use a smaller radius.</text>
  <text x="450" y="518" text-anchor="middle" font-size="9.5" fill="rgba(255,255,255,0.3)">Check edges at 100% zoom — if white/dark rings appear, reduce sharpening</text>
  <!-- S4 -->
  <rect x="32" y="552" width="836" height="38" rx="8" fill="rgba(251,191,36,0.12)" stroke="rgba(251,191,36,0.22)" stroke-width="1"/>
  <text x="450" y="576" text-anchor="middle" font-size="15" font-weight="800" fill="#fbbf24">04 — When to Sharpen</text>
  <g font-size="9.5" text-anchor="middle">
    <rect x="32" y="596" width="270" height="80" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="167" y="618" font-weight="700" fill="rgba(52,211,153,0.85)">Photo after resize</text>
    <text x="167" y="638" fill="rgba(255,255,255,0.5)">Downsampling softens — sharpen</text>
    <text x="167" y="656" fill="rgba(255,255,255,0.5)">output before publishing</text>
    <rect x="315" y="596" width="270" height="80" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="450" y="618" font-weight="700" fill="rgba(103,232,249,0.85)">Scanner output</text>
    <text x="450" y="638" fill="rgba(255,255,255,0.5)">Scanned docs often soft</text>
    <text x="450" y="656" fill="rgba(255,255,255,0.5)">USM radius=1, amount=100%</text>
    <rect x="598" y="596" width="270" height="80" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="733" y="618" font-weight="700" fill="rgba(167,139,250,0.85)">NOT before blur</text>
    <text x="733" y="638" fill="rgba(255,255,255,0.5)">Sharpening then blurring</text>
    <text x="733" y="656" fill="rgba(255,255,255,0.5)">cancels both operations</text>
  </g>
  <!-- S5 code -->
  <rect x="32" y="692" width="836" height="38" rx="8" fill="rgba(167,139,250,0.14)" stroke="rgba(167,139,250,0.25)" stroke-width="1"/>
  <text x="450" y="716" text-anchor="middle" font-size="15" font-weight="800" fill="#c4b5fd">05 — Code Examples</text>
  <rect x="32" y="736" width="836" height="120" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="50" y="758" font-size="9" font-family="monospace" fill="rgba(167,139,250,0.7)"># Python Pillow — Unsharp Mask</text>
  <text x="50" y="776" font-size="9" font-family="monospace" fill="rgba(255,255,255,0.5)">img.filter(ImageFilter.UnsharpMask(radius=2, percent=150, threshold=3))</text>
  <text x="50" y="800" font-size="9" font-family="monospace" fill="rgba(52,211,153,0.7)">// Sharp (Node.js)</text>
  <text x="50" y="818" font-size="9" font-family="monospace" fill="rgba(255,255,255,0.5)">sharp('photo.jpg').sharpen({'{'} sigma: 2, m1: 0.5, m2: 0.5 {'}'}).toFile('sharp.jpg');</text>
  <text x="50" y="842" font-size="9" font-family="monospace" fill="rgba(103,232,249,0.7)">// CSS (browser engine Gaussian sharpen)</text>
  <text x="50" y="860" font-size="9" font-family="monospace" fill="rgba(255,255,255,0.5)">.sharp {'{'} filter: contrast(1.1) saturate(1.05); {'}'}</text>
  <text x="450" y="1000" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.28)">Free tool: toolnestai.net/image-tools/image-sharpen</text>
</svg>
