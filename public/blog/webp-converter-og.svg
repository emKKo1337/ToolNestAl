    <text x="717" y="162" font-size="24" font-weight="900" fill="rgba(251,191,36,0.8)">490 KB</text>
    <text x="717" y="200" fill="rgba(255,255,255,0.35)">quality 82%</text>
    <rect x="808" y="108" width="150" height="110" rx="8" fill="rgba(103,232,249,0.06)" stroke="rgba(103,232,249,0.18)" stroke-width="1"/>
    <text x="883" y="130" fill="rgba(103,232,249,0.6)">PNG</text>
    <text x="883" y="162" font-size="24" font-weight="900" fill="rgba(103,232,249,0.7)">3.4 MB</text>
    <text x="883" y="200" fill="rgba(255,255,255,0.35)">lossless</text>
    <rect x="974" y="108" width="150" height="110" rx="8" fill="rgba(52,211,153,0.1)" stroke="rgba(52,211,153,0.3)" stroke-width="1.5"/>
    <text x="1049" y="130" fill="rgba(52,211,153,0.7)">WebP</text>
    <text x="1049" y="162" font-size="24" font-weight="900" fill="rgba(110,231,183,0.95)">355 KB</text>
    <text x="1049" y="186" fill="rgba(52,211,153,0.85)">27% smaller</text>
