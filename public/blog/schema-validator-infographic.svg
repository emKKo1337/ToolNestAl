  <!-- SECTION 1: What is Schema Markup -->
  <rect x="40" y="220" width="820" height="180" rx="16" fill="rgba(255,255,255,0.025)" stroke="rgba(167,139,250,0.18)" stroke-width="1"/>
  <text x="70" y="256" font-size="18" font-weight="800" fill="url(#aG)">01 — What Is Schema Markup?</text>
  <text x="70" y="278" font-size="11" fill="rgba(255,255,255,0.55)" font-weight="600">Schema markup is structured data code that helps search engines understand your content.</text>
  <g font-size="10" fill="rgba(255,255,255,0.45)">
    <text x="70" y="302">• Vocabulary from Schema.org — a joint project by Google, Bing, Yahoo and Yandex</text>
    <text x="70" y="320">• Added to HTML as JSON-LD (recommended), Microdata or RDFa</text>
    <text x="70" y="338">• Tells search engines: what type of content this is, who wrote it, when it was published</text>
    <text x="70" y="356">• Unlocks Rich Results in Google Search — star ratings, FAQs, breadcrumbs, carousels and more</text>
    <text x="70" y="374">• Used by 47% of the top 10,000 websites — it's no longer optional for competitive SEO</text>
  </g>

