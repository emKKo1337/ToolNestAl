    <text x="723" y="527" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.55)">time per schema</text>

    <text x="70" y="560" font-size="9" fill="rgba(255,255,255,0.45)">⚠ Invalid schema = Google ignores your rich results entirely — even if your content is perfect</text>
    <text x="70" y="577" font-size="9" fill="rgba(255,255,255,0.45)">⚠ Errors in schema can lead to manual actions and penalties in Google Search Console</text>
    <text x="70" y="594" font-size="9" fill="rgba(255,255,255,0.45)">✓ Validating before deploying costs zero — letting errors ship costs organic traffic</text>
    <text x="70" y="611" font-size="9" fill="rgba(255,255,255,0.45)">✓ Regular re-validation catches schema broken by CMS updates, template changes or plugin conflicts</text>
