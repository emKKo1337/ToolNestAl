<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0a0118"/>
      <stop offset="100%" stop-color="#05030d"/>
    </radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="bG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="lapG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1040"/>
      <stop offset="100%" stop-color="#0d0824"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="18" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="g2"><feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <!-- Sepia filter for demo -->
    <filter id="sepia-f">
      <feColorMatrix type="matrix" values="0.393 0.769 0.189 0 0  0.349 0.686 0.168 0 0  0.272 0.534 0.131 0 0  0 0 0 1 0"/>
    </filter>
    <filter id="grayscale-f">
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="hdr-f">
      <feColorMatrix type="saturate" values="2.5"/>
    </filter>
    <!-- Vintage gradient for panel -->
    <linearGradient id="sunsetG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="50%" stop-color="#f7931e"/>
      <stop offset="100%" stop-color="#ffcd3c"/>
    </linearGradient>
    <linearGradient id="skyG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0533"/>
      <stop offset="60%" stop-color="#7c1a6e"/>
      <stop offset="100%" stop-color="#ff6b35"/>
    </linearGradient>
    <linearGradient id="sepiaG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#704214"/>
      <stop offset="50%" stop-color="#a0621e"/>
      <stop offset="100%" stop-color="#c8933a"/>
    </linearGradient>
    <linearGradient id="coolG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a3a6e"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="vintG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a2c0a"/>
      <stop offset="50%" stop-color="#8b5e1e"/>
      <stop offset="100%" stop-color="#d4a554"/>
    </linearGradient>
    <clipPath id="screenClip">
      <rect x="550" y="52" width="570" height="350" rx="4"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Purple glow left -->
  <circle cx="200" cy="315" r="200" fill="#5b21b6" opacity="0.12" filter="url(#glow)"/>
  <!-- Blue glow right -->
  <circle cx="900" cy="200" r="160" fill="#0e7490" opacity="0.10" filter="url(#glow)"/>

  <!-- Left panel: text content -->
  <text x="80" y="130" font-size="13" fill="#a78bfa" font-weight="700" letter-spacing="2" text-anchor="start">IMAGE FILTERS</text>
  <text x="80" y="180" font-size="44" fill="#e2e2e2" font-weight="800" text-anchor="start">17 Professional</text>
  <text x="80" y="235" font-size="44" fill="url(#aG)" font-weight="800" text-anchor="start">Photo Filters</text>
  <text x="80" y="280" font-size="44" fill="#e2e2e2" font-weight="800" text-anchor="start">Online</text>

  <text x="80" y="335" font-size="16" fill="#7a6d84" text-anchor="start">Apply stunning effects in seconds.</text>
  <text x="80" y="358" font-size="16" fill="#7a6d84" text-anchor="start">Real-time preview. No upload needed.</text>

  <!-- Filter tags -->
  <g transform="translate(80,385)">
    <!-- Sepia -->
    <rect width="80" height="28" rx="14" fill="rgba(161,78,27,0.25)" stroke="#a14e1b" stroke-width="1"/>
    <text x="40" y="18" font-size="11" fill="#d47b3f" font-weight="600" text-anchor="middle">Sepia</text>
    <!-- Vintage -->
    <rect x="88" width="80" height="28" rx="14" fill="rgba(124,58,237,0.2)" stroke="#7c3aed" stroke-width="1"/>
    <text x="128" y="18" font-size="11" fill="#a78bfa" font-weight="600" text-anchor="middle">Vintage</text>
    <!-- HDR -->
    <rect x="176" width="72" height="28" rx="14" fill="rgba(6,182,212,0.2)" stroke="#0891b2" stroke-width="1"/>
    <text x="212" y="18" font-size="11" fill="#22d3ee" font-weight="600" text-anchor="middle">HDR</text>
    <!-- Noir -->
    <rect x="256" width="72" height="28" rx="14" fill="rgba(51,51,51,0.4)" stroke="#555" stroke-width="1"/>
    <text x="292" y="18" font-size="11" fill="#ccc" font-weight="600" text-anchor="middle">Noir</text>
  </g>
  <g transform="translate(80,423)">
    <!-- Warm -->
    <rect width="72" height="28" rx="14" fill="rgba(251,146,60,0.2)" stroke="#fb923c" stroke-width="1"/>
    <text x="36" y="18" font-size="11" fill="#fdba74" font-weight="600" text-anchor="middle">Warm</text>
    <!-- Cool -->
    <rect x="80" width="72" height="28" rx="14" fill="rgba(59,130,246,0.2)" stroke="#3b82f6" stroke-width="1"/>
    <text x="116" y="18" font-size="11" fill="#93c5fd" font-weight="600" text-anchor="middle">Cool</text>
    <!-- Cinematic -->
    <rect x="160" width="100" height="28" rx="14" fill="rgba(139,92,246,0.2)" stroke="#8b5cf6" stroke-width="1"/>
    <text x="210" y="18" font-size="11" fill="#c4b5fd" font-weight="600" text-anchor="middle">Cinematic</text>
    <!-- +13 more -->
    <rect x="268" width="84" height="28" rx="14" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="310" y="18" font-size="11" fill="#6b7280" font-weight="600" text-anchor="middle">+13 more</text>
  </g>

  <!-- Laptop body -->
  <rect x="538" y="40" width="594" height="400" rx="14" fill="url(#lapG)" stroke="rgba(139,92,246,0.3)" stroke-width="1.5"/>
  <!-- Chrome bar -->
  <rect x="538" y="40" width="594" height="36" rx="14" fill="#1a1040"/>
  <rect x="538" y="58" width="594" height="18" fill="#1a1040"/>
  <!-- Traffic lights -->
  <circle cx="655" cy="58" r="6" fill="#ff5f57"/>
  <circle cx="675" cy="58" r="6" fill="#ffbd2e"/>
  <circle cx="695" cy="58" r="6" fill="#28ca41"/>
  <!-- URL bar -->
  <rect x="720" y="48" width="320" height="18" rx="9" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="880" y="60" font-size="10" fill="#4d4354" text-anchor="middle">toolnestai.net/image-tools/image-filters</text>

  <!-- Screen content -->
  <g clip-path="url(#screenClip)">
    <!-- Main screen bg -->
    <rect x="550" y="52" width="570" height="350" fill="#0f0b1f"/>

    <!-- Left: filter panel sidebar -->
    <rect x="550" y="52" width="140" height="350" fill="#130e2a"/>
    <text x="620" y="90" font-size="10" fill="#6b5b7a" text-anchor="middle" font-weight="700" letter-spacing="1">FILTERS</text>

    <!-- Filter list items -->
    <g font-size="10" font-weight="600">
      <!-- Original - inactive -->
      <rect x="558" y="98" width="124" height="24" rx="5" fill="rgba(255,255,255,0.03)"/>
      <text x="575" y="114" fill="#4d4354">Original</text>

      <!-- Sepia - active -->
      <rect x="558" y="126" width="124" height="24" rx="5" fill="rgba(161,78,27,0.3)" stroke="#a14e1b" stroke-width="0.5"/>
      <text x="575" y="142" fill="#d47b3f">Sepia</text>
      <circle cx="668" cy="138" r="3" fill="#d47b3f"/>

      <!-- B&W -->
      <rect x="558" y="154" width="124" height="24" rx="5" fill="rgba(255,255,255,0.03)"/>
      <text x="575" y="170" fill="#4d4354">Black &amp; White</text>

      <!-- Vintage -->
      <rect x="558" y="182" width="124" height="24" rx="5" fill="rgba(255,255,255,0.03)"/>
      <text x="575" y="198" fill="#4d4354">Vintage</text>

      <!-- Warm -->
      <rect x="558" y="210" width="124" height="24" rx="5" fill="rgba(255,255,255,0.03)"/>
      <text x="575" y="226" fill="#4d4354">Warm</text>

      <!-- Cool -->
      <rect x="558" y="238" width="124" height="24" rx="5" fill="rgba(255,255,255,0.03)"/>
      <text x="575" y="254" fill="#4d4354">Cool</text>

      <!-- HDR -->
      <rect x="558" y="266" width="124" height="24" rx="5" fill="rgba(255,255,255,0.03)"/>
      <text x="575" y="282" fill="#4d4354">HDR</text>

      <!-- Cinematic -->
      <rect x="558" y="294" width="124" height="24" rx="5" fill="rgba(255,255,255,0.03)"/>
      <text x="575" y="310" fill="#4d4354">Cinematic</text>

      <!-- Noir -->
      <rect x="558" y="322" width="124" height="24" rx="5" fill="rgba(255,255,255,0.03)"/>
      <text x="575" y="338" fill="#4d4354">Noir</text>
    </g>

    <!-- Main image area - split view (before/after) -->
    <!-- Before: original sunset -->
    <rect x="690" y="52" width="215" height="280" fill="url(#skyG)"/>
    <!-- Sun -->
    <circle cx="800" cy="230" r="40" fill="#ff6b35" opacity="0.9" filter="url(#g2)"/>
    <!-- Horizon reflection -->
    <rect x="690" y="240" width="215" height="92" fill="#1a0040" opacity="0.7"/>
    <!-- Reflection shimmer -->
    <rect x="690" y="240" width="215" height="2" fill="#ff6b35" opacity="0.4"/>

    <!-- Divider line -->
    <line x1="905" y1="52" x2="905" y2="332" stroke="#ddb7ff" stroke-width="2"/>
    <circle cx="905" cy="192" r="10" fill="#1a1040" stroke="#ddb7ff" stroke-width="1.5"/>
    <text x="905" y="197" font-size="9" fill="#ddb7ff" text-anchor="middle" font-weight="700">⟷</text>
    <text x="820" y="340" font-size="9" fill="#6b5b7a" text-anchor="middle">BEFORE</text>
    <text x="990" y="340" font-size="9" fill="#6b5b7a" text-anchor="middle">AFTER (SEPIA)</text>

    <!-- After: sepia version -->
    <rect x="905" y="52" width="215" height="280" fill="url(#sepiaG)" opacity="0.9"/>
    <!-- Sepia sun -->
    <circle cx="1015" cy="230" r="40" fill="#8b4513" opacity="0.7" filter="url(#g2)"/>
    <!-- Sepia horizon -->
    <rect x="905" y="240" width="215" height="92" fill="#3d1a00" opacity="0.7"/>

    <!-- Bottom controls -->
    <rect x="690" y="340" width="430" height="62" fill="#0f0b1f"/>
    <!-- Strength slider -->
    <text x="700" y="358" font-size="9" fill="#6b5b7a" font-weight="600">FILTER STRENGTH</text>
    <rect x="700" y="363" width="250" height="4" rx="2" fill="rgba(255,255,255,0.1)"/>
    <rect x="700" y="363" width="187" height="4" rx="2" fill="url(#aG)"/>
    <circle cx="887" cy="365" r="6" fill="#ddb7ff" stroke="#1a1040" stroke-width="1.5"/>
    <text x="960" y="368" font-size="9" fill="#ddb7ff" font-weight="700">75%</text>

    <!-- Download button -->
    <rect x="990" y="348" width="120" height="28" rx="7" fill="url(#bG)"/>
    <text x="1050" y="366" font-size="10" fill="white" text-anchor="middle" font-weight="700">Download</text>
  </g>

  <!-- Laptop base -->
  <rect x="538" y="436" width="594" height="14" rx="3" fill="#120d26" stroke="rgba(139,92,246,0.2)" stroke-width="1"/>
  <rect x="700" y="448" width="270" height="6" rx="3" fill="#0d0820"/>

  <!-- Bottom label -->
  <text x="600" y="595" font-size="13" fill="#4d4354" text-anchor="middle">Apply stunning photo filters in seconds · 100% free · No upload required</text>
</svg>
