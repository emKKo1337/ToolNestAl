<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <radialGradient id="gC" cx="50%" cy="40%" r="60%"><stop offset="0%" stop-color="#5b21b6" stop-opacity="0.22"/><stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="bG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#5b21b6" flood-opacity="0.35"/></filter>
  </defs>
  <rect width="900" height="500" fill="url(#bg)"/>
  <ellipse cx="450" cy="250" rx="500" ry="330" fill="url(#gC)"/>

  <text x="450" y="38" text-anchor="middle" font-size="20" font-weight="900" fill="url(#aG)">How Each Platform Reads Open Graph Tags</text>
  <text x="450" y="57" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.4)">Same og: tags — different card layouts across Facebook, LinkedIn, Discord, WhatsApp and Twitter/X</text>

  <!-- Facebook card -->
  <rect x="28" y="72" width="195" height="188" rx="10" fill="rgba(24,119,242,0.1)" stroke="rgba(24,119,242,0.35)" stroke-width="1.5"/>
  <text x="126" y="90" text-anchor="middle" font-size="10" font-weight="800" fill="#60a5fa">f  Facebook</text>
  <rect x="38" y="96" width="175" height="90" rx="5" fill="rgba(124,58,237,0.18)"/>
  <text x="126" y="148" text-anchor="middle" font-size="10" fill="rgba(167,139,250,0.3)">og:image</text>
  <text x="38" y="204" font-size="7.5" fill="rgba(255,255,255,0.3)">YOURSITE.COM</text>
  <text x="38" y="216" font-size="9" font-weight="700" fill="rgba(255,255,255,0.8)">Page Title Here</text>
  <text x="38" y="229" font-size="7.5" fill="rgba(255,255,255,0.45)">Short description shown below the title…</text>
  <text x="38" y="248" font-size="7.5" fill="rgba(96,165,250,0.6)">Reads: og:title · og:description · og:image · og:url</text>

  <!-- LinkedIn card -->
  <rect x="235" y="72" width="195" height="188" rx="10" fill="rgba(10,102,194,0.12)" stroke="rgba(10,102,194,0.35)" stroke-width="1.5"/>
  <text x="333" y="90" text-anchor="middle" font-size="10" font-weight="800" fill="#60a5fa">in  LinkedIn</text>
  <rect x="245" y="96" width="175" height="90" rx="5" fill="rgba(37,99,235,0.18)"/>
  <text x="333" y="148" text-anchor="middle" font-size="10" fill="rgba(147,197,253,0.3)">og:image</text>
  <text x="245" y="204" font-size="7.5" fill="rgba(255,255,255,0.3)">yoursite.com</text>
  <text x="245" y="216" font-size="9" font-weight="700" fill="rgba(255,255,255,0.8)">Page Title Here</text>
  <text x="245" y="229" font-size="7.5" fill="rgba(255,255,255,0.45)">Short description shown in the card preview…</text>
  <text x="245" y="248" font-size="7.5" fill="rgba(96,165,250,0.6)">Reads: og:title · og:description · og:image · og:url</text>

  <!-- Twitter/X card -->
  <rect x="442" y="72" width="195" height="188" rx="10" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
  <text x="540" y="90" text-anchor="middle" font-size="10" font-weight="800" fill="rgba(255,255,255,0.7)">𝕏  Twitter / X</text>
  <rect x="452" y="96" width="175" height="90" rx="5" fill="rgba(255,255,255,0.08)"/>
  <text x="540" y="148" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.2)">twitter:image</text>
  <text x="452" y="204" font-size="7.5" fill="rgba(255,255,255,0.3)">yoursite.com</text>
  <text x="452" y="216" font-size="9" font-weight="700" fill="rgba(255,255,255,0.8)">Page Title Here</text>
  <text x="452" y="229" font-size="7.5" fill="rgba(255,255,255,0.45)">Description from twitter:description tag…</text>
  <text x="452" y="248" font-size="7.5" fill="rgba(167,139,250,0.6)">Reads: twitter:* first, falls back to og:*</text>

  <!-- Discord card -->
  <rect x="649" y="72" width="220" height="188" rx="10" fill="rgba(88,101,242,0.12)" stroke="rgba(88,101,242,0.35)" stroke-width="1.5"/>
  <text x="759" y="90" text-anchor="middle" font-size="10" font-weight="800" fill="#818cf8">⊕ Discord</text>
  <rect x="659" y="96" width="200" height="60" rx="5" fill="rgba(88,101,242,0.2)"/>
  <text x="759" y="130" text-anchor="middle" font-size="9" fill="rgba(199,210,254,0.3)">og:image (large card)</text>
  <text x="659" y="172" font-size="9" font-weight="700" fill="rgba(199,210,254,0.85)">Page Title Here</text>
  <text x="659" y="186" font-size="7.5" fill="rgba(199,210,254,0.5)">Short description from og:description…</text>
  <text x="659" y="200" font-size="7.5" fill="rgba(199,210,254,0.35)">yoursite.com</text>
  <text x="659" y="248" font-size="7.5" fill="rgba(167,139,250,0.6)">Reads: og:title · og:description · og:image · og:url</text>

  <!-- Tag reference table -->
  <rect x="28" y="276" width="840" height="196" rx="10" fill="rgba(255,255,255,0.025)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="44" y="297" font-size="11" font-weight="700" fill="rgba(255,255,255,0.6)" letter-spacing="1">ESSENTIAL OG TAGS — COPY &amp; PASTE</text>

  <!-- Tag rows -->
  <g font-size="9">
    <!-- Headers -->
    <text x="44" y="318" font-weight="700" fill="rgba(167,139,250,0.7)">Tag</text>
    <text x="290" y="318" font-weight="700" fill="rgba(167,139,250,0.7)">Required</text>
    <text x="380" y="318" font-weight="700" fill="rgba(167,139,250,0.7)">Recommended Value</text>

    <line x1="36" y1="323" x2="860" y2="323" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>

    <rect x="36" y="327" width="824" height="22" rx="4" fill="rgba(124,58,237,0.06)"/>
    <text x="44" y="342" font-family="monospace" fill="rgba(167,139,250,0.9)">og:title</text>
    <text x="290" y="342" fill="rgba(239,68,68,0.85)" font-weight="700">✓ Required</text>
    <text x="380" y="342" fill="rgba(255,255,255,0.55)">Your page title — 60 characters max for clean display</text>

    <rect x="36" y="351" width="824" height="22" rx="4" fill="rgba(255,255,255,0.02)"/>
    <text x="44" y="366" font-family="monospace" fill="rgba(167,139,250,0.9)">og:description</text>
    <text x="290" y="366" fill="rgba(239,68,68,0.85)" font-weight="700">✓ Required</text>
    <text x="380" y="366" fill="rgba(255,255,255,0.55)">2–3 sentence summary — 155 characters max</text>

    <rect x="36" y="375" width="824" height="22" rx="4" fill="rgba(124,58,237,0.06)"/>
    <text x="44" y="390" font-family="monospace" fill="rgba(167,139,250,0.9)">og:image</text>
    <text x="290" y="390" fill="rgba(239,68,68,0.85)" font-weight="700">✓ Required</text>
    <text x="380" y="390" fill="rgba(255,255,255,0.55)">Absolute HTTPS URL — 1200×630px, under 8 MB</text>

    <rect x="36" y="399" width="824" height="22" rx="4" fill="rgba(255,255,255,0.02)"/>
    <text x="44" y="414" font-family="monospace" fill="rgba(167,139,250,0.9)">og:url</text>
    <text x="290" y="414" fill="rgba(239,68,68,0.85)" font-weight="700">✓ Required</text>
    <text x="380" y="414" fill="rgba(255,255,255,0.55)">Canonical URL of the page — must match rel="canonical"</text>

    <rect x="36" y="423" width="824" height="22" rx="4" fill="rgba(124,58,237,0.06)"/>
    <text x="44" y="438" font-family="monospace" fill="rgba(167,139,250,0.7)">og:type</text>
    <text x="290" y="438" fill="rgba(251,191,36,0.8)">⚠ Recommended</text>
    <text x="380" y="438" fill="rgba(255,255,255,0.55)">website, article, product, video.movie, music.song</text>

    <rect x="36" y="447" width="824" height="22" rx="4" fill="rgba(255,255,255,0.02)"/>
    <text x="44" y="462" font-family="monospace" fill="rgba(167,139,250,0.7)">og:site_name</text>
    <text x="290" y="462" fill="rgba(251,191,36,0.8)">⚠ Recommended</text>
    <text x="380" y="462" fill="rgba(255,255,255,0.55)">Your brand or website name — shown under the title</text>
  </g>

  <text x="450" y="492" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.25)">toolnestai.net/seo-tools/open-graph-generator</text>
</svg>
