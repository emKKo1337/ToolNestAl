    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="bG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient>
  </defs>
  <rect width="900" height="460" fill="url(#bg)"/>
  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="900" fill="url(#aG)">Choosing the Right Quality Setting for PNG to JPG</text>
  <text x="450" y="56" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.38)">Quality impacts file size dramatically — artifacts appear at the low end</text>
  <rect x="28" y="74" width="844" height="180" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="450" y="96" text-anchor="middle" font-size="10" font-weight="700" fill="rgba(255,255,255,0.3)">WHAT YOU GET AT EACH QUALITY LEVEL</text>
  <g font-size="9">
    <rect x="48" y="108" width="96" height="96" rx="6" fill="rgba(239,68,68,0.1)" stroke="rgba(239,68,68,0.2)" stroke-width="1"/>
    <text x="96" y="130" text-anchor="middle" font-weight="700" fill="rgba(239,68,68,0.75)">50%</text>
    <text x="96" y="150" text-anchor="middle" fill="rgba(255,255,255,0.45)">Very small</text>
    <text x="96" y="168" text-anchor="middle" fill="rgba(255,255,255,0.35)">file size</text>
    <text x="96" y="188" text-anchor="middle" fill="rgba(239,68,68,0.6)">Obvious</text>
    <text x="96" y="200" text-anchor="middle" fill="rgba(239,68,68,0.6)">artifacts</text>
    <rect x="168" y="108" width="96" height="96" rx="6" fill="rgba(251,191,36,0.08)" stroke="rgba(251,191,36,0.18)" stroke-width="1"/>
    <text x="216" y="130" text-anchor="middle" font-weight="700" fill="rgba(251,191,36,0.75)">65%</text>
    <text x="216" y="150" text-anchor="middle" fill="rgba(255,255,255,0.45)">Small file</text>
    <text x="216" y="168" text-anchor="middle" fill="rgba(255,255,255,0.35)">good size</text>
    <text x="216" y="188" text-anchor="middle" fill="rgba(251,191,36,0.6)">Noticeable</text>
    <text x="216" y="200" text-anchor="middle" fill="rgba(251,191,36,0.6)">artifacts</text>
    <rect x="288" y="108" width="96" height="96" rx="6" fill="rgba(167,139,250,0.1)" stroke="rgba(167,139,250,0.25)" stroke-width="1.5"/>
    <text x="336" y="130" text-anchor="middle" font-weight="700" fill="#a78bfa">75%</text>
    <text x="336" y="150" text-anchor="middle" fill="rgba(255,255,255,0.55)">Good size</text>
    <text x="336" y="168" text-anchor="middle" fill="rgba(255,255,255,0.45)">reduction</text>
    <text x="336" y="188" text-anchor="middle" fill="rgba(52,211,153,0.65)">Minimal</text>
    <text x="336" y="200" text-anchor="middle" fill="rgba(52,211,153,0.65)">artifacts</text>
    <rect x="408" y="108" width="96" height="96" rx="6" fill="rgba(167,139,250,0.12)" stroke="rgba(167,139,250,0.3)" stroke-width="2"/>
    <text x="456" y="130" text-anchor="middle" font-weight="700" fill="#a78bfa">82%</text>
    <text x="456" y="150" text-anchor="middle" fill="rgba(255,255,255,0.6)">Best balance</text>
    <text x="456" y="168" text-anchor="middle" fill="rgba(167,139,250,0.7)">RECOMMENDED</text>
    <text x="456" y="188" text-anchor="middle" fill="rgba(52,211,153,0.75)">Invisible</text>
    <text x="456" y="200" text-anchor="middle" fill="rgba(52,211,153,0.75)">artifacts</text>
    <rect x="528" y="108" width="96" height="96" rx="6" fill="rgba(52,211,153,0.06)" stroke="rgba(52,211,153,0.18)" stroke-width="1"/>
    <text x="576" y="130" text-anchor="middle" font-weight="700" fill="rgba(52,211,153,0.75)">90%</text>
    <text x="576" y="150" text-anchor="middle" fill="rgba(255,255,255,0.45)">High quality</text>
    <text x="576" y="168" text-anchor="middle" fill="rgba(255,255,255,0.35)">larger file</text>
    <text x="576" y="188" text-anchor="middle" fill="rgba(52,211,153,0.6)">No visible</text>
    <text x="576" y="200" text-anchor="middle" fill="rgba(52,211,153,0.6)">artifacts</text>
    <rect x="648" y="108" width="96" height="96" rx="6" fill="rgba(103,232,249,0.06)" stroke="rgba(103,232,249,0.18)" stroke-width="1"/>
    <text x="696" y="130" text-anchor="middle" font-weight="700" fill="rgba(103,232,249,0.75)">95%</text>
    <text x="696" y="150" text-anchor="middle" fill="rgba(255,255,255,0.4)">Near-original</text>
    <text x="696" y="168" text-anchor="middle" fill="rgba(255,255,255,0.3)">large file</text>
    <text x="696" y="188" text-anchor="middle" fill="rgba(103,232,249,0.6)">Archival</text>
    <text x="696" y="200" text-anchor="middle" fill="rgba(103,232,249,0.6)">quality</text>
  </g>
  <rect x="28" y="268" width="844" height="100" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(124,58,237,0.15)" stroke-width="1"/>
  <text x="450" y="290" text-anchor="middle" font-size="10" font-weight="700" fill="rgba(167,139,250,0.85)">IMAGE TYPE AFFECTS RESULTS</text>
  <text x="450" y="312" text-anchor="middle" font-size="9.5" fill="rgba(255,255,255,0.55)">Photographs with natural textures compress very well with low artifact risk at 80-85% quality.</text>
  <text x="450" y="332" text-anchor="middle" font-size="9.5" fill="rgba(255,255,255,0.55)">Screenshots and graphics with sharp text or hard edges show artifacts more readily at lower settings.</text>
  <text x="450" y="350" text-anchor="middle" font-size="9.5" fill="rgba(255,255,255,0.4)">If you're converting a logo or UI screenshot, use higher quality (85%+) to minimize artifacts on edges.</text>
  <rect x="28" y="380" width="844" height="60" rx="8" fill="rgba(251,191,36,0.05)" stroke="rgba(251,191,36,0.15)" stroke-width="1"/>
  <text x="450" y="402" text-anchor="middle" font-size="9.5" font-weight="700" fill="rgba(251,191,36,0.8)">USE THE PREVIEW</text>
  <text x="450" y="424" text-anchor="middle" font-size="9.5" fill="rgba(255,255,255,0.5)">Always use the side-by-side preview before downloading — quality settings interact differently with each image.</text>
  <text x="450" y="450" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.2)">toolnestai.net/image-tools/png-to-jpg</text>
