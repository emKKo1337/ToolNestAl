  <text x="60" y="106" font-size="13" fill="rgba(255,255,255,0.35)">Developer Tools › JSON Formatter</text>
  <text x="60" y="178" font-size="50" font-weight="900" fill="url(#aG)" filter="url(#glow)">JSON</text>
  <text x="60" y="236" font-size="50" font-weight="900" fill="url(#aG)" filter="url(#glow)">Formatter</text>
  <text x="60" y="290" font-size="17" fill="rgba(255,255,255,0.6)">Format · Validate · Minify · Beautify</text>

  <!-- Feature bullets -->
  <g font-size="11" fill="rgba(255,255,255,0.55)">
    <text x="60" y="330">✦  Syntax highlighting (keys, strings, numbers, booleans)</text>
    <text x="60" y="352">✦  Instant error detection with line numbers</text>
    <text x="60" y="374">✦  Collapsible tree view for large JSON</text>
    <text x="60" y="396">✦  One-click minify for APIs and config files</text>
    <text x="60" y="418">✦  Copy formatted output to clipboard</text>
    <text x="60" y="440">✦  Works entirely in your browser — no server</text>
  </g>

  <text x="60" y="610" font-size="14" fill="rgba(255,255,255,0.25)">toolnestai.net/developer-tools/json-formatter</text>

  <!-- Right laptop -->
