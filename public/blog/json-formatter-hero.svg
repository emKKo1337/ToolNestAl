    <text x="708" y="365" fill="rgba(255,255,255,0.5)">}</text>
    <text x="700" y="380" fill="rgba(255,255,255,0.5)">],</text>
    <text x="700" y="395" fill="rgba(167,139,250,0.85)">"total"</text><text x="742" y="395" fill="rgba(255,255,255,0.5)">: </text><text x="752" y="395" fill="rgba(251,191,36,0.85)">2</text><text x="758" y="395" fill="rgba(255,255,255,0.5)">,</text>
    <text x="700" y="410" fill="rgba(167,139,250,0.85)">"page"</text><text x="736" y="410" fill="rgba(255,255,255,0.5)">: </text><text x="746" y="410" fill="rgba(251,191,36,0.85)">1</text>
    <text x="692" y="425" fill="rgba(255,255,255,0.5)">},</text>
