<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Segoe UI',sans-serif">
  <defs>
    <radialGradient id="bg" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#0f0825"/>
      <stop offset="100%" stop-color="#05030d"/>
    </radialGradient>
    <radialGradient id="g1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5b21b6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="lapG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1040"/>
      <stop offset="100%" stop-color="#0d0824"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="900" height="560" fill="url(#bg)"/>
  <ellipse cx="280" cy="200" rx="300" ry="200" fill="url(#g1)"/>

  <g filter="url(#shadow)">
    <rect x="130" y="40" width="640" height="420" rx="14" fill="url(#lapG)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    <rect x="130" y="40" width="640" height="44" rx="14" fill="#1e1535"/>
    <rect x="130" y="68" width="640" height="16" fill="#1e1535"/>
    <circle cx="655" cy="62" r="7" fill="#ff5f57"/>
    <circle cx="675" cy="62" r="7" fill="#febc2e"/>
    <circle cx="695" cy="62" r="7" fill="#28c840"/>
    <rect x="230" y="53" width="420" height="18" rx="9" fill="#120e2a"/>
    <text x="440" y="66" font-size="10" fill="#5a4d7a" text-anchor="middle">toolnestai.net/developer-tools/timestamp-converter</text>
    <rect x="142" y="84" width="616" height="364" rx="0" fill="#0d0a1e"/>

    <text x="450" y="112" font-size="18" font-weight="800" fill="#e2e2e2" text-anchor="middle">Timestamp Converter</text>
    <text x="450" y="130" font-size="11" fill="#7a6d84" text-anchor="middle">Convert Unix timestamps to and from human-readable dates</text>

    <!-- Unix timestamp input -->
    <text x="164" y="158" font-size="10" font-weight="700" fill="#a78bfa" letter-spacing="0.08em">UNIX TIMESTAMP</text>
    <rect x="152" y="164" width="320" height="38" rx="8" fill="#130f28" stroke="rgba(167,139,250,0.3)" stroke-width="1.5"/>
    <text x="172" y="188" font-size="16" font-weight="600" fill="#e2e2e2" font-family="monospace">1753524000</text>
    <text x="720" y="188" font-size="11" fill="#4d4354" text-anchor="end">seconds</text>

    <!-- Now button -->
    <rect x="484" y="164" width="70" height="38" rx="8" fill="rgba(167,139,250,0.12)" stroke="rgba(167,139,250,0.3)" stroke-width="1"/>
    <text x="519" y="188" font-size="11" font-weight="600" fill="#a78bfa" text-anchor="middle">Now</text>
    <rect x="562" y="164" width="96" height="38" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="610" y="188" font-size="11" font-weight="600" fill="#7a6d84" text-anchor="middle">Milliseconds</text>

    <!-- Convert button -->
    <rect x="668" y="164" width="90" height="38" rx="8" fill="url(#aG)"/>
    <text x="713" y="188" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">⚡ Convert</text>

    <!-- Results grid -->
    <text x="164" y="228" font-size="10" font-weight="700" fill="#4cd7f6" letter-spacing="0.08em">CONVERTED FORMATS</text>

    <!-- UTC -->
    <rect x="152" y="236" width="300" height="48" rx="8" fill="#130f28" stroke="rgba(76,215,246,0.2)" stroke-width="1"/>
    <text x="164" y="256" font-size="9" font-weight="700" fill="#4cd7f6" letter-spacing="0.06em">UTC</text>
    <text x="164" y="272" font-size="10" fill="#e2e2e2" font-family="monospace">2025-07-26 10:00:00 UTC</text>
    <rect x="430" y="253" width="40" height="24" rx="6" fill="rgba(76,215,246,0.12)"/>
    <text x="450" y="269" font-size="10" fill="#4cd7f6" text-anchor="middle">Copy</text>

    <!-- ISO 8601 -->
    <rect x="152" y="292" width="300" height="48" rx="8" fill="#130f28" stroke="rgba(167,139,250,0.2)" stroke-width="1"/>
    <text x="164" y="312" font-size="9" font-weight="700" fill="#a78bfa" letter-spacing="0.06em">ISO 8601</text>
    <text x="164" y="328" font-size="10" fill="#e2e2e2" font-family="monospace">2025-07-26T10:00:00.000Z</text>
    <rect x="430" y="309" width="40" height="24" rx="6" fill="rgba(167,139,250,0.12)"/>
    <text x="450" y="325" font-size="10" fill="#a78bfa" text-anchor="middle">Copy</text>

    <!-- Local time -->
    <rect x="152" y="348" width="300" height="48" rx="8" fill="#130f28" stroke="rgba(251,191,36,0.2)" stroke-width="1"/>
    <text x="164" y="368" font-size="9" font-weight="700" fill="#fbbf24" letter-spacing="0.06em">LOCAL (Europe/Berlin)</text>
    <text x="164" y="384" font-size="10" fill="#e2e2e2" font-family="monospace">2025-07-26 12:00:00 CEST</text>
    <rect x="430" y="365" width="40" height="24" rx="6" fill="rgba(251,191,36,0.12)"/>
    <text x="450" y="381" font-size="10" fill="#fbbf24" text-anchor="middle">Copy</text>

    <!-- Right panel: reverse lookup -->
    <rect x="480" y="236" width="278" height="160" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="496" y="256" font-size="10" font-weight="700" fill="#4d4354" letter-spacing="0.08em">RELATIVE TIME</text>
    <text x="496" y="278" font-size="20" font-weight="700" fill="#e2e2e2">1 year, 1 day</text>
    <text x="496" y="298" font-size="11" fill="#7a6d84">from now (2026-08-17)</text>
    <line x1="496" y1="314" x2="742" y2="314" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="496" y="332" font-size="10" font-weight="700" fill="#4d4354" letter-spacing="0.08em">DAY OF WEEK</text>
    <text x="496" y="352" font-size="16" font-weight="700" fill="#a78bfa">Saturday</text>
    <text x="496" y="370" font-size="10" fill="#5a4d7a">Week 30 of 2025</text>

    <!-- Date to timestamp section -->
    <text x="164" y="420" font-size="10" font-weight="700" fill="#34d399" letter-spacing="0.08em">DATE TO TIMESTAMP</text>
    <rect x="152" y="428" width="250" height="34" rx="8" fill="#130f28" stroke="rgba(52,211,153,0.2)" stroke-width="1"/>
    <text x="164" y="449" font-size="11" fill="#e2e2e2" font-family="monospace">2026-12-31  00:00:00 UTC</text>
    <rect x="410" y="428" width="90" height="34" rx="8" fill="rgba(52,211,153,0.12)" stroke="rgba(52,211,153,0.3)" stroke-width="1"/>
    <text x="455" y="449" font-size="11" font-weight="600" fill="#34d399" text-anchor="middle">Convert ↑</text>
  </g>

  <rect x="90" y="460" width="720" height="12" rx="6" fill="#1a1535" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="360" y="468" width="180" height="6" rx="3" fill="#120e2a"/>
</svg>
