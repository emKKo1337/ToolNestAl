<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <radialGradient id="gL" cx="10%" cy="50%" r="60%"><stop offset="0%" stop-color="#5b21b6" stop-opacity="0.35"/><stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/></radialGradient>
    <radialGradient id="gR" cx="90%" cy="50%" r="60%"><stop offset="0%" stop-color="#0e7490" stop-opacity="0.2"/><stop offset="100%" stop-color="#0e7490" stop-opacity="0"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="bG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient>
    <linearGradient id="lapG" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1a1040"/><stop offset="100%" stop-color="#0d0824"/></linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#5b21b6" flood-opacity="0.45"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <ellipse cx="120" cy="337" rx="700" ry="550" fill="url(#gL)"/>
  <ellipse cx="1080" cy="337" rx="700" ry="550" fill="url(#gR)"/>

  <text x="600" y="42" text-anchor="middle" font-size="13" font-weight="700" fill="url(#aG)" filter="url(#glow)">ToolNest AI — Calculators</text>
  <text x="600" y="68" text-anchor="middle" font-size="34" font-weight="900" fill="url(#aG)" filter="url(#glow)">BMI Calculator</text>
  <text x="600" y="90" text-anchor="middle" font-size="13" fill="rgba(255,255,255,0.35)">Metric &amp; imperial units — WHO standard categories, free, instant</text>

  <rect x="60" y="108" width="1080" height="542" rx="18" fill="url(#lapG)" stroke="rgba(124,58,237,0.35)" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="60" y="108" width="1080" height="38" rx="18" fill="rgba(255,255,255,0.05)"/>
  <rect x="60" y="128" width="1080" height="18" fill="rgba(255,255,255,0.02)"/>
  <circle cx="90" cy="127" r="7" fill="rgba(239,68,68,0.65)"/>
  <circle cx="114" cy="127" r="7" fill="rgba(251,191,36,0.65)"/>
  <circle cx="138" cy="127" r="7" fill="rgba(34,197,94,0.65)"/>
  <text x="600" y="132" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.2)">toolnestai.net/calculators/bmi-calculator</text>

  <!-- Unit toggle -->
  <g font-size="11" text-anchor="middle">
    <rect x="80" y="158" width="110" height="28" rx="6" fill="url(#bG)"/>
    <text x="135" y="176" fill="#fff" font-weight="700">Metric</text>
    <rect x="198" y="158" width="110" height="28" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="253" y="176" fill="rgba(255,255,255,0.4)">Imperial</text>
  </g>

  <!-- Inputs -->
  <text x="88" y="212" font-size="9" font-weight="700" fill="rgba(255,255,255,0.28)">HEIGHT</text>
  <rect x="80" y="218" width="330" height="42" rx="9" fill="rgba(0,0,0,0.55)" stroke="rgba(124,58,237,0.45)" stroke-width="1.5"/>
  <text x="245" y="245" text-anchor="middle" font-family="monospace" font-size="15" fill="rgba(167,139,250,0.92)">175 cm</text>

  <text x="430" y="212" font-size="9" font-weight="700" fill="rgba(255,255,255,0.28)">WEIGHT</text>
  <rect x="422" y="218" width="330" height="42" rx="9" fill="rgba(0,0,0,0.4)" stroke="rgba(103,232,249,0.3)" stroke-width="1.5"/>
  <text x="587" y="245" text-anchor="middle" font-family="monospace" font-size="15" fill="rgba(103,232,249,0.85)">72 kg</text>

  <rect x="772" y="218" width="200" height="42" rx="9" fill="url(#bG)" filter="url(#sh)"/>
  <text x="872" y="244" text-anchor="middle" font-size="14" font-weight="900" fill="#fff">Calculate BMI</text>

  <!-- Big result -->
  <rect x="80" y="280" width="1040" height="100" rx="12" fill="rgba(52,211,153,0.1)" stroke="rgba(52,211,153,0.25)" stroke-width="1.5"/>
  <text x="360" y="336" text-anchor="middle" font-size="50" font-weight="900" fill="#34d399">23.5</text>
  <text x="360" y="360" text-anchor="middle" font-size="13" fill="rgba(255,255,255,0.4)">BMI value</text>
  <line x1="500" y1="298" x2="500" y2="362" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="700" y="330" text-anchor="middle" font-size="24" font-weight="900" fill="#6ee7b7">Normal weight</text>
  <text x="700" y="352" text-anchor="middle" font-size="12" fill="rgba(255,255,255,0.45)">WHO healthy range: 18.5 – 24.9</text>
  <text x="700" y="368" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.3)">Healthy weight range for 175cm: 56.7 – 76.3 kg</text>

  <!-- Scale bar -->
  <text x="88" y="410" font-size="9" font-weight="700" fill="rgba(255,255,255,0.28)">BMI SCALE (WHO STANDARD)</text>
  <rect x="80" y="416" width="1040" height="36" rx="6" fill="rgba(59,130,246,0.5)"/>
  <rect x="80" y="416" width="236" height="36" fill="rgba(59,130,246,0.7)"/>
  <rect x="316" y="416" width="298" height="36" fill="rgba(52,211,153,0.7)"/>
  <rect x="614" y="416" width="236" height="36" fill="rgba(251,191,36,0.7)"/>
  <rect x="850" y="416" width="270" height="36" fill="rgba(239,68,68,0.7)"/>
  <circle cx="465" cy="434" r="9" fill="#fff" stroke="#0a0118" stroke-width="3"/>
  <text x="465" y="464" text-anchor="middle" font-size="10" font-weight="700" fill="rgba(255,255,255,0.7)">Your BMI: 23.5</text>
  <g font-size="10" text-anchor="middle" fill="rgba(255,255,255,0.6)">
    <text x="198" y="440">&lt; 18.5</text>
    <text x="465" y="440">18.5 – 24.9</text>
    <text x="732" y="440">25.0 – 29.9</text>
    <text x="985" y="440">≥ 30.0</text>
  </g>
  <g font-size="9" text-anchor="middle" fill="rgba(255,255,255,0.4)">
    <text x="198" y="490">Underweight</text>
    <text x="465" y="490">Normal weight</text>
    <text x="732" y="490">Overweight</text>
    <text x="985" y="490">Obese</text>
  </g>

  <!-- Limitations panel -->
  <text x="88" y="524" font-size="9" font-weight="700" fill="rgba(255,255,255,0.28)">IMPORTANT LIMITATIONS</text>
  <rect x="80" y="530" width="1040" height="98" rx="10" fill="rgba(251,191,36,0.05)" stroke="rgba(251,191,36,0.18)" stroke-width="1"/>
  <text x="98" y="552" font-size="10.5" fill="rgba(255,255,255,0.6)">⚠ BMI does not distinguish muscle mass from fat mass — athletes and bodybuilders are often</text>
  <text x="98" y="570" font-size="10.5" fill="rgba(255,255,255,0.6)">misclassified as "overweight" despite having low body fat percentages.</text>
  <text x="98" y="592" font-size="10.5" fill="rgba(255,255,255,0.6)">⚠ BMI does not account for fat distribution, age, sex, or ethnicity — all of which affect health risk</text>
  <text x="98" y="610" font-size="10.5" fill="rgba(255,255,255,0.6)">at a given BMI value differently.</text>

  <rect x="48" y="650" width="1104" height="16" rx="5" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="460" y="664" width="280" height="10" rx="5" fill="rgba(255,255,255,0.025)"/>
</svg>
