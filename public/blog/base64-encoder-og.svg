<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="30%" cy="40%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <radialGradient id="gL" cx="15%" cy="50%" r="55%"><stop offset="0%" stop-color="#5b21b6" stop-opacity="0.45"/><stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/></radialGradient>
    <radialGradient id="gR" cx="85%" cy="50%" r="55%"><stop offset="0%" stop-color="#0e7490" stop-opacity="0.28"/><stop offset="100%" stop-color="#0e7490" stop-opacity="0"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="bG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient>
    <linearGradient id="lapG" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1a1040"/><stop offset="100%" stop-color="#0d0824"/></linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#5b21b6" flood-opacity="0.5"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="180" cy="315" rx="600" ry="500" fill="url(#gL)"/>
  <ellipse cx="1020" cy="315" rx="600" ry="500" fill="url(#gR)"/>

  <!-- Left -->
  <text x="60" y="70" font-size="14" font-weight="700" fill="url(#aG)" filter="url(#glow)">ToolNest AI</text>
  <text x="60" y="106" font-size="13" fill="rgba(255,255,255,0.35)">Developer Tools › Base64 Encoder / Decoder</text>
  <text x="60" y="185" font-size="52" font-weight="900" fill="url(#aG)" filter="url(#glow)">Base64</text>
  <text x="60" y="245" font-size="52" font-weight="900" fill="url(#aG)" filter="url(#glow)">Encoder</text>
  <text x="60" y="300" font-size="18" fill="rgba(255,255,255,0.6)">Encode &amp; decode text, files and images</text>
  <text x="60" y="328" font-size="18" fill="rgba(255,255,255,0.6)">Base64URL · RFC 4648 · Free, client-side</text>

  <!-- Badges -->
  <rect x="60" y="358" width="110" height="52" rx="8" fill="rgba(124,58,237,0.2)" stroke="rgba(124,58,237,0.4)" stroke-width="1"/>
  <text x="115" y="382" text-anchor="middle" font-size="14" font-weight="900" fill="#a78bfa">RFC 4648</text>
  <text x="115" y="400" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">compliant</text>

  <rect x="182" y="358" width="110" height="52" rx="8" fill="rgba(14,116,144,0.15)" stroke="rgba(14,116,144,0.35)" stroke-width="1"/>
  <text x="237" y="382" text-anchor="middle" font-size="20" font-weight="900" fill="#67e8f9">64</text>
  <text x="237" y="400" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">safe ASCII chars</text>

  <rect x="304" y="358" width="110" height="52" rx="8" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
  <text x="359" y="382" text-anchor="middle" font-size="18" font-weight="900" fill="#34d399">+33%</text>
  <text x="359" y="400" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">size overhead</text>

  <rect x="426" y="358" width="110" height="52" rx="8" fill="rgba(251,191,36,0.1)" stroke="rgba(251,191,36,0.25)" stroke-width="1"/>
  <text x="481" y="382" text-anchor="middle" font-size="20" font-weight="900" fill="#fbbf24">Free</text>
  <text x="481" y="400" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">no account</text>

  <text x="60" y="560" font-size="14" fill="rgba(255,255,255,0.25)">toolnestai.net/developer-tools/base64-encoder</text>

  <!-- Right: card with encode/decode demo -->
  <rect x="630" y="60" width="530" height="490" rx="16" fill="url(#lapG)" stroke="rgba(124,58,237,0.3)" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="630" y="60" width="530" height="36" rx="16" fill="rgba(255,255,255,0.05)"/>
  <rect x="630" y="78" width="530" height="18" fill="rgba(255,255,255,0.02)"/>
  <circle cx="655" cy="78" r="6" fill="rgba(239,68,68,0.6)"/>
  <circle cx="675" cy="78" r="6" fill="rgba(251,191,36,0.6)"/>
  <circle cx="695" cy="78" r="6" fill="rgba(34,197,94,0.6)"/>

  <!-- Input -->
  <text x="648" y="120" font-size="8.5" font-weight="700" fill="rgba(255,255,255,0.3)">INPUT TEXT</text>
  <rect x="640" y="126" width="506" height="56" rx="8" fill="rgba(0,0,0,0.5)" stroke="rgba(124,58,237,0.4)" stroke-width="1.5"/>
  <text x="656" y="148" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.75)">Hello, World! Base64 encoding made easy.</text>
  <text x="656" y="168" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.75)">Supports UTF-8: © ™ € 🚀</text>

  <!-- Encode button -->
  <rect x="640" y="196" width="244" height="30" rx="8" fill="url(#bG)" filter="url(#sh)"/>
  <text x="762" y="215" text-anchor="middle" font-size="12" font-weight="900" fill="#fff">↓ Encode to Base64</text>
  <rect x="896" y="196" width="250" height="30" rx="8" fill="rgba(14,116,144,0.35)" stroke="rgba(14,116,144,0.6)" stroke-width="1"/>
  <text x="1021" y="215" text-anchor="middle" font-size="12" font-weight="800" fill="#67e8f9">↑ Decode from Base64</text>

  <!-- Output -->
  <text x="648" y="244" font-size="8.5" font-weight="700" fill="rgba(255,255,255,0.3)">BASE64 OUTPUT</text>
  <rect x="640" y="250" width="506" height="70" rx="8" fill="rgba(0,0,0,0.35)" stroke="rgba(52,211,153,0.3)" stroke-width="1.5"/>
  <text x="656" y="270" font-family="monospace" font-size="10" fill="rgba(52,211,153,0.85)">SGVsbG8sIFdvcmxkISBCYXNlNjQgZW5jb2Rpbmcg</text>
  <text x="656" y="288" font-family="monospace" font-size="10" fill="rgba(52,211,153,0.85)">bWFkZSBlYXN5LiBTdXBwb3J0cyBVVEYtODog</text>
  <text x="656" y="306" font-family="monospace" font-size="10" fill="rgba(52,211,153,0.85)">wqkgwq4g4oKsIPCfmoA=</text>

  <!-- Quick reference -->
  <text x="648" y="340" font-size="8.5" font-weight="700" fill="rgba(255,255,255,0.3)">WHERE BASE64 IS USED</text>
  <g font-size="9.5">
    <rect x="640" y="346" width="506" height="120" rx="7" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="656" y="368" fill="rgba(167,139,250,0.85)">🖼</text><text x="678" y="368" fill="rgba(255,255,255,0.55)"> CSS data URIs — inline images without extra requests</text>
    <text x="656" y="390" fill="rgba(103,232,249,0.85)">🔐</text><text x="678" y="390" fill="rgba(255,255,255,0.55)"> JWT tokens — header.payload.signature (Base64URL)</text>
    <text x="656" y="412" fill="rgba(52,211,153,0.85)">📧</text><text x="678" y="412" fill="rgba(255,255,255,0.55)"> MIME email — binary attachments over ASCII SMTP</text>
    <text x="656" y="434" fill="rgba(251,191,36,0.85)">📡</text><text x="678" y="434" fill="rgba(255,255,255,0.55)"> REST APIs — files and images in JSON payloads</text>
    <text x="656" y="456" fill="rgba(244,114,182,0.85)">🔑</text><text x="678" y="456" fill="rgba(255,255,255,0.55)"> HTTP Basic Auth — Authorization: Basic dXNlcjpwYXNz</text>
  </g>

  <!-- Laptop base -->
  <rect x="620" y="550" width="560" height="14" rx="4" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="760" y="562" width="260" height="8" rx="4" fill="rgba(255,255,255,0.03)"/>
</svg>
