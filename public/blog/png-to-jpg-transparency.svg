<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
  </defs>
  <rect width="900" height="460" fill="url(#bg)"/>
  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="900" fill="url(#aG)">The Transparency Trap: What Happens to Alpha in PNG to JPG</text>
  <text x="450" y="56" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.38)">JPG has no alpha channel — transparent pixels get a background fill</text>
  <rect x="28" y="72" width="260" height="200" rx="10" fill="rgba(52,211,153,0.06)" stroke="rgba(52,211,153,0.2)" stroke-width="1"/>
  <text x="158" y="94" text-anchor="middle" font-size="10" font-weight="700" fill="rgba(52,211,153,0.7)">PNG SOURCE</text>
  <!-- checkerboard transparency pattern -->
  <g fill="rgba(255,255,255,0.06)">
    <rect x="38" y="108" width="12" height="12"/><rect x="62" y="108" width="12" height="12"/><rect x="86" y="108" width="12" height="12"/>
    <rect x="50" y="120" width="12" height="12"/><rect x="74" y="120" width="12" height="12"/><rect x="98" y="120" width="12" height="12"/>
    <rect x="38" y="132" width="12" height="12"/><rect x="62" y="132" width="12" height="12"/><rect x="86" y="132" width="12" height="12"/>
  </g>
  <text x="158" y="160" text-anchor="middle" font-size="32" font-weight="900" fill="rgba(167,139,250,0.9)">LOGO</text>
  <text x="158" y="190" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.4)">Text on transparent background</text>
  <text x="158" y="210" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.3)">(alpha channel = 0)</text>
  <text x="158" y="258" text-anchor="middle" font-size="9" fill="rgba(52,211,153,0.6)">Transparent background</text>
  <text x="158" y="275" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.3)">Logo works on any bg color</text>
  <text x="308" y="178" text-anchor="middle" font-size="18" fill="rgba(255,255,255,0.25)">-&gt;</text>
  <rect x="328" y="72" width="260" height="200" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(239,68,68,0.2)" stroke-width="1"/>
  <text x="458" y="94" text-anchor="middle" font-size="10" font-weight="700" fill="rgba(239,68,68,0.7)">JPG OUTPUT (white bg)</text>
  <rect x="338" y="108" width="240" height="90" rx="4" fill="rgba(255,255,255,0.85)"/>
  <text x="458" y="162" text-anchor="middle" font-size="32" font-weight="900" fill="rgba(50,0,100,0.85)">LOGO</text>
  <text x="458" y="190" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.4)">White background applied</text>
  <text x="458" y="210" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.3)">(transparent filled with white)</text>
  <text x="458" y="258" text-anchor="middle" font-size="9" fill="rgba(239,68,68,0.7)">White box visible on dark pages</text>
  <text x="458" y="275" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.3)">Logo no longer flexible</text>
  <rect x="618" y="72" width="254" height="200" rx="10" fill="rgba(124,58,237,0.06)" stroke="rgba(124,58,237,0.2)" stroke-width="1"/>
  <text x="745" y="94" text-anchor="middle" font-size="10" font-weight="700" fill="rgba(167,139,250,0.7)">JPG OUTPUT (dark bg)</text>
  <rect x="628" y="108" width="234" height="90" rx="4" fill="rgba(15,10,30,0.9)"/>
  <text x="745" y="162" text-anchor="middle" font-size="32" font-weight="900" fill="rgba(200,180,255,0.9)">LOGO</text>
  <text x="745" y="190" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.4)">Dark background applied</text>
  <text x="745" y="210" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.3)">(custom bg color chosen)</text>
  <text x="745" y="258" text-anchor="middle" font-size="9" fill="rgba(52,211,153,0.6)">Works on dark pages</text>
  <text x="745" y="275" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.3)">Must match the target bg</text>
  <rect x="28" y="290" width="844" height="70" rx="8" fill="rgba(251,191,36,0.06)" stroke="rgba(251,191,36,0.18)" stroke-width="1"/>
  <text x="450" y="312" text-anchor="middle" font-size="10" font-weight="700" fill="rgba(251,191,36,0.85)">BEST PRACTICE</text>
  <text x="450" y="334" text-anchor="middle" font-size="9.5" fill="rgba(255,255,255,0.55)">Before converting a PNG with transparency to JPG: choose a background fill color that matches where the image will appear.</text>
  <text x="450" y="352" text-anchor="middle" font-size="9.5" fill="rgba(255,255,255,0.4)">If the image must work on multiple backgrounds — use PNG or WebP (which support transparency) instead of JPG.</text>
  <rect x="28" y="372" width="844" height="62" rx="8" fill="rgba(52,211,153,0.05)" stroke="rgba(52,211,153,0.15)" stroke-width="1"/>
  <text x="450" y="394" text-anchor="middle" font-size="10" font-weight="700" fill="rgba(52,211,153,0.75)">ALTERNATIVE: USE LOSSY WEBP</text>
  <text x="450" y="416" text-anchor="middle" font-size="9.5" fill="rgba(255,255,255,0.5)">Lossy WebP can match JPG file sizes while keeping the alpha channel intact — the best of both worlds for web images.</text>
  <text x="450" y="450" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.2)">toolnestai.net/image-tools/png-to-jpg</text>
</svg>
