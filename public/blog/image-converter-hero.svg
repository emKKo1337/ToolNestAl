<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <radialGradient id="gL" cx="10%" cy="50%" r="60%"><stop offset="0%" stop-color="#5b21b6" stop-opacity="0.35"/><stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/></radialGradient>
    <radialGradient id="gR" cx="90%" cy="50%" r="60%"><stop offset="0%" stop-color="#0e7490" stop-opacity="0.2"/><stop offset="100%" stop-color="#0e7490" stop-opacity="0"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="bG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient>
    <linearGradient id="lapG" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1a1040"/><stop offset="100%" stop-color="#0d0824"/></linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#5b21b6" flood-opacity="0.45"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <ellipse cx="120" cy="337" rx="700" ry="550" fill="url(#gL)"/>
  <ellipse cx="1080" cy="337" rx="700" ry="550" fill="url(#gR)"/>

  <text x="600" y="42" text-anchor="middle" font-size="13" font-weight="700" fill="url(#aG)" filter="url(#glow)">ToolNest AI — Image Tools</text>
  <text x="600" y="68" text-anchor="middle" font-size="34" font-weight="900" fill="url(#aG)" filter="url(#glow)">Image Converter</text>
  <text x="600" y="90" text-anchor="middle" font-size="13" fill="rgba(255,255,255,0.35)">JPG, PNG, WebP, GIF, BMP — any format to any format, free, private</text>

  <rect x="60" y="108" width="1080" height="542" rx="18" fill="url(#lapG)" stroke="rgba(124,58,237,0.35)" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="60" y="108" width="1080" height="38" rx="18" fill="rgba(255,255,255,0.05)"/>
  <rect x="60" y="128" width="1080" height="18" fill="rgba(255,255,255,0.02)"/>
  <circle cx="90" cy="127" r="7" fill="rgba(239,68,68,0.65)"/>
  <circle cx="114" cy="127" r="7" fill="rgba(251,191,36,0.65)"/>
  <circle cx="138" cy="127" r="7" fill="rgba(34,197,94,0.65)"/>
  <text x="600" y="132" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.2)">toolnestai.net/image-tools/image-converter</text>

  <!-- Before/after comparison -->
  <rect x="80" y="176" width="260" height="220" rx="10" fill="rgba(103,232,249,0.06)" stroke="rgba(103,232,249,0.25)" stroke-width="1.5"/>
  <text x="210" y="204" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.4)">INPUT</text>
  <text x="210" y="270" text-anchor="middle" font-size="26" font-weight="900" fill="rgba(103,232,249,0.85)">PNG</text>
  <text x="210" y="294" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.45)">2.4 MB</text>
  <text x="210" y="314" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.35)">3000×2000 · alpha channel</text>
  <text x="210" y="368" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.3)">Lossless, larger file</text>

  <text x="420" y="296" text-anchor="middle" font-size="28" fill="rgba(255,255,255,0.3)">→</text>

  <rect x="460" y="176" width="260" height="220" rx="10" fill="rgba(52,211,153,0.08)" stroke="rgba(52,211,153,0.3)" stroke-width="1.5"/>
  <text x="590" y="204" text-anchor="middle" font-size="10" fill="rgba(52,211,153,0.6)">OUTPUT</text>
  <text x="590" y="270" text-anchor="middle" font-size="26" font-weight="900" fill="rgba(110,231,183,0.95)">WebP</text>
  <text x="590" y="294" text-anchor="middle" font-size="11" font-weight="700" fill="#34d399">~380 KB (84% smaller)</text>
  <text x="590" y="314" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.45)">3000×2000 · alpha preserved</text>
  <text x="590" y="368" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.3)">Lossy or lossless mode available</text>

  <!-- Format comparison table -->
  <text x="88" y="426" font-size="9" font-weight="700" fill="rgba(255,255,255,0.28)">FORMAT COMPARISON</text>
  <rect x="80" y="432" width="680" height="180" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <g font-size="9.5" font-weight="700" fill="rgba(255,255,255,0.4)">
    <text x="96" y="454">FORMAT</text>
    <text x="240" y="454">TRANSPARENCY</text>
    <text x="400" y="454">COMPRESSION</text>
    <text x="560" y="454">BEST FOR</text>
  </g>
  <line x1="96" y1="462" x2="744" y2="462" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <text x="96" y="486" font-size="10.5" font-weight="700" fill="rgba(167,139,250,0.85)">PNG</text>
  <text x="240" y="486" font-size="9.5" fill="rgba(52,211,153,0.8)">✓ Yes (alpha)</text>
  <text x="400" y="486" font-size="9.5" fill="rgba(255,255,255,0.55)">Lossless</text>
  <text x="560" y="486" font-size="9.5" fill="rgba(255,255,255,0.55)">Logos, screenshots, graphics</text>

  <text x="96" y="514" font-size="10.5" font-weight="700" fill="rgba(103,232,249,0.85)">JPG</text>
  <text x="240" y="514" font-size="9.5" fill="rgba(239,68,68,0.7)">✗ No</text>
  <text x="400" y="514" font-size="9.5" fill="rgba(255,255,255,0.55)">Lossy (adjustable)</text>
  <text x="560" y="514" font-size="9.5" fill="rgba(255,255,255,0.55)">Photos, no transparency needed</text>

  <text x="96" y="542" font-size="10.5" font-weight="700" fill="rgba(52,211,153,0.85)">WebP</text>
  <text x="240" y="542" font-size="9.5" fill="rgba(52,211,153,0.8)">✓ Yes (alpha)</text>
  <text x="400" y="542" font-size="9.5" fill="rgba(255,255,255,0.55)">Both modes, smaller files</text>
  <text x="560" y="542" font-size="9.5" fill="rgba(255,255,255,0.55)">Web use — best size-to-quality ratio</text>

  <text x="96" y="570" font-size="10.5" font-weight="700" fill="rgba(251,191,36,0.85)">GIF</text>
  <text x="240" y="570" font-size="9.5" fill="rgba(251,191,36,0.75)">Partial (1-bit)</text>
  <text x="400" y="570" font-size="9.5" fill="rgba(255,255,255,0.55)">Lossless, 256 colors max</text>
  <text x="560" y="570" font-size="9.5" fill="rgba(255,255,255,0.55)">Simple animations</text>

  <text x="96" y="598" font-size="10.5" font-weight="700" fill="rgba(244,114,182,0.85)">BMP</text>
  <text x="240" y="598" font-size="9.5" fill="rgba(239,68,68,0.7)">✗ No</text>
  <text x="400" y="598" font-size="9.5" fill="rgba(255,255,255,0.55)">None (uncompressed)</text>
  <text x="560" y="598" font-size="9.5" fill="rgba(255,255,255,0.55)">Legacy Windows applications</text>

  <!-- Right panel: alpha warning -->
  <rect x="800" y="176" width="320" height="436" rx="12" fill="rgba(255,255,255,0.025)" stroke="rgba(124,58,237,0.18)" stroke-width="1"/>
  <text x="960" y="200" text-anchor="middle" font-size="11" font-weight="700" fill="rgba(255,255,255,0.5)">The Transparency Trap</text>

  <text x="816" y="228" font-size="9.5" fill="rgba(251,191,36,0.85)" font-weight="700">⚠ PNG/WebP → JPG loses alpha</text>
  <text x="816" y="248" font-size="9" fill="rgba(255,255,255,0.5)">JPG has no transparency support at</text>
  <text x="816" y="262" font-size="9" fill="rgba(255,255,255,0.5)">all — every transparent pixel gets</text>
  <text x="816" y="276" font-size="9" fill="rgba(255,255,255,0.5)">filled with a solid background color</text>
  <text x="816" y="290" font-size="9" fill="rgba(255,255,255,0.5)">(usually white) during conversion</text>

  <rect x="816" y="306" width="288" height="80" rx="6" fill="rgba(0,0,0,0.3)"/>
  <text x="830" y="326" font-size="8.5" fill="rgba(255,255,255,0.4)" font-family="monospace">Logo with transparent bg</text>
  <text x="830" y="344" font-size="8.5" fill="rgba(52,211,153,0.75)" font-family="monospace">→ PNG: transparent ✓</text>
  <text x="830" y="362" font-size="8.5" fill="rgba(239,68,68,0.75)" font-family="monospace">→ JPG: white background ✗</text>
  <text x="830" y="378" font-size="8.5" fill="rgba(52,211,153,0.75)" font-family="monospace">→ WebP: transparent ✓</text>

  <text x="816" y="414" font-size="9.5" font-weight="700" fill="rgba(103,232,249,0.85)">Lossy vs Lossless</text>
  <text x="816" y="434" font-size="9" fill="rgba(255,255,255,0.5)">Lossy (JPG, lossy WebP) discards</text>
  <text x="816" y="448" font-size="9" fill="rgba(255,255,255,0.5)">some data permanently for smaller</text>
  <text x="816" y="462" font-size="9" fill="rgba(255,255,255,0.5)">files. Lossless (PNG, lossless WebP)</text>
  <text x="816" y="476" font-size="9" fill="rgba(255,255,255,0.5)">keeps every original pixel exactly.</text>

  <text x="816" y="504" font-size="9.5" font-weight="700" fill="rgba(52,211,153,0.85)">Generation loss warning</text>
  <text x="816" y="524" font-size="9" fill="rgba(255,255,255,0.5)">Re-saving JPG→JPG repeatedly</text>
  <text x="816" y="538" font-size="9" fill="rgba(255,255,255,0.5)">compounds quality loss each time</text>
  <text x="816" y="552" font-size="9" fill="rgba(255,255,255,0.5)">— always convert from the original</text>

  <rect x="48" y="650" width="1104" height="16" rx="5" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="460" y="664" width="280" height="10" rx="5" fill="rgba(255,255,255,0.025)"/>
</svg>
