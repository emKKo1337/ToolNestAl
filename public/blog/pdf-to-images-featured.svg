<svg viewBox="0 0 900 540" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%"><stop offset="0%" stop-color="#0f0825"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <linearGradient id="lapG" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#1a1040"/><stop offset="100%" stop-color="#0d0824"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="900" height="540" fill="url(#bg)"/>
  <ellipse cx="450" cy="270" rx="280" ry="150" fill="#5b21b6" opacity="0.07" filter="url(#glow)"/>
  <rect x="120" y="48" width="660" height="410" rx="14" fill="url(#lapG)" stroke="#2a1f4a" stroke-width="1.5"/>
  <rect x="120" y="48" width="660" height="38" rx="14" fill="#1a1040"/>
  <rect x="120" y="72" width="660" height="14" fill="#1a1040"/>
  <circle cx="655" cy="67" r="7" fill="#ff5f57"/><circle cx="675" cy="67" r="7" fill="#febc2e"/><circle cx="695" cy="67" r="7" fill="#28c840"/>
  <rect x="200" y="56" width="440" height="20" rx="10" fill="#110c2a"/>
  <text x="420" y="70" font-family="monospace" font-size="9" fill="#4d4354" text-anchor="middle">toolnestai.net/pdf-tools/pdf-to-images</text>
  <rect x="136" y="94" width="628" height="352" rx="6" fill="#0c0920"/>
  <text x="450" y="118" font-family="sans-serif" font-size="13" font-weight="700" fill="#e2e2e2" text-anchor="middle">PDF to Images</text>
  <text x="450" y="134" font-family="sans-serif" font-size="8" fill="#7a6d84" text-anchor="middle">Convert every PDF page to JPG or PNG — choose DPI and quality</text>
  <!-- Options -->
  <rect x="148" y="148" width="628" height="56" rx="8" fill="#110c2a" stroke="#2a1f4a" stroke-width="1"/>
  <text x="164" y="168" font-family="sans-serif" font-size="9" font-weight="700" fill="#4d4354">FORMAT</text>
  <rect x="220" y="157" width="60" height="22" rx="6" fill="#7c3aed"/>
  <text x="250" y="172" font-family="sans-serif" font-size="9" font-weight="700" fill="#fff" text-anchor="middle">JPG</text>
  <rect x="288" y="157" width="60" height="22" rx="6" fill="#1a1040"/>
  <text x="318" y="172" font-family="sans-serif" font-size="9" fill="#7a6d84" text-anchor="middle">PNG</text>
  <text x="420" y="168" font-family="sans-serif" font-size="9" font-weight="700" fill="#4d4354">DPI</text>
  <rect x="458" y="157" width="60" height="22" rx="6" fill="#1a1040"/>
  <text x="488" y="172" font-family="sans-serif" font-size="9" fill="#7a6d84" text-anchor="middle">150</text>
  <rect x="526" y="157" width="60" height="22" rx="6" fill="#7c3aed"/>
  <text x="556" y="172" font-family="sans-serif" font-size="9" font-weight="700" fill="#fff" text-anchor="middle">300</text>
  <rect x="594" y="157" width="60" height="22" rx="6" fill="#1a1040"/>
  <text x="624" y="172" font-family="sans-serif" font-size="9" fill="#7a6d84" text-anchor="middle">600</text>
  <text x="164" y="193" font-family="sans-serif" font-size="8" fill="#4d4354">Quality: <tspan fill="#a78bfa">90%</tspan>  ·  Pages: <tspan fill="#a78bfa">All</tspan></text>
  <!-- Image grid output -->
  <text x="148" y="225" font-family="sans-serif" font-size="9" font-weight="700" fill="#4d4354">OUTPUT IMAGES</text>
  <!-- 5 image thumbnails -->
