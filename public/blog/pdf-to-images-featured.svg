  <rect x="266" y="232" width="108" height="76" rx="6" fill="#1a1040" stroke="#2a1f4a" stroke-width="1"/>
  <rect x="274" y="240" width="92" height="60" rx="3" fill="#110c2a"/>
  <text x="320" y="320" font-family="sans-serif" font-size="7.5" fill="#7a6d84" text-anchor="middle">page-002.jpg</text>
  <rect x="384" y="232" width="108" height="76" rx="6" fill="#1a1040" stroke="#2a1f4a" stroke-width="1"/>
  <text x="438" y="320" font-family="sans-serif" font-size="7.5" fill="#7a6d84" text-anchor="middle">page-003.jpg</text>
  <rect x="502" y="232" width="108" height="76" rx="6" fill="#1a1040" stroke="#2a1f4a" stroke-width="1"/>
  <text x="556" y="320" font-family="sans-serif" font-size="7.5" fill="#7a6d84" text-anchor="middle">page-004.jpg</text>
  <rect x="620" y="232" width="108" height="76" rx="6" fill="#1a1040" stroke="#2a1f4a" stroke-width="1"/>
  <text x="674" y="320" font-family="sans-serif" font-size="7.5" fill="#7a6d84" text-anchor="middle">page-005.jpg</text>
  <!-- Download button -->
  <rect x="148" y="340" width="200" height="36" rx="10" fill="#7c3aed"/>
  <text x="248" y="363" font-family="sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">Download All (.zip)</text>
  <rect x="360" y="340" width="180" height="36" rx="10" fill="#1a1040" stroke="#2a1f4a" stroke-width="1"/>
  <text x="450" y="363" font-family="sans-serif" font-size="12" fill="#7a6d84" text-anchor="middle">Download individually</text>
  <rect x="340" y="458" width="220" height="10" rx="5" fill="#1a1040"/>
  <rect x="280" y="466" width="340" height="8" rx="4" fill="#140e34"/>
