  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="600" y="52" text-anchor="middle" font-size="24" font-weight="900" fill="url(#aG)">WebP vs JPG vs PNG: Format Size Comparison</text>
  <text x="600" y="74" text-anchor="middle" font-size="12" fill="rgba(255,255,255,0.38)">Same visual quality — WebP consistently produces smaller files than the alternatives</text>
