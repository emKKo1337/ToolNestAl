    <text x="210" y="362" fill="rgba(255,255,255,0.45)">Universal compatibility</text>
    <text x="210" y="382" fill="rgba(255,255,255,0.45)">All email clients, software</text>
    <text x="210" y="410" font-size="10.5" font-weight="700" fill="rgba(239,68,68,0.6)">Cons</text>
