<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <radialGradient id="gL" cx="10%" cy="50%" r="60%"><stop offset="0%" stop-color="#5b21b6" stop-opacity="0.35"/><stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/></radialGradient>
    <radialGradient id="gR" cx="90%" cy="50%" r="60%"><stop offset="0%" stop-color="#0e7490" stop-opacity="0.2"/><stop offset="100%" stop-color="#0e7490" stop-opacity="0"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="bG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient>
    <linearGradient id="lapG" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1a1040"/><stop offset="100%" stop-color="#0d0824"/></linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#5b21b6" flood-opacity="0.45"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <ellipse cx="120" cy="337" rx="700" ry="550" fill="url(#gL)"/>
  <ellipse cx="1080" cy="337" rx="700" ry="550" fill="url(#gR)"/>

  <text x="600" y="42" text-anchor="middle" font-size="13" font-weight="700" fill="url(#aG)" filter="url(#glow)">ToolNest AI — Text Tools</text>
  <text x="600" y="68" text-anchor="middle" font-size="34" font-weight="900" fill="url(#aG)" filter="url(#glow)">Find and Replace</text>
  <text x="600" y="90" text-anchor="middle" font-size="13" fill="rgba(255,255,255,0.35)">Plain text and regex modes, with capture groups — free, instant, in your browser</text>

  <rect x="60" y="108" width="1080" height="542" rx="18" fill="url(#lapG)" stroke="rgba(124,58,237,0.35)" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="60" y="108" width="1080" height="38" rx="18" fill="rgba(255,255,255,0.05)"/>
  <rect x="60" y="128" width="1080" height="18" fill="rgba(255,255,255,0.02)"/>
  <circle cx="90" cy="127" r="7" fill="rgba(239,68,68,0.65)"/>
  <circle cx="114" cy="127" r="7" fill="rgba(251,191,36,0.65)"/>
  <circle cx="138" cy="127" r="7" fill="rgba(34,197,94,0.65)"/>
  <text x="600" y="132" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.2)">toolnestai.net/text-tools/find-and-replace</text>

  <!-- Find/replace inputs -->
  <text x="88" y="176" font-size="9" font-weight="700" fill="rgba(255,255,255,0.28)">FIND</text>
  <rect x="80" y="182" width="330" height="42" rx="9" fill="rgba(0,0,0,0.55)" stroke="rgba(124,58,237,0.45)" stroke-width="1.5"/>
  <text x="98" y="209" font-family="monospace" font-size="15" fill="rgba(167,139,250,0.92)">colour</text>

  <text x="430" y="176" font-size="9" font-weight="700" fill="rgba(255,255,255,0.28)">REPLACE</text>
  <rect x="422" y="182" width="330" height="42" rx="9" fill="rgba(0,0,0,0.4)" stroke="rgba(103,232,249,0.3)" stroke-width="1.5"/>
  <text x="440" y="209" font-family="monospace" font-size="15" fill="rgba(103,232,249,0.85)">color</text>

  <rect x="772" y="182" width="200" height="42" rx="9" fill="url(#bG)" filter="url(#sh)"/>
  <text x="872" y="208" text-anchor="middle" font-size="14" font-weight="900" fill="#fff">Replace All (3)</text>

  <!-- Options -->
  <g font-size="10" text-anchor="middle">
    <rect x="80" y="238" width="140" height="26" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="150" y="255" fill="rgba(255,255,255,0.4)">☐ Match case</text>
    <rect x="230" y="238" width="140" height="26" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="300" y="255" fill="rgba(255,255,255,0.4)">☐ Whole word only</text>
    <rect x="380" y="238" width="140" height="26" rx="6" fill="url(#bG)"/>
    <text x="450" y="255" fill="#fff" font-weight="700">☑ Use regex</text>
  </g>

  <!-- Text preview -->
  <text x="88" y="298" font-size="9" font-weight="700" fill="rgba(255,255,255,0.28)">TEXT WITH HIGHLIGHTED MATCHES (3 found)</text>
  <rect x="80" y="304" width="680" height="180" rx="10" fill="rgba(0,0,0,0.4)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="98" y="330" font-family="monospace" font-size="13" fill="rgba(255,255,255,0.6)">Choose your favorite</text>
  <rect x="252" y="316" width="60" height="18" fill="rgba(52,211,153,0.25)"/>
  <text x="258" y="330" font-family="monospace" font-size="13" fill="rgba(110,231,183,0.9)">colour</text>
  <text x="98" y="356" font-family="monospace" font-size="13" fill="rgba(255,255,255,0.6)">scheme. The</text>
  <rect x="222" y="342" width="60" height="18" fill="rgba(52,211,153,0.25)"/>
  <text x="228" y="356" font-family="monospace" font-size="13" fill="rgba(110,231,183,0.9)">colour</text>
  <text x="292" y="356" font-family="monospace" font-size="13" fill="rgba(255,255,255,0.6)"> picker shows</text>
  <text x="98" y="382" font-family="monospace" font-size="13" fill="rgba(255,255,255,0.6)">every</text>
  <rect x="152" y="368" width="60" height="18" fill="rgba(52,211,153,0.25)"/>
  <text x="158" y="382" font-family="monospace" font-size="13" fill="rgba(110,231,183,0.9)">colour</text>
  <text x="222" y="382" font-family="monospace" font-size="13" fill="rgba(255,255,255,0.6)"> available in the British</text>
  <text x="98" y="408" font-family="monospace" font-size="13" fill="rgba(255,255,255,0.6)">spelling palette.</text>

  <!-- Right panel: regex reference -->
  <rect x="780" y="182" width="340" height="302" rx="12" fill="rgba(255,255,255,0.025)" stroke="rgba(124,58,237,0.18)" stroke-width="1"/>
  <text x="950" y="206" text-anchor="middle" font-size="11" font-weight="700" fill="rgba(255,255,255,0.5)">Regex Mode: Capture Groups</text>

  <text x="796" y="232" font-size="9.5" font-weight="700" fill="rgba(167,139,250,0.85)">Reformat a date</text>
  <text x="796" y="252" font-family="monospace" font-size="9.5" fill="rgba(255,255,255,0.55)">Find: (\d{`{4}`})-(\d{`{2}`})-(\d{`{2}`})</text>
  <text x="796" y="272" font-family="monospace" font-size="9.5" fill="rgba(255,255,255,0.55)">Replace: $2/$3/$1</text>
  <text x="796" y="292" font-family="monospace" font-size="9.5" fill="rgba(52,211,153,0.85)">"2026-07-29" → "07/29/2026"</text>

  <text x="796" y="326" font-size="9.5" font-weight="700" fill="rgba(103,232,249,0.85)">Swap first/last name</text>
  <text x="796" y="346" font-family="monospace" font-size="9.5" fill="rgba(255,255,255,0.55)">Find: (\w+) (\w+)</text>
  <text x="796" y="366" font-family="monospace" font-size="9.5" fill="rgba(255,255,255,0.55)">Replace: $2, $1</text>
  <text x="796" y="386" font-family="monospace" font-size="9.5" fill="rgba(52,211,153,0.85)">"Jane Doe" → "Doe, Jane"</text>

  <text x="796" y="420" font-size="9.5" font-weight="700" fill="rgba(251,191,36,0.85)">Wrap in quotes</text>
  <text x="796" y="440" font-family="monospace" font-size="9.5" fill="rgba(255,255,255,0.55)">Find: (\w+)</text>
  <text x="796" y="460" font-family="monospace" font-size="9.5" fill="rgba(255,255,255,0.55)">Replace: "$1"</text>

  <!-- Modes -->
  <text x="88" y="510" font-size="9" font-weight="700" fill="rgba(255,255,255,0.28)">MODIFIER OPTIONS</text>
  <g font-size="10">
    <rect x="80" y="516" width="330" height="70" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="96" y="538" fill="rgba(167,139,250,0.85)" font-weight="700">Match case</text>
    <text x="96" y="556" fill="rgba(255,255,255,0.5)">"Colour" won't match "colour"</text>
    <text x="96" y="572" fill="rgba(255,255,255,0.5)">when enabled</text>

    <rect x="422" y="516" width="330" height="70" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="438" y="538" fill="rgba(103,232,249,0.85)" font-weight="700">Whole word only</text>
    <text x="438" y="556" fill="rgba(255,255,255,0.5)">Prevents "cat" from matching</text>
    <text x="438" y="572" fill="rgba(255,255,255,0.5)">inside "category" or "concatenate"</text>
  </g>

  <rect x="48" y="650" width="1104" height="16" rx="5" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="460" y="664" width="280" height="10" rx="5" fill="rgba(255,255,255,0.025)"/>
</svg>
