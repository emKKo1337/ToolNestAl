<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="30%" cy="40%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <radialGradient id="gL" cx="15%" cy="50%" r="55%"><stop offset="0%" stop-color="#5b21b6" stop-opacity="0.45"/><stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/></radialGradient>
    <radialGradient id="gR" cx="85%" cy="50%" r="55%"><stop offset="0%" stop-color="#0e7490" stop-opacity="0.28"/><stop offset="100%" stop-color="#0e7490" stop-opacity="0"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="bG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient>
    <linearGradient id="lapG" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1a1040"/><stop offset="100%" stop-color="#0d0824"/></linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#5b21b6" flood-opacity="0.5"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="180" cy="315" rx="600" ry="500" fill="url(#gL)"/>
  <ellipse cx="1020" cy="315" rx="600" ry="500" fill="url(#gR)"/>

  <text x="60" y="70" font-size="14" font-weight="700" fill="url(#aG)" filter="url(#glow)">ToolNest AI</text>
  <text x="60" y="106" font-size="13" fill="rgba(255,255,255,0.35)">Image Tools › Image Converter</text>
  <text x="60" y="185" font-size="46" font-weight="900" fill="url(#aG)" filter="url(#glow)">Image</text>
  <text x="60" y="245" font-size="46" font-weight="900" fill="url(#aG)" filter="url(#glow)">Converter</text>
  <text x="60" y="300" font-size="18" fill="rgba(255,255,255,0.6)">JPG · PNG · WebP · GIF · BMP</text>
  <text x="60" y="328" font-size="18" fill="rgba(255,255,255,0.6)">Any format to any format — Free</text>

  <rect x="60" y="358" width="110" height="52" rx="8" fill="rgba(124,58,237,0.2)" stroke="rgba(124,58,237,0.4)" stroke-width="1"/>
  <text x="115" y="382" text-anchor="middle" font-size="14" font-weight="900" fill="#a78bfa">6+</text>
  <text x="115" y="400" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">formats</text>

  <rect x="182" y="358" width="110" height="52" rx="8" fill="rgba(14,116,144,0.15)" stroke="rgba(14,116,144,0.35)" stroke-width="1"/>
  <text x="237" y="382" text-anchor="middle" font-size="18" font-weight="900" fill="#67e8f9">Batch</text>
  <text x="237" y="400" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">multi-file</text>

  <rect x="304" y="358" width="110" height="52" rx="8" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
  <text x="359" y="382" text-anchor="middle" font-size="16" font-weight="900" fill="#34d399">Alpha</text>
  <text x="359" y="400" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">transparency aware</text>

  <rect x="426" y="358" width="110" height="52" rx="8" fill="rgba(251,191,36,0.1)" stroke="rgba(251,191,36,0.25)" stroke-width="1"/>
  <text x="481" y="382" text-anchor="middle" font-size="20" font-weight="900" fill="#fbbf24">Free</text>
  <text x="481" y="400" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">no account</text>

  <text x="60" y="560" font-size="14" fill="rgba(255,255,255,0.25)">toolnestai.net/image-tools/image-converter</text>

  <!-- Right: Laptop with converter UI -->
  <rect x="630" y="60" width="530" height="490" rx="16" fill="url(#lapG)" stroke="rgba(124,58,237,0.3)" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="630" y="60" width="530" height="36" rx="16" fill="rgba(255,255,255,0.05)"/>
  <rect x="630" y="78" width="530" height="18" fill="rgba(255,255,255,0.02)"/>
  <circle cx="655" cy="78" r="6" fill="rgba(239,68,68,0.6)"/>
  <circle cx="675" cy="78" r="6" fill="rgba(251,191,36,0.6)"/>
  <circle cx="695" cy="78" r="6" fill="rgba(34,197,94,0.6)"/>

  <!-- Format chips: from -> to -->
  <rect x="642" y="118" width="180" height="140" rx="8" fill="rgba(103,232,249,0.06)" stroke="rgba(103,232,249,0.25)" stroke-width="1.5"/>
  <text x="732" y="150" text-anchor="middle" font-size="14" fill="rgba(255,255,255,0.3)">🖼</text>
  <text x="732" y="200" text-anchor="middle" font-size="18" font-weight="900" fill="rgba(103,232,249,0.85)">PNG</text>
  <text x="732" y="222" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.4)">2.4 MB, alpha channel</text>
  <text x="732" y="240" text-anchor="middle" font-size="8.5" fill="rgba(255,255,255,0.3)">3000×2000</text>

  <text x="850" y="196" text-anchor="middle" font-size="22" fill="rgba(255,255,255,0.35)">→</text>

  <rect x="878" y="118" width="180" height="140" rx="8" fill="rgba(52,211,153,0.08)" stroke="rgba(52,211,153,0.28)" stroke-width="1.5"/>
  <text x="968" y="150" text-anchor="middle" font-size="14" fill="rgba(255,255,255,0.3)">🖼</text>
  <text x="968" y="200" text-anchor="middle" font-size="18" font-weight="900" fill="rgba(110,231,183,0.9)">WebP</text>
  <text x="968" y="222" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.4)">~380 KB (84% smaller)</text>
  <text x="968" y="240" text-anchor="middle" font-size="8.5" fill="rgba(255,255,255,0.3)">3000×2000, alpha kept</text>

  <!-- Format options row -->
  <text x="650" y="284" font-size="8.5" font-weight="700" fill="rgba(255,255,255,0.3)">CONVERT TO</text>
  <g font-size="9" text-anchor="middle">
    <rect x="642" y="290" width="70" height="26" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="677" y="307" fill="rgba(255,255,255,0.4)">JPG</text>
    <rect x="718" y="290" width="70" height="26" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="753" y="307" fill="rgba(255,255,255,0.4)">PNG</text>
    <rect x="794" y="290" width="70" height="26" rx="6" fill="url(#bG)"/>
    <text x="829" y="307" fill="#fff" font-weight="700">WebP</text>
    <rect x="870" y="290" width="70" height="26" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="905" y="307" fill="rgba(255,255,255,0.4)">GIF</text>
    <rect x="946" y="290" width="70" height="26" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="981" y="307" fill="rgba(255,255,255,0.4)">BMP</text>
  </g>

  <!-- Quality slider -->
  <text x="650" y="342" font-size="8.5" font-weight="700" fill="rgba(255,255,255,0.3)">QUALITY (for lossy formats)</text>
  <rect x="642" y="348" width="506" height="8" rx="4" fill="rgba(255,255,255,0.08)"/>
  <rect x="642" y="348" width="430" height="8" rx="4" fill="url(#bG)"/>
  <circle cx="1072" cy="352" r="9" fill="#fff"/>
  <text x="1148" y="356" text-anchor="end" font-size="10" fill="rgba(255,255,255,0.5)">85%</text>

  <!-- Alpha warning -->
  <rect x="642" y="372" width="506" height="48" rx="7" fill="rgba(251,191,36,0.06)" stroke="rgba(251,191,36,0.2)" stroke-width="1"/>
  <text x="658" y="392" font-size="9.5" font-weight="700" fill="rgba(251,191,36,0.85)">ℹ Converting PNG → JPG removes transparency</text>
  <text x="658" y="408" font-size="8.5" fill="rgba(255,255,255,0.4)">Transparent areas fill with white (or a chosen color)</text>

  <!-- Buttons -->
  <rect x="642" y="436" width="244" height="30" rx="8" fill="url(#bG)" filter="url(#sh)"/>
  <text x="764" y="455" text-anchor="middle" font-size="12" font-weight="900" fill="#fff">Convert Image</text>
  <rect x="898" y="436" width="250" height="30" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="1023" y="455" text-anchor="middle" font-size="12" fill="rgba(255,255,255,0.35)">Download</text>

  <rect x="620" y="550" width="560" height="14" rx="4" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="760" y="562" width="260" height="8" rx="4" fill="rgba(255,255,255,0.03)"/>
</svg>
