  <g fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.1)" stroke-width="1">
    <rect x="1004" y="136" width="30" height="22" rx="3"/>
    <rect x="1040" y="136" width="30" height="22" rx="3"/>
    <rect x="1076" y="136" width="54" height="22" rx="3" fill="rgba(124,58,237,0.35)" stroke="rgba(124,58,237,0.5)"/>
    <rect x="1004" y="164" width="30" height="22" rx="3"/>
    <rect x="1040" y="164" width="30" height="22" rx="3"/>
    <rect x="1076" y="164" width="54" height="22" rx="3"/>
    <rect x="1004" y="192" width="30" height="22" rx="3"/>
    <rect x="1040" y="192" width="30" height="22" rx="3"/>
