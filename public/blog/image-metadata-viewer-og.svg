<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0a0118"/>
      <stop offset="100%" stop-color="#05030d"/>
    </radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="bG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="28" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="320" cy="300" r="260" fill="#5b21b6" opacity="0.14" filter="url(#glow)"/>
  <circle cx="950" cy="220" r="180" fill="#0e7490" opacity="0.09" filter="url(#glow)"/>

  <!-- Badge -->
  <rect x="80" y="118" width="160" height="28" rx="14" fill="rgba(76,215,246,0.2)" stroke="rgba(76,215,246,0.4)" stroke-width="1"/>
  <text x="160" y="136" font-size="12" fill="#4cd7f6" font-weight="700" text-anchor="middle" letter-spacing="1">FREE ONLINE TOOL</text>

  <!-- Headline -->
  <text x="80" y="208" font-size="62" fill="#e2e2e2" font-weight="900">Image Metadata</text>
  <text x="80" y="272" font-size="62" fill="url(#aG)" font-weight="900">Viewer</text>

  <!-- Sub -->
  <text x="80" y="322" font-size="20" fill="#7a6d84">Inspect camera, GPS, lens, dates</text>
  <text x="80" y="350" font-size="20" fill="#7a6d84">and 30+ EXIF fields instantly.</text>

  <!-- Chips -->
  <g transform="translate(80,385)">
    <rect width="120" height="34" rx="17" fill="rgba(76,215,246,0.15)" stroke="#4cd7f6" stroke-width="1"/>
    <text x="60" y="21" font-size="12" fill="#4cd7f6" font-weight="700" text-anchor="middle">📷 Camera Info</text>
    <rect x="128" width="110" height="34" rx="17" fill="rgba(34,211,238,0.12)" stroke="rgba(34,211,238,0.4)" stroke-width="1"/>
    <text x="183" y="21" font-size="12" fill="#22d3ee" font-weight="700" text-anchor="middle">📍 GPS Data</text>
    <rect x="246" width="110" height="34" rx="17" fill="rgba(124,58,237,0.15)" stroke="rgba(124,58,237,0.4)" stroke-width="1"/>
    <text x="301" y="21" font-size="12" fill="#a78bfa" font-weight="700" text-anchor="middle">⚡ Exposure</text>
    <rect x="364" width="100" height="34" rx="17" fill="rgba(249,115,22,0.12)" stroke="rgba(249,115,22,0.3)" stroke-width="1"/>
    <text x="414" y="21" font-size="12" fill="#fb923c" font-weight="700" text-anchor="middle">📅 Dates</text>
  </g>
  <g transform="translate(80,430)">
    <rect width="120" height="34" rx="17" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="60" y="21" font-size="12" fill="#6b5b7a" font-weight="700" text-anchor="middle">JSON Export</text>
    <rect x="128" width="120" height="34" rx="17" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="188" y="21" font-size="12" fill="#6b5b7a" font-weight="700" text-anchor="middle">Maps Link</text>
    <rect x="256" width="140" height="34" rx="17" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="326" y="21" font-size="12" fill="#6b5b7a" font-weight="700" text-anchor="middle">100% Private</text>
  </g>

  <!-- Right panel: metadata preview card -->
  <rect x="820" y="60" width="340" height="510" rx="20" fill="rgba(255,255,255,0.03)" stroke="rgba(76,215,246,0.2)" stroke-width="1.5"/>

  <!-- Camera info block -->
  <rect x="838" y="80" width="304" height="90" rx="8" fill="rgba(76,215,246,0.06)" stroke="rgba(76,215,246,0.1)" stroke-width="0.5"/>
  <text x="858" y="102" font-size="11" fill="#4cd7f6" font-weight="700">📷 Camera</text>
  <g font-size="11" font-family="ui-monospace,monospace">
    <text x="858" y="120" fill="#6b5b7a">Make</text><text x="920" y="120" fill="#e2e2e2">Apple</text>
    <text x="858" y="136" fill="#6b5b7a">Model</text><text x="920" y="136" fill="#e2e2e2">iPhone 15 Pro Max</text>
    <text x="858" y="152" fill="#6b5b7a">ISO</text><text x="920" y="152" fill="#e2e2e2">64</text>
  </g>

  <!-- Exposure block -->
  <rect x="838" y="180" width="304" height="90" rx="8" fill="rgba(124,58,237,0.06)" stroke="rgba(124,58,237,0.1)" stroke-width="0.5"/>
  <text x="858" y="202" font-size="11" fill="#a78bfa" font-weight="700">⚡ Exposure</text>
  <g font-size="11" font-family="ui-monospace,monospace">
    <text x="858" y="220" fill="#6b5b7a">Aperture</text><text x="944" y="220" fill="#e2e2e2">f/1.78</text>
    <text x="858" y="236" fill="#6b5b7a">Shutter</text><text x="944" y="236" fill="#e2e2e2">1/120 s</text>
    <text x="858" y="252" fill="#6b5b7a">Focal</text><text x="944" y="252" fill="#e2e2e2">24mm equiv.</text>
  </g>

  <!-- GPS block -->
  <rect x="838" y="280" width="304" height="90" rx="8" fill="rgba(6,182,212,0.08)" stroke="rgba(6,182,212,0.2)" stroke-width="0.5"/>
  <text x="858" y="302" font-size="11" fill="#22d3ee" font-weight="700">📍 GPS</text>
  <g font-size="11" font-family="ui-monospace,monospace">
    <text x="858" y="320" fill="#6b5b7a">Lat</text><text x="900" y="320" fill="#e2e2e2">48.8584° N</text>
    <text x="858" y="336" fill="#6b5b7a">Lon</text><text x="900" y="336" fill="#e2e2e2">2.2945° E</text>
    <text x="858" y="354" fill="#22d3ee" text-decoration="underline">View on Maps ↗</text>
  </g>

  <!-- Date block -->
  <rect x="838" y="380" width="304" height="60" rx="8" fill="rgba(249,115,22,0.06)" stroke="rgba(249,115,22,0.1)" stroke-width="0.5"/>
  <text x="858" y="402" font-size="11" fill="#fb923c" font-weight="700">📅 Date Taken</text>
  <text x="858" y="422" font-size="11" fill="#e2e2e2" font-family="ui-monospace,monospace">2024-07-14  14:32:11</text>

  <!-- Export buttons -->
  <rect x="838" y="456" width="142" height="32" rx="8" fill="url(#bG)"/>
  <text x="909" y="476" font-size="11" fill="white" text-anchor="middle" font-weight="700">Export JSON</text>
  <rect x="990" y="456" width="152" height="32" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="1066" y="476" font-size="11" fill="#9b8da8" text-anchor="middle" font-weight="600">Export TXT</text>

  <!-- URL -->
  <rect x="838" y="500" width="304" height="54" rx="10" fill="rgba(76,215,246,0.07)"/>
  <text x="990" y="524" font-size="12" fill="#6b5b7a" text-anchor="middle">Free at</text>
  <text x="990" y="544" font-size="14" fill="#4cd7f6" font-weight="700" text-anchor="middle">toolnestai.net</text>
</svg>
