<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <radialGradient id="gC" cx="50%" cy="40%" r="60%"><stop offset="0%" stop-color="#5b21b6" stop-opacity="0.2"/><stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
  </defs>
  <rect width="900" height="460" fill="url(#bg)"/>
  <ellipse cx="450" cy="230" rx="520" ry="320" fill="url(#gC)"/>

  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="900" fill="url(#aG)">The Flesch Reading Ease Scale</text>
  <text x="450" y="54" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.38)">Higher score = easier to read. Developed in the 1940s, still the industry standard.</text>

  <!-- Scale bar -->
  <rect x="40" y="76" width="820" height="30" rx="6" fill="rgba(59,130,246,0.5)"/>
  <rect x="40" y="76" width="120" height="30" fill="rgba(239,68,68,0.6)"/>
  <rect x="160" y="76" width="120" height="30" fill="rgba(251,146,60,0.6)"/>
  <rect x="280" y="76" width="120" height="30" fill="rgba(251,191,36,0.6)"/>
  <rect x="400" y="76" width="140" height="30" fill="rgba(163,230,53,0.6)"/>
  <rect x="540" y="76" width="140" height="30" fill="rgba(52,211,153,0.6)"/>
  <rect x="680" y="76" width="180" height="30" fill="rgba(103,232,249,0.6)"/>

  <g font-size="9" text-anchor="middle" fill="rgba(255,255,255,0.65)">
    <text x="100" y="96">0-29</text>
    <text x="220" y="96">30-49</text>
    <text x="340" y="96">50-59</text>
    <text x="470" y="96">60-69</text>
    <text x="610" y="96">70-79</text>
    <text x="770" y="96">80-100</text>
  </g>

  <!-- Descriptions -->
  <g font-size="9" text-anchor="middle">
    <text x="100" y="122" fill="rgba(255,255,255,0.5)">Very</text>
    <text x="100" y="134" fill="rgba(255,255,255,0.5)">Confusing</text>
    <text x="100" y="148" fill="rgba(255,255,255,0.3)">College grad</text>

    <text x="220" y="122" fill="rgba(255,255,255,0.5)">Difficult</text>
    <text x="220" y="148" fill="rgba(255,255,255,0.3)">College level</text>

    <text x="340" y="122" fill="rgba(255,255,255,0.5)">Fairly</text>
    <text x="340" y="134" fill="rgba(255,255,255,0.5)">Difficult</text>
    <text x="340" y="148" fill="rgba(255,255,255,0.3)">10th-12th grade</text>

    <text x="470" y="122" fill="rgba(255,255,255,0.5)">Standard</text>
    <text x="470" y="148" fill="rgba(255,255,255,0.3)">8th-9th grade</text>

    <text x="610" y="122" fill="rgba(255,255,255,0.5)">Fairly Easy</text>
    <text x="610" y="148" fill="rgba(255,255,255,0.3)">7th grade</text>

    <text x="770" y="122" fill="rgba(255,255,255,0.5)">Easy / Very Easy</text>
    <text x="770" y="148" fill="rgba(255,255,255,0.3)">5th-6th grade</text>
  </g>

  <!-- Formula box -->
  <rect x="28" y="176" width="410" height="130" rx="8" fill="rgba(167,139,250,0.06)" stroke="rgba(167,139,250,0.2)" stroke-width="1"/>
  <text x="44" y="198" font-size="10.5" font-weight="700" fill="#a78bfa">Flesch Reading Ease Formula</text>
  <text x="44" y="224" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.7)">206.835 − 1.015 × (words/sentence)</text>
  <text x="44" y="242" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.7)">           − 84.6 × (syllables/word)</text>
  <text x="44" y="268" font-size="9" fill="rgba(255,255,255,0.5)">Score decreases as sentences and words</text>
  <text x="44" y="284" font-size="9" fill="rgba(255,255,255,0.5)">get longer — shorter = easier to read</text>

  <!-- Grade level box -->
  <rect x="462" y="176" width="410" height="130" rx="8" fill="rgba(103,232,249,0.06)" stroke="rgba(103,232,249,0.2)" stroke-width="1"/>
  <text x="478" y="198" font-size="10.5" font-weight="700" fill="#67e8f9">Flesch-Kincaid Grade Level Formula</text>
  <text x="478" y="224" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.7)">0.39 × (words/sentence)</text>
  <text x="478" y="242" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.7)">+ 11.8 × (syllables/word) − 15.59</text>
  <text x="478" y="268" font-size="9" fill="rgba(255,255,255,0.5)">Outputs an actual US school grade level</text>
  <text x="478" y="284" font-size="9" fill="rgba(255,255,255,0.5)">(e.g. 6.2 = mid-6th-grade reading level)</text>

  <!-- Recommendations -->
  <rect x="28" y="316" width="844" height="106" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(124,58,237,0.15)" stroke-width="1"/>
  <text x="450" y="338" text-anchor="middle" font-size="10" font-weight="700" fill="rgba(167,139,250,0.85)">TARGET SCORES BY CONTEXT</text>
  <text x="60" y="362" font-size="9.5" fill="rgba(255,255,255,0.55)">General web content / blog posts:</text>
  <text x="280" y="362" font-size="9.5" font-weight="700" fill="rgba(52,211,153,0.85)">60-70 (8th-9th grade)</text>
  <text x="60" y="384" font-size="9.5" fill="rgba(255,255,255,0.55)">Marketing / consumer copy:</text>
  <text x="280" y="384" font-size="9.5" font-weight="700" fill="rgba(52,211,153,0.85)">70-80+ (as easy as possible)</text>
  <text x="60" y="406" font-size="9.5" fill="rgba(255,255,255,0.55)">Technical / academic writing:</text>
  <text x="280" y="406" font-size="9.5" font-weight="700" fill="rgba(251,191,36,0.85)">30-50 (acceptable for the audience)</text>

  <text x="450" y="446" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.2)">toolnestai.net/text-tools/text-statistics</text>
</svg>
