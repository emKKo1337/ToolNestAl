<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Segoe UI',sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0f0825"/>
      <stop offset="100%" stop-color="#05030d"/>
    </radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>
  <rect width="900" height="480" fill="url(#bg)"/>

  <text x="450" y="44" font-size="22" font-weight="800" fill="#e2e2e2" text-anchor="middle">JSON vs YAML — Syntax Side by Side</text>
  <text x="450" y="66" font-size="13" fill="#7a6d84" text-anchor="middle">The same data structure expressed in both formats</text>

  <!-- JSON panel -->
  <rect x="30" y="86" width="400" height="370" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(96,165,250,0.2)" stroke-width="1"/>
  <rect x="30" y="86" width="400" height="36" rx="12" fill="rgba(96,165,250,0.08)"/>
  <rect x="30" y="106" width="400" height="16" fill="rgba(96,165,250,0.08)"/>
  <text x="50" y="110" font-size="13" font-weight="700" fill="#60a5fa" letter-spacing="0.04em">JSON</text>
  <text x="410" y="110" font-size="11" fill="#3d3356" text-anchor="end">JavaScript Object Notation</text>

  <!-- JSON code -->
  <text x="50" y="140" font-size="10.5" fill="#fbbf24" font-family="monospace">{</text>
  <text x="50" y="158" font-size="10.5" fill="#e2e2e2" font-family="monospace">  <tspan fill="#60a5fa">"name"</tspan>: <tspan fill="#34d399">"Jane Smith"</tspan>,</text>
  <text x="50" y="176" font-size="10.5" fill="#e2e2e2" font-family="monospace">  <tspan fill="#60a5fa">"age"</tspan>: <tspan fill="#f97316">32</tspan>,</text>
  <text x="50" y="194" font-size="10.5" fill="#e2e2e2" font-family="monospace">  <tspan fill="#60a5fa">"active"</tspan>: <tspan fill="#a78bfa">true</tspan>,</text>
  <text x="50" y="212" font-size="10.5" fill="#e2e2e2" font-family="monospace">  <tspan fill="#60a5fa">"score"</tspan>: <tspan fill="#7a6d84">null</tspan>,</text>
  <text x="50" y="230" font-size="10.5" fill="#e2e2e2" font-family="monospace">  <tspan fill="#60a5fa">"tags"</tspan>: [</text>
  <text x="50" y="248" font-size="10.5" fill="#34d399" font-family="monospace">    "admin"<tspan fill="#7a6d84">,</tspan></text>
  <text x="50" y="266" font-size="10.5" fill="#34d399" font-family="monospace">    "editor"</text>
  <text x="50" y="284" font-size="10.5" fill="#e2e2e2" font-family="monospace">  ],</text>
  <text x="50" y="302" font-size="10.5" fill="#e2e2e2" font-family="monospace">  <tspan fill="#60a5fa">"address"</tspan>: {</text>
  <text x="50" y="320" font-size="10.5" fill="#e2e2e2" font-family="monospace">    <tspan fill="#60a5fa">"city"</tspan>: <tspan fill="#34d399">"Berlin"</tspan>,</text>
  <text x="50" y="338" font-size="10.5" fill="#e2e2e2" font-family="monospace">    <tspan fill="#60a5fa">"zip"</tspan>: <tspan fill="#34d399">"10115"</tspan></text>
  <text x="50" y="356" font-size="10.5" fill="#e2e2e2" font-family="monospace">  }</text>
  <text x="50" y="374" font-size="10.5" fill="#fbbf24" font-family="monospace">}</text>

  <text x="50" y="410" font-size="10" fill="#3d3356">Keys always quoted · Strict syntax</text>
  <text x="50" y="428" font-size="10" fill="#3d3356">Numbers, booleans, null are native types</text>
  <text x="50" y="446" font-size="10" fill="#3d3356">Arrays use [] · Objects use {}</text>

  <!-- Arrow -->
  <g transform="translate(450,260)">
    <circle r="26" fill="#1a1040" stroke="rgba(167,139,250,0.25)" stroke-width="1.5"/>
    <text y="6" font-size="18" text-anchor="middle" fill="url(#aG)">⇄</text>
  </g>

  <!-- YAML panel -->
  <rect x="470" y="86" width="400" height="370" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(167,139,250,0.2)" stroke-width="1"/>
  <rect x="470" y="86" width="400" height="36" rx="12" fill="rgba(167,139,250,0.08)"/>
  <rect x="470" y="106" width="400" height="16" fill="rgba(167,139,250,0.08)"/>
  <text x="490" y="110" font-size="13" font-weight="700" fill="#a78bfa" letter-spacing="0.04em">YAML</text>
  <text x="850" y="110" font-size="11" fill="#3d3356" text-anchor="end">YAML Ain't Markup Language</text>

  <!-- YAML code -->
  <text x="490" y="140" font-size="10.5" fill="#7a6d84" font-family="monospace">---  # document start marker (optional)</text>
  <text x="490" y="158" font-size="10.5" fill="#e2e2e2" font-family="monospace"><tspan fill="#a78bfa">name</tspan>: Jane Smith</text>
  <text x="490" y="176" font-size="10.5" fill="#e2e2e2" font-family="monospace"><tspan fill="#a78bfa">age</tspan>: <tspan fill="#f97316">32</tspan></text>
  <text x="490" y="194" font-size="10.5" fill="#e2e2e2" font-family="monospace"><tspan fill="#a78bfa">active</tspan>: <tspan fill="#a78bfa">true</tspan></text>
  <text x="490" y="212" font-size="10.5" fill="#e2e2e2" font-family="monospace"><tspan fill="#a78bfa">score</tspan>: <tspan fill="#7a6d84">null</tspan></text>
  <text x="490" y="230" font-size="10.5" fill="#e2e2e2" font-family="monospace"><tspan fill="#a78bfa">tags</tspan>:</text>
  <text x="490" y="248" font-size="10.5" fill="#34d399" font-family="monospace">  - admin</text>
  <text x="490" y="266" font-size="10.5" fill="#34d399" font-family="monospace">  - editor</text>
  <text x="490" y="302" font-size="10.5" fill="#e2e2e2" font-family="monospace"><tspan fill="#a78bfa">address</tspan>:</text>
  <text x="490" y="320" font-size="10.5" fill="#e2e2e2" font-family="monospace">  <tspan fill="#a78bfa">city</tspan>: Berlin</text>
  <text x="490" y="338" font-size="10.5" fill="#e2e2e2" font-family="monospace">  <tspan fill="#a78bfa">zip</tspan>: <tspan fill="#34d399">'10115'</tspan>  <tspan fill="#7a6d84"># quoted → string</tspan></text>

  <text x="490" y="410" font-size="10" fill="#3d3356">Keys unquoted · Indentation = structure</text>
  <text x="490" y="428" font-size="10" fill="#3d3356">Comments with # · Human-readable</text>
  <text x="490" y="446" font-size="10" fill="#3d3356">Lists use dashes · Nesting via spaces</text>
</svg>
