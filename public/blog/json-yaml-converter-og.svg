<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Segoe UI',sans-serif">
  <defs>
    <radialGradient id="bg" cx="40%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0f0825"/>
      <stop offset="100%" stop-color="#05030d"/>
    </radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <radialGradient id="g1" cx="30%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#5b21b6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="350" cy="315" rx="400" ry="300" fill="url(#g1)"/>
  <rect x="60" y="60" width="148" height="28" rx="14" fill="rgba(167,139,250,0.15)" stroke="rgba(167,139,250,0.3)" stroke-width="1"/>
  <text x="134" y="79" font-size="11" font-weight="700" fill="#a78bfa" text-anchor="middle" letter-spacing="0.06em">DEVELOPER TOOLS</text>
  <text x="60" y="138" font-size="50" font-weight="900" fill="#e2e2e2" letter-spacing="-2">JSON ↔ YAML</text>
  <text x="60" y="192" font-size="50" font-weight="900" fill="#e2e2e2" letter-spacing="-2">Converter</text>
  <text x="60" y="246" font-size="22" fill="#7a6d84">Bidirectional conversion · Comments preserved</text>
  <text x="60" y="278" font-size="22" fill="#7a6d84">Type-safe · Norway-problem aware</text>
  <rect x="60" y="314" width="148" height="66" rx="12" fill="rgba(167,139,250,0.08)" stroke="rgba(167,139,250,0.2)" stroke-width="1"/>
  <text x="134" y="356" font-size="28" font-weight="900" fill="url(#aG)" text-anchor="middle">2-way</text>
  <text x="134" y="372" font-size="11" fill="#5a4d7a" text-anchor="middle">conversion</text>
  <rect x="226" y="314" width="148" height="66" rx="12" fill="rgba(76,215,246,0.08)" stroke="rgba(76,215,246,0.2)" stroke-width="1"/>
  <text x="300" y="356" font-size="28" font-weight="900" fill="#4cd7f6" text-anchor="middle">6</text>
  <text x="300" y="372" font-size="11" fill="#5a4d7a" text-anchor="middle">data types</text>
  <rect x="392" y="314" width="148" height="66" rx="12" fill="rgba(52,211,153,0.08)" stroke="rgba(52,211,153,0.2)" stroke-width="1"/>
  <text x="466" y="356" font-size="28" font-weight="900" fill="#34d399" text-anchor="middle">Free</text>
  <text x="466" y="372" font-size="11" fill="#5a4d7a" text-anchor="middle">browser-side</text>
  <rect x="60" y="406" width="370" height="36" rx="18" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="245" y="429" font-size="13" fill="#4d4354" text-anchor="middle">toolnestai.net/developer-tools/json-yaml-converter</text>
  <!-- Right: code comparison -->
  <rect x="660" y="60" width="480" height="510" rx="16" fill="rgba(255,255,255,0.03)" stroke="rgba(167,139,250,0.2)" stroke-width="1"/>
  <!-- JSON half -->
  <rect x="660" y="60" width="240" height="510" rx="16" fill="rgba(96,165,250,0.04)" stroke="none"/>
  <rect x="660" y="60" width="240" height="40" rx="16" fill="rgba(96,165,250,0.1)"/>
  <text x="780" y="85" font-size="13" font-weight="700" fill="#60a5fa" text-anchor="middle">JSON</text>
  <!-- YAML half -->
  <rect x="900" y="60" width="240" height="40" rx="16" fill="rgba(167,139,250,0.1)"/>
  <text x="1020" y="85" font-size="13" font-weight="700" fill="#a78bfa" text-anchor="middle">YAML</text>
  <!-- divider -->
  <line x1="900" y1="60" x2="900" y2="570" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <!-- JSON content -->
  <text x="678" y="120" font-size="9" fill="#60a5fa" font-family="monospace">{</text>
  <text x="678" y="138" font-size="9" fill="#e2e2e2" font-family="monospace">  "name": "Jane",</text>
  <text x="678" y="156" font-size="9" fill="#e2e2e2" font-family="monospace">  "age": 32,</text>
  <text x="678" y="174" font-size="9" fill="#e2e2e2" font-family="monospace">  "active": true,</text>
  <text x="678" y="192" font-size="9" fill="#e2e2e2" font-family="monospace">  "score": null,</text>
  <text x="678" y="210" font-size="9" fill="#e2e2e2" font-family="monospace">  "tags": [</text>
  <text x="678" y="228" font-size="9" fill="#34d399" font-family="monospace">    "admin",</text>
  <text x="678" y="246" font-size="9" fill="#34d399" font-family="monospace">    "editor"</text>
  <text x="678" y="264" font-size="9" fill="#e2e2e2" font-family="monospace">  ],</text>
  <text x="678" y="282" font-size="9" fill="#e2e2e2" font-family="monospace">  "address": {</text>
  <text x="678" y="300" font-size="9" fill="#e2e2e2" font-family="monospace">    "city": "Berlin",</text>
  <text x="678" y="318" font-size="9" fill="#e2e2e2" font-family="monospace">    "zip": "10115"</text>
  <text x="678" y="336" font-size="9" fill="#e2e2e2" font-family="monospace">  }</text>
  <text x="678" y="354" font-size="9" fill="#60a5fa" font-family="monospace">}</text>
  <!-- YAML content -->
  <text x="918" y="120" font-size="9" fill="#7a6d84" font-family="monospace">---</text>
  <text x="918" y="138" font-size="9" fill="#e2e2e2" font-family="monospace">name: Jane</text>
  <text x="918" y="156" font-size="9" fill="#e2e2e2" font-family="monospace">age: 32</text>
  <text x="918" y="174" font-size="9" fill="#e2e2e2" font-family="monospace">active: true</text>
  <text x="918" y="192" font-size="9" fill="#7a6d84" font-family="monospace">score: null</text>
  <text x="918" y="210" font-size="9" fill="#e2e2e2" font-family="monospace">tags:</text>
  <text x="918" y="228" font-size="9" fill="#34d399" font-family="monospace">  - admin</text>
  <text x="918" y="246" font-size="9" fill="#34d399" font-family="monospace">  - editor</text>
  <text x="918" y="282" font-size="9" fill="#e2e2e2" font-family="monospace">address:</text>
  <text x="918" y="300" font-size="9" fill="#e2e2e2" font-family="monospace">  city: Berlin</text>
  <text x="918" y="318" font-size="9" fill="#e2e2e2" font-family="monospace">  zip: '10115'</text>
  <!-- Arrow between panels -->
  <text x="900" y="280" font-size="20" text-anchor="middle" fill="url(#aG)">⇄</text>
  <!-- Logo -->
  <text x="60" y="578" font-size="16" font-weight="800" fill="url(#aG)">ToolNest AI</text>
  <text x="60" y="598" font-size="11" fill="#3d3356">toolnestai.net · Free JSON ↔ YAML Converter</text>
</svg>
