<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <radialGradient id="gC" cx="50%" cy="40%" r="60%"><stop offset="0%" stop-color="#0e7490" stop-opacity="0.2"/><stop offset="100%" stop-color="#0e7490" stop-opacity="0"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
  </defs>
  <rect width="900" height="460" fill="url(#bg)"/>
  <ellipse cx="450" cy="230" rx="520" ry="320" fill="url(#gC)"/>

  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="900" fill="url(#aG)">Case-Sensitive vs Case-Insensitive Deduplication</text>
  <text x="450" y="54" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.38)">Choosing the wrong mode silently keeps (or removes) entries you didn't intend</text>

  <!-- Case-sensitive -->
  <rect x="28" y="70" width="410" height="150" rx="10" fill="rgba(103,232,249,0.06)" stroke="rgba(103,232,249,0.2)" stroke-width="1"/>
  <text x="233" y="94" text-anchor="middle" font-size="12" font-weight="700" fill="#67e8f9">Case-Sensitive Mode</text>
  <text x="44" y="118" font-family="monospace" font-size="10.5" fill="rgba(255,255,255,0.6)">"Apple" and "apple" → kept separately</text>
  <text x="44" y="140" font-size="9.5" fill="rgba(255,255,255,0.55)">Use when case carries meaning — code</text>
  <text x="44" y="156" font-size="9.5" fill="rgba(255,255,255,0.55)">identifiers, exact string matching, case-</text>
  <text x="44" y="172" font-size="9.5" fill="rgba(255,255,255,0.55)">sensitive database keys or config values.</text>
  <text x="44" y="196" font-size="8.5" fill="rgba(255,255,255,0.3)">Risk: "Bob@email.com" and "bob@email.com" survive</text>
  <text x="44" y="210" font-size="8.5" fill="rgba(255,255,255,0.3)">as two "different" entries even though same person</text>

  <!-- Case-insensitive -->
  <rect x="462" y="70" width="410" height="150" rx="10" fill="rgba(52,211,153,0.06)" stroke="rgba(52,211,153,0.2)" stroke-width="1"/>
  <text x="667" y="94" text-anchor="middle" font-size="12" font-weight="700" fill="#6ee7b7">Case-Insensitive Mode</text>
  <text x="478" y="118" font-family="monospace" font-size="10.5" fill="rgba(255,255,255,0.6)">"Apple" and "apple" → treated as duplicate</text>
  <text x="478" y="140" font-size="9.5" fill="rgba(255,255,255,0.55)">Use for most real-world lists — email</text>
  <text x="478" y="156" font-size="9.5" fill="rgba(255,255,255,0.55)">addresses, names, tags, categories where</text>
  <text x="478" y="172" font-size="9.5" fill="rgba(255,255,255,0.55)">capitalization is incidental, not meaningful.</text>
  <text x="478" y="196" font-size="8.5" fill="rgba(255,255,255,0.3)">Risk: could merge two genuinely distinct values</text>
  <text x="478" y="210" font-size="8.5" fill="rgba(255,255,255,0.3)">if case actually matters for your specific data</text>

  <!-- Use case grid -->
  <rect x="28" y="232" width="270" height="100" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(124,58,237,0.15)" stroke-width="1"/>
  <text x="44" y="252" font-size="10" font-weight="700" fill="#a78bfa">📧 Email list cleanup</text>
  <text x="44" y="270" font-size="9" fill="rgba(255,255,255,0.5)">Merge signup lists from</text>
  <text x="44" y="284" font-size="9" fill="rgba(255,255,255,0.5)">multiple sources before</text>
  <text x="44" y="298" font-size="9" fill="rgba(255,255,255,0.5)">a newsletter send</text>
  <text x="44" y="318" font-size="8" fill="rgba(255,255,255,0.3)">→ case-insensitive recommended</text>

  <rect x="314" y="232" width="270" height="100" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(14,116,144,0.15)" stroke-width="1"/>
  <text x="330" y="252" font-size="10" font-weight="700" fill="#67e8f9">📊 CSV / spreadsheet data</text>
  <text x="330" y="270" font-size="9" fill="rgba(255,255,255,0.5)">Remove duplicate rows</text>
  <text x="330" y="284" font-size="9" fill="rgba(255,255,255,0.5)">exported from different</text>
  <text x="330" y="298" font-size="9" fill="rgba(255,255,255,0.5)">systems before import</text>
  <text x="330" y="318" font-size="8" fill="rgba(255,255,255,0.3)">→ depends on data — check first</text>

  <rect x="600" y="232" width="272" height="100" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(16,185,129,0.15)" stroke-width="1"/>
  <text x="616" y="252" font-size="10" font-weight="700" fill="#34d399">🖥 Server log analysis</text>
  <text x="616" y="270" font-size="9" fill="rgba(255,255,255,0.5)">Find unique IP addresses</text>
  <text x="616" y="284" font-size="9" fill="rgba(255,255,255,0.5)">or error messages from</text>
  <text x="616" y="298" font-size="9" fill="rgba(255,255,255,0.5)">a raw log dump</text>
  <text x="616" y="318" font-size="8" fill="rgba(255,255,255,0.3)">→ case-sensitive recommended</text>

  <!-- Keep first vs last -->
  <rect x="28" y="344" width="844" height="92" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="450" y="366" text-anchor="middle" font-size="10" font-weight="700" fill="rgba(255,255,255,0.4)">KEEP FIRST vs KEEP LAST OCCURRENCE</text>
  <text x="450" y="388" text-anchor="middle" font-size="9.5" fill="rgba(255,255,255,0.55)">Keep First: preserves the original order a value first appeared — good for chronological lists.</text>
  <text x="450" y="406" text-anchor="middle" font-size="9.5" fill="rgba(255,255,255,0.55)">Keep Last: useful when later entries represent updated/corrected versions of the same key.</text>
  <text x="450" y="424" text-anchor="middle" font-size="8.5" fill="rgba(255,255,255,0.3)">Both approaches preserve the relative order of remaining unique lines</text>

  <text x="450" y="450" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.2)">toolnestai.net/text-tools/remove-duplicate-lines</text>
</svg>
