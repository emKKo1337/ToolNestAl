<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="30%" cy="40%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <radialGradient id="gL" cx="15%" cy="50%" r="55%"><stop offset="0%" stop-color="#5b21b6" stop-opacity="0.45"/><stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/></radialGradient>
    <radialGradient id="gR" cx="85%" cy="50%" r="55%"><stop offset="0%" stop-color="#0e7490" stop-opacity="0.28"/><stop offset="100%" stop-color="#0e7490" stop-opacity="0"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="bG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient>
    <linearGradient id="lapG" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1a1040"/><stop offset="100%" stop-color="#0d0824"/></linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#5b21b6" flood-opacity="0.5"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="180" cy="315" rx="600" ry="500" fill="url(#gL)"/>
  <ellipse cx="1020" cy="315" rx="600" ry="500" fill="url(#gR)"/>
  <text x="60" y="70" font-size="14" font-weight="700" fill="url(#aG)" filter="url(#glow)">ToolNest AI</text>
  <text x="60" y="106" font-size="13" fill="rgba(255,255,255,0.35)">Image Tools › Image Sharpen</text>
  <text x="60" y="185" font-size="46" font-weight="900" fill="url(#aG)" filter="url(#glow)">Image</text>
  <text x="60" y="245" font-size="46" font-weight="900" fill="url(#aG)" filter="url(#glow)">Sharpen</text>
  <text x="60" y="300" font-size="18" fill="rgba(255,255,255,0.6)">Unsharp mask · Laplacian</text>
  <text x="60" y="328" font-size="18" fill="rgba(255,255,255,0.6)">Free, private, instant</text>
  <rect x="60" y="358" width="130" height="52" rx="8" fill="rgba(124,58,237,0.2)" stroke="rgba(124,58,237,0.4)" stroke-width="1"/>
  <text x="125" y="382" text-anchor="middle" font-size="11" font-weight="900" fill="#a78bfa">Unsharp Mask</text>
  <text x="125" y="400" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">natural result</text>
  <rect x="200" y="358" width="130" height="52" rx="8" fill="rgba(14,116,144,0.15)" stroke="rgba(14,116,144,0.35)" stroke-width="1"/>
  <text x="265" y="382" text-anchor="middle" font-size="11" font-weight="900" fill="#67e8f9">Laplacian</text>
  <text x="265" y="400" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">crisp edges</text>
  <rect x="340" y="358" width="130" height="52" rx="8" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
  <text x="405" y="382" text-anchor="middle" font-size="11" font-weight="900" fill="#34d399">High Pass</text>
  <text x="405" y="400" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">layer method</text>
  <text x="60" y="560" font-size="14" fill="rgba(255,255,255,0.25)">toolnestai.net/image-tools/image-sharpen</text>
  <!-- right panel -->
  <rect x="630" y="60" width="530" height="490" rx="16" fill="url(#lapG)" stroke="rgba(124,58,237,0.3)" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="630" y="60" width="530" height="36" rx="16" fill="rgba(255,255,255,0.05)"/>
  <rect x="630" y="78" width="530" height="18" fill="rgba(255,255,255,0.02)"/>
  <circle cx="655" cy="78" r="6" fill="rgba(239,68,68,0.6)"/>
  <circle cx="675" cy="78" r="6" fill="rgba(251,191,36,0.6)"/>
  <circle cx="695" cy="78" r="6" fill="rgba(34,197,94,0.6)"/>
  <!-- USM formula box -->
  <rect x="648" y="108" width="490" height="80" rx="8" fill="rgba(167,139,250,0.06)" stroke="rgba(167,139,250,0.15)" stroke-width="1"/>
  <text x="893" y="134" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.3)">Unsharp Mask Formula</text>
  <text x="893" y="158" text-anchor="middle" font-size="11" font-family="monospace" fill="rgba(167,139,250,0.8)">output = original + amount × (original − blur)</text>
  <text x="893" y="178" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.25)">Subtracts blurred copy, boosts the difference (edges)</text>
  <!-- Laplacian kernel -->
  <rect x="648" y="204" width="228" height="110" rx="8" fill="rgba(52,211,153,0.05)" stroke="rgba(52,211,153,0.15)" stroke-width="1"/>
  <text x="762" y="226" text-anchor="middle" font-size="9" fill="rgba(52,211,153,0.6)">Laplacian kernel</text>
  <text x="762" y="250" text-anchor="middle" font-family="monospace" font-size="11" fill="rgba(52,211,153,0.7)"> 0  -1   0</text>
  <text x="762" y="268" text-anchor="middle" font-family="monospace" font-size="11" fill="rgba(52,211,153,0.9)">-1   5  -1</text>
  <text x="762" y="286" text-anchor="middle" font-family="monospace" font-size="11" fill="rgba(52,211,153,0.7)"> 0  -1   0</text>
  <text x="762" y="304" text-anchor="middle" font-size="8.5" fill="rgba(255,255,255,0.25)">sum = 1, flat areas unchanged</text>
  <!-- settings -->
  <rect x="892" y="204" width="246" height="110" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="906" y="226" font-size="9" fill="rgba(255,255,255,0.3)">Amount: 150%</text>
  <rect x="906" y="234" width="210" height="4" rx="2" fill="rgba(255,255,255,0.05)"/>
  <rect x="906" y="234" width="150" height="4" rx="2" fill="url(#aG)"/>
  <text x="906" y="258" font-size="9" fill="rgba(255,255,255,0.3)">Radius: 1.5px</text>
  <rect x="906" y="266" width="210" height="4" rx="2" fill="rgba(255,255,255,0.05)"/>
  <rect x="906" y="266" width="90" height="4" rx="2" fill="url(#aG)"/>
  <text x="906" y="290" font-size="9" fill="rgba(255,255,255,0.3)">Threshold: 3</text>
  <rect x="906" y="298" width="210" height="4" rx="2" fill="rgba(255,255,255,0.05)"/>
  <rect x="906" y="298" width="40" height="4" rx="2" fill="url(#aG)"/>
  <rect x="648" y="330" width="490" height="36" rx="8" fill="url(#bG)" filter="url(#sh)"/>
  <text x="893" y="352" text-anchor="middle" font-size="12" font-weight="900" fill="#fff">Sharpen Image Free</text>
  <rect x="620" y="550" width="560" height="14" rx="4" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
</svg>
