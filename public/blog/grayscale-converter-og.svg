<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="30%" cy="40%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <radialGradient id="gL" cx="15%" cy="50%" r="55%"><stop offset="0%" stop-color="#5b21b6" stop-opacity="0.45"/><stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/></radialGradient>
    <radialGradient id="gR" cx="85%" cy="50%" r="55%"><stop offset="0%" stop-color="#0e7490" stop-opacity="0.28"/><stop offset="100%" stop-color="#0e7490" stop-opacity="0"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="bG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient>
    <linearGradient id="lapG" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1a1040"/><stop offset="100%" stop-color="#0d0824"/></linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#5b21b6" flood-opacity="0.5"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="grayscale"><feColorMatrix type="saturate" values="0"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="180" cy="315" rx="600" ry="500" fill="url(#gL)"/>
  <ellipse cx="1020" cy="315" rx="600" ry="500" fill="url(#gR)"/>
  <text x="60" y="70" font-size="14" font-weight="700" fill="url(#aG)" filter="url(#glow)">ToolNest AI</text>
  <text x="60" y="106" font-size="13" fill="rgba(255,255,255,0.35)">Image Tools › Grayscale Converter</text>
  <text x="60" y="185" font-size="40" font-weight="900" fill="url(#aG)" filter="url(#glow)">Grayscale</text>
  <text x="60" y="238" font-size="40" font-weight="900" fill="url(#aG)" filter="url(#glow)">Converter</text>
  <text x="60" y="290" font-size="17" fill="rgba(255,255,255,0.6)">Luminance · BT.601 · BT.709</text>
  <text x="60" y="318" font-size="17" fill="rgba(255,255,255,0.6)">Free, private, instant</text>
  <rect x="60" y="348" width="125" height="52" rx="8" fill="rgba(124,58,237,0.2)" stroke="rgba(124,58,237,0.4)" stroke-width="1"/>
  <text x="122" y="372" text-anchor="middle" font-size="11" font-weight="900" fill="#a78bfa">Luminance</text>
  <text x="122" y="390" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">most accurate</text>
  <rect x="195" y="348" width="125" height="52" rx="8" fill="rgba(14,116,144,0.15)" stroke="rgba(14,116,144,0.35)" stroke-width="1"/>
  <text x="257" y="372" text-anchor="middle" font-size="11" font-weight="900" fill="#67e8f9">Channel</text>
  <text x="257" y="390" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">R / G / B</text>
  <rect x="330" y="348" width="125" height="52" rx="8" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
  <text x="392" y="372" text-anchor="middle" font-size="11" font-weight="900" fill="#34d399">Private</text>
  <text x="392" y="390" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">no upload</text>
  <text x="60" y="555" font-size="14" fill="rgba(255,255,255,0.25)">toolnestai.net/image-tools/grayscale-converter</text>
  <!-- right panel -->
  <rect x="630" y="60" width="530" height="490" rx="16" fill="url(#lapG)" stroke="rgba(124,58,237,0.3)" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="630" y="60" width="530" height="36" rx="16" fill="rgba(255,255,255,0.05)"/>
  <rect x="630" y="78" width="530" height="18" fill="rgba(255,255,255,0.02)"/>
  <circle cx="655" cy="78" r="6" fill="rgba(239,68,68,0.6)"/>
  <circle cx="675" cy="78" r="6" fill="rgba(251,191,36,0.6)"/>
  <circle cx="695" cy="78" r="6" fill="rgba(34,197,94,0.6)"/>
  <!-- Formulas box -->
  <rect x="648" y="108" width="490" height="170" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="660" y="130" font-size="9" fill="rgba(255,255,255,0.25)">Method comparison — same pixel (R=200, G=100, B=50)</text>
  <text x="660" y="158" font-size="9.5" font-family="monospace" fill="rgba(255,255,255,0.55)">Average:    (200+100+50)/3 = 117</text>
  <text x="660" y="180" font-size="9.5" font-family="monospace" fill="rgba(103,232,249,0.7)">BT.601:     0.299×200 + 0.587×100 + 0.114×50 = 123</text>
  <text x="660" y="202" font-size="9.5" font-family="monospace" fill="rgba(167,139,250,0.85)">BT.709:     0.2126×200 + 0.7152×100 + 0.0722×50 = 118</text>
  <text x="660" y="224" font-size="9.5" font-family="monospace" fill="rgba(52,211,153,0.7)">Red only:   200</text>
  <text x="660" y="246" font-size="9.5" font-family="monospace" fill="rgba(52,211,153,0.5)">Green only: 100</text>
  <text x="660" y="268" font-size="9.5" font-family="monospace" fill="rgba(52,211,153,0.4)">Blue only:  50</text>
  <!-- 3 colored bars showing different gray values -->
  <rect x="648" y="296" width="156" height="80" rx="6" fill="rgba(255,255,255,0.09)"/>
  <text x="726" y="344" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.5)">Average → 117</text>
  <rect x="816" y="296" width="156" height="80" rx="6" fill="rgba(255,255,255,0.14)"/>
  <text x="894" y="344" text-anchor="middle" font-size="9" fill="rgba(167,139,250,0.7)">BT.709 → 118</text>
  <rect x="984" y="296" width="154" height="80" rx="6" fill="rgba(255,255,255,0.22)"/>
  <text x="1061" y="344" text-anchor="middle" font-size="9" fill="rgba(52,211,153,0.7)">Red → 200</text>
  <rect x="648" y="392" width="490" height="36" rx="8" fill="url(#bG)" filter="url(#sh)"/>
  <text x="893" y="414" text-anchor="middle" font-size="12" font-weight="900" fill="#fff">Convert to Grayscale Free</text>
  <rect x="620" y="550" width="560" height="14" rx="4" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
</svg>
