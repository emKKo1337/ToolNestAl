<svg viewBox="0 0 900 1200" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <radialGradient id="gT" cx="50%" cy="10%" r="60%"><stop offset="0%" stop-color="#5b21b6" stop-opacity="0.35"/><stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/></radialGradient>
    <radialGradient id="gB" cx="50%" cy="90%" r="60%"><stop offset="0%" stop-color="#0e7490" stop-opacity="0.2"/><stop offset="100%" stop-color="#0e7490" stop-opacity="0"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="bG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient>
  </defs>
  <rect width="900" height="1200" fill="url(#bg)"/>
  <ellipse cx="450" cy="200" rx="700" ry="400" fill="url(#gT)"/>
  <ellipse cx="450" cy="1000" rx="700" ry="400" fill="url(#gB)"/>

  <text x="450" y="52" text-anchor="middle" font-size="28" font-weight="900" fill="url(#aG)">The Complete Hashing Guide</text>
  <text x="450" y="76" text-anchor="middle" font-size="13" fill="rgba(255,255,255,0.38)">Everything you need to know about cryptographic hash functions</text>
  <text x="450" y="94" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.22)">toolnestai.net/developer-tools/hash-generator</text>

  <!-- Section 1 -->
  <rect x="32" y="110" width="836" height="38" rx="8" fill="rgba(124,58,237,0.18)" stroke="rgba(124,58,237,0.3)" stroke-width="1"/>
  <text x="450" y="134" text-anchor="middle" font-size="15" font-weight="800" fill="#a78bfa">01 — What Is a Hash Function?</text>

  <rect x="32" y="154" width="836" height="90" rx="10" fill="rgba(255,255,255,0.025)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="450" y="178" text-anchor="middle" font-size="12" fill="rgba(255,255,255,0.65)">A cryptographic hash function takes an input of any size and produces a fixed-size</text>
  <text x="450" y="198" text-anchor="middle" font-size="12" fill="rgba(255,255,255,0.65)">output called a digest or hash. The same input always produces the same output,</text>
  <text x="450" y="218" text-anchor="middle" font-size="12" fill="rgba(255,255,255,0.65)">but it is computationally infeasible to reverse the process or find a matching input.</text>
  <text x="450" y="238" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.3)">Used for password storage, file integrity verification, digital signatures, and deduplication.</text>

  <!-- Section 2: Algorithm comparison -->
  <rect x="32" y="256" width="836" height="38" rx="8" fill="rgba(14,116,144,0.18)" stroke="rgba(14,116,144,0.3)" stroke-width="1"/>
  <text x="450" y="280" text-anchor="middle" font-size="15" font-weight="800" fill="#67e8f9">02 — Algorithm Comparison</text>

  <g font-size="10">
    <rect x="32" y="300" width="404" height="90" rx="8" fill="rgba(239,68,68,0.06)" stroke="rgba(239,68,68,0.16)" stroke-width="1"/>
    <text x="48" y="322" font-weight="700" fill="#fca5a5">MD5 — 128-bit (BROKEN)</text>
    <text x="48" y="340" fill="rgba(255,255,255,0.5)">Collisions demonstrated in 2004.</text>
    <text x="48" y="356" fill="rgba(255,255,255,0.5)">Never use for security purposes.</text>
    <text x="48" y="378" fill="rgba(255,255,255,0.3)">OK for: non-security checksums only</text>

    <rect x="464" y="300" width="404" height="90" rx="8" fill="rgba(251,191,36,0.07)" stroke="rgba(251,191,36,0.18)" stroke-width="1"/>
    <text x="480" y="322" font-weight="700" fill="#fde047">SHA-1 — 160-bit (DEPRECATED)</text>
    <text x="480" y="340" fill="rgba(255,255,255,0.5)">Practical collision shown by Google</text>
    <text x="480" y="356" fill="rgba(255,255,255,0.5)">in 2017 ("SHAttered" attack).</text>
    <text x="480" y="378" fill="rgba(255,255,255,0.3)">OK for: legacy Git object hashing only</text>

    <rect x="32" y="398" width="404" height="90" rx="8" fill="rgba(52,211,153,0.06)" stroke="rgba(52,211,153,0.16)" stroke-width="1"/>
    <text x="48" y="420" font-weight="700" fill="#6ee7b7">SHA-256 — 256-bit (RECOMMENDED)</text>
    <text x="48" y="438" fill="rgba(255,255,255,0.5)">Part of the SHA-2 family. No known</text>
    <text x="48" y="454" fill="rgba(255,255,255,0.5)">practical attacks. Widely adopted.</text>
    <text x="48" y="476" fill="rgba(255,255,255,0.3)">Use for: file integrity, general hashing</text>

    <rect x="464" y="398" width="404" height="90" rx="8" fill="rgba(103,232,249,0.07)" stroke="rgba(103,232,249,0.18)" stroke-width="1"/>
    <text x="480" y="420" font-weight="700" fill="#67e8f9">SHA-512 — 512-bit (HIGH SECURITY)</text>
    <text x="480" y="438" fill="rgba(255,255,255,0.5)">Larger output, bigger security margin.</text>
    <text x="480" y="454" fill="rgba(255,255,255,0.5)">Faster than SHA-256 on 64-bit CPUs.</text>
    <text x="480" y="476" fill="rgba(255,255,255,0.3)">Use for: maximum resistance scenarios</text>
  </g>

  <!-- Section 3: Required properties -->
  <rect x="32" y="504" width="836" height="38" rx="8" fill="rgba(16,185,129,0.14)" stroke="rgba(16,185,129,0.25)" stroke-width="1"/>
  <text x="450" y="528" text-anchor="middle" font-size="15" font-weight="800" fill="#34d399">03 — 4 Required Properties</text>

  <g text-anchor="middle" font-size="10">
    <rect x="32" y="548" width="196" height="90" rx="10" fill="rgba(124,58,237,0.1)" stroke="rgba(124,58,237,0.22)" stroke-width="1"/>
    <text x="130" y="576" font-size="13" font-weight="900" fill="#a78bfa">Deterministic</text>
    <text x="130" y="596" fill="rgba(255,255,255,0.5)">Same input always</text>
    <text x="130" y="612" fill="rgba(255,255,255,0.5)">produces same hash</text>

    <rect x="238" y="548" width="196" height="90" rx="10" fill="rgba(14,116,144,0.08)" stroke="rgba(14,116,144,0.2)" stroke-width="1"/>
    <text x="336" y="576" font-size="13" font-weight="900" fill="#67e8f9">Pre-image resistant</text>
    <text x="336" y="596" fill="rgba(255,255,255,0.5)">Can't reverse hash</text>
    <text x="336" y="612" fill="rgba(255,255,255,0.5)">back to input</text>

    <rect x="444" y="548" width="196" height="90" rx="10" fill="rgba(16,185,129,0.07)" stroke="rgba(16,185,129,0.18)" stroke-width="1"/>
    <text x="542" y="576" font-size="13" font-weight="900" fill="#34d399">Avalanche effect</text>
    <text x="542" y="596" fill="rgba(255,255,255,0.5)">1 bit change →</text>
    <text x="542" y="612" fill="rgba(255,255,255,0.5)">~50% output changes</text>

    <rect x="650" y="548" width="218" height="90" rx="10" fill="rgba(251,191,36,0.07)" stroke="rgba(251,191,36,0.18)" stroke-width="1"/>
    <text x="759" y="576" font-size="13" font-weight="900" fill="#fbbf24">Collision resistant</text>
    <text x="759" y="596" fill="rgba(255,255,255,0.5)">Infeasible to find</text>
    <text x="759" y="612" fill="rgba(255,255,255,0.5)">two matching inputs</text>
  </g>

  <!-- Section 4: Hashing vs encryption vs encoding -->
  <rect x="32" y="656" width="836" height="38" rx="8" fill="rgba(124,58,237,0.18)" stroke="rgba(124,58,237,0.3)" stroke-width="1"/>
  <text x="450" y="680" text-anchor="middle" font-size="15" font-weight="800" fill="#a78bfa">04 — Hashing vs Encryption vs Encoding</text>

  <g font-size="9.5">
    <rect x="32" y="700" width="268" height="70" rx="7" fill="rgba(255,255,255,0.02)" stroke="rgba(124,58,237,0.15)" stroke-width="1"/>
    <text x="48" y="720" font-weight="700" fill="#a78bfa">Hashing</text>
    <text x="48" y="736" fill="rgba(255,255,255,0.5)">One-way, no key. Used to verify</text>
    <text x="48" y="750" fill="rgba(255,255,255,0.5)">integrity or store password digests.</text>

    <rect x="314" y="700" width="268" height="70" rx="7" fill="rgba(255,255,255,0.02)" stroke="rgba(14,116,144,0.15)" stroke-width="1"/>
    <text x="330" y="720" font-weight="700" fill="#67e8f9">Encryption</text>
    <text x="330" y="736" fill="rgba(255,255,255,0.5)">Reversible with a key. Used to</text>
    <text x="330" y="750" fill="rgba(255,255,255,0.5)">protect confidentiality of data.</text>

    <rect x="596" y="700" width="272" height="70" rx="7" fill="rgba(255,255,255,0.02)" stroke="rgba(16,185,129,0.15)" stroke-width="1"/>
    <text x="612" y="720" font-weight="700" fill="#34d399">Encoding</text>
    <text x="612" y="736" fill="rgba(255,255,255,0.5)">Reversible, no key needed. Used</text>
    <text x="612" y="750" fill="rgba(255,255,255,0.5)">for safe data transmission format.</text>
  </g>

  <!-- Section 5: Use cases -->
  <rect x="32" y="786" width="836" height="38" rx="8" fill="rgba(14,116,144,0.18)" stroke="rgba(14,116,144,0.3)" stroke-width="1"/>
  <text x="450" y="810" text-anchor="middle" font-size="15" font-weight="800" fill="#67e8f9">05 — Real-World Use Cases</text>

  <g font-size="9.5">
    <rect x="32" y="830" width="268" height="70" rx="7" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    <text x="48" y="850" font-weight="700" fill="rgba(167,139,250,0.85)">📥 File Integrity</text>
    <text x="48" y="866" fill="rgba(255,255,255,0.5)">Verify a download matches the</text>
    <text x="48" y="880" fill="rgba(255,255,255,0.5)">publisher's official checksum.</text>

    <rect x="314" y="830" width="268" height="70" rx="7" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    <text x="330" y="850" font-weight="700" fill="rgba(103,232,249,0.85)">🔑 Password Storage</text>
    <text x="330" y="866" fill="rgba(255,255,255,0.5)">Store bcrypt/Argon2 hashes,</text>
    <text x="330" y="880" fill="rgba(255,255,255,0.5)">never plaintext passwords.</text>

    <rect x="596" y="830" width="272" height="70" rx="7" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    <text x="612" y="850" font-weight="700" fill="rgba(52,211,153,0.85)">🔗 Git Commit IDs</text>
    <text x="612" y="866" fill="rgba(255,255,255,0.5)">Every commit is identified by</text>
    <text x="612" y="880" fill="rgba(255,255,255,0.5)">a SHA-1 (moving to SHA-256) hash.</text>
  </g>

  <!-- Section 6: Common Mistakes -->
  <rect x="32" y="916" width="836" height="38" rx="8" fill="rgba(239,68,68,0.12)" stroke="rgba(239,68,68,0.22)" stroke-width="1"/>
  <text x="450" y="940" text-anchor="middle" font-size="15" font-weight="800" fill="rgba(239,68,68,0.85)">06 — Common Mistakes</text>

  <g font-size="10">
    <rect x="32" y="960" width="836" height="36" rx="7" fill="rgba(255,255,255,0.02)" stroke="rgba(239,68,68,0.1)" stroke-width="1"/>
    <text x="48" y="982" fill="rgba(239,68,68,0.7)">✗</text>
    <text x="68" y="982" fill="rgba(255,255,255,0.6)">Hashing passwords with plain SHA-256 instead of bcrypt/Argon2 — SHA-256 is too fast, enabling brute-force attacks.</text>
    <rect x="32" y="1000" width="836" height="36" rx="7" fill="rgba(255,255,255,0.02)" stroke="rgba(239,68,68,0.1)" stroke-width="1"/>
    <text x="48" y="1022" fill="rgba(239,68,68,0.7)">✗</text>
    <text x="68" y="1022" fill="rgba(255,255,255,0.6)">Using MD5 or SHA-1 for any security-sensitive purpose — both have demonstrated real-world collisions.</text>
    <rect x="32" y="1040" width="836" height="36" rx="7" fill="rgba(255,255,255,0.02)" stroke="rgba(239,68,68,0.1)" stroke-width="1"/>
    <text x="48" y="1062" fill="rgba(239,68,68,0.7)">✗</text>
    <text x="68" y="1062" fill="rgba(255,255,255,0.6)">Hashing passwords without a per-user salt — identical passwords produce identical hashes, enabling rainbow-table attacks.</text>
  </g>

  <text x="450" y="1100" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.28)">Free tool: toolnestai.net/developer-tools/hash-generator</text>
  <text x="450" y="1120" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.2)">MD5 · SHA-1 · SHA-256 · SHA-512 — text and file hashing, client-side, no upload</text>
</svg>
