<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <radialGradient id="gC" cx="50%" cy="40%" r="60%"><stop offset="0%" stop-color="#5b21b6" stop-opacity="0.2"/><stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
  </defs>
  <rect width="900" height="460" fill="url(#bg)"/>
  <ellipse cx="450" cy="230" rx="500" ry="320" fill="url(#gC)"/>

  <text x="450" y="38" text-anchor="middle" font-size="20" font-weight="900" fill="url(#aG)">Character Limits by Platform — Quick Reference</text>
  <text x="450" y="57" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.38)">Know the limits before you write — use the word counter to stay within them</text>

  <!-- Headers -->
  <rect x="28" y="68" width="210" height="22" rx="5" fill="rgba(124,58,237,0.15)" stroke="rgba(124,58,237,0.3)" stroke-width="1"/>
  <text x="133" y="83" text-anchor="middle" font-size="9" font-weight="700" fill="rgba(167,139,250,0.85)">Platform / Content Type</text>
  <rect x="244" y="68" width="80" height="22" rx="5" fill="rgba(124,58,237,0.15)" stroke="rgba(124,58,237,0.3)" stroke-width="1"/>
  <text x="284" y="83" text-anchor="middle" font-size="9" font-weight="700" fill="rgba(167,139,250,0.85)">Limit</text>
  <rect x="330" y="68" width="542" height="22" rx="5" fill="rgba(124,58,237,0.15)" stroke="rgba(124,58,237,0.3)" stroke-width="1"/>
  <text x="601" y="83" text-anchor="middle" font-size="9" font-weight="700" fill="rgba(167,139,250,0.85)">What it applies to &amp; tips</text>

  <!-- Row data: platform, limit, bar width (out of 538), colour, tip -->
  <!-- Twitter post -->
  <rect x="28" y="96" width="210" height="26" rx="5" fill="rgba(255,255,255,0.025)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="44" y="113" font-size="9" fill="rgba(255,255,255,0.7)">🐦  Twitter / X post</text>
  <rect x="244" y="96" width="80" height="26" rx="5" fill="rgba(255,255,255,0.025)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="284" y="113" text-anchor="middle" font-size="10" font-weight="700" fill="rgba(52,211,153,0.9)">280</text>
  <rect x="330" y="96" width="542" height="26" rx="5" fill="rgba(52,211,153,0.05)" stroke="rgba(52,211,153,0.1)" stroke-width="1"/>
  <rect x="336" y="100" width="54" height="18" rx="3" fill="rgba(52,211,153,0.25)"/>
  <text x="398" y="113" font-size="8.5" fill="rgba(255,255,255,0.55)">Per tweet. URLs count as 23 chars regardless of length. Thread posts each get 280.</text>

  <!-- Instagram caption -->
  <rect x="28" y="128" width="210" height="26" rx="5" fill="rgba(255,255,255,0.025)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="44" y="145" font-size="9" fill="rgba(255,255,255,0.7)">📸  Instagram caption</text>
  <rect x="244" y="128" width="80" height="26" rx="5" fill="rgba(255,255,255,0.025)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="284" y="145" text-anchor="middle" font-size="10" font-weight="700" fill="rgba(167,139,250,0.9)">2,200</text>
  <rect x="330" y="128" width="542" height="26" rx="5" fill="rgba(167,139,250,0.04)" stroke="rgba(167,139,250,0.08)" stroke-width="1"/>
  <rect x="336" y="132" width="422" height="18" rx="3" fill="rgba(167,139,250,0.18)"/>
  <text x="769" y="145" font-size="8.5" fill="rgba(255,255,255,0.55)">Only first 125 chars show before "more"</text>

  <!-- Facebook post -->
  <rect x="28" y="160" width="210" height="26" rx="5" fill="rgba(255,255,255,0.025)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="44" y="177" font-size="9" fill="rgba(255,255,255,0.7)">👥  Facebook post</text>
  <rect x="244" y="160" width="80" height="26" rx="5" fill="rgba(255,255,255,0.025)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="284" y="177" text-anchor="middle" font-size="10" font-weight="700" fill="rgba(96,165,250,0.9)">63,206</text>
  <rect x="330" y="160" width="542" height="26" rx="5" fill="rgba(96,165,250,0.04)" stroke="rgba(96,165,250,0.08)" stroke-width="1"/>
  <rect x="336" y="164" width="536" height="18" rx="3" fill="rgba(96,165,250,0.12)"/>
  <text x="346" y="177" font-size="8.5" fill="rgba(255,255,255,0.55)">Technically 63K but posts over 400 chars get truncated with "See more"</text>

  <!-- LinkedIn post -->
  <rect x="28" y="192" width="210" height="26" rx="5" fill="rgba(255,255,255,0.025)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="44" y="209" font-size="9" fill="rgba(255,255,255,0.7)">💼  LinkedIn post</text>
  <rect x="244" y="192" width="80" height="26" rx="5" fill="rgba(255,255,255,0.025)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="284" y="209" text-anchor="middle" font-size="10" font-weight="700" fill="rgba(251,191,36,0.9)">3,000</text>
  <rect x="330" y="192" width="542" height="26" rx="5" fill="rgba(251,191,36,0.04)" stroke="rgba(251,191,36,0.08)" stroke-width="1"/>
  <rect x="336" y="196" width="530" height="18" rx="3" fill="rgba(251,191,36,0.12)"/>
  <text x="346" y="209" font-size="8.5" fill="rgba(255,255,255,0.55)">Full post limit. First 210 chars visible before "see more". Optimal: 1,200–1,600.</text>

  <!-- Meta title -->
  <rect x="28" y="224" width="210" height="26" rx="5" fill="rgba(255,255,255,0.025)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="44" y="241" font-size="9" fill="rgba(255,255,255,0.7)">🔍  SEO title tag</text>
  <rect x="244" y="224" width="80" height="26" rx="5" fill="rgba(255,255,255,0.025)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="284" y="241" text-anchor="middle" font-size="10" font-weight="700" fill="rgba(239,68,68,0.9)">60</text>
  <rect x="330" y="224" width="542" height="26" rx="5" fill="rgba(239,68,68,0.05)" stroke="rgba(239,68,68,0.1)" stroke-width="1"/>
  <rect x="336" y="228" width="12" height="18" rx="3" fill="rgba(239,68,68,0.3)"/>
  <text x="356" y="241" font-size="8.5" fill="rgba(255,255,255,0.55)">Google truncates above ~60 chars (~580px). Aim for 50–60 for full display.</text>

  <!-- Meta description -->
  <rect x="28" y="256" width="210" height="26" rx="5" fill="rgba(255,255,255,0.025)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="44" y="273" font-size="9" fill="rgba(255,255,255,0.7)">🔍  SEO meta description</text>
  <rect x="244" y="256" width="80" height="26" rx="5" fill="rgba(255,255,255,0.025)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="284" y="273" text-anchor="middle" font-size="10" font-weight="700" fill="rgba(239,68,68,0.9)">160</text>
  <rect x="330" y="256" width="542" height="26" rx="5" fill="rgba(239,68,68,0.05)" stroke="rgba(239,68,68,0.1)" stroke-width="1"/>
  <rect x="336" y="260" width="30" height="18" rx="3" fill="rgba(239,68,68,0.25)"/>
  <text x="374" y="273" font-size="8.5" fill="rgba(255,255,255,0.55)">Google truncates above ~160 chars. Aim for 120–155 to avoid truncation.</text>

  <!-- YouTube description -->
  <rect x="28" y="288" width="210" height="26" rx="5" fill="rgba(255,255,255,0.025)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="44" y="305" font-size="9" fill="rgba(255,255,255,0.7)">▶  YouTube description</text>
  <rect x="244" y="288" width="80" height="26" rx="5" fill="rgba(255,255,255,0.025)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="284" y="305" text-anchor="middle" font-size="10" font-weight="700" fill="rgba(52,211,153,0.9)">5,000</text>
  <rect x="330" y="288" width="542" height="26" rx="5" fill="rgba(52,211,153,0.04)" stroke="rgba(52,211,153,0.08)" stroke-width="1"/>
  <rect x="336" y="292" width="536" height="18" rx="3" fill="rgba(52,211,153,0.1)"/>
  <text x="346" y="305" font-size="8.5" fill="rgba(255,255,255,0.55)">First 100–120 chars show under the video before "Show more". Use them wisely.</text>

  <!-- Blog post -->
  <rect x="28" y="320" width="210" height="26" rx="5" fill="rgba(255,255,255,0.025)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="44" y="337" font-size="9" fill="rgba(255,255,255,0.7)">📝  Blog post (SEO)</text>
  <rect x="244" y="320" width="80" height="26" rx="5" fill="rgba(255,255,255,0.025)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="284" y="337" text-anchor="middle" font-size="10" font-weight="700" fill="rgba(167,139,250,0.9)">1,500+</text>
  <rect x="330" y="320" width="542" height="26" rx="5" fill="rgba(167,139,250,0.04)" stroke="rgba(167,139,250,0.08)" stroke-width="1"/>
  <rect x="336" y="324" width="280" height="18" rx="3" fill="rgba(167,139,250,0.12)"/>
  <text x="624" y="337" font-size="8.5" fill="rgba(255,255,255,0.55)">Recommended minimum. Pillar content: 2,000–3,000+ words.</text>

  <!-- Amazon product title -->
  <rect x="28" y="352" width="210" height="26" rx="5" fill="rgba(255,255,255,0.025)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="44" y="369" font-size="9" fill="rgba(255,255,255,0.7)">🛒  Amazon product title</text>
  <rect x="244" y="352" width="80" height="26" rx="5" fill="rgba(255,255,255,0.025)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="284" y="369" text-anchor="middle" font-size="10" font-weight="700" fill="rgba(251,191,36,0.9)">200</text>
  <rect x="330" y="352" width="542" height="26" rx="5" fill="rgba(251,191,36,0.04)" stroke="rgba(251,191,36,0.08)" stroke-width="1"/>
  <rect x="336" y="356" width="38" height="18" rx="3" fill="rgba(251,191,36,0.2)"/>
  <text x="382" y="369" font-size="8.5" fill="rgba(255,255,255,0.55)">Hard cap at 200. Mobile shows only ~80 chars. Front-load key keywords.</text>

  <!-- Email subject -->
  <rect x="28" y="384" width="210" height="26" rx="5" fill="rgba(255,255,255,0.025)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="44" y="401" font-size="9" fill="rgba(255,255,255,0.7)">✉  Email subject line</text>
  <rect x="244" y="384" width="80" height="26" rx="5" fill="rgba(255,255,255,0.025)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="284" y="401" text-anchor="middle" font-size="10" font-weight="700" fill="rgba(96,165,250,0.9)">40–50</text>
  <rect x="330" y="384" width="542" height="26" rx="5" fill="rgba(96,165,250,0.04)" stroke="rgba(96,165,250,0.08)" stroke-width="1"/>
  <rect x="336" y="388" width="8" height="18" rx="3" fill="rgba(96,165,250,0.3)"/>
  <text x="352" y="401" font-size="8.5" fill="rgba(255,255,255,0.55)">Recommended for mobile. Most inboxes show 30–50 chars on mobile lock screen.</text>

  <text x="450" y="452" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.22)">toolnestai.net/calculators/word-counter</text>
</svg>
