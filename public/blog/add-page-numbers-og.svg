<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Add Page Numbers to PDF — free online tool">
  <defs>
    <radialGradient id="bg" cx="30%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#0f0825"/>
      <stop offset="100%" stop-color="#05030d"/>
    </radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="40" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="250" cy="315" rx="350" ry="250" fill="#5b21b6" opacity="0.12" filter="url(#glow)"/>
  <ellipse cx="1000" cy="200" rx="250" ry="180" fill="#0e7490" opacity="0.1" filter="url(#glow)"/>

  <text x="72" y="72" font-family="sans-serif" font-size="18" font-weight="800" fill="url(#aG)">ToolNest AI</text>
  <text x="72" y="96" font-family="sans-serif" font-size="13" fill="#4d4354">toolnestai.net/pdf-tools/add-page-numbers</text>

  <text x="72" y="190" font-family="sans-serif" font-size="52" font-weight="900" fill="#e2e2e2">Add Page Numbers</text>
  <text x="72" y="248" font-family="sans-serif" font-size="30" font-weight="900" fill="#e2e2e2">to PDF</text>
  <text x="72" y="300" font-family="sans-serif" font-size="20" fill="#9b8da8">Free online — no sign-up, no watermark</text>

  <rect x="72" y="330" width="150" height="32" rx="16" fill="#5b21b6" opacity="0.3"/>
  <text x="147" y="351" font-family="sans-serif" font-size="13" font-weight="700" fill="#a78bfa" text-anchor="middle">6 positions</text>
  <rect x="236" y="330" width="160" height="32" rx="16" fill="#0e7490" opacity="0.3"/>
  <text x="316" y="351" font-family="sans-serif" font-size="13" font-weight="700" fill="#4cd7f6" text-anchor="middle">5 number formats</text>
  <rect x="410" y="330" width="140" height="32" rx="16" fill="#374151" opacity="0.6"/>
  <text x="480" y="351" font-family="sans-serif" font-size="13" font-weight="700" fill="#9ca3af" text-anchor="middle">Custom start</text>

  <!-- PDF page mockups on the right -->
  <rect x="700" y="90" width="200" height="280" rx="10" fill="#1a1040" stroke="#2a1f4a" stroke-width="1.5"/>
  <rect x="720" y="110" width="160" height="8" rx="3" fill="#2a1f4a"/>
  <rect x="720" y="124" width="130" height="6" rx="3" fill="#1e1535"/>
  <rect x="720" y="136" width="145" height="6" rx="3" fill="#1e1535"/>
  <rect x="720" y="148" width="120" height="6" rx="3" fill="#1e1535"/>
  <text x="800" y="352" font-family="sans-serif" font-size="14" font-weight="700" fill="#a78bfa" text-anchor="middle">Page 1</text>

  <rect x="920" y="120" width="200" height="280" rx="10" fill="#1a1040" stroke="#2a1f4a" stroke-width="1.5"/>
  <rect x="940" y="140" width="160" height="8" rx="3" fill="#2a1f4a"/>
  <rect x="940" y="154" width="130" height="6" rx="3" fill="#1e1535"/>
  <rect x="940" y="166" width="145" height="6" rx="3" fill="#1e1535"/>
  <rect x="940" y="178" width="120" height="6" rx="3" fill="#1e1535"/>
  <text x="1020" y="382" font-family="sans-serif" font-size="14" font-weight="700" fill="#a78bfa" text-anchor="middle">Page 2</text>
