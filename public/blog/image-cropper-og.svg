  <rect x="630" y="60" width="530" height="490" rx="16" fill="url(#lapG)" stroke="rgba(124,58,237,0.3)" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="630" y="60" width="530" height="36" rx="16" fill="rgba(255,255,255,0.05)"/>
  <rect x="630" y="78" width="530" height="18" fill="rgba(255,255,255,0.02)"/>
  <circle cx="655" cy="78" r="6" fill="rgba(239,68,68,0.6)"/>
  <circle cx="675" cy="78" r="6" fill="rgba(251,191,36,0.6)"/>
  <circle cx="695" cy="78" r="6" fill="rgba(34,197,94,0.6)"/>
  <!-- Crop tool mockup -->
  <rect x="648" y="108" width="496" height="300" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="700" y="130" width="350" height="198" rx="4" fill="rgba(124,58,237,0.08)" stroke="#a78bfa" stroke-width="2" stroke-dasharray="6,4"/>
  <!-- Corner handles -->
  <rect x="696" y="126" width="12" height="12" rx="2" fill="#a78bfa"/>
  <rect x="1042" y="126" width="12" height="12" rx="2" fill="#a78bfa"/>
  <rect x="696" y="324" width="12" height="12" rx="2" fill="#a78bfa"/>
  <rect x="1042" y="324" width="12" height="12" rx="2" fill="#a78bfa"/>
  <!-- dim areas -->
  <rect x="648" y="108" width="52" height="300" fill="rgba(0,0,0,0.5)"/>
  <rect x="1050" y="108" width="94" height="300" fill="rgba(0,0,0,0.5)"/>
  <!-- Thirds grid lines inside crop -->
  <line x1="817" y1="130" x2="817" y2="328" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <line x1="933" y1="130" x2="933" y2="328" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <line x1="700" y1="196" x2="1050" y2="196" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <line x1="700" y1="262" x2="1050" y2="262" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="875" y="232" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.2)">1920 x 1080</text>
  <!-- Ratio selector -->
  <text x="650" y="432" font-size="8" fill="rgba(255,255,255,0.35)">RATIO</text>
  <rect x="648" y="438" width="60" height="22" rx="5" fill="url(#bG)"/>
  <text x="678" y="453" text-anchor="middle" font-size="8" font-weight="700" fill="#fff">16:9</text>
  <rect x="716" y="438" width="44" height="22" rx="5" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="738" y="453" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.35)">1:1</text>
  <rect x="768" y="438" width="44" height="22" rx="5" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="790" y="453" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.35)">4:3</text>
  <rect x="648" y="472" width="244" height="28" rx="8" fill="url(#bG)" filter="url(#sh)"/>
  <text x="770" y="491" text-anchor="middle" font-size="11" font-weight="900" fill="#fff">Crop Image</text>
  <rect x="620" y="550" width="560" height="14" rx="4" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
