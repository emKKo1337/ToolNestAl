  <text x="60" y="300" font-size="18" fill="rgba(255,255,255,0.6)">Precise crop with aspect ratio lock</text>
  <text x="60" y="328" font-size="18" fill="rgba(255,255,255,0.6)">16:9, 1:1, 4:3, 9:16 - Free, instant</text>
  <rect x="60" y="358" width="130" height="52" rx="8" fill="rgba(124,58,237,0.2)" stroke="rgba(124,58,237,0.4)" stroke-width="1"/>
  <text x="125" y="382" text-anchor="middle" font-size="12" font-weight="900" fill="#a78bfa">Pixel exact</text>
  <text x="125" y="400" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">precise crop</text>
  <rect x="202" y="358" width="120" height="52" rx="8" fill="rgba(14,116,144,0.15)" stroke="rgba(14,116,144,0.35)" stroke-width="1"/>
  <text x="262" y="382" text-anchor="middle" font-size="12" font-weight="900" fill="#67e8f9">Ratio lock</text>
  <text x="262" y="400" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">16:9, 1:1, 4:3</text>
  <rect x="334" y="358" width="110" height="52" rx="8" fill="rgba(251,191,36,0.1)" stroke="rgba(251,191,36,0.25)" stroke-width="1"/>
  <text x="389" y="382" text-anchor="middle" font-size="20" font-weight="900" fill="#fbbf24">Free</text>
  <text x="389" y="400" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">no account</text>
