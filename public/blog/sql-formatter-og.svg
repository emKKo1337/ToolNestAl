<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Segoe UI',sans-serif">
  <defs>
    <radialGradient id="bg" cx="40%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0f0825"/>
      <stop offset="100%" stop-color="#05030d"/>
    </radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <radialGradient id="g1" cx="30%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#5b21b6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="350" cy="315" rx="400" ry="300" fill="url(#g1)"/>
  <rect x="60" y="60" width="130" height="28" rx="14" fill="rgba(167,139,250,0.15)" stroke="rgba(167,139,250,0.3)" stroke-width="1"/>
  <text x="125" y="79" font-size="11" font-weight="700" fill="#a78bfa" text-anchor="middle" letter-spacing="0.06em">DEVELOPER TOOLS</text>
  <text x="60" y="138" font-size="52" font-weight="900" fill="#e2e2e2" letter-spacing="-2">SQL Formatter</text>
  <text x="60" y="192" font-size="22" fill="#7a6d84">Beautify SQL for PostgreSQL, MySQL,</text>
  <text x="60" y="224" font-size="22" fill="#7a6d84">SQL Server and SQLite in one click</text>
  <rect x="60" y="260" width="148" height="66" rx="12" fill="rgba(167,139,250,0.08)" stroke="rgba(167,139,250,0.2)" stroke-width="1"/>
  <text x="134" y="302" font-size="28" font-weight="900" fill="url(#aG)" text-anchor="middle">4</text>
  <text x="134" y="318" font-size="11" fill="#5a4d7a" text-anchor="middle">SQL dialects</text>
  <rect x="226" y="260" width="148" height="66" rx="12" fill="rgba(76,215,246,0.08)" stroke="rgba(76,215,246,0.2)" stroke-width="1"/>
  <text x="300" y="302" font-size="28" font-weight="900" fill="#4cd7f6" text-anchor="middle">3</text>
  <text x="300" y="318" font-size="11" fill="#5a4d7a" text-anchor="middle">indent styles</text>
  <rect x="392" y="260" width="148" height="66" rx="12" fill="rgba(52,211,153,0.08)" stroke="rgba(52,211,153,0.2)" stroke-width="1"/>
  <text x="466" y="302" font-size="28" font-weight="900" fill="#34d399" text-anchor="middle">Free</text>
  <text x="466" y="318" font-size="11" fill="#5a4d7a" text-anchor="middle">browser-side</text>
  <rect x="60" y="352" width="370" height="36" rx="18" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="245" y="375" font-size="13" fill="#4d4354" text-anchor="middle">toolnestai.net/developer-tools/sql-formatter</text>
  <!-- Right: before/after SQL -->
  <rect x="660" y="60" width="480" height="510" rx="16" fill="rgba(255,255,255,0.03)" stroke="rgba(167,139,250,0.2)" stroke-width="1"/>
  <!-- Before -->
  <rect x="660" y="60" width="480" height="40" rx="16" fill="rgba(167,139,250,0.08)"/>
  <text x="900" y="85" font-size="12" font-weight="700" fill="#a78bfa" text-anchor="middle">BEFORE — unformatted</text>
  <rect x="672" y="110" width="456" height="90" rx="8" fill="rgba(0,0,0,0.4)"/>
  <text x="684" y="130" font-size="8.5" fill="#7a6d84" font-family="monospace">select u.id,u.name,o.id as order_id,o.total from users u</text>
  <text x="684" y="147" font-size="8.5" fill="#7a6d84" font-family="monospace">left join orders o on u.id=o.user_id where u.active=true</text>
  <text x="684" y="164" font-size="8.5" fill="#7a6d84" font-family="monospace">and o.total&gt;100 order by o.created_at desc limit 50;</text>
  <!-- Arrow -->
  <text x="900" y="228" font-size="22" text-anchor="middle" fill="#34d399">⚡</text>
  <text x="900" y="252" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">FORMATTED</text>
  <!-- After -->
  <rect x="660" y="270" width="480" height="40" rx="16" fill="rgba(76,215,246,0.08)"/>
  <text x="900" y="295" font-size="12" font-weight="700" fill="#4cd7f6" text-anchor="middle">AFTER — formatted PostgreSQL</text>
  <rect x="672" y="320" width="456" height="200" rx="8" fill="rgba(76,215,246,0.04)" stroke="rgba(76,215,246,0.15)" stroke-width="1"/>
  <text x="684" y="342" font-size="9" fill="#a78bfa" font-family="monospace">SELECT</text>
  <text x="684" y="358" font-size="9" fill="#e2e2e2" font-family="monospace">  u.id,</text>
  <text x="684" y="374" font-size="9" fill="#e2e2e2" font-family="monospace">  u.name,</text>
  <text x="684" y="390" font-size="9" fill="#34d399" font-family="monospace">  o.id AS order_id,</text>
  <text x="684" y="406" font-size="9" fill="#34d399" font-family="monospace">  o.total</text>
  <text x="684" y="422" font-size="9" fill="#a78bfa" font-family="monospace">FROM users u</text>
  <text x="684" y="438" font-size="9" fill="#60a5fa" font-family="monospace">LEFT JOIN orders o ON u.id = o.user_id</text>
  <text x="684" y="454" font-size="9" fill="#a78bfa" font-family="monospace">WHERE</text>
  <text x="684" y="470" font-size="9" fill="#e2e2e2" font-family="monospace">  u.active = TRUE</text>
  <text x="684" y="486" font-size="9" fill="#fbbf24" font-family="monospace">  AND o.total &gt; 100</text>
  <text x="684" y="502" font-size="9" fill="#a78bfa" font-family="monospace">ORDER BY o.created_at DESC</text>
  <text x="684" y="518" font-size="9" fill="#a78bfa" font-family="monospace">LIMIT 50;</text>
  <!-- Logo -->
  <text x="60" y="578" font-size="16" font-weight="800" fill="url(#aG)">ToolNest AI</text>
  <text x="60" y="598" font-size="11" fill="#3d3356">toolnestai.net · Free SQL Formatter</text>
</svg>
