<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Segoe UI',sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0f0825"/>
      <stop offset="100%" stop-color="#05030d"/>
    </radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <radialGradient id="g1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5b21b6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="900" height="480" fill="url(#bg)"/>
  <ellipse cx="450" cy="240" rx="400" ry="250" fill="url(#g1)"/>

  <text x="450" y="52" font-size="22" font-weight="800" fill="#e2e2e2" text-anchor="middle" letter-spacing="-0.5">What CSS Minification Removes</text>
  <text x="450" y="74" font-size="13" fill="#7a6d84" text-anchor="middle">Every transformation that shrinks your stylesheet without changing behaviour</text>

  <!-- 6 technique cards: 3x2 grid -->
  <!-- Row 1 -->

  <!-- 1. Comments -->
  <rect x="40" y="100" width="255" height="155" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(167,139,250,0.2)" stroke-width="1"/>
  <text x="56" y="124" font-size="11" font-weight="700" fill="#a78bfa" letter-spacing="0.06em">COMMENTS REMOVED</text>
  <rect x="56" y="134" width="222" height="22" rx="5" fill="rgba(167,139,250,0.08)"/>
  <text x="64" y="149" font-size="9" fill="#7a6d84" font-family="'Fira Code','Courier New',monospace">/* navigation header */</text>
  <text x="64" y="167" font-size="9" fill="#e2e2e2" font-family="'Fira Code','Courier New',monospace">.nav { color: red; }</text>
  <!-- arrow -->
  <text x="167" y="190" font-size="12" fill="#4cd7f6" text-anchor="middle">↓</text>
  <rect x="56" y="197" width="222" height="22" rx="5" fill="rgba(76,215,246,0.08)"/>
  <text x="64" y="212" font-size="9" fill="#e2e2e2" font-family="'Fira Code','Courier New',monospace">.nav{color:red}</text>
  <text x="56" y="242" font-size="10" fill="#5a4d7a">Comments add 0 bytes at runtime</text>

  <!-- 2. Whitespace -->
  <rect x="323" y="100" width="255" height="155" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(96,165,250,0.2)" stroke-width="1"/>
  <text x="339" y="124" font-size="11" font-weight="700" fill="#60a5fa" letter-spacing="0.06em">WHITESPACE COLLAPSED</text>
  <rect x="339" y="134" width="222" height="38" rx="5" fill="rgba(96,165,250,0.08)"/>
  <text x="347" y="149" font-size="9" fill="#e2e2e2" font-family="'Fira Code','Courier New',monospace">.btn  {</text>
  <text x="347" y="162" font-size="9" fill="#e2e2e2" font-family="'Fira Code','Courier New',monospace">  display  :  block  ;</text>
  <text x="339" y="185" font-size="12" fill="#4cd7f6" text-anchor="middle">↓</text>
  <rect x="339" y="192" width="222" height="22" rx="5" fill="rgba(76,215,246,0.08)"/>
  <text x="347" y="207" font-size="9" fill="#e2e2e2" font-family="'Fira Code','Courier New',monospace">.btn{display:block}</text>
  <text x="339" y="242" font-size="10" fill="#5a4d7a">Indents, newlines, extra spaces gone</text>

  <!-- 3. Hex shortening -->
  <rect x="606" y="100" width="255" height="155" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(52,211,153,0.2)" stroke-width="1"/>
  <text x="622" y="124" font-size="11" font-weight="700" fill="#34d399" letter-spacing="0.06em">HEX COLORS SHORTENED</text>
  <rect x="622" y="134" width="222" height="22" rx="5" fill="rgba(52,211,153,0.08)"/>
  <text x="630" y="149" font-size="9" fill="#34d399" font-family="'Fira Code','Courier New',monospace">color: #ffffff;</text>
  <text x="714" y="175" font-size="12" fill="#4cd7f6" text-anchor="middle">↓</text>
  <rect x="622" y="182" width="222" height="22" rx="5" fill="rgba(76,215,246,0.08)"/>
  <text x="630" y="197" font-size="9" fill="#34d399" font-family="'Fira Code','Courier New',monospace">color:#fff</text>
  <text x="622" y="230" font-size="10" fill="#5a4d7a">#rrggbb → #rgb when pairs match</text>
  <text x="622" y="245" font-size="10" fill="#5a4d7a">rgba(0,0,0,1) → #000</text>

  <!-- Row 2 -->

  <!-- 4. Shorthand -->
  <rect x="40" y="273" width="255" height="155" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(251,191,36,0.2)" stroke-width="1"/>
  <text x="56" y="297" font-size="11" font-weight="700" fill="#fbbf24" letter-spacing="0.06em">SHORTHAND COLLAPSE</text>
  <rect x="56" y="307" width="222" height="38" rx="5" fill="rgba(251,191,36,0.08)"/>
  <text x="64" y="322" font-size="9" fill="#e2e2e2" font-family="'Fira Code','Courier New',monospace">margin: 8px 8px 8px 8px;</text>
  <text x="64" y="335" font-size="9" fill="#e2e2e2" font-family="'Fira Code','Courier New',monospace">padding: 0px 0px;</text>
  <text x="167" y="358" font-size="12" fill="#4cd7f6" text-anchor="middle">↓</text>
  <rect x="56" y="365" width="222" height="22" rx="5" fill="rgba(76,215,246,0.08)"/>
  <text x="64" y="380" font-size="9" fill="#e2e2e2" font-family="'Fira Code','Courier New',monospace">margin:8px;padding:0</text>
  <text x="56" y="414" font-size="10" fill="#5a4d7a">4 equal values → 1 value</text>

  <!-- 5. Last semicolon -->
  <rect x="323" y="273" width="255" height="155" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(244,114,182,0.2)" stroke-width="1"/>
  <text x="339" y="297" font-size="11" font-weight="700" fill="#f472b6" letter-spacing="0.06em">TRAILING SEMICOLONS</text>
  <rect x="339" y="307" width="222" height="38" rx="5" fill="rgba(244,114,182,0.08)"/>
  <text x="347" y="322" font-size="9" fill="#e2e2e2" font-family="'Fira Code','Courier New',monospace">.box { color: red;</text>
  <text x="347" y="335" font-size="9" fill="#e2e2e2" font-family="'Fira Code','Courier New',monospace">  width: 100%; }</text>
  <text x="450" y="358" font-size="12" fill="#4cd7f6" text-anchor="middle">↓</text>
  <rect x="339" y="365" width="222" height="22" rx="5" fill="rgba(76,215,246,0.08)"/>
  <text x="347" y="380" font-size="9" fill="#e2e2e2" font-family="'Fira Code','Courier New',monospace">.box{color:red;width:100%}</text>
  <text x="339" y="414" font-size="10" fill="#5a4d7a">Last ; before } is optional</text>

  <!-- 6. Zero units -->
  <rect x="606" y="273" width="255" height="155" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(167,139,250,0.15)" stroke-width="1"/>
  <text x="622" y="297" font-size="11" font-weight="700" fill="#c4b5fd" letter-spacing="0.06em">ZERO UNITS STRIPPED</text>
  <rect x="622" y="307" width="222" height="38" rx="5" fill="rgba(196,181,253,0.08)"/>
  <text x="630" y="322" font-size="9" fill="#e2e2e2" font-family="'Fira Code','Courier New',monospace">margin: 0px 0em 0rem;</text>
  <text x="630" y="335" font-size="9" fill="#e2e2e2" font-family="'Fira Code','Courier New',monospace">opacity: 0.5;</text>
  <text x="714" y="358" font-size="12" fill="#4cd7f6" text-anchor="middle">↓</text>
  <rect x="622" y="365" width="222" height="22" rx="5" fill="rgba(76,215,246,0.08)"/>
  <text x="630" y="380" font-size="9" fill="#e2e2e2" font-family="'Fira Code','Courier New',monospace">margin:0;opacity:.5</text>
  <text x="622" y="414" font-size="10" fill="#5a4d7a">0px → 0 · 0.5 → .5</text>
</svg>
