<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <radialGradient id="gL" cx="10%" cy="50%" r="60%"><stop offset="0%" stop-color="#5b21b6" stop-opacity="0.35"/><stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/></radialGradient>
    <radialGradient id="gR" cx="90%" cy="50%" r="60%"><stop offset="0%" stop-color="#0e7490" stop-opacity="0.2"/><stop offset="100%" stop-color="#0e7490" stop-opacity="0"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="bG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient>
    <linearGradient id="lapG" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1a1040"/><stop offset="100%" stop-color="#0d0824"/></linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#5b21b6" flood-opacity="0.45"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <ellipse cx="120" cy="337" rx="700" ry="550" fill="url(#gL)"/>
  <ellipse cx="1080" cy="337" rx="700" ry="550" fill="url(#gR)"/>

  <text x="600" y="42" text-anchor="middle" font-size="13" font-weight="700" fill="url(#aG)" filter="url(#glow)">ToolNest AI — Text Tools</text>
  <text x="600" y="68" text-anchor="middle" font-size="34" font-weight="900" fill="url(#aG)" filter="url(#glow)">Text Reverser</text>
  <text x="600" y="90" text-anchor="middle" font-size="13" fill="rgba(255,255,255,0.35)">Reverse characters, words, or lines — plus a built-in palindrome checker</text>

  <rect x="60" y="108" width="1080" height="542" rx="18" fill="url(#lapG)" stroke="rgba(124,58,237,0.35)" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="60" y="108" width="1080" height="38" rx="18" fill="rgba(255,255,255,0.05)"/>
  <rect x="60" y="128" width="1080" height="18" fill="rgba(255,255,255,0.02)"/>
  <circle cx="90" cy="127" r="7" fill="rgba(239,68,68,0.65)"/>
  <circle cx="114" cy="127" r="7" fill="rgba(251,191,36,0.65)"/>
  <circle cx="138" cy="127" r="7" fill="rgba(34,197,94,0.65)"/>
  <text x="600" y="132" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.2)">toolnestai.net/text-tools/text-reverser</text>

  <!-- Mode tabs -->
  <g font-size="11" text-anchor="middle">
    <rect x="80" y="158" width="180" height="28" rx="6" fill="url(#bG)"/>
    <text x="170" y="176" fill="#fff" font-weight="700">Reverse Characters</text>
    <rect x="268" y="158" width="150" height="28" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="343" y="176" fill="rgba(255,255,255,0.4)">Reverse Words</text>
    <rect x="426" y="158" width="140" height="28" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="496" y="176" fill="rgba(255,255,255,0.4)">Reverse Lines</text>
  </g>

  <!-- Input -->
  <text x="88" y="212" font-size="9" font-weight="700" fill="rgba(255,255,255,0.28)">INPUT TEXT</text>
  <rect x="80" y="218" width="680" height="46" rx="10" fill="rgba(0,0,0,0.55)" stroke="rgba(124,58,237,0.45)" stroke-width="1.5"/>
  <text x="98" y="247" font-family="monospace" font-size="16" fill="rgba(255,255,255,0.85)">Was it a car or a cat I saw?</text>

  <!-- Output -->
  <text x="88" y="286" font-size="9" font-weight="700" fill="rgba(255,255,255,0.28)">REVERSED OUTPUT (characters)</text>
  <rect x="80" y="292" width="680" height="46" rx="10" fill="rgba(52,211,153,0.08)" stroke="rgba(52,211,153,0.3)" stroke-width="1.5"/>
  <text x="98" y="321" font-family="monospace" font-size="16" fill="rgba(110,231,183,0.95)">?was I tac a ro rac a ti saW</text>

  <!-- Palindrome badge -->
  <rect x="80" y="356" width="680" height="70" rx="10" fill="rgba(251,191,36,0.08)" stroke="rgba(251,191,36,0.3)" stroke-width="1.5"/>
  <text x="420" y="388" text-anchor="middle" font-size="18" font-weight="900" fill="#fbbf24">✓ Palindrome Detected!</text>
  <text x="420" y="410" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.5)">Reads the same forwards and backwards (ignoring spaces, case, punctuation)</text>

  <!-- Right panel: mode comparison -->
  <rect x="780" y="158" width="340" height="268" rx="12" fill="rgba(255,255,255,0.025)" stroke="rgba(124,58,237,0.18)" stroke-width="1"/>
  <text x="950" y="182" text-anchor="middle" font-size="11" font-weight="700" fill="rgba(255,255,255,0.5)">Three Reversal Modes</text>

  <g font-size="9.5">
    <rect x="796" y="196" width="308" height="70" rx="6" fill="rgba(167,139,250,0.08)" stroke="rgba(167,139,250,0.2)" stroke-width="1"/>
    <text x="808" y="216" font-weight="700" fill="#a78bfa">Characters</text>
    <text x="808" y="234" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.5)">"Hello" → "olleH"</text>
    <text x="808" y="250" font-size="8.5" fill="rgba(255,255,255,0.35)">Reverses letter order entirely</text>

    <rect x="796" y="272" width="308" height="70" rx="6" fill="rgba(103,232,249,0.08)" stroke="rgba(103,232,249,0.2)" stroke-width="1"/>
    <text x="808" y="292" font-weight="700" fill="#67e8f9">Words</text>
    <text x="808" y="310" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.5)">"Hello World" → "World Hello"</text>
    <text x="808" y="326" font-size="8.5" fill="rgba(255,255,255,0.35)">Reverses word order, keeps each word intact</text>

    <rect x="796" y="348" width="308" height="70" rx="6" fill="rgba(52,211,153,0.06)" stroke="rgba(52,211,153,0.18)" stroke-width="1"/>
    <text x="808" y="368" font-weight="700" fill="#6ee7b7">Lines</text>
    <text x="808" y="386" font-family="monospace" font-size="8.5" fill="rgba(255,255,255,0.5)">Line 1 / Line 2 → Line 2 / Line 1</text>
    <text x="808" y="402" font-size="8.5" fill="rgba(255,255,255,0.35)">Reverses order of lines in a block of text</text>
  </g>

  <!-- Normalized comparison box -->
  <text x="88" y="454" font-size="9" font-weight="700" fill="rgba(255,255,255,0.28)">HOW PALINDROME CHECKING WORKS</text>
  <rect x="80" y="460" width="680" height="90" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="98" y="484" font-size="10.5" fill="rgba(255,255,255,0.55)">1. Normalize: lowercase everything, strip spaces and punctuation</text>
  <text x="98" y="504" font-family="monospace" font-size="10.5" fill="rgba(167,139,250,0.85)">"Was it a car or a cat I saw?" → "wasitacaroracatisaw"</text>
  <text x="98" y="528" font-size="10.5" fill="rgba(255,255,255,0.55)">2. Compare the normalized string to its own reverse — if identical, it's a palindrome</text>

  <!-- Right panel: buttons -->
  <rect x="780" y="440" width="340" height="34" rx="9" fill="url(#bG)" filter="url(#sh)"/>
  <text x="950" y="462" text-anchor="middle" font-size="12" font-weight="900" fill="#fff">Copy Result</text>
  <rect x="780" y="482" width="340" height="34" rx="9" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="950" y="504" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.35)">Check Another Palindrome</text>

  <rect x="48" y="650" width="1104" height="16" rx="5" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="460" y="664" width="280" height="10" rx="5" fill="rgba(255,255,255,0.025)"/>
</svg>
