<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <radialGradient id="gC" cx="50%" cy="40%" r="60%"><stop offset="0%" stop-color="#5b21b6" stop-opacity="0.2"/><stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
  </defs>
  <rect width="900" height="460" fill="url(#bg)"/>
  <ellipse cx="450" cy="230" rx="520" ry="320" fill="url(#gC)"/>

  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="900" fill="url(#aG)">Regex Patterns for Removing Blank Lines</text>
  <text x="450" y="54" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.38)">The exact patterns behind "remove empty lines," explained</text>

  <!-- True empty only -->
  <rect x="28" y="70" width="410" height="120" rx="10" fill="rgba(239,68,68,0.06)" stroke="rgba(239,68,68,0.2)" stroke-width="1"/>
  <text x="233" y="94" text-anchor="middle" font-size="12" font-weight="700" fill="#f87171">✗ Truly Empty Lines Only</text>
  <text x="44" y="120" font-family="monospace" font-size="12" fill="rgba(252,165,165,0.85)">/^$/gm</text>
  <text x="44" y="144" font-size="9.5" fill="rgba(255,255,255,0.55)">Matches lines with ZERO characters.</text>
  <text x="44" y="160" font-size="9.5" fill="rgba(255,255,255,0.55)">Misses lines that look empty but contain</text>
  <text x="44" y="176" font-size="9.5" fill="rgba(255,255,255,0.55)">spaces or tabs — a common false negative.</text>

  <!-- Whitespace-aware -->
  <rect x="462" y="70" width="410" height="120" rx="10" fill="rgba(52,211,153,0.06)" stroke="rgba(52,211,153,0.2)" stroke-width="1"/>
  <text x="667" y="94" text-anchor="middle" font-size="12" font-weight="700" fill="#6ee7b7">✓ Whitespace-Aware (recommended)</text>
  <text x="478" y="120" font-family="monospace" font-size="12" fill="rgba(110,231,183,0.9)">/^\s*$/gm</text>
  <text x="478" y="144" font-size="9.5" fill="rgba(255,255,255,0.55)">Matches lines with zero OR ONLY</text>
  <text x="478" y="160" font-size="9.5" fill="rgba(255,255,255,0.55)">whitespace characters (spaces, tabs).</text>
  <text x="478" y="176" font-size="9.5" fill="rgba(255,255,255,0.55)">Catches the "invisible content" case.</text>

  <!-- Collapse multiple -->
  <rect x="28" y="204" width="844" height="94" rx="10" fill="rgba(103,232,249,0.06)" stroke="rgba(103,232,249,0.2)" stroke-width="1"/>
  <text x="450" y="228" text-anchor="middle" font-size="12" font-weight="700" fill="#67e8f9">Collapse Multiple Blank Lines to One</text>
  <text x="450" y="254" text-anchor="middle" font-family="monospace" font-size="12" fill="rgba(103,232,249,0.85)">text.replace(/\n\s*\n\s*\n+/g, '\n\n')</text>
  <text x="450" y="276" text-anchor="middle" font-size="9.5" fill="rgba(255,255,255,0.55)">Matches 2+ consecutive blank lines and replaces with exactly one blank line —</text>
  <text x="450" y="290" text-anchor="middle" font-size="9.5" fill="rgba(255,255,255,0.55)">preserves paragraph spacing without leaving 3+ line gaps</text>

  <!-- Flags explanation -->
  <rect x="28" y="308" width="844" height="76" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(124,58,237,0.15)" stroke-width="1"/>
  <text x="450" y="330" text-anchor="middle" font-size="10" font-weight="700" fill="rgba(167,139,250,0.85)">WHY THE "m" (MULTILINE) FLAG MATTERS</text>
  <text x="450" y="352" text-anchor="middle" font-size="9.5" fill="rgba(255,255,255,0.55)">Without the m flag, ^ and $ only match the very start and end of the ENTIRE string — not each line.</text>
  <text x="450" y="370" text-anchor="middle" font-size="9.5" fill="rgba(255,255,255,0.55)">The m flag makes ^ and $ match at every line boundary, which is essential for line-by-line matching.</text>

  <text x="450" y="410" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.2)">toolnestai.net/text-tools/remove-empty-lines</text>
</svg>
