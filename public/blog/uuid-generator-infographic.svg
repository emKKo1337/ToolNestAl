<svg viewBox="0 0 900 1200" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <radialGradient id="gT" cx="50%" cy="10%" r="60%"><stop offset="0%" stop-color="#5b21b6" stop-opacity="0.35"/><stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/></radialGradient>
    <radialGradient id="gB" cx="50%" cy="90%" r="60%"><stop offset="0%" stop-color="#0e7490" stop-opacity="0.2"/><stop offset="100%" stop-color="#0e7490" stop-opacity="0"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="bG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient>
  </defs>
  <rect width="900" height="1200" fill="url(#bg)"/>
  <ellipse cx="450" cy="200" rx="700" ry="400" fill="url(#gT)"/>
  <ellipse cx="450" cy="1000" rx="700" ry="400" fill="url(#gB)"/>

  <text x="450" y="52" text-anchor="middle" font-size="28" font-weight="900" fill="url(#aG)">The Complete UUID Guide</text>
  <text x="450" y="76" text-anchor="middle" font-size="13" fill="rgba(255,255,255,0.38)">Everything you need to know about unique identifiers</text>
  <text x="450" y="94" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.22)">toolnestai.net/developer-tools/uuid-generator</text>

  <!-- Section 1 -->
  <rect x="32" y="110" width="836" height="38" rx="8" fill="rgba(124,58,237,0.18)" stroke="rgba(124,58,237,0.3)" stroke-width="1"/>
  <text x="450" y="134" text-anchor="middle" font-size="15" font-weight="800" fill="#a78bfa">01 — What Is a UUID?</text>

  <rect x="32" y="154" width="836" height="90" rx="10" fill="rgba(255,255,255,0.025)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="450" y="178" text-anchor="middle" font-size="12" fill="rgba(255,255,255,0.65)">A Universally Unique Identifier is a 128-bit number used to identify information</text>
  <text x="450" y="198" text-anchor="middle" font-size="12" fill="rgba(255,255,255,0.65)">without requiring a central authority to coordinate allocation. Any system, anywhere,</text>
  <text x="450" y="218" text-anchor="middle" font-size="12" fill="rgba(255,255,255,0.65)">can generate one independently with a near-zero chance of collision.</text>
  <text x="450" y="238" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.3)">Standardized in RFC 9562 (2024), superseding the original RFC 4122 (2005).</text>

  <!-- Section 2: Anatomy -->
  <rect x="32" y="256" width="836" height="38" rx="8" fill="rgba(14,116,144,0.18)" stroke="rgba(14,116,144,0.3)" stroke-width="1"/>
  <text x="450" y="280" text-anchor="middle" font-size="15" font-weight="800" fill="#67e8f9">02 — UUID Anatomy (v4)</text>

  <rect x="32" y="300" width="836" height="120" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="450" y="336" text-anchor="middle" font-family="monospace" font-size="26" font-weight="700">
    <tspan fill="#a78bfa">f47ac10b</tspan><tspan fill="rgba(255,255,255,0.3)">-</tspan><tspan fill="#67e8f9">58cc</tspan><tspan fill="rgba(255,255,255,0.3)">-</tspan><tspan fill="#34d399">4372</tspan><tspan fill="rgba(255,255,255,0.3)">-</tspan><tspan fill="#fbbf24">a567</tspan><tspan fill="rgba(255,255,255,0.3)">-</tspan><tspan fill="#f472b6">0e02b2c3d479</tspan>
  </text>
  <g font-size="9.5" text-anchor="middle">
    <text x="140" y="370" fill="rgba(167,139,250,0.8)">random</text>
    <text x="140" y="384" fill="rgba(255,255,255,0.3)">32 bits</text>
    <text x="330" y="370" fill="rgba(103,232,249,0.8)">random</text>
    <text x="330" y="384" fill="rgba(255,255,255,0.3)">16 bits</text>
    <text x="470" y="370" fill="rgba(52,211,153,0.8)">version nibble = 4</text>
    <text x="470" y="384" fill="rgba(255,255,255,0.3)">+ 12 random bits</text>
    <text x="610" y="370" fill="rgba(251,191,36,0.8)">variant bits</text>
    <text x="610" y="384" fill="rgba(255,255,255,0.3)">+ 14 random bits</text>
    <text x="790" y="370" fill="rgba(244,114,182,0.8)">random</text>
    <text x="790" y="384" fill="rgba(255,255,255,0.3)">48 bits</text>
  </g>
  <text x="450" y="406" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.3)">36 characters total (32 hex digits + 4 hyphens) — 122 bits are truly random in v4</text>

  <!-- Section 3: Versions -->
  <rect x="32" y="434" width="836" height="38" rx="8" fill="rgba(16,185,129,0.14)" stroke="rgba(16,185,129,0.25)" stroke-width="1"/>
  <text x="450" y="458" text-anchor="middle" font-size="15" font-weight="800" fill="#34d399">03 — The 4 Versions That Matter</text>

  <g font-size="10">
    <rect x="32" y="478" width="404" height="80" rx="8" fill="rgba(103,232,249,0.06)" stroke="rgba(103,232,249,0.16)" stroke-width="1"/>
    <text x="48" y="500" font-weight="700" fill="#67e8f9">v1 — Timestamp + MAC address</text>
    <text x="48" y="518" fill="rgba(255,255,255,0.5)">Encodes creation time and network card ID.</text>
    <text x="48" y="534" fill="rgba(255,255,255,0.5)">Can leak hardware identity — used less today.</text>
    <text x="48" y="550" fill="rgba(255,255,255,0.28)">Best for: legacy interop, audit logs</text>

    <rect x="464" y="478" width="404" height="80" rx="8" fill="rgba(167,139,250,0.08)" stroke="rgba(167,139,250,0.18)" stroke-width="1"/>
    <text x="480" y="500" font-weight="700" fill="#a78bfa">v4 — Fully Random</text>
    <text x="480" y="518" fill="rgba(255,255,255,0.5)">122 cryptographically random bits.</text>
    <text x="480" y="534" fill="rgba(255,255,255,0.5)">No information leaked. Most widely used.</text>
    <text x="480" y="550" fill="rgba(255,255,255,0.28)">Best for: general purpose, tokens, session IDs</text>

    <rect x="32" y="566" width="404" height="80" rx="8" fill="rgba(52,211,153,0.06)" stroke="rgba(52,211,153,0.16)" stroke-width="1"/>
    <text x="48" y="588" font-weight="700" fill="#34d399">v5 — Deterministic Name-based</text>
    <text x="48" y="606" fill="rgba(255,255,255,0.5)">SHA-1 hash of a namespace + name string.</text>
    <text x="48" y="622" fill="rgba(255,255,255,0.5)">Same inputs always produce the same UUID.</text>
    <text x="48" y="638" fill="rgba(255,255,255,0.28)">Best for: deduplication, deterministic cache keys</text>

    <rect x="464" y="566" width="404" height="80" rx="8" fill="rgba(251,191,36,0.07)" stroke="rgba(251,191,36,0.18)" stroke-width="1"/>
    <text x="480" y="588" font-weight="700" fill="#fbbf24">v7 — Unix-time Sortable (newest)</text>
    <text x="480" y="606" fill="rgba(255,255,255,0.5)">48-bit millisecond timestamp + random tail.</text>
    <text x="480" y="622" fill="rgba(255,255,255,0.5)">Sorts chronologically — index-friendly.</text>
    <text x="480" y="638" fill="rgba(255,255,255,0.28)">Best for: database primary keys (2024+ standard)</text>
  </g>

  <!-- Section 4: Key numbers -->
  <rect x="32" y="662" width="836" height="38" rx="8" fill="rgba(124,58,237,0.18)" stroke="rgba(124,58,237,0.3)" stroke-width="1"/>
  <text x="450" y="686" text-anchor="middle" font-size="15" font-weight="800" fill="#a78bfa">04 — Key Numbers</text>

  <g text-anchor="middle" font-size="10">
    <rect x="32" y="706" width="196" height="90" rx="10" fill="rgba(124,58,237,0.1)" stroke="rgba(124,58,237,0.22)" stroke-width="1"/>
    <text x="130" y="730" font-size="24" font-weight="900" fill="#a78bfa">128</text>
    <text x="130" y="750" fill="rgba(255,255,255,0.5)">total bits</text>
    <text x="130" y="766" fill="rgba(255,255,255,0.5)">of data</text>
    <text x="130" y="786" font-size="8.5" fill="rgba(255,255,255,0.28)">16 bytes storage</text>

    <rect x="238" y="706" width="196" height="90" rx="10" fill="rgba(14,116,144,0.08)" stroke="rgba(14,116,144,0.2)" stroke-width="1"/>
    <text x="336" y="730" font-size="24" font-weight="900" fill="#67e8f9">122</text>
    <text x="336" y="750" fill="rgba(255,255,255,0.5)">random bits</text>
    <text x="336" y="766" fill="rgba(255,255,255,0.5)">(v4 only)</text>
    <text x="336" y="786" font-size="8.5" fill="rgba(255,255,255,0.28)">6 bits fixed (version+variant)</text>

    <rect x="444" y="706" width="196" height="90" rx="10" fill="rgba(16,185,129,0.07)" stroke="rgba(16,185,129,0.18)" stroke-width="1"/>
    <text x="542" y="730" font-size="20" font-weight="900" fill="#34d399">5.3×10³⁶</text>
    <text x="542" y="750" fill="rgba(255,255,255,0.5)">possible</text>
    <text x="542" y="766" fill="rgba(255,255,255,0.5)">unique values</text>
    <text x="542" y="786" font-size="8.5" fill="rgba(255,255,255,0.28)">2¹²² combinations</text>

    <rect x="650" y="706" width="218" height="90" rx="10" fill="rgba(251,191,36,0.07)" stroke="rgba(251,191,36,0.18)" stroke-width="1"/>
    <text x="759" y="730" font-size="24" font-weight="900" fill="#fbbf24">36</text>
    <text x="759" y="750" fill="rgba(255,255,255,0.5)">characters</text>
    <text x="759" y="766" fill="rgba(255,255,255,0.5)">in string form</text>
    <text x="759" y="786" font-size="8.5" fill="rgba(255,255,255,0.28)">32 hex + 4 hyphens</text>
  </g>

  <!-- Section 5: How to use -->
  <rect x="32" y="814" width="836" height="38" rx="8" fill="rgba(14,116,144,0.18)" stroke="rgba(14,116,144,0.3)" stroke-width="1"/>
  <text x="450" y="838" text-anchor="middle" font-size="15" font-weight="800" fill="#67e8f9">05 — 4-Step Guide to Generating UUIDs</text>

  <g font-size="10.5">
    <rect x="48" y="858" width="28" height="28" rx="14" fill="url(#bG)"/>
    <text x="62" y="876" text-anchor="middle" font-weight="900" fill="#fff">1</text>
    <text x="90" y="877" fill="rgba(255,255,255,0.65)">Choose a version — v4 for general use, v7 for sortable database keys</text>

    <rect x="48" y="896" width="28" height="28" rx="14" fill="url(#bG)"/>
    <text x="62" y="914" text-anchor="middle" font-weight="900" fill="#fff">2</text>
    <text x="90" y="915" fill="rgba(255,255,255,0.65)">Pick a format — lowercase (default), UPPERCASE, no hyphens, or {`{braces}`}</text>

    <rect x="48" y="934" width="28" height="28" rx="14" fill="url(#bG)"/>
    <text x="62" y="952" text-anchor="middle" font-weight="900" fill="#fff">3</text>
    <text x="90" y="953" fill="rgba(255,255,255,0.65)">Generate one or bulk-generate up to hundreds at once</text>

    <rect x="48" y="972" width="28" height="28" rx="14" fill="url(#bG)"/>
    <text x="62" y="990" text-anchor="middle" font-weight="900" fill="#fff">4</text>
    <text x="90" y="991" fill="rgba(255,255,255,0.65)">Copy individually, copy all, or download as .txt / .csv / .json</text>
  </g>

  <!-- Section 6: mistakes -->
  <rect x="32" y="1012" width="836" height="38" rx="8" fill="rgba(239,68,68,0.12)" stroke="rgba(239,68,68,0.22)" stroke-width="1"/>
  <text x="450" y="1036" text-anchor="middle" font-size="15" font-weight="800" fill="rgba(239,68,68,0.85)">06 — Common Mistakes</text>

  <g font-size="10">
    <rect x="32" y="1056" width="836" height="36" rx="7" fill="rgba(255,255,255,0.02)" stroke="rgba(239,68,68,0.1)" stroke-width="1"/>
    <text x="48" y="1078" fill="rgba(239,68,68,0.7)">✗</text>
    <text x="68" y="1078" fill="rgba(255,255,255,0.6)">Using UUIDv1 in public-facing systems — it can leak the server's MAC address.</text>
    <rect x="32" y="1096" width="836" height="36" rx="7" fill="rgba(255,255,255,0.02)" stroke="rgba(239,68,68,0.1)" stroke-width="1"/>
    <text x="48" y="1118" fill="rgba(239,68,68,0.7)">✗</text>
    <text x="68" y="1118" fill="rgba(255,255,255,0.6)">Using UUIDv4 as a database primary key on a huge table — random inserts fragment B-tree indexes; use v7 instead.</text>
    <rect x="32" y="1136" width="836" height="36" rx="7" fill="rgba(255,255,255,0.02)" stroke="rgba(239,68,68,0.1)" stroke-width="1"/>
    <text x="48" y="1158" fill="rgba(239,68,68,0.7)">✗</text>
    <text x="68" y="1158" fill="rgba(255,255,255,0.6)">Treating a UUID as a security token — always random, but not secret unless generated and stored securely.</text>
  </g>

  <text x="450" y="1192" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.22)">Free tool: toolnestai.net/developer-tools/uuid-generator</text>
</svg>
