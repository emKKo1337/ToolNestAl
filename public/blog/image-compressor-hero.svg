    <text x="60" y="430">✦  Drag &amp; drop batch upload</text>
    <text x="60" y="452">✦  Adjustable quality slider (1–100)</text>
    <text x="60" y="474">✦  Convert to WebP on compress</text>
    <text x="60" y="496">✦  Privacy-first — no server uploads</text>
    <text x="60" y="518">✦  Download individual or all at once</text>
