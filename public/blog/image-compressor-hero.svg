  <text x="110" y="392" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.4)">reduction</text>

  <rect x="172" y="340" width="100" height="58" rx="8" fill="rgba(14,116,144,0.12)" stroke="rgba(14,116,144,0.3)" stroke-width="1"/>
  <text x="222" y="366" text-anchor="middle" font-size="22" font-weight="900" fill="#67e8f9">4</text>
  <text x="222" y="382" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.4)">formats</text>
  <text x="222" y="392" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.4)">supported</text>

  <rect x="284" y="340" width="100" height="58" rx="8" fill="rgba(16,185,129,0.1)" stroke="rgba(16,185,129,0.25)" stroke-width="1"/>
