<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <radialGradient id="gL" cx="20%" cy="50%" r="55%"><stop offset="0%" stop-color="#5b21b6" stop-opacity="0.3"/><stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/></radialGradient>
    <radialGradient id="gR" cx="80%" cy="50%" r="55%"><stop offset="0%" stop-color="#0e7490" stop-opacity="0.22"/><stop offset="100%" stop-color="#0e7490" stop-opacity="0"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="bG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient>
    <linearGradient id="lapG" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1a1040"/><stop offset="100%" stop-color="#0d0824"/></linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#5b21b6" flood-opacity="0.4"/></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <ellipse cx="240" cy="337" rx="700" ry="500" fill="url(#gL)"/>
  <ellipse cx="960" cy="337" rx="700" ry="500" fill="url(#gR)"/>
  <text x="600" y="52" text-anchor="middle" font-size="28" font-weight="900" fill="url(#aG)">Before vs After: Image Compression in Action</text>
  <text x="600" y="74" text-anchor="middle" font-size="13" fill="rgba(255,255,255,0.4)">Quality 82% produces 88% smaller file with near-identical visual output</text>
  <rect x="40" y="96" width="530" height="340" rx="12" fill="rgba(239,68,68,0.05)" stroke="rgba(239,68,68,0.22)" stroke-width="1.5" filter="url(#sh)"/>
  <text x="305" y="122" text-anchor="middle" font-size="11" font-weight="700" fill="rgba(239,68,68,0.7)">ORIGINAL FILE</text>
  <rect x="70" y="136" width="472" height="252" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="306" y="268" text-anchor="middle" font-size="48" font-weight="900" fill="rgba(239,68,68,0.18)">PHOTO</text>
  <text x="306" y="220" text-anchor="middle" font-size="13" fill="rgba(255,255,255,0.25)">2400 x 1600 pixels</text>
  <text x="306" y="316" text-anchor="middle" font-size="13" fill="rgba(255,255,255,0.25)">Quality: 95%</text>
  <text x="305" y="408" text-anchor="middle" font-size="42" font-weight="900" fill="rgba(239,68,68,0.75)">4.2 MB</text>
  <rect x="630" y="96" width="530" height="340" rx="12" fill="rgba(52,211,153,0.06)" stroke="rgba(52,211,153,0.25)" stroke-width="1.5" filter="url(#sh)"/>
  <text x="895" y="122" text-anchor="middle" font-size="11" font-weight="700" fill="rgba(52,211,153,0.7)">COMPRESSED FILE</text>
  <rect x="660" y="136" width="472" height="252" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="896" y="268" text-anchor="middle" font-size="48" font-weight="900" fill="rgba(52,211,153,0.18)">PHOTO</text>
  <text x="896" y="220" text-anchor="middle" font-size="13" fill="rgba(255,255,255,0.25)">2400 x 1600 pixels</text>
  <text x="896" y="316" text-anchor="middle" font-size="13" fill="rgba(255,255,255,0.25)">Quality: 82%</text>
  <text x="895" y="408" text-anchor="middle" font-size="42" font-weight="900" fill="rgba(110,231,183,0.9)">490 KB</text>
  <text x="600" y="476" text-anchor="middle" font-size="22" font-weight="700" fill="url(#aG)">88% smaller — visually identical at normal viewing size</text>
  <rect x="140" y="500" width="380" height="10" rx="5" fill="rgba(239,68,68,0.35)"/>
  <text x="140" y="526" font-size="10" fill="rgba(255,255,255,0.35)">4.2 MB original</text>
  <rect x="680" y="500" width="48" height="10" rx="5" fill="rgba(52,211,153,0.55)"/>
  <text x="740" y="526" font-size="10" fill="rgba(255,255,255,0.45)">490 KB compressed (11.7% of original)</text>
  <text x="600" y="580" text-anchor="middle" font-size="12" fill="rgba(255,255,255,0.22)">toolnestai.net/image-tools/image-compressor</text>
</svg>
