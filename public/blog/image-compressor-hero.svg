  <text x="60" y="236" font-size="50" font-weight="900" fill="url(#aG)" filter="url(#glow)">Compressor</text>
  <text x="60" y="290" font-size="17" fill="rgba(255,255,255,0.6)">Reduce image file size up to 90%</text>
  <text x="60" y="316" font-size="17" fill="rgba(255,255,255,0.6)">without visible quality loss</text>

