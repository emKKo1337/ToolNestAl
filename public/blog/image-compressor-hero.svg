  <text x="446" y="366" text-anchor="middle" font-size="22" font-weight="900" fill="#fbbf24">0</text>
  <text x="446" y="382" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.4)">uploads to</text>
  <text x="446" y="392" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.4)">any server</text>

