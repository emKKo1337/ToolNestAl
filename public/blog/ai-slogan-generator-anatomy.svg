<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <radialGradient id="gC" cx="50%" cy="50%" r="55%"><stop offset="0%" stop-color="#5b21b6" stop-opacity="0.3"/><stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#818cf8"/></linearGradient>
    <linearGradient id="bG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#5b21b6" flood-opacity="0.35"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="900" height="520" fill="url(#bg)"/>
  <ellipse cx="450" cy="260" rx="500" ry="380" fill="url(#gC)"/>

  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="900" fill="url(#aG)" filter="url(#glow)">What Makes a Slogan Truly Memorable?</text>
  <text x="450" y="60" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.42)">Six qualities shared by every great brand slogan</text>

  <!-- Center circle -->
  <circle cx="450" cy="280" r="68" fill="url(#bG)" filter="url(#sh)"/>
  <circle cx="450" cy="280" r="60" fill="rgba(124,58,237,0.3)" stroke="rgba(167,139,250,0.4)" stroke-width="1.5"/>
  <text x="450" y="272" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Great</text>
  <text x="450" y="288" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Slogan</text>

  <!-- Connector lines -->
  <line x1="450" y1="212" x2="450" y2="158" stroke="rgba(167,139,250,0.3)" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="450" y1="348" x2="450" y2="402" stroke="rgba(167,139,250,0.3)" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="392" y1="248" x2="254" y2="192" stroke="rgba(167,139,250,0.3)" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="508" y1="248" x2="644" y2="192" stroke="rgba(167,139,250,0.3)" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="392" y1="314" x2="254" y2="368" stroke="rgba(167,139,250,0.3)" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="508" y1="314" x2="644" y2="368" stroke="rgba(167,139,250,0.3)" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Card: Short & Punchy (top) -->
  <rect x="356" y="78" width="188" height="74" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(167,139,250,0.25)" stroke-width="1.5" filter="url(#sh)"/>
  <text x="450" y="104" text-anchor="middle" font-size="20">✂</text>
  <text x="450" y="122" text-anchor="middle" font-size="11" font-weight="800" fill="rgba(255,255,255,0.9)">Short &amp; Punchy</text>
  <text x="450" y="138" text-anchor="middle" font-size="8.5" fill="rgba(255,255,255,0.45)">Under 7 words. Fast to say, easy to recall.</text>

  <!-- Card: Emotionally Resonant (bottom) -->
  <rect x="356" y="406" width="188" height="74" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(167,139,250,0.25)" stroke-width="1.5" filter="url(#sh)"/>
  <text x="450" y="432" text-anchor="middle" font-size="20">💜</text>
  <text x="450" y="450" text-anchor="middle" font-size="11" font-weight="800" fill="rgba(255,255,255,0.9)">Emotionally Resonant</text>
  <text x="450" y="466" text-anchor="middle" font-size="8.5" fill="rgba(255,255,255,0.45)">Evokes a feeling. Connects with your audience.</text>

  <!-- Card: Brand Relevant (top-left) -->
  <rect x="96" y="142" width="188" height="74" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(167,139,250,0.25)" stroke-width="1.5" filter="url(#sh)"/>
  <text x="190" y="168" text-anchor="middle" font-size="20">🎯</text>
  <text x="190" y="186" text-anchor="middle" font-size="11" font-weight="800" fill="rgba(255,255,255,0.9)">Brand Relevant</text>
  <text x="190" y="202" text-anchor="middle" font-size="8.5" fill="rgba(255,255,255,0.45)">Reflects what you actually do or stand for.</text>

  <!-- Card: Unique & Ownable (top-right) -->
  <rect x="616" y="142" width="188" height="74" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(167,139,250,0.25)" stroke-width="1.5" filter="url(#sh)"/>
  <text x="710" y="168" text-anchor="middle" font-size="20">◇</text>
  <text x="710" y="186" text-anchor="middle" font-size="11" font-weight="800" fill="rgba(255,255,255,0.9)">Unique &amp; Ownable</text>
  <text x="710" y="202" text-anchor="middle" font-size="8.5" fill="rgba(255,255,255,0.45)">Impossible to confuse with a competitor.</text>

  <!-- Card: Timeless (bottom-left) -->
  <rect x="96" y="330" width="188" height="74" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(167,139,250,0.25)" stroke-width="1.5" filter="url(#sh)"/>
  <text x="190" y="356" text-anchor="middle" font-size="20">⧗</text>
  <text x="190" y="374" text-anchor="middle" font-size="11" font-weight="800" fill="rgba(255,255,255,0.9)">Timeless</text>
  <text x="190" y="390" text-anchor="middle" font-size="8.5" fill="rgba(255,255,255,0.45)">Works in 2026 and still works in 2036.</text>

  <!-- Card: Easy to Remember (bottom-right) -->
  <rect x="616" y="330" width="188" height="74" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(167,139,250,0.25)" stroke-width="1.5" filter="url(#sh)"/>
  <text x="710" y="356" text-anchor="middle" font-size="20">🧠</text>
  <text x="710" y="374" text-anchor="middle" font-size="11" font-weight="800" fill="rgba(255,255,255,0.9)">Easy to Remember</text>
  <text x="710" y="390" text-anchor="middle" font-size="8.5" fill="rgba(255,255,255,0.45)">Rhyme, rhythm or alliteration helps.</text>

  <text x="450" y="504" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.28)">toolnestai.net/ai-tools/ai-slogan-generator</text>
</svg>
