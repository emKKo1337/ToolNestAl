<svg viewBox="0 0 900 540" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%"><stop offset="0%" stop-color="#0f0825"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <linearGradient id="lapG" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#1a1040"/><stop offset="100%" stop-color="#0d0824"/></linearGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="900" height="540" fill="url(#bg)"/>
  <ellipse cx="450" cy="270" rx="280" ry="150" fill="#5b21b6" opacity="0.07" filter="url(#glow)"/>
  <rect x="120" y="48" width="660" height="410" rx="14" fill="url(#lapG)" stroke="#2a1f4a" stroke-width="1.5"/>
  <rect x="120" y="48" width="660" height="38" rx="14" fill="#1a1040"/>
  <rect x="120" y="72" width="660" height="14" fill="#1a1040"/>
  <circle cx="655" cy="67" r="7" fill="#ff5f57"/><circle cx="675" cy="67" r="7" fill="#febc2e"/><circle cx="695" cy="67" r="7" fill="#28c840"/>
  <rect x="200" y="56" width="440" height="20" rx="10" fill="#110c2a"/>
  <text x="420" y="70" font-family="monospace" font-size="9" fill="#4d4354" text-anchor="middle">toolnestai.net/pdf-tools/image-to-pdf</text>
  <rect x="136" y="94" width="628" height="352" rx="6" fill="#0c0920"/>
  <text x="450" y="118" font-family="sans-serif" font-size="13" font-weight="700" fill="#e2e2e2" text-anchor="middle">Image to PDF</text>
  <text x="450" y="134" font-family="sans-serif" font-size="8" fill="#7a6d84" text-anchor="middle">Combine JPG, PNG, WebP images into a single PDF — drag to reorder</text>
  <!-- File list -->
  <rect x="148" y="148" width="390" height="280" rx="8" fill="#110c2a" stroke="#2a1f4a" stroke-width="1"/>
  <!-- Image rows -->
  <rect x="158" y="158" width="370" height="56" rx="6" fill="#1a1040"/>
  <rect x="168" y="166" width="40" height="40" rx="4" fill="#2a1f4a"/>
  <rect x="170" y="168" width="36" height="36" rx="3" fill="#0e7490" opacity="0.5"/>
  <text x="188" y="192" font-family="sans-serif" font-size="16" fill="#60a5fa" text-anchor="middle">🏔</text>
  <text x="218" y="181" font-family="sans-serif" font-size="9" font-weight="700" fill="#cfc2d6">photo-mountain.jpg</text>
  <text x="218" y="196" font-family="sans-serif" font-size="8" fill="#4d4354">1920 × 1280 · 2.3 MB</text>
  <text x="502" y="191" font-family="sans-serif" font-size="9" fill="#7a6d84">⋮⋮</text>
  <text x="520" y="191" font-family="sans-serif" font-size="11" fill="#4d4354">✕</text>
  <rect x="158" y="222" width="370" height="56" rx="6" fill="#1a1040"/>
  <rect x="168" y="230" width="40" height="40" rx="4" fill="#1a1040" stroke="#2a1f4a" stroke-width="1"/>
  <rect x="170" y="232" width="36" height="36" rx="3" fill="#7c3aed" opacity="0.3"/>
  <text x="188" y="256" font-family="sans-serif" font-size="16" fill="#a78bfa" text-anchor="middle">📊</text>
  <text x="218" y="245" font-family="sans-serif" font-size="9" font-weight="700" fill="#cfc2d6">chart-q4.png</text>
  <text x="218" y="260" font-family="sans-serif" font-size="8" fill="#4d4354">800 × 600 · 340 KB</text>
  <text x="502" y="255" font-family="sans-serif" font-size="9" fill="#7a6d84">⋮⋮</text>
  <rect x="158" y="286" width="370" height="56" rx="6" fill="#1a1040"/>
  <text x="218" y="309" font-family="sans-serif" font-size="9" font-weight="700" fill="#cfc2d6">signature-scan.png</text>
  <text x="218" y="324" font-family="sans-serif" font-size="8" fill="#4d4354">600 × 200 · 80 KB</text>
  <!-- Drop zone -->
  <rect x="158" y="350" width="370" height="62" rx="6" fill="transparent" stroke="#2a1f4a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="343" y="384" font-family="sans-serif" font-size="9" fill="#4d4354" text-anchor="middle">+ Drop images here or click to browse</text>
  <!-- PDF preview + options -->
  <rect x="550" y="148" width="214" height="280" rx="8" fill="#110c2a" stroke="#2a1f4a" stroke-width="1"/>
  <text x="657" y="170" font-family="sans-serif" font-size="9" font-weight="700" fill="#4d4354" text-anchor="middle">PDF SETTINGS</text>
  <text x="560" y="192" font-family="sans-serif" font-size="8" fill="#4d4354">Page size</text>
  <rect x="560" y="198" width="90" height="22" rx="5" fill="#7c3aed"/>
  <text x="605" y="213" font-family="sans-serif" font-size="8" font-weight="700" fill="#fff" text-anchor="middle">Auto (image)</text>
  <rect x="660" y="198" width="90" height="22" rx="5" fill="#1a1040"/>
  <text x="705" y="213" font-family="sans-serif" font-size="8" fill="#7a6d84" text-anchor="middle">A4</text>
  <text x="560" y="240" font-family="sans-serif" font-size="8" fill="#4d4354">Fit mode</text>
  <rect x="560" y="246" width="90" height="22" rx="5" fill="#7c3aed"/>
  <text x="605" y="261" font-family="sans-serif" font-size="8" font-weight="700" fill="#fff" text-anchor="middle">Fit page</text>
  <rect x="660" y="246" width="90" height="22" rx="5" fill="#1a1040"/>
  <text x="705" y="261" font-family="sans-serif" font-size="8" fill="#7a6d84" text-anchor="middle">Fill &amp; crop</text>
  <text x="560" y="289" font-family="sans-serif" font-size="8" fill="#4d4354">Margin</text>
  <rect x="560" y="295" width="190" height="18" rx="4" fill="#1a1040"/>
  <rect x="560" y="295" width="48" height="18" rx="4" fill="#a78bfa" opacity="0.25"/>
  <text x="655" y="307" font-family="sans-serif" font-size="7.5" fill="#a78bfa" text-anchor="middle">8 mm</text>
  <!-- Convert button -->
  <rect x="550" y="350" width="214" height="40" rx="10" fill="url(#aG)"/>
  <text x="657" y="374" font-family="sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">Convert to PDF</text>
  <text x="657" y="396" font-family="sans-serif" font-size="8" fill="#4d4354" text-anchor="middle">3 images · ~3 pages</text>
  <rect x="340" y="458" width="220" height="10" rx="5" fill="#1a1040"/>
  <rect x="280" y="466" width="340" height="8" rx="4" fill="#140e34"/>
</svg>
