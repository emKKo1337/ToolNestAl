<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Segoe UI',sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0f0825"/>
      <stop offset="100%" stop-color="#05030d"/>
    </radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>
  <rect width="900" height="500" fill="url(#bg)"/>

  <text x="450" y="44" font-size="22" font-weight="800" fill="#e2e2e2" text-anchor="middle">SQL Formatting Styles</text>
  <text x="450" y="66" font-size="13" fill="#7a6d84" text-anchor="middle">Three common indentation conventions for the same query</text>

  <!-- Style 1: Standard / uppercase keywords -->
  <rect x="30" y="86" width="265" height="380" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(167,139,250,0.2)" stroke-width="1"/>
  <rect x="30" y="86" width="265" height="36" rx="12" fill="rgba(167,139,250,0.08)"/>
  <rect x="30" y="106" width="265" height="16" fill="rgba(167,139,250,0.08)"/>
  <text x="50" y="110" font-size="11" font-weight="700" fill="#a78bfa">Standard (leading keywords)</text>
  <text x="50" y="136" font-size="9.5" fill="#a78bfa" font-family="monospace">SELECT</text>
  <text x="50" y="152" font-size="9.5" fill="#e2e2e2" font-family="monospace">  u.id,</text>
  <text x="50" y="168" font-size="9.5" fill="#e2e2e2" font-family="monospace">  u.name,</text>
  <text x="50" y="184" font-size="9.5" fill="#e2e2e2" font-family="monospace">  u.email,</text>
  <text x="50" y="200" font-size="9.5" fill="#34d399" font-family="monospace">  o.total</text>
  <text x="50" y="218" font-size="9.5" fill="#a78bfa" font-family="monospace">FROM users u</text>
  <text x="50" y="236" font-size="9.5" fill="#60a5fa" font-family="monospace">LEFT JOIN orders o</text>
  <text x="50" y="252" font-size="9.5" fill="#60a5fa" font-family="monospace">  ON u.id = o.user_id</text>
  <text x="50" y="270" font-size="9.5" fill="#a78bfa" font-family="monospace">WHERE</text>
  <text x="50" y="286" font-size="9.5" fill="#e2e2e2" font-family="monospace">  u.active = TRUE</text>
  <text x="50" y="302" font-size="9.5" fill="#fbbf24" font-family="monospace">  AND o.total &gt; 100</text>
  <text x="50" y="320" font-size="9.5" fill="#a78bfa" font-family="monospace">ORDER BY</text>
  <text x="50" y="336" font-size="9.5" fill="#e2e2e2" font-family="monospace">  o.created_at DESC</text>
  <text x="50" y="354" font-size="9.5" fill="#a78bfa" font-family="monospace">LIMIT 50;</text>
  <text x="46" y="422" font-size="10" fill="#5a4d7a">Keywords uppercase, leading</text>
  <text x="46" y="438" font-size="10" fill="#5a4d7a">Columns indented 2 spaces</text>
  <text x="46" y="454" font-size="10" fill="#5a4d7a">Widely used in PostgreSQL community</text>

  <!-- Style 2: Right-aligned keywords -->
  <rect x="320" y="86" width="265" height="380" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(96,165,250,0.2)" stroke-width="1"/>
  <rect x="320" y="86" width="265" height="36" rx="12" fill="rgba(96,165,250,0.08)"/>
  <rect x="320" y="106" width="265" height="16" fill="rgba(96,165,250,0.08)"/>
  <text x="340" y="110" font-size="11" font-weight="700" fill="#60a5fa">Right-aligned keywords</text>
  <text x="440" y="136" font-size="9.5" fill="#a78bfa" font-family="monospace" text-anchor="end">SELECT</text>
  <text x="458" y="136" font-size="9.5" fill="#e2e2e2" font-family="monospace">u.id,</text>
  <text x="458" y="152" font-size="9.5" fill="#e2e2e2" font-family="monospace">u.name,</text>
  <text x="458" y="168" font-size="9.5" fill="#e2e2e2" font-family="monospace">u.email,</text>
  <text x="458" y="184" font-size="9.5" fill="#34d399" font-family="monospace">o.total</text>
  <text x="440" y="202" font-size="9.5" fill="#a78bfa" font-family="monospace" text-anchor="end">FROM</text>
  <text x="458" y="202" font-size="9.5" fill="#e2e2e2" font-family="monospace">users u</text>
  <text x="440" y="220" font-size="9.5" fill="#60a5fa" font-family="monospace" text-anchor="end">LEFT JOIN</text>
  <text x="458" y="220" font-size="9.5" fill="#e2e2e2" font-family="monospace">orders o</text>
  <text x="440" y="236" font-size="9.5" fill="#60a5fa" font-family="monospace" text-anchor="end">ON</text>
  <text x="458" y="236" font-size="9.5" fill="#e2e2e2" font-family="monospace">u.id = o.user_id</text>
  <text x="440" y="254" font-size="9.5" fill="#a78bfa" font-family="monospace" text-anchor="end">WHERE</text>
  <text x="458" y="254" font-size="9.5" fill="#e2e2e2" font-family="monospace">u.active = TRUE</text>
  <text x="458" y="270" font-size="9.5" fill="#fbbf24" font-family="monospace">AND o.total &gt; 100</text>
  <text x="440" y="288" font-size="9.5" fill="#a78bfa" font-family="monospace" text-anchor="end">ORDER BY</text>
  <text x="458" y="288" font-size="9.5" fill="#e2e2e2" font-family="monospace">o.created_at DESC</text>
  <text x="440" y="306" font-size="9.5" fill="#a78bfa" font-family="monospace" text-anchor="end">LIMIT</text>
  <text x="458" y="306" font-size="9.5" fill="#e2e2e2" font-family="monospace">50;</text>
  <text x="336" y="422" font-size="10" fill="#5a4d7a">Keywords right-aligned to column</text>
  <text x="336" y="438" font-size="10" fill="#5a4d7a">Visual "river" of columns aligned</text>
  <text x="336" y="454" font-size="10" fill="#5a4d7a">Popularized by Joe Celko style guide</text>

  <!-- Style 3: Lowercase / compact -->
  <rect x="610" y="86" width="265" height="380" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(52,211,153,0.2)" stroke-width="1"/>
  <rect x="610" y="86" width="265" height="36" rx="12" fill="rgba(52,211,153,0.08)"/>
  <rect x="610" y="106" width="265" height="16" fill="rgba(52,211,153,0.08)"/>
  <text x="630" y="110" font-size="11" font-weight="700" fill="#34d399">Compact / lowercase</text>
  <text x="630" y="136" font-size="9.5" fill="#60a5fa" font-family="monospace">select u.id, u.name, u.email,</text>
  <text x="630" y="152" font-size="9.5" fill="#34d399" font-family="monospace">  o.total</text>
  <text x="630" y="168" font-size="9.5" fill="#60a5fa" font-family="monospace">from users u</text>
  <text x="630" y="184" font-size="9.5" fill="#60a5fa" font-family="monospace">left join orders o</text>
  <text x="630" y="200" font-size="9.5" fill="#60a5fa" font-family="monospace">  on u.id = o.user_id</text>
  <text x="630" y="216" font-size="9.5" fill="#60a5fa" font-family="monospace">where u.active = true</text>
  <text x="630" y="232" font-size="9.5" fill="#fbbf24" font-family="monospace">  and o.total &gt; 100</text>
  <text x="630" y="248" font-size="9.5" fill="#60a5fa" font-family="monospace">order by o.created_at desc</text>
  <text x="630" y="264" font-size="9.5" fill="#60a5fa" font-family="monospace">limit 50;</text>
  <text x="626" y="422" font-size="10" fill="#5a4d7a">Lowercase keywords</text>
  <text x="626" y="438" font-size="10" fill="#5a4d7a">Compact column layout</text>
  <text x="626" y="454" font-size="10" fill="#5a4d7a">Preferred in some application code</text>
</svg>
