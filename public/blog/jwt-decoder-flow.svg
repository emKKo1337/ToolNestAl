<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <radialGradient id="gC" cx="50%" cy="40%" r="60%"><stop offset="0%" stop-color="#5b21b6" stop-opacity="0.2"/><stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="bG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient>
  </defs>
  <rect width="900" height="460" fill="url(#bg)"/>
  <ellipse cx="450" cy="230" rx="520" ry="320" fill="url(#gC)"/>

  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="900" fill="url(#aG)">How JWT Authentication Works</text>
  <text x="450" y="54" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.38)">A typical login-to-authenticated-request flow using JWTs</text>

  <!-- Step boxes with arrows -->
  <rect x="28" y="80" width="200" height="90" rx="10" fill="rgba(124,58,237,0.1)" stroke="rgba(124,58,237,0.25)" stroke-width="1"/>
  <text x="128" y="104" text-anchor="middle" font-size="11" font-weight="700" fill="#a78bfa">1. Client Login</text>
  <text x="128" y="124" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.55)">User submits</text>
  <text x="128" y="138" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.55)">username + password</text>
  <text x="128" y="156" text-anchor="middle" font-size="8.5" fill="rgba(255,255,255,0.3)">POST /login</text>

  <text x="248" y="130" text-anchor="middle" font-size="18" fill="rgba(255,255,255,0.25)">→</text>

  <rect x="266" y="80" width="200" height="90" rx="10" fill="rgba(14,116,144,0.1)" stroke="rgba(14,116,144,0.25)" stroke-width="1"/>
  <text x="366" y="104" text-anchor="middle" font-size="11" font-weight="700" fill="#67e8f9">2. Server Verifies</text>
  <text x="366" y="124" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.55)">Checks credentials,</text>
  <text x="366" y="138" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.55)">issues a signed JWT</text>
  <text x="366" y="156" text-anchor="middle" font-size="8.5" fill="rgba(255,255,255,0.3)">HMAC or RSA signature</text>

  <text x="486" y="130" text-anchor="middle" font-size="18" fill="rgba(255,255,255,0.25)">→</text>

  <rect x="504" y="80" width="200" height="90" rx="10" fill="rgba(16,185,129,0.08)" stroke="rgba(16,185,129,0.22)" stroke-width="1"/>
  <text x="604" y="104" text-anchor="middle" font-size="11" font-weight="700" fill="#34d399">3. Client Stores JWT</text>
  <text x="604" y="124" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.55)">Kept in memory or</text>
  <text x="604" y="138" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.55)">httpOnly cookie</text>
  <text x="604" y="156" text-anchor="middle" font-size="8.5" fill="rgba(255,255,255,0.3)">avoid localStorage for security</text>

  <text x="724" y="130" text-anchor="middle" font-size="18" fill="rgba(255,255,255,0.25)">→</text>

  <rect x="742" y="80" width="130" height="90" rx="10" fill="rgba(251,191,36,0.08)" stroke="rgba(251,191,36,0.22)" stroke-width="1"/>
  <text x="807" y="104" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fbbf24">4. API Requests</text>
  <text x="807" y="124" text-anchor="middle" font-size="8.5" fill="rgba(255,255,255,0.55)">Sent with each</text>
  <text x="807" y="138" text-anchor="middle" font-size="8.5" fill="rgba(255,255,255,0.55)">subsequent request</text>
  <text x="807" y="156" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.3)">Authorization: Bearer</text>

  <!-- Down arrow -->
  <text x="450" y="196" text-anchor="middle" font-size="18" fill="rgba(255,255,255,0.25)">↓</text>

  <!-- Server verification step -->
  <rect x="140" y="206" width="620" height="100" rx="10" fill="rgba(244,114,182,0.06)" stroke="rgba(244,114,182,0.22)" stroke-width="1"/>
  <text x="450" y="228" text-anchor="middle" font-size="12" font-weight="700" fill="#f472b6">5. Server Verifies Signature on Every Request</text>
  <text x="450" y="248" text-anchor="middle" font-size="9.5" fill="rgba(255,255,255,0.55)">Recomputes HMACSHA256(header + "." + payload, secret_key) and compares to the token's signature.</text>
  <text x="450" y="266" text-anchor="middle" font-size="9.5" fill="rgba(255,255,255,0.55)">Also checks exp (not expired) and nbf (already valid) claims before trusting the payload.</text>
  <text x="450" y="288" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.32)">If the signature doesn't match or the token has expired → request is rejected with 401 Unauthorized</text>

  <!-- Key insight -->
  <rect x="28" y="326" width="844" height="94" rx="10" fill="rgba(124,58,237,0.08)" stroke="rgba(124,58,237,0.2)" stroke-width="1"/>
  <text x="450" y="350" text-anchor="middle" font-size="11" font-weight="700" fill="rgba(167,139,250,0.9)">Why This Is "Stateless" Authentication</text>
  <text x="450" y="372" text-anchor="middle" font-size="9.5" fill="rgba(255,255,255,0.55)">The server does not need to store session data — all the information needed to verify the request</text>
  <text x="450" y="390" text-anchor="middle" font-size="9.5" fill="rgba(255,255,255,0.55)">is contained in the token itself. This makes JWTs ideal for distributed systems and microservices,</text>
  <text x="450" y="408" text-anchor="middle" font-size="9.5" fill="rgba(255,255,255,0.55)">where multiple servers can verify the same token without needing a shared session store.</text>

  <text x="450" y="446" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.2)">toolnestai.net/developer-tools/jwt-decoder</text>
</svg>
