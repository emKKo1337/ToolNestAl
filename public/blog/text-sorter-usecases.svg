<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <radialGradient id="gC" cx="50%" cy="40%" r="60%"><stop offset="0%" stop-color="#0e7490" stop-opacity="0.2"/><stop offset="100%" stop-color="#0e7490" stop-opacity="0"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
  </defs>
  <rect width="900" height="460" fill="url(#bg)"/>
  <ellipse cx="450" cy="230" rx="520" ry="320" fill="url(#gC)"/>

  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="900" fill="url(#aG)">Case Sensitivity — The Silent Sort Bug</text>
  <text x="450" y="54" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.38)">Why "apple" and "Apple" can end up far apart in a naive sort</text>

  <!-- Case-sensitive -->
  <rect x="28" y="70" width="410" height="150" rx="10" fill="rgba(239,68,68,0.06)" stroke="rgba(239,68,68,0.2)" stroke-width="1"/>
  <text x="233" y="94" text-anchor="middle" font-size="12" font-weight="700" fill="#f87171">✗ Case-Sensitive Sort (default in most languages)</text>
  <g font-family="monospace" font-size="12" fill="rgba(252,165,165,0.85)">
    <text x="44" y="122">Apple</text>
    <text x="44" y="142">Banana</text>
    <text x="44" y="162">Cherry</text>
    <text x="44" y="182">apple</text>
    <text x="44" y="202">banana</text>
  </g>
  <text x="240" y="122" font-size="9" fill="rgba(255,255,255,0.4)">← ASCII: uppercase letters</text>
  <text x="240" y="140" font-size="9" fill="rgba(255,255,255,0.4)">(A-Z, codes 65-90) sort</text>
  <text x="240" y="158" font-size="9" fill="rgba(255,255,255,0.4)">entirely before lowercase</text>
  <text x="240" y="176" font-size="9" fill="rgba(255,255,255,0.4)">(a-z, codes 97-122)</text>

  <!-- Case-insensitive -->
  <rect x="462" y="70" width="410" height="150" rx="10" fill="rgba(52,211,153,0.06)" stroke="rgba(52,211,153,0.2)" stroke-width="1"/>
  <text x="667" y="94" text-anchor="middle" font-size="12" font-weight="700" fill="#6ee7b7">✓ Case-Insensitive Sort (usually what you want)</text>
  <g font-family="monospace" font-size="12" fill="rgba(110,231,183,0.9)">
    <text x="478" y="122">Apple</text>
    <text x="478" y="142">apple</text>
    <text x="478" y="162">Banana</text>
    <text x="478" y="182">banana</text>
    <text x="478" y="202">Cherry</text>
  </g>
  <text x="676" y="122" font-size="9" fill="rgba(255,255,255,0.4)">← Compares after lowercasing</text>
  <text x="676" y="140" font-size="9" fill="rgba(255,255,255,0.4)">both strings — groups "Apple"</text>
  <text x="676" y="158" font-size="9" fill="rgba(255,255,255,0.4)">and "apple" together as</text>
  <text x="676" y="176" font-size="9" fill="rgba(255,255,255,0.4)">expected by most readers</text>

  <!-- ASCII table snippet -->
  <rect x="28" y="230" width="844" height="90" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(124,58,237,0.15)" stroke-width="1"/>
  <text x="450" y="252" text-anchor="middle" font-size="10" font-weight="700" fill="rgba(167,139,250,0.85)">WHY THIS HAPPENS — ASCII CODE ORDER</text>
  <g font-family="monospace" font-size="9.5" text-anchor="middle">
    <text x="150" y="276" fill="rgba(255,255,255,0.5)">'A'-'Z'</text>
    <text x="150" y="292" fill="rgba(167,139,250,0.8)">codes 65-90</text>
    <text x="380" y="276" fill="rgba(255,255,255,0.5)">'0'-'9'</text>
    <text x="380" y="292" fill="rgba(103,232,249,0.8)">codes 48-57</text>
    <text x="600" y="276" fill="rgba(255,255,255,0.5)">'a'-'z'</text>
    <text x="600" y="292" fill="rgba(52,211,153,0.8)">codes 97-122</text>
  </g>
  <text x="450" y="308" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.32)">Digits sort before uppercase, which sorts before lowercase — in raw character-code comparison</text>

  <!-- Recommendation -->
  <rect x="28" y="330" width="844" height="88" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="450" y="352" text-anchor="middle" font-size="9.5" font-weight="700" fill="rgba(255,255,255,0.4)">DEFAULT CHOICE</text>
  <text x="450" y="374" text-anchor="middle" font-size="9.5" fill="rgba(255,255,255,0.5)">Most sorting tools, spreadsheet programs, and the ToolNest Text Sorter default to case-insensitive</text>
  <text x="450" y="392" text-anchor="middle" font-size="9.5" fill="rgba(255,255,255,0.5)">alphabetical sorting, since it matches how humans naturally expect a word list to be ordered —</text>
  <text x="450" y="408" text-anchor="middle" font-size="9.5" fill="rgba(255,255,255,0.5)">grouping "Apple" and "apple" together regardless of capitalization.</text>

  <text x="450" y="446" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.2)">toolnestai.net/text-tools/text-sorter</text>
</svg>
