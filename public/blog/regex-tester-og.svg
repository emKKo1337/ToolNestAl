  <rect x="630" y="60" width="530" height="36" rx="16" fill="rgba(255,255,255,0.05)"/>
  <rect x="630" y="78" width="530" height="18" fill="rgba(255,255,255,0.02)"/>
  <circle cx="655" cy="78" r="6" fill="rgba(239,68,68,0.6)"/>
  <circle cx="675" cy="78" r="6" fill="rgba(251,191,36,0.6)"/>
  <circle cx="695" cy="78" r="6" fill="rgba(34,197,94,0.6)"/>

  <text x="648" y="122" font-size="8.5" font-weight="700" fill="rgba(255,255,255,0.3)">PATTERN</text>
  <rect x="640" y="128" width="506" height="34" rx="8" fill="rgba(0,0,0,0.5)" stroke="rgba(124,58,237,0.4)" stroke-width="1.5"/>
  <text x="656" y="150" font-family="monospace" font-size="13" fill="rgba(167,139,250,0.9)">/^(\d{3})-(\d{3})-(\d{4})$/gm</text>

