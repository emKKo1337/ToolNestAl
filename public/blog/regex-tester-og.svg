  <text x="722" y="306" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.4)">found instantly</text>

  <rect x="812" y="270" width="164" height="44" rx="7" fill="rgba(124,58,237,0.1)" stroke="rgba(124,58,237,0.22)" stroke-width="1"/>
  <text x="894" y="292" text-anchor="middle" font-size="16" font-weight="900" fill="#a78bfa">3 groups</text>
  <text x="894" y="306" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.4)">captured per match</text>

  <text x="648" y="336" font-size="8.5" font-weight="700" fill="rgba(255,255,255,0.3)">QUICK REFERENCE</text>
  <g font-family="monospace" font-size="9.5">
    <rect x="640" y="342" width="506" height="124" rx="7" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="656" y="364" fill="rgba(255,255,255,0.5)">\d <tspan fill="rgba(167,139,250,0.8)">digit</tspan>   \w <tspan fill="rgba(167,139,250,0.8)">word char</tspan>   \s <tspan fill="rgba(167,139,250,0.8)">whitespace</tspan></text>
    <text x="656" y="388" fill="rgba(255,255,255,0.5)">^ <tspan fill="rgba(103,232,249,0.8)">start</tspan>   $ <tspan fill="rgba(103,232,249,0.8)">end</tspan>   \b <tspan fill="rgba(103,232,249,0.8)">word boundary</tspan></text>
    <text x="656" y="412" fill="rgba(255,255,255,0.5)">* <tspan fill="rgba(52,211,153,0.8)">0+</tspan>   + <tspan fill="rgba(52,211,153,0.8)">1+</tspan>   ? <tspan fill="rgba(52,211,153,0.8)">0 or 1</tspan>   {`{n,m}`} <tspan fill="rgba(52,211,153,0.8)">count</tspan></text>
    <text x="656" y="436" fill="rgba(255,255,255,0.5)">(...) <tspan fill="rgba(251,191,36,0.8)">group</tspan>   [...] <tspan fill="rgba(251,191,36,0.8)">char class</tspan>   a|b <tspan fill="rgba(251,191,36,0.8)">or</tspan></text>
    <text x="656" y="458" fill="rgba(255,255,255,0.4)">Full cheat sheet included in the article →</text>
  </g>

  <rect x="620" y="550" width="560" height="14" rx="4" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
