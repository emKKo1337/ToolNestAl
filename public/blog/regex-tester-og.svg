  <rect x="640" y="190" width="506" height="70" rx="8" fill="rgba(0,0,0,0.4)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="656" y="212" font-family="monospace" font-size="10.5" fill="rgba(255,255,255,0.55)">Call </text>
  <rect x="682" y="200" width="86" height="16" rx="3" fill="rgba(52,211,153,0.3)"/>
  <text x="688" y="212" font-family="monospace" font-size="10.5" fill="#6ee7b7">555-123-4567</text>
  <text x="656" y="234" font-family="monospace" font-size="10.5" fill="rgba(255,255,255,0.55)">or </text>
  <rect x="676" y="222" width="86" height="16" rx="3" fill="rgba(52,211,153,0.3)"/>
  <text x="682" y="234" font-family="monospace" font-size="10.5" fill="#6ee7b7">800-555-0199</text>

  <rect x="640" y="270" width="164" height="44" rx="7" fill="rgba(52,211,153,0.1)" stroke="rgba(52,211,153,0.22)" stroke-width="1"/>
