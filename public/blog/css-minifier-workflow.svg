<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Segoe UI',sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0f0825"/>
      <stop offset="100%" stop-color="#05030d"/>
    </radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <radialGradient id="g1" cx="30%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#5b21b6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="900" height="480" fill="url(#bg)"/>
  <ellipse cx="300" cy="240" rx="350" ry="250" fill="url(#g1)"/>

  <text x="450" y="46" font-size="22" font-weight="800" fill="#e2e2e2" text-anchor="middle">Minifier vs Bundler vs CDN: Which Layer Minifies?</text>
  <text x="450" y="68" font-size="13" fill="#7a6d84" text-anchor="middle">Understand where CSS minification happens in a modern web workflow</text>

  <!-- Step 1: Write -->
  <rect x="40" y="100" width="150" height="90" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(167,139,250,0.25)" stroke-width="1"/>
  <text x="115" y="130" font-size="24" text-anchor="middle">✏️</text>
  <text x="115" y="152" font-size="12" font-weight="700" fill="#e2e2e2" text-anchor="middle">Write CSS</text>
  <text x="115" y="168" font-size="10" fill="#5a4d7a" text-anchor="middle">Human-readable</text>
  <text x="115" y="180" font-size="10" fill="#5a4d7a" text-anchor="middle">Comments, indent</text>

  <!-- Arrow -->
  <path d="M190,145 L230,145" stroke="url(#aG)" stroke-width="2" marker-end="url(#arr)"/>
  <defs><marker id="arr" markerWidth="8" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#a78bfa"/></marker></defs>

  <!-- Step 2: Minifier (standalone) -->
  <rect x="230" y="90" width="160" height="110" rx="12" fill="rgba(167,139,250,0.08)" stroke="rgba(167,139,250,0.4)" stroke-width="1.5"/>
  <text x="310" y="120" font-size="22" text-anchor="middle">🗜️</text>
  <text x="310" y="142" font-size="12" font-weight="700" fill="#a78bfa" text-anchor="middle">Standalone</text>
  <text x="310" y="157" font-size="12" font-weight="700" fill="#a78bfa" text-anchor="middle">Minifier</text>
  <text x="310" y="175" font-size="9" fill="#5a4d7a" text-anchor="middle">ToolNest, clean-css</text>
  <text x="310" y="188" font-size="9" fill="#5a4d7a" text-anchor="middle">cssnano CLI</text>

  <path d="M390,145 L430,145" stroke="url(#aG)" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 3: Bundler -->
  <rect x="430" y="90" width="160" height="110" rx="12" fill="rgba(96,165,250,0.08)" stroke="rgba(96,165,250,0.35)" stroke-width="1.5"/>
  <text x="510" y="120" font-size="22" text-anchor="middle">📦</text>
  <text x="510" y="142" font-size="12" font-weight="700" fill="#60a5fa" text-anchor="middle">Bundler</text>
  <text x="510" y="158" font-size="12" font-weight="700" fill="#60a5fa" text-anchor="middle">(Webpack/Vite)</text>
  <text x="510" y="175" font-size="9" fill="#5a4d7a" text-anchor="middle">Built-in minification</text>
  <text x="510" y="188" font-size="9" fill="#5a4d7a" text-anchor="middle">on production build</text>

  <path d="M590,145 L630,145" stroke="url(#aG)" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 4: CDN -->
  <rect x="630" y="90" width="160" height="110" rx="12" fill="rgba(52,211,153,0.08)" stroke="rgba(52,211,153,0.3)" stroke-width="1.5"/>
  <text x="710" y="120" font-size="22" text-anchor="middle">🌐</text>
  <text x="710" y="142" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">CDN</text>
  <text x="710" y="158" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">(Cloudflare etc)</text>
  <text x="710" y="175" font-size="9" fill="#5a4d7a" text-anchor="middle">Edge minification</text>
  <text x="710" y="188" font-size="9" fill="#5a4d7a" text-anchor="middle">+ compression</text>

  <!-- Which to use table -->
  <rect x="40" y="225" width="820" height="30" rx="8" fill="rgba(255,255,255,0.04)"/>
  <text x="60" y="245" font-size="11" font-weight="700" fill="#4d4354" letter-spacing="0.08em">SCENARIO</text>
  <text x="340" y="245" font-size="11" font-weight="700" fill="#4d4354" letter-spacing="0.08em">BEST APPROACH</text>
  <text x="620" y="245" font-size="11" font-weight="700" fill="#4d4354" letter-spacing="0.08em">WHY</text>

  <!-- Rows -->
  <line x1="40" y1="255" x2="860" y2="255" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="60" y="274" font-size="11" fill="#9b8da8">One-off stylesheet or quick share</text>
  <text x="340" y="274" font-size="11" fill="#a78bfa">Standalone minifier (ToolNest)</text>
  <text x="620" y="274" font-size="11" fill="#5a4d7a">No build step needed</text>

  <line x1="40" y1="283" x2="860" y2="283" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="60" y="302" font-size="11" fill="#9b8da8">React / Vue / Svelte project</text>
  <text x="340" y="302" font-size="11" fill="#60a5fa">Vite / Webpack with cssnano</text>
  <text x="620" y="302" font-size="11" fill="#5a4d7a">Integrated into build pipeline</text>

  <line x1="40" y1="311" x2="860" y2="311" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="60" y="330" font-size="11" fill="#9b8da8">Static site (Jekyll, Hugo)</text>
  <text x="340" y="330" font-size="11" fill="#34d399">PostCSS + cssnano plugin</text>
  <text x="620" y="330" font-size="11" fill="#5a4d7a">Works as a build transform</text>

  <line x1="40" y1="339" x2="860" y2="339" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="60" y="358" font-size="11" fill="#9b8da8">Already deployed, legacy site</text>
  <text x="340" y="358" font-size="11" fill="#fbbf24">CDN edge minification</text>
  <text x="620" y="358" font-size="11" fill="#5a4d7a">No code changes needed</text>

  <line x1="40" y1="367" x2="860" y2="367" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="60" y="386" font-size="11" fill="#9b8da8">WordPress / CMS site</text>
  <text x="340" y="386" font-size="11" fill="#f472b6">Plugin (Autoptimize, W3TC)</text>
  <text x="620" y="386" font-size="11" fill="#5a4d7a">Plugin handles CSS minification</text>

  <line x1="40" y1="395" x2="860" y2="395" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="60" y="414" font-size="11" fill="#9b8da8">Debug, inspect or audit</text>
  <text x="340" y="414" font-size="11" fill="#c4b5fd">Prettify first, then minify</text>
  <text x="620" y="414" font-size="11" fill="#5a4d7a">Unminify → read → minify again</text>

  <line x1="40" y1="420" x2="860" y2="420" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <text x="450" y="450" font-size="11" fill="#3d3356" text-anchor="middle">All approaches produce equivalent minified output — the difference is automation and integration</text>
</svg>
