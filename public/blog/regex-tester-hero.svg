<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <radialGradient id="gL" cx="10%" cy="50%" r="60%"><stop offset="0%" stop-color="#5b21b6" stop-opacity="0.35"/><stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/></radialGradient>
    <radialGradient id="gR" cx="90%" cy="50%" r="60%"><stop offset="0%" stop-color="#0e7490" stop-opacity="0.2"/><stop offset="100%" stop-color="#0e7490" stop-opacity="0"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="bG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient>
    <linearGradient id="lapG" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1a1040"/><stop offset="100%" stop-color="#0d0824"/></linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#5b21b6" flood-opacity="0.45"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <ellipse cx="120" cy="337" rx="700" ry="550" fill="url(#gL)"/>
  <ellipse cx="1080" cy="337" rx="700" ry="550" fill="url(#gR)"/>

  <text x="600" y="42" text-anchor="middle" font-size="13" font-weight="700" fill="url(#aG)" filter="url(#glow)">ToolNest AI — Developer Tools</text>
  <text x="600" y="68" text-anchor="middle" font-size="34" font-weight="900" fill="url(#aG)" filter="url(#glow)">Regex Tester</text>
  <text x="600" y="90" text-anchor="middle" font-size="13" fill="rgba(255,255,255,0.35)">Live match highlighting · Capture groups · Flags · Cheat sheet — Free, client-side</text>

  <rect x="60" y="108" width="1080" height="542" rx="18" fill="url(#lapG)" stroke="rgba(124,58,237,0.35)" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="60" y="108" width="1080" height="38" rx="18" fill="rgba(255,255,255,0.05)"/>
  <rect x="60" y="128" width="1080" height="18" fill="rgba(255,255,255,0.02)"/>
  <circle cx="90" cy="127" r="7" fill="rgba(239,68,68,0.65)"/>
  <circle cx="114" cy="127" r="7" fill="rgba(251,191,36,0.65)"/>
  <circle cx="138" cy="127" r="7" fill="rgba(34,197,94,0.65)"/>
  <text x="600" y="132" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.2)">toolnestai.net/developer-tools/regex-tester</text>

  <!-- Pattern -->
  <text x="88" y="176" font-size="9" font-weight="700" fill="rgba(255,255,255,0.28)">REGULAR EXPRESSION</text>
  <rect x="80" y="182" width="580" height="42" rx="9" fill="rgba(0,0,0,0.55)" stroke="rgba(124,58,237,0.45)" stroke-width="1.5"/>
  <text x="98" y="209" font-family="monospace" font-size="16" fill="rgba(167,139,250,0.92)">/^(\d{3})-(\d{3})-(\d{4})$/</text>
  <rect x="674" y="182" width="166" height="42" rx="9" fill="rgba(14,116,144,0.25)" stroke="rgba(14,116,144,0.45)" stroke-width="1.5"/>
  <g font-size="10.5" text-anchor="middle">
    <text x="702" y="199" fill="#67e8f9" font-weight="700">g</text>
    <text x="729" y="199" fill="rgba(255,255,255,0.3)">i</text>
    <text x="756" y="199" fill="rgba(255,255,255,0.3)">m</text>
    <text x="783" y="199" fill="rgba(255,255,255,0.3)">s</text>
    <text x="810" y="199" fill="rgba(255,255,255,0.3)">u</text>
    <text x="757" y="215" fill="rgba(255,255,255,0.3)" font-size="8">global · case · multiline</text>
  </g>

  <!-- Test string -->
  <text x="88" y="248" font-size="9" font-weight="700" fill="rgba(255,255,255,0.28)">TEST STRING</text>
  <rect x="80" y="254" width="760" height="90" rx="10" fill="rgba(0,0,0,0.4)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="98" y="278" font-family="monospace" font-size="12" fill="rgba(255,255,255,0.55)">Call me at </text>
  <rect x="184" y="264" width="98" height="18" rx="3" fill="rgba(52,211,153,0.3)"/>
  <text x="190" y="278" font-family="monospace" font-size="12" fill="#6ee7b7">555-123-4567</text>
  <text x="98" y="304" font-family="monospace" font-size="12" fill="rgba(255,255,255,0.55)">or the office line </text>
  <rect x="240" y="291" width="98" height="18" rx="3" fill="rgba(52,211,153,0.3)"/>
  <text x="246" y="304" font-family="monospace" font-size="12" fill="#6ee7b7">800-555-0199</text>
  <text x="98" y="330" font-family="monospace" font-size="12" fill="rgba(255,255,255,0.55)">Invalid: 12-34-5678 (won't match)</text>

  <!-- Match results panel -->
  <rect x="860" y="182" width="260" height="162" rx="10" fill="rgba(255,255,255,0.025)" stroke="rgba(124,58,237,0.2)" stroke-width="1"/>
  <text x="990" y="204" text-anchor="middle" font-size="10" font-weight="700" fill="rgba(255,255,255,0.5)">Match Results</text>
  <rect x="874" y="214" width="232" height="30" rx="6" fill="rgba(52,211,153,0.1)" stroke="rgba(52,211,153,0.22)" stroke-width="1"/>
  <text x="990" y="233" text-anchor="middle" font-size="13" font-weight="900" fill="#34d399">2 matches found</text>
  <text x="874" y="262" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.5)">Match 1: 555-123-4567</text>
  <text x="874" y="276" font-family="monospace" font-size="8" fill="rgba(167,139,250,0.7)">  Group 1: 555</text>
  <text x="874" y="288" font-family="monospace" font-size="8" fill="rgba(103,232,249,0.7)">  Group 2: 123</text>
  <text x="874" y="300" font-family="monospace" font-size="8" fill="rgba(251,191,36,0.7)">  Group 3: 4567</text>
  <text x="874" y="320" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.5)">Match 2: 800-555-0199</text>
  <text x="874" y="334" font-size="8" fill="rgba(255,255,255,0.3)">at index 42-53</text>

  <!-- Cheat sheet -->
  <text x="88" y="378" font-size="9" font-weight="700" fill="rgba(255,255,255,0.28)">CHEAT SHEET</text>
  <g font-family="monospace" font-size="10">
    <rect x="80" y="384" width="245" height="200" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="96" y="404" fill="rgba(255,255,255,0.35)" font-family="'Segoe UI'" font-size="9" font-weight="700">CHARACTER CLASSES</text>
    <text x="96" y="422" fill="rgba(167,139,250,0.85)">\d <tspan fill="rgba(255,255,255,0.5)">any digit 0-9</tspan></text>
    <text x="96" y="440" fill="rgba(167,139,250,0.85)">\w <tspan fill="rgba(255,255,255,0.5)">word char [A-Za-z0-9_]</tspan></text>
    <text x="96" y="458" fill="rgba(167,139,250,0.85)">\s <tspan fill="rgba(255,255,255,0.5)">whitespace</tspan></text>
    <text x="96" y="476" fill="rgba(167,139,250,0.85)">. <tspan fill="rgba(255,255,255,0.5)">any char except \n</tspan></text>
    <text x="96" y="494" fill="rgba(167,139,250,0.85)">[abc] <tspan fill="rgba(255,255,255,0.5)">a, b, or c</tspan></text>
    <text x="96" y="512" fill="rgba(167,139,250,0.85)">[^abc] <tspan fill="rgba(255,255,255,0.5)">not a, b, or c</tspan></text>
    <text x="96" y="530" fill="rgba(167,139,250,0.85)">[a-z] <tspan fill="rgba(255,255,255,0.5)">range a to z</tspan></text>
    <text x="96" y="558" fill="rgba(255,255,255,0.35)" font-family="'Segoe UI'" font-size="9" font-weight="700">ANCHORS</text>
    <text x="96" y="576" fill="rgba(103,232,249,0.85)">^ $ <tspan fill="rgba(255,255,255,0.5)">start / end of string</tspan></text>

    <rect x="335" y="384" width="245" height="200" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="351" y="404" fill="rgba(255,255,255,0.35)" font-family="'Segoe UI'" font-size="9" font-weight="700">QUANTIFIERS</text>
    <text x="351" y="422" fill="rgba(52,211,153,0.85)">* <tspan fill="rgba(255,255,255,0.5)">0 or more</tspan></text>
    <text x="351" y="440" fill="rgba(52,211,153,0.85)">+ <tspan fill="rgba(255,255,255,0.5)">1 or more</tspan></text>
    <text x="351" y="458" fill="rgba(52,211,153,0.85)">? <tspan fill="rgba(255,255,255,0.5)">0 or 1 (optional)</tspan></text>
    <text x="351" y="476" fill="rgba(52,211,153,0.85)">{`{n}`} <tspan fill="rgba(255,255,255,0.5)">exactly n</tspan></text>
    <text x="351" y="494" fill="rgba(52,211,153,0.85)">{`{n,}`} <tspan fill="rgba(255,255,255,0.5)">n or more</tspan></text>
    <text x="351" y="512" fill="rgba(52,211,153,0.85)">{`{n,m}`} <tspan fill="rgba(255,255,255,0.5)">between n and m</tspan></text>
    <text x="351" y="540" fill="rgba(255,255,255,0.35)" font-family="'Segoe UI'" font-size="9" font-weight="700">GROUPS</text>
    <text x="351" y="558" fill="rgba(251,191,36,0.85)">(...) <tspan fill="rgba(255,255,255,0.5)">capture group</tspan></text>
    <text x="351" y="576" fill="rgba(251,191,36,0.85)">(?:...) <tspan fill="rgba(255,255,255,0.5)">non-capturing</tspan></text>

    <rect x="590" y="384" width="245" height="200" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="606" y="404" fill="rgba(255,255,255,0.35)" font-family="'Segoe UI'" font-size="9" font-weight="700">FLAGS</text>
    <text x="606" y="422" fill="rgba(244,114,182,0.85)">g <tspan fill="rgba(255,255,255,0.5)">global — find all matches</tspan></text>
    <text x="606" y="440" fill="rgba(244,114,182,0.85)">i <tspan fill="rgba(255,255,255,0.5)">case-insensitive</tspan></text>
    <text x="606" y="458" fill="rgba(244,114,182,0.85)">m <tspan fill="rgba(255,255,255,0.5)">multiline ^ $ per line</tspan></text>
    <text x="606" y="476" fill="rgba(244,114,182,0.85)">s <tspan fill="rgba(255,255,255,0.5)">dotall — . matches \n</tspan></text>
    <text x="606" y="494" fill="rgba(244,114,182,0.85)">u <tspan fill="rgba(255,255,255,0.5)">unicode mode</tspan></text>
    <text x="606" y="512" fill="rgba(244,114,182,0.85)">y <tspan fill="rgba(255,255,255,0.5)">sticky — match at lastIndex</tspan></text>
    <text x="606" y="540" fill="rgba(255,255,255,0.35)" font-family="'Segoe UI'" font-size="9" font-weight="700">LOOKAROUND</text>
    <text x="606" y="558" fill="rgba(129,140,248,0.85)">(?=...) <tspan fill="rgba(255,255,255,0.5)">lookahead</tspan></text>
    <text x="606" y="576" fill="rgba(129,140,248,0.85)">(?!...) <tspan fill="rgba(255,255,255,0.5)">negative lookahead</tspan></text>
  </g>

  <!-- Buttons -->
  <rect x="860" y="358" width="260" height="34" rx="9" fill="url(#bG)" filter="url(#sh)"/>
  <text x="990" y="380" text-anchor="middle" font-size="12" font-weight="900" fill="#fff">Copy Pattern</text>
  <rect x="860" y="400" width="260" height="34" rx="9" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="990" y="422" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.35)">Replace Mode</text>
  <rect x="860" y="442" width="260" height="34" rx="9" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="990" y="464" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.35)">Common Patterns ▾</text>

  <!-- Bottom common patterns row -->
  <text x="88" y="616" font-size="9" font-weight="700" fill="rgba(255,255,255,0.28)">COMMON PATTERNS</text>
  <g font-family="monospace" font-size="9" text-anchor="middle">
    <rect x="80" y="622" width="248" height="24" rx="5" fill="rgba(124,58,237,0.1)" stroke="rgba(124,58,237,0.2)" stroke-width="1"/>
    <text x="204" y="638" fill="rgba(167,139,250,0.8)">Email · URL · IPv4</text>
    <rect x="336" y="622" width="248" height="24" rx="5" fill="rgba(14,116,144,0.08)" stroke="rgba(14,116,144,0.18)" stroke-width="1"/>
    <text x="460" y="638" fill="rgba(103,232,249,0.8)">Phone · Zip Code · Date</text>
    <rect x="592" y="622" width="248" height="24" rx="5" fill="rgba(16,185,129,0.06)" stroke="rgba(16,185,129,0.16)" stroke-width="1"/>
    <text x="716" y="638" fill="rgba(52,211,153,0.8)">Password Strength · Hex Color</text>
  </g>

  <rect x="48" y="650" width="1104" height="16" rx="5" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="460" y="664" width="280" height="10" rx="5" fill="rgba(255,255,255,0.025)"/>
</svg>
