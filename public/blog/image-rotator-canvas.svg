<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <radialGradient id="gC" cx="50%" cy="40%" r="60%"><stop offset="0%" stop-color="#0e7490" stop-opacity="0.2"/><stop offset="100%" stop-color="#0e7490" stop-opacity="0"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
  </defs>
  <rect width="900" height="460" fill="url(#bg)"/>
  <ellipse cx="450" cy="230" rx="520" ry="320" fill="url(#gC)"/>
  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="900" fill="url(#aG)">Canvas Expansion and Cropping After Rotation</text>
  <text x="450" y="54" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.38)">Two approaches to handling corners when rotating to arbitrary angles</text>
  <!-- Expand canvas -->
  <rect x="28" y="72" width="406" height="300" rx="10" fill="rgba(167,139,250,0.05)" stroke="rgba(167,139,250,0.2)" stroke-width="1"/>
  <text x="231" y="96" text-anchor="middle" font-size="11" font-weight="700" fill="#a78bfa">Option A: Expand canvas to fit</text>
  <text x="231" y="116" text-anchor="middle" font-size="9.5" fill="rgba(255,255,255,0.5)">Output dimensions grow to contain all rotated pixels</text>
  <!-- Visual -->
  <g transform="translate(231, 230)">
    <rect x="-120" y="-70" width="240" height="140" rx="4" fill="none" stroke="rgba(167,139,250,0.2)" stroke-width="1" stroke-dasharray="4,3"/>
    <rect x="-90" y="-55" width="180" height="110" rx="4" fill="rgba(167,139,250,0.15)" stroke="rgba(167,139,250,0.4)" stroke-width="1.5" transform="rotate(25)"/>
  </g>
  <text x="231" y="328" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">Corners filled with transparent (PNG) or</text>
  <text x="231" y="344" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">solid white (JPG) — no content lost</text>
  <text x="231" y="362" text-anchor="middle" font-size="9" font-weight="700" fill="rgba(167,139,250,0.8)">Larger file, all pixels preserved</text>

  <!-- Crop to original -->
  <rect x="466" y="72" width="406" height="300" rx="10" fill="rgba(52,211,153,0.05)" stroke="rgba(52,211,153,0.2)" stroke-width="1"/>
  <text x="669" y="96" text-anchor="middle" font-size="11" font-weight="700" fill="#6ee7b7">Option B: Crop to original size</text>
  <text x="669" y="116" text-anchor="middle" font-size="9.5" fill="rgba(255,255,255,0.5)">Keep original dimensions, clip rotated corners</text>
  <!-- Visual -->
  <g transform="translate(669, 230)">
    <rect x="-90" y="-55" width="180" height="110" rx="4" fill="rgba(52,211,153,0.1)" stroke="rgba(52,211,153,0.35)" stroke-width="1.5" transform="rotate(25)"/>
    <rect x="-90" y="-55" width="180" height="110" rx="4" fill="rgba(52,211,153,0.05)" stroke="rgba(52,211,153,0.5)" stroke-width="1.5"/>
    <!-- Clip corners shaded -->
    <clipPath id="c"><rect x="-90" y="-55" width="180" height="110" rx="0"/></clipPath>
  </g>
  <text x="669" y="328" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">Outer pixel areas are clipped off</text>
  <text x="669" y="344" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">original width × height preserved</text>
  <text x="669" y="362" text-anchor="middle" font-size="9" font-weight="700" fill="rgba(52,211,153,0.8)">Same size file, corners lost</text>

  <!-- Note -->
  <rect x="28" y="384" width="835" height="50" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="450" y="404" text-anchor="middle" font-size="9.5" fill="rgba(255,255,255,0.5)">For 90°/180°/270° rotations: dimensions either stay the same (180°) or swap (90°/270°) — no canvas math needed.</text>
  <text x="450" y="422" text-anchor="middle" font-size="9.5" fill="rgba(255,255,255,0.5)">For arbitrary angles: the diagonal of the image determines the minimum canvas needed to contain all corners.</text>
  <text x="450" y="444" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.2)">toolnestai.net/image-tools/image-rotator</text>
</svg>
