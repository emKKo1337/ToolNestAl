<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
  </defs>
  <rect width="900" height="460" fill="url(#bg)"/>
  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="900" fill="url(#aG)">Reading a Histogram</text>
  <text x="450" y="54" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.38)">The histogram tells you where pixels cluster — and whether your exposure is correct</text>
  <!-- Axis labels -->
  <text x="55" y="92" font-size="8.5" fill="rgba(255,255,255,0.25)">0 (black)</text>
  <text x="434" y="92" text-anchor="middle" font-size="8.5" fill="rgba(255,255,255,0.25)">128 (mid-gray)</text>
  <text x="830" y="92" font-size="8.5" fill="rgba(255,255,255,0.25)">255 (white)</text>
  <!-- Normal histogram -->
  <rect x="30" y="100" width="260" height="150" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="160" y="118" text-anchor="middle" font-size="10" font-weight="700" fill="rgba(52,211,153,0.8)">Well-Exposed</text>
  <g>
    <line x1="45" y1="238" x2="275" y2="238" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <!-- bars: bell-curve shape centered -->
    <rect x="50" y="220" width="12" height="18" rx="1" fill="rgba(167,139,250,0.4)"/>
    <rect x="65" y="210" width="12" height="28" rx="1" fill="rgba(167,139,250,0.5)"/>
    <rect x="80" y="196" width="12" height="42" rx="1" fill="rgba(167,139,250,0.6)"/>
    <rect x="95" y="184" width="12" height="54" rx="1" fill="rgba(167,139,250,0.7)"/>
    <rect x="110" y="172" width="12" height="66" rx="1" fill="rgba(167,139,250,0.8)"/>
    <rect x="125" y="160" width="12" height="78" rx="1" fill="rgba(167,139,250,0.9)"/>
    <rect x="140" y="168" width="12" height="70" rx="1" fill="rgba(167,139,250,0.85)"/>
    <rect x="155" y="180" width="12" height="58" rx="1" fill="rgba(167,139,250,0.75)"/>
    <rect x="170" y="192" width="12" height="46" rx="1" fill="rgba(167,139,250,0.65)"/>
    <rect x="185" y="204" width="12" height="34" rx="1" fill="rgba(167,139,250,0.55)"/>
    <rect x="200" y="216" width="12" height="22" rx="1" fill="rgba(167,139,250,0.45)"/>
    <rect x="215" y="224" width="12" height="14" rx="1" fill="rgba(167,139,250,0.35)"/>
  </g>
  <!-- Underexposed histogram -->
  <rect x="320" y="100" width="260" height="150" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(239,68,68,0.15)" stroke-width="1"/>
  <text x="450" y="118" text-anchor="middle" font-size="10" font-weight="700" fill="rgba(239,68,68,0.8)">Underexposed</text>
  <g>
    <line x1="335" y1="238" x2="565" y2="238" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <rect x="340" y="166" width="12" height="72" rx="1" fill="rgba(103,232,249,0.4)"/>
    <rect x="355" y="156" width="12" height="82" rx="1" fill="rgba(103,232,249,0.5)"/>
    <rect x="370" y="148" width="12" height="90" rx="1" fill="rgba(103,232,249,0.65)"/>
    <rect x="385" y="160" width="12" height="78" rx="1" fill="rgba(103,232,249,0.55)"/>
    <rect x="400" y="176" width="12" height="62" rx="1" fill="rgba(103,232,249,0.45)"/>
    <rect x="415" y="196" width="12" height="42" rx="1" fill="rgba(103,232,249,0.35)"/>
    <rect x="430" y="218" width="12" height="20" rx="1" fill="rgba(103,232,249,0.25)"/>
    <!-- no bars on right (bright) side -->
  </g>
  <text x="450" y="262" text-anchor="middle" font-size="8.5" fill="rgba(255,255,255,0.3)">Pile-up on left (dark)</text>
  <!-- Overexposed histogram -->
  <rect x="610" y="100" width="260" height="150" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(251,191,36,0.15)" stroke-width="1"/>
  <text x="740" y="118" text-anchor="middle" font-size="10" font-weight="700" fill="rgba(251,191,36,0.8)">Overexposed</text>
  <g>
    <line x1="625" y1="238" x2="855" y2="238" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <!-- no bars on left (dark) side -->
    <rect x="720" y="208" width="12" height="30" rx="1" fill="rgba(251,191,36,0.25)"/>
    <rect x="735" y="192" width="12" height="46" rx="1" fill="rgba(251,191,36,0.35)"/>
    <rect x="750" y="174" width="12" height="64" rx="1" fill="rgba(251,191,36,0.45)"/>
    <rect x="765" y="158" width="12" height="80" rx="1" fill="rgba(251,191,36,0.55)"/>
    <rect x="780" y="148" width="12" height="90" rx="1" fill="rgba(251,191,36,0.65)"/>
    <rect x="795" y="154" width="12" height="84" rx="1" fill="rgba(251,191,36,0.6)"/>
    <rect x="810" y="168" width="12" height="70" rx="1" fill="rgba(251,191,36,0.5)"/>
    <rect x="825" y="188" width="12" height="50" rx="1" fill="rgba(251,191,36,0.4)"/>
  </g>
  <text x="740" y="262" text-anchor="middle" font-size="8.5" fill="rgba(255,255,255,0.3)">Pile-up on right (bright)</text>
  <!-- Advice row -->
  <rect x="30" y="290" width="260" height="100" rx="8" fill="rgba(52,211,153,0.04)" stroke="rgba(52,211,153,0.12)" stroke-width="1"/>
  <text x="160" y="312" text-anchor="middle" font-size="9.5" fill="rgba(52,211,153,0.8)">Spread across range</text>
  <text x="160" y="332" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.5)">Shadows and highlights</text>
  <text x="160" y="350" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.5)">both have detail</text>
  <text x="160" y="376" text-anchor="middle" font-size="8.5" fill="rgba(52,211,153,0.6)">Exposure: correct</text>
  <rect x="320" y="290" width="260" height="100" rx="8" fill="rgba(239,68,68,0.04)" stroke="rgba(239,68,68,0.12)" stroke-width="1"/>
  <text x="450" y="312" text-anchor="middle" font-size="9.5" fill="rgba(239,68,68,0.8)">Clustered left</text>
  <text x="450" y="332" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.5)">Raise Brightness or</text>
  <text x="450" y="350" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.5)">lift Gamma (&lt;1) to fix</text>
  <text x="450" y="376" text-anchor="middle" font-size="8.5" fill="rgba(239,68,68,0.6)">Exposure: too dark</text>
  <rect x="610" y="290" width="260" height="100" rx="8" fill="rgba(251,191,36,0.04)" stroke="rgba(251,191,36,0.12)" stroke-width="1"/>
  <text x="740" y="312" text-anchor="middle" font-size="9.5" fill="rgba(251,191,36,0.8)">Clustered right</text>
  <text x="740" y="332" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.5)">Lower Brightness or</text>
  <text x="740" y="350" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.5)">darken Gamma (&gt;1) to fix</text>
  <text x="740" y="376" text-anchor="middle" font-size="8.5" fill="rgba(251,191,36,0.6)">Exposure: too bright</text>
  <text x="450" y="446" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.2)">toolnestai.net/image-tools/brightness-contrast</text>
</svg>
