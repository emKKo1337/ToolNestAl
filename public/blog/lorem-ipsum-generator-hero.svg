<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <radialGradient id="gL" cx="10%" cy="50%" r="60%"><stop offset="0%" stop-color="#5b21b6" stop-opacity="0.35"/><stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/></radialGradient>
    <radialGradient id="gR" cx="90%" cy="50%" r="60%"><stop offset="0%" stop-color="#0e7490" stop-opacity="0.2"/><stop offset="100%" stop-color="#0e7490" stop-opacity="0"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="bG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient>
    <linearGradient id="lapG" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1a1040"/><stop offset="100%" stop-color="#0d0824"/></linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#5b21b6" flood-opacity="0.45"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <ellipse cx="120" cy="337" rx="700" ry="550" fill="url(#gL)"/>
  <ellipse cx="1080" cy="337" rx="700" ry="550" fill="url(#gR)"/>

  <text x="600" y="42" text-anchor="middle" font-size="13" font-weight="700" fill="url(#aG)" filter="url(#glow)">ToolNest AI — Text Tools</text>
  <text x="600" y="68" text-anchor="middle" font-size="34" font-weight="900" fill="url(#aG)" filter="url(#glow)">Lorem Ipsum Generator</text>
  <text x="600" y="90" text-anchor="middle" font-size="13" fill="rgba(255,255,255,0.35)">Paragraphs, sentences, words &amp; lists — classic Latin placeholder text, free</text>

  <rect x="60" y="108" width="1080" height="542" rx="18" fill="url(#lapG)" stroke="rgba(124,58,237,0.35)" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="60" y="108" width="1080" height="38" rx="18" fill="rgba(255,255,255,0.05)"/>
  <rect x="60" y="128" width="1080" height="18" fill="rgba(255,255,255,0.02)"/>
  <circle cx="90" cy="127" r="7" fill="rgba(239,68,68,0.65)"/>
  <circle cx="114" cy="127" r="7" fill="rgba(251,191,36,0.65)"/>
  <circle cx="138" cy="127" r="7" fill="rgba(34,197,94,0.65)"/>
  <text x="600" y="132" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.2)">toolnestai.net/text-tools/lorem-ipsum-generator</text>

  <!-- Mode tabs -->
  <g font-size="11" text-anchor="middle">
    <rect x="80" y="158" width="130" height="28" rx="6" fill="url(#bG)"/>
    <text x="145" y="176" fill="#fff" font-weight="700">Paragraphs</text>
    <rect x="218" y="158" width="120" height="28" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="278" y="176" fill="rgba(255,255,255,0.4)">Sentences</text>
    <rect x="346" y="158" width="90" height="28" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="391" y="176" fill="rgba(255,255,255,0.4)">Words</text>
    <rect x="444" y="158" width="80" height="28" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="484" y="176" fill="rgba(255,255,255,0.4)">Lists</text>
  </g>

  <!-- Controls -->
  <text x="88" y="212" font-size="9" fill="rgba(255,255,255,0.4)">Number of paragraphs:</text>
  <rect x="240" y="198" width="60" height="24" rx="6" fill="rgba(0,0,0,0.4)" stroke="rgba(124,58,237,0.3)" stroke-width="1"/>
  <text x="270" y="215" text-anchor="middle" font-size="11" fill="rgba(167,139,250,0.85)">3</text>
  <rect x="316" y="198" width="220" height="24" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="426" y="215" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.4)">☑ Start with "Lorem ipsum dolor..."</text>

  <!-- Generated text panel -->
  <text x="88" y="248" font-size="9" font-weight="700" fill="rgba(255,255,255,0.28)">GENERATED TEXT</text>
  <rect x="80" y="254" width="680" height="300" rx="10" fill="rgba(0,0,0,0.4)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <g font-size="12" fill="rgba(255,255,255,0.65)">
    <text x="98" y="280">Lorem ipsum dolor sit amet, consectetur adipiscing elit.</text>
    <text x="98" y="300">Sed do eiusmod tempor incididunt ut labore et dolore</text>
    <text x="98" y="320">magna aliqua. Ut enim ad minim veniam, quis nostrud</text>
    <text x="98" y="340">exercitation ullamco laboris nisi ut aliquip ex ea</text>
    <text x="98" y="360">commodo consequat.</text>

    <text x="98" y="392">Duis aute irure dolor in reprehenderit in voluptate</text>
    <text x="98" y="412">velit esse cillum dolore eu fugiat nulla pariatur.</text>
    <text x="98" y="432">Excepteur sint occaecat cupidatat non proident, sunt</text>
    <text x="98" y="452">in culpa qui officia deserunt mollit anim id est laborum.</text>

    <text x="98" y="484">Sed ut perspiciatis unde omnis iste natus error sit</text>
    <text x="98" y="504">voluptatem accusantium doloremque laudantium, totam</text>
    <text x="98" y="524">rem aperiam, eaque ipsa quae ab illo inventore veritatis.</text>
  </g>

  <!-- Right panel: origin story -->
  <rect x="780" y="158" width="340" height="396" rx="12" fill="rgba(255,255,255,0.025)" stroke="rgba(124,58,237,0.18)" stroke-width="1"/>
  <text x="950" y="182" text-anchor="middle" font-size="11" font-weight="700" fill="rgba(255,255,255,0.5)">Where Does "Lorem Ipsum" Come From?</text>

  <text x="796" y="206" font-size="9.5" fill="rgba(255,255,255,0.55)">It's scrambled Latin from Cicero's</text>
  <text x="796" y="222" font-size="9.5" fill="rgba(255,255,255,0.55)">45 BC essay "De Finibus Bonorum</text>
  <text x="796" y="238" font-size="9.5" fill="rgba(255,255,255,0.55)">et Malorum" ("On the Ends of Good</text>
  <text x="796" y="254" font-size="9.5" fill="rgba(255,255,255,0.55)">and Evil"), rediscovered in a 1500s</text>
  <text x="796" y="270" font-size="9.5" fill="rgba(255,255,255,0.55)">typesetting sample.</text>

  <rect x="796" y="284" width="308" height="70" rx="7" fill="rgba(124,58,237,0.08)" stroke="rgba(124,58,237,0.18)" stroke-width="1"/>
  <text x="812" y="304" font-family="monospace" font-size="9" fill="rgba(167,139,250,0.8)">Original Latin: "...neque porro</text>
  <text x="812" y="320" font-family="monospace" font-size="9" fill="rgba(167,139,250,0.8)">quisquam est, qui dolorem ipsum</text>
  <text x="812" y="336" font-family="monospace" font-size="9" fill="rgba(167,139,250,0.8)">quia dolor sit amet..."</text>

  <text x="796" y="380" font-size="9.5" font-weight="700" fill="rgba(103,232,249,0.85)">Why designers still use it:</text>
  <text x="796" y="398" font-size="9" fill="rgba(255,255,255,0.5)">✓ Neutral — doesn't distract from</text>
  <text x="796" y="412" font-size="9" fill="rgba(255,255,255,0.5)">layout, unlike readable English</text>
  <text x="796" y="428" font-size="9" fill="rgba(255,255,255,0.5)">✓ Realistic word/letter length</text>
  <text x="796" y="444" font-size="9" fill="rgba(255,255,255,0.5)">distribution, unlike "aaa bbb ccc"</text>
  <text x="796" y="460" font-size="9" fill="rgba(255,255,255,0.5)">✓ Universally recognized as</text>
  <text x="796" y="476" font-size="9" fill="rgba(255,255,255,0.5)">placeholder — no client confusion</text>

  <rect x="796" y="490" width="308" height="52" rx="7" fill="rgba(251,191,36,0.06)" stroke="rgba(251,191,36,0.18)" stroke-width="1"/>
  <text x="812" y="510" font-size="9" font-weight="700" fill="rgba(251,191,36,0.85)">⚠ Always replace before shipping</text>
  <text x="812" y="526" font-size="8.5" fill="rgba(255,255,255,0.4)">Placeholder text left in production is</text>
  <text x="812" y="538" font-size="8.5" fill="rgba(255,255,255,0.4)">a common embarrassing launch mistake</text>

  <!-- Stats row -->
  <g text-anchor="middle" font-size="9.5">
    <rect x="80" y="570" width="162" height="54" rx="8" fill="rgba(124,58,237,0.1)" stroke="rgba(124,58,237,0.22)" stroke-width="1"/>
    <text x="161" y="594" font-size="18" font-weight="900" fill="#a78bfa">3</text>
    <text x="161" y="612" fill="rgba(255,255,255,0.38)">paragraphs</text>

    <rect x="254" y="570" width="162" height="54" rx="8" fill="rgba(14,116,144,0.08)" stroke="rgba(14,116,144,0.2)" stroke-width="1"/>
    <text x="335" y="594" font-size="18" font-weight="900" fill="#67e8f9">187</text>
    <text x="335" y="612" fill="rgba(255,255,255,0.38)">words generated</text>

    <rect x="428" y="570" width="162" height="54" rx="8" fill="rgba(16,185,129,0.07)" stroke="rgba(16,185,129,0.18)" stroke-width="1"/>
    <text x="509" y="594" font-size="16" font-weight="900" fill="#34d399">1,142</text>
    <text x="509" y="612" fill="rgba(255,255,255,0.38)">characters</text>

    <rect x="602" y="570" width="158" height="54" rx="8" fill="rgba(251,191,36,0.07)" stroke="rgba(251,191,36,0.18)" stroke-width="1"/>
    <text x="681" y="594" font-size="16" font-weight="900" fill="#fbbf24">HTML</text>
    <text x="681" y="612" fill="rgba(255,255,255,0.38)">export ready</text>
  </g>

  <rect x="48" y="650" width="1104" height="16" rx="5" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="460" y="664" width="280" height="10" rx="5" fill="rgba(255,255,255,0.025)"/>
</svg>
