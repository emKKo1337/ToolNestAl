<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="600" y="52" text-anchor="middle" font-size="24" font-weight="900" fill="url(#aG)">Sharpening Algorithms — How Each Works</text>
  <text x="600" y="74" text-anchor="middle" font-size="12" fill="rgba(255,255,255,0.38)">Unsharp mask, high-pass filter, Laplacian — the math behind edge enhancement</text>
  <!-- 3 columns -->
  <g text-anchor="middle">
    <!-- Unsharp mask -->
    <rect x="30" y="96" width="360" height="490" rx="12" fill="rgba(167,139,250,0.05)" stroke="rgba(167,139,250,0.2)" stroke-width="1"/>
    <text x="210" y="124" font-size="13" font-weight="700" fill="#a78bfa">Unsharp Mask (USM)</text>
    <text x="210" y="144" font-size="10" fill="rgba(167,139,250,0.7)">Most natural sharpening</text>
    <rect x="50" y="160" width="320" height="60" rx="6" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="210" y="180" font-size="9" fill="rgba(255,255,255,0.4)">formula</text>
    <text x="210" y="200" font-size="11" font-family="monospace" fill="rgba(167,139,250,0.8)">output = original + amount × (original − blurred)</text>
    <text x="210" y="254" font-size="9.5" fill="rgba(255,255,255,0.55)">1. Blur the image with Gaussian (radius r)</text>
    <text x="210" y="274" font-size="9.5" fill="rgba(255,255,255,0.55)">2. Subtract blurred from original</text>
    <text x="210" y="294" font-size="9.5" fill="rgba(255,255,255,0.55)">   → edge/detail layer (high-frequency)</text>
    <text x="210" y="314" font-size="9.5" fill="rgba(255,255,255,0.55)">3. Add that layer back × amount</text>
    <text x="210" y="354" font-size="9.5" fill="rgba(167,139,250,0.7)" font-weight="700">Parameters:</text>
    <text x="210" y="372" font-size="9.5" fill="rgba(255,255,255,0.5)">Amount: 50–200% strength</text>
    <text x="210" y="390" font-size="9.5" fill="rgba(255,255,255,0.5)">Radius: 0.5–3px Gaussian</text>
    <text x="210" y="408" font-size="9.5" fill="rgba(255,255,255,0.5)">Threshold: ignore subtle edges</text>
    <text x="210" y="540" font-size="10" font-weight="700" fill="rgba(167,139,250,0.8)">Best all-purpose sharpen</text>
    <!-- Laplacian -->
    <rect x="420" y="96" width="360" height="490" rx="12" fill="rgba(52,211,153,0.05)" stroke="rgba(52,211,153,0.2)" stroke-width="1"/>
    <text x="600" y="124" font-size="13" font-weight="700" fill="#6ee7b7">Laplacian Sharpening</text>
    <text x="600" y="144" font-size="10" fill="rgba(52,211,153,0.7)">Second-derivative edge boost</text>
    <rect x="440" y="160" width="320" height="80" rx="6" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="600" y="180" font-size="9" fill="rgba(255,255,255,0.4)">Laplacian 3×3 kernel</text>
    <text x="600" y="200" font-size="9.5" font-family="monospace" fill="rgba(52,211,153,0.75)"> 0  -1   0</text>
    <text x="600" y="216" font-size="9.5" font-family="monospace" fill="rgba(52,211,153,0.9)">-1   5  -1</text>
    <text x="600" y="232" font-size="9.5" font-family="monospace" fill="rgba(52,211,153,0.75)"> 0  -1   0</text>
    <text x="600" y="268" font-size="9.5" fill="rgba(255,255,255,0.55)">The center is +5 (amplified),</text>
    <text x="600" y="286" font-size="9.5" fill="rgba(255,255,255,0.55)">4 neighbors are -1 each.</text>
    <text x="600" y="304" font-size="9.5" fill="rgba(255,255,255,0.55)">Sum = 1, so flat areas unchanged.</text>
    <text x="600" y="322" font-size="9.5" fill="rgba(255,255,255,0.55)">Edges get boosted strongly.</text>
    <text x="600" y="362" font-size="9.5" fill="rgba(52,211,153,0.7)" font-weight="700">Characteristics:</text>
    <text x="600" y="380" font-size="9.5" fill="rgba(255,255,255,0.5)">Very sharp but aggressive</text>
    <text x="600" y="398" font-size="9.5" fill="rgba(255,255,255,0.5)">Can amplify noise strongly</text>
    <text x="600" y="540" font-size="10" font-weight="700" fill="rgba(52,211,153,0.8)">Crispest, most dramatic</text>
    <!-- High Pass -->
    <rect x="810" y="96" width="360" height="490" rx="12" fill="rgba(103,232,249,0.05)" stroke="rgba(103,232,249,0.2)" stroke-width="1"/>
    <text x="990" y="124" font-size="13" font-weight="700" fill="#67e8f9">High-Pass Filter</text>
    <text x="990" y="144" font-size="10" fill="rgba(103,232,249,0.7)">Subtract blur, boost remainder</text>
    <rect x="830" y="160" width="320" height="60" rx="6" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="990" y="180" font-size="9" fill="rgba(255,255,255,0.4)">formula</text>
    <text x="990" y="200" font-size="10" font-family="monospace" fill="rgba(103,232,249,0.75)">high_pass = original − blur(original)</text>
    <text x="990" y="254" font-size="9.5" fill="rgba(255,255,255,0.55)">1. Low-pass (blur) extracts</text>
    <text x="990" y="274" font-size="9.5" fill="rgba(255,255,255,0.55)">   coarse structure</text>
    <text x="990" y="294" font-size="9.5" fill="rgba(255,255,255,0.55)">2. Subtracting from original</text>
    <text x="990" y="314" font-size="9.5" fill="rgba(255,255,255,0.55)">   leaves only fine detail</text>
    <text x="990" y="334" font-size="9.5" fill="rgba(255,255,255,0.55)">3. Add scaled detail back</text>
    <text x="990" y="374" font-size="9.5" fill="rgba(103,232,249,0.7)" font-weight="700">Use case:</text>
    <text x="990" y="392" font-size="9.5" fill="rgba(255,255,255,0.5)">Photoshop layer technique</text>
    <text x="990" y="410" font-size="9.5" fill="rgba(255,255,255,0.5)">Control sharpening per channel</text>
    <text x="990" y="540" font-size="10" font-weight="700" fill="rgba(103,232,249,0.8)">Most controllable</text>
  </g>
  <text x="600" y="635" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.22)">toolnestai.net/image-tools/image-sharpen</text>
</svg>
