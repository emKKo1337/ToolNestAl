  <text x="458" y="302" font-family="sans-serif" font-size="7.5" fill="#7a6d84">Keywords</text>
  <rect x="458" y="307" width="286" height="20" rx="4" fill="#1a1040" stroke="#7c3aed" stroke-width="1"/>
  <text x="466" y="321" font-family="monospace" font-size="7" fill="#ddb7ff">annual report, finance, 2024</text>
  <text x="458" y="342" font-family="sans-serif" font-size="7.5" fill="#7a6d84">Creator</text>
  <rect x="458" y="347" width="286" height="20" rx="4" fill="#1a1040"/>
  <text x="466" y="361" font-family="monospace" font-size="7" fill="#9b8da8">Microsoft Word</text>
