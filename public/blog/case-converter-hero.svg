<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <radialGradient id="gL" cx="10%" cy="50%" r="60%"><stop offset="0%" stop-color="#5b21b6" stop-opacity="0.35"/><stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/></radialGradient>
    <radialGradient id="gR" cx="90%" cy="50%" r="60%"><stop offset="0%" stop-color="#0e7490" stop-opacity="0.2"/><stop offset="100%" stop-color="#0e7490" stop-opacity="0"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="bG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient>
    <linearGradient id="lapG" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1a1040"/><stop offset="100%" stop-color="#0d0824"/></linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#5b21b6" flood-opacity="0.45"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <ellipse cx="120" cy="337" rx="700" ry="550" fill="url(#gL)"/>
  <ellipse cx="1080" cy="337" rx="700" ry="550" fill="url(#gR)"/>

  <text x="600" y="42" text-anchor="middle" font-size="13" font-weight="700" fill="url(#aG)" filter="url(#glow)">ToolNest AI — Text Tools</text>
  <text x="600" y="68" text-anchor="middle" font-size="34" font-weight="900" fill="url(#aG)" filter="url(#glow)">Case Converter</text>
  <text x="600" y="90" text-anchor="middle" font-size="13" fill="rgba(255,255,255,0.35)">10+ text case formats, instantly — for writing, code, and data cleanup</text>

  <rect x="60" y="108" width="1080" height="542" rx="18" fill="url(#lapG)" stroke="rgba(124,58,237,0.35)" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="60" y="108" width="1080" height="38" rx="18" fill="rgba(255,255,255,0.05)"/>
  <rect x="60" y="128" width="1080" height="18" fill="rgba(255,255,255,0.02)"/>
  <circle cx="90" cy="127" r="7" fill="rgba(239,68,68,0.65)"/>
  <circle cx="114" cy="127" r="7" fill="rgba(251,191,36,0.65)"/>
  <circle cx="138" cy="127" r="7" fill="rgba(34,197,94,0.65)"/>
  <text x="600" y="132" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.2)">toolnestai.net/text-tools/case-converter</text>

  <!-- Input -->
  <text x="88" y="176" font-size="9" font-weight="700" fill="rgba(255,255,255,0.28)">INPUT TEXT</text>
  <rect x="80" y="182" width="1040" height="46" rx="10" fill="rgba(0,0,0,0.55)" stroke="rgba(124,58,237,0.45)" stroke-width="1.5"/>
  <text x="98" y="210" font-family="monospace" font-size="16" fill="rgba(255,255,255,0.85)">the Quick Brown Fox jumps over the Lazy Dog</text>

  <!-- Case grid: 4 columns x 3 rows -->
  <g font-family="monospace" font-size="11">
    <rect x="80" y="244" width="252" height="52" rx="7" fill="rgba(167,139,250,0.08)" stroke="rgba(167,139,250,0.22)" stroke-width="1"/>
    <text x="94" y="262" font-family="'Segoe UI'" font-size="8" font-weight="700" fill="rgba(255,255,255,0.4)">UPPERCASE</text>
    <text x="94" y="282" fill="rgba(167,139,250,0.9)">THE QUICK BROWN FOX</text>

    <rect x="342" y="244" width="252" height="52" rx="7" fill="rgba(103,232,249,0.08)" stroke="rgba(103,232,249,0.22)" stroke-width="1"/>
    <text x="356" y="262" font-family="'Segoe UI'" font-size="8" font-weight="700" fill="rgba(255,255,255,0.4)">lowercase</text>
    <text x="356" y="282" fill="rgba(103,232,249,0.9)">the quick brown fox</text>

    <rect x="604" y="244" width="252" height="52" rx="7" fill="rgba(52,211,153,0.08)" stroke="rgba(52,211,153,0.22)" stroke-width="1"/>
    <text x="618" y="262" font-family="'Segoe UI'" font-size="8" font-weight="700" fill="rgba(255,255,255,0.4)">Title Case</text>
    <text x="618" y="282" fill="rgba(52,211,153,0.9)">The Quick Brown Fox</text>

    <rect x="866" y="244" width="254" height="52" rx="7" fill="rgba(251,191,36,0.08)" stroke="rgba(251,191,36,0.22)" stroke-width="1"/>
    <text x="880" y="262" font-family="'Segoe UI'" font-size="8" font-weight="700" fill="rgba(255,255,255,0.4)">Sentence case</text>
    <text x="880" y="282" fill="rgba(251,191,36,0.9)">The quick brown fox</text>

    <rect x="80" y="304" width="252" height="52" rx="7" fill="rgba(244,114,182,0.08)" stroke="rgba(244,114,182,0.22)" stroke-width="1"/>
    <text x="94" y="322" font-family="'Segoe UI'" font-size="8" font-weight="700" fill="rgba(255,255,255,0.4)">camelCase</text>
    <text x="94" y="342" fill="rgba(244,114,182,0.9)">theQuickBrownFox</text>

    <rect x="342" y="304" width="252" height="52" rx="7" fill="rgba(52,211,153,0.06)" stroke="rgba(52,211,153,0.18)" stroke-width="1"/>
    <text x="356" y="322" font-family="'Segoe UI'" font-size="8" font-weight="700" fill="rgba(255,255,255,0.4)">PascalCase</text>
    <text x="356" y="342" fill="rgba(52,211,153,0.85)">TheQuickBrownFox</text>

    <rect x="604" y="304" width="252" height="52" rx="7" fill="rgba(129,140,248,0.08)" stroke="rgba(129,140,248,0.22)" stroke-width="1"/>
    <text x="618" y="322" font-family="'Segoe UI'" font-size="8" font-weight="700" fill="rgba(255,255,255,0.4)">snake_case</text>
    <text x="618" y="342" fill="rgba(129,140,248,0.9)">the_quick_brown_fox</text>

    <rect x="866" y="304" width="254" height="52" rx="7" fill="rgba(251,191,36,0.06)" stroke="rgba(251,191,36,0.18)" stroke-width="1"/>
    <text x="880" y="322" font-family="'Segoe UI'" font-size="8" font-weight="700" fill="rgba(255,255,255,0.4)">kebab-case</text>
    <text x="880" y="342" fill="rgba(251,191,36,0.85)">the-quick-brown-fox</text>

    <rect x="80" y="364" width="252" height="52" rx="7" fill="rgba(103,232,249,0.06)" stroke="rgba(103,232,249,0.18)" stroke-width="1"/>
    <text x="94" y="382" font-family="'Segoe UI'" font-size="8" font-weight="700" fill="rgba(255,255,255,0.4)">CONSTANT_CASE</text>
    <text x="94" y="402" fill="rgba(103,232,249,0.85)">THE_QUICK_BROWN_FOX</text>

    <rect x="342" y="364" width="252" height="52" rx="7" fill="rgba(167,139,250,0.06)" stroke="rgba(167,139,250,0.18)" stroke-width="1"/>
    <text x="356" y="382" font-family="'Segoe UI'" font-size="8" font-weight="700" fill="rgba(255,255,255,0.4)">aLtErNaTiNg cAsE</text>
    <text x="356" y="402" fill="rgba(167,139,250,0.8)">tHe qUiCk BrOwN foX</text>

    <rect x="604" y="364" width="516" height="52" rx="7" fill="rgba(244,114,182,0.06)" stroke="rgba(244,114,182,0.18)" stroke-width="1"/>
    <text x="618" y="382" font-family="'Segoe UI'" font-size="8" font-weight="700" fill="rgba(255,255,255,0.4)">InVeRsE cAsE (swap each letter's case)</text>
    <text x="618" y="402" fill="rgba(244,114,182,0.8)">THE qUICK bROWN fOX JUMPS OVER THE lAZY dOG</text>
  </g>

  <!-- Use case panel -->
  <text x="88" y="440" font-size="9" font-weight="700" fill="rgba(255,255,255,0.28)">WHEN TO USE EACH FORMAT</text>
  <g font-size="10.5">
    <rect x="80" y="446" width="510" height="160" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="96" y="470" fill="#f472b6" font-weight="700">camelCase</text><text x="200" y="470" fill="rgba(255,255,255,0.5)"> — JavaScript/Java variable &amp; function names</text>
    <text x="96" y="496" fill="#6ee7b7" font-weight="700">PascalCase</text><text x="204" y="496" fill="rgba(255,255,255,0.5)"> — class names, React components</text>
    <text x="96" y="522" fill="#818cf8" font-weight="700">snake_case</text><text x="204" y="522" fill="rgba(255,255,255,0.5)"> — Python variables, database columns</text>
    <text x="96" y="548" fill="#fbbf24" font-weight="700">kebab-case</text><text x="200" y="548" fill="rgba(255,255,255,0.5)"> — URL slugs, CSS classes, HTML attributes</text>
    <text x="96" y="574" fill="#67e8f9" font-weight="700">CONSTANT_CASE</text><text x="238" y="574" fill="rgba(255,255,255,0.5)"> — environment variables, constants</text>
    <text x="96" y="600" fill="rgba(255,255,255,0.55)" font-weight="700">Title Case</text><text x="196" y="600" fill="rgba(255,255,255,0.5)"> — headlines, book &amp; article titles</text>

    <rect x="608" y="446" width="512" height="160" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="864" y="470" text-anchor="middle" font-size="10" font-weight="700" fill="rgba(255,255,255,0.4)">TITLE CASE HAS RULES, NOT JUST CAPITALIZATION</text>
    <text x="624" y="496" font-size="9.5" fill="rgba(255,255,255,0.55)">Style guides (AP, Chicago) lowercase short</text>
    <text x="624" y="512" font-size="9.5" fill="rgba(255,255,255,0.55)">"minor words" — a, an, the, and, but, or, of, in —</text>
    <text x="624" y="528" font-size="9.5" fill="rgba(255,255,255,0.55)">unless they start or end the title.</text>
    <text x="624" y="552" font-family="monospace" font-size="9" fill="rgba(52,211,153,0.8)">"The Lord of the Rings" ✓</text>
    <text x="624" y="568" font-family="monospace" font-size="9" fill="rgba(239,68,68,0.75)">"The Lord Of The Rings" ✗ (naive cap-every-word)</text>
    <text x="624" y="592" font-size="8.5" fill="rgba(255,255,255,0.3)">A naive "capitalize every word" is NOT true Title Case</text>
  </g>

  <rect x="48" y="650" width="1104" height="16" rx="5" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="460" y="664" width="280" height="10" rx="5" fill="rgba(255,255,255,0.025)"/>
</svg>
