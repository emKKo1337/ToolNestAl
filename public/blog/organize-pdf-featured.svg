<svg viewBox="0 0 900 540" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%"><stop offset="0%" stop-color="#0f0825"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <linearGradient id="lapG" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#1a1040"/><stop offset="100%" stop-color="#0d0824"/></linearGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="900" height="540" fill="url(#bg)"/>
  <ellipse cx="450" cy="270" rx="260" ry="140" fill="#0e7490" opacity="0.06" filter="url(#glow)"/>
  <rect x="120" y="48" width="660" height="410" rx="14" fill="url(#lapG)" stroke="#2a1f4a" stroke-width="1.5"/>
  <rect x="120" y="48" width="660" height="38" rx="14" fill="#1a1040"/>
  <rect x="120" y="72" width="660" height="14" fill="#1a1040"/>
  <circle cx="655" cy="67" r="7" fill="#ff5f57"/><circle cx="675" cy="67" r="7" fill="#febc2e"/><circle cx="695" cy="67" r="7" fill="#28c840"/>
  <rect x="200" y="56" width="440" height="20" rx="10" fill="#110c2a"/>
  <text x="420" y="70" font-family="monospace" font-size="9" fill="#4d4354" text-anchor="middle">toolnestai.net/pdf-tools/organize-pdf</text>
  <rect x="136" y="94" width="628" height="352" rx="6" fill="#0c0920"/>
  <text x="450" y="118" font-family="sans-serif" font-size="13" font-weight="700" fill="#e2e2e2" text-anchor="middle">Organize PDF Pages</text>
  <text x="450" y="134" font-family="sans-serif" font-size="8" fill="#7a6d84" text-anchor="middle">Drag pages to reorder, rotate, duplicate, or delete individual pages</text>
  <!-- Toolbar -->
  <rect x="148" y="148" width="628" height="36" rx="6" fill="#110c2a"/>
  <rect x="156" y="156" width="80" height="20" rx="5" fill="#7c3aed"/>
  <text x="196" y="170" font-family="sans-serif" font-size="8" font-weight="700" fill="#fff" text-anchor="middle">Select All</text>
  <rect x="244" y="156" width="80" height="20" rx="5" fill="#1a1040" stroke="#2a1f4a" stroke-width="1"/>
  <text x="284" y="170" font-family="sans-serif" font-size="8" fill="#7a6d84" text-anchor="middle">↺ Rotate</text>
  <rect x="332" y="156" width="80" height="20" rx="5" fill="#1a1040" stroke="#2a1f4a" stroke-width="1"/>
  <text x="372" y="170" font-family="sans-serif" font-size="8" fill="#7a6d84" text-anchor="middle">⧉ Duplicate</text>
  <rect x="420" y="156" width="80" height="20" rx="5" fill="#1a1040" stroke="#2a1f4a" stroke-width="1"/>
  <text x="460" y="170" font-family="sans-serif" font-size="8" fill="#7a6d84" text-anchor="middle">✕ Delete</text>
  <!-- Page grid -->
  <!-- Row 1: pages 1-5 -->
  <rect x="148" y="194" width="110" height="80" rx="6" fill="#1a1040" stroke="#7c3aed" stroke-width="1.5"/>
  <rect x="158" y="202" width="90" height="64" rx="3" fill="#110c2a"/>
  <rect x="163" y="208" width="80" height="6" rx="2" fill="#2a1f4a"/>
  <rect x="163" y="218" width="60" height="4" rx="1" fill="#2a1f4a"/>
  <text x="203" y="285" font-family="sans-serif" font-size="7.5" fill="#a78bfa" text-anchor="middle">1</text>
  <rect x="270" y="194" width="110" height="80" rx="6" fill="#1a1040" stroke="#2a1f4a" stroke-width="1"/>
  <text x="325" y="285" font-family="sans-serif" font-size="7.5" fill="#4d4354" text-anchor="middle">2</text>
  <rect x="392" y="194" width="110" height="80" rx="6" fill="#7c3aed" opacity="0.2" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="447" y="285" font-family="sans-serif" font-size="7.5" fill="#a78bfa" text-anchor="middle">3 ✓</text>
  <rect x="514" y="194" width="110" height="80" rx="6" fill="#1a1040" stroke="#2a1f4a" stroke-width="1"/>
  <text x="569" y="285" font-family="sans-serif" font-size="7.5" fill="#4d4354" text-anchor="middle">4</text>
  <rect x="636" y="194" width="110" height="80" rx="6" fill="#1a1040" stroke="#2a1f4a" stroke-width="1"/>
  <text x="691" y="285" font-family="sans-serif" font-size="7.5" fill="#4d4354" text-anchor="middle">5</text>
  <!-- Row 2: pages 6-8 -->
  <rect x="148" y="300" width="110" height="80" rx="6" fill="#1a1040" stroke="#2a1f4a" stroke-width="1"/>
  <text x="203" y="391" font-family="sans-serif" font-size="7.5" fill="#4d4354" text-anchor="middle">6</text>
  <rect x="270" y="300" width="110" height="80" rx="6" fill="#1a1040" stroke="#2a1f4a" stroke-width="1"/>
  <text x="325" y="391" font-family="sans-serif" font-size="7.5" fill="#4d4354" text-anchor="middle">7</text>
  <!-- Drag indicator between 7 and 8 -->
  <line x1="391" y1="300" x2="391" y2="380" stroke="#7c3aed" stroke-width="2.5"/>
  <rect x="392" y="300" width="110" height="80" rx="6" fill="#1a1040" stroke="#2a1f4a" stroke-width="1" opacity="0.5"/>
  <text x="447" y="391" font-family="sans-serif" font-size="7.5" fill="#4d4354" text-anchor="middle">8</text>
  <!-- Save button -->
  <rect x="540" y="400" width="236" height="40" rx="10" fill="url(#aG)"/>
  <text x="658" y="424" font-family="sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">Save Organized PDF</text>
  <rect x="340" y="458" width="220" height="10" rx="5" fill="#1a1040"/>
  <rect x="280" y="466" width="340" height="8" rx="4" fill="#140e34"/>
</svg>
