<svg viewBox="0 0 900 1200" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <radialGradient id="gT" cx="50%" cy="10%" r="50%"><stop offset="0%" stop-color="#5b21b6" stop-opacity="0.3"/><stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/></radialGradient>
    <radialGradient id="gB" cx="50%" cy="90%" r="50%"><stop offset="0%" stop-color="#0f766e" stop-opacity="0.2"/><stop offset="100%" stop-color="#0f766e" stop-opacity="0"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="bG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#5b21b6" flood-opacity="0.35"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="900" height="1200" fill="url(#bg)"/>
  <ellipse cx="450" cy="150" rx="500" ry="300" fill="url(#gT)"/>
  <ellipse cx="450" cy="1050" rx="500" ry="300" fill="url(#gB)"/>

  <text x="450" y="52" text-anchor="middle" font-size="26" font-weight="900" fill="url(#aG)" filter="url(#glow)">Password Generator</text>
  <text x="450" y="80" text-anchor="middle" font-size="13" fill="rgba(255,255,255,0.45)">The complete guide to strong passwords — entropy, character sets, rules &amp; best practices</text>

  <!-- Section 1: Why strong passwords -->
  <rect x="28" y="100" width="844" height="190" rx="12" fill="rgba(255,255,255,0.025)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="48" y="124" font-size="12" font-weight="800" fill="url(#aG)">01 — Why Password Strength Matters</text>
  <g font-size="10" fill="rgba(255,255,255,0.65)">
    <circle cx="56" cy="148" r="4" fill="#a78bfa"/>
    <text x="70" y="152">Over 80% of hacking-related breaches involve weak or stolen passwords (Verizon DBIR)</text>
    <circle cx="56" cy="172" r="4" fill="#a78bfa"/>
    <text x="70" y="176">A GPU cluster can test billions of password combinations per second using brute force</text>
    <circle cx="56" cy="196" r="4" fill="#a78bfa"/>
    <text x="70" y="200">A 6-character lowercase password has only 308 million combinations — cracked in under 1 second</text>
    <circle cx="56" cy="220" r="4" fill="#a78bfa"/>
    <text x="70" y="224">A 16-character random password with all 4 character types has 95¹⁶ ≈ 4.4×10³¹ combinations</text>
    <circle cx="56" cy="244" r="4" fill="#a78bfa"/>
    <text x="70" y="248">Credential stuffing — using leaked passwords on other sites — compromises millions of accounts yearly</text>
    <circle cx="56" cy="268" r="4" fill="#a78bfa"/>
    <text x="70" y="272">True randomness from a generator is far stronger than any human-invented pattern</text>
  </g>

  <!-- Section 2: Key stats -->
  <rect x="28" y="308" width="844" height="130" rx="12" fill="rgba(124,58,237,0.08)" stroke="rgba(124,58,237,0.2)" stroke-width="1"/>
  <text x="48" y="332" font-size="12" font-weight="800" fill="url(#aG)">02 — Key Numbers</text>
  <g text-anchor="middle">
    <rect x="44" y="346" width="175" height="70" rx="8" fill="rgba(124,58,237,0.15)" stroke="rgba(124,58,237,0.3)" stroke-width="1"/>
    <text x="132" y="375" font-size="22" font-weight="900" fill="#a78bfa">16+</text>
    <text x="132" y="394" font-size="9" fill="rgba(255,255,255,0.55)">chars minimum for</text>
    <text x="132" y="406" font-size="9" fill="rgba(255,255,255,0.55)">a strong password</text>

    <rect x="233" y="346" width="175" height="70" rx="8" fill="rgba(15,118,110,0.12)" stroke="rgba(15,118,110,0.25)" stroke-width="1"/>
    <text x="321" y="375" font-size="22" font-weight="900" fill="#5eead4">95</text>
    <text x="321" y="394" font-size="9" fill="rgba(255,255,255,0.55)">printable ASCII</text>
    <text x="321" y="406" font-size="9" fill="rgba(255,255,255,0.55)">chars in the pool</text>

    <rect x="422" y="346" width="175" height="70" rx="8" fill="rgba(16,185,129,0.1)" stroke="rgba(16,185,129,0.25)" stroke-width="1"/>
    <text x="510" y="375" font-size="22" font-weight="900" fill="#34d399">128</text>
    <text x="510" y="394" font-size="9" fill="rgba(255,255,255,0.55)">bits entropy =</text>
    <text x="510" y="406" font-size="9" fill="rgba(255,255,255,0.55)">uncrackable in practice</text>

    <rect x="611" y="346" width="175" height="70" rx="8" fill="rgba(251,191,36,0.1)" stroke="rgba(251,191,36,0.25)" stroke-width="1"/>
    <text x="699" y="375" font-size="22" font-weight="900" fill="#fbbf24">1</text>
    <text x="699" y="394" font-size="9" fill="rgba(255,255,255,0.55)">unique password</text>
    <text x="699" y="406" font-size="9" fill="rgba(255,255,255,0.55)">per account — always</text>
  </g>

  <!-- Section 3: Character sets -->
  <rect x="28" y="456" width="844" height="260" rx="12" fill="rgba(255,255,255,0.025)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="48" y="480" font-size="12" font-weight="800" fill="url(#aG)">03 — Character Sets &amp; What They Add</text>

  <rect x="44" y="490" width="810" height="44" rx="6" fill="rgba(124,58,237,0.09)" stroke="rgba(124,58,237,0.2)" stroke-width="1"/>
  <rect x="44" y="490" width="4" height="44" rx="2" fill="#a78bfa"/>
  <text x="58" y="508" font-size="9" font-weight="700" fill="rgba(167,139,250,0.85)">Uppercase Letters (A–Z) — 26 characters</text>
  <text x="58" y="524" font-size="8.5" fill="rgba(255,255,255,0.45)">Adds 26 symbols to the character pool · essential for meeting most site requirements</text>
  <text x="800" y="508" text-anchor="end" font-size="8" fill="rgba(167,139,250,0.5)">+26 pool</text>

  <rect x="44" y="540" width="810" height="44" rx="6" fill="rgba(96,165,250,0.07)" stroke="rgba(96,165,250,0.18)" stroke-width="1"/>
  <rect x="44" y="540" width="4" height="44" rx="2" fill="#60a5fa"/>
  <text x="58" y="558" font-size="9" font-weight="700" fill="rgba(147,197,253,0.85)">Lowercase Letters (a–z) — 26 characters</text>
  <text x="58" y="574" font-size="8.5" fill="rgba(255,255,255,0.45)">The base character set · always include · most readable in passwords</text>
  <text x="800" y="558" text-anchor="end" font-size="8" fill="rgba(147,197,253,0.5)">+26 pool</text>

  <rect x="44" y="590" width="810" height="44" rx="6" fill="rgba(251,191,36,0.07)" stroke="rgba(251,191,36,0.18)" stroke-width="1"/>
  <rect x="44" y="590" width="4" height="44" rx="2" fill="#fbbf24"/>
  <text x="58" y="608" font-size="9" font-weight="700" fill="rgba(251,191,36,0.85)">Numbers (0–9) — 10 characters</text>
  <text x="58" y="624" font-size="8.5" fill="rgba(255,255,255,0.45)">Adds 10 numerals · required by most sites · especially strong when randomly placed</text>
  <text x="800" y="608" text-anchor="end" font-size="8" fill="rgba(251,191,36,0.5)">+10 pool</text>

  <rect x="44" y="640" width="810" height="44" rx="6" fill="rgba(52,211,153,0.07)" stroke="rgba(52,211,153,0.18)" stroke-width="1"/>
  <rect x="44" y="640" width="4" height="44" rx="2" fill="#34d399"/>
  <text x="58" y="658" font-size="9" font-weight="700" fill="rgba(52,211,153,0.85)">Symbols (!@#$%^&amp;*()-_=+[]{}|;':&quot;,.&lt;&gt;?/`~) — 33 characters</text>
  <text x="58" y="674" font-size="8.5" fill="rgba(255,255,255,0.45)">Biggest boost to entropy per character · some sites restrict which symbols are allowed</text>
  <text x="800" y="674" text-anchor="end" font-size="8" fill="rgba(52,211,153,0.5)">+33 pool</text>

  <rect x="44" y="690" width="810" height="18" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="450" y="703" text-anchor="middle" font-size="8.5" fill="rgba(255,255,255,0.5)">All 4 types combined = 95 character pool · 16 chars = 95¹⁶ ≈ 4.4×10³¹ combinations · uncrackable in practice</text>

  <!-- Section 4: Steps -->
  <rect x="28" y="734" width="844" height="260" rx="12" fill="rgba(255,255,255,0.025)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="48" y="758" font-size="12" font-weight="800" fill="url(#aG)">04 — How to Generate &amp; Use a Strong Password</text>

  <g>
    <circle cx="72" cy="792" r="18" fill="url(#bG)" filter="url(#sh)"/>
    <text x="72" y="797" text-anchor="middle" font-size="12" font-weight="900" fill="#fff">1</text>
    <text x="100" y="788" font-size="11" font-weight="700" fill="rgba(255,255,255,0.85)">Set length to 16 or more characters</text>
    <text x="100" y="803" font-size="9" fill="rgba(255,255,255,0.45)">Length is the single biggest factor — each extra character multiplies the search space</text>

    <circle cx="72" cy="838" r="18" fill="url(#bG)" filter="url(#sh)"/>
    <text x="72" y="843" text-anchor="middle" font-size="12" font-weight="900" fill="#fff">2</text>
    <text x="100" y="834" font-size="11" font-weight="700" fill="rgba(255,255,255,0.85)">Enable all 4 character types</text>
    <text x="100" y="849" font-size="9" fill="rgba(255,255,255,0.45)">Uppercase + lowercase + numbers + symbols = maximum entropy from the same length</text>

    <circle cx="72" cy="884" r="18" fill="url(#bG)" filter="url(#sh)"/>
    <text x="72" y="889" text-anchor="middle" font-size="12" font-weight="900" fill="#fff">3</text>
    <text x="100" y="880" font-size="11" font-weight="700" fill="rgba(255,255,255,0.85)">Generate — don't invent</text>
    <text x="100" y="895" font-size="9" fill="rgba(255,255,255,0.45)">Human-chosen passwords follow predictable patterns · use a generator for true randomness</text>

    <circle cx="72" cy="930" r="18" fill="url(#bG)" filter="url(#sh)"/>
    <text x="72" y="935" text-anchor="middle" font-size="12" font-weight="900" fill="#fff">4</text>
    <text x="100" y="926" font-size="11" font-weight="700" fill="rgba(255,255,255,0.85)">Store in a password manager</text>
    <text x="100" y="941" font-size="9" fill="rgba(255,255,255,0.45)">Bitwarden, 1Password, or your browser vault — never reuse or write passwords down</text>

    <circle cx="72" cy="976" r="18" fill="url(#bG)" filter="url(#sh)"/>
    <text x="72" y="981" text-anchor="middle" font-size="12" font-weight="900" fill="#fff">5</text>
    <text x="100" y="972" font-size="11" font-weight="700" fill="rgba(255,255,255,0.85)">Enable 2FA on every account</text>
    <text x="100" y="987" font-size="9" fill="rgba(255,255,255,0.45)">Strong password + authenticator app = the highest practical security level available</text>
  </g>

  <!-- CTA -->
  <rect x="28" y="1110" width="844" height="66" rx="12" fill="url(#bG)" filter="url(#sh)"/>
  <text x="450" y="1142" text-anchor="middle" font-size="18" font-weight="900" fill="#fff">Generate a Strong Password Free</text>
  <text x="450" y="1162" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.75)">Custom length · all character types · strength meter · bulk generate · no sign-up</text>
  <text x="450" y="1170" text-anchor="middle" font-size="10" font-weight="700" fill="rgba(255,255,255,0.4)">toolnestai.net/security-tools/password-generator</text>
</svg>
