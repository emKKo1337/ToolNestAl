<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="600" y="52" text-anchor="middle" font-size="24" font-weight="900" fill="url(#aG)">Grayscale Methods — Why Weights Matter</text>
  <text x="600" y="74" text-anchor="middle" font-size="12" fill="rgba(255,255,255,0.38)">Average, luminance, BT.601, BT.709 — each produces a different grayscale from the same color image</text>
  <g text-anchor="middle">
    <!-- Average -->
    <rect x="30" y="96" width="270" height="490" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="165" y="124" font-size="13" font-weight="700" fill="rgba(255,255,255,0.85)">Average</text>
    <text x="165" y="144" font-size="10" fill="rgba(255,255,255,0.45)">Simple R+G+B÷3</text>
    <rect x="50" y="160" width="230" height="50" rx="6" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    <text x="165" y="185" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.7)">(R + G + B) / 3</text>
    <text x="165" y="252" font-size="9.5" fill="rgba(255,255,255,0.5)">Treats red, green, and blue as</text>
    <text x="165" y="270" font-size="9.5" fill="rgba(255,255,255,0.5)">equally important. Simple to</text>
    <text x="165" y="288" font-size="9.5" fill="rgba(255,255,255,0.5)">compute but perceptually wrong.</text>
    <text x="165" y="316" font-size="9.5" fill="rgba(255,255,255,0.35)">Pure red (255,0,0): 85</text>
    <text x="165" y="334" font-size="9.5" fill="rgba(255,255,255,0.35)">Pure green (0,255,0): 85</text>
    <text x="165" y="352" font-size="9.5" fill="rgba(255,255,255,0.35)">Pure blue (0,0,255): 85</text>
    <text x="165" y="380" font-size="9.5" fill="rgba(255,255,255,0.55)">Problem: green appears much</text>
    <text x="165" y="398" font-size="9.5" fill="rgba(255,255,255,0.55)">brighter than blue to humans,</text>
    <text x="165" y="416" font-size="9.5" fill="rgba(255,255,255,0.55)">but both get the same gray value.</text>
    <text x="165" y="540" font-size="10" font-weight="700" fill="rgba(255,255,255,0.5)">Fast but perceptually wrong</text>
    <!-- BT.601 -->
    <rect x="320" y="96" width="270" height="490" rx="12" fill="rgba(103,232,249,0.05)" stroke="rgba(103,232,249,0.2)" stroke-width="1"/>
    <text x="455" y="124" font-size="13" font-weight="700" fill="#67e8f9">BT.601 (SD Video)</text>
    <text x="455" y="144" font-size="10" fill="rgba(103,232,249,0.7)">Standard definition weights</text>
    <rect x="340" y="160" width="230" height="50" rx="6" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    <text x="455" y="182" font-family="monospace" font-size="9.5" fill="rgba(103,232,249,0.8)">0.299R + 0.587G + 0.114B</text>
    <text x="455" y="252" font-size="9.5" fill="rgba(255,255,255,0.5)">ITU-R BT.601 standard used</text>
    <text x="455" y="270" font-size="9.5" fill="rgba(255,255,255,0.5)">for standard-def TV and JPEG</text>
    <text x="455" y="288" font-size="9.5" fill="rgba(255,255,255,0.5)">Y component (YCbCr color space).</text>
    <text x="455" y="316" font-size="9.5" fill="rgba(255,255,255,0.35)">Pure red (255,0,0): 76</text>
    <text x="455" y="334" font-size="9.5" fill="rgba(255,255,255,0.35)">Pure green (0,255,0): 150</text>
    <text x="455" y="352" font-size="9.5" fill="rgba(255,255,255,0.35)">Pure blue (0,0,255): 29</text>
    <text x="455" y="380" font-size="9.5" fill="rgba(103,232,249,0.7)">Perceptually correct for</text>
    <text x="455" y="398" font-size="9.5" fill="rgba(103,232,249,0.7)">CRT phosphors. Still widely</text>
    <text x="455" y="416" font-size="9.5" fill="rgba(103,232,249,0.7)">used for JPEG/MPEG encoding.</text>
    <text x="455" y="540" font-size="10" font-weight="700" fill="rgba(103,232,249,0.8)">Good general-purpose</text>
    <!-- BT.709 -->
    <rect x="610" y="96" width="270" height="490" rx="12" fill="rgba(167,139,250,0.05)" stroke="rgba(167,139,250,0.2)" stroke-width="1"/>
    <text x="745" y="124" font-size="13" font-weight="700" fill="#a78bfa">BT.709 (HD Video / sRGB)</text>
    <text x="745" y="144" font-size="10" fill="rgba(167,139,250,0.7)">Modern HD/sRGB weights</text>
    <rect x="630" y="160" width="230" height="50" rx="6" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    <text x="745" y="182" font-family="monospace" font-size="9.5" fill="rgba(167,139,250,0.8)">0.2126R + 0.7152G + 0.0722B</text>
    <text x="745" y="252" font-size="9.5" fill="rgba(255,255,255,0.5)">ITU-R BT.709 standard used</text>
    <text x="745" y="270" font-size="9.5" fill="rgba(255,255,255,0.5)">for HDTV and matches the</text>
    <text x="745" y="288" font-size="9.5" fill="rgba(255,255,255,0.5)">sRGB color primaries.</text>
    <text x="745" y="316" font-size="9.5" fill="rgba(255,255,255,0.35)">Pure red (255,0,0): 54</text>
    <text x="745" y="334" font-size="9.5" fill="rgba(255,255,255,0.35)">Pure green (0,255,0): 182</text>
    <text x="745" y="352" font-size="9.5" fill="rgba(255,255,255,0.35)">Pure blue (0,0,255): 18</text>
    <text x="745" y="380" font-size="9.5" fill="rgba(167,139,250,0.7)">Most accurate for modern</text>
    <text x="745" y="398" font-size="9.5" fill="rgba(167,139,250,0.7)">displays. Best for computer</text>
    <text x="745" y="416" font-size="9.5" fill="rgba(167,139,250,0.7)">graphics and photography.</text>
    <text x="745" y="540" font-size="10" font-weight="700" fill="rgba(167,139,250,0.8)">Best for modern displays</text>
    <!-- Lightness -->
    <rect x="900" y="96" width="270" height="490" rx="12" fill="rgba(52,211,153,0.05)" stroke="rgba(52,211,153,0.2)" stroke-width="1"/>
    <text x="1035" y="124" font-size="13" font-weight="700" fill="#6ee7b7">HSL Lightness</text>
    <text x="1035" y="144" font-size="10" fill="rgba(52,211,153,0.7)">Max+min/2 approach</text>
    <rect x="920" y="160" width="230" height="50" rx="6" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    <text x="1035" y="182" font-family="monospace" font-size="9.5" fill="rgba(52,211,153,0.8)">(max(R,G,B) + min(R,G,B)) / 2</text>
    <text x="1035" y="252" font-size="9.5" fill="rgba(255,255,255,0.5)">The L component from HSL</text>
    <text x="1035" y="270" font-size="9.5" fill="rgba(255,255,255,0.5)">color space. Mid-point of</text>
    <text x="1035" y="288" font-size="9.5" fill="rgba(255,255,255,0.5)">the brightest and darkest channel.</text>
    <text x="1035" y="316" font-size="9.5" fill="rgba(255,255,255,0.35)">Pure red (255,0,0): 128</text>
    <text x="1035" y="334" font-size="9.5" fill="rgba(255,255,255,0.35)">Pure green (0,255,0): 128</text>
    <text x="1035" y="352" font-size="9.5" fill="rgba(255,255,255,0.35)">Pure blue (0,0,255): 128</text>
    <text x="1035" y="380" font-size="9.5" fill="rgba(52,211,153,0.7)">All primaries map to same</text>
    <text x="1035" y="398" font-size="9.5" fill="rgba(52,211,153,0.7)">gray. Good for tone-based</text>
    <text x="1035" y="416" font-size="9.5" fill="rgba(52,211,153,0.7)">artistic effects.</text>
    <text x="1035" y="540" font-size="10" font-weight="700" fill="rgba(52,211,153,0.8)">Artistic / tone-based</text>
  </g>
  <text x="600" y="635" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.22)">toolnestai.net/image-tools/grayscale-converter</text>
</svg>
