  <text x="664" y="148" font-size="9" font-family="monospace" fill="rgba(52,211,153,0.8)">data:image/png;base64,</text>
  <text x="664" y="166" font-size="8.5" font-family="monospace" fill="rgba(255,255,255,0.4)">iVBORw0KGgoAAAANSUhEUgAAAQAAAAEACA</text>
  <text x="664" y="182" font-size="8.5" font-family="monospace" fill="rgba(255,255,255,0.4)">YAAABccvqrhAAAAAXNSR0IArs4c6QAAAARn</text>
  <text x="664" y="198" font-size="8.5" font-family="monospace" fill="rgba(255,255,255,0.4)">QU1BAACxjwv8YQUAAAAJcEhZcwAADsMAAAq</text>
  <text x="664" y="214" font-size="8.5" font-family="monospace" fill="rgba(255,255,255,0.4)">MAA7MGAAAJiklEQVR4Ae3Bv2sUCQDG8e/c</text>
  <text x="664" y="230" font-size="8.5" font-family="monospace" fill="rgba(255,255,255,0.4)">7tXa2tra2toqKioqKioqKioqKioqKioqKi...</text>
  <text x="664" y="260" font-size="8.5" font-family="monospace" fill="rgba(255,255,255,0.3)">...continues for full image data...</text>
  <text x="884" y="340" text-anchor="middle" font-size="9" fill="rgba(52,211,153,0.6)">~33% larger than source</text>
  <g text-anchor="middle" font-size="9.5">
    <rect x="648" y="382" width="114" height="44" rx="8" fill="rgba(167,139,250,0.1)" stroke="rgba(167,139,250,0.22)" stroke-width="1"/>
    <text x="705" y="400" fill="#a78bfa" font-weight="700">Data URI</text>
    <text x="705" y="416" fill="rgba(255,255,255,0.4)">full URL</text>
    <rect x="774" y="382" width="114" height="44" rx="8" fill="rgba(103,232,249,0.1)" stroke="rgba(103,232,249,0.22)" stroke-width="1"/>
    <text x="831" y="400" fill="#67e8f9" font-weight="700">CSS bg</text>
    <text x="831" y="416" fill="rgba(255,255,255,0.4)">url(...)</text>
    <rect x="900" y="382" width="114" height="44" rx="8" fill="rgba(52,211,153,0.1)" stroke="rgba(52,211,153,0.22)" stroke-width="1"/>
    <text x="957" y="400" fill="#6ee7b7" font-weight="700">JSON</text>
    <text x="957" y="416" fill="rgba(255,255,255,0.4)">API payload</text>
    <rect x="1026" y="382" width="106" height="44" rx="8" fill="rgba(251,191,36,0.1)" stroke="rgba(251,191,36,0.22)" stroke-width="1"/>
    <text x="1079" y="400" fill="#fbbf24" font-weight="700">HTML img</text>
    <text x="1079" y="416" fill="rgba(255,255,255,0.4)">src attr</text>
  </g>
  <rect x="648" y="438" width="474" height="44" rx="8" fill="url(#bG)" filter="url(#sh)"/>
  <text x="885" y="465" text-anchor="middle" font-size="13" font-weight="900" fill="#fff">Convert Image to Base64 Free</text>
