<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="30%" cy="40%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <radialGradient id="gL" cx="15%" cy="50%" r="55%"><stop offset="0%" stop-color="#5b21b6" stop-opacity="0.4"/><stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/></radialGradient>
    <radialGradient id="gR" cx="85%" cy="50%" r="55%"><stop offset="0%" stop-color="#0f766e" stop-opacity="0.22"/><stop offset="100%" stop-color="#0f766e" stop-opacity="0"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="bG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient>
    <linearGradient id="lapG" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1a1040"/><stop offset="100%" stop-color="#0d0824"/></linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#5b21b6" flood-opacity="0.45"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <ellipse cx="180" cy="337" rx="600" ry="500" fill="url(#gL)"/>
  <ellipse cx="1020" cy="337" rx="600" ry="500" fill="url(#gR)"/>

  <!-- Left -->
  <text x="60" y="70" font-size="14" font-weight="700" fill="url(#aG)" filter="url(#glow)">ToolNest AI</text>
  <text x="60" y="106" font-size="13" fill="rgba(255,255,255,0.35)">Security Tools › Password Generator</text>
  <text x="60" y="178" font-size="50" font-weight="900" fill="url(#aG)" filter="url(#glow)">Password</text>
  <text x="60" y="236" font-size="50" font-weight="900" fill="url(#aG)" filter="url(#glow)">Generator</text>
  <text x="60" y="290" font-size="17" fill="rgba(255,255,255,0.6)">Strong · Random · Instant · Private</text>

  <!-- Strength stats -->
  <rect x="60" y="316" width="100" height="58" rx="8" fill="rgba(124,58,237,0.15)" stroke="rgba(124,58,237,0.3)" stroke-width="1"/>
  <text x="110" y="342" text-anchor="middle" font-size="22" font-weight="900" fill="#a78bfa">2¹²⁸</text>
  <text x="110" y="358" text-anchor="middle" font-size="7.5" fill="rgba(255,255,255,0.4)">possible combos</text>
  <text x="110" y="368" text-anchor="middle" font-size="7.5" fill="rgba(255,255,255,0.4)">at 20 chars</text>

  <rect x="172" y="316" width="100" height="58" rx="8" fill="rgba(15,118,110,0.12)" stroke="rgba(15,118,110,0.3)" stroke-width="1"/>
  <text x="222" y="342" text-anchor="middle" font-size="22" font-weight="900" fill="#5eead4">16+</text>
  <text x="222" y="358" text-anchor="middle" font-size="7.5" fill="rgba(255,255,255,0.4)">chars for a</text>
  <text x="222" y="368" text-anchor="middle" font-size="7.5" fill="rgba(255,255,255,0.4)">strong password</text>

  <rect x="284" y="316" width="100" height="58" rx="8" fill="rgba(16,185,129,0.1)" stroke="rgba(16,185,129,0.25)" stroke-width="1"/>
  <text x="334" y="342" text-anchor="middle" font-size="22" font-weight="900" fill="#34d399">0</text>
  <text x="334" y="358" text-anchor="middle" font-size="7.5" fill="rgba(255,255,255,0.4)">data stored</text>
  <text x="334" y="368" text-anchor="middle" font-size="7.5" fill="rgba(255,255,255,0.4)">or transmitted</text>

  <rect x="396" y="316" width="100" height="58" rx="8" fill="rgba(251,191,36,0.1)" stroke="rgba(251,191,36,0.25)" stroke-width="1"/>
  <text x="446" y="342" text-anchor="middle" font-size="22" font-weight="900" fill="#fbbf24">95</text>
  <text x="446" y="358" text-anchor="middle" font-size="7.5" fill="rgba(255,255,255,0.4)">character</text>
  <text x="446" y="368" text-anchor="middle" font-size="7.5" fill="rgba(255,255,255,0.4)">pool available</text>

  <!-- Features list -->
  <g font-size="11" fill="rgba(255,255,255,0.55)">
    <text x="60" y="408">✦  Uppercase, lowercase, numbers &amp; symbols</text>
    <text x="60" y="430">✦  Adjustable length from 4 to 128 characters</text>
    <text x="60" y="452">✦  Live strength meter (Weak → Very Strong)</text>
    <text x="60" y="474">✦  Exclude ambiguous characters (0/O, l/I/1)</text>
    <text x="60" y="496">✦  Bulk generate up to 50 passwords at once</text>
    <text x="60" y="518">✦  All generation happens in your browser</text>
  </g>

  <text x="60" y="610" font-size="14" fill="rgba(255,255,255,0.25)">toolnestai.net/security-tools/password-generator</text>

