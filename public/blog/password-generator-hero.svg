  <text x="658" y="448" font-size="8" font-weight="700" fill="rgba(255,255,255,0.3)" letter-spacing="1">BULK OUTPUT</text>
  <rect x="642" y="454" width="516" height="130" rx="8" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <g font-family="monospace" font-size="8" fill="rgba(255,255,255,0.45)">
    <text x="658" y="472">1.  Xk#9mP@vL2$nQr7!</text>
    <text x="658" y="487">2.  Nm!8vX#pKq@2Yz$w</text>
    <text x="658" y="502">3.  R7&amp;eLs#4Jt@mW9nA</text>
    <text x="658" y="517">4.  qP#3uZk!Xv@8LmN$</text>
    <text x="658" y="532">5.  bT@6wRn#Ys!2Xe&amp;P</text>
    <text x="658" y="547">6.  Zj$5cMv#Lw@8Aq!K</text>
    <text x="658" y="562">7.  Fh@2dNk#Rm$9Gt!V</text>
    <text x="658" y="577">8.  Wy!4bSp#Jm@7Fx$E</text>
  </g>

  <!-- Laptop base -->
  <rect x="620" y="600" width="560" height="14" rx="4" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="760" y="612" width="260" height="8" rx="4" fill="rgba(255,255,255,0.03)"/>
</svg>
