    <rect x="642" y="288" width="250" height="26" rx="5" fill="rgba(251,191,36,0.08)" stroke="rgba(251,191,36,0.2)" stroke-width="1"/>
    <rect x="650" y="295" width="12" height="12" rx="3" fill="rgba(251,191,36,0.4)" stroke="rgba(251,191,36,0.7)" stroke-width="1"/>
    <text x="658" y="304" text-anchor="middle" font-size="8" fill="#fbbf24">✓</text>
    <text x="670" y="304" fill="rgba(255,255,255,0.7)">Numbers  0 1 2 … 9</text>

    <rect x="906" y="288" width="252" height="26" rx="5" fill="rgba(52,211,153,0.08)" stroke="rgba(52,211,153,0.2)" stroke-width="1"/>
    <rect x="914" y="295" width="12" height="12" rx="3" fill="rgba(52,211,153,0.35)" stroke="rgba(52,211,153,0.65)" stroke-width="1"/>
    <text x="922" y="304" text-anchor="middle" font-size="8" fill="#34d399">✓</text>
    <text x="934" y="304" fill="rgba(255,255,255,0.7)">Symbols  ! @ # $ % ^ &amp; *</text>

    <rect x="642" y="320" width="516" height="24" rx="5" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <rect x="650" y="327" width="12" height="12" rx="3" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
    <text x="670" y="336" font-size="8" fill="rgba(255,255,255,0.45)">Exclude ambiguous characters  (0 O l I 1)</text>
  </g>

  <!-- Generate button -->
  <rect x="642" y="354" width="516" height="36" rx="10" fill="url(#bG)" filter="url(#sh)"/>
  <text x="900" y="376" text-anchor="middle" font-size="13" font-weight="900" fill="#fff">↻  Generate Password</text>

  <!-- Copy button -->
  <rect x="642" y="400" width="252" height="28" rx="8" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
  <text x="768" y="418" text-anchor="middle" font-size="9" font-weight="700" fill="rgba(52,211,153,0.9)">⎘ Copy Password</text>
  <rect x="906" y="400" width="252" height="28" rx="8" fill="rgba(124,58,237,0.15)" stroke="rgba(124,58,237,0.3)" stroke-width="1"/>
  <text x="1032" y="418" text-anchor="middle" font-size="9" font-weight="700" fill="rgba(167,139,250,0.9)">Generate 10 More</text>

