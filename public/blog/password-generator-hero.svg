  <rect x="630" y="42" width="540" height="558" rx="16" fill="url(#lapG)" stroke="rgba(124,58,237,0.3)" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="630" y="42" width="540" height="36" rx="16" fill="rgba(255,255,255,0.05)"/>
  <rect x="630" y="60" width="540" height="18" fill="rgba(255,255,255,0.02)"/>
  <circle cx="655" cy="60" r="6" fill="rgba(239,68,68,0.6)"/>
  <circle cx="675" cy="60" r="6" fill="rgba(251,191,36,0.6)"/>
  <circle cx="695" cy="60" r="6" fill="rgba(34,197,94,0.6)"/>

  <!-- Password output -->
  <rect x="642" y="86" width="516" height="56" rx="10" fill="rgba(0,0,0,0.45)" stroke="rgba(124,58,237,0.5)" stroke-width="1.5"/>
  <text x="900" y="112" text-anchor="middle" font-family="monospace" font-size="17" font-weight="700" letter-spacing="2" fill="rgba(255,255,255,0.9)">Xk#9mP@vL2$nQr7!</text>
  <text x="900" y="132" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.28)">16 chars · click ↻ to regenerate</text>

