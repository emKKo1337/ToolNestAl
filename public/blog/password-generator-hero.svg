    <rect x="650" y="263" width="12" height="12" rx="3" fill="rgba(124,58,237,0.6)" stroke="rgba(124,58,237,0.9)" stroke-width="1"/>
    <text x="658" y="272" text-anchor="middle" font-size="8" fill="#a78bfa">✓</text>
    <text x="670" y="272" fill="rgba(255,255,255,0.7)">Uppercase  A B C … Z</text>

    <rect x="906" y="256" width="252" height="26" rx="5" fill="rgba(124,58,237,0.12)" stroke="rgba(124,58,237,0.25)" stroke-width="1"/>
    <rect x="914" y="263" width="12" height="12" rx="3" fill="rgba(124,58,237,0.6)" stroke="rgba(124,58,237,0.9)" stroke-width="1"/>
