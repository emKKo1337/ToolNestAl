<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <radialGradient id="gC" cx="50%" cy="40%" r="60%"><stop offset="0%" stop-color="#5b21b6" stop-opacity="0.2"/><stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
  </defs>
  <rect width="900" height="460" fill="url(#bg)"/>
  <ellipse cx="450" cy="230" rx="500" ry="330" fill="url(#gC)"/>

  <text x="450" y="38" text-anchor="middle" font-size="20" font-weight="900" fill="url(#aG)">Password Strength Scale — From Weak to Very Strong</text>
  <text x="450" y="57" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.38)">How length and character variety determine password strength and estimated crack time</text>

  <!-- Weak -->
  <rect x="28" y="70" width="844" height="64" rx="8" fill="rgba(239,68,68,0.07)" stroke="rgba(239,68,68,0.2)" stroke-width="1"/>
  <text x="44" y="90" font-size="10" font-weight="800" fill="rgba(239,68,68,0.85)">WEAK</text>
  <rect x="44" y="96" width="844" height="10" rx="5" fill="rgba(255,255,255,0.05)"/>
  <rect x="44" y="96" width="160" height="10" rx="5" fill="rgba(239,68,68,0.6)"/>
  <text x="44" y="122" font-size="8.5" fill="rgba(255,255,255,0.5)">Example: <tspan font-family="monospace" fill="rgba(239,68,68,0.7)">password123</tspan>  ·  &lt;8 chars, common word + numbers, no symbols</text>
  <text x="560" y="122" font-size="8.5" fill="rgba(255,255,255,0.35)">Crack time: &lt;1 second (dictionary attack)</text>

  <!-- Fair -->
  <rect x="28" y="142" width="844" height="64" rx="8" fill="rgba(251,146,60,0.07)" stroke="rgba(251,146,60,0.2)" stroke-width="1"/>
  <text x="44" y="162" font-size="10" font-weight="800" fill="rgba(251,146,60,0.85)">FAIR</text>
  <rect x="44" y="168" width="844" height="10" rx="5" fill="rgba(255,255,255,0.05)"/>
  <rect x="44" y="168" width="330" height="10" rx="5" fill="rgba(251,146,60,0.6)"/>
  <text x="44" y="194" font-size="8.5" fill="rgba(255,255,255,0.5)">Example: <tspan font-family="monospace" fill="rgba(251,146,60,0.7)">BlueSky47</tspan>  ·  8–10 chars, uppercase + lowercase + numbers, no symbols</text>
  <text x="560" y="194" font-size="8.5" fill="rgba(255,255,255,0.35)">Crack time: hours to days (brute force)</text>

  <!-- Good -->
  <rect x="28" y="214" width="844" height="64" rx="8" fill="rgba(234,179,8,0.07)" stroke="rgba(234,179,8,0.2)" stroke-width="1"/>
  <text x="44" y="234" font-size="10" font-weight="800" fill="rgba(234,179,8,0.85)">GOOD</text>
  <rect x="44" y="240" width="844" height="10" rx="5" fill="rgba(255,255,255,0.05)"/>
  <rect x="44" y="240" width="530" height="10" rx="5" fill="rgba(234,179,8,0.6)"/>
  <text x="44" y="266" font-size="8.5" fill="rgba(255,255,255,0.5)">Example: <tspan font-family="monospace" fill="rgba(234,179,8,0.7)">BlueSky47!</tspan>  ·  10–12 chars, all 4 character types, no dictionary words</text>
  <text x="560" y="266" font-size="8.5" fill="rgba(255,255,255,0.35)">Crack time: years (standard hardware)</text>

  <!-- Strong -->
  <rect x="28" y="286" width="844" height="64" rx="8" fill="rgba(34,197,94,0.07)" stroke="rgba(34,197,94,0.2)" stroke-width="1"/>
  <text x="44" y="306" font-size="10" font-weight="800" fill="rgba(34,197,94,0.85)">STRONG</text>
  <rect x="44" y="312" width="844" height="10" rx="5" fill="rgba(255,255,255,0.05)"/>
  <rect x="44" y="312" width="700" height="10" rx="5" fill="rgba(34,197,94,0.6)"/>
  <text x="44" y="338" font-size="8.5" fill="rgba(255,255,255,0.5)">Example: <tspan font-family="monospace" fill="rgba(34,197,94,0.7)">Xk#9mP@vL2$n</tspan>  ·  12–15 chars, fully random, all character types</text>
  <text x="560" y="338" font-size="8.5" fill="rgba(255,255,255,0.35)">Crack time: millions of years</text>

  <!-- Very Strong -->
  <rect x="28" y="358" width="844" height="64" rx="8" fill="rgba(167,139,250,0.08)" stroke="rgba(167,139,250,0.22)" stroke-width="1"/>
  <text x="44" y="378" font-size="10" font-weight="800" fill="rgba(167,139,250,0.9)">VERY STRONG</text>
  <rect x="44" y="384" width="844" height="10" rx="5" fill="rgba(255,255,255,0.05)"/>
  <rect x="44" y="384" width="844" height="10" rx="5" fill="rgba(167,139,250,0.55)"/>
  <text x="44" y="410" font-size="8.5" fill="rgba(255,255,255,0.5)">Example: <tspan font-family="monospace" fill="rgba(167,139,250,0.8)">Xk#9mP@vL2$nQr7!wZ</tspan>  ·  16+ chars, fully random, all 4 character types</text>
  <text x="560" y="410" font-size="8.5" fill="rgba(255,255,255,0.35)">Crack time: longer than the age of the universe</text>

  <!-- Footer rule -->
  <rect x="28" y="432" width="844" height="22" rx="6" fill="rgba(124,58,237,0.1)" stroke="rgba(124,58,237,0.2)" stroke-width="1"/>
  <text x="450" y="447" text-anchor="middle" font-size="9" fill="rgba(167,139,250,0.7)">Rule of thumb: 16+ random characters with all 4 types = uncrackable in practice · toolnestai.net/security-tools/password-generator</text>
</svg>
