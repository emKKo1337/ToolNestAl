<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="30%" cy="40%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <radialGradient id="gL" cx="15%" cy="50%" r="55%"><stop offset="0%" stop-color="#5b21b6" stop-opacity="0.45"/><stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/></radialGradient>
    <radialGradient id="gR" cx="85%" cy="50%" r="55%"><stop offset="0%" stop-color="#0e7490" stop-opacity="0.28"/><stop offset="100%" stop-color="#0e7490" stop-opacity="0"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="bG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient>
    <linearGradient id="lapG" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1a1040"/><stop offset="100%" stop-color="#0d0824"/></linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#5b21b6" flood-opacity="0.5"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="180" cy="315" rx="600" ry="500" fill="url(#gL)"/>
  <ellipse cx="1020" cy="315" rx="600" ry="500" fill="url(#gR)"/>
  <text x="60" y="70" font-size="14" font-weight="700" fill="url(#aG)" filter="url(#glow)">ToolNest AI</text>
  <text x="60" y="106" font-size="13" fill="rgba(255,255,255,0.35)">Image Tools - Image Rotator</text>
  <text x="60" y="185" font-size="46" font-weight="900" fill="url(#aG)" filter="url(#glow)">Image</text>
  <text x="60" y="245" font-size="46" font-weight="900" fill="url(#aG)" filter="url(#glow)">Rotator</text>
  <text x="60" y="300" font-size="18" fill="rgba(255,255,255,0.6)">Rotate, flip, and fix EXIF orientation</text>
  <text x="60" y="328" font-size="18" fill="rgba(255,255,255,0.6)">Any angle, free, no upload</text>
  <g>
    <rect x="60" y="358" width="90" height="52" rx="8" fill="rgba(124,58,237,0.2)" stroke="rgba(124,58,237,0.4)" stroke-width="1"/>
    <text x="105" y="382" text-anchor="middle" font-size="13" font-weight="900" fill="#a78bfa">90°</text>
    <text x="105" y="400" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">quick steps</text>
    <rect x="162" y="358" width="90" height="52" rx="8" fill="rgba(14,116,144,0.15)" stroke="rgba(14,116,144,0.35)" stroke-width="1"/>
    <text x="207" y="382" text-anchor="middle" font-size="13" font-weight="900" fill="#67e8f9">Free°</text>
    <text x="207" y="400" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">any angle</text>
    <rect x="264" y="358" width="90" height="52" rx="8" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
    <text x="309" y="382" text-anchor="middle" font-size="13" font-weight="900" fill="#34d399">Flip</text>
    <text x="309" y="400" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">H &amp; V</text>
    <rect x="366" y="358" width="100" height="52" rx="8" fill="rgba(251,191,36,0.1)" stroke="rgba(251,191,36,0.25)" stroke-width="1"/>
    <text x="416" y="382" text-anchor="middle" font-size="11" font-weight="900" fill="#fbbf24">EXIF fix</text>
    <text x="416" y="400" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">orientation</text>
  </g>
  <text x="60" y="560" font-size="14" fill="rgba(255,255,255,0.25)">toolnestai.net/image-tools/image-rotator</text>
  <!-- Laptop UI -->
  <rect x="630" y="60" width="530" height="490" rx="16" fill="url(#lapG)" stroke="rgba(124,58,237,0.3)" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="630" y="60" width="530" height="36" rx="16" fill="rgba(255,255,255,0.05)"/>
  <rect x="630" y="78" width="530" height="18" fill="rgba(255,255,255,0.02)"/>
  <circle cx="655" cy="78" r="6" fill="rgba(239,68,68,0.6)"/>
  <circle cx="675" cy="78" r="6" fill="rgba(251,191,36,0.6)"/>
  <circle cx="695" cy="78" r="6" fill="rgba(34,197,94,0.6)"/>
  <!-- Rotation buttons row -->
  <g text-anchor="middle" font-size="9.5">
    <rect x="648" y="110" width="116" height="44" rx="8" fill="rgba(167,139,250,0.1)" stroke="rgba(167,139,250,0.22)" stroke-width="1"/>
    <text x="706" y="128" fill="rgba(255,255,255,0.65)">↺ 90° Left</text>
    <text x="706" y="146" font-size="8.5" fill="rgba(255,255,255,0.3)">counter-clockwise</text>
    <rect x="774" y="110" width="116" height="44" rx="8" fill="url(#bG)"/>
    <text x="832" y="128" fill="#fff" font-weight="700">↻ 90° Right</text>
    <text x="832" y="146" font-size="8.5" fill="rgba(255,255,255,0.6)">clockwise</text>
    <rect x="900" y="110" width="116" height="44" rx="8" fill="rgba(52,211,153,0.1)" stroke="rgba(52,211,153,0.22)" stroke-width="1"/>
    <text x="958" y="128" fill="rgba(52,211,153,0.85)">↕ 180°</text>
    <text x="958" y="146" font-size="8.5" fill="rgba(255,255,255,0.3)">flip upside-down</text>
  </g>
  <!-- Image preview -->
  <rect x="648" y="166" width="390" height="220" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <!-- Rotated image representation -->
  <g transform="translate(843,276) rotate(15)">
    <rect x="-80" y="-65" width="160" height="130" rx="6" fill="rgba(124,58,237,0.2)" stroke="rgba(124,58,237,0.35)" stroke-width="1.5"/>
    <text x="0" y="5" text-anchor="middle" font-size="11" fill="rgba(167,139,250,0.85)">image.jpg</text>
    <text x="0" y="22" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.35)">rotated 15°</text>
  </g>
  <!-- Flip buttons -->
  <g text-anchor="middle" font-size="9.5">
    <rect x="648" y="398" width="186" height="38" rx="7" fill="rgba(103,232,249,0.08)" stroke="rgba(103,232,249,0.18)" stroke-width="1"/>
    <text x="741" y="421" fill="rgba(103,232,249,0.85)">⇆ Flip Horizontal</text>
    <rect x="844" y="398" width="194" height="38" rx="7" fill="rgba(103,232,249,0.08)" stroke="rgba(103,232,249,0.18)" stroke-width="1"/>
    <text x="941" y="421" fill="rgba(103,232,249,0.85)">⇅ Flip Vertical</text>
  </g>
  <!-- Free angle -->
  <rect x="648" y="448" width="390" height="44" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="657" y="468" font-size="9" fill="rgba(255,255,255,0.35)">Custom angle</text>
  <rect x="730" y="457" width="168" height="26" rx="6" fill="rgba(124,58,237,0.12)" stroke="rgba(124,58,237,0.2)" stroke-width="1"/>
  <text x="814" y="474" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.55)">45</text>
  <text x="912" y="474" font-size="10" fill="rgba(255,255,255,0.45)">degrees</text>
  <rect x="620" y="550" width="560" height="14" rx="4" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
</svg>
