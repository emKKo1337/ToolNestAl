<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <radialGradient id="gL" cx="20%" cy="50%" r="55%"><stop offset="0%" stop-color="#5b21b6" stop-opacity="0.22"/><stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#818cf8"/></linearGradient>
  </defs>
  <rect width="900" height="460" fill="url(#bg)"/>
  <ellipse cx="180" cy="230" rx="400" ry="320" fill="url(#gL)"/>

  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="900" fill="url(#aG)">5 Common Password Mistakes &amp; How to Fix Them</text>
  <text x="450" y="54" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.38)">Habits that put your accounts at risk — and what to do instead</text>

  <rect x="28" y="66" width="270" height="24" rx="6" fill="rgba(239,68,68,0.15)" stroke="rgba(239,68,68,0.3)" stroke-width="1"/>
  <text x="163" y="82" text-anchor="middle" font-size="10" font-weight="700" fill="rgba(239,68,68,0.9)">⛔  The Mistake</text>
  <rect x="306" y="66" width="566" height="24" rx="6" fill="rgba(34,197,94,0.1)" stroke="rgba(34,197,94,0.25)" stroke-width="1"/>
  <text x="589" y="82" text-anchor="middle" font-size="10" font-weight="700" fill="rgba(34,197,94,0.9)">✓  The Fix</text>

  <!-- Row 1: Reusing passwords -->
  <rect x="28" y="96" width="270" height="64" rx="7" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="44" y="114" font-size="9" font-weight="700" fill="rgba(239,68,68,0.85)">Reusing the same password</text>
  <text x="44" y="130" font-size="8" fill="rgba(255,255,255,0.42)">One breach exposes every</text>
  <text x="44" y="144" font-size="8" fill="rgba(255,255,255,0.42)">account that shares that password.</text>
  <rect x="306" y="96" width="566" height="64" rx="7" fill="rgba(255,255,255,0.02)" stroke="rgba(34,197,94,0.08)" stroke-width="1"/>
  <text x="322" y="112" font-size="8.5" fill="rgba(255,255,255,0.5)">Use a unique password for every account. A password manager stores them all.</text>
  <text x="322" y="128" font-size="8" font-family="monospace" fill="rgba(239,68,68,0.7)">✗  gmail: MyPet2020!  · twitter: MyPet2020!  · bank: MyPet2020!</text>
  <text x="322" y="144" font-size="8" font-family="monospace" fill="rgba(34,197,94,0.8)">✓  Each site gets its own 16-char random password</text>
  <text x="322" y="156" font-size="7.5" fill="rgba(255,255,255,0.3)">Credential stuffing attacks use leaked passwords to try every major site automatically.</text>

  <!-- Row 2: Short passwords -->
  <rect x="28" y="166" width="270" height="64" rx="7" fill="rgba(255,255,255,0.025)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="44" y="184" font-size="9" font-weight="700" fill="rgba(239,68,68,0.85)">Using passwords under 12 chars</text>
  <text x="44" y="200" font-size="8" fill="rgba(255,255,255,0.42)">Short passwords are crackable</text>
  <text x="44" y="214" font-size="8" fill="rgba(255,255,255,0.42)">in seconds with modern GPUs.</text>
  <rect x="306" y="166" width="566" height="64" rx="7" fill="rgba(255,255,255,0.02)" stroke="rgba(34,197,94,0.08)" stroke-width="1"/>
  <text x="322" y="182" font-size="8.5" fill="rgba(255,255,255,0.5)">Use 16+ characters for all important accounts. Length is the biggest factor in strength.</text>
  <text x="322" y="198" font-size="8" font-family="monospace" fill="rgba(239,68,68,0.7)">✗  "Blue47"  — 6 chars, cracks in milliseconds on a GPU</text>
  <text x="322" y="214" font-size="8" font-family="monospace" fill="rgba(34,197,94,0.8)">✓  "Xk#9mP@vL2$nQr7!" — 16 chars, centuries to crack</text>
  <text x="322" y="226" font-size="7.5" fill="rgba(255,255,255,0.3)">Each extra character multiplies the search space exponentially — length beats complexity.</text>

  <!-- Row 3: Personal info -->
  <rect x="28" y="236" width="270" height="64" rx="7" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="44" y="254" font-size="9" font-weight="700" fill="rgba(239,68,68,0.85)">Using personal information</text>
  <text x="44" y="270" font-size="8" fill="rgba(255,255,255,0.42)">Name, birthday, pet, city —</text>
  <text x="44" y="284" font-size="8" fill="rgba(255,255,255,0.42)">guessable from social media.</text>
  <rect x="306" y="236" width="566" height="64" rx="7" fill="rgba(255,255,255,0.02)" stroke="rgba(34,197,94,0.08)" stroke-width="1"/>
  <text x="322" y="252" font-size="8.5" fill="rgba(255,255,255,0.5)">Use fully random passwords with no meaningful words, dates, or names.</text>
  <text x="322" y="268" font-size="8" font-family="monospace" fill="rgba(239,68,68,0.7)">✗  "Alice1990London!"  — contains name, birth year, city</text>
  <text x="322" y="284" font-size="8" font-family="monospace" fill="rgba(34,197,94,0.8)">✓  "Xk#9mP@vL2$nQr7!" — no personal connection</text>
  <text x="322" y="296" font-size="7.5" fill="rgba(255,255,255,0.3)">Targeted attacks check names, dates, and locations from public profiles first.</text>

  <!-- Row 4: Simple substitutions -->
  <rect x="28" y="306" width="270" height="64" rx="7" fill="rgba(255,255,255,0.025)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="44" y="324" font-size="9" font-weight="700" fill="rgba(239,68,68,0.85)">L33t speak substitutions</text>
  <text x="44" y="340" font-size="8" fill="rgba(255,255,255,0.42)">Pa$$w0rd, p@ssw0rd —</text>
  <text x="44" y="354" font-size="8" fill="rgba(255,255,255,0.42)">cracking tools know every pattern.</text>
  <rect x="306" y="306" width="566" height="64" rx="7" fill="rgba(255,255,255,0.02)" stroke="rgba(34,197,94,0.08)" stroke-width="1"/>
  <text x="322" y="322" font-size="8.5" fill="rgba(255,255,255,0.5)">True randomness beats any pattern-based approach. Let a generator choose for you.</text>
  <text x="322" y="338" font-size="8" font-family="monospace" fill="rgba(239,68,68,0.7)">✗  "Pa$$w0rd!"  — dictionary + substitution, cracks in seconds</text>
  <text x="322" y="354" font-size="8" font-family="monospace" fill="rgba(34,197,94,0.8)">✓  "qP#3uZk!Xv@8LmN$" — genuinely random, no pattern</text>
  <text x="322" y="366" font-size="7.5" fill="rgba(255,255,255,0.3)">Modern crackers use rule-based mutations — every common substitution is already in the list.</text>

  <!-- Row 5: No MFA -->
  <rect x="28" y="376" width="270" height="64" rx="7" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="44" y="394" font-size="9" font-weight="700" fill="rgba(239,68,68,0.85)">Skipping two-factor auth</text>
  <text x="44" y="410" font-size="8" fill="rgba(255,255,255,0.42)">Even a strong password can be</text>
  <text x="44" y="424" font-size="8" fill="rgba(255,255,255,0.42)">phished or leaked in a breach.</text>
  <rect x="306" y="376" width="566" height="64" rx="7" fill="rgba(255,255,255,0.02)" stroke="rgba(34,197,94,0.08)" stroke-width="1"/>
  <text x="322" y="392" font-size="8.5" fill="rgba(255,255,255,0.5)">Enable 2FA on every account that offers it. Strong password + 2FA = very secure.</text>
  <text x="322" y="408" font-size="8" font-family="monospace" fill="rgba(239,68,68,0.7)">✗  Strong password, no 2FA — stolen in phishing, account taken</text>
  <text x="322" y="424" font-size="8" font-family="monospace" fill="rgba(34,197,94,0.8)">✓  Strong password + authenticator app = near-impossible to breach</text>
  <text x="322" y="436" font-size="7.5" fill="rgba(255,255,255,0.3)">Use an authenticator app (not SMS) for the highest security level.</text>

  <text x="450" y="452" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.25)">toolnestai.net/security-tools/password-generator</text>
</svg>
