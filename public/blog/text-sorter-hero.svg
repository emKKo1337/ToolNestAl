<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <radialGradient id="gL" cx="10%" cy="50%" r="60%"><stop offset="0%" stop-color="#5b21b6" stop-opacity="0.35"/><stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/></radialGradient>
    <radialGradient id="gR" cx="90%" cy="50%" r="60%"><stop offset="0%" stop-color="#0e7490" stop-opacity="0.2"/><stop offset="100%" stop-color="#0e7490" stop-opacity="0"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="bG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient>
    <linearGradient id="lapG" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1a1040"/><stop offset="100%" stop-color="#0d0824"/></linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#5b21b6" flood-opacity="0.45"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <ellipse cx="120" cy="337" rx="700" ry="550" fill="url(#gL)"/>
  <ellipse cx="1080" cy="337" rx="700" ry="550" fill="url(#gR)"/>

  <text x="600" y="42" text-anchor="middle" font-size="13" font-weight="700" fill="url(#aG)" filter="url(#glow)">ToolNest AI — Text Tools</text>
  <text x="600" y="68" text-anchor="middle" font-size="34" font-weight="900" fill="url(#aG)" filter="url(#glow)">Text Sorter</text>
  <text x="600" y="90" text-anchor="middle" font-size="13" fill="rgba(255,255,255,0.35)">Sort lines A-Z, Z-A, by length, numerically, or randomly — free, instant</text>

  <rect x="60" y="108" width="1080" height="542" rx="18" fill="url(#lapG)" stroke="rgba(124,58,237,0.35)" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="60" y="108" width="1080" height="38" rx="18" fill="rgba(255,255,255,0.05)"/>
  <rect x="60" y="128" width="1080" height="18" fill="rgba(255,255,255,0.02)"/>
  <circle cx="90" cy="127" r="7" fill="rgba(239,68,68,0.65)"/>
  <circle cx="114" cy="127" r="7" fill="rgba(251,191,36,0.65)"/>
  <circle cx="138" cy="127" r="7" fill="rgba(34,197,94,0.65)"/>
  <text x="600" y="132" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.2)">toolnestai.net/text-tools/text-sorter</text>

  <!-- Mode tabs -->
  <g font-size="10.5" text-anchor="middle">
    <rect x="80" y="158" width="90" height="26" rx="6" fill="url(#bG)"/>
    <text x="125" y="175" fill="#fff" font-weight="700">A → Z</text>
    <rect x="178" y="158" width="90" height="26" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="223" y="175" fill="rgba(255,255,255,0.4)">Z → A</text>
    <rect x="276" y="158" width="100" height="26" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="326" y="175" fill="rgba(255,255,255,0.4)">By Length</text>
    <rect x="384" y="158" width="90" height="26" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="429" y="175" fill="rgba(255,255,255,0.4)">Numeric</text>
    <rect x="482" y="158" width="90" height="26" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="527" y="175" fill="rgba(255,255,255,0.4)">Random</text>
  </g>

  <!-- Before/After -->
  <text x="88" y="212" font-size="9" font-weight="700" fill="rgba(255,255,255,0.28)">INPUT (unsorted)</text>
  <rect x="80" y="218" width="330" height="240" rx="10" fill="rgba(0,0,0,0.4)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <g font-family="monospace" font-size="13" fill="rgba(255,255,255,0.6)">
    <text x="98" y="248">banana</text>
    <text x="98" y="278">Apple</text>
    <text x="98" y="308">item10</text>
    <text x="98" y="338">item2</text>
    <text x="98" y="368">cherry</text>
    <text x="98" y="398">Apple</text>
    <text x="98" y="428">10 Downing St</text>
  </g>

  <text x="440" y="330" text-anchor="middle" font-size="22" fill="rgba(255,255,255,0.3)">→</text>

  <text x="472" y="212" font-size="9" font-weight="700" fill="rgba(52,211,153,0.8)">OUTPUT (A→Z sort + dedupe)</text>
  <rect x="464" y="218" width="330" height="240" rx="10" fill="rgba(52,211,153,0.08)" stroke="rgba(52,211,153,0.28)" stroke-width="1"/>
  <g font-family="monospace" font-size="13" fill="rgba(110,231,183,0.9)">
    <text x="482" y="248">10 Downing St</text>
    <text x="482" y="278">Apple</text>
    <text x="482" y="308">banana</text>
    <text x="482" y="338">cherry</text>
    <text x="482" y="368">item10</text>
    <text x="482" y="398">item2</text>
  </g>
  <text x="482" y="428" font-family="monospace" font-size="9.5" fill="rgba(239,68,68,0.75)">⚠ item10 sorts before item2</text>
  <text x="482" y="444" font-size="8.5" fill="rgba(255,255,255,0.35)">(standard lexical sort, not "natural" numeric-aware)</text>

  <!-- Right panel: sort mode reference -->
  <rect x="820" y="218" width="300" height="240" rx="12" fill="rgba(255,255,255,0.025)" stroke="rgba(124,58,237,0.18)" stroke-width="1"/>
  <text x="970" y="242" text-anchor="middle" font-size="11" font-weight="700" fill="rgba(255,255,255,0.5)">6 Sort Modes Explained</text>

  <g font-size="9.5">
    <text x="836" y="266" fill="#a78bfa" font-weight="700">A → Z / Z → A</text>
    <text x="836" y="282" fill="rgba(255,255,255,0.5)">Alphabetical, case-insensitive</text>

    <text x="836" y="306" fill="#67e8f9" font-weight="700">By Length</text>
    <text x="836" y="322" fill="rgba(255,255,255,0.5)">Shortest to longest line</text>

    <text x="836" y="346" fill="#34d399" font-weight="700">Numeric</text>
    <text x="836" y="362" fill="rgba(255,255,255,0.5)">Treats lines as numbers</text>

    <text x="836" y="386" fill="#fbbf24" font-weight="700">Random (Shuffle)</text>
    <text x="836" y="402" fill="rgba(255,255,255,0.5)">Fisher-Yates randomization</text>

    <text x="836" y="426" fill="#f472b6" font-weight="700">Remove Duplicates</text>
    <text x="836" y="442" fill="rgba(255,255,255,0.5)">Toggle alongside any sort mode</text>
  </g>

  <!-- Bottom: stats and buttons -->
  <g text-anchor="middle" font-size="9.5">
    <rect x="80" y="478" width="220" height="46" rx="8" fill="rgba(124,58,237,0.1)" stroke="rgba(124,58,237,0.22)" stroke-width="1"/>
    <text x="190" y="500" font-size="14" font-weight="900" fill="#a78bfa">7 → 6 lines</text>
    <text x="190" y="516" fill="rgba(255,255,255,0.38)">1 duplicate removed</text>

    <rect x="316" y="478" width="504" height="46" rx="8" fill="rgba(14,116,144,0.08)" stroke="rgba(14,116,144,0.2)" stroke-width="1"/>
    <text x="568" y="500" font-size="12" font-weight="900" fill="#67e8f9">Case-insensitive alphabetical sort applied</text>
    <text x="568" y="516" fill="rgba(255,255,255,0.38)">Standard sort, not natural/numeric-aware</text>
  </g>

  <rect x="80" y="538" width="330" height="34" rx="9" fill="url(#bG)" filter="url(#sh)"/>
  <text x="245" y="560" text-anchor="middle" font-size="13" font-weight="900" fill="#fff">Copy Sorted List</text>
  <rect x="820" y="538" width="300" height="34" rx="9" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="970" y="560" text-anchor="middle" font-size="12" fill="rgba(255,255,255,0.35)">Reset / Clear</text>

  <rect x="48" y="650" width="1104" height="16" rx="5" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="460" y="664" width="280" height="10" rx="5" fill="rgba(255,255,255,0.025)"/>
</svg>
