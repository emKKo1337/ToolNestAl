<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="30%" cy="40%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <radialGradient id="gL" cx="15%" cy="50%" r="55%"><stop offset="0%" stop-color="#5b21b6" stop-opacity="0.45"/><stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/></radialGradient>
    <radialGradient id="gR" cx="85%" cy="50%" r="55%"><stop offset="0%" stop-color="#0e7490" stop-opacity="0.28"/><stop offset="100%" stop-color="#0e7490" stop-opacity="0"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="bG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient>
    <linearGradient id="lapG" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1a1040"/><stop offset="100%" stop-color="#0d0824"/></linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#5b21b6" flood-opacity="0.5"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="180" cy="315" rx="600" ry="500" fill="url(#gL)"/>
  <ellipse cx="1020" cy="315" rx="600" ry="500" fill="url(#gR)"/>

  <text x="60" y="70" font-size="14" font-weight="700" fill="url(#aG)" filter="url(#glow)">ToolNest AI</text>
  <text x="60" y="106" font-size="13" fill="rgba(255,255,255,0.35)">Text Tools › Remove Duplicate Lines</text>
  <text x="60" y="175" font-size="36" font-weight="900" fill="url(#aG)" filter="url(#glow)">Remove</text>
  <text x="60" y="218" font-size="36" font-weight="900" fill="url(#aG)" filter="url(#glow)">Duplicate Lines</text>
  <text x="60" y="266" font-size="18" fill="rgba(255,255,255,0.6)">Case-sensitive &amp; insensitive modes</text>
  <text x="60" y="294" font-size="18" fill="rgba(255,255,255,0.6)">Keep first/last occurrence — Free</text>

  <rect x="60" y="326" width="110" height="52" rx="8" fill="rgba(124,58,237,0.2)" stroke="rgba(124,58,237,0.4)" stroke-width="1"/>
  <text x="115" y="350" text-anchor="middle" font-size="14" font-weight="900" fill="#a78bfa">O(n)</text>
  <text x="115" y="368" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">hash-based algo</text>

  <rect x="182" y="326" width="110" height="52" rx="8" fill="rgba(14,116,144,0.15)" stroke="rgba(14,116,144,0.35)" stroke-width="1"/>
  <text x="237" y="350" text-anchor="middle" font-size="18" font-weight="900" fill="#67e8f9">Order</text>
  <text x="237" y="368" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">preserving</text>

  <rect x="304" y="326" width="110" height="52" rx="8" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
  <text x="359" y="350" text-anchor="middle" font-size="18" font-weight="900" fill="#34d399">Trim</text>
  <text x="359" y="368" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">whitespace option</text>

  <rect x="426" y="326" width="110" height="52" rx="8" fill="rgba(251,191,36,0.1)" stroke="rgba(251,191,36,0.25)" stroke-width="1"/>
  <text x="481" y="350" text-anchor="middle" font-size="20" font-weight="900" fill="#fbbf24">Free</text>
  <text x="481" y="368" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">no account</text>

  <text x="60" y="560" font-size="14" fill="rgba(255,255,255,0.25)">toolnestai.net/text-tools/remove-duplicate-lines</text>

  <rect x="630" y="60" width="530" height="490" rx="16" fill="url(#lapG)" stroke="rgba(124,58,237,0.3)" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="630" y="60" width="530" height="36" rx="16" fill="rgba(255,255,255,0.05)"/>
  <rect x="630" y="78" width="530" height="18" fill="rgba(255,255,255,0.02)"/>
  <circle cx="655" cy="78" r="6" fill="rgba(239,68,68,0.6)"/>
  <circle cx="675" cy="78" r="6" fill="rgba(251,191,36,0.6)"/>
  <circle cx="695" cy="78" r="6" fill="rgba(34,197,94,0.6)"/>

  <text x="648" y="122" font-size="8.5" font-weight="700" fill="rgba(255,255,255,0.3)">INPUT (8 lines)</text>
  <rect x="640" y="128" width="240" height="150" rx="7" fill="rgba(0,0,0,0.4)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="654" y="148" font-family="monospace" font-size="10.5" fill="rgba(255,255,255,0.6)">alice@email.com</text>
  <text x="654" y="168" font-family="monospace" font-size="10.5" fill="rgba(255,255,255,0.6)">bob@email.com</text>
  <text x="654" y="188" font-family="monospace" font-size="10.5" fill="rgba(239,68,68,0.7)">alice@email.com</text>
  <text x="654" y="208" font-family="monospace" font-size="10.5" fill="rgba(255,255,255,0.6)">carol@email.com</text>
  <text x="654" y="228" font-family="monospace" font-size="10.5" fill="rgba(239,68,68,0.7)">Bob@email.com</text>
  <text x="654" y="248" font-family="monospace" font-size="10.5" fill="rgba(255,255,255,0.6)">dave@email.com</text>
  <text x="654" y="268" font-family="monospace" font-size="10.5" fill="rgba(239,68,68,0.7)">carol@email.com</text>

  <text x="906" y="122" font-size="8.5" font-weight="700" fill="rgba(52,211,153,0.75)">OUTPUT (5 unique)</text>
  <rect x="898" y="128" width="240" height="150" rx="7" fill="rgba(52,211,153,0.08)" stroke="rgba(52,211,153,0.25)" stroke-width="1"/>
  <text x="912" y="148" font-family="monospace" font-size="10.5" fill="rgba(110,231,183,0.9)">alice@email.com</text>
  <text x="912" y="168" font-family="monospace" font-size="10.5" fill="rgba(110,231,183,0.9)">bob@email.com</text>
  <text x="912" y="188" font-family="monospace" font-size="10.5" fill="rgba(110,231,183,0.9)">carol@email.com</text>
  <text x="912" y="208" font-family="monospace" font-size="10.5" fill="rgba(110,231,183,0.9)">Bob@email.com</text>
  <text x="912" y="228" font-family="monospace" font-size="10.5" fill="rgba(110,231,183,0.9)">dave@email.com</text>
  <text x="912" y="256" font-family="monospace" font-size="8.5" fill="rgba(251,191,36,0.7)">⚠ "Bob" ≠ "bob" (case-sensitive)</text>

  <g text-anchor="middle" font-size="9">
    <rect x="640" y="292" width="163" height="42" rx="7" fill="rgba(124,58,237,0.1)" stroke="rgba(124,58,237,0.22)" stroke-width="1"/>
    <text x="721" y="314" font-size="14" font-weight="900" fill="#a78bfa">8 → 5</text>
    <text x="721" y="328" fill="rgba(255,255,255,0.4)">lines (3 duplicates removed)</text>

    <rect x="813" y="292" width="333" height="42" rx="7" fill="rgba(14,116,144,0.08)" stroke="rgba(14,116,144,0.2)" stroke-width="1"/>
    <text x="979" y="314" font-size="12" font-weight="900" fill="#67e8f9">First occurrence kept, order preserved</text>
    <text x="979" y="328" fill="rgba(255,255,255,0.4)">for each unique line</text>
  </g>

  <rect x="620" y="550" width="560" height="14" rx="4" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="760" y="562" width="260" height="8" rx="4" fill="rgba(255,255,255,0.03)"/>
