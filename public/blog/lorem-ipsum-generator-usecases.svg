<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <radialGradient id="gC" cx="50%" cy="40%" r="60%"><stop offset="0%" stop-color="#0e7490" stop-opacity="0.2"/><stop offset="100%" stop-color="#0e7490" stop-opacity="0"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
  </defs>
  <rect width="900" height="460" fill="url(#bg)"/>
  <ellipse cx="450" cy="230" rx="520" ry="320" fill="url(#gC)"/>

  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="900" fill="url(#aG)">Lorem Ipsum vs Modern Alternatives</text>
  <text x="450" y="54" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.38)">When to use classic Latin placeholder text vs newer alternatives</text>

  <!-- Classic Lorem Ipsum -->
  <rect x="28" y="70" width="270" height="150" rx="10" fill="rgba(167,139,250,0.08)" stroke="rgba(167,139,250,0.2)" stroke-width="1"/>
  <text x="44" y="94" font-size="11" font-weight="700" fill="#a78bfa">Classic Lorem Ipsum</text>
  <text x="44" y="116" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.5)">"Lorem ipsum dolor sit</text>
  <text x="44" y="130" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.5)">amet, consectetur..."</text>
  <text x="44" y="154" font-size="9" fill="rgba(52,211,153,0.8)">✓ Universally recognized</text>
  <text x="44" y="170" font-size="9" fill="rgba(52,211,153,0.8)">✓ Realistic word/letter distribution</text>
  <text x="44" y="186" font-size="9" fill="rgba(239,68,68,0.75)">✗ Can feel dated or generic</text>
  <text x="44" y="204" font-size="8.5" fill="rgba(255,255,255,0.3)">Best for: professional client work</text>

  <!-- Themed placeholder -->
  <rect x="314" y="70" width="270" height="150" rx="10" fill="rgba(103,232,249,0.08)" stroke="rgba(103,232,249,0.2)" stroke-width="1"/>
  <text x="330" y="94" font-size="11" font-weight="700" fill="#67e8f9">Themed Placeholder Text</text>
  <text x="330" y="116" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.5)">"Bacon ipsum dolor..."</text>
  <text x="330" y="130" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.5)">"Cupcake ipsum..."</text>
  <text x="330" y="154" font-size="9" fill="rgba(52,211,153,0.8)">✓ Fun, memorable in demos</text>
  <text x="330" y="170" font-size="9" fill="rgba(52,211,153,0.8)">✓ Breaks up client meeting tedium</text>
  <text x="330" y="186" font-size="9" fill="rgba(239,68,68,0.75)">✗ Unprofessional for formal contexts</text>
  <text x="330" y="204" font-size="8.5" fill="rgba(255,255,255,0.3)">Best for: internal prototypes, fun demos</text>

  <!-- Realistic sample content -->
  <rect x="600" y="70" width="272" height="150" rx="10" fill="rgba(52,211,153,0.07)" stroke="rgba(52,211,153,0.2)" stroke-width="1"/>
  <text x="616" y="94" font-size="11" font-weight="700" fill="#34d399">Realistic Sample Content</text>
  <text x="616" y="116" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.5)">Actual product copy,</text>
  <text x="616" y="130" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.5)">real customer names</text>
  <text x="616" y="154" font-size="9" fill="rgba(52,211,153,0.8)">✓ Most accurate for final review</text>
  <text x="616" y="170" font-size="9" fill="rgba(52,211,153,0.8)">✓ Catches real content-length issues</text>
  <text x="616" y="186" font-size="9" fill="rgba(239,68,68,0.75)">✗ Slower to produce, may not exist yet</text>
  <text x="616" y="204" font-size="8.5" fill="rgba(255,255,255,0.3)">Best for: final QA before launch</text>

  <!-- When to use Lorem Ipsum -->
  <rect x="28" y="236" width="844" height="90" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(124,58,237,0.15)" stroke-width="1"/>
  <text x="450" y="258" text-anchor="middle" font-size="10.5" font-weight="700" fill="rgba(167,139,250,0.85)">WHEN CLASSIC LOREM IPSUM IS STILL THE RIGHT CHOICE</text>
  <text x="450" y="280" text-anchor="middle" font-size="9.5" fill="rgba(255,255,255,0.55)">Early-stage wireframes and mockups, professional client presentations, design system documentation,</text>
  <text x="450" y="298" text-anchor="middle" font-size="9.5" fill="rgba(255,255,255,0.55)">and any context where the placeholder itself should be unmistakably "not real content" —</text>
  <text x="450" y="314" text-anchor="middle" font-size="9.5" fill="rgba(255,255,255,0.55)">avoiding any risk that a client or stakeholder mistakes it for actual approved copy.</text>

  <!-- Ship checklist -->
  <rect x="28" y="336" width="844" height="88" rx="8" fill="rgba(239,68,68,0.05)" stroke="rgba(239,68,68,0.16)" stroke-width="1"/>
  <text x="450" y="358" text-anchor="middle" font-size="10.5" font-weight="700" fill="rgba(239,68,68,0.8)">⚠ THE #1 PLACEHOLDER TEXT MISTAKE</text>
  <text x="450" y="380" text-anchor="middle" font-size="9.5" fill="rgba(255,255,255,0.55)">Shipping placeholder text to production. This has happened to real companies — Lorem Ipsum</text>
  <text x="450" y="398" text-anchor="middle" font-size="9.5" fill="rgba(255,255,255,0.55)">spotted live on a public website is a memorable, embarrassing mistake. Always add a final content</text>
  <text x="450" y="414" text-anchor="middle" font-size="9.5" fill="rgba(255,255,255,0.55)">audit step before launch, specifically searching for "lorem ipsum" across the codebase.</text>

  <text x="450" y="446" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.2)">toolnestai.net/text-tools/lorem-ipsum-generator</text>
</svg>
