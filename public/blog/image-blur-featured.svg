<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="30%" cy="40%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <radialGradient id="gL" cx="15%" cy="50%" r="55%"><stop offset="0%" stop-color="#5b21b6" stop-opacity="0.45"/><stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/></radialGradient>
    <radialGradient id="gR" cx="85%" cy="50%" r="55%"><stop offset="0%" stop-color="#0e7490" stop-opacity="0.28"/><stop offset="100%" stop-color="#0e7490" stop-opacity="0"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="bG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient>
    <linearGradient id="lapG" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1a1040"/><stop offset="100%" stop-color="#0d0824"/></linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#5b21b6" flood-opacity="0.5"/></filter>
    <filter id="blur5"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="blur10"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="180" cy="315" rx="600" ry="500" fill="url(#gL)"/>
  <ellipse cx="1020" cy="315" rx="600" ry="500" fill="url(#gR)"/>
  <text x="60" y="70" font-size="14" font-weight="700" fill="url(#aG)" filter="url(#glow)">ToolNest AI</text>
  <text x="60" y="106" font-size="13" fill="rgba(255,255,255,0.35)">Image Tools - Image Blur</text>
  <text x="60" y="185" font-size="46" font-weight="900" fill="url(#aG)" filter="url(#glow)">Image</text>
  <text x="60" y="245" font-size="46" font-weight="900" fill="url(#aG)" filter="url(#glow)">Blur</text>
  <text x="60" y="300" font-size="18" fill="rgba(255,255,255,0.6)">Gaussian, motion, radial blur</text>
  <text x="60" y="328" font-size="18" fill="rgba(255,255,255,0.6)">free, private, instant</text>
  <g>
    <rect x="60" y="358" width="115" height="52" rx="8" fill="rgba(124,58,237,0.2)" stroke="rgba(124,58,237,0.4)" stroke-width="1"/>
    <text x="117" y="382" text-anchor="middle" font-size="11" font-weight="900" fill="#a78bfa">Gaussian</text>
    <text x="117" y="400" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">adjustable radius</text>
    <rect x="185" y="358" width="115" height="52" rx="8" fill="rgba(14,116,144,0.15)" stroke="rgba(14,116,144,0.35)" stroke-width="1"/>
    <text x="242" y="382" text-anchor="middle" font-size="11" font-weight="900" fill="#67e8f9">Motion</text>
    <text x="242" y="400" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">directional streak</text>
    <rect x="310" y="358" width="115" height="52" rx="8" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
    <text x="367" y="382" text-anchor="middle" font-size="11" font-weight="900" fill="#34d399">Radial</text>
    <text x="367" y="400" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">zoom / spin</text>
    <rect x="435" y="358" width="95" height="52" rx="8" fill="rgba(251,191,36,0.1)" stroke="rgba(251,191,36,0.25)" stroke-width="1"/>
    <text x="482" y="382" text-anchor="middle" font-size="11" font-weight="900" fill="#fbbf24">Private</text>
    <text x="482" y="400" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">no upload</text>
  </g>
  <text x="60" y="560" font-size="14" fill="rgba(255,255,255,0.25)">toolnestai.net/image-tools/image-blur</text>
  <!-- Laptop UI -->
  <rect x="630" y="60" width="530" height="490" rx="16" fill="url(#lapG)" stroke="rgba(124,58,237,0.3)" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="630" y="60" width="530" height="36" rx="16" fill="rgba(255,255,255,0.05)"/>
  <rect x="630" y="78" width="530" height="18" fill="rgba(255,255,255,0.02)"/>
  <circle cx="655" cy="78" r="6" fill="rgba(239,68,68,0.6)"/>
  <circle cx="675" cy="78" r="6" fill="rgba(251,191,36,0.6)"/>
  <circle cx="695" cy="78" r="6" fill="rgba(34,197,94,0.6)"/>
  <!-- before / after image panels -->
  <rect x="648" y="108" width="232" height="180" rx="8" fill="rgba(167,139,250,0.1)" stroke="rgba(167,139,250,0.2)" stroke-width="1"/>
  <text x="764" y="130" text-anchor="middle" font-size="9" fill="rgba(167,139,250,0.5)">Original</text>
  <!-- simulate sharp image with grid pattern -->
  <g opacity="0.5">
    <rect x="656" y="140" width="216" height="136" fill="rgba(167,139,250,0.08)"/>
    <line x1="656" y1="173" x2="872" y2="173" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <line x1="656" y1="207" x2="872" y2="207" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <line x1="656" y1="241" x2="872" y2="241" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <line x1="720" y1="140" x2="720" y2="276" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <line x1="800" y1="140" x2="800" y2="276" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  </g>
  <rect x="892" y="108" width="232" height="180" rx="8" fill="rgba(103,232,249,0.06)" stroke="rgba(103,232,249,0.2)" stroke-width="1"/>
  <text x="1008" y="130" text-anchor="middle" font-size="9" fill="rgba(103,232,249,0.5)">Blurred (radius 8)</text>
  <!-- simulate blurred image -->
  <rect x="900" y="140" width="216" height="136" fill="rgba(103,232,249,0.04)" filter="url(#blur5)"/>
  <ellipse cx="1008" cy="208" rx="60" ry="40" fill="rgba(103,232,249,0.06)" filter="url(#blur10)"/>
  <!-- Controls -->
  <text x="648" y="316" font-size="9" fill="rgba(255,255,255,0.3)">Blur Type</text>
  <g font-size="9" text-anchor="middle">
    <rect x="648" y="322" width="72" height="24" rx="5" fill="url(#bG)"/>
    <text x="684" y="338" fill="#fff" font-weight="700">Gaussian</text>
    <rect x="726" y="322" width="72" height="24" rx="5" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    <text x="762" y="338" fill="rgba(255,255,255,0.4)">Motion</text>
    <rect x="804" y="322" width="72" height="24" rx="5" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    <text x="840" y="338" fill="rgba(255,255,255,0.4)">Radial</text>
    <rect x="882" y="322" width="72" height="24" rx="5" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    <text x="918" y="338" fill="rgba(255,255,255,0.4)">Box</text>
  </g>
  <text x="648" y="368" font-size="9" fill="rgba(255,255,255,0.3)">Radius: 8px</text>
  <rect x="648" y="374" width="500" height="6" rx="3" fill="rgba(255,255,255,0.06)"/>
  <rect x="648" y="374" width="200" height="6" rx="3" fill="url(#aG)"/>
  <circle cx="848" cy="377" r="8" fill="#fff" stroke="rgba(124,58,237,0.6)" stroke-width="2"/>
  <rect x="648" y="416" width="246" height="38" rx="8" fill="url(#bG)" filter="url(#sh)"/>
  <text x="771" y="439" text-anchor="middle" font-size="12" font-weight="900" fill="#fff">Download Blurred Image</text>
  <rect x="906" y="416" width="242" height="38" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="1027" y="439" text-anchor="middle" font-size="12" font-weight="700" fill="rgba(255,255,255,0.5)">Reset</text>
  <rect x="620" y="550" width="560" height="14" rx="4" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
</svg>
