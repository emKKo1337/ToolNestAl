<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="30%" cy="40%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <radialGradient id="gL" cx="15%" cy="50%" r="55%"><stop offset="0%" stop-color="#5b21b6" stop-opacity="0.4"/><stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/></radialGradient>
    <radialGradient id="gR" cx="85%" cy="50%" r="55%"><stop offset="0%" stop-color="#0f766e" stop-opacity="0.25"/><stop offset="100%" stop-color="#0f766e" stop-opacity="0"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="bG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient>
    <linearGradient id="lapG" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1a1040"/><stop offset="100%" stop-color="#0d0824"/></linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#5b21b6" flood-opacity="0.45"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="180" cy="315" rx="600" ry="500" fill="url(#gL)"/>
  <ellipse cx="1020" cy="315" rx="600" ry="500" fill="url(#gR)"/>

  <!-- Left -->
  <text x="60" y="70" font-size="14" font-weight="700" fill="url(#aG)" filter="url(#glow)">ToolNest AI</text>
  <text x="60" y="106" font-size="13" fill="rgba(255,255,255,0.35)">Security Tools › Password Generator</text>
  <text x="60" y="178" font-size="52" font-weight="900" fill="url(#aG)" filter="url(#glow)">Password</text>
  <text x="60" y="238" font-size="52" font-weight="900" fill="url(#aG)" filter="url(#glow)">Generator</text>
  <text x="60" y="293" font-size="18" fill="rgba(255,255,255,0.6)">Generate strong, random passwords</text>
  <text x="60" y="321" font-size="18" fill="rgba(255,255,255,0.6)">instantly — secure, free, no sign-up</text>

  <!-- Pills -->
  <rect x="60" y="355" width="130" height="28" rx="14" fill="rgba(124,58,237,0.25)" stroke="rgba(124,58,237,0.5)" stroke-width="1"/>
  <text x="125" y="373" text-anchor="middle" font-size="11" fill="rgba(167,139,250,0.9)">Custom Length</text>
  <rect x="202" y="355" width="126" height="28" rx="14" fill="rgba(15,118,110,0.2)" stroke="rgba(15,118,110,0.4)" stroke-width="1"/>
  <text x="265" y="373" text-anchor="middle" font-size="11" fill="rgba(94,234,212,0.9)">Symbols &amp; Digits</text>
  <rect x="340" y="355" width="110" height="28" rx="14" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.35)" stroke-width="1"/>
  <text x="395" y="373" text-anchor="middle" font-size="11" fill="rgba(52,211,153,0.9)">Strength Meter</text>
  <rect x="60" y="395" width="130" height="28" rx="14" fill="rgba(251,191,36,0.12)" stroke="rgba(251,191,36,0.3)" stroke-width="1"/>
  <text x="125" y="413" text-anchor="middle" font-size="11" fill="rgba(251,191,36,0.9)">Bulk Generate</text>
  <rect x="202" y="395" width="130" height="28" rx="14" fill="rgba(124,58,237,0.2)" stroke="rgba(124,58,237,0.4)" stroke-width="1"/>
  <text x="267" y="413" text-anchor="middle" font-size="11" fill="rgba(167,139,250,0.9)">Copy Instantly</text>

  <text x="60" y="560" font-size="14" fill="rgba(255,255,255,0.25)">toolnestai.net/security-tools/password-generator</text>

  <!-- Right — tool mockup -->
  <rect x="620" y="55" width="540" height="490" rx="16" fill="url(#lapG)" stroke="rgba(124,58,237,0.3)" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="620" y="55" width="540" height="36" rx="16" fill="rgba(255,255,255,0.05)"/>
  <rect x="620" y="73" width="540" height="18" fill="rgba(255,255,255,0.02)"/>
  <circle cx="645" cy="73" r="6" fill="rgba(239,68,68,0.6)"/>
  <circle cx="665" cy="73" r="6" fill="rgba(251,191,36,0.6)"/>
  <circle cx="685" cy="73" r="6" fill="rgba(34,197,94,0.6)"/>
  <rect x="710" y="64" width="370" height="18" rx="9" fill="rgba(255,255,255,0.06)"/>
  <text x="895" y="76" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.3)">toolnestai.net/security-tools/password-generator</text>

  <!-- Generated password display -->
  <rect x="632" y="100" width="516" height="58" rx="10" fill="rgba(0,0,0,0.4)" stroke="rgba(124,58,237,0.4)" stroke-width="1.5"/>
  <text x="890" y="126" text-anchor="middle" font-family="monospace" font-size="18" font-weight="700" letter-spacing="3" fill="rgba(255,255,255,0.9)">Xk#9mP@vL2$nQr7!</text>
  <text x="890" y="146" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.3)">16 characters — click to regenerate</text>

  <!-- Strength meter -->
  <rect x="632" y="168" width="516" height="36" rx="8" fill="rgba(255,255,255,0.02)"/>
  <text x="648" y="182" font-size="8" font-weight="700" fill="rgba(255,255,255,0.4)">STRENGTH</text>
  <text x="1140" y="182" text-anchor="end" font-size="8" font-weight="700" fill="rgba(52,211,153,0.9)">Very Strong</text>
  <rect x="648" y="188" width="488" height="8" rx="4" fill="rgba(255,255,255,0.06)"/>
  <rect x="648" y="188" width="440" height="8" rx="4" fill="rgba(52,211,153,0.6)"/>

  <!-- Length slider -->
  <rect x="632" y="214" width="516" height="46" rx="8" fill="rgba(255,255,255,0.025)"/>
  <text x="648" y="230" font-size="8" font-weight="700" fill="rgba(255,255,255,0.4)">LENGTH</text>
  <text x="1140" y="230" text-anchor="end" font-size="9" font-weight="700" fill="rgba(167,139,250,0.8)">16</text>
  <rect x="648" y="236" width="480" height="6" rx="3" fill="rgba(255,255,255,0.08)"/>
  <rect x="648" y="236" width="250" height="6" rx="3" fill="url(#bG)"/>
  <circle cx="898" cy="239" r="8" fill="#a78bfa" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <text x="648" y="254" font-size="7.5" fill="rgba(255,255,255,0.25)">8</text>
  <text x="1128" y="254" text-anchor="end" font-size="7.5" fill="rgba(255,255,255,0.25)">128</text>

  <!-- Checkboxes -->
  <text x="648" y="276" font-size="8" font-weight="700" fill="rgba(255,255,255,0.4)" letter-spacing="1">INCLUDE</text>
  <g font-size="9">
    <!-- Uppercase -->
    <rect x="648" y="284" width="234" height="26" rx="6" fill="rgba(124,58,237,0.1)" stroke="rgba(124,58,237,0.2)" stroke-width="1"/>
    <rect x="656" y="291" width="12" height="12" rx="3" fill="rgba(124,58,237,0.5)" stroke="rgba(124,58,237,0.8)" stroke-width="1"/>
    <text x="664" y="300" text-anchor="middle" font-size="8" fill="#a78bfa">✓</text>
    <text x="676" y="300" fill="rgba(255,255,255,0.7)">Uppercase (A–Z)</text>
    <!-- Lowercase -->
    <rect x="898" y="284" width="242" height="26" rx="6" fill="rgba(124,58,237,0.1)" stroke="rgba(124,58,237,0.2)" stroke-width="1"/>
    <rect x="906" y="291" width="12" height="12" rx="3" fill="rgba(124,58,237,0.5)" stroke="rgba(124,58,237,0.8)" stroke-width="1"/>
    <text x="914" y="300" text-anchor="middle" font-size="8" fill="#a78bfa">✓</text>
    <text x="926" y="300" fill="rgba(255,255,255,0.7)">Lowercase (a–z)</text>

    <!-- Numbers -->
    <rect x="648" y="316" width="234" height="26" rx="6" fill="rgba(251,191,36,0.08)" stroke="rgba(251,191,36,0.18)" stroke-width="1"/>
    <rect x="656" y="323" width="12" height="12" rx="3" fill="rgba(251,191,36,0.4)" stroke="rgba(251,191,36,0.7)" stroke-width="1"/>
    <text x="664" y="332" text-anchor="middle" font-size="8" fill="#fbbf24">✓</text>
    <text x="676" y="332" fill="rgba(255,255,255,0.7)">Numbers (0–9)</text>
    <!-- Symbols -->
    <rect x="898" y="316" width="242" height="26" rx="6" fill="rgba(52,211,153,0.08)" stroke="rgba(52,211,153,0.2)" stroke-width="1"/>
    <rect x="906" y="323" width="12" height="12" rx="3" fill="rgba(52,211,153,0.35)" stroke="rgba(52,211,153,0.65)" stroke-width="1"/>
    <text x="914" y="332" text-anchor="middle" font-size="8" fill="#34d399">✓</text>
    <text x="926" y="332" fill="rgba(255,255,255,0.7)">Symbols (!@#$%^&amp;*)</text>
  </g>

  <!-- Exclude ambiguous -->
  <rect x="648" y="350" width="516" height="24" rx="5" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="656" y="357" width="12" height="12" rx="3" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <text x="676" y="367" font-size="8.5" fill="rgba(255,255,255,0.45)">Exclude ambiguous characters (0, O, l, I, 1)</text>

  <!-- Generate button -->
  <rect x="648" y="384" width="492" height="34" rx="10" fill="url(#bG)" filter="url(#sh)"/>
  <text x="894" y="405" text-anchor="middle" font-size="12" font-weight="900" fill="#fff">↻  Generate New Password</text>

  <!-- Copy button -->
  <rect x="648" y="428" width="492" height="28" rx="8" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
  <text x="894" y="446" text-anchor="middle" font-size="10" font-weight="700" fill="rgba(52,211,153,0.9)">⎘  Copy to Clipboard</text>

  <!-- Bulk section -->
  <text x="648" y="472" font-size="9" font-weight="700" fill="rgba(255,255,255,0.3)" letter-spacing="1">BULK GENERATE</text>
  <rect x="648" y="478" width="492" height="50" rx="8" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <g font-family="monospace" font-size="8" fill="rgba(255,255,255,0.4)">
    <text x="660" y="494">Nm!8vX#pKq@2Yz$w</text>
    <text x="660" y="508">R7&amp;eLs#4Jt@mW9nA</text>
    <text x="660" y="522">qP#3uZk!Xv@8LmN$</text>
  </g>

  <!-- Laptop base -->
  <rect x="610" y="545" width="560" height="14" rx="4" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="760" y="556" width="260" height="8" rx="4" fill="rgba(255,255,255,0.03)"/>
</svg>
