<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="PDF compression levels comparison chart">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0f0825"/>
      <stop offset="100%" stop-color="#05030d"/>
    </radialGradient>
    <linearGradient id="bL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="bM" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="bH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4cd7f6"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="900" height="460" fill="url(#bg)"/>
  <ellipse cx="450" cy="230" rx="280" ry="160" fill="#5b21b6" opacity="0.05" filter="url(#glow)"/>

  <text x="450" y="38" font-family="sans-serif" font-size="16" font-weight="800" fill="#e2e2e2" text-anchor="middle">Compression Levels vs. Quality</text>
  <text x="450" y="56" font-family="sans-serif" font-size="10" fill="#7a6d84" text-anchor="middle">Typical size reduction on a 10 MB image-heavy PDF</text>

  <!-- Y axis -->
  <line x1="120" y1="80" x2="120" y2="360" stroke="#2a1f4a" stroke-width="1"/>
  <!-- X axis -->
  <line x1="120" y1="360" x2="860" y2="360" stroke="#2a1f4a" stroke-width="1"/>

  <!-- Y labels -->
  <text x="110" y="364" font-family="sans-serif" font-size="8" fill="#3d3347" text-anchor="end">0</text>
  <text x="110" y="294" font-family="sans-serif" font-size="8" fill="#3d3347" text-anchor="end">20%</text>
  <text x="110" y="224" font-family="sans-serif" font-size="8" fill="#3d3347" text-anchor="end">40%</text>
  <text x="110" y="154" font-family="sans-serif" font-size="8" fill="#3d3347" text-anchor="end">60%</text>
  <text x="110" y="84" font-family="sans-serif" font-size="8" fill="#3d3347" text-anchor="end">80%</text>
  <!-- Grid -->
  <line x1="120" y1="294" x2="860" y2="294" stroke="#1a1040" stroke-width="1"/>
  <line x1="120" y1="224" x2="860" y2="224" stroke="#1a1040" stroke-width="1"/>
  <line x1="120" y1="154" x2="860" y2="154" stroke="#1a1040" stroke-width="1"/>
  <line x1="120" y1="84" x2="860" y2="84" stroke="#1a1040" stroke-width="1"/>

  <!-- Bar groups: screen-optimized, low, medium, high, maximum -->
  <!-- Screen optimized: ~10% -->
  <rect x="148" y="325" width="90" height="35" rx="4" fill="url(#bL)" opacity="0.4"/>
  <text x="193" y="320" font-family="sans-serif" font-size="9" font-weight="700" fill="#7a6d84" text-anchor="middle">~10%</text>
  <text x="193" y="378" font-family="sans-serif" font-size="8" fill="#7a6d84" text-anchor="middle">Screen</text>
  <text x="193" y="390" font-family="sans-serif" font-size="8" fill="#7a6d84" text-anchor="middle">preview</text>

  <!-- Low: ~20% -->
  <rect x="270" y="290" width="90" height="70" rx="4" fill="url(#bL)" opacity="0.6"/>
  <text x="315" y="285" font-family="sans-serif" font-size="9" font-weight="700" fill="#a78bfa" text-anchor="middle">~20%</text>
  <text x="315" y="378" font-family="sans-serif" font-size="8" fill="#9b8da8" text-anchor="middle">Low</text>
  <text x="315" y="390" font-family="sans-serif" font-size="8" fill="#7a6d84" text-anchor="middle">quality loss</text>

  <!-- Medium: ~40% -->
  <rect x="392" y="220" width="90" height="140" rx="4" fill="url(#bM)"/>
  <text x="437" y="215" font-family="sans-serif" font-size="9" font-weight="700" fill="#a78bfa" text-anchor="middle">~40%</text>
  <text x="437" y="378" font-family="sans-serif" font-size="8" fill="#e2e2e2" text-anchor="middle">Medium</text>
  <text x="437" y="390" font-family="sans-serif" font-size="8" fill="#a78bfa" text-anchor="middle">Recommended</text>
  <!-- star -->
  <text x="437" y="403" font-family="sans-serif" font-size="8" fill="#febc2e" text-anchor="middle">★ Best balance</text>

  <!-- High: ~60% -->
  <rect x="514" y="150" width="90" height="210" rx="4" fill="url(#bH)" opacity="0.8"/>
  <text x="559" y="145" font-family="sans-serif" font-size="9" font-weight="700" fill="#60a5fa" text-anchor="middle">~60%</text>
  <text x="559" y="378" font-family="sans-serif" font-size="8" fill="#9b8da8" text-anchor="middle">High</text>
  <text x="559" y="390" font-family="sans-serif" font-size="8" fill="#7a6d84" text-anchor="middle">visible loss</text>

  <!-- Maximum: ~75% -->
  <rect x="636" y="97" width="90" height="263" rx="4" fill="url(#bH)"/>
  <text x="681" y="92" font-family="sans-serif" font-size="9" font-weight="700" fill="#4cd7f6" text-anchor="middle">~75%</text>
  <text x="681" y="378" font-family="sans-serif" font-size="8" fill="#9b8da8" text-anchor="middle">Maximum</text>
  <text x="681" y="390" font-family="sans-serif" font-size="8" fill="#7a6d84" text-anchor="middle">heavy quality loss</text>

  <!-- Legend box -->
  <rect x="148" y="408" width="580" height="40" rx="8" fill="#110c2a"/>
  <text x="164" y="424" font-family="sans-serif" font-size="8" fill="#7a6d84">💡 Medium (40%) is ideal for most documents — readable images, no visible artifacts, significantly smaller file</text>
  <text x="164" y="440" font-family="sans-serif" font-size="8" fill="#7a6d84">Use Maximum only for archival reduction where quality can be sacrificed (scanned forms, internal drafts)</text>
</svg>
