<svg viewBox="0 0 900 540" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%"><stop offset="0%" stop-color="#0f0825"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <linearGradient id="lapG" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#1a1040"/><stop offset="100%" stop-color="#0d0824"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="900" height="540" fill="url(#bg)"/>
  <ellipse cx="450" cy="270" rx="280" ry="150" fill="#0e7490" opacity="0.07" filter="url(#glow)"/>
  <rect x="120" y="48" width="660" height="410" rx="14" fill="url(#lapG)" stroke="#2a1f4a" stroke-width="1.5"/>
  <rect x="120" y="48" width="660" height="38" rx="14" fill="#1a1040"/>
  <rect x="120" y="72" width="660" height="14" fill="#1a1040"/>
  <circle cx="655" cy="67" r="7" fill="#ff5f57"/><circle cx="675" cy="67" r="7" fill="#febc2e"/><circle cx="695" cy="67" r="7" fill="#28c840"/>
  <rect x="200" y="56" width="440" height="20" rx="10" fill="#110c2a"/>
  <text x="420" y="70" font-family="monospace" font-size="9" fill="#4d4354" text-anchor="middle">toolnestai.net/pdf-tools/ocr-pdf</text>
  <rect x="136" y="94" width="628" height="352" rx="6" fill="#0c0920"/>
  <text x="450" y="118" font-family="sans-serif" font-size="13" font-weight="700" fill="#e2e2e2" text-anchor="middle">OCR PDF</text>
  <text x="450" y="134" font-family="sans-serif" font-size="8" fill="#7a6d84" text-anchor="middle">Make scanned PDFs searchable and copyable with text recognition</text>
  <!-- Before/after layout -->
  <!-- Before: image-only PDF -->
  <rect x="148" y="148" width="280" height="220" rx="8" fill="#110c2a" stroke="#2a1f4a" stroke-width="1"/>
  <text x="288" y="168" font-family="sans-serif" font-size="8" font-weight="700" fill="#4d4354" text-anchor="middle">BEFORE: Scanned PDF</text>
  <rect x="164" y="176" width="248" height="180" rx="4" fill="#1a1040"/>
  <!-- Scanned page: gray blocks simulating text -->
  <rect x="176" y="188" width="180" height="10" rx="2" fill="#2a1f4a"/>
  <rect x="176" y="202" width="160" height="8" rx="2" fill="#2a1f4a"/>
  <rect x="176" y="214" width="175" height="8" rx="2" fill="#2a1f4a"/>
  <rect x="176" y="228" width="155" height="8" rx="2" fill="#2a1f4a"/>
  <rect x="176" y="244" width="170" height="8" rx="2" fill="#2a1f4a"/>
  <text x="288" y="326" font-family="sans-serif" font-size="8" fill="#ff453a" text-anchor="middle">🔍 Text not searchable</text>
  <text x="288" y="340" font-family="sans-serif" font-size="8" fill="#ff453a" text-anchor="middle">📋 Cannot copy text</text>
  <!-- Arrow -->
  <text x="440" y="268" font-family="sans-serif" font-size="24" fill="#a78bfa" text-anchor="middle">→</text>
  <text x="440" y="290" font-family="sans-serif" font-size="8" fill="#a78bfa" text-anchor="middle">OCR</text>
  <!-- After: searchable PDF -->
  <rect x="476" y="148" width="280" height="220" rx="8" fill="#110c2a" stroke="#34d399" stroke-width="1"/>
  <text x="616" y="168" font-family="sans-serif" font-size="8" font-weight="700" fill="#34d399" text-anchor="middle">AFTER: Searchable PDF</text>
  <rect x="492" y="176" width="248" height="180" rx="4" fill="#1a1040"/>
  <!-- Searchable text: actual text -->
  <text x="504" y="200" font-family="sans-serif" font-size="7.5" fill="#cfc2d6">Annual Report 2025</text>
  <text x="504" y="215" font-family="sans-serif" font-size="7" fill="#9b8da8">Total revenue increased by 23%</text>
  <text x="504" y="228" font-family="sans-serif" font-size="7" fill="#9b8da8">year-over-year, driven by strong</text>
  <text x="504" y="241" font-family="sans-serif" font-size="7" fill="#9b8da8">performance in Q3 and Q4.</text>
  <!-- Highlight over matching text -->
  <rect x="504" y="230" width="56" height="10" rx="2" fill="#febc2e" opacity="0.3"/>
  <text x="532" y="239" font-family="sans-serif" font-size="7" fill="#febc2e">strong</text>
  <text x="616" y="326" font-family="sans-serif" font-size="8" fill="#34d399" text-anchor="middle">🔍 Searchable</text>
  <text x="616" y="340" font-family="sans-serif" font-size="8" fill="#34d399" text-anchor="middle">📋 Selectable text</text>
  <!-- Run OCR button -->
  <rect x="148" y="386" width="200" height="36" rx="10" fill="#0e7490"/>
  <text x="248" y="409" font-family="sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">Run OCR</text>
  <rect x="340" y="458" width="220" height="10" rx="5" fill="#1a1040"/>
  <rect x="280" y="466" width="340" height="8" rx="4" fill="#140e34"/>
</svg>
