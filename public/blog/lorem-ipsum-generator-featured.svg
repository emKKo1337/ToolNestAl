<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="30%" cy="40%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <radialGradient id="gL" cx="15%" cy="50%" r="55%"><stop offset="0%" stop-color="#5b21b6" stop-opacity="0.45"/><stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/></radialGradient>
    <radialGradient id="gR" cx="85%" cy="50%" r="55%"><stop offset="0%" stop-color="#0e7490" stop-opacity="0.28"/><stop offset="100%" stop-color="#0e7490" stop-opacity="0"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="bG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient>
    <linearGradient id="lapG" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1a1040"/><stop offset="100%" stop-color="#0d0824"/></linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#5b21b6" flood-opacity="0.5"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="180" cy="315" rx="600" ry="500" fill="url(#gL)"/>
  <ellipse cx="1020" cy="315" rx="600" ry="500" fill="url(#gR)"/>

  <text x="60" y="70" font-size="14" font-weight="700" fill="url(#aG)" filter="url(#glow)">ToolNest AI</text>
  <text x="60" y="106" font-size="13" fill="rgba(255,255,255,0.35)">Text Tools › Lorem Ipsum Generator</text>
  <text x="60" y="185" font-size="46" font-weight="900" fill="url(#aG)" filter="url(#glow)">Lorem Ipsum</text>
  <text x="60" y="245" font-size="46" font-weight="900" fill="url(#aG)" filter="url(#glow)">Generator</text>
  <text x="60" y="300" font-size="18" fill="rgba(255,255,255,0.6)">Paragraphs, sentences, words, lists</text>
  <text x="60" y="328" font-size="18" fill="rgba(255,255,255,0.6)">Classic &amp; modern variants — Free</text>

  <rect x="60" y="358" width="110" height="52" rx="8" fill="rgba(124,58,237,0.2)" stroke="rgba(124,58,237,0.4)" stroke-width="1"/>
  <text x="115" y="382" text-anchor="middle" font-size="14" font-weight="900" fill="#a78bfa">45 BC</text>
  <text x="115" y="400" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">Cicero's Latin</text>

  <rect x="182" y="358" width="110" height="52" rx="8" fill="rgba(14,116,144,0.15)" stroke="rgba(14,116,144,0.35)" stroke-width="1"/>
  <text x="237" y="382" text-anchor="middle" font-size="18" font-weight="900" fill="#67e8f9">4 modes</text>
  <text x="237" y="400" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">para/sent/word/list</text>

  <rect x="304" y="358" width="110" height="52" rx="8" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
  <text x="359" y="382" text-anchor="middle" font-size="16" font-weight="900" fill="#34d399">HTML</text>
  <text x="359" y="400" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">export ready</text>

  <rect x="426" y="358" width="110" height="52" rx="8" fill="rgba(251,191,36,0.1)" stroke="rgba(251,191,36,0.25)" stroke-width="1"/>
  <text x="481" y="382" text-anchor="middle" font-size="20" font-weight="900" fill="#fbbf24">Free</text>
  <text x="481" y="400" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">no account</text>

  <text x="60" y="560" font-size="14" fill="rgba(255,255,255,0.25)">toolnestai.net/text-tools/lorem-ipsum-generator</text>

  <!-- Right: Laptop with lorem ipsum UI -->
  <rect x="630" y="60" width="530" height="490" rx="16" fill="url(#lapG)" stroke="rgba(124,58,237,0.3)" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="630" y="60" width="530" height="36" rx="16" fill="rgba(255,255,255,0.05)"/>
  <rect x="630" y="78" width="530" height="18" fill="rgba(255,255,255,0.02)"/>
  <circle cx="655" cy="78" r="6" fill="rgba(239,68,68,0.6)"/>
  <circle cx="675" cy="78" r="6" fill="rgba(251,191,36,0.6)"/>
  <circle cx="695" cy="78" r="6" fill="rgba(34,197,94,0.6)"/>

  <!-- Mode tabs -->
  <g font-size="9" text-anchor="middle">
    <rect x="642" y="106" width="112" height="24" rx="6" fill="url(#bG)"/>
    <text x="698" y="122" fill="#fff" font-weight="700">Paragraphs</text>
    <rect x="760" y="106" width="90" height="24" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="805" y="122" fill="rgba(255,255,255,0.4)">Sentences</text>
    <rect x="856" y="106" width="70" height="24" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="891" y="122" fill="rgba(255,255,255,0.4)">Words</text>
    <rect x="932" y="106" width="60" height="24" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="962" y="122" fill="rgba(255,255,255,0.4)">Lists</text>
  </g>

  <!-- Controls -->
  <text x="650" y="152" font-size="8.5" fill="rgba(255,255,255,0.3)">Paragraphs:</text>
  <rect x="736" y="140" width="60" height="22" rx="5" fill="rgba(0,0,0,0.4)" stroke="rgba(124,58,237,0.3)" stroke-width="1"/>
  <text x="766" y="156" text-anchor="middle" font-size="10" fill="rgba(167,139,250,0.85)">3</text>
  <rect x="900" y="140" width="130" height="22" rx="5" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="965" y="156" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.4)">☐ Start with "Lorem ipsum"</text>

  <!-- Generated text preview -->
  <rect x="642" y="174" width="506" height="230" rx="9" fill="rgba(0,0,0,0.35)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="658" y="196" font-size="10.5" fill="rgba(255,255,255,0.6)">Lorem ipsum dolor sit amet, consectetur</text>
  <text x="658" y="214" font-size="10.5" fill="rgba(255,255,255,0.6)">adipiscing elit. Sed do eiusmod tempor</text>
  <text x="658" y="232" font-size="10.5" fill="rgba(255,255,255,0.6)">incididunt ut labore et dolore magna aliqua.</text>
  <text x="658" y="258" font-size="10.5" fill="rgba(255,255,255,0.6)">Ut enim ad minim veniam, quis nostrud</text>
  <text x="658" y="276" font-size="10.5" fill="rgba(255,255,255,0.6)">exercitation ullamco laboris nisi ut aliquip</text>
  <text x="658" y="294" font-size="10.5" fill="rgba(255,255,255,0.6)">ex ea commodo consequat.</text>
  <text x="658" y="320" font-size="10.5" fill="rgba(255,255,255,0.6)">Duis aute irure dolor in reprehenderit in</text>
  <text x="658" y="338" font-size="10.5" fill="rgba(255,255,255,0.6)">voluptate velit esse cillum dolore eu fugiat</text>
  <text x="658" y="356" font-size="10.5" fill="rgba(255,255,255,0.6)">nulla pariatur.</text>

  <!-- Stats -->
  <g text-anchor="middle" font-size="9">
    <rect x="642" y="414" width="120" height="42" rx="7" fill="rgba(124,58,237,0.1)" stroke="rgba(124,58,237,0.22)" stroke-width="1"/>
    <text x="702" y="436" font-size="14" font-weight="900" fill="#a78bfa">3</text>
    <text x="702" y="450" fill="rgba(255,255,255,0.4)">paragraphs</text>

    <rect x="770" y="414" width="120" height="42" rx="7" fill="rgba(14,116,144,0.08)" stroke="rgba(14,116,144,0.2)" stroke-width="1"/>
    <text x="830" y="436" font-size="14" font-weight="900" fill="#67e8f9">187</text>
    <text x="830" y="450" fill="rgba(255,255,255,0.4)">words</text>

    <rect x="898" y="414" width="122" height="42" rx="7" fill="rgba(16,185,129,0.07)" stroke="rgba(16,185,129,0.18)" stroke-width="1"/>
    <text x="959" y="436" font-size="12" font-weight="900" fill="#34d399">1,142</text>
    <text x="959" y="450" fill="rgba(255,255,255,0.4)">characters</text>
  </g>

  <!-- Buttons -->
  <rect x="642" y="466" width="244" height="30" rx="8" fill="url(#bG)" filter="url(#sh)"/>
  <text x="764" y="485" text-anchor="middle" font-size="12" font-weight="900" fill="#fff">Copy Text</text>
  <rect x="898" y="466" width="250" height="30" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="1023" y="485" text-anchor="middle" font-size="12" fill="rgba(255,255,255,0.35)">Copy as HTML &lt;p&gt;</text>

  <rect x="620" y="550" width="560" height="14" rx="4" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="760" y="562" width="260" height="8" rx="4" fill="rgba(255,255,255,0.03)"/>
</svg>
