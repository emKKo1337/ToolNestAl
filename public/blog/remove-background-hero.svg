<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="600" y="52" text-anchor="middle" font-size="24" font-weight="900" fill="url(#aG)">How AI Background Removal Works</text>
  <text x="600" y="74" text-anchor="middle" font-size="12" fill="rgba(255,255,255,0.38)">From pixel matrix to alpha mask — the process behind modern background removal</text>
  <!-- Step boxes -->
  <g font-size="9.5" text-anchor="middle">
    <rect x="40" y="100" width="190" height="460" rx="12" fill="rgba(167,139,250,0.06)" stroke="rgba(167,139,250,0.2)" stroke-width="1"/>
    <text x="135" y="128" font-size="11" font-weight="700" fill="rgba(167,139,250,0.85)">Step 1</text>
    <text x="135" y="148">Preprocessing</text>
    <rect x="60" y="162" width="150" height="100" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="135" y="192" fill="rgba(255,255,255,0.45)">Image resized to</text>
    <text x="135" y="212" fill="rgba(255,255,255,0.45)">model input size</text>
    <text x="135" y="232" fill="rgba(255,255,255,0.45)">(e.g. 320x320)</text>
    <text x="135" y="252" fill="rgba(255,255,255,0.3)" font-size="8.5">Pixel values normalized</text>
    <text x="135" y="292" fill="rgba(255,255,255,0.45)">Color space converted</text>
    <text x="135" y="312" fill="rgba(255,255,255,0.35)">to match training data</text>
    <text x="135" y="350" fill="rgba(255,255,255,0.4)">Tensor created from</text>
    <text x="135" y="370" fill="rgba(255,255,255,0.4)">pixel matrix</text>

    <rect x="250" y="100" width="190" height="460" rx="12" fill="rgba(103,232,249,0.06)" stroke="rgba(103,232,249,0.2)" stroke-width="1"/>
    <text x="345" y="128" font-size="11" font-weight="700" fill="rgba(103,232,249,0.85)">Step 2</text>
    <text x="345" y="148">Neural Network</text>
    <text x="345" y="192" fill="rgba(255,255,255,0.45)">U-Net / ISNet style</text>
    <text x="345" y="212" fill="rgba(255,255,255,0.45)">encoder-decoder</text>
    <text x="345" y="232" fill="rgba(255,255,255,0.45)">architecture</text>
    <text x="345" y="272" fill="rgba(255,255,255,0.45)">Encoder: extracts</text>
    <text x="345" y="292" fill="rgba(255,255,255,0.45)">features at multiple</text>
    <text x="345" y="312" fill="rgba(255,255,255,0.45)">scales (edges, context)</text>
    <text x="345" y="352" fill="rgba(255,255,255,0.45)">Decoder: reconstructs</text>
    <text x="345" y="372" fill="rgba(255,255,255,0.45)">segmentation mask</text>
    <text x="345" y="392" fill="rgba(255,255,255,0.45)">at full resolution</text>

    <rect x="460" y="100" width="190" height="460" rx="12" fill="rgba(52,211,153,0.06)" stroke="rgba(52,211,153,0.2)" stroke-width="1"/>
    <text x="555" y="128" font-size="11" font-weight="700" fill="rgba(52,211,153,0.85)">Step 3</text>
    <text x="555" y="148">Alpha Mask</text>
    <text x="555" y="192" fill="rgba(255,255,255,0.45)">Model outputs a mask</text>
    <text x="555" y="212" fill="rgba(255,255,255,0.45)">where each pixel has</text>
    <text x="555" y="232" fill="rgba(255,255,255,0.45)">a confidence 0-255</text>
    <text x="555" y="272" fill="rgba(255,255,255,0.45)">0 = background</text>
    <text x="555" y="292" fill="rgba(255,255,255,0.45)">255 = foreground</text>
    <text x="555" y="312" fill="rgba(255,255,255,0.45)">128 = uncertain edge</text>
    <text x="555" y="352" fill="rgba(255,255,255,0.45)">Semi-transparent edges</text>
    <text x="555" y="372" fill="rgba(255,255,255,0.45)">preserve hair and fur</text>
    <text x="555" y="392" fill="rgba(255,255,255,0.45)">detail naturally</text>

    <rect x="670" y="100" width="190" height="460" rx="12" fill="rgba(251,191,36,0.06)" stroke="rgba(251,191,36,0.2)" stroke-width="1"/>
    <text x="765" y="128" font-size="11" font-weight="700" fill="rgba(251,191,36,0.85)">Step 4</text>
    <text x="765" y="148">Compositing</text>
    <text x="765" y="192" fill="rgba(255,255,255,0.45)">Mask applied to</text>
    <text x="765" y="212" fill="rgba(255,255,255,0.45)">original pixels as</text>
    <text x="765" y="232" fill="rgba(255,255,255,0.45)">alpha channel</text>
    <text x="765" y="272" fill="rgba(255,255,255,0.45)">Background pixels</text>
    <text x="765" y="292" fill="rgba(255,255,255,0.45)">become transparent</text>
    <text x="765" y="352" fill="rgba(255,255,255,0.45)">Output: PNG with</text>
    <text x="765" y="372" fill="rgba(255,255,255,0.45)">full alpha channel</text>
    <text x="765" y="392" fill="rgba(255,255,255,0.45)">transparency data</text>

    <rect x="880" y="100" width="280" height="460" rx="12" fill="rgba(239,68,68,0.05)" stroke="rgba(239,68,68,0.18)" stroke-width="1"/>
    <text x="1020" y="128" font-size="11" font-weight="700" fill="rgba(239,68,68,0.75)">What can fail</text>
    <text x="1020" y="192" fill="rgba(255,255,255,0.45)">Fine hair strands</text>
    <text x="1020" y="212" fill="rgba(255,255,255,0.35)">hard without high-res input</text>
    <text x="1020" y="252" fill="rgba(255,255,255,0.45)">Same color as bg</text>
    <text x="1020" y="272" fill="rgba(255,255,255,0.35)">subject blends in</text>
    <text x="1020" y="312" fill="rgba(255,255,255,0.45)">Complex backgrounds</text>
    <text x="1020" y="332" fill="rgba(255,255,255,0.35)">busy patterns or text</text>
    <text x="1020" y="372" fill="rgba(255,255,255,0.45)">Glass, water, smoke</text>
    <text x="1020" y="392" fill="rgba(255,255,255,0.35)">semi-transparent objects</text>
    <text x="1020" y="432" fill="rgba(255,255,255,0.45)">Very small images</text>
    <text x="1020" y="452" fill="rgba(255,255,255,0.35)">lack edge detail</text>
  </g>
  <text x="600" y="610" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.22)">toolnestai.net/image-tools/remove-background</text>
</svg>
