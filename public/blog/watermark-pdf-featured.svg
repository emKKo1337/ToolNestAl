<svg viewBox="0 0 900 540" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%"><stop offset="0%" stop-color="#0f0825"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <linearGradient id="lapG" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#1a1040"/><stop offset="100%" stop-color="#0d0824"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="900" height="540" fill="url(#bg)"/>
  <ellipse cx="450" cy="270" rx="280" ry="150" fill="#5b21b6" opacity="0.07" filter="url(#glow)"/>
  <rect x="120" y="48" width="660" height="410" rx="14" fill="url(#lapG)" stroke="#2a1f4a" stroke-width="1.5"/>
  <rect x="120" y="48" width="660" height="38" rx="14" fill="#1a1040"/>
  <rect x="120" y="72" width="660" height="14" fill="#1a1040"/>
  <circle cx="655" cy="67" r="7" fill="#ff5f57"/><circle cx="675" cy="67" r="7" fill="#febc2e"/><circle cx="695" cy="67" r="7" fill="#28c840"/>
  <rect x="200" y="56" width="440" height="20" rx="10" fill="#110c2a"/>
  <text x="420" y="70" font-family="monospace" font-size="9" fill="#4d4354" text-anchor="middle">toolnestai.net/pdf-tools/watermark-pdf</text>
  <rect x="136" y="94" width="628" height="352" rx="6" fill="#0c0920"/>
  <text x="450" y="118" font-family="sans-serif" font-size="13" font-weight="700" fill="#e2e2e2" text-anchor="middle">Watermark PDF</text>
  <text x="450" y="134" font-family="sans-serif" font-size="8" fill="#7a6d84" text-anchor="middle">Add text or image watermark to every page</text>
  <!-- Left: options -->
  <rect x="148" y="148" width="250" height="220" rx="8" fill="#110c2a" stroke="#2a1f4a" stroke-width="1"/>
  <text x="164" y="168" font-family="sans-serif" font-size="9" font-weight="700" fill="#4d4354">WATERMARK TEXT</text>
  <rect x="164" y="176" width="218" height="26" rx="6" fill="#0f0c24" stroke="#2a1f4a" stroke-width="1"/>
  <text x="175" y="193" font-family="sans-serif" font-size="9" fill="#cfc2d6">CONFIDENTIAL</text>
  <text x="164" y="222" font-family="sans-serif" font-size="9" font-weight="700" fill="#4d4354">OPACITY</text>
  <rect x="164" y="230" width="150" height="6" rx="3" fill="#1a1040"/>
  <rect x="164" y="230" width="60" height="6" rx="3" fill="#7c3aed"/>
  <circle cx="224" cy="233" r="6" fill="#7c3aed" stroke="#e2e2e2" stroke-width="1.5"/>
  <text x="322" y="238" font-family="sans-serif" font-size="8" fill="#a78bfa">40%</text>
  <text x="164" y="256" font-family="sans-serif" font-size="9" font-weight="700" fill="#4d4354">ROTATION</text>
  <rect x="164" y="264" width="60" height="22" rx="6" fill="#7c3aed"/>
  <text x="194" y="279" font-family="sans-serif" font-size="8" font-weight="700" fill="#fff" text-anchor="middle">45°</text>
  <rect x="232" y="264" width="50" height="22" rx="6" fill="#1a1040"/>
  <text x="257" y="279" font-family="sans-serif" font-size="8" fill="#7a6d84" text-anchor="middle">0°</text>
  <rect x="290" y="264" width="50" height="22" rx="6" fill="#1a1040"/>
  <text x="315" y="279" font-family="sans-serif" font-size="8" fill="#7a6d84" text-anchor="middle">-45°</text>
  <text x="164" y="310" font-family="sans-serif" font-size="9" font-weight="700" fill="#4d4354">COLOR</text>
  <rect x="164" y="318" width="22" height="22" rx="4" fill="#ff0000"/>
  <rect x="192" y="318" width="22" height="22" rx="4" fill="#0000ff"/>
  <rect x="220" y="318" width="22" height="22" rx="4" fill="#000000" stroke="#2a1f4a" stroke-width="1"/>
  <rect x="248" y="318" width="22" height="22" rx="4" fill="#a78bfa"/>
  <rect x="164" y="342" width="218" height="16" rx="6" fill="#0f0c24" stroke="#2a1f4a" stroke-width="1"/>
  <text x="175" y="354" font-family="sans-serif" font-size="7" fill="#4d4354">#7c3aed</text>
  <!-- Right: PDF preview with watermark -->
  <rect x="416" y="148" width="330" height="220" rx="8" fill="#1a1040" stroke="#2a1f4a" stroke-width="1"/>
  <text x="581" y="168" font-family="sans-serif" font-size="8" fill="#4d4354" text-anchor="middle">PREVIEW</text>
  <!-- Page mock -->
  <rect x="450" y="176" width="200" height="180" rx="4" fill="#110c2a"/>
  <rect x="460" y="188" width="180" height="10" rx="3" fill="#2a1f4a"/>
  <rect x="460" y="204" width="140" height="6" rx="3" fill="#1e1535"/>
  <rect x="460" y="214" width="160" height="6" rx="3" fill="#1e1535"/>
  <rect x="460" y="224" width="130" height="6" rx="3" fill="#1e1535"/>
  <!-- Watermark text diagonal -->
  <text x="550" y="290" font-family="sans-serif" font-size="22" font-weight="900" fill="#a78bfa" text-anchor="middle" opacity="0.3" transform="rotate(-45,550,270)">CONFIDENTIAL</text>
  <!-- Apply button -->
  <rect x="148" y="386" width="200" height="36" rx="10" fill="#7c3aed"/>
  <text x="248" y="409" font-family="sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">Add Watermark</text>
  <rect x="340" y="458" width="220" height="10" rx="5" fill="#1a1040"/>
  <rect x="280" y="466" width="340" height="8" rx="4" fill="#140e34"/>
</svg>
