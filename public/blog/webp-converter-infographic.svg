<svg viewBox="0 0 900 1200" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <radialGradient id="gT" cx="50%" cy="10%" r="60%"><stop offset="0%" stop-color="#5b21b6" stop-opacity="0.35"/><stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/></radialGradient>
    <radialGradient id="gB" cx="50%" cy="90%" r="60%"><stop offset="0%" stop-color="#0e7490" stop-opacity="0.2"/><stop offset="100%" stop-color="#0e7490" stop-opacity="0"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
  </defs>
  <rect width="900" height="1200" fill="url(#bg)"/>
  <ellipse cx="450" cy="200" rx="700" ry="400" fill="url(#gT)"/>
  <ellipse cx="450" cy="1000" rx="700" ry="400" fill="url(#gB)"/>
  <text x="450" y="52" text-anchor="middle" font-size="26" font-weight="900" fill="url(#aG)">WebP Converter: The Complete Guide</text>
  <text x="450" y="76" text-anchor="middle" font-size="13" fill="rgba(255,255,255,0.38)">Why WebP is the best format for modern web images</text>
  <text x="450" y="96" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.22)">toolnestai.net/image-tools/webp-converter</text>
  <rect x="32" y="112" width="836" height="38" rx="8" fill="rgba(124,58,237,0.18)" stroke="rgba(124,58,237,0.3)" stroke-width="1"/>
  <text x="450" y="136" text-anchor="middle" font-size="15" font-weight="800" fill="#a78bfa">01 - What Makes WebP Better</text>
  <g font-size="9.5">
    <rect x="32" y="156" width="404" height="120" rx="8" fill="rgba(52,211,153,0.06)" stroke="rgba(52,211,153,0.16)" stroke-width="1"/>
    <text x="48" y="178" font-weight="700" fill="#6ee7b7">vs JPG</text>
    <text x="48" y="198" fill="rgba(255,255,255,0.5)">25-35% smaller at same visual quality</text>
    <text x="48" y="218" fill="rgba(255,255,255,0.5)">Keeps alpha channel (transparency)</text>
    <text x="48" y="238" fill="rgba(255,255,255,0.5)">Both lossy and lossless modes</text>
    <text x="48" y="258" fill="rgba(255,255,255,0.3)" font-size="8.5">Better intra-frame prediction algorithm (VP8)</text>
    <rect x="464" y="156" width="404" height="120" rx="8" fill="rgba(52,211,153,0.06)" stroke="rgba(52,211,153,0.16)" stroke-width="1"/>
    <text x="480" y="178" font-weight="700" fill="#6ee7b7">vs PNG</text>
    <text x="480" y="198" fill="rgba(255,255,255,0.5)">26% smaller (lossless) on average</text>
    <text x="480" y="218" fill="rgba(255,255,255,0.5)">Much smaller (lossy) for photos</text>
    <text x="480" y="238" fill="rgba(255,255,255,0.5)">Same transparency support (alpha channel)</text>
    <text x="480" y="258" fill="rgba(255,255,255,0.3)" font-size="8.5">Better for web delivery, larger for some desktop tools</text>
  </g>
  <rect x="32" y="292" width="836" height="38" rx="8" fill="rgba(14,116,144,0.18)" stroke="rgba(14,116,144,0.3)" stroke-width="1"/>
  <text x="450" y="316" text-anchor="middle" font-size="15" font-weight="800" fill="#67e8f9">02 - Lossy vs Lossless WebP</text>
  <g font-size="9.5">
    <rect x="32" y="336" width="404" height="96" rx="8" fill="rgba(251,191,36,0.06)" stroke="rgba(251,191,36,0.16)" stroke-width="1"/>
    <text x="48" y="358" font-weight="700" fill="#fbbf24">Lossy WebP (VP8)</text>
    <text x="48" y="378" fill="rgba(255,255,255,0.5)">Discards imperceptible detail for smaller files</text>
    <text x="48" y="398" fill="rgba(255,255,255,0.5)">Best for: photographs, web images</text>
    <text x="48" y="418" fill="rgba(255,255,255,0.3)" font-size="8.5">25-35% smaller than equivalent JPG</text>
    <rect x="464" y="336" width="404" height="96" rx="8" fill="rgba(52,211,153,0.06)" stroke="rgba(52,211,153,0.16)" stroke-width="1"/>
    <text x="480" y="358" font-weight="700" fill="#6ee7b7">Lossless WebP (VP8L)</text>
    <text x="480" y="378" fill="rgba(255,255,255,0.5)">Preserves every pixel exactly</text>
    <text x="480" y="398" fill="rgba(255,255,255,0.5)">Best for: logos, screenshots, source files</text>
    <text x="480" y="418" fill="rgba(255,255,255,0.3)" font-size="8.5">26% smaller than PNG on average</text>
  </g>
  <rect x="32" y="448" width="836" height="38" rx="8" fill="rgba(239,68,68,0.12)" stroke="rgba(239,68,68,0.22)" stroke-width="1"/>
  <text x="450" y="472" text-anchor="middle" font-size="15" font-weight="800" fill="rgba(239,68,68,0.85)">03 - Browser Support Reality</text>
  <rect x="32" y="492" width="836" height="90" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="450" y="516" text-anchor="middle" font-size="10.5" fill="rgba(255,255,255,0.6)">WebP is supported by Chrome, Firefox, Safari 14+, Edge, and Opera — covering 96%+ of global browser usage.</text>
  <text x="450" y="538" text-anchor="middle" font-size="10.5" fill="rgba(255,255,255,0.6)">The gaps: older iOS devices (pre-2020), most email clients, and some older desktop editing software.</text>
  <text x="450" y="562" text-anchor="middle" font-size="9.5" fill="rgba(52,211,153,0.7)">For web use, WebP is safe. For email or legacy software, JPG/PNG remains the reliable fallback.</text>
  <rect x="32" y="598" width="836" height="38" rx="8" fill="rgba(16,185,129,0.14)" stroke="rgba(16,185,129,0.25)" stroke-width="1"/>
  <text x="450" y="622" text-anchor="middle" font-size="15" font-weight="800" fill="#34d399">04 - When to Use WebP</text>
  <g font-size="9.5" text-anchor="middle">
    <rect x="32" y="642" width="196" height="90" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    <text x="130" y="664" font-weight="700" fill="rgba(52,211,153,0.85)">Web images</text>
    <text x="130" y="684" fill="rgba(255,255,255,0.5)">Best default for</text>
    <text x="130" y="704" fill="rgba(255,255,255,0.5)">all web content</text>
    <rect x="236" y="642" width="196" height="90" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    <text x="334" y="664" font-weight="700" fill="rgba(103,232,249,0.85)">Transparent images</text>
    <text x="334" y="684" fill="rgba(255,255,255,0.5)">Lossy WebP keeps</text>
    <text x="334" y="704" fill="rgba(255,255,255,0.5)">alpha + small files</text>
    <rect x="440" y="642" width="196" height="90" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    <text x="538" y="664" font-weight="700" fill="rgba(167,139,250,0.85)">Performance-critical</text>
    <text x="538" y="684" fill="rgba(255,255,255,0.5)">Core Web Vitals and</text>
    <text x="538" y="704" fill="rgba(255,255,255,0.5)">LCP improvements</text>
    <rect x="644" y="642" width="224" height="90" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    <text x="756" y="664" font-weight="700" fill="rgba(251,191,36,0.85)">NOT for email</text>
    <text x="756" y="684" fill="rgba(255,255,255,0.5)">Email clients don't</text>
    <text x="756" y="704" fill="rgba(255,255,255,0.5)">support WebP</text>
  </g>
  <rect x="32" y="748" width="836" height="38" rx="8" fill="rgba(124,58,237,0.18)" stroke="rgba(124,58,237,0.3)" stroke-width="1"/>
  <text x="450" y="772" text-anchor="middle" font-size="15" font-weight="800" fill="#a78bfa">05 - Quality Guide</text>
  <g font-size="9.5">
    <rect x="32" y="792" width="836" height="86" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="450" y="816" text-anchor="middle" fill="rgba(255,255,255,0.6)">WebP quality settings behave similarly to JPEG — higher quality = larger file = fewer artifacts.</text>
    <text x="450" y="836" text-anchor="middle" fill="rgba(255,255,255,0.6)">Recommended: start at 80-85% for lossy web use (produces 25-35% smaller files than JPG at same quality).</text>
    <text x="450" y="858" text-anchor="middle" fill="rgba(255,255,255,0.4)">Use lossless mode for logos, screenshots, source files — or any image you'll edit further.</text>
  </g>
  <text x="450" y="960" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.28)">Free tool: toolnestai.net/image-tools/webp-converter</text>
  <text x="450" y="980" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.2)">Convert to/from WebP in your browser — no upload, no account, no limits</text>
</svg>
