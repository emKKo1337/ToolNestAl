<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0a0118"/>
      <stop offset="100%" stop-color="#05030d"/>
    </radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="bG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="18" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#a78bfa"/></marker>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="600" cy="315" r="260" fill="#5b21b6" opacity="0.07" filter="url(#glow)"/>

  <!-- Title -->
  <text x="600" y="46" font-size="20" fill="#e2e2e2" font-weight="800" text-anchor="middle">How to Apply Photo Filters — 5-Step Workflow</text>
  <text x="600" y="66" font-size="13" fill="#4d4354" text-anchor="middle">From upload to download in seconds · All processing in your browser</text>

  <!-- Steps row -->
  <!-- Step 1: Upload -->
  <circle cx="140" cy="165" r="46" fill="rgba(124,58,237,0.15)" stroke="rgba(124,58,237,0.3)" stroke-width="2"/>
  <text x="140" y="156" font-size="32" text-anchor="middle">📁</text>
  <text x="140" y="178" font-size="11" fill="#a78bfa" font-weight="700" text-anchor="middle">STEP 1</text>
  <text x="140" y="228" font-size="14" fill="#e2e2e2" font-weight="700" text-anchor="middle">Upload Image</text>
  <text x="140" y="248" font-size="11" fill="#6b5b7a" text-anchor="middle">JPG, PNG, WebP</text>
  <text x="140" y="264" font-size="11" fill="#6b5b7a" text-anchor="middle">GIF, BMP, AVIF</text>
  <!-- arrow -->
  <line x1="192" y1="165" x2="240" y2="165" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 2: Choose filter -->
  <circle cx="306" cy="165" r="46" fill="rgba(14,116,144,0.15)" stroke="rgba(14,116,144,0.3)" stroke-width="2"/>
  <text x="306" y="156" font-size="32" text-anchor="middle">🎨</text>
  <text x="306" y="178" font-size="11" fill="#22d3ee" font-weight="700" text-anchor="middle">STEP 2</text>
  <text x="306" y="228" font-size="14" fill="#e2e2e2" font-weight="700" text-anchor="middle">Choose Filter</text>
  <text x="306" y="248" font-size="11" fill="#6b5b7a" text-anchor="middle">17 professional</text>
  <text x="306" y="264" font-size="11" fill="#6b5b7a" text-anchor="middle">photo effects</text>
  <line x1="358" y1="165" x2="406" y2="165" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 3: Adjust strength -->
  <circle cx="472" cy="165" r="46" fill="rgba(124,58,237,0.15)" stroke="rgba(124,58,237,0.3)" stroke-width="2"/>
  <text x="472" y="156" font-size="32" text-anchor="middle">⚙️</text>
  <text x="472" y="178" font-size="11" fill="#a78bfa" font-weight="700" text-anchor="middle">STEP 3</text>
  <text x="472" y="228" font-size="14" fill="#e2e2e2" font-weight="700" text-anchor="middle">Adjust Strength</text>
  <text x="472" y="248" font-size="11" fill="#6b5b7a" text-anchor="middle">0–100% intensity</text>
  <text x="472" y="264" font-size="11" fill="#6b5b7a" text-anchor="middle">+ brightness/contrast</text>
  <line x1="524" y1="165" x2="572" y2="165" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 4: Split-view compare -->
  <circle cx="638" cy="165" r="46" fill="rgba(14,116,144,0.15)" stroke="rgba(14,116,144,0.3)" stroke-width="2"/>
  <text x="638" y="156" font-size="32" text-anchor="middle">🔀</text>
  <text x="638" y="178" font-size="11" fill="#22d3ee" font-weight="700" text-anchor="middle">STEP 4</text>
  <text x="638" y="228" font-size="14" fill="#e2e2e2" font-weight="700" text-anchor="middle">Compare Live</text>
  <text x="638" y="248" font-size="11" fill="#6b5b7a" text-anchor="middle">Drag split-view</text>
  <text x="638" y="264" font-size="11" fill="#6b5b7a" text-anchor="middle">divider before/after</text>
  <line x1="690" y1="165" x2="738" y2="165" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 5: Export -->
  <circle cx="804" cy="165" r="46" fill="rgba(124,58,237,0.2)" stroke="rgba(124,58,237,0.5)" stroke-width="2"/>
  <text x="804" y="156" font-size="32" text-anchor="middle">⬇️</text>
  <text x="804" y="178" font-size="11" fill="#a78bfa" font-weight="700" text-anchor="middle">STEP 5</text>
  <text x="804" y="228" font-size="14" fill="#e2e2e2" font-weight="700" text-anchor="middle">Download</text>
  <text x="804" y="248" font-size="11" fill="#6b5b7a" text-anchor="middle">JPG, PNG, WebP</text>
  <text x="804" y="264" font-size="11" fill="#6b5b7a" text-anchor="middle">custom quality</text>

  <!-- Right: Privacy note -->
  <rect x="900" y="100" width="260" height="180" rx="12" fill="rgba(6,182,212,0.07)" stroke="rgba(6,182,212,0.2)" stroke-width="1"/>
  <text x="1030" y="128" font-size="13" fill="#22d3ee" font-weight="700" text-anchor="middle">🔒 100% Private</text>
  <text x="1030" y="152" font-size="12" fill="#7a6d84" text-anchor="middle">All processing runs in</text>
  <text x="1030" y="168" font-size="12" fill="#7a6d84" text-anchor="middle">your browser via the</text>
  <text x="1030" y="184" font-size="12" fill="#7a6d84" text-anchor="middle">Canvas 2D API.</text>
  <text x="1030" y="208" font-size="12" fill="#4d4354" text-anchor="middle">No image ever leaves</text>
  <text x="1030" y="224" font-size="12" fill="#4d4354" text-anchor="middle">your device.</text>
  <text x="1030" y="262" font-size="11" fill="#22d3ee" text-anchor="middle">No server · No upload</text>

  <!-- Divider -->
  <line x1="40" y1="300" x2="1160" y2="300" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Tips section -->
  <text x="600" y="332" font-size="16" fill="#e2e2e2" font-weight="700" text-anchor="middle">Pro Tips for Best Results</text>

  <!-- Tip cards -->
  <rect x="40" y="352" width="340" height="116" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="60" y="380" font-size="13" fill="#a78bfa" font-weight="700">Start with filter strength at 50%</text>
  <text x="60" y="400" font-size="12" fill="#6b5b7a">Subtle filters often look more professional</text>
  <text x="60" y="420" font-size="12" fill="#6b5b7a">than full 100% intensity. Use the slider to</text>
  <text x="60" y="440" font-size="12" fill="#6b5b7a">find the sweet spot for your image type.</text>

  <rect x="398" y="352" width="340" height="116" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="418" y="380" font-size="13" fill="#22d3ee" font-weight="700">Use Warm for portraits, Cool for tech</text>
  <text x="418" y="400" font-size="12" fill="#6b5b7a">Color temperature filtering is the fastest way</text>
  <text x="418" y="420" font-size="12" fill="#6b5b7a">to set a mood. Warm humanizes; Cool creates</text>
  <text x="418" y="440" font-size="12" fill="#6b5b7a">distance, precision, and professional tone.</text>

  <rect x="756" y="352" width="404" height="116" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="776" y="380" font-size="13" fill="#a78bfa" font-weight="700">Combine brightness + filter for precision</text>
  <text x="776" y="400" font-size="12" fill="#6b5b7a">After applying a filter, use the brightness and</text>
  <text x="776" y="420" font-size="12" fill="#6b5b7a">contrast sliders to fine-tune the exposure</text>
  <text x="776" y="440" font-size="12" fill="#6b5b7a">independent of the color grading.</text>

  <!-- Format comparison -->
  <rect x="40" y="488" width="1120" height="100" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="600" y="514" font-size="14" fill="#e2e2e2" font-weight="700" text-anchor="middle">Choosing Your Export Format</text>
  <g font-size="12" fill="#6b5b7a">
    <text x="140" y="548" text-anchor="middle" fill="#a78bfa" font-weight="700">PNG</text>
    <text x="140" y="566" text-anchor="middle">Lossless · Large file</text>
    <text x="140" y="580" text-anchor="middle">Best: graphics, icons</text>

    <text x="470" y="548" text-anchor="middle" fill="#22d3ee" font-weight="700">JPG (quality 85–95)</text>
    <text x="470" y="566" text-anchor="middle">Lossy · Small file</text>
    <text x="470" y="580" text-anchor="middle">Best: photos, web images</text>

    <text x="860" y="548" text-anchor="middle" fill="#4cd7f6" font-weight="700">WebP</text>
    <text x="860" y="566" text-anchor="middle">Smaller than JPG + transparency</text>
    <text x="860" y="580" text-anchor="middle">Best: modern web projects</text>
  </g>
  <line x1="300" y1="500" x2="300" y2="578" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <line x1="680" y1="500" x2="680" y2="578" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
</svg>
