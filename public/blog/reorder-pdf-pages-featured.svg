<svg viewBox="0 0 900 540" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%"><stop offset="0%" stop-color="#0f0825"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <linearGradient id="lapG" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#1a1040"/><stop offset="100%" stop-color="#0d0824"/></linearGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="900" height="540" fill="url(#bg)"/>
  <ellipse cx="450" cy="270" rx="260" ry="140" fill="#5b21b6" opacity="0.07" filter="url(#glow)"/>
  <rect x="120" y="48" width="660" height="410" rx="14" fill="url(#lapG)" stroke="#2a1f4a" stroke-width="1.5"/>
  <rect x="120" y="48" width="660" height="38" rx="14" fill="#1a1040"/>
  <rect x="120" y="72" width="660" height="14" fill="#1a1040"/>
  <circle cx="655" cy="67" r="7" fill="#ff5f57"/><circle cx="675" cy="67" r="7" fill="#febc2e"/><circle cx="695" cy="67" r="7" fill="#28c840"/>
  <text x="420" y="118" font-family="sans-serif" font-size="13" font-weight="700" fill="#e2e2e2" text-anchor="middle">Reorder PDF Pages</text>
  <text x="450" y="134" font-family="sans-serif" font-size="8" fill="#7a6d84" text-anchor="middle">Enter a new page order using a range like: 3, 1-2, 4-6</text>
  <!-- Left: Original order -->
  <rect x="148" y="148" width="280" height="280" rx="8" fill="#110c2a" stroke="#2a1f4a" stroke-width="1"/>
  <text x="288" y="167" font-family="sans-serif" font-size="9" font-weight="700" fill="#4d4354" text-anchor="middle">ORIGINAL ORDER</text>
  <!-- Page rows with numbers -->
  <rect x="160" y="178" width="256" height="30" rx="5" fill="#1a1040"/>
  <text x="176" y="197" font-family="sans-serif" font-size="9" fill="#4d4354">Page 1</text>
  <text x="400" y="197" font-family="sans-serif" font-size="8" fill="#7a6d84" text-anchor="end">Introduction</text>
  <rect x="160" y="216" width="256" height="30" rx="5" fill="#1a1040"/>
  <text x="176" y="235" font-family="sans-serif" font-size="9" fill="#4d4354">Page 2</text>
  <text x="400" y="235" font-family="sans-serif" font-size="8" fill="#7a6d84" text-anchor="end">Executive Summary</text>
  <rect x="160" y="254" width="256" height="30" rx="5" fill="#7c3aed" opacity="0.2" stroke="#7c3aed" stroke-width="1"/>
  <text x="176" y="273" font-family="sans-serif" font-size="9" fill="#a78bfa">Page 3</text>
  <text x="400" y="273" font-family="sans-serif" font-size="8" fill="#a78bfa" text-anchor="end">Cover Page</text>
  <rect x="160" y="292" width="256" height="30" rx="5" fill="#1a1040"/>
  <text x="176" y="311" font-family="sans-serif" font-size="9" fill="#4d4354">Page 4</text>
  <text x="160" y="330" width="256" height="30" rx="5" fill="#1a1040"/>
  <text x="176" y="349" font-family="sans-serif" font-size="9" fill="#4d4354">Page 5</text>
  <text x="400" y="349" font-family="sans-serif" font-size="8" fill="#7a6d84" text-anchor="end">Conclusion</text>
  <!-- Arrow -->
  <text x="447" y="295" font-family="sans-serif" font-size="24" fill="#7c3aed" text-anchor="middle">→</text>
  <!-- Right: New order -->
  <rect x="472" y="148" width="300" height="280" rx="8" fill="#110c2a" stroke="#2a1f4a" stroke-width="1"/>
  <text x="622" y="167" font-family="sans-serif" font-size="9" font-weight="700" fill="#4d4354" text-anchor="middle">NEW ORDER</text>
  <rect x="484" y="178" width="276" height="30" rx="5" fill="#7c3aed" opacity="0.25" stroke="#7c3aed" stroke-width="1"/>
  <text x="500" y="197" font-family="sans-serif" font-size="9" fill="#a78bfa">1 ← (was 3)</text>
  <text x="744" y="197" font-family="sans-serif" font-size="8" fill="#a78bfa" text-anchor="end">Cover Page</text>
  <rect x="484" y="216" width="276" height="30" rx="5" fill="#1a1040"/>
  <text x="500" y="235" font-family="sans-serif" font-size="9" fill="#cfc2d6">2 ← (was 1)</text>
  <text x="744" y="235" font-family="sans-serif" font-size="8" fill="#7a6d84" text-anchor="end">Introduction</text>
  <rect x="484" y="254" width="276" height="30" rx="5" fill="#1a1040"/>
  <text x="500" y="273" font-family="sans-serif" font-size="9" fill="#cfc2d6">3 ← (was 2)</text>
  <text x="744" y="273" font-family="sans-serif" font-size="8" fill="#7a6d84" text-anchor="end">Executive Summary</text>
  <rect x="484" y="292" width="276" height="30" rx="5" fill="#1a1040"/>
  <text x="500" y="311" font-family="sans-serif" font-size="9" fill="#cfc2d6">4 ← (was 4)</text>
  <rect x="484" y="330" width="276" height="30" rx="5" fill="#1a1040"/>
  <text x="500" y="349" font-family="sans-serif" font-size="9" fill="#cfc2d6">5 ← (was 5)</text>
  <!-- Input -->
  <text x="148" y="444" font-family="sans-serif" font-size="8.5" fill="#4d4354">New order: </text>
  <rect x="220" y="432" width="300" height="22" rx="5" fill="#1a1040" stroke="#7c3aed" stroke-width="1"/>
  <text x="234" y="447" font-family="monospace" font-size="9" fill="#a78bfa">3, 1, 2, 4-5</text>
  <rect x="532" y="432" width="100" height="22" rx="5" fill="#7c3aed"/>
  <text x="582" y="447" font-family="sans-serif" font-size="9" font-weight="700" fill="#fff" text-anchor="middle">Apply</text>
</svg>
