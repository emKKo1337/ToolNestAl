<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <radialGradient id="gC" cx="50%" cy="40%" r="60%"><stop offset="0%" stop-color="#5b21b6" stop-opacity="0.2"/><stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
  </defs>
  <rect width="900" height="460" fill="url(#bg)"/>
  <ellipse cx="450" cy="230" rx="520" ry="320" fill="url(#gC)"/>
  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="900" fill="url(#aG)">Watermark Opacity Guide — Finding the Right Balance</text>
  <text x="450" y="54" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.38)">Too opaque ruins the image; too transparent defeats the purpose</text>
  <!-- Opacity scale images -->
  <g text-anchor="middle">
    <rect x="28" y="72" width="154" height="100" rx="8" fill="rgba(14,116,144,0.12)" stroke="rgba(14,116,144,0.2)" stroke-width="1"/>
    <text x="105" y="118" fill="rgba(255,255,255,0.08)" font-size="18" font-style="italic">© Brand</text>
    <text x="105" y="150" font-size="10" font-weight="700" fill="rgba(239,68,68,0.75)">10% — Too faint</text>
    <text x="105" y="168" font-size="9" fill="rgba(255,255,255,0.4)">Invisible in practice</text>

    <rect x="196" y="72" width="154" height="100" rx="8" fill="rgba(14,116,144,0.12)" stroke="rgba(14,116,144,0.2)" stroke-width="1"/>
    <text x="273" y="118" fill="rgba(255,255,255,0.2)" font-size="18" font-style="italic">© Brand</text>
    <text x="273" y="150" font-size="10" font-weight="700" fill="rgba(251,191,36,0.75)">20% — Subtle</text>
    <text x="273" y="168" font-size="9" fill="rgba(255,255,255,0.4)">Light protection</text>

    <rect x="364" y="72" width="154" height="100" rx="8" fill="rgba(14,116,144,0.12)" stroke="rgba(52,211,153,0.35)" stroke-width="1.5"/>
    <text x="441" y="118" fill="rgba(255,255,255,0.32)" font-size="18" font-style="italic">© Brand</text>
    <text x="441" y="150" font-size="10" font-weight="700" fill="rgba(52,211,153,0.85)">30-40% — Sweet spot</text>
    <text x="441" y="168" font-size="9" fill="rgba(255,255,255,0.4)">Visible, not distracting</text>

    <rect x="532" y="72" width="154" height="100" rx="8" fill="rgba(14,116,144,0.12)" stroke="rgba(14,116,144,0.2)" stroke-width="1"/>
    <text x="609" y="118" fill="rgba(255,255,255,0.55)" font-size="18" font-style="italic">© Brand</text>
    <text x="609" y="150" font-size="10" font-weight="700" fill="rgba(251,191,36,0.75)">60% — Heavy</text>
    <text x="609" y="168" font-size="9" fill="rgba(255,255,255,0.4)">Distracting</text>

    <rect x="700" y="72" width="172" height="100" rx="8" fill="rgba(14,116,144,0.12)" stroke="rgba(14,116,144,0.2)" stroke-width="1"/>
    <text x="786" y="118" fill="rgba(255,255,255,0.85)" font-size="18" font-style="italic">© Brand</text>
    <text x="786" y="150" font-size="10" font-weight="700" fill="rgba(239,68,68,0.75)">90% — Too opaque</text>
    <text x="786" y="168" font-size="9" fill="rgba(255,255,255,0.4)">Ruins the image</text>
  </g>
  <!-- Recommended use cases -->
  <rect x="28" y="190" width="835" height="130" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="450" y="212" text-anchor="middle" font-size="10" font-weight="700" fill="rgba(167,139,250,0.8)">RECOMMENDED OPACITY BY USE CASE</text>
  <g font-size="9.5" text-anchor="middle">
    <rect x="44" y="222" width="190" height="78" rx="6" fill="rgba(52,211,153,0.06)" stroke="rgba(52,211,153,0.14)" stroke-width="1"/>
    <text x="139" y="244" font-weight="700" fill="rgba(52,211,153,0.8)">Portfolio / showcase</text>
    <text x="139" y="264" fill="rgba(255,255,255,0.5)">15-25% opacity</text>
    <text x="139" y="282" fill="rgba(255,255,255,0.4)">Corner placement</text>

    <rect x="248" y="222" width="190" height="78" rx="6" fill="rgba(167,139,250,0.06)" stroke="rgba(167,139,250,0.14)" stroke-width="1"/>
    <text x="343" y="244" font-weight="700" fill="rgba(167,139,250,0.8)">Social media</text>
    <text x="343" y="264" fill="rgba(255,255,255,0.5)">25-40% opacity</text>
    <text x="343" y="282" fill="rgba(255,255,255,0.4)">Bottom-right</text>

    <rect x="452" y="222" width="190" height="78" rx="6" fill="rgba(103,232,249,0.06)" stroke="rgba(103,232,249,0.14)" stroke-width="1"/>
    <text x="547" y="244" font-weight="700" fill="rgba(103,232,249,0.8)">Proofs / previews</text>
    <text x="547" y="264" fill="rgba(255,255,255,0.5)">40-60% opacity</text>
    <text x="547" y="282" fill="rgba(255,255,255,0.4)">Center or tiled</text>

    <rect x="656" y="222" width="190" height="78" rx="6" fill="rgba(251,191,36,0.06)" stroke="rgba(251,191,36,0.14)" stroke-width="1"/>
    <text x="751" y="244" font-weight="700" fill="rgba(251,191,36,0.8)">Stock / licensing</text>
    <text x="751" y="264" fill="rgba(255,255,255,0.5)">50-70% opacity</text>
    <text x="751" y="282" fill="rgba(255,255,255,0.4)">Tiled diagonal</text>
  </g>
  <text x="450" y="360" text-anchor="middle" font-size="9.5" fill="rgba(255,255,255,0.45)">Test at actual display size and on both light and dark areas of the image — what looks balanced at 100% zoom</text>
  <text x="450" y="378" text-anchor="middle" font-size="9.5" fill="rgba(255,255,255,0.45)">may be invisible at thumbnail size, or overwhelming when the watermark is on a high-contrast background area</text>
  <text x="450" y="444" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.2)">toolnestai.net/image-tools/image-watermark</text>
</svg>
