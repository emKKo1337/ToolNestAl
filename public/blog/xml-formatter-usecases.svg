<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Segoe UI',sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0f0825"/>
      <stop offset="100%" stop-color="#05030d"/>
    </radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>
  <rect width="900" height="460" fill="url(#bg)"/>

  <text x="450" y="44" font-size="22" font-weight="800" fill="#e2e2e2" text-anchor="middle">XML in the Wild: Common Formats</text>
  <text x="450" y="66" font-size="13" fill="#7a6d84" text-anchor="middle">Where you encounter XML and what each variant looks like</text>

  <!-- RSS -->
  <rect x="30" y="86" width="406" height="165" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(251,191,36,0.2)" stroke-width="1"/>
  <text x="50" y="110" font-size="11" font-weight="700" fill="#fbbf24" letter-spacing="0.04em">RSS / Atom Feed</text>
  <rect x="46" y="118" width="374" height="96" rx="6" fill="rgba(0,0,0,0.4)"/>
  <text x="58" y="136" font-size="8.5" fill="#fbbf24" font-family="monospace">&lt;rss version="2.0"&gt;</text>
  <text x="58" y="150" font-size="8.5" fill="#e2e2e2" font-family="monospace">  &lt;channel&gt;</text>
  <text x="58" y="164" font-size="8.5" fill="#e2e2e2" font-family="monospace">    &lt;title&gt;My Blog&lt;/title&gt;</text>
  <text x="58" y="178" font-size="8.5" fill="#a78bfa" font-family="monospace">    &lt;item&gt;&lt;title&gt;Post 1&lt;/title&gt;</text>
  <text x="58" y="192" font-size="8.5" fill="#a78bfa" font-family="monospace">      &lt;link&gt;https://...&lt;/link&gt;&lt;/item&gt;</text>
  <text x="58" y="214" font-size="9" fill="#5a4d7a">Blog feeds, podcast feeds, news aggregators</text>
  <text x="58" y="228" font-size="9" fill="#5a4d7a">Consumed by feed readers, podcast apps, SEO tools</text>
  <text x="58" y="242" font-size="9" fill="#5a4d7a">Generated by WordPress, Ghost, Hugo automatically</text>

  <!-- SOAP -->
  <rect x="464" y="86" width="406" height="165" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(239,68,68,0.2)" stroke-width="1"/>
  <text x="484" y="110" font-size="11" font-weight="700" fill="#ef4444" letter-spacing="0.04em">SOAP Web Service</text>
  <rect x="480" y="118" width="374" height="96" rx="6" fill="rgba(0,0,0,0.4)"/>
  <text x="492" y="136" font-size="8.5" fill="#60a5fa" font-family="monospace">&lt;soap:Envelope xmlns:soap="..."&gt;</text>
  <text x="492" y="150" font-size="8.5" fill="#e2e2e2" font-family="monospace">  &lt;soap:Body&gt;</text>
  <text x="492" y="164" font-size="8.5" fill="#a78bfa" font-family="monospace">    &lt;GetUser&gt;</text>
  <text x="492" y="178" font-size="8.5" fill="#e2e2e2" font-family="monospace">      &lt;UserId&gt;42&lt;/UserId&gt;</text>
  <text x="492" y="192" font-size="8.5" fill="#a78bfa" font-family="monospace">    &lt;/GetUser&gt;</text>
  <text x="492" y="214" font-size="9" fill="#5a4d7a">Enterprise APIs, banking, government, healthcare</text>
  <text x="492" y="228" font-size="9" fill="#5a4d7a">WSDL defines the contract; SOAP envelope wraps calls</text>
  <text x="492" y="242" font-size="9" fill="#5a4d7a">Being replaced by REST/JSON in new APIs</text>

  <!-- Maven pom.xml -->
  <rect x="30" y="268" width="406" height="165" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(96,165,250,0.2)" stroke-width="1"/>
  <text x="50" y="292" font-size="11" font-weight="700" fill="#60a5fa" letter-spacing="0.04em">Maven pom.xml / Build Config</text>
  <rect x="46" y="300" width="374" height="96" rx="6" fill="rgba(0,0,0,0.4)"/>
  <text x="58" y="318" font-size="8.5" fill="#60a5fa" font-family="monospace">&lt;project xmlns="http://maven.apache.org/POM/4.0.0"&gt;</text>
  <text x="58" y="332" font-size="8.5" fill="#e2e2e2" font-family="monospace">  &lt;groupId&gt;com.example&lt;/groupId&gt;</text>
  <text x="58" y="346" font-size="8.5" fill="#e2e2e2" font-family="monospace">  &lt;artifactId&gt;myapp&lt;/artifactId&gt;</text>
  <text x="58" y="360" font-size="8.5" fill="#a78bfa" font-family="monospace">  &lt;dependencies&gt;...&lt;/dependencies&gt;</text>
  <text x="58" y="388" font-size="9" fill="#5a4d7a">Java/Maven build configuration</text>
  <text x="58" y="402" font-size="9" fill="#5a4d7a">Also: Android Manifest.xml, Spring beans, Ant build.xml</text>
  <text x="58" y="416" font-size="9" fill="#5a4d7a">Industry standard in Java ecosystem</text>

  <!-- SVG -->
  <rect x="464" y="268" width="406" height="165" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(52,211,153,0.2)" stroke-width="1"/>
  <text x="484" y="292" font-size="11" font-weight="700" fill="#34d399" letter-spacing="0.04em">SVG (Scalable Vector Graphics)</text>
  <rect x="480" y="300" width="374" height="96" rx="6" fill="rgba(0,0,0,0.4)"/>
  <text x="492" y="318" font-size="8.5" fill="#34d399" font-family="monospace">&lt;svg viewBox="0 0 100 100" xmlns="..."&gt;</text>
  <text x="492" y="332" font-size="8.5" fill="#a78bfa" font-family="monospace">  &lt;circle cx="50" cy="50" r="40"</text>
  <text x="492" y="346" font-size="8.5" fill="#a78bfa" font-family="monospace">    fill="purple" stroke="blue"/&gt;</text>
  <text x="492" y="360" font-size="8.5" fill="#e2e2e2" font-family="monospace">  &lt;text x="50" y="50"&gt;Hi&lt;/text&gt;</text>
  <text x="492" y="388" font-size="9" fill="#5a4d7a">Icons, illustrations, charts, logos in the browser</text>
  <text x="492" y="402" font-size="9" fill="#5a4d7a">XML subset — valid SVG is valid XML</text>
  <text x="492" y="416" font-size="9" fill="#5a4d7a">Embeddable in HTML, styleable with CSS</text>
</svg>
