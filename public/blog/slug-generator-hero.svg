<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <radialGradient id="gL" cx="10%" cy="50%" r="60%"><stop offset="0%" stop-color="#5b21b6" stop-opacity="0.35"/><stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/></radialGradient>
    <radialGradient id="gR" cx="90%" cy="50%" r="60%"><stop offset="0%" stop-color="#0e7490" stop-opacity="0.2"/><stop offset="100%" stop-color="#0e7490" stop-opacity="0"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="bG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient>
    <linearGradient id="lapG" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1a1040"/><stop offset="100%" stop-color="#0d0824"/></linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#5b21b6" flood-opacity="0.45"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <ellipse cx="120" cy="337" rx="700" ry="550" fill="url(#gL)"/>
  <ellipse cx="1080" cy="337" rx="700" ry="550" fill="url(#gR)"/>

  <text x="600" y="42" text-anchor="middle" font-size="13" font-weight="700" fill="url(#aG)" filter="url(#glow)">ToolNest AI — Text Tools</text>
  <text x="600" y="68" text-anchor="middle" font-size="34" font-weight="900" fill="url(#aG)" filter="url(#glow)">Slug Generator</text>
  <text x="600" y="90" text-anchor="middle" font-size="13" fill="rgba(255,255,255,0.35)">SEO-friendly URL slugs from any title — accents, symbols, and Unicode handled</text>

  <rect x="60" y="108" width="1080" height="542" rx="18" fill="url(#lapG)" stroke="rgba(124,58,237,0.35)" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="60" y="108" width="1080" height="38" rx="18" fill="rgba(255,255,255,0.05)"/>
  <rect x="60" y="128" width="1080" height="18" fill="rgba(255,255,255,0.02)"/>
  <circle cx="90" cy="127" r="7" fill="rgba(239,68,68,0.65)"/>
  <circle cx="114" cy="127" r="7" fill="rgba(251,191,36,0.65)"/>
  <circle cx="138" cy="127" r="7" fill="rgba(34,197,94,0.65)"/>
  <text x="600" y="132" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.2)">toolnestai.net/text-tools/slug-generator</text>

  <!-- Input -->
  <text x="88" y="176" font-size="9" font-weight="700" fill="rgba(255,255,255,0.28)">TITLE / TEXT</text>
  <rect x="80" y="182" width="1040" height="66" rx="10" fill="rgba(0,0,0,0.55)" stroke="rgba(124,58,237,0.45)" stroke-width="1.5"/>
  <text x="98" y="212" font-family="monospace" font-size="16" fill="rgba(255,255,255,0.85)">10 Best Café Résumé Tips &amp; Tricks! (2026 Edition)</text>
  <text x="98" y="234" font-family="monospace" font-size="14" fill="rgba(255,255,255,0.45)">— Read This First — Naïve Guide to Job Hunting 😊</text>

  <!-- Output -->
  <text x="88" y="270" font-size="9" font-weight="700" fill="rgba(255,255,255,0.28)">GENERATED SLUG</text>
  <rect x="80" y="276" width="1040" height="60" rx="10" fill="rgba(52,211,153,0.08)" stroke="rgba(52,211,153,0.3)" stroke-width="1.5"/>
  <text x="600" y="314" text-anchor="middle" font-family="monospace" font-size="18" font-weight="700" fill="rgba(110,231,183,0.95)">10-best-cafe-resume-tips-tricks-2026-edition-read-this-first</text>

  <!-- Full URL preview -->
  <rect x="80" y="352" width="1040" height="40" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="600" y="377" text-anchor="middle" font-family="monospace" font-size="12" fill="rgba(103,232,249,0.75)">https://example.com/blog/10-best-cafe-resume-tips-tricks-2026-edition</text>

  <!-- Transformation breakdown -->
  <text x="88" y="422" font-size="9" font-weight="700" fill="rgba(255,255,255,0.28)">TRANSFORMATION STEPS</text>
  <g font-size="10.5">
    <rect x="80" y="428" width="510" height="184" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="96" y="452" fill="rgba(52,211,153,0.85)">1.</text><text x="112" y="452" fill="rgba(255,255,255,0.6)">Transliterate accented characters</text>
    <text x="112" y="468" font-family="monospace" font-size="9.5" fill="rgba(255,255,255,0.4)">Café → cafe, Résumé → resume, Naïve → naive</text>

    <text x="96" y="494" fill="rgba(52,211,153,0.85)">2.</text><text x="112" y="494" fill="rgba(255,255,255,0.6)">Strip symbols and punctuation</text>
    <text x="112" y="510" font-family="monospace" font-size="9.5" fill="rgba(255,255,255,0.4)">&amp; ! ( ) — 😊 removed entirely</text>

    <text x="96" y="536" fill="rgba(52,211,153,0.85)">3.</text><text x="112" y="536" fill="rgba(255,255,255,0.6)">Convert to lowercase</text>
    <text x="112" y="552" font-family="monospace" font-size="9.5" fill="rgba(255,255,255,0.4)">Best → best, Tips → tips</text>

    <text x="96" y="578" fill="rgba(52,211,153,0.85)">4.</text><text x="112" y="578" fill="rgba(255,255,255,0.6)">Replace spaces with hyphens, collapse repeats</text>
    <text x="112" y="594" font-family="monospace" font-size="9.5" fill="rgba(255,255,255,0.4)">multiple---hyphens → single-hyphen</text>

    <rect x="608" y="428" width="512" height="184" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(124,58,237,0.15)" stroke-width="1"/>
    <text x="864" y="452" text-anchor="middle" font-size="10" font-weight="700" fill="rgba(167,139,250,0.85)">WHY EACH STEP MATTERS FOR SEO</text>
    <text x="624" y="476" font-size="9.5" fill="rgba(255,255,255,0.55)">• Accents can render as %XX in some browsers,</text>
    <text x="624" y="492" font-size="9.5" fill="rgba(255,255,255,0.55)">  breaking readability and copy-paste sharing</text>
    <text x="624" y="514" font-size="9.5" fill="rgba(255,255,255,0.55)">• Symbols like &amp; and ? have special meaning in</text>
    <text x="624" y="530" font-size="9.5" fill="rgba(255,255,255,0.55)">  URLs — must be encoded or removed</text>
    <text x="624" y="552" font-size="9.5" fill="rgba(255,255,255,0.55)">• Lowercase avoids case-sensitivity bugs across</text>
    <text x="624" y="568" font-size="9.5" fill="rgba(255,255,255,0.55)">  different servers and operating systems</text>
    <text x="624" y="590" font-size="9.5" fill="rgba(255,255,255,0.55)">• Google explicitly recommends hyphens over</text>
    <text x="624" y="606" font-size="9.5" fill="rgba(255,255,255,0.55)">  underscores as word separators in URLs</text>
  </g>

  <rect x="48" y="650" width="1104" height="16" rx="5" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="460" y="664" width="280" height="10" rx="5" fill="rgba(255,255,255,0.025)"/>
</svg>
