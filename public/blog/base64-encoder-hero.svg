<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <radialGradient id="gL" cx="10%" cy="50%" r="60%"><stop offset="0%" stop-color="#5b21b6" stop-opacity="0.35"/><stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/></radialGradient>
    <radialGradient id="gR" cx="90%" cy="50%" r="60%"><stop offset="0%" stop-color="#0e7490" stop-opacity="0.2"/><stop offset="100%" stop-color="#0e7490" stop-opacity="0"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="bG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient>
    <linearGradient id="lapG" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1a1040"/><stop offset="100%" stop-color="#0d0824"/></linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#5b21b6" flood-opacity="0.45"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <ellipse cx="120" cy="337" rx="700" ry="550" fill="url(#gL)"/>
  <ellipse cx="1080" cy="337" rx="700" ry="550" fill="url(#gR)"/>

  <!-- Header -->
  <text x="600" y="42" text-anchor="middle" font-size="13" font-weight="700" fill="url(#aG)" filter="url(#glow)">ToolNest AI — Developer Tools</text>
  <text x="600" y="68" text-anchor="middle" font-size="34" font-weight="900" fill="url(#aG)" filter="url(#glow)">Base64 Encoder / Decoder</text>
  <text x="600" y="90" text-anchor="middle" font-size="13" fill="rgba(255,255,255,0.35)">Text · Binary · Images · Files · Base64URL — Free, client-side, no account needed</text>

  <!-- Laptop frame -->
  <rect x="60" y="108" width="1080" height="542" rx="18" fill="url(#lapG)" stroke="rgba(124,58,237,0.35)" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="60" y="108" width="1080" height="38" rx="18" fill="rgba(255,255,255,0.05)"/>
  <rect x="60" y="128" width="1080" height="18" fill="rgba(255,255,255,0.02)"/>
  <circle cx="90" cy="127" r="7" fill="rgba(239,68,68,0.65)"/>
  <circle cx="114" cy="127" r="7" fill="rgba(251,191,36,0.65)"/>
  <circle cx="138" cy="127" r="7" fill="rgba(34,197,94,0.65)"/>
  <text x="600" y="132" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.2)">toolnestai.net/developer-tools/base64-encoder</text>

  <!-- Mode tabs -->
  <g font-size="10" text-anchor="middle">
    <rect x="80" y="158" width="78" height="26" rx="6" fill="url(#bG)"/>
    <text x="119" y="175" fill="#fff" font-weight="700">Text</text>
    <rect x="164" y="158" width="78" height="26" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="203" y="175" fill="rgba(255,255,255,0.4)">File</text>
    <rect x="248" y="158" width="78" height="26" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="287" y="175" fill="rgba(255,255,255,0.4)">Image</text>
    <rect x="332" y="158" width="104" height="26" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="384" y="175" fill="rgba(255,255,255,0.4)">Base64URL</text>
    <rect x="442" y="158" width="78" height="26" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="481" y="175" fill="rgba(255,255,255,0.4)">Decode</text>
  </g>

  <!-- Input panel -->
  <text x="88" y="204" font-size="9" font-weight="700" fill="rgba(255,255,255,0.28)">INPUT TEXT</text>
  <rect x="80" y="210" width="680" height="110" rx="10" fill="rgba(0,0,0,0.55)" stroke="rgba(124,58,237,0.45)" stroke-width="1.5"/>
  <text x="98" y="236" font-family="monospace" font-size="11.5" fill="rgba(255,255,255,0.8)">The quick brown fox jumps over the lazy dog.</text>
  <text x="98" y="258" font-family="monospace" font-size="11.5" fill="rgba(255,255,255,0.8)">Special chars: © ™ € £ ¥ — all UTF-8 supported!</text>
  <text x="98" y="280" font-family="monospace" font-size="11.5" fill="rgba(255,255,255,0.8)">Binary-safe: handles null bytes \x00 and emoji 🚀</text>
  <rect x="726" y="212" width="28" height="22" rx="5" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="740" y="226" text-anchor="middle" font-size="7.5" fill="rgba(255,255,255,0.3)">⌫</text>

  <!-- Action buttons -->
  <rect x="80" y="334" width="330" height="38" rx="10" fill="url(#bG)" filter="url(#sh)"/>
  <text x="245" y="357" text-anchor="middle" font-size="14" font-weight="900" fill="#fff">↓ Encode to Base64</text>
  <rect x="430" y="334" width="330" height="38" rx="10" fill="rgba(14,116,144,0.35)" stroke="rgba(14,116,144,0.65)" stroke-width="1.5"/>
  <text x="595" y="357" text-anchor="middle" font-size="14" font-weight="800" fill="#67e8f9">↑ Decode from Base64</text>

  <!-- Swap -->
  <rect x="775" y="334" width="160" height="38" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="855" y="357" text-anchor="middle" font-size="13" fill="rgba(255,255,255,0.35)">⇅ Swap</text>

  <!-- Output panel -->
  <text x="88" y="388" font-size="9" font-weight="700" fill="rgba(255,255,255,0.28)">BASE64 OUTPUT</text>
  <rect x="80" y="394" width="680" height="110" rx="10" fill="rgba(0,0,0,0.38)" stroke="rgba(52,211,153,0.35)" stroke-width="1.5"/>
  <text x="98" y="420" font-family="monospace" font-size="11" fill="rgba(52,211,153,0.9)">VGhlIHF1aWNrIGJyb3duIGZveCBqdW1wcyBvdmVy</text>
  <text x="98" y="440" font-family="monospace" font-size="11" fill="rgba(52,211,153,0.9)">IHRoZSBsYXp5IGRvZy4gU3BlY2lhbCBjaGFyczog</text>
  <text x="98" y="460" font-family="monospace" font-size="11" fill="rgba(52,211,153,0.9)">wqkgwq4g4oKsIMKjIMKlIOKAliBhbGwgVVRGLTgg</text>
  <text x="98" y="480" font-family="monospace" font-size="11" fill="rgba(52,211,153,0.9)">c3VwcG9ydGVkIQ==</text>
  <rect x="716" y="396" width="38" height="22" rx="5" fill="rgba(52,211,153,0.15)" stroke="rgba(52,211,153,0.35)" stroke-width="1"/>
  <text x="735" y="411" text-anchor="middle" font-size="8.5" fill="rgba(52,211,153,0.8)">Copy</text>

  <!-- Right panel: Algorithm explainer -->
  <rect x="780" y="210" width="340" height="290" rx="12" fill="rgba(255,255,255,0.025)" stroke="rgba(124,58,237,0.18)" stroke-width="1"/>
  <text x="950" y="234" text-anchor="middle" font-size="11" font-weight="700" fill="rgba(255,255,255,0.5)">How Base64 Works</text>

  <!-- 3-byte groups -->
  <g font-family="monospace" font-size="9.5">
    <text x="796" y="256" fill="rgba(255,255,255,0.35)">Input bytes (3-byte groups → 4 chars):</text>
    <rect x="796" y="262" width="306" height="22" rx="4" fill="rgba(0,0,0,0.3)"/>
    <text x="800" y="276" fill="#a78bfa">01001000</text>
    <text x="872" y="276" fill="#67e8f9">01100101</text>
    <text x="944" y="276" fill="#34d399">01101100</text>
    <text x="1016" y="276" fill="rgba(255,255,255,0.2)">···</text>
    <text x="796" y="298" fill="rgba(255,255,255,0.35)">Split into 6-bit groups:</text>
    <rect x="796" y="304" width="306" height="22" rx="4" fill="rgba(0,0,0,0.3)"/>
    <text x="800" y="318" fill="#a78bfa">010010</text>
    <text x="854" y="318" fill="#a78bfa">000110</text>
    <text x="908" y="318" fill="#67e8f9">010101</text>
    <text x="962" y="318" fill="#34d399">101100</text>
    <text x="796" y="340" fill="rgba(255,255,255,0.35)">Map to Base64 alphabet:</text>
    <rect x="796" y="346" width="306" height="22" rx="4" fill="rgba(124,58,237,0.12)" stroke="rgba(124,58,237,0.22)" stroke-width="1"/>
    <text x="800" y="361" fill="#a78bfa">S</text>
    <text x="854" y="361" fill="#a78bfa">G</text>
    <text x="908" y="361" fill="#67e8f9">V</text>
    <text x="962" y="361" fill="#34d399">s</text>
    <text x="1016" y="361" fill="rgba(255,255,255,0.2)">···</text>
  </g>

  <!-- Alphabet reference -->
  <text x="796" y="386" font-size="8.5" font-weight="700" fill="rgba(255,255,255,0.3)">BASE64 ALPHABET (64 characters)</text>
  <rect x="796" y="392" width="306" height="56" rx="6" fill="rgba(0,0,0,0.3)"/>
  <text x="800" y="407" font-family="monospace" font-size="8.5" fill="rgba(167,139,250,0.75)">A–Z (0–25)    a–z (26–51)</text>
  <text x="800" y="422" font-family="monospace" font-size="8.5" fill="rgba(103,232,249,0.75)">0–9 (52–61)   + (62)  / (63)</text>
  <text x="800" y="437" font-family="monospace" font-size="8.5" fill="rgba(52,211,153,0.75)">= padding (output always 4-char aligned)</text>
  <text x="800" y="452" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.25)">Base64URL: + → - and / → _ (URL-safe variant)</text>

  <!-- Stats row -->
  <g text-anchor="middle" font-size="9.5">
    <rect x="80" y="514" width="162" height="54" rx="8" fill="rgba(124,58,237,0.1)" stroke="rgba(124,58,237,0.22)" stroke-width="1"/>
    <text x="161" y="538" font-size="18" font-weight="900" fill="#a78bfa">107</text>
    <text x="161" y="556" fill="rgba(255,255,255,0.38)">input bytes</text>

    <rect x="254" y="514" width="162" height="54" rx="8" fill="rgba(14,116,144,0.08)" stroke="rgba(14,116,144,0.2)" stroke-width="1"/>
    <text x="335" y="538" font-size="18" font-weight="900" fill="#67e8f9">144</text>
    <text x="335" y="556" fill="rgba(255,255,255,0.38)">output chars (+34%)</text>

    <rect x="428" y="514" width="162" height="54" rx="8" fill="rgba(16,185,129,0.07)" stroke="rgba(16,185,129,0.18)" stroke-width="1"/>
    <text x="509" y="538" font-size="18" font-weight="900" fill="#34d399">UTF-8</text>
    <text x="509" y="556" fill="rgba(255,255,255,0.38)">input encoding</text>

    <rect x="602" y="514" width="158" height="54" rx="8" fill="rgba(251,191,36,0.07)" stroke="rgba(251,191,36,0.18)" stroke-width="1"/>
    <text x="681" y="538" font-size="18" font-weight="900" fill="#fbbf24">RFC 4648</text>
    <text x="681" y="556" fill="rgba(255,255,255,0.38)">standard</text>
  </g>

  <!-- Clear / Download row -->
  <rect x="80" y="580" width="200" height="30" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="180" y="599" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.3)">Clear All</text>
  <rect x="292" y="580" width="200" height="30" rx="8" fill="rgba(124,58,237,0.12)" stroke="rgba(124,58,237,0.25)" stroke-width="1"/>
  <text x="392" y="599" text-anchor="middle" font-size="11" fill="rgba(167,139,250,0.7)">Download .txt</text>

  <!-- Laptop base -->
  <rect x="48" y="650" width="1104" height="16" rx="5" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="460" y="664" width="280" height="10" rx="5" fill="rgba(255,255,255,0.025)"/>
</svg>
