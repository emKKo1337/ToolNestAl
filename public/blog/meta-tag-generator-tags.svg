<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <radialGradient id="gL" cx="20%" cy="50%" r="55%"><stop offset="0%" stop-color="#5b21b6" stop-opacity="0.25"/><stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#818cf8"/></linearGradient>
    <linearGradient id="bG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient>
    <linearGradient id="cG" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0d0824"/><stop offset="100%" stop-color="#080516"/></linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#5b21b6" flood-opacity="0.3"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="900" height="560" fill="url(#bg)"/>
  <ellipse cx="180" cy="280" rx="400" ry="340" fill="url(#gL)"/>

  <text x="450" y="38" text-anchor="middle" font-size="21" font-weight="900" fill="url(#aG)" filter="url(#glow)">Essential HTML Meta Tags Explained</text>
  <text x="450" y="57" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.42)">Every tag your pages need — what it does and exactly how to write it</text>

  <!-- Tag 1: Title -->
  <rect x="28" y="72" width="412" height="106" rx="10" fill="rgba(255,255,255,0.025)" stroke="rgba(124,58,237,0.22)" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="28" y="72" width="412" height="28" rx="10" fill="rgba(124,58,237,0.2)"/>
  <rect x="28" y="88" width="412" height="12" fill="rgba(124,58,237,0.2)"/>
  <text x="44" y="90" font-size="10" font-weight="800" fill="rgba(255,255,255,0.9)">&lt;title&gt; — Title Tag</text>
  <rect x="28" y="72" width="56" height="28" rx="10" fill="rgba(34,197,94,0.2)"/>
  <rect x="28" y="88" width="56" height="12" fill="rgba(34,197,94,0.2)"/>
  <text x="56" y="91" text-anchor="middle" font-size="8" font-weight="700" fill="rgba(34,197,94,0.9)">Critical</text>
  <text x="44" y="114" font-size="8" fill="rgba(255,255,255,0.55)">Shows in browser tabs and Google search results. 50–60 characters.</text>
  <text x="44" y="128" font-size="8" fill="rgba(255,255,255,0.45)">Include your primary keyword near the start. Each page needs a unique title.</text>
  <rect x="38" y="138" width="392" height="30" rx="6" fill="url(#cG)" stroke="rgba(124,58,237,0.15)" stroke-width="1"/>
  <text x="48" y="155" font-size="8" font-family="monospace" fill="rgba(96,165,250,0.85)">&lt;title&gt;</text>
  <text x="96" y="155" font-size="8" font-family="monospace" fill="rgba(167,239,150,0.85)">Best AI Tools 2026 | Boost Productivity &amp; Save Time</text>
  <text x="390" y="155" font-size="8" font-family="monospace" fill="rgba(96,165,250,0.85)">&lt;/title&gt;</text>

  <!-- Tag 2: Meta Description -->
  <rect x="460" y="72" width="412" height="106" rx="10" fill="rgba(255,255,255,0.025)" stroke="rgba(124,58,237,0.22)" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="460" y="72" width="412" height="28" rx="10" fill="rgba(124,58,237,0.2)"/>
  <rect x="460" y="88" width="412" height="12" fill="rgba(124,58,237,0.2)"/>
  <text x="476" y="90" font-size="10" font-weight="800" fill="rgba(255,255,255,0.9)">meta description — Snippet Text</text>
  <rect x="460" y="72" width="56" height="28" rx="10" fill="rgba(34,197,94,0.2)"/>
  <rect x="460" y="88" width="56" height="12" fill="rgba(34,197,94,0.2)"/>
  <text x="488" y="91" text-anchor="middle" font-size="8" font-weight="700" fill="rgba(34,197,94,0.9)">Critical</text>
  <text x="476" y="114" font-size="8" fill="rgba(255,255,255,0.55)">The summary shown below your title in Google. 150–160 characters.</text>
  <text x="476" y="128" font-size="8" fill="rgba(255,255,255,0.45)">Write for the human reader first. Include your keyword naturally. Strong CTA helps CTR.</text>
  <rect x="470" y="138" width="392" height="30" rx="6" fill="url(#cG)" stroke="rgba(124,58,237,0.15)" stroke-width="1"/>
  <text x="480" y="151" font-size="7.5" font-family="monospace" fill="rgba(96,165,250,0.85)">&lt;meta name=</text><text x="544" y="151" font-size="7.5" font-family="monospace" fill="rgba(167,239,150,0.85)">"description"</text><text x="618" y="151" font-size="7.5" font-family="monospace" fill="rgba(96,165,250,0.85)"> content=</text>
  <text x="480" y="163" font-size="7.5" font-family="monospace" fill="rgba(167,239,150,0.85)">"Discover the best AI tools to boost productivity in 2026..."</text><text x="822" y="163" font-size="7.5" font-family="monospace" fill="rgba(96,165,250,0.85)">/&gt;</text>

  <!-- Tag 3: Robots -->
  <rect x="28" y="190" width="280" height="106" rx="10" fill="rgba(255,255,255,0.025)" stroke="rgba(37,99,235,0.22)" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="28" y="190" width="280" height="28" rx="10" fill="rgba(37,99,235,0.18)"/>
  <rect x="28" y="206" width="280" height="12" fill="rgba(37,99,235,0.18)"/>
  <text x="44" y="208" font-size="10" font-weight="800" fill="rgba(255,255,255,0.9)">meta robots — Crawl Directives</text>
  <text x="44" y="232" font-size="8" fill="rgba(255,255,255,0.55)">Tells search engines whether to index and follow links.</text>
  <text x="44" y="246" font-size="8" fill="rgba(255,255,255,0.45)">Default is index, follow. Use noindex for thin pages.</text>
  <rect x="38" y="256" width="260" height="30" rx="6" fill="url(#cG)" stroke="rgba(37,99,235,0.15)" stroke-width="1"/>
  <text x="48" y="269" font-size="7.5" font-family="monospace" fill="rgba(96,165,250,0.85)">&lt;meta name=</text><text x="110" y="269" font-size="7.5" font-family="monospace" fill="rgba(167,239,150,0.85)">"robots"</text>
  <text x="48" y="281" font-size="7.5" font-family="monospace" fill="rgba(96,165,250,0.85)"> content=</text><text x="104" y="281" font-size="7.5" font-family="monospace" fill="rgba(167,239,150,0.85)">"index, follow"</text><text x="200" y="281" font-size="7.5" font-family="monospace" fill="rgba(96,165,250,0.85)">/&gt;</text>

  <!-- Tag 4: Canonical -->
  <rect x="318" y="190" width="574" height="106" rx="10" fill="rgba(255,255,255,0.025)" stroke="rgba(37,99,235,0.22)" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="318" y="190" width="574" height="28" rx="10" fill="rgba(37,99,235,0.18)"/>
  <rect x="318" y="206" width="574" height="12" fill="rgba(37,99,235,0.18)"/>
  <text x="334" y="208" font-size="10" font-weight="800" fill="rgba(255,255,255,0.9)">link canonical — Duplicate Content Prevention</text>
  <text x="334" y="232" font-size="8" fill="rgba(255,255,255,0.55)">Points Google to the preferred version of a page. Prevents duplicate content penalties when</text>
  <text x="334" y="246" font-size="8" fill="rgba(255,255,255,0.45)">the same content lives at multiple URLs (e.g. with UTM params, pagination, or HTTPS variants).</text>
  <rect x="328" y="256" width="554" height="30" rx="6" fill="url(#cG)" stroke="rgba(37,99,235,0.15)" stroke-width="1"/>
  <text x="338" y="269" font-size="7.5" font-family="monospace" fill="rgba(96,165,250,0.85)">&lt;link rel=</text><text x="390" y="269" font-size="7.5" font-family="monospace" fill="rgba(167,239,150,0.85)">"canonical"</text><text x="449" y="269" font-size="7.5" font-family="monospace" fill="rgba(96,165,250,0.85)"> href=</text><text x="482" y="269" font-size="7.5" font-family="monospace" fill="rgba(167,239,150,0.85)">"https://www.yoursite.com/best-ai-tools-2026"</text><text x="730" y="269" font-size="7.5" font-family="monospace" fill="rgba(96,165,250,0.85)">/&gt;</text>
  <text x="338" y="281" font-size="7.5" fill="rgba(255,255,255,0.3)">← always point to the clean, full URL of the current page</text>

  <!-- Tag 5: Open Graph -->
  <rect x="28" y="308" width="412" height="114" rx="10" fill="rgba(255,255,255,0.025)" stroke="rgba(245,158,11,0.22)" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="28" y="308" width="412" height="28" rx="10" fill="rgba(245,158,11,0.15)"/>
  <rect x="28" y="324" width="412" height="12" fill="rgba(245,158,11,0.15)"/>
  <text x="44" y="326" font-size="10" font-weight="800" fill="rgba(255,255,255,0.9)">og: tags — Open Graph (Social Sharing)</text>
  <text x="44" y="350" font-size="8" fill="rgba(255,255,255,0.55)">Controls how your page looks when shared on Facebook, LinkedIn and WhatsApp.</text>
  <text x="44" y="364" font-size="8" fill="rgba(255,255,255,0.45)">og:title, og:description, og:image and og:url are the four essential properties.</text>
  <rect x="38" y="374" width="392" height="38" rx="6" fill="url(#cG)" stroke="rgba(245,158,11,0.12)" stroke-width="1"/>
  <text x="48" y="387" font-size="7.5" font-family="monospace" fill="rgba(96,165,250,0.85)">&lt;meta property=</text><text x="132" y="387" font-size="7.5" font-family="monospace" fill="rgba(167,239,150,0.85)">"og:title"</text><text x="182" y="387" font-size="7.5" font-family="monospace" fill="rgba(96,165,250,0.85)"> content=</text><text x="232" y="387" font-size="7.5" font-family="monospace" fill="rgba(167,239,150,0.85)">"Best AI Tools 2026"</text><text x="332" y="387" font-size="7.5" font-family="monospace" fill="rgba(96,165,250,0.85)">/&gt;</text>
  <text x="48" y="403" font-size="7.5" font-family="monospace" fill="rgba(96,165,250,0.85)">&lt;meta property=</text><text x="132" y="403" font-size="7.5" font-family="monospace" fill="rgba(167,239,150,0.85)">"og:image"</text><text x="183" y="403" font-size="7.5" font-family="monospace" fill="rgba(96,165,250,0.85)"> content=</text><text x="232" y="403" font-size="7.5" font-family="monospace" fill="rgba(167,239,150,0.85)">"https://yoursite.com/og.png"</text><text x="390" y="403" font-size="7.5" font-family="monospace" fill="rgba(96,165,250,0.85)">/&gt;</text>

  <!-- Tag 6: Twitter Card -->
  <rect x="460" y="308" width="412" height="114" rx="10" fill="rgba(255,255,255,0.025)" stroke="rgba(96,165,250,0.22)" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="460" y="308" width="412" height="28" rx="10" fill="rgba(37,99,235,0.15)"/>
  <rect x="460" y="324" width="412" height="12" fill="rgba(37,99,235,0.15)"/>
  <text x="476" y="326" font-size="10" font-weight="800" fill="rgba(255,255,255,0.9)">twitter: tags — Twitter / X Cards</text>
  <text x="476" y="350" font-size="8" fill="rgba(255,255,255,0.55)">Controls how your page looks when shared on X (formerly Twitter).</text>
  <text x="476" y="364" font-size="8" fill="rgba(255,255,255,0.45)">Use summary_large_image for blog posts. Falls back to og: tags if not set.</text>
  <rect x="470" y="374" width="392" height="38" rx="6" fill="url(#cG)" stroke="rgba(37,99,235,0.12)" stroke-width="1"/>
  <text x="480" y="387" font-size="7.5" font-family="monospace" fill="rgba(96,165,250,0.85)">&lt;meta name=</text><text x="540" y="387" font-size="7.5" font-family="monospace" fill="rgba(167,239,150,0.85)">"twitter:card"</text><text x="608" y="387" font-size="7.5" font-family="monospace" fill="rgba(96,165,250,0.85)"> content=</text><text x="657" y="387" font-size="7.5" font-family="monospace" fill="rgba(167,239,150,0.85)">"summary_large_image"</text><text x="792" y="387" font-size="7.5" font-family="monospace" fill="rgba(96,165,250,0.85)">/&gt;</text>
  <text x="480" y="403" font-size="7.5" font-family="monospace" fill="rgba(96,165,250,0.85)">&lt;meta name=</text><text x="540" y="403" font-size="7.5" font-family="monospace" fill="rgba(167,239,150,0.85)">"twitter:title"</text><text x="611" y="403" font-size="7.5" font-family="monospace" fill="rgba(96,165,250,0.85)"> content=</text><text x="660" y="403" font-size="7.5" font-family="monospace" fill="rgba(167,239,150,0.85)">"Best AI Tools 2026"</text><text x="773" y="403" font-size="7.5" font-family="monospace" fill="rgba(96,165,250,0.85)">/&gt;</text>

  <!-- Tag 7: Charset + Viewport -->
  <rect x="28" y="434" width="280" height="96" rx="10" fill="rgba(255,255,255,0.025)" stroke="rgba(16,185,129,0.2)" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="28" y="434" width="280" height="28" rx="10" fill="rgba(16,185,129,0.14)"/>
  <rect x="28" y="450" width="280" height="12" fill="rgba(16,185,129,0.14)"/>
  <text x="44" y="452" font-size="10" font-weight="800" fill="rgba(255,255,255,0.9)">charset + viewport</text>
  <text x="44" y="476" font-size="8" fill="rgba(255,255,255,0.55)">charset="UTF-8" ensures correct character rendering.</text>
  <text x="44" y="490" font-size="8" fill="rgba(255,255,255,0.45)">viewport makes pages mobile-responsive — required for Google.</text>
  <rect x="38" y="500" width="260" height="22" rx="6" fill="url(#cG)" stroke="rgba(16,185,129,0.1)" stroke-width="1"/>
  <text x="48" y="515" font-size="7.5" font-family="monospace" fill="rgba(96,165,250,0.85)">&lt;meta charset=</text><text x="124" y="515" font-size="7.5" font-family="monospace" fill="rgba(167,239,150,0.85)">"UTF-8"</text><text x="162" y="515" font-size="7.5" font-family="monospace" fill="rgba(96,165,250,0.85)">/&gt;  &lt;meta name=</text><text x="244" y="515" font-size="7.5" font-family="monospace" fill="rgba(167,239,150,0.85)">"viewport"</text><text x="295" y="515" font-size="7.5" font-family="monospace" fill="rgba(96,165,250,0.85)">...</text>

  <!-- Tag 8: hreflang -->
  <rect x="318" y="434" width="574" height="96" rx="10" fill="rgba(255,255,255,0.025)" stroke="rgba(236,72,153,0.18)" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="318" y="434" width="574" height="28" rx="10" fill="rgba(236,72,153,0.12)"/>
  <rect x="318" y="450" width="574" height="12" fill="rgba(236,72,153,0.12)"/>
  <text x="334" y="452" font-size="10" font-weight="800" fill="rgba(255,255,255,0.9)">hreflang — International SEO</text>
  <text x="334" y="476" font-size="8" fill="rgba(255,255,255,0.55)">Tells Google which language/region version of a page to show to which audience. Essential for multilingual sites.</text>
  <text x="334" y="490" font-size="8" fill="rgba(255,255,255,0.45)">Without hreflang, Google may show the wrong language version to the wrong audience — harming CTR and rankings.</text>
  <rect x="328" y="500" width="554" height="22" rx="6" fill="url(#cG)" stroke="rgba(236,72,153,0.1)" stroke-width="1"/>
  <text x="338" y="515" font-size="7.5" font-family="monospace" fill="rgba(96,165,250,0.85)">&lt;link rel=</text><text x="386" y="515" font-size="7.5" font-family="monospace" fill="rgba(167,239,150,0.85)">"alternate"</text><text x="435" y="515" font-size="7.5" font-family="monospace" fill="rgba(96,165,250,0.85)"> hreflang=</text><text x="490" y="515" font-size="7.5" font-family="monospace" fill="rgba(167,239,150,0.85)">"en-US"</text><text x="528" y="515" font-size="7.5" font-family="monospace" fill="rgba(96,165,250,0.85)"> href=</text><text x="556" y="515" font-size="7.5" font-family="monospace" fill="rgba(167,239,150,0.85)">"https://yoursite.com/en-us/page"</text><text x="720" y="515" font-size="7.5" font-family="monospace" fill="rgba(96,165,250,0.85)">/&gt;</text>

  <text x="450" y="546" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.28)">toolnestai.net/seo-tools/meta-tag-generator — Generate all these tags in seconds, free</text>
</svg>
