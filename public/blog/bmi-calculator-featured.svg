<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="30%" cy="40%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <radialGradient id="gL" cx="15%" cy="50%" r="55%"><stop offset="0%" stop-color="#5b21b6" stop-opacity="0.45"/><stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/></radialGradient>
    <radialGradient id="gR" cx="85%" cy="50%" r="55%"><stop offset="0%" stop-color="#0e7490" stop-opacity="0.28"/><stop offset="100%" stop-color="#0e7490" stop-opacity="0"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="bG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient>
    <linearGradient id="lapG" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1a1040"/><stop offset="100%" stop-color="#0d0824"/></linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#5b21b6" flood-opacity="0.5"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="180" cy="315" rx="600" ry="500" fill="url(#gL)"/>
  <ellipse cx="1020" cy="315" rx="600" ry="500" fill="url(#gR)"/>

  <text x="60" y="70" font-size="14" font-weight="700" fill="url(#aG)" filter="url(#glow)">ToolNest AI</text>
  <text x="60" y="106" font-size="13" fill="rgba(255,255,255,0.35)">Calculators › BMI Calculator</text>
  <text x="60" y="185" font-size="52" font-weight="900" fill="url(#aG)" filter="url(#glow)">BMI</text>
  <text x="60" y="245" font-size="52" font-weight="900" fill="url(#aG)" filter="url(#glow)">Calculator</text>
  <text x="60" y="300" font-size="18" fill="rgba(255,255,255,0.6)">Metric &amp; imperial units</text>
  <text x="60" y="328" font-size="18" fill="rgba(255,255,255,0.6)">WHO categories — Free, instant</text>

  <rect x="60" y="358" width="110" height="52" rx="8" fill="rgba(124,58,237,0.2)" stroke="rgba(124,58,237,0.4)" stroke-width="1"/>
  <text x="115" y="382" text-anchor="middle" font-size="14" font-weight="900" fill="#a78bfa">WHO</text>
  <text x="115" y="400" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">standard ranges</text>

  <rect x="182" y="358" width="110" height="52" rx="8" fill="rgba(14,116,144,0.15)" stroke="rgba(14,116,144,0.35)" stroke-width="1"/>
  <text x="237" y="382" text-anchor="middle" font-size="18" font-weight="900" fill="#67e8f9">4</text>
  <text x="237" y="400" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">categories</text>

  <rect x="304" y="358" width="110" height="52" rx="8" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
  <text x="359" y="382" text-anchor="middle" font-size="16" font-weight="900" fill="#34d399">kg/lb</text>
  <text x="359" y="400" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">cm/ft-in</text>

  <rect x="426" y="358" width="110" height="52" rx="8" fill="rgba(251,191,36,0.1)" stroke="rgba(251,191,36,0.25)" stroke-width="1"/>
  <text x="481" y="382" text-anchor="middle" font-size="20" font-weight="900" fill="#fbbf24">Free</text>
  <text x="481" y="400" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">no account</text>

  <text x="60" y="560" font-size="14" fill="rgba(255,255,255,0.25)">toolnestai.net/calculators/bmi-calculator</text>

  <!-- Right: Laptop with BMI calculator UI -->
  <rect x="630" y="60" width="530" height="490" rx="16" fill="url(#lapG)" stroke="rgba(124,58,237,0.3)" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="630" y="60" width="530" height="36" rx="16" fill="rgba(255,255,255,0.05)"/>
  <rect x="630" y="78" width="530" height="18" fill="rgba(255,255,255,0.02)"/>
  <circle cx="655" cy="78" r="6" fill="rgba(239,68,68,0.6)"/>
  <circle cx="675" cy="78" r="6" fill="rgba(251,191,36,0.6)"/>
  <circle cx="695" cy="78" r="6" fill="rgba(34,197,94,0.6)"/>

  <!-- Unit toggle -->
  <g font-size="10" text-anchor="middle">
    <rect x="642" y="106" width="100" height="26" rx="6" fill="url(#bG)"/>
    <text x="692" y="123" fill="#fff" font-weight="700">Metric</text>
    <rect x="748" y="106" width="100" height="26" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="798" y="123" fill="rgba(255,255,255,0.4)">Imperial</text>
  </g>

  <!-- Inputs -->
  <text x="650" y="156" font-size="8.5" font-weight="700" fill="rgba(255,255,255,0.3)">HEIGHT (cm)</text>
  <rect x="642" y="162" width="242" height="34" rx="8" fill="rgba(0,0,0,0.5)" stroke="rgba(124,58,237,0.4)" stroke-width="1.5"/>
  <text x="763" y="184" text-anchor="middle" font-family="monospace" font-size="14" fill="rgba(167,139,250,0.9)">175 cm</text>
  <text x="906" y="156" font-size="8.5" font-weight="700" fill="rgba(255,255,255,0.3)">WEIGHT (kg)</text>
  <rect x="898" y="162" width="250" height="34" rx="8" fill="rgba(0,0,0,0.4)" stroke="rgba(103,232,249,0.3)" stroke-width="1.5"/>
  <text x="1023" y="184" text-anchor="middle" font-family="monospace" font-size="14" fill="rgba(103,232,249,0.85)">72 kg</text>

  <!-- Big result -->
  <rect x="642" y="208" width="506" height="86" rx="10" fill="rgba(52,211,153,0.1)" stroke="rgba(52,211,153,0.25)" stroke-width="1.5"/>
  <text x="895" y="252" text-anchor="middle" font-size="40" font-weight="900" fill="#34d399">23.5</text>
  <text x="895" y="276" text-anchor="middle" font-size="15" font-weight="700" fill="#6ee7b7">Normal weight</text>
  <text x="895" y="290" text-anchor="middle" font-size="8.5" fill="rgba(255,255,255,0.3)">WHO range: 18.5 – 24.9</text>

  <!-- Scale bar -->
  <text x="650" y="316" font-size="8.5" font-weight="700" fill="rgba(255,255,255,0.3)">BMI SCALE</text>
  <rect x="642" y="322" width="506" height="20" rx="4" fill="rgba(59,130,246,0.5)"/>
  <rect x="642" y="322" width="115" height="20" fill="rgba(59,130,246,0.7)"/>
  <rect x="757" y="322" width="145" height="20" fill="rgba(52,211,153,0.7)"/>
  <rect x="902" y="322" width="115" height="20" fill="rgba(251,191,36,0.7)"/>
  <rect x="1017" y="322" width="131" height="20" fill="rgba(239,68,68,0.7)"/>
  <circle cx="850" cy="332" r="6" fill="#fff" stroke="#0a0118" stroke-width="2"/>
  <g font-size="7.5" text-anchor="middle" fill="rgba(255,255,255,0.5)">
    <text x="700" y="356">Underweight</text>
    <text x="830" y="356">Normal</text>
    <text x="960" y="356">Overweight</text>
    <text x="1082" y="356">Obese</text>
  </g>

  <!-- Category ranges -->
  <text x="650" y="382" font-size="8.5" font-weight="700" fill="rgba(255,255,255,0.3)">WHO CATEGORIES</text>
  <rect x="642" y="388" width="506" height="76" rx="7" fill="rgba(255,255,255,0.025)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="658" y="406" font-size="9.5" fill="rgba(59,130,246,0.85)">Underweight — below 18.5</text>
  <text x="658" y="422" font-size="9.5" fill="rgba(52,211,153,0.85)">Normal weight — 18.5 to 24.9</text>
  <text x="658" y="438" font-size="9.5" fill="rgba(251,191,36,0.85)">Overweight — 25.0 to 29.9</text>
  <text x="658" y="454" font-size="9.5" fill="rgba(239,68,68,0.85)">Obese — 30.0 and above</text>

  <rect x="620" y="550" width="560" height="14" rx="4" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="760" y="562" width="260" height="8" rx="4" fill="rgba(255,255,255,0.03)"/>
</svg>
