<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="80%"><stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#05030d"/></radialGradient>
    <radialGradient id="gC" cx="50%" cy="40%" r="60%"><stop offset="0%" stop-color="#5b21b6" stop-opacity="0.2"/><stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/></radialGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="hueG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0000"/>
      <stop offset="16.7%" stop-color="#ffff00"/>
      <stop offset="33.3%" stop-color="#00ff00"/>
      <stop offset="50%" stop-color="#00ffff"/>
      <stop offset="66.7%" stop-color="#0000ff"/>
      <stop offset="83.3%" stop-color="#ff00ff"/>
      <stop offset="100%" stop-color="#ff0000"/>
    </linearGradient>
    <linearGradient id="satG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#808080"/><stop offset="100%" stop-color="#7c3aed"/></linearGradient>
    <linearGradient id="litG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#000"/><stop offset="50%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#fff"/></linearGradient>
  </defs>
  <rect width="900" height="460" fill="url(#bg)"/>
  <ellipse cx="450" cy="230" rx="520" ry="320" fill="url(#gC)"/>
  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="900" fill="url(#aG)">HSL Color Space — Hue, Saturation, Lightness</text>
  <text x="450" y="54" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.38)">Why designers prefer HSL for building color palettes and design systems</text>
  <!-- Hue wheel section -->
  <rect x="28" y="72" width="835" height="38" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="450" y="95" text-anchor="middle" font-size="10" font-weight="700" fill="rgba(167,139,250,0.8)">HUE — the color angle (0°–360° around the color wheel)</text>
  <rect x="28" y="116" width="835" height="28" rx="6" fill="url(#hueG)"/>
  <g font-size="9" text-anchor="middle">
    <text x="28" y="158" fill="rgba(239,68,68,0.8)">0° Red</text>
    <text x="168" y="158" fill="rgba(234,179,8,0.8)">60° Yellow</text>
    <text x="308" y="158" fill="rgba(34,197,94,0.8)">120° Green</text>
    <text x="448" y="158" fill="rgba(6,182,212,0.8)">180° Cyan</text>
    <text x="588" y="158" fill="rgba(99,102,241,0.8)">240° Blue</text>
    <text x="728" y="158" fill="rgba(217,70,239,0.8)">300° Magenta</text>
    <text x="863" y="158" fill="rgba(239,68,68,0.8)">360°</text>
  </g>
  <!-- Saturation -->
  <text x="450" y="188" text-anchor="middle" font-size="10" font-weight="700" fill="rgba(167,139,250,0.8)">SATURATION — color intensity (0% grey → 100% vivid)</text>
  <rect x="28" y="196" width="835" height="24" rx="6" fill="url(#satG)"/>
  <g font-size="9" text-anchor="middle">
    <text x="28" y="236" fill="rgba(255,255,255,0.5)">0% (grey)</text>
    <text x="450" y="236" fill="rgba(255,255,255,0.5)">50% (muted)</text>
    <text x="863" y="236" fill="rgba(167,139,250,0.8)">100% (vivid)</text>
  </g>
  <!-- Lightness -->
  <text x="450" y="256" text-anchor="middle" font-size="10" font-weight="700" fill="rgba(167,139,250,0.8)">LIGHTNESS — brightness (0% black → 50% normal → 100% white)</text>
  <rect x="28" y="264" width="835" height="24" rx="6" fill="url(#litG)"/>
  <g font-size="9" text-anchor="middle">
    <text x="28" y="304" fill="rgba(255,255,255,0.5)">0% (black)</text>
    <text x="450" y="304" fill="rgba(167,139,250,0.8)">50% (normal)</text>
    <text x="863" y="304" fill="rgba(255,255,255,0.5)">100% (white)</text>
  </g>
  <!-- Why HSL is great for design -->
  <rect x="28" y="318" width="835" height="90" rx="8" fill="rgba(52,211,153,0.05)" stroke="rgba(52,211,153,0.14)" stroke-width="1"/>
  <text x="450" y="340" text-anchor="middle" font-size="10" font-weight="700" fill="rgba(52,211,153,0.8)">WHY DESIGNERS PREFER HSL</text>
  <text x="450" y="362" text-anchor="middle" font-size="9.5" fill="rgba(255,255,255,0.55)">To create a lighter shade: increase lightness (50% → 70%). Darker: decrease lightness (50% → 30%).</text>
  <text x="450" y="382" text-anchor="middle" font-size="9.5" fill="rgba(255,255,255,0.55)">To make a muted/pastel: decrease saturation. To get a complementary color: shift hue by 180°.</text>
  <text x="450" y="402" text-anchor="middle" font-size="9.5" fill="rgba(255,255,255,0.55)">All of this is intuitive in HSL — the same logic in RGB requires adjusting three numbers at once.</text>
  <text x="450" y="444" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.2)">toolnestai.net/image-tools/image-color-picker</text>
</svg>
