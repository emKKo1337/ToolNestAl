  <rect x="640" y="426" width="506" height="20" rx="4" fill="rgba(255,255,255,0.02)"/>
  <text x="893" y="440" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.3)">2,000+ years old — from Cicero's 45 BC Latin essay</text>

  <rect x="620" y="550" width="560" height="14" rx="4" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="760" y="562" width="260" height="8" rx="4" fill="rgba(255,255,255,0.03)"/>
