  <text x="60" y="300" font-size="18" fill="rgba(255,255,255,0.6)">Paragraphs, sentences, words, lists</text>
  <text x="60" y="328" font-size="18" fill="rgba(255,255,255,0.6)">Classic Latin placeholder text — Free</text>

  <rect x="60" y="358" width="110" height="52" rx="8" fill="rgba(124,58,237,0.2)" stroke="rgba(124,58,237,0.4)" stroke-width="1"/>
