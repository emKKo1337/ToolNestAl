  <text x="115" y="400" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">Cicero's Latin</text>

  <rect x="182" y="358" width="110" height="52" rx="8" fill="rgba(14,116,144,0.15)" stroke="rgba(14,116,144,0.35)" stroke-width="1"/>
  <text x="237" y="382" text-anchor="middle" font-size="18" font-weight="900" fill="#67e8f9">4 modes</text>
  <text x="237" y="400" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">para/sent/word/list</text>

  <rect x="304" y="358" width="110" height="52" rx="8" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
  <text x="359" y="382" text-anchor="middle" font-size="16" font-weight="900" fill="#34d399">HTML</text>
  <text x="359" y="400" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">export ready</text>

  <rect x="426" y="358" width="110" height="52" rx="8" fill="rgba(251,191,36,0.1)" stroke="rgba(251,191,36,0.25)" stroke-width="1"/>
  <text x="481" y="382" text-anchor="middle" font-size="20" font-weight="900" fill="#fbbf24">Free</text>
  <text x="481" y="400" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">no account</text>

  <text x="60" y="560" font-size="14" fill="rgba(255,255,255,0.25)">toolnestai.net/text-tools/lorem-ipsum-generator</text>

  <rect x="630" y="60" width="530" height="490" rx="16" fill="url(#lapG)" stroke="rgba(124,58,237,0.3)" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="630" y="60" width="530" height="36" rx="16" fill="rgba(255,255,255,0.05)"/>
  <rect x="630" y="78" width="530" height="18" fill="rgba(255,255,255,0.02)"/>
  <circle cx="655" cy="78" r="6" fill="rgba(239,68,68,0.6)"/>
  <circle cx="675" cy="78" r="6" fill="rgba(251,191,36,0.6)"/>
  <circle cx="695" cy="78" r="6" fill="rgba(34,197,94,0.6)"/>

  <text x="648" y="122" font-size="8.5" font-weight="700" fill="rgba(255,255,255,0.3)">GENERATED TEXT</text>
  <rect x="640" y="128" width="506" height="230" rx="9" fill="rgba(0,0,0,0.35)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="656" y="150" font-size="10.5" fill="rgba(255,255,255,0.6)">Lorem ipsum dolor sit amet, consectetur</text>
  <text x="656" y="168" font-size="10.5" fill="rgba(255,255,255,0.6)">adipiscing elit. Sed do eiusmod tempor</text>
  <text x="656" y="186" font-size="10.5" fill="rgba(255,255,255,0.6)">incididunt ut labore et dolore magna aliqua.</text>
  <text x="656" y="212" font-size="10.5" fill="rgba(255,255,255,0.6)">Ut enim ad minim veniam, quis nostrud</text>
  <text x="656" y="230" font-size="10.5" fill="rgba(255,255,255,0.6)">exercitation ullamco laboris nisi ut aliquip</text>
  <text x="656" y="248" font-size="10.5" fill="rgba(255,255,255,0.6)">ex ea commodo consequat.</text>
  <text x="656" y="274" font-size="10.5" fill="rgba(255,255,255,0.6)">Duis aute irure dolor in reprehenderit in</text>
  <text x="656" y="292" font-size="10.5" fill="rgba(255,255,255,0.6)">voluptate velit esse cillum dolore eu fugiat</text>
  <text x="656" y="310" font-size="10.5" fill="rgba(255,255,255,0.6)">nulla pariatur.</text>
  <text x="656" y="336" font-size="10.5" fill="rgba(255,255,255,0.6)">Excepteur sint occaecat cupidatat non</text>
  <text x="656" y="352" font-size="10.5" fill="rgba(255,255,255,0.6)">proident, sunt in culpa qui officia deserunt.</text>

  <g text-anchor="middle" font-size="9">
    <rect x="640" y="374" width="163" height="42" rx="7" fill="rgba(124,58,237,0.1)" stroke="rgba(124,58,237,0.22)" stroke-width="1"/>
    <text x="721" y="396" font-size="14" font-weight="900" fill="#a78bfa">3</text>
    <text x="721" y="410" fill="rgba(255,255,255,0.4)">paragraphs</text>

    <rect x="811" y="374" width="163" height="42" rx="7" fill="rgba(14,116,144,0.08)" stroke="rgba(14,116,144,0.2)" stroke-width="1"/>
    <text x="892" y="396" font-size="14" font-weight="900" fill="#67e8f9">187</text>
    <text x="892" y="410" fill="rgba(255,255,255,0.4)">words</text>

    <rect x="983" y="374" width="163" height="42" rx="7" fill="rgba(16,185,129,0.07)" stroke="rgba(16,185,129,0.18)" stroke-width="1"/>
    <text x="1064" y="396" font-size="12" font-weight="900" fill="#34d399">1,142</text>
    <text x="1064" y="410" fill="rgba(255,255,255,0.4)">characters</text>
